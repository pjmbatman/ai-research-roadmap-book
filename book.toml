# 책 전체의 메타데이터와 분류 체계.
# scripts/book.py가 이 파일을 읽어 frontmatter·퀴즈·로드맵 규칙을 검증하고 OUTLINE.md를 만든다.
# 설계 근거: editorial/roadmap-design.md

[book]
title = "AI for Science 로드맵"                 # 가제(working title)
subtitle = "과학 문제를 AI로 정의하고, 검증하고, 재현 가능하게 전달하는 연구자를 위한 오픈소스 로드맵"
language = "ko"
repository = "https://github.com/pjmbatman/ai-research-roadmap-book"

# ---------------------------------------------------------------------------
# 레이어: 트랙 사이의 의존 방향.
# 규칙(check가 검증): 장의 선수 지식은 같은 레이어 또는 더 낮은 레이어의 트랙에만 있을 수 있다.
# 레이어는 '언제 배우는가'가 아니라 '무엇에 기대는가'다. 학습 시점은 학습 경로(단계)가 정한다.
[[layers]]
level = 0
name = "입문"
name_en = "Entry"
description = "어떤 선수 지식도 요구하지 않는 출발점"

[[layers]]
level = 1
name = "기반"
name_en = "Foundations"
description = "서로 병행해 배우는 네 기반 역량. 다른 기반 트랙에만 기댄다"

[[layers]]
level = 2
name = "핵심"
name_en = "Core"
description = "기반을 결합해 학습 시스템 전체를 다루는 역량"

[[layers]]
level = 3
name = "확장"
name_en = "Extension"
description = "핵심 위에서 모델링의 폭과 실험의 규모를 넓히는 역량"

[[layers]]
level = 4
name = "방법론"
name_en = "Methods"
description = "ML을 연구 방법과 과학적 모델링의 방법으로 확장"

[[layers]]
level = 5
name = "응용"
name_en = "Applications"
description = "방법론을 과학 분야별 문제에 적용"

[[layers]]
level = 6
name = "통합"
name_en = "Integration"
description = "여러 트랙을 하나의 연구 산출물로 통합하고 커뮤니티에 기여"

[[layers]]
level = 9
name = "참고"
name_en = "Reference"
description = "찾아보는 자료. 선수 지식이 될 수 없다"

# ---------------------------------------------------------------------------
# 평가 방식: 트랙과 장이 사용하는 통과 확인 수단.
[assessments]
quiz = "개념 퀴즈"          # 객관식·복수 선택·수치 입력. 장의 quiz.toml
code = "코드 실습"          # 학습자의 브라우저(Pyodide) 또는 로컬 Python 런타임에서 실행, 테스트로 즉시 채점
terminal = "터미널 실습"    # 학습자 자신의 터미널에서 수행, 검사 스크립트로 확인
document = "문서 산출물"    # 문제 정의서·계획서·보고서. 루브릭 기반 리뷰
review = "동료 리뷰"        # 코드·실험·발표에 대한 사람의 리뷰(스터디·커뮤니티·지도교수)

# ---------------------------------------------------------------------------
# 트랙: 하나의 역량 영역 = 하나의 핵심 질문 + 주된 평가 방식 + 졸업 과제.
# 이름 규칙(editorial/roadmap-design.md §3):
#   key  = 영어 kebab-case (frontmatter의 track 값, URL)
#   code = 영문 대문자 3자 (UI 배지, 짧은 참조)
#   name = 한국어 분야명(명사구), name_en = 학계·산업에서 통용되는 분야명
# 배열 순서 = 레이어 오름차순 = content/ 부 번호 순서 (check가 검증).

[[tracks]]
key = "orientation"
code = "ORI"
name = "오리엔테이션"
name_en = "Orientation"
layer = 0
question = "AI 연구란 무엇이고, AI for Science는 어떤 지형인가?"
outcome = "자신의 연구 문제를 입력·출력·가정·평가로 정의하고, 학습 경로를 세운다"
assessment = ["quiz", "document"]
capstone = "한 장짜리 문제 정의서와 3개월 학습 계획"

[[tracks]]
key = "research-infrastructure"
code = "INF"
name = "연구 인프라"
name_en = "Research Infrastructure"
layer = 1
question = "코드는 어디에서, 어떤 환경으로 실행되는가?"
outcome = "로컬·원격 GPU 서버에서 재현 가능한 환경을 구성하고, 장애를 스스로 진단한다"
assessment = ["terminal", "quiz"]
capstone = "새 서버에서 lockfile·컨테이너로 학습 환경을 구성하고 smoke test 통과"

[[tracks]]
key = "research-software-engineering"
code = "RSE"
name = "연구 소프트웨어 공학"
name_en = "Research Software Engineering"
layer = 1
question = "수식과 아이디어를 어떻게 정확하고 유지 가능한 코드로 옮기는가?"
outcome = "설정·CLI·테스트·문서를 갖춘 연구 프로젝트를 만들고 협업한다"
assessment = ["code", "review"]
capstone = "config·CLI·테스트·CI를 갖춘 연구 프로젝트 템플릿"

[[tracks]]
key = "mathematical-foundations"
code = "MTH"
name = "수리 기초"
name_en = "Mathematical Foundations"
layer = 1
question = "모델과 학습은 어떤 공간에서, 어떤 계산으로 이루어지는가?"
outcome = "선형대수·미분·수치해석·최적화로 모델과 학습 알고리즘을 유도하고 구현한다"
assessment = ["quiz", "code"]
capstone = "자동미분 엔진과 optimizer를 직접 구현해 MLP를 학습하고 수치미분으로 검증"

[[tracks]]
key = "probabilistic-inference"
code = "PSI"
name = "확률·통계적 추론"
name_en = "Probabilistic and Statistical Inference"
layer = 1
question = "불확실한 데이터에서 무엇을, 얼마나 확신하며 추론할 수 있는가?"
outcome = "문제를 분포로 정의하고, 추정·검정·베이지안 추론·일반화를 근거로 결론을 낸다"
assessment = ["quiz", "code"]
capstone = "같은 회귀 문제를 MLE·MAP·베이지안·GP로 풀고 예측분포를 비교한 보고서"

[[tracks]]
key = "ml-core"
code = "MLC"
name = "머신러닝 핵심"
name_en = "Machine Learning Core"
layer = 2
question = "데이터에서 신뢰할 수 있는 예측 모델을 어떻게 만들고 평가하는가?"
outcome = "누수 없는 데이터 파이프라인과 강한 baseline 위에서 딥러닝 모델을 학습·평가·재현한다"
assessment = ["code", "quiz"]
capstone = "공통 데이터셋으로 baseline부터 PyTorch 모델까지, 독립 평가 스크립트로 재현"

[[tracks]]
key = "ml-advanced"
code = "MLA"
name = "머신러닝 심화"
name_en = "Advanced Machine Learning"
layer = 3
question = "분포를 생성하고, 결정을 학습하고, 예측을 언제 믿을 수 있는가?"
outcome = "생성모델·강화학습·불확실성 정량화를 문제에 맞게 선택하고 평가한다"
assessment = ["code", "quiz"]
capstone = "확률적 예측 모델의 calibration·OOD 평가 보고서"

[[tracks]]
key = "ml-systems"
code = "MLS"
name = "머신러닝 시스템"
name_en = "Machine Learning Systems"
layer = 3
question = "실험을 어떻게 추적·재현하고, 더 크고 빠르게 돌리는가?"
outcome = "실험 추적·재현성·profiling·다중 GPU 학습으로 연구의 처리량과 신뢰를 높인다"
assessment = ["code", "terminal"]
capstone = "논문 표의 숫자에서 run·설정·데이터로 되돌아가고, DDP로 같은 결과를 재현"

[[tracks]]
key = "research-methodology"
code = "RES"
name = "연구 방법론"
name_en = "Research Methodology"
layer = 4
question = "무엇이 좋은 연구 질문이고, 주장을 어떻게 검증하고 전달하는가?"
outcome = "논문을 재현하고, 반증 가능한 실험을 설계하고, 주장과 근거가 맞는 논문을 쓴다"
assessment = ["quiz", "document", "review"]
capstone = "논문 재현 보고서와 독립 연구의 실험 계획서"

[[tracks]]
key = "scientific-ml"
code = "SML"
name = "과학 머신러닝"
name_en = "Scientific Machine Learning"
layer = 4
question = "물리 법칙·시뮬레이션·실험을 학습과 어떻게 결합하고, 발견의 순환에 넣는가?"
outcome = "물리 기반·하이브리드 모델, 역문제, 시뮬레이션 기반 추론, 실험 설계를 문제에 맞게 선택하고 검증한다"
assessment = ["code", "quiz"]
capstone = "같은 과학 문제에서 물리·데이터·하이브리드 모델을 정확도·물리적 일관성·계산 비용으로 비교"

[[tracks]]
key = "domain-applications"
code = "DOM"
name = "과학 분야별 응용"
name_en = "Domain Applications"
layer = 5
question = "각 과학 분야의 데이터·문제·평가 기준은 무엇이 다르고, 어디서 실패하는가?"
outcome = "선택한 분야의 데이터를 이해하고, 분야의 평가 기준과 누수 함정을 지키며 문제를 푼다"
assessment = ["code", "quiz", "document"]
capstone = "선택한 분야의 공개 데이터로 분야 표준 평가를 따르는 연구 결과와 재현 패키지"

[[tracks]]
key = "capstone"
code = "CAP"
name = "종합 프로젝트"
name_en = "Capstone Projects"
layer = 6
question = "배운 것을 하나의 공개 가능한 연구 산출물로 만들 수 있는가?"
outcome = "문제 정의부터 재현 패키지까지 독립적으로 수행하고, 결과를 오픈소스 커뮤니티에 공개한다"
assessment = ["document", "review"]
capstone = "논문 초안과 공개 재현 패키지(코드·데이터 카드·실행 환경)"

[[tracks]]
key = "reference"
code = "REF"
name = "참고 자료"
name_en = "Reference"
layer = 9
question = "필요할 때 무엇을 찾아보는가?"
outcome = "표기법·용어·공식·명령·템플릿을 빠르게 찾는다"
assessment = []
capstone = ""

# ---------------------------------------------------------------------------
# 난이도 등급: 장(Chapter)의 `tier` 값.
[tiers]
core = "필수"         # 모든 연구원이 설명하고 직접 수행할 수 있어야 하는 내용
advanced = "심화"     # 연구 주제에 따라 깊이 들어갈 내용
reference = "참조"    # 필요할 때 문서를 읽고 적용할 수 있으면 되는 내용

# 집필 상태: 부·장의 `status` 값. 이 순서대로 진행한다.
[statuses]
outline = "목차"      # 상세 목차(bullet)만 있음
draft = "초고"        # 본문 초고 작성 완료
review = "검토"       # 내용·코드 리뷰 진행 중
done = "완료"         # 리뷰 통과, 공개 가능
