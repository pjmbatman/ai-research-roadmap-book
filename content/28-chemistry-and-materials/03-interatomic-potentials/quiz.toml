# 28.3 기계학습 원자간 퍼텐셜 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "forces-from-energy"
type = "single"
objective = 1
prompt = '''많은 MLIP는 신경망이 스칼라 에너지 $E(\mathbf{R})$ 하나만 출력하게 하고, 힘은 $\mathbf{F}_i = -\partial E / \partial \mathbf{r}_i$로 자동미분해서 얻는다. 힘을 신경망의 별도 출력으로 직접 예측하는 대신 이렇게 하는 주된 이유는?'''
explanation = '''에너지를 미분해 힘을 얻으면, 그 힘은 정의상 어떤 에너지의 gradient(보존력)다. 보존력은 닫힌 경로를 돌 때 알짜 일이 0이라 MD에서 에너지가 체계적으로 새지 않는다. 힘을 직접 예측하면 더 빠를 수 있지만, 그 힘장이 어떤 에너지의 gradient라는 보장이 없어(비보존력일 수 있어) 긴 MD에서 에너지가 누적적으로 변해 계가 터질 수 있다. 또한 에너지가 회전·순열에 불변이면 미분한 힘은 자동으로 등변이 된다.'''

[[questions.choices]]
text = "힘이 어떤 에너지의 gradient임이 보장되어(보존력), MD에서 에너지가 새지 않는다."
correct = true

[[questions.choices]]
text = "자동미분으로 힘을 구하는 쪽이 직접 예측보다 항상 계산이 더 빠르다."
feedback = "오히려 미분을 한 번 더 통과하므로 대개 더 느리다. 이득은 속도가 아니라 물리적 일관성(보존력)이다."

[[questions.choices]]
text = "에너지 레이블이 힘 레이블보다 양자화학 계산에서 더 정확하기 때문이다."
feedback = "한 계산이 에너지와 힘을 함께 주고, 둘의 정확도 차이가 이 설계의 이유는 아니다. 이유는 힘이 보존력이 되도록 보장하는 것이다."

[[questions.choices]]
text = "힘은 벡터라 신경망의 출력으로 쓸 수 없기 때문이다."
feedback = "힘을 벡터로 직접 출력하는 모델도 있다. 그렇게 하면 보존력 보장이 사라지는 것이 문제다."

[[questions]]
id = "forces-more-informative"
type = "single"
objective = 1
prompt = '''원자 30개인 배치 하나에 대해 양자화학 계산을 한 번 하면 에너지와 모든 원자의 힘을 함께 얻는다. 이 한 번의 계산이 학습에 주는 **스칼라 레이블 값**의 개수는 에너지만 쓸 때와 힘까지 쓸 때 각각 몇 개인가?'''
explanation = '''에너지는 스칼라 1개다. 힘은 원자 30개 × 3차원 = 90개 성분이고, 에너지 1개를 더하면 91개다. 그래서 힘까지 쓰면 같은 계산 비용으로 배치마다 훨씬 많은 제약을 얻는다. 힘은 에너지 지형의 기울기를 직접 알려 주므로, 적은 수의 양자화학 계산으로 정확한 퍼텐셜을 만드는 데 특히 효율적이다.'''

[[questions.choices]]
text = "에너지만: 1개, 힘까지: 91개"
correct = true

[[questions.choices]]
text = "에너지만: 1개, 힘까지: 31개"
feedback = "힘은 원자마다 1개가 아니라 3개 성분(x, y, z)이다. 30 × 3 = 90, 에너지 더해 91개다."

[[questions.choices]]
text = "에너지만: 1개, 힘까지: 30개"
feedback = "힘은 원자마다 3차원 벡터다. 30개가 아니라 90개 성분이다."

[[questions.choices]]
text = "에너지만: 30개, 힘까지: 90개"
feedback = "계 전체의 에너지는 배치마다 스칼라 1개다. 원자별 에너지는 레이블로 주어지지 않는다."

[[questions]]
id = "non-conservative"
type = "single"
objective = 2
prompt = '''한 MLIP가 정적 테스트셋에서 힘 RMS 오차 2%로 아주 정확한데, MD를 길게 돌리니 총에너지가 꾸준히 올라가며 계가 점점 커지다 터졌다. 가장 가능성 높은 원인은?'''
explanation = '''정적 힘 오차가 작아도 그 힘이 어떤 에너지의 gradient가 아니면(비보존력), 닫힌 경로에서 알짜 일을 해 MD에서 에너지가 체계적으로 들어온다. 이 에너지 유입이 긴 궤적에서 누적되어 계를 터뜨린다. velocity Verlet 같은 적분기는 보존력에서는 에너지를 잘 보존하므로, 에너지가 단조롭게 느는 것은 적분기가 아니라 힘장이 비보존이라는 신호다. 적분 간격을 줄여도 비보존성은 사라지지 않는다.'''

[[questions.choices]]
text = "모델의 힘이 어떤 에너지의 gradient가 아니어서(비보존력), MD에서 에너지가 체계적으로 유입된다."
correct = true

[[questions.choices]]
text = "힘 오차 2%가 원래 너무 커서 생긴 일이며, 1%로 줄이면 반드시 안정해진다."
feedback = "문제는 오차의 크기가 아니라 종류(비보존성)다. 오차를 줄여도 비보존 성분이 남으면 긴 MD에서 누적된다."

[[questions.choices]]
text = "velocity Verlet 적분기가 에너지를 보존하지 못하기 때문이다."
feedback = "velocity Verlet은 보존력에서 에너지를 잘 보존한다. 단조로운 에너지 증가는 적분기가 아니라 힘장을 의심하게 하는 신호다."

[[questions.choices]]
text = "정적 테스트셋 성능이 좋으므로 MD도 반드시 안정해야 하며, 결과가 잘못된 것이다."
feedback = "정적 오차와 동역학 안정성은 다른 것을 잰다. 정적 성능이 좋아도 MD가 불안정할 수 있다."

[[questions]]
id = "static-vs-dynamic"
type = "multiple"
objective = 2
prompt = '''MLIP를 "테스트셋 힘 MAE"만으로 평가할 때 놓치는 것을 모두 고르시오.'''
explanation = '''정적 힘 MAE는 학습 분포에서 뽑은 배치에서의 보간 성능이다. MD에서 모델은 자기 예측이 만든 새 배치를 다시 입력으로 받으므로, (1) 작은 오차가 누적되어 궤적이 비물리로 가는 불안정성, (2) 확산 계수·동경 분포 함수 같은 실제 관심 관측량의 재현 여부, (3) 학습 분포 밖(고온, 반응 경로)으로 나갔을 때의 외삽 거동을 정적 MAE는 보지 못한다. 반면 "학습 배치에서의 평균 힘 크기"는 테스트셋에서 바로 계산되는 양으로, 정적 MAE가 놓치는 것이 아니다.'''

[[questions.choices]]
text = "긴 MD에서 궤적이 비물리로 발산하지 않는 안정성"
correct = true

[[questions.choices]]
text = "확산 계수·동경 분포 함수 같은 관측량의 재현"
correct = true

[[questions.choices]]
text = "고온이나 반응 경로처럼 학습 분포 밖 배치에서의 거동"
correct = true

[[questions.choices]]
text = "학습 배치에서 원자에 작용하는 힘의 평균 크기"
feedback = "이 값은 테스트셋에서 바로 구할 수 있다. 정적 MAE가 놓치는 것은 동역학·외삽 쪽이다."

[[questions]]
id = "energy-drift-order"
type = "numeric"
objective = 2
prompt = '''velocity Verlet로 보존력 계를 적분할 때 총에너지 표류는 시간 간격 $\Delta t$에 대해 2차($\propto \Delta t^2$)로 작아진다. $\Delta t$를 1/4로 줄이면 에너지 표류는 약 몇 분의 1이 되는가?'''
explanation = '''표류가 $\Delta t^2$에 비례하므로, $\Delta t$를 1/4로 줄이면 표류는 $(1/4)^2 = 1/16$이 된다. 이 2차 수렴은 보존력에서의 성질이다. 따라서 $\Delta t$를 줄여도 에너지가 2차로 줄지 않고 단조롭게 커지면, 적분이 아니라 힘장(비보존성)을 의심한다.'''
answer = 16
tolerance = 0
