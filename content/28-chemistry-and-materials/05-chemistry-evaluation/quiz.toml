# 28.5 화학·재료 데이터와 평가의 함정 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "near-duplicate-leakage"
type = "single"
objective = 1
prompt = '''아무것도 학습하지 않고 "가장 가까운 train 분자의 레이블"을 그대로 답하는 1-NN 암기 baseline이, 한 분자 데이터셋의 무작위 분할에서 꽤 낮은 MAE를 냈다. 이로부터 가장 먼저 의심할 것은?'''
explanation = '''암기 baseline은 구조-물성 관계를 전혀 배우지 않고 가장 비슷한 train 분자를 베낄 뿐이다. 그런데도 성능이 좋다면, test 분자 상당수가 train에 거의 같은 친척(근접 중복)을 두고 있다는 뜻이다. 즉 무작위 분할이 근접 중복을 train과 test로 갈라 누수를 만들었다. 근접 중복을 제거하거나 scaffold 분할로 다시 평가해야 한다.'''

[[questions.choices]]
text = "train과 test에 근접 중복이 많아, 무작위 분할이 누수를 만들고 있다."
correct = true

[[questions.choices]]
text = "1-NN이 원래 강력한 모델이므로, 최신 모델도 비슷한 성능이면 충분하다."
feedback = "1-NN은 암기 baseline이다. 이것이 강하다는 것은 모델의 우수성이 아니라 데이터 중복의 신호다."

[[questions.choices]]
text = "물성이 분자 구조와 무관하다는 뜻이다."
feedback = "오히려 반대다. 비슷한 분자가 비슷한 물성을 가지므로 근접 중복을 베끼는 것이 통한다. 문제는 그 중복이 분할을 넘나드는 것이다."

[[questions.choices]]
text = "test 집합이 너무 작아서 생긴 우연이다."
feedback = "표본 크기 문제가 아니다. 근접 중복 누수는 test를 키워도 사라지지 않는다. 중복을 제거해야 한다."

[[questions]]
id = "mixed-levels"
type = "single"
objective = 1
prompt = '''두 데이터베이스의 DFT 계산값을 한 데이터셋으로 합쳤다. 두 데이터베이스는 함수·설정이 달라 같은 물질에도 체계적으로 다른 값을 준다. 데이터 출처를 기록하지 않고 섞어서 모델을 학습·평가하면?'''
explanation = '''두 계산 수준 사이의 체계적 차이(offset)가 레이블에 섞인다. 추론 시점에는 "이 분자가 어느 수준에서 계산됐는가"를 알 수 없으므로, 모델은 이 차이를 예측할 수 없고 오차가 커진다. 더 나쁘게는, 출처와 상관된 다른 특징이 있으면 모델이 물성 대신 출처를 추측하는 법을 배운다. 출처를 기록하고 한 수준 안에서 평가하거나 수준을 명시적 특징으로 넣어야 한다.'''

[[questions.choices]]
text = "계산 수준의 체계적 차이가 잡음처럼 섞여, 모델이 물성 대신 출처를 배우거나 오차가 커진다."
correct = true

[[questions.choices]]
text = "데이터가 많아지므로 항상 성능이 좋아진다."
feedback = "데이터 양이 늘어도, 서로 다른 수준의 체계적 차이가 레이블을 오염시키면 평가가 흐려진다."

[[questions.choices]]
text = "DFT 값은 모두 같은 물리에서 나오므로 섞어도 문제가 없다."
feedback = "함수·기저 집합·설정이 다르면 같은 물질에도 체계적으로 다른 값이 나온다. 이 차이가 숨은 변수가 된다."

[[questions.choices]]
text = "모델이 자동으로 두 수준을 구분해 보정한다."
feedback = "추론 시점에 수준 정보가 입력으로 주어지지 않으면 모델은 구분할 수 없다. 수준을 특징으로 명시해야 한다."

[[questions]]
id = "error-bars"
type = "single"
objective = 2
prompt = '''두 모델 A, B의 벤치마크 MAE가 각각 0.502와 0.498로, B가 0.004 낮다. MAE 차이의 95% 부트스트랩 신뢰구간이 $[-0.03, +0.02]$로 나왔다. 올바른 해석은?'''
explanation = '''신뢰구간이 0을 포함하므로, 관측된 0.004 차이는 test 표본의 우연으로 설명될 수 있다. 즉 "B가 A보다 낫다"는 주장은 이 데이터로 뒷받침되지 않는다. 포화된 벤치마크에서 소수점 셋째 자리로 순위를 다툴 때는 반드시 오차 막대를 붙여야 하고, 구간이 0을 넉넉히 포함하면 두 모델은 구별되지 않는다고 보고한다.'''

[[questions.choices]]
text = "구간이 0을 포함하므로, 두 모델의 차이는 우연과 구별되지 않는다."
correct = true

[[questions.choices]]
text = "B의 MAE가 더 낮으므로 B가 더 나은 모델이다."
feedback = "점추정만 보면 B가 낮지만, 신뢰구간이 0을 넉넉히 포함하므로 그 차이는 우연일 수 있다."

[[questions.choices]]
text = "부트스트랩 구간이 음수를 포함하므로 A가 더 낫다."
feedback = "구간이 0 양쪽에 걸쳐 있으므로 어느 쪽이 낫다고 말할 수 없다. 방향을 단정하는 것이 오류다."

[[questions.choices]]
text = "차이가 0.004로 작으므로 두 모델 모두 쓸모없다."
feedback = "차이가 작다는 것과 모델이 쓸모없다는 것은 다른 문제다. 여기서 말할 수 있는 것은 두 모델이 서로 구별되지 않는다는 것뿐이다."

[[questions]]
id = "benchmark-audit"
type = "multiple"
objective = 2
prompt = '''분자 물성 벤치마크에서 "최고 성능"을 주장하는 논문을 비판적으로 읽을 때 확인해야 할 것을 모두 고르시오.'''
explanation = '''(1) 1-NN 같은 암기 baseline이 함께 보고됐는지, 그리고 그것이 강하지 않은지(강하면 중복 누수를 의심). (2) 근접 중복 제거와 주장에 맞는 분할(scaffold·시간)로 평가했는지. (3) 모델 간 차이에 오차 막대가 있는지. (4) 서로 다른 계산 수준·측정 조건을 섞지 않았는지. 반면 "저자의 소속 기관"은 결과의 타당성과 무관하다. 평가는 방법으로 판단한다.'''

[[questions.choices]]
text = "암기 baseline(1-NN 등)을 함께 보고했고, 그것이 모델과 큰 격차를 보이는지"
correct = true

[[questions.choices]]
text = "근접 중복 제거와 주장에 맞는 분할(scaffold·시간)로 평가했는지"
correct = true

[[questions.choices]]
text = "모델 간 성능 차이에 오차 막대(신뢰구간)가 있는지"
correct = true

[[questions.choices]]
text = "저자가 유명한 기관 소속인지"
feedback = "소속은 결과의 타당성과 무관하다. 평가는 데이터 정제·분할·오차 막대 같은 방법으로 판단한다."
