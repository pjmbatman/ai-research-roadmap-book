# 28.1 분자와 결정의 표현 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "smiles-duplicates"
type = "single"
objective = 1
prompt = '''두 공개 데이터베이스를 합쳤더니 한쪽에는 에탄올이 `CCO`로, 다른 쪽에는 `OCC`로 적혀 있었다. 문자열을 그대로 샘플의 키로 쓰고 무작위로 train/test를 나누면 어떤 일이 생기는가?'''
explanation = '''SMILES는 그래프를 따라가는 순서에 따라 같은 분자를 여러 문자열로 적는다. 문자열이 다르면 서로 다른 샘플로 취급되므로, 같은 분자가 train과 test에 동시에 들어갈 수 있다. 그러면 시험 성능이 "이미 본 분자를 맞히는 능력"을 포함해 부풀려진다. 합치기 전에 한 도구로 모든 문자열을 표준화(canonicalize)하고, 표준형 단위로 중복을 정리한 뒤 나눈다.'''

[[questions.choices]]
text = "같은 분자가 train과 test에 함께 들어가 시험 성능이 부풀려질 수 있다."
correct = true

[[questions.choices]]
text = "문자열이 다르므로 서로 다른 분자이고, 문제가 없다."
feedback = "SMILES는 시작 원자와 순서에 따라 같은 분자를 여러 방식으로 적는다. CCO와 OCC는 같은 그래프다."

[[questions.choices]]
text = "같은 분자의 두 표기는 데이터 증강 효과가 있으므로 시험 성능이 더 정직해진다."
feedback = "증강은 학습 쪽에서만 쓴다. 같은 분자가 시험에도 들어가면 증강이 아니라 누수다."

[[questions.choices]]
text = "canonical SMILES는 모든 도구에서 같으므로, 각 데이터베이스가 제공한 canonical 문자열을 그대로 비교하면 된다."
feedback = "canonical SMILES는 같은 도구 안에서만 하나로 정해진다. 도구나 버전이 다르면 같은 분자에 다른 문자열이 나올 수 있으므로 한 도구로 다시 표준화해야 한다."

[[questions]]
id = "tanimoto-one"
type = "single"
objective = 1
prompt = '''두 분자의 해시 지문(반경 2, 2048비트) 사이의 Tanimoto 유사도가 1.0이다. 이로부터 말할 수 있는 것은?'''
explanation = '''Tanimoto 1.0은 두 지문의 켜진 비트가 완전히 같다는 뜻이다. 지문은 반경 안의 원자 환경만 보고, 서로 다른 환경이 같은 비트에 떨어지는 해시 충돌도 있으며, 기본 지문은 입체 정보를 담지 않는다. 그래서 두 분자는 "지문이 보는 범위 안에서 구별되지 않을" 뿐, 같은 분자라는 보장은 없다. 거울상 이성질체는 연결 그래프가 같으므로, 입체 정보를 넣지 않은 지문에서 언제나 같은 지문을 받는다.'''

[[questions.choices]]
text = "두 분자는 같은 분자다."
feedback = "해시 충돌, 제한된 반경, 입체 정보 누락 때문에 다른 분자도 같은 지문을 받을 수 있다. 같은 분자인지는 표준화한 식별자로 판정한다."

[[questions.choices]]
text = "지문이 보는 반경과 비트 안에서는 두 분자를 구별할 수 없다."
correct = true

[[questions.choices]]
text = "두 분자의 물성은 같다."
feedback = "지문이 같아도 입체 이성질체처럼 물성이 다른 분자가 있다. 지문이 같다는 것은 표현의 한계에 대한 정보다."

[[questions]]
id = "chirality-invariance"
type = "single"
objective = 2
prompt = '''원자 사이 거리만으로 만든 불변 표현(예: Coulomb 행렬 고윳값)을 입력으로 쓰는 모델에 대해 옳은 것은?'''
explanation = '''거리는 회전·평행이동뿐 아니라 반사에도 변하지 않는다. 거울상 이성질체는 서로의 반사이므로 모든 원자 쌍 거리가 같고, 거리만 보는 표현은 둘에 같은 값을 준다. 그래서 이 모델은 거울상 사이에 다른 물성(키랄 수용체와의 결합)을 원리적으로 구별하지 못한다. 반사에 부호가 바뀌는 양(부호 있는 부피)이나 반사를 대칭에서 뺀 등변 모델이 필요하다.'''

[[questions.choices]]
text = "거울상 이성질체 두 개에 항상 같은 예측을 낸다."
correct = true

[[questions.choices]]
text = "데이터만 충분하면 거울상 이성질체를 구별하도록 학습할 수 있다."
feedback = "입력 자체가 두 분자에서 같으므로 어떤 모델도 다른 출력을 낼 수 없다. 데이터의 양이 아니라 표현의 정의 문제다."

[[questions.choices]]
text = "회전에는 불변이지만 원자 번호를 바꿔 매기면 예측이 달라진다."
feedback = "고윳값은 PMPᵀ 변환에 불변이므로 원자 순서와 무관하다."

[[questions.choices]]
text = "분자를 평행이동하면 예측이 달라진다."
feedback = "거리는 평행이동에 불변이다."

[[questions]]
id = "rotation-invariant-targets"
type = "multiple"
objective = 2
prompt = '''분자 전체를 회전시켰을 때 값이 **변하지 않아야 하는**(불변) 예측 대상을 모두 고르시오.'''
explanation = '''스칼라인 총 에너지와 HOMO–LUMO 간격은 회전에 불변이다. 원자에 작용하는 힘과 쌍극자 모멘트는 벡터라서 분자와 함께 회전한다(등변). 쌍극자 모멘트의 크기는 불변이지만 벡터 자체는 아니다. 예측 대상이 불변인지 등변인지가 모델에 필요한 대칭을 정한다(7.10장).'''

[[questions.choices]]
text = "총 에너지"
correct = true

[[questions.choices]]
text = "HOMO–LUMO 간격"
correct = true

[[questions.choices]]
text = "원자마다 작용하는 힘 벡터"
feedback = "힘은 분자와 함께 도는 벡터다. 회전에 불변이 아니라 등변이다."

[[questions.choices]]
text = "쌍극자 모멘트 벡터"
feedback = "쌍극자 모멘트 벡터는 분자와 함께 돈다. 크기만 불변이다."

[[questions]]
id = "crystal-neighbors"
type = "numeric"
objective = 2
prompt = '''격자 상수 $a = 3$ Å인 단순 입방 격자(단위 세포에 원자 1개)에서, 주기 경계 조건을 적용해 한 원자로부터 4.5 Å 안에 있는 이웃 원자의 수는?'''
explanation = '''이웃은 거리 $a = 3$ Å에 6개(면 방향), $a\sqrt{2} \approx 4.24$ Å에 12개(모서리 방향), $a\sqrt{3} \approx 5.20$ Å에 8개(꼭짓점 방향)가 있다. 4.5 Å 안에는 앞의 둘, 6 + 12 = 18개가 들어간다. 단위 세포에 원자가 하나뿐이어도 이웃은 모두 주변 세포의 상(image)이다. 셀 한 변(3 Å)보다 cutoff가 길므로 가장 가까운 상 하나만 보는 최소 상 규약으로는 이 이웃을 셀 수 없다.'''
answer = 18
tolerance = 0

[[questions]]
id = "representation-choice"
type = "single"
objective = 1
prompt = '''실험으로 측정한 수용성 용해도 데이터 400개가 있다. 3차원 구조는 주어지지 않았다. 첫 모델로 가장 적절한 것은?'''
explanation = '''데이터가 수백 개이고 3차원 구조가 없으면, 지문이나 기술자에 고전 모델(16장)을 붙인 baseline이 출발점이다. 큰 모델은 이 규모에서 표현을 배울 데이터가 부족하고, 3차원 모델은 추론할 때마다 구조를 생성해야 해 학습·추론의 입력 출처를 맞추는 부담이 생긴다. 어떤 모델이든 비교는 scaffold 분할(28.2장)에서 한다.'''

[[questions.choices]]
text = "지문 또는 기술자에 랜덤 포레스트나 Gaussian process를 붙인 baseline"
correct = true

[[questions.choices]]
text = "형태 생성 도구로 좌표를 만든 뒤 처음부터 학습하는 대형 등변 GNN"
feedback = "400개로는 큰 모델이 표현을 배우기 어렵고, 생성한 좌표의 출처를 학습·추론에서 같게 유지해야 하는 부담이 더해진다. baseline을 먼저 만든다."

[[questions.choices]]
text = "SMILES 문자열을 한 글자씩 읽는 언어모델을 처음부터 학습"
feedback = "문자 단위 모델은 같은 분자의 여러 표기와 문법을 배우는 데에도 많은 데이터가 필요하다. 수백 개 데이터에서 출발점으로 맞지 않는다."

[[questions.choices]]
text = "분자식(조성)만 입력으로 쓰는 모델"
feedback = "조성은 구조 이성질체를 구별하지 못한다. 분자의 연결 정보는 이미 SMILES에 있으므로 버릴 이유가 없다."
