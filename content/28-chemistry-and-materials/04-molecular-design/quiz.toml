# 28.4 분자·재료 생성과 역설계 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "multiobjective"
type = "single"
objective = 1
prompt = '''생성·최적화의 목적함수로 "예측 물성" 하나만 쓰고 가장 높은 후보를 보고했다. 가장 흔한 문제는?'''
explanation = '''물성 하나만 극대화하면, 최적 후보가 합성 불가능하거나 불안정하거나 독성이 있을 수 있다. 실제 역설계의 목적함수는 거의 언제나 다목적이다: 물성과 함께 합성 가능성, 안정성, 독성 등을 넣고 가중치로 맞바꿈을 정한다. 합성할 수 없는 분자는 아무리 물성 예측이 좋아도 쓸모가 없다.'''

[[questions.choices]]
text = "합성 불가능하거나 쓸 수 없는(불안정·독성) 후보가 최적으로 뽑힐 수 있다."
correct = true

[[questions.choices]]
text = "목적함수가 하나면 유전 알고리즘이 수렴하지 못한다."
feedback = "단일 목적함수에서도 최적화는 수렴한다. 문제는 수렴 여부가 아니라, 다른 축(합성 가능성 등)을 무시해 쓸 수 없는 후보가 나오는 것이다."

[[questions.choices]]
text = "물성 하나만 쓰면 생성물의 유효성이 자동으로 0이 된다."
feedback = "유효성은 생성 방식과 제약으로 정해지지 조각 목적함수의 개수로 정해지지 않는다."

[[questions.choices]]
text = "단일 목적함수는 항상 학습 분자를 그대로 복사한다."
feedback = "복사 여부는 신규성의 문제이고, 목적함수의 개수와는 다른 축이다."

[[questions]]
id = "predictor-exploitation"
type = "single"
objective = 2
prompt = '''물성 예측 모델을 목적함수로 유전 알고리즘을 돌려 "예측 물성이 아주 높은" 후보를 찾았다. 이 후보에 대해 가장 경계해야 할 점은?'''
explanation = '''최적화기는 "실제 물성이 높은 곳"과 "모델이 틀려서 높게 예측하는 곳"을 구분하지 않는다. 그래서 모델의 적용 영역 밖에서 모델이 과신하는 후보로 끌려가기 쉽다. 예측값이 가장 높은 후보는 대개 적용 영역 밖에 있고, 참 물성은 예측보다 훨씬 낮을 수 있다(optimizer's curse). 예측값은 검증 결과가 아니라 후보를 거르는 신호일 뿐이며, 유사도·불확실성으로 적용 영역을 함께 본다.'''

[[questions.choices]]
text = "최적화기가 모델의 적용 영역 밖에서 모델이 과신하는 후보를 찾아냈을 수 있다."
correct = true

[[questions.choices]]
text = "예측 물성이 높으므로 참 물성도 반드시 높다."
feedback = "최적화기는 모델의 오류를 착취할 수 있다. 예측이 높은 곳이 모델이 틀린 곳일 수 있어, 참값은 훨씬 낮을 수 있다."

[[questions.choices]]
text = "유전 알고리즘은 지역 최적에만 빠지므로 예측값을 믿어도 된다."
feedback = "지역 최적 여부와 무관하게, 찾은 후보가 적용 영역 밖이면 예측값 자체가 신뢰할 수 없다."

[[questions.choices]]
text = "예측 모델을 목적함수로 쓰면 생성물의 유효성이 보장된다."
feedback = "유효성과 예측 신뢰도는 다른 문제다. 유효해도 예측이 과신일 수 있다."

[[questions]]
id = "validity-novelty"
type = "single"
objective = 2
prompt = '''한 생성모델이 유효성 99%, 고유성 98%, 신규성 2%를 기록했다. 가장 그럴듯한 해석은?'''
explanation = '''신규성이 2%라는 것은 생성물의 대부분이 학습 데이터에 이미 있는 분자라는 뜻이다. 즉 모델이 학습 분자를 거의 그대로 재현하고 있다. 유효성과 고유성이 높아도, 새로운 분자를 만들지 못하면 역설계 도구로서 쓸모가 적다. 세 지표는 맞바꿈 관계라 함께 봐야 한다.'''

[[questions.choices]]
text = "모델이 학습 분자를 거의 그대로 재현하고 있어, 새 후보를 만들지 못한다."
correct = true

[[questions.choices]]
text = "유효성과 고유성이 높으므로 훌륭한 생성모델이다."
feedback = "신규성 2%는 생성물이 대부분 학습 데이터에 이미 있다는 뜻이다. 새 분자를 못 만들면 역설계에 쓸모가 없다."

[[questions.choices]]
text = "신규성이 낮으면 유효성도 반드시 낮아야 하는데 모순이다."
feedback = "학습 분자를 복사하면 유효성은 높고 신규성은 낮다. 모순이 아니라 전형적인 암기 패턴이다."

[[questions.choices]]
text = "고유성이 98%이므로 생성물이 모두 새로운 분자다."
feedback = "고유성은 '생성물끼리 서로 다른 비율'이고, 신규성은 '학습 데이터에 없던 비율'이다. 둘은 다르다."

[[questions]]
id = "optimizer-curse-fix"
type = "multiple"
objective = 2
prompt = '''예측 모델을 목적함수로 쓸 때 생기는 착취(optimizer's curse)를 줄이는 방법으로 적절한 것을 모두 고르시오.'''
explanation = '''착취는 모델이 적용 영역 밖에서 과신하는 후보로 최적화기가 끌려가서 생긴다. (1) 적용 영역 밖 후보를 거르면 과신 후보가 빠진다. (2) 예측 불확실성을 목적함수에서 빼면(불확실한 후보에 벌점) 외삽 후보가 덜 선택된다. (3) 선별한 후보를 더 믿을 수 있는 방법으로 검증하고 그 결과를 데이터에 되먹이면 모델이 그 영역에서 교정된다. 반면 "예측값 임계만 높이는 것"은 착취를 줄이지 못한다. 오히려 더 극단적인(적용 영역에서 더 먼) 후보만 남겨 편향을 키울 수 있다.'''

[[questions.choices]]
text = "후보를 예측값으로 고르기 전에 적용 영역(유사도) 밖 후보를 거른다."
correct = true

[[questions.choices]]
text = "목적함수에 예측 불확실성 penalty를 더해, 불확실한 후보를 덜 고른다."
correct = true

[[questions.choices]]
text = "선별한 후보를 실험·고수준 계산으로 검증하고 결과를 데이터에 되먹인다."
correct = true

[[questions.choices]]
text = "예측값 임계를 더 높여 예측이 가장 높은 후보만 남긴다."
feedback = "예측 임계를 높이면 오히려 적용 영역에서 더 먼, 모델이 더 과신하는 후보만 남아 편향이 커질 수 있다."
