# 0.3 학습 경로 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "layer-vs-stage"
type = "single"
objective = 1
prompt = "수리 기초(L1)는 머신러닝 핵심(L2)보다 아래 레이어다. 이 사실에서 학습 순서에 대해 이끌어 낼 수 있는 것은?"
explanation = "레이어는 '깊이 이해하려면 무엇이 먼저 필요한가'를 나타낸다. 언제 처음 만나는가는 학습 경로(단계)가 정한다. 그래서 1단계에서 학습 루프를 먼저 얕게 경험하고, 2단계에서 그 수학을 깊이 배운 뒤, 3단계에서 같은 루프를 다시 다룰 수 있다. 레이어 규칙은 이 순서와 충돌하지 않는다."

[[questions.choices]]
text = "딥러닝 장을 깊이 이해하려면 수학 장이 필요하다는 것. 딥러닝을 언제 처음 만날지는 학습 경로가 따로 정한다."
correct = true

[[questions.choices]]
text = "수리 기초의 모든 장을 통과하기 전에는 머신러닝 핵심의 장을 펼치면 안 된다."
feedback = "레이어는 의존 방향이지 학습 순서가 아니다. 이 계획은 대개 수학 어딘가에서 멈춘다."

[[questions.choices]]
text = "수학은 딥러닝을 다 배운 뒤에 필요할 때만 찾아보면 된다."
feedback = "반대 방향의 오해다. 딥러닝을 깊이 이해하려면 수학이 필요하다는 것이 레이어 규칙의 뜻이다. 나선형 경로는 수학을 뒤로 미룰 뿐 건너뛰지 않는다."

[[questions]]
id = "stage-product"
type = "single"
objective = 1
prompt = "3단계(신뢰할 수 있는 연구 코드)를 마쳤다는 근거로 가장 적절한 산출물은?"
explanation = "3단계의 목표는 한 번 돌아간 코드를 다른 사람이 같은 숫자를 다시 얻는 코드로 바꾸는 것이다. 설정 파일, 테스트, 고정된 분할, 실험 기록을 갖춘 연구 템플릿과 그 위에서 group·시간 분할을 지킨 예측 결과가 그 근거다. NumPy 신경망은 2단계, 논문 재현 보고서는 4단계, 독립 연구 논문 초안은 5단계의 산출물이다."

[[questions.choices]]
text = "설정·테스트·실험 기록을 갖춘 PyTorch 연구 템플릿과, 그 위에서 group·시간 분할을 지켜 낸 과학 데이터 예측 결과"
correct = true

[[questions.choices]]
text = "수치미분으로 gradient를 검증한 NumPy 신경망"
feedback = "구현을 수학으로 설명하는 2단계의 산출물이다."

[[questions.choices]]
text = "공개 논문의 표를 다시 얻은 재현 보고서"
feedback = "기존 연구를 재현하는 4단계의 산출물이다. 3단계의 템플릿이 있어야 재현을 빈 폴더에서 시작하지 않는다."

[[questions.choices]]
text = "독립 연구의 논문 초안"
feedback = "5단계의 산출물이다."

[[questions]]
id = "background-path"
type = "single"
objective = 2
prompt = "유체 시뮬레이션을 10년 해 온 기계공학 연구자가 시뮬레이션 대리모델을 만들려고 한다. 수치해석과 PDE에는 익숙하지만 ML 프로젝트를 해 본 적은 없다. 가장 적절한 경로는?"
explanation = "AI를 배우는 과학자·공학자의 경로다. 이미 가진 수치해석은 자가 진단으로 확인만 하고, 비어 있는 연구 소프트웨어 공학과 머신러닝 핵심(특히 분할과 누수, 기준 모델, 모델 선택)을 먼저 채운다. 자기 분야의 부는 그 뒤에 ML 연구자의 관점으로 읽는다."

[[questions.choices]]
text = "연구 소프트웨어 공학과 머신러닝 핵심(분할·누수·baseline·모델 선택)을 먼저 하고, 수치해석은 자가 진단으로 확인만 한 뒤 넘어간다."
correct = true

[[questions.choices]]
text = "익숙한 분야이므로 26부(물리·공학 시뮬레이션)의 대리모델 장부터 바로 시작한다."
feedback = "분야는 익숙해도 그 장이 기대는 ML 평가 관행(분할·누수·baseline)이 비어 있다. 대리모델의 점수를 믿을 수 있는지 판단할 수 없게 된다."

[[questions.choices]]
text = "다섯 단계를 처음부터 순서대로 따라, 9부 수치해석도 모두 다시 공부한다."
feedback = "이미 가진 역량을 다시 배우는 데 시간을 쓰게 된다. 익숙한 부분은 자가 진단으로 확인하고 건너뛴다."

[[questions]]
id = "ai-researcher-path"
type = "single"
objective = 2
prompt = "이미지 분류 모델을 연구해 온 ML 연구자가 기후 데이터 연구로 옮기려 한다. 가장 먼저 채울 빈칸으로 적절한 것은?"
explanation = "과학을 배우는 AI 연구자의 경로다. 딥러닝과 코드는 이미 있으므로, 시뮬레이터의 오차를 이해하는 수치해석, 불확실성을 다루는 확률적 추론, 분야를 가로지르는 과학 머신러닝을 먼저 채운다. 그다음 27부(지구·기후)를 처음부터 끝까지 읽는다."

[[questions.choices]]
text = "수치해석·확률적 추론·과학 머신러닝을 먼저 채우고, 그다음 27부(지구·기후)를 깊게 읽는다."
correct = true

[[questions.choices]]
text = "더 큰 비전 모델 아키텍처(18부)를 먼저 깊게 공부한다."
feedback = "이미 가진 역량을 더 쌓는 쪽이다. 기후 연구에서 막히는 곳은 아키텍처보다 시뮬레이션 데이터, 불확실성, 분야의 평가 기준이다."

[[questions.choices]]
text = "기후 데이터에 기존 이미지 모델을 그대로 적용하고 점수가 오르는지 본다."
feedback = "분야의 평가 관행(예: 위도에 따른 면적 가중)을 모르면 점수가 무엇을 뜻하는지 판단할 수 없다."

[[questions]]
id = "plan-outputs"
type = "multiple"
objective = 2
prompt = "3개월 학습 계획의 항목 중, 진도를 산출물로 확인할 수 있게 쓰인 것을 모두 고르시오."
explanation = "진도는 기간이나 읽은 분량이 아니라 확인 가능한 산출물로 판단한다. 테스트를 통과한 연습문제, 다른 사람이 같은 숫자를 다시 얻는 파이프라인, 분할 방식별 점수 표는 모두 확인할 수 있다. '이해한다', '3주 동안 공부한다'는 무엇을 하면 끝나는지 알 수 없다."

[[questions.choices]]
text = "15.4장: 공개 데이터에서 무작위 분할과 그룹 분할의 점수 차이를 표로 남긴다."
correct = true

[[questions.choices]]
text = "1.5장: 다른 사람이 같은 명령으로 같은 숫자를 다시 얻는 파이프라인을 만든다."
correct = true

[[questions.choices]]
text = "8.4장: 자동미분 연습문제의 테스트를 통과한다."
correct = true

[[questions.choices]]
text = "7부: 선형대수를 이해한다."
feedback = "무엇을 하면 '이해했다'가 되는지 알 수 없다. 장마다 통과 기준의 산출물로 바꿔 쓴다."

[[questions.choices]]
text = "11–12부: 확률과 통계를 3주 동안 공부한다."
feedback = "기간은 계획 범위이지 진도의 기준이 아니다. 3주 뒤에 무엇이 남는지를 적어야 한다."
