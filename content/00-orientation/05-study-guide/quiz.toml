# 0.5 스터디·강의로 활용하기 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "format-choice"
type = "single"
objective = 1
prompt = "스터디 구성원 대부분이 지난주 실습에서 '학습 손실이 몇 epoch 뒤 NaN이 되는' 문제를 겪었고, 각자 원인을 다르게 짐작하고 있다. 이번 주 모임에 가장 맞는 형식은?"
explanation = "실패 분석 모임은 재현 가능한 실패를 가져와 증상만 보여 주고, 다른 사람이 원인을 추측한 뒤 네 축(이론·구현·연구·운영)으로 분류한다. 사람마다 익숙한 축이 달라 원인이 빨리 좁혀지고, 진단 절차 자체가 남는다."

[[questions.choices]]
text = "실패 분석: 각자 실패를 재현 가능한 형태로 가져와 원인을 네 축으로 좁힌다."
correct = true

[[questions.choices]]
text = "개념 발표: 한 사람이 최적화 이론을 처음부터 다시 발표한다."
feedback = "원인이 이론에 있는지조차 아직 모른다. 발표는 설명 수준을 확인할 뿐, 각자의 실패를 진단하지 않는다."

[[questions.choices]]
text = "논문·분야 적용: 학습 안정화 기법을 다룬 최신 논문을 읽는다."
feedback = "원인을 모른 채 해결책을 찾는 순서다. 먼저 자기 실패의 원인을 좁혀야 어떤 논문이 필요한지 안다."

[[questions]]
id = "presentation-only-fix"
type = "single"
objective = 1
prompt = "8주째 매주 한 사람이 장 하나를 발표하는 스터디가 있다. 발표는 충실하지만, 장의 연습문제를 끝까지 푼 사람이 거의 없다. 가장 효과적인 개선은?"
explanation = "발표만 하는 모임은 설명 수준을 넘지 못한다. 구현 실습과 실패 분석을 끼워 넣고, 실습을 끝내야 발표할 수 있게 하면 모두가 구현·검증 수준을 확인하게 된다. 발표의 질을 높이거나 장 수를 늘리는 것은 비어 있는 실습을 채우지 못한다."

[[questions.choices]]
text = "발표 주 사이에 구현 실습·실패 분석 모임을 넣고, 실습을 끝내지 않은 사람은 발표를 미루는 규칙을 둔다."
correct = true

[[questions.choices]]
text = "발표 자료의 질을 높이기 위해 슬라이드 템플릿을 통일한다."
feedback = "발표의 형식을 다듬어도, 아무도 구현하지 않는다는 문제는 그대로다."

[[questions.choices]]
text = "진도를 앞당기기 위해 한 번에 장 두 개씩 발표한다."
feedback = "장 수로 진도를 세는 실패 사례다. 실습이 비어 있는 장이 두 배로 늘 뿐이다."

[[questions]]
id = "progress-export-meaning"
type = "single"
objective = 2
prompt = "스터디원이 모임 전에 '내 진도'에서 내보낸 JSON 파일을 공유했다. 모든 퀴즈와 연습문제가 통과로 표시되어 있다. 이 파일을 가장 바르게 쓰는 방법은?"
explanation = "사이트에는 로그인과 서버 채점이 없고, 퀴즈 정답과 테스트·해답이 공개되어 있다. 그래서 진도 파일은 무엇을 했는지의 기록이지 할 수 있다는 증명이 아니다. 어디서 막혔는지 이야기할 출발점으로 쓰고, 실제 확인은 코드 리뷰와 구술 설명으로 한다."

[[questions.choices]]
text = "무엇을 이야기할지 정하는 기록으로 쓰고, 실제 이해는 코드 리뷰와 구술 설명으로 확인한다."
correct = true

[[questions.choices]]
text = "모두 통과했으므로 그 장은 더 확인할 필요가 없다."
feedback = "정답과 테스트가 공개되어 있어, 통과 표시는 이해를 증명하지 않는다."

[[questions.choices]]
text = "답을 보고 풀었을 수 있으므로 진도 파일은 쓸모가 없다."
feedback = "증명은 아니어도 누가 어느 목표에서 막혔는지 보여 주는 유용한 기록이다. 다른 점검 방법과 함께 쓴다."

[[questions]]
id = "solo-checks"
type = "multiple"
objective = 2
prompt = "함께할 스터디가 없는 독학자가 다른 사람의 눈을 빌려 점검하는 방법으로 적절한 것을 모두 고르시오."
explanation = "학습 노트와 코드를 공개하고, 범위를 좁힌 질문으로 리뷰를 요청하고, 자료 없이 설명을 녹음해 다시 듣는 것은 모두 자기 눈에 안 보이는 빈틈을 드러낸다. 퀴즈를 정답이 나올 때까지 다시 푸는 것은 정답의 위치를 외울 뿐 빈틈을 드러내지 않는다."

[[questions.choices]]
text = "장마다 노트와 실습 코드를 공개 저장소에 올린다."
correct = true

[[questions.choices]]
text = "\"이 분할에서 누수가 있는지\"처럼 범위를 좁힌 질문을 붙여 리뷰를 요청한다."
correct = true

[[questions.choices]]
text = "장을 마칠 때마다 자료 없이 5분 동안 설명한 것을 녹음하고 다시 듣는다."
correct = true

[[questions.choices]]
text = "퀴즈를 모두 맞힐 때까지 반복해서 다시 푼다."
feedback = "선택지를 바꿔 가며 맞히는 것은 정답의 위치를 기억할 뿐이다. 틀린 문항은 해당 절로 돌아가 설명을 다시 써 본다."

[[questions]]
id = "license-reuse"
type = "single"
objective = 1
prompt = "대학 강의에서 이 책의 한 장을 고쳐 슬라이드로 만들고, 유료 단기 강좌에서도 쓰려고 한다. 이 책의 본문은 CC BY 4.0이다. 옳은 것은?"
explanation = "CC BY 4.0은 복제·수정·배포와 상업적 이용을 허용하고, 출처 표기를 조건으로 한다. 고친 경우에는 고쳤다는 사실도 밝힌다. 오픈소스라고 해서 출처 표기가 면제되지 않고, 비상업 조건(NC)이나 변경 금지 조건(ND)은 이 라이선스에 없다."

[[questions.choices]]
text = "수정과 상업적 이용 모두 가능하다. 출처를 표기하고, 고쳤다는 사실을 밝힌다."
correct = true

[[questions.choices]]
text = "오픈소스이므로 출처를 표기하지 않아도 된다."
feedback = "CC BY 4.0의 핵심 조건이 출처 표기(Attribution)다."

[[questions.choices]]
text = "비상업적 강의에서만 쓸 수 있다."
feedback = "비상업 조건은 CC BY-NC 계열의 조건이다. CC BY 4.0은 상업적 이용을 허용한다."

[[questions.choices]]
text = "원문을 고치지 않고 그대로 쓰는 경우에만 허용된다."
feedback = "변경 금지는 CC BY-ND 계열의 조건이다. CC BY 4.0은 수정을 허용한다."
