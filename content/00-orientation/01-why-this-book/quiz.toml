# 0.1 왜 이 책인가 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "target-researcher"
type = "single"
objective = 1
prompt = "두 연구자가 같은 재료 물성 예측 과제를 맡았다. 이 책이 목표로 하는 연구자상에 더 가까운 쪽은?"
explanation = "이 책은 연구자를 아는 것의 양이 아니라 행동으로 정의한다. 문제를 정의하고, 데이터와 모델을 설계하고, 검증하고, 재현 가능하게 전달하는 것이다. B는 baseline 비교, 분할 방식에 따른 점수 차이(누수 점검), 적용 범위의 명시라는 검증 행동을 했다. A의 높은 점수는 무작위 분할에서 유사 구조가 학습·테스트에 함께 들어가 부풀려졌을 수 있고, A는 그것을 확인하지 않았다."

[[questions.choices]]
text = "A: 최신 그래프 신경망 다섯 종을 모두 돌려 보고, 무작위 분할에서 가장 높은 점수를 낸 모델을 보고했다."
feedback = "여러 모델을 돌린 것은 탐색이지 검증이 아니다. 화학 데이터의 무작위 분할은 유사 구조 때문에 점수를 부풀릴 수 있는데, 이를 확인하지 않았다."

[[questions.choices]]
text = "B: 단순한 baseline과 모델 하나를 무작위 분할과 구조 기반 분할에서 비교하고, 점수 차이와 모델을 믿을 수 있는 범위를 함께 보고했다."
correct = true

[[questions.choices]]
text = "둘 다 같다. 결국 최종 테스트 점수가 높은 쪽이 더 좋은 연구다."
feedback = "과학 문제에서는 점수가 어떤 조건에서 나왔는지와 결과를 어디까지 믿을 수 있는지가 점수만큼 중요하다."

[[questions]]
id = "verification-questions"
type = "multiple"
objective = 1
prompt = "다음 중 '자신의 가정·구현·실험·결론을 검증하는' 행동을 모두 고르시오."
explanation = "해석적 gradient와 수치미분의 비교는 구현의 검증, 여러 seed에서의 변동 측정은 실험의 검증, 제곱손실이 무엇을 추정하는지 따지는 것은 가정의 검증이다. 최신 모델의 이름을 아는 것과 논문을 많이 읽는 것은 탐색에 도움이 되지만 자기 결과가 맞는지를 확인하는 행동은 아니다."

[[questions.choices]]
text = "직접 구현한 gradient를 수치미분 값과 비교한다."
correct = true

[[questions.choices]]
text = "같은 설정을 여러 seed로 반복해, 두 방법의 차이가 seed 사이 변동보다 큰지 확인한다."
correct = true

[[questions.choices]]
text = "제곱손실로 학습한 모델이 조건부분포의 어떤 대표값을 추정하는지 확인한다."
correct = true

[[questions.choices]]
text = "이번 달에 공개된 모델의 이름과 파라미터 수를 정리해 둔다."
feedback = "문헌 탐색에는 쓸모 있지만, 자기 코드와 결과가 맞는지 확인하는 행동이 아니다."

[[questions]]
id = "four-axes-diagnosis"
type = "single"
objective = 2
prompt = "연구실 노트북에서 잘 돌던 학습 코드를 공유 GPU 서버에서 돌렸더니, 같은 seed와 설정인데 결과가 달라졌다. 코드는 한 줄도 바꾸지 않았다. 원인을 가장 먼저 찾아볼 축은?"
explanation = "코드와 설정이 같은데 실행 위치만 바뀌었다면, 먼저 의심할 것은 실행 환경이다: 패키지·드라이버 버전, 다른 연산 경로(GPU 비결정적 연산 등), 데이터 경로. 이는 운영 축(연구 인프라 트랙)의 문제다. 원인이 결국 다른 축에 있을 수도 있지만, 바뀐 것이 환경뿐이라는 관찰이 탐색 순서를 정한다."

[[questions.choices]]
text = "구현: 코드에 버그가 있을 것이다."
feedback = "코드는 그대로이고 노트북에서는 잘 돌았다. 바뀐 것은 실행 환경이다."

[[questions.choices]]
text = "운영: 두 환경의 패키지·드라이버 버전과 연산 경로가 같은지부터 확인한다."
correct = true

[[questions.choices]]
text = "이론: 최적화 알고리즘이 수렴하지 않는 문제다."
feedback = "같은 설정이 한 환경에서는 잘 수렴했으므로, 알고리즘 자체보다 환경 차이를 먼저 의심한다."

[[questions.choices]]
text = "연구: 연구 질문이 잘못 정의되었다."
feedback = "결과가 환경에 따라 달라지는 현상은 질문의 정의와 무관하게 일어난다."

[[questions]]
id = "spiral-learning"
type = "single"
objective = 2
prompt = "ML이 처음인 물리학 대학원생이 \"선형대수·미적분·확률·최적화를 모두 끝낸 뒤에 신경망 코드를 처음 짜겠다\"고 계획했다. 이 책의 관점에서 가장 적절한 조언은?"
explanation = "이 책은 나선형 학습을 권한다. 1.5장에서 작은 파이프라인과 학습 루프를 먼저 얕게 완주하고, 그때 생긴 질문을 가지고 수학을 깊이 배운 뒤, 17.5장에서 같은 루프를 다시 뜯어본다. 수학이 중요하지 않다는 뜻이 아니라, 수학을 언제 처음 만나는가와 얼마나 깊이 아는가를 분리한다는 뜻이다."

[[questions.choices]]
text = "계획대로 한다. 수학이 낮은 레이어에 있으므로 먼저 끝내야 한다."
feedback = "레이어는 '무엇에 기대는가'이지 '언제 배우는가'가 아니다. 또 수학을 '끝낸다'는 기준이 없어 계획이 멈추기 쉽다."

[[questions.choices]]
text = "작은 파이프라인과 학습 루프를 먼저 한 번 완주하고, 거기서 생긴 질문을 가지고 수학을 깊이 배운 뒤 같은 주제로 돌아온다."
correct = true

[[questions.choices]]
text = "수학은 건너뛰고 PyTorch 튜토리얼만 반복한다. 라이브러리가 수학을 대신해 준다."
feedback = "라이브러리는 계산을 대신하지만, 학습이 왜 실패하는지 판단하는 일은 대신하지 않는다. 나선형 학습은 수학을 뒤로 미룰 뿐 건너뛰지 않는다."

[[questions]]
id = "output-based-progress"
type = "single"
objective = 2
prompt = "데이터 분할과 누수 방지(15.4장)의 진도를 판단하는 근거로 가장 적절한 것은?"
explanation = "이 책은 진도를 읽은 분량이 아니라 만들고 검증한 산출물로 판단한다. 실제 데이터에서 분할 방식에 따라 점수가 어떻게 달라지는지 직접 측정한 결과는 누수를 이해하고 다룰 수 있다는 산출물이다."

[[questions.choices]]
text = "장을 끝까지 읽었고 내용이 이해되었다고 느낀다."
feedback = "이해했다는 느낌은 실제로 할 수 있는지와 자주 다르다. 그래서 통과 기준은 산출물로 쓰여 있다."

[[questions.choices]]
text = "같은 데이터에서 무작위 분할과 그룹 분할의 점수를 직접 측정하고, 차이를 설명한 짧은 기록을 남겼다."
correct = true

[[questions.choices]]
text = "누수에 관한 블로그 글과 논문을 세 편 더 읽었다."
feedback = "읽은 자료의 수는 진도의 근거가 아니다. 읽은 것을 자기 데이터에 적용해 본 결과가 근거다."

[[questions]]
id = "out-of-scope"
type = "multiple"
objective = 3
prompt = "다음 중 이 책이 다루는 방식에 맞는 것을 모두 고르시오."
explanation = "이 책은 빠르게 변하는 버전·화면을 확인 절차로 가르치고 구체적인 값은 '집필 시점 예시'로 표시한다. 수치해석과 불확실성은 AI for Science의 기반으로 두껍게 다룬다. 반면 특정 버전 번호의 암기, 최신 모델의 망라, 분야 학위 과정의 대체는 이 책의 범위가 아니다."

[[questions.choices]]
text = "GPU 드라이버와 CUDA의 호환성은 공식 문서에서 확인하는 절차로 가르친다."
correct = true

[[questions.choices]]
text = "수치해석과 불확실성 정량화를 일반 ML 과정보다 두껍게 다룬다."
correct = true

[[questions.choices]]
text = "현재 권장 CUDA 버전 번호를 외우게 한다."
feedback = "버전 번호는 몇 달이면 바뀐다. 이 책은 번호 대신 확인 절차를 가르치고, 번호는 집필 시점 예시로만 쓴다."

[[questions.choices]]
text = "매달 나오는 최신 모델을 빠짐없이 소개한다."
feedback = "아키텍처는 원리와 선택 기준으로 다룬다. 동향을 따라가는 방법은 1.6장과 23.1장에서 가르친다."

[[questions.choices]]
text = "분야별 부가 각 과학 분야의 학위 과정을 대신한다."
feedback = "분야별 부는 ML 연구자를 위한 분야 기초에서 시작하지만 분야 교과서를 대신하지 않는다. 깊은 분야 지식은 도메인 과학자와 협업한다."
