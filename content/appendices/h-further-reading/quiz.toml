# 부록 H 추천 자료 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "review-vs-original"
type = "single"
objective = 3
prompt = '''한 리뷰 논문에 "방법 X는 물성 예측 오차를 기존 방법보다 30% 줄였다[42]"라는 문장이 있다. 이 사실을 자기 논문의 서론에 쓰려고 한다. 가장 적절한 방법은?'''
explanation = '''리뷰는 분야의 지도를 주지만, 요약 문장은 조건(데이터셋, 분할, 비교 대상, 지표)을 생략한다. 특정 수치를 인용하려면 리뷰가 가리키는 원 논문[42]을 찾아 해당 표·절에서 조건과 함께 확인하고, 원 논문을 인용한다(23.1장, 23.2장). 리뷰를 인용하는 것은 "이런 흐름이 있다"처럼 리뷰 자체의 정리를 말할 때다.'''

[[questions.choices]]
text = "원 논문 [42]를 찾아 해당 결과의 조건(데이터·분할·지표·비교 대상)을 확인한 뒤 원 논문을 인용한다."
correct = true

[[questions.choices]]
text = "리뷰 논문을 인용하고 문장을 그대로 옮긴다. 리뷰는 전문가가 검토한 요약이기 때문이다."
feedback = "리뷰의 요약은 조건을 생략하고 때로 잘못 옮긴다. 수치 주장은 원문에서 확인한다."

[[questions.choices]]
text = "리뷰와 원 논문을 함께 인용하되, 원 논문은 읽지 않아도 된다."
feedback = "읽지 않은 논문을 인용하는 것은 원문을 확인하지 않은 인용이다. 조건이 다르면 주장이 틀린 채로 퍼진다."

[[questions.choices]]
text = "30%라는 수치는 빼고 \"크게 개선했다\"로 바꿔 리뷰를 인용한다."
feedback = "숫자를 지워도 확인하지 않은 주장이라는 사실은 바뀌지 않는다. 오히려 독자가 확인할 정보가 줄어든다."

[[questions]]
id = "tool-docs-over-books"
type = "single"
objective = 3
prompt = '''몇 년 전에 나온 교재의 예제대로 라이브러리 함수를 호출했더니 인자 이름이 없다는 오류가 났다. 먼저 할 일로 가장 적절한 것은?'''
explanation = '''도구의 사용법은 버전에 따라 바뀐다. 교재는 개념을 쌓는 데 쓰고, 도구의 현재 동작은 설치된 버전과 그 버전의 공식 문서로 확인한다. 이 책이 명령과 버전을 "집필 시점 예시"로 표시하고 공식 문서를 가리키는 이유다. 오래된 버전을 설치해 맞추는 것은 다른 의존성과 충돌하기 쉽고, 오류를 피해 인자를 지우면 동작이 조용히 바뀔 수 있다.'''

[[questions.choices]]
text = "설치된 버전을 확인하고, 그 버전의 공식 문서에서 함수의 현재 인자를 찾는다."
correct = true

[[questions.choices]]
text = "교재가 쓰인 시점의 버전으로 라이브러리를 내려 설치한다."
feedback = "다른 패키지와 충돌하기 쉽고 보안 수정도 받을 수 없다. 버전을 고정해야 한다면 lockfile로 관리하되, 먼저 현재 동작을 문서에서 확인한다."

[[questions.choices]]
text = "오류가 난 인자를 지우고 다시 실행한다."
feedback = "인자를 지우면 기본값이 쓰여 동작이 조용히 바뀔 수 있다. 그 인자가 무엇을 하던 것인지 문서에서 확인한다."

[[questions.choices]]
text = "교재에 오류가 있으니 다른 교재를 찾는다."
feedback = "교재의 개념 설명은 여전히 유효할 수 있다. 바뀐 것은 도구의 인터페이스다."

[[questions]]
id = "textbook-reading-scope"
type = "single"
objective = 2
prompt = '''9.2장의 조건수와 backward stability를 읽다가 막혀서, 이 부록에서 수백 쪽 분량의 수치해석 참고서를 골랐다. 가장 효율적인 읽기 방법은?'''
explanation = '''교재와 참고서는 처음부터 끝까지 읽는 책이 아니라, 지금 막힌 개념에 해당하는 장을 찾아 읽는 책이다. 막힌 질문(예: backward error가 왜 작으면 좋은가)을 적고, 목차와 색인에서 해당 장을 찾아 읽고, 연습문제 몇 개로 확인한 뒤 이 책의 장으로 돌아온다. 처음부터 다 읽으려 하면 필요한 개념에 닿기 전에 멈추기 쉽다.'''

[[questions.choices]]
text = "막힌 질문을 적고, 목차와 색인에서 해당 개념의 장을 찾아 읽은 뒤 연습문제 몇 개로 확인한다."
correct = true

[[questions.choices]]
text = "기초가 중요하므로 1장부터 순서대로 끝까지 읽은 뒤 9.2장으로 돌아온다."
feedback = "참고서를 통독하는 데는 몇 달이 걸린다. 지금 필요한 개념에서 출발하고, 그 장이 기대는 앞 장이 있으면 그때 거슬러 올라간다."

[[questions.choices]]
text = "각 장의 요약만 훑어 전체 구조를 파악한다."
feedback = "구조를 보는 데는 도움이 되지만, 막힌 개념을 이해하려면 해당 장의 본문과 예제를 읽어야 한다."

[[questions]]
id = "verify-suggested-references"
type = "multiple"
objective = 1
prompt = '''AI 도구에 "기상 예측 ML의 입문 리뷰 논문 5편"을 물어 목록을 받았다. 이 목록을 자신의 읽기 목록에 넣고 나중에 인용하기 전에 해야 할 일을 모두 고르시오.'''
explanation = '''AI 도구가 제시한 서지에는 존재하지 않는 논문, 저자·연도·학술지가 뒤섞인 서지가 섞일 수 있다. 읽기 목록에 넣기 전에 DOI·출판사 페이지·도서관 기록으로 서지가 실제로 있는지 확인하고, 인용하기 전에는 원문을 읽어 인용하려는 주장이 그 논문에 있는지 확인한다(23.8장, 23.12장). 피인용 수나 제목은 존재와 내용의 증거가 아니다.'''

[[questions.choices]]
text = "DOI나 출판사·도서관 기록에서 각 서지가 실제로 존재하는지 확인한다."
correct = true

[[questions.choices]]
text = "인용하기 전에 원문을 읽어, 인용하려는 내용이 그 논문에 있는지 확인한다."
correct = true

[[questions.choices]]
text = "제목이 주제와 맞으면 그대로 쓴다. 제목이 내용을 요약하기 때문이다."
feedback = "그럴듯한 제목은 존재의 증거가 아니다. 실제로 없는 논문도 그럴듯한 제목을 가질 수 있다."

[[questions.choices]]
text = "AI 도구에 같은 질문을 한 번 더 해서 같은 목록이 나오면 확인된 것으로 본다."
feedback = "같은 도구가 같은 답을 반복해도 외부 근거가 아니다. 서지는 출판 기록으로 확인한다."
