# 부록 E 실패 사례 갤러리 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "window-split-leak"
type = "single"
objective = 1
prompt = '''센서 시계열에서 길이 100, stride 1인 window를 만들고 window 단위로 무작위 8:2 분할을 했더니 시험 오차가 매우 작게 나왔다. 가장 그럴듯한 이유는?'''
explanation = '''stride 1인 window는 이웃 window와 99개 시점을 공유한다. 무작위로 나누면 거의 모든 시험 window의 바로 옆 window가 학습에 들어가 있어, 모델은 거의 같은 입력을 이미 본 셈이다. 이것은 데이터 누수이고 시험 오차는 새 시점에 대한 성능을 재지 못한다. 시간 순서로 나누고 경계에 window 길이 이상의 gap을 둔다(15.4장, 16.7장).'''

[[questions.choices]]
text = "시험 window마다 거의 같은 시점을 공유하는 이웃 window가 학습 데이터에 들어 있기 때문이다."
correct = true

[[questions.choices]]
text = "stride 1로 window 수가 늘어 학습 데이터가 충분해졌기 때문이다."
feedback = "window 수는 늘었지만 서로 거의 같은 내용이라 독립인 정보는 거의 늘지 않았다. 낮은 오차의 원인은 학습·시험의 중복이다."

[[questions.choices]]
text = "무작위 분할이 시간 순서 분할보다 원래 더 정확한 평가이기 때문이다."
feedback = "시계열에서 무작위 분할은 미래 정보를 학습에 섞는다. 배포 상황(과거로 미래를 예측)을 흉내 내는 것은 시간 순서 분할이다."

[[questions.choices]]
text = "모델이 시계열의 계절성을 잘 학습했기 때문이다."
feedback = "그럴 수도 있지만 이 설정에서는 그것을 확인할 수 없다. 누수가 있으면 계절성을 배웠는지와 무관하게 오차가 작아진다."

[[questions]]
id = "test-reuse-cases"
type = "multiple"
objective = 1
prompt = '''다음 중 선택에 쓴 데이터로 최종 성능을 재는(시험·보정 데이터를 재사용하는) 실패를 모두 고르라.'''
explanation = '''시험 데이터로 정규화 강도를 고르면 그 점수에는 선택의 운이 섞여 부풀려진다. conformal prediction의 보정 데이터를 모델 선택에도 쓰면 교환가능성이 깨져 coverage 보장이 사라진다. 학습 데이터로 계산한 표준화 통계를 시험 데이터에 적용하는 것과, validation으로 고르고 test로 한 번 평가하는 것은 올바른 절차다.'''

[[questions.choices]]
text = "시험 데이터의 점수를 보고 정규화 강도 $\\lambda$를 고른다."
correct = true

[[questions.choices]]
text = "conformal prediction의 보정 데이터로 두 모델 중 하나를 고른 뒤 같은 데이터로 구간을 보정한다."
correct = true

[[questions.choices]]
text = "학습 데이터로 계산한 평균·표준편차로 시험 데이터를 표준화한다."
feedback = "통계를 학습 데이터에서만 추정하고 시험 데이터에는 적용만 하므로 올바르다. 누수는 전체 데이터로 통계를 계산할 때 생긴다."

[[questions.choices]]
text = "validation으로 하이퍼파라미터를 고른 뒤 test에서 한 번 평가해 보고한다."
feedback = "이것이 권장 절차다. 선택과 최종 평가에 서로 다른 데이터를 썼다."

[[questions]]
id = "same-structure-across-fields"
type = "single"
objective = 2
prompt = '''배터리 연구에서 "같은 셀의 다른 사이클", 의료에서 "같은 환자의 반복 측정", 화학에서 "같은 골격의 분자"가 학습과 시험에 함께 들어간다. 세 실패에 공통으로 맞는 대처는?'''
explanation = '''세 경우 모두 샘플 사이에 그룹 구조가 있어 같은 그룹의 샘플끼리 매우 비슷하다. 일반화하려는 대상이 "새 셀·새 환자·새 골격"이면 그 그룹 단위로 분할(group split)해야 하고, 학습·시험의 그룹 ID 교집합이 비었는지 코드로 확인한다. 샘플 수를 늘리거나 seed를 바꾸거나 표준화하는 것은 그룹 간 누수를 없애지 않는다.'''

[[questions.choices]]
text = "일반화 대상인 그룹(셀·환자·골격) 단위로 분할하고, 학습·시험의 그룹 ID가 겹치지 않는지 확인한다."
correct = true

[[questions.choices]]
text = "샘플 단위 무작위 분할을 여러 seed로 반복해 평균을 낸다."
feedback = "seed를 바꿔도 매번 같은 그룹이 양쪽에 들어가므로 누수가 반복될 뿐이다. 변동을 재는 것은 누수를 막는 것과 다르다."

[[questions.choices]]
text = "데이터를 더 모아 샘플 수를 늘린다."
feedback = "같은 그룹에서 샘플을 더 모으면 누수가 줄지 않는다. 그룹이 몇 개인지가 일반화 평가의 실제 표본 수에 가깝다."

[[questions.choices]]
text = "특징을 표준화해 그룹 간 차이를 없앤다."
feedback = "표준화는 척도만 맞출 뿐 같은 그룹 샘플 사이의 유사성을 없애지 않는다. 분할 단위가 문제다."

[[questions]]
id = "single-seed-claim"
type = "single"
objective = 3
prompt = '''seed 하나로 돌린 실험에서 제안 방법이 baseline보다 정확도가 0.3%p 높았다. 이 결과를 점검표 항목으로 바꿀 때 가장 적절한 확인 방법은?'''
explanation = '''단일 seed의 차이는 학습의 무작위성(초기화·데이터 순서)과 분할의 우연만으로도 생길 수 있다. 여러 seed와 분할에서 두 방법을 **같은 조건으로 짝지어** 돌리고, 짝지은 차이의 평균과 표준오차(또는 신뢰구간)를 보고해야 우열을 말할 수 있다(12.5장, 23.6장). 유의성 검정만 하거나 가장 좋은 seed를 고르는 것은 같은 실패를 다른 형태로 반복한다.'''

[[questions.choices]]
text = "여러 seed와 분할에서 두 방법을 짝지어 돌리고, 차이의 평균과 표준오차를 보고한다."
correct = true

[[questions.choices]]
text = "제안 방법의 seed를 여러 개 돌려 가장 좋은 결과를 보고한다."
feedback = "가장 좋은 seed만 고르면 운을 선택한 것이다. baseline에도 같은 수의 seed를 쓰고 분포를 비교해야 한다."

[[questions.choices]]
text = "같은 seed로 한 번 더 돌려 같은 숫자가 나오는지 확인한다."
feedback = "같은 seed로 같은 숫자가 나오는 것은 결정성 확인이지 우열의 근거가 아니다. 변동은 seed를 바꿔야 보인다."

[[questions.choices]]
text = "차이가 양수이므로 추가 확인 없이 개선으로 보고한다."
feedback = "0.3%p는 seed 간 변동보다 작을 수 있다. 변동의 크기를 모르면 차이의 부호도 믿을 수 없다."
