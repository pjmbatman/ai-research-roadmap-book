# 부록 G 체크리스트 모음 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "too-good-to-be-true"
type = "single"
objective = 1
prompt = '''이전 연구들이 정확도 70% 안팎에 머문 분류 문제에서, 새 모델이 처음 돌린 실험에서 99%를 냈다. 다음으로 가장 먼저 펼칠 체크리스트는?'''
explanation = '''기대보다 훨씬 좋은 결과는 누수와 평가 버그를 가장 먼저 의심할 때다(17.9장). 같은 대상(환자·셀·시료)에서 나온 표본이 train과 test에 나뉘어 들어갔거나, 정답과 연결된 정보가 입력에 있거나, test로 무엇인가를 골랐을 가능성을 데이터 분할과 누수 감사 체크리스트로 확인한다(15.4장). 같은 설정으로 다시 돌리는 재현성 점검은 누수까지 그대로 재현할 뿐이고, 제출 전 체크리스트는 결과가 믿을 만하다는 것을 확인한 뒤의 일이다.'''

[[questions.choices]]
text = "데이터 분할과 누수 감사"
correct = true

[[questions.choices]]
text = "재현성: 같은 설정으로 다시 돌려 같은 99%가 나오는지 본다"
feedback = "누수가 있으면 다시 돌려도 같은 99%가 나온다. 재현된다는 것은 결과가 옳다는 증거가 아니다."

[[questions.choices]]
text = "논문 제출 전: 결과가 좋으니 서둘러 원고를 준비한다"
feedback = "결과가 옳은지 확인하기 전에 원고를 쓰면, 누수가 발견되었을 때 주장 전체를 거둬야 한다."

[[questions.choices]]
text = "점검할 필요 없다. 학습이 잘 된 것이다."
feedback = "성능이 나쁠 때는 누구나 코드를 의심하지만 좋을 때는 의심하지 않는다. 체크리스트는 좋은 결과에도 적용한다."

[[questions]]
id = "one-change-before-many"
type = "single"
objective = 2
prompt = '''손실이 줄지 않자 동료가 학습률, batch 크기, 정규화 방식, 초기화를 한꺼번에 바꿨고 학습이 되기 시작했다. 학습 실패 진단 체크리스트의 관점에서 이 상황의 가장 큰 문제는?'''
explanation = '''한 번에 여러 설정을 바꾸면 무엇이 필요했는지 알 수 없다. 실제 원인이 다른 곳(예: 데이터의 결측 처리, label 정렬)에 있었다면 그 버그는 남아 있고, 바꾼 설정들은 근거 없는 기본값이 된다. 다음에 같은 증상이 다른 원인으로 나타나면 네 가지를 모두 다시 시도하게 된다(17.9장 실패 사례). 체크리스트는 작은 설정에서 데이터 → baseline → 초기 손실 → batch 하나 과적합 순으로 확인하고, 디버깅 기록에 한 번에 하나씩 바꾼 실험과 그 예측을 남기게 한다.'''

[[questions.choices]]
text = "무엇이 원인이었는지 알 수 없고, 진짜 원인(예: 데이터 처리 버그)이 남아 있을 수 있다."
correct = true

[[questions.choices]]
text = "문제없다. 학습이 되기 시작했으니 진단은 끝났다."
feedback = "학습이 된다는 것은 증상이 사라졌다는 뜻이지 원인을 찾았다는 뜻이 아니다. 증상을 숨기는 수정과 원인을 고친 수정은 구별되어야 한다."

[[questions.choices]]
text = "네 가지를 바꾼 것은 괜찮지만 seed를 고정하지 않은 것이 문제다."
feedback = "seed 고정도 필요하지만, 이 상황의 핵심은 여러 변수를 동시에 바꿔 원인을 분리할 수 없게 된 것이다."

[[questions.choices]]
text = "큰 모델에서 바꿨어야 했다. 작은 설정에서는 원인이 드러나지 않는다."
feedback = "반대다. 진단은 가장 작고 빠른 설정에서 실패를 재현해 하는 것이 기본이다. 큰 설정에서는 가설 하나를 시험하는 데 몇 시간이 걸린다."

[[questions]]
id = "before-claiming-better"
type = "multiple"
objective = 2
prompt = '''결과 표에 "제안 방법 B가 baseline A보다 낫다"고 쓰기 전에 평가와 결과 보고 체크리스트에서 확인해야 할 것을 모두 고르시오.'''
explanation = '''우열은 평균의 대소가 아니라 독립 단위로 짝지은 차이와 그 구간으로 판정하고, 구간이 0을 포함하면 판정을 보류한다(16.1장, 23.6장). "±"가 표준편차인지 표준오차인지 밝혀야 독자가 정밀도를 바르게 읽는다(12.5장). 두 방법의 탐색 예산이 다르면 차이의 일부는 방법이 아니라 튜닝 노력이다(23.5장). 가장 좋은 seed 하나는 변동을 숨기고, smoothing된 학습 곡선의 차이는 원본의 잡음 범위 안에 있을 수 있다(17.8장).'''

[[questions.choices]]
text = "독립 단위로 짝지은 차이의 구간이 0을 포함하지 않는가"
correct = true

[[questions.choices]]
text = "표의 \"±\"가 표준편차인지 표준오차인지 밝혔는가"
correct = true

[[questions.choices]]
text = "A와 B에 같은 탐색 예산을 썼는가"
correct = true

[[questions.choices]]
text = "B의 seed 중 가장 좋은 결과가 A의 평균보다 높은가"
feedback = "최고값과 평균을 비교하면 seed 수만 늘려도 B가 이기게 된다. 같은 방식으로 요약한 값끼리, 짝지은 차이로 비교한다."

[[questions.choices]]
text = "smoothing 가중치 0.99로 그린 검증 곡선에서 B가 A보다 위에 있는가"
feedback = "smoothing된 곡선의 차이는 원본의 잡음 범위 안에 있을 수 있다. 판정은 독립 평가 결과의 구간으로 한다."

[[questions]]
id = "checklist-evidence"
type = "single"
objective = 3
prompt = '''누수 감사 체크리스트의 "같은 독립 단위가 train과 test에 동시에 없다" 항목 옆에 남길 기록으로 가장 좋은 것은?'''
explanation = '''체크리스트의 목적은 나중에 다른 사람(또는 석 달 뒤의 자신)이 확인을 다시 할 수 있게 하는 것이다. 확인한 방법(스크립트), 결과(교집합 0), 시점(커밋과 날짜)이 있으면 그 확인을 재현할 수 있고, 데이터나 분할이 바뀌었을 때 다시 돌릴 수 있다. 체크 표시나 확신의 표현, 누가 봤다는 사실만으로는 무엇을 어떻게 확인했는지 알 수 없다.'''

[[questions.choices]]
text = "☑ 확인함"
feedback = "무엇으로 어떻게 확인했는지 남지 않는다. 분할이 바뀐 뒤에도 같은 체크 표시가 남는다."

[[questions.choices]]
text = "셀 ID 교집합 0개 (scripts/check_split.py, 커밋 39c3192, 2026-11-07)"
correct = true

[[questions.choices]]
text = "무작위로 나눴으므로 겹칠 리 없음"
feedback = "무작위 분할이야말로 같은 셀의 다른 사이클이 train과 test에 흩어지게 만든다. 근거가 아니라 위험 요인이다."

[[questions.choices]]
text = "동료가 코드를 읽고 문제없다고 함"
feedback = "리뷰는 도움이 되지만, 어떤 데이터와 어떤 분할에서 무엇을 확인했는지가 남지 않으면 다시 확인할 수 없다."
