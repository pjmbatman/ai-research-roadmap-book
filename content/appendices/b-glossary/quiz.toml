# 부록 B 용어집 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "normalization-vs-regularization"
type = "single"
objective = 3
prompt = '''한 논문에 "weight decay로 정규화했다"와 "각 블록 앞에 정규화 층(LayerNorm)을 두었다"는 문장이 함께 있다. 두 '정규화'에 대한 해석으로 옳은 것은?'''
explanation = '''한국어 '정규화'는 두 영어 단어를 함께 옮긴다. weight decay는 목적함수에 $\lambda \lVert \theta \rVert^2$ 같은 벌점을 더해 해를 바꾸는 regularization이고, LayerNorm은 활성값의 평균·분산을 맞춰 척도를 정리하는 normalization이다. 하나는 과적합을 다루고 다른 하나는 학습의 수치적 안정성을 다룬다. 실험 기록에는 영어 원어나 기법 이름을 함께 적어야 혼동이 없다.'''

[[questions.choices]]
text = "둘 다 과적합을 막기 위해 목적함수에 벌점 항을 더하는 같은 종류의 기법이다."
feedback = "LayerNorm은 목적함수에 항을 더하지 않는다. 층 안에서 활성값의 척도를 맞추는 연산이다."

[[questions.choices]]
text = "앞의 것은 목적함수에 벌점을 더하는 regularization이고, 뒤의 것은 활성값의 척도를 맞추는 normalization이다."
correct = true

[[questions.choices]]
text = "둘 다 입력 데이터를 평균 0, 분산 1로 맞추는 전처리를 가리킨다."
feedback = "weight decay는 데이터가 아니라 파라미터의 크기에 벌점을 준다. 입력 표준화와도 다르다."

[[questions.choices]]
text = "앞의 것은 normalization이고, 뒤의 것은 regularization이다."
feedback = "방향이 반대다. 목적함수에 항이 더해지는 쪽(weight decay)이 regularization이다."

[[questions]]
id = "interval-that-shrinks"
type = "single"
objective = 1
prompt = '''잡음이 있는 회귀에서 같은 조건의 데이터를 계속 늘린다. 폭이 0에 가까워지는 구간은 어느 것인가?'''
explanation = '''신뢰구간은 평균이나 파라미터처럼 **고정된 미지량**을 덮는 구간이어서 데이터가 늘면 추정 불확실성이 줄고 폭이 0으로 간다. 예측 구간은 **새 관측값**을 덮어야 하므로 관측 잡음(aleatoric 불확실성)의 폭이 남는다. 데이터가 아무리 많아도 잡음의 표준편차 아래로 좁아지지 않는다.'''

[[questions.choices]]
text = "조건부 평균의 신뢰구간"
correct = true

[[questions.choices]]
text = "새 관측값의 예측 구간"
feedback = "새 관측에는 데이터를 늘려도 사라지지 않는 관측 잡음이 들어 있다. 예측 구간은 그 폭 아래로 좁아지지 않는다."

[[questions.choices]]
text = "둘 다 같은 속도로 0에 가까워진다."
feedback = "두 구간은 덮는 대상이 다르다. 예측 구간에는 파라미터 불확실성 외에 관측 잡음이 더해진다."

[[questions.choices]]
text = "둘 다 폭이 줄지 않는다. 구간의 폭은 신뢰수준만으로 정해진다."
feedback = "신뢰수준을 고정해도 표본 수가 늘면 추정량의 표준오차가 줄어 신뢰구간이 좁아진다."

[[questions]]
id = "precision-two-senses"
type = "multiple"
objective = 3
prompt = '''이 책에서 '정밀도(precision)'라는 단어가 가리키는 것을 모두 고르라.'''
explanation = '''분류 평가에서 precision은 양성으로 예측한 것 중 실제 양성의 비율 $\mathrm{TP}/(\mathrm{TP}+\mathrm{FP})$다. 수치 계산에서 정밀도는 float32·float64·bf16 같은 부동소수점 형식이 담는 유효 자릿수를 뜻한다. 실제 양성 중 맞힌 비율은 재현율(recall)이고, 예측 확률이 실제 빈도와 맞는 정도는 보정(calibration)이다.'''

[[questions.choices]]
text = '''양성으로 예측한 샘플 중 실제 양성의 비율 $\mathrm{TP}/(\mathrm{TP}+\mathrm{FP})$'''
correct = true

[[questions.choices]]
text = "float32·bf16 같은 부동소수점 형식이 표현하는 유효 자릿수"
correct = true

[[questions.choices]]
text = '''실제 양성 중 양성으로 맞힌 비율 $\mathrm{TP}/(\mathrm{TP}+\mathrm{FN})$'''
feedback = "이것은 재현율(recall)이다. 분모가 '실제 양성'인지 '양성 예측'인지로 구분한다."

[[questions.choices]]
text = "예측 확률 0.8인 사례 중 실제로 80%가 양성인 정도"
feedback = "이것은 보정(calibration)이다. precision은 하나의 문턱값에서 계산한 비율이고 확률값 자체의 정직성은 재지 않는다."

[[questions]]
id = "which-uncertainty-shrinks"
type = "single"
objective = 2
prompt = '''같은 측정 장비와 조건으로 학습 데이터를 10배 모았다. 줄어들 것으로 기대할 수 있는 불확실성은?'''
explanation = '''epistemic 불확실성은 모델이 아직 모르는 데서 오므로(파라미터·모델 구조) 데이터가 늘면 줄어들 수 있다. aleatoric 불확실성은 데이터 생성 과정 자체의 무작위성(측정 잡음 등)이어서 같은 장비·조건으로 데이터를 늘려도 줄지 않는다. 줄이려면 측정 자체를 바꿔야 한다. 정의의 맥락은 12.3장과 21.1장에 있다.'''

[[questions.choices]]
text = "epistemic 불확실성"
correct = true

[[questions.choices]]
text = "aleatoric 불확실성"
feedback = "측정 잡음은 데이터를 늘려도 그대로다. 같은 장비로는 aleatoric 불확실성이 줄지 않는다."

[[questions.choices]]
text = "둘 다 같은 비율로 줄어든다."
feedback = "두 불확실성은 원천이 다르다. 데이터 양에 반응하는 것은 모델의 무지에서 오는 쪽뿐이다."
