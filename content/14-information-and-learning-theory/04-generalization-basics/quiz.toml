# 14.4 일반화의 기초 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "training-risk-optimism"
type = "single"
objective = 1
prompt = '''데이터 15개로 7차 다항식을 최소제곱으로 맞췄더니 학습 MSE가 0.04였다. 데이터의 잡음 분산은 0.09로 알려져 있다. 이 모델의 모집단 위험(새 데이터에서의 기대 MSE)에 대해 옳은 것은?'''
explanation = '''같은 데이터로 고른 모델의 경험 위험은 모집단 위험보다 체계적으로 작다. 학습 MSE가 잡음 분산 0.09보다도 작다는 것은 잡음까지 맞췄다는 신호이고, 어떤 모델도 새 데이터에서 잡음 분산보다 작은 기대 MSE를 낼 수 없다. 따라서 모집단 위험은 0.09 이상이고, 본문 실험에서는 중앙값이 0.6을 넘었다. 경험 위험이 모집단 위험의 불편 추정량인 것은 데이터를 보기 전에 정한 함수에 대해서만이다.'''

[[questions.choices]]
text = "적어도 잡음 분산 0.09 이상이고, 학습 MSE보다 훨씬 클 가능성이 높다."
correct = true

[[questions.choices]]
text = "경험 위험은 모집단 위험의 불편 추정량이므로 약 0.04다."
feedback = "불편성은 데이터를 보기 전에 고정한 함수에 대해서만 성립한다. 같은 데이터로 고른 모델의 경험 위험은 낙관적으로 편향된다."

[[questions.choices]]
text = "학습 MSE가 잡음보다 작으므로 이 모델은 잡음까지 정확히 예측하는 좋은 모델이다."
feedback = "잡음은 새 데이터에서 다시 나타나지 않는 무작위 성분이다. 그것을 맞췄다는 것은 일반화가 아니라 암기다."

[[questions]]
id = "error-decomposition"
type = "multiple"
objective = 2
prompt = '''오차 분해(근사·추정·최적화 오차)의 관점에서 옳은 설명을 모두 고르시오.'''
explanation = '''근사 오차는 가설 집합이 참 관계를 표현하지 못해 생기므로 데이터를 늘려도 줄지 않고, 모델족을 넓혀야 줄어든다. 추정 오차는 유한한 데이터로 집합 안의 최선을 찾아야 해서 생기며, 데이터가 늘면 줄고 집합이 크면 커진다. 측정 잡음(Bayes 위험)은 어떤 모델도 줄일 수 없다. 최적화 오차는 학습 손실을 정확히 최소화하지 못해 생기는 것으로, 학습을 끝까지 하면 늘 0 이하로 줄어드는 것은 아니며 early stopping처럼 오히려 이득이 될 때도 있다.'''

[[questions.choices]]
text = "근사 오차는 데이터를 늘려도 줄지 않는다."
correct = true

[[questions.choices]]
text = "가설 집합을 키우면 근사 오차는 줄 수 있지만 추정 오차는 커질 수 있다."
correct = true

[[questions.choices]]
text = "충분히 큰 모델과 충분한 데이터가 있으면 측정 잡음에 의한 오차도 0으로 줄일 수 있다."
feedback = "측정 잡음에 의한 오차는 Bayes 위험으로, 어떤 모델도 줄일 수 없는 하한이다(제곱손실에서는 잡음 분산)."

[[questions.choices]]
text = "학습 오차와 시험 오차가 모두 높으면 데이터를 더 모으는 것이 가장 먼저 할 일이다."
feedback = "두 오차가 모두 높으면 근사 오차나 최적화 오차를 먼저 의심한다. 데이터 추가는 학습–시험 간극(추정 오차)이 클 때의 처방이다."

[[questions]]
id = "bias-variance-degree"
type = "single"
objective = 2
prompt = '''데이터 20개로 다항식 회귀를 반복 실험해 bias²와 variance를 쟀더니, 차수 1에서 bias² 0.156·variance 0.032, 차수 6에서 bias² 0.001·variance 0.708이었다. 잡음 분산은 0.09다. 옳은 해석은?'''
explanation = '''기대 시험 MSE = bias² + variance + 잡음이므로 차수 1은 약 0.28, 차수 6은 약 0.80이다. 차수 6은 bias가 거의 없지만 데이터가 바뀔 때마다 모델이 크게 흔들려(variance) 시험 오차가 더 크다. 해결은 데이터를 늘리거나(variance가 줄어든다) 정규화로 실질적인 용량을 줄이는 것이다.'''

[[questions.choices]]
text = "차수 6의 기대 시험 MSE(약 0.80)가 차수 1(약 0.28)보다 크다. variance가 지배적이므로 데이터를 늘리거나 정규화하면 개선될 수 있다."
correct = true

[[questions.choices]]
text = "차수 6은 bias가 거의 0이므로 더 좋은 모델이다."
feedback = "bias만으로는 시험 오차를 알 수 없다. variance 0.708이 더해져 시험 MSE는 차수 1보다 크다."

[[questions.choices]]
text = "차수 1의 문제는 variance이므로 데이터를 늘리면 해결된다."
feedback = "차수 1은 bias(근사 오차)가 지배적이다. 직선은 데이터를 아무리 늘려도 사인 곡선을 표현하지 못한다."

[[questions]]
id = "hoeffding-sample-size"
type = "numeric"
objective = 3
prompt = '''데이터를 보기 전에 정한 분류기 하나의 오류율을 시험 집합으로 추정한다. Hoeffding 부등식 $P(\lvert\hat R_N - R\rvert > \epsilon) \le 2e^{-2N\epsilon^2}$으로 $\epsilon = 0.05$, $\delta = 0.05$를 보장하려면 시험 표본이 최소 몇 개 필요한가? (정수로 올림)'''
answer = 738
tolerance = 0
slider = { min = 100, max = 2000, step = 1, unit = "개" }
explanation = '''$2e^{-2N\epsilon^2} \le \delta$를 풀면 $N \ge \log(2/\delta) / (2\epsilon^2) = \log 40 / 0.005 \approx 737.8$이므로 738개다. 분류기 100개 중 하나를 같은 시험 집합으로 고른다면 union bound로 $\log(2 \cdot 100/\delta)/(2\epsilon^2) \approx 1659$개가 필요하다. 신뢰 폭은 $1/\sqrt{N}$으로 줄어들므로, 폭을 절반으로 줄이려면 표본이 4배 필요하다.'''

[[questions]]
id = "vc-dimension-plane"
type = "numeric"
objective = 3
prompt = '''평면 $\mathbb{R}^2$의 선형 분류기 $\mathrm{sign}(w_1 x_1 + w_2 x_2 + b)$ (bias 포함) 집합의 VC 차원은?'''
answer = 3
tolerance = 0
slider = { min = 1, max = 6, step = 1 }
explanation = '''일직선 위에 있지 않은 점 3개에는 $2^3 = 8$가지 레이블을 모두 직선으로 나눌 수 있다. 점 4개는 어떻게 놓아도 나눌 수 없는 레이블이 있다(예: 사각형의 대각선 꼭짓점끼리 같은 레이블인 XOR 배치). 그래서 VC 차원은 3이고, 일반적으로 $\mathbb{R}^d$의 선형 분류기는 $d + 1$이다. 2를 답하면 bias의 자유도를 빠뜨린 것이고, 4는 XOR 배치를 놓친 것이다.'''

[[questions]]
id = "no-free-lunch"
type = "single"
objective = 3
prompt = '''no free lunch 정리가 연구 실무에 주는 가장 정확한 함의는?'''
explanation = '''가능한 모든 목표 함수에 대해 균등하게 평균하면 학습 데이터 밖에서 모든 알고리즘의 기대 성능이 같다. 따라서 어떤 알고리즘의 일반화는 그 알고리즘의 귀납적 편향이 실제 문제의 구조와 맞는 데서 온다. 이 정리는 알고리즘 비교가 무의미하다는 뜻이 아니라, 비교 결과가 문제(데이터 분포)에 묶여 있다는 뜻이다.'''

[[questions.choices]]
text = "일반화는 알고리즘의 귀납적 편향이 문제의 구조와 맞을 때 생기므로, 어떤 가정을 넣었는지와 그것이 문제에 맞는지를 따져야 한다."
correct = true

[[questions.choices]]
text = "모든 알고리즘의 성능이 같으므로 실제 문제에서도 알고리즘을 비교할 필요가 없다."
feedback = "정리는 모든 목표 함수에 대해 균등하게 평균한 경우의 이야기다. 실제 문제는 특정한 구조를 가지므로 알고리즘 사이에 차이가 생긴다."

[[questions.choices]]
text = "충분히 큰 신경망은 모든 문제에서 다른 알고리즘보다 낫다."
feedback = "no free lunch는 정확히 이런 보편적 우위가 없다는 정리다. 큰 신경망이 잘되는 문제는 그 귀납적 편향이 맞는 문제다."

[[questions]]
id = "random-labels-capacity"
type = "single"
objective = 3
prompt = '''어떤 신경망이 이미지의 레이블을 무작위로 바꾼 데이터에서도 학습 정확도 100%에 도달했다. 같은 신경망이 진짜 레이블에서 시험 정확도 95%를 냈다. 이 두 사실에서 이끌어 낼 수 있는 것은?'''
explanation = '''무작위 레이블을 모두 맞출 수 있다면 그 함수 집합의 Rademacher 복잡도는 최댓값에 가깝다. 용량 기반 bound($R \le \hat R + 2\mathfrak{R} + \cdots$)는 이때 1 이상이 되어 아무것도 보장하지 못한다(vacuous). 그런데도 진짜 레이블에서 잘 일반화했으므로, 그 이유는 함수 집합의 크기가 아닌 다른 데서(데이터의 구조, 학습 알고리즘이 고르는 해의 성질) 찾아야 한다. 이것이 14.5장의 출발점이다.'''

[[questions.choices]]
text = "이 신경망의 일반화는 용량(VC 차원·Rademacher 복잡도) 기반 bound로는 설명되지 않는다."
correct = true

[[questions.choices]]
text = "무작위 레이블을 맞췄으므로 진짜 레이블에서의 95%도 암기의 결과이고 믿을 수 없다."
feedback = "95%는 학습에 쓰지 않은 시험 데이터에서 잰 값이다. 무작위 레이블 실험은 용량이 크다는 것을 보여 줄 뿐, 시험 성능을 무효로 만들지 않는다."

[[questions.choices]]
text = "무작위 레이블에서의 시험 정확도도 높을 것이다."
feedback = "무작위 레이블은 입력과 무관하므로 시험 정확도는 우연 수준(클래스 수의 역수)에 머문다."
