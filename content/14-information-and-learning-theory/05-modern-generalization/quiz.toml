# 14.5 현대 딥러닝의 일반화와 스케일링 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "double-descent-peak"
type = "numeric"
objective = 1
prompt = '''학습 표본 50개로 선형 회귀를 한다. 모델이 쓰는 특징 수 $p$를 1부터 200까지 늘리며 최소 노름 최소제곱 해(`pinv`)의 시험 오차를 그리면, 시험 오차의 봉우리는 대략 $p$가 얼마일 때 나타나는가?'''
answer = 50
tolerance = 2
slider = { min = 1, max = 200, step = 1 }
explanation = '''봉우리는 보간 임계점 $p \approx N = 50$에서 나타난다. 이때 학습 데이터를 정확히 맞추는 해가 하나뿐이고, 그 해를 구하려면 $\mathbf{X}$의 0에 가까운 가장 작은 특잇값으로 잡음을 나누어야 하므로 잡음이 크게 증폭된다. $p$가 더 커지면 보간하는 해가 많아지고 그중 노름이 가장 작은 해를 고르므로 시험 오차가 다시 내려간다. 100(표본 수의 두 배)이나 200(전체 특징 수)은 봉우리의 위치와 관계가 없다.'''

[[questions]]
id = "ridge-removes-peak"
type = "single"
objective = 1
prompt = '''최소 노름 회귀의 double descent 봉우리(보간 임계점 $p \approx N$)에 대해 옳은 것은?'''
explanation = '''봉우리는 정규화 없이 데이터를 정확히 맞추는 해를 고르는 추정량에서 잡음이 가장 작은 특잇값으로 증폭되어 생긴다. 적절한 ridge 정규화를 쓰면 작은 특잇값 방향이 억제되어 봉우리가 사라진다(본문에서 λ = 1일 때 최대 1.21). 따라서 봉우리는 모델 크기 자체의 저주가 아니라 특정한 추정 방식의 성질이다.'''

[[questions.choices]]
text = "적절한 ridge 정규화를 쓰면 봉우리가 사라지거나 크게 낮아진다."
correct = true

[[questions.choices]]
text = "모델이 데이터를 정확히 맞추기 시작하는 지점이므로, 어떤 학습 방법을 써도 피할 수 없다."
feedback = "같은 모델 크기에서도 ridge를 쓰면 봉우리가 사라진다. 봉우리는 정규화 없는 보간 추정량의 성질이다."

[[questions.choices]]
text = "봉우리 뒤의 두 번째 하강은 언제나 첫 번째 하강의 최솟값보다 낮다."
feedback = "그렇지 않다. 본문 예에서 과매개변수화 영역의 최소(0.76)는 작은 모델의 최소(0.67)보다 높았다. 어느 쪽이 나은지는 신호의 구조와 잡음에 달려 있다."

[[questions.choices]]
text = "봉우리는 파라미터 수가 늘어 variance가 단조 증가하기 때문이므로, 파라미터가 더 많아질수록 더 높아진다."
feedback = "봉우리 뒤에서는 최소 노름 해의 노름이 줄고 시험 오차도 다시 내려간다. 파라미터 수가 곧 용량은 아니다."

[[questions]]
id = "gd-min-norm"
type = "single"
objective = 1
prompt = '''과소결정 최소제곱 문제($p > N$)에 경사하강을 적용해 학습 손실을 0으로 만들었다. 초기값이 $\mathbf{w}_0 = \mathbf{0}$일 때 도달하는 해는?'''
explanation = '''경사하강의 업데이트 $-\eta\mathbf{X}^\top(\mathbf{X}\mathbf{w} - \mathbf{y})$는 항상 $\mathbf{X}$의 행 공간 안에 있다. 0에서 시작하면 해도 행 공간 안에 머물고, 행 공간 안에서 데이터를 보간하는 해는 하나뿐인데 그것이 최소 노름 해 $\mathbf{X}^{+}\mathbf{y}$다. 무작위 초기값에서 시작하면 초기값의 영공간 성분이 그대로 남아 다른 보간 해에 도달한다.'''

[[questions.choices]]
text = '''데이터를 보간하는 해 중 $\ell_2$ 노름이 가장 작은 해 $\mathbf{X}^{+}\mathbf{y}$'''
correct = true

[[questions.choices]]
text = "보간하는 해가 무수히 많으므로, 실행마다 무작위로 그중 하나에 도달한다."
feedback = "경사하강은 결정적이고, 영공간 방향으로는 한 번도 움직이지 않는다. 0에서 시작하면 항상 같은 해(최소 노름 해)에 간다."

[[questions.choices]]
text = "참 계수 w_true"
feedback = "데이터가 과소결정이면 보간하는 해 중 어느 것이 참값인지 데이터만으로는 알 수 없다. 경사하강이 고르는 것은 최소 노름 해이고, 참값과는 일반적으로 다르다."

[[questions.choices]]
text = "노름이 가장 큰 해"
feedback = "방향이 반대다. 0에서 시작해 행 공간 안에서만 움직이므로 노름이 가장 작은 해에 간다."

[[questions]]
id = "lazy-regime"
type = "single"
objective = 1
prompt = '''NTK(neural tangent kernel) 관점이 설명하는 것과 설명하지 못하는 것을 바르게 짝지은 것은?'''
explanation = '''특정한 스케일로 초기화한 무한 폭 신경망에서는 파라미터가 거의 움직이지 않아(lazy regime) 학습이 고정된 커널을 쓰는 커널 회귀와 같아진다. 그래서 과매개변수화 신경망을 경사하강으로 최적화할 수 있는 이유를 설명한다. 하지만 이 영역에서는 신경망이 특징을 학습하지 않으므로, 신경망이 고정 커널 방법보다 잘하는 이유나 학습된 표현의 전이는 설명하지 못한다(Chizat 외, 2019).'''

[[questions.choices]]
text = "과매개변수화 신경망을 경사하강으로 학습할 수 있는 이유는 설명하지만, 특징 학습이 주는 이점은 설명하지 못한다."
correct = true

[[questions.choices]]
text = "신경망이 학습 중에 데이터에 맞는 특징을 만드는 과정을 설명하지만, 최적화가 수렴하는 이유는 설명하지 못한다."
feedback = "반대다. NTK 영역에서는 커널(특징)이 학습 중에 고정되어 있다. 특징이 바뀌는 것은 lazy regime 밖의 feature learning이다."

[[questions.choices]]
text = "유한한 크기의 실제 신경망의 일반화를 정확히 예측한다."
feedback = "NTK는 무한 폭 극한에서 엄밀하고, 유한한 실제 모델에는 근사로만 적용된다."

[[questions]]
id = "scaling-floor"
type = "single"
objective = 2
prompt = '''데이터 크기 25–200 범위에서 시험 손실이 로그–로그 그림의 직선(순수 멱법칙)에 잘 맞았다. 이 직선으로 데이터 크기 3200의 손실을 예측하면 실제와 비교해 어떤 오류가 생기기 쉬운가?'''
explanation = '''대부분의 학습 문제에는 데이터의 잡음이나 모델족의 한계에서 오는 바닥(줄일 수 없는 손실)이 있다. 작은 범위에서는 바닥이 잘 보이지 않아 순수 멱법칙도 잘 맞지만, 멀리 외삽하면 바닥 아래로 계속 내려가는 예측을 하게 된다. 본문 실험에서 예측 0.0266, 실제 0.0495였다. 바닥이 있는 꼴 $aN^b + c$로 맞추고 맞춘 범위와 불확실성을 함께 보고한다.'''

[[questions.choices]]
text = "바닥 항을 무시했으므로 개선을 과대평가해 실제보다 낮은 손실을 예측하기 쉽다."
correct = true

[[questions.choices]]
text = "멱법칙은 여러 자릿수에서 성립한다고 알려져 있으므로 예측이 정확하다."
feedback = "멱법칙이 넓은 범위에서 관찰된 것은 특정한 연구·설정의 경험적 결과다. 내 문제에서 한 자릿수 범위로 맞춘 직선이 멀리까지 성립한다는 보장은 없다."

[[questions.choices]]
text = "멱법칙은 볼록 함수이므로 외삽은 항상 실제보다 높은 손실을 예측한다."
feedback = "바닥을 무시한 순수 멱법칙은 0을 향해 계속 내려가므로, 바닥이 있는 실제 곡선보다 낮게 예측한다."

[[questions]]
id = "compute-optimal"
type = "single"
objective = 2
prompt = '''Hoffmann 외(2022)의 compute-optimal 분석에 따르면, 학습 계산량을 크게 늘릴 때 모델 크기와 학습 token 수를 어떻게 늘려야 하는가?'''
explanation = '''Hoffmann 외(2022)는 400개 이상의 모델을 학습해, 계산량이 늘 때 모델 크기와 학습 token 수를 같은 비율로 늘리는 것이 최적이라고 결론지었다. 근거로 Gopher(280B)와 같은 계산량으로 더 작은 70B 모델(Chinchilla)을 더 많은 token(1.4T)으로 학습해 더 좋은 성능을 보였다. 이는 모델 크기를 데이터보다 빠르게 키우라는 이전 권고(Kaplan 외, 2020)를 수정한 것이다. 이 결론은 특정한 모델족과 학습 설정에서 얻은 경험적 결과라는 점도 기억한다.'''

[[questions.choices]]
text = "둘을 대략 같은 비율로 늘린다."
correct = true

[[questions.choices]]
text = "데이터는 고정하고 모델 크기만 키운다."
feedback = "계산량이 정해져 있으면 모델만 키울 때 데이터가 병목이 된다. 분석의 결론은 둘을 함께, 같은 비율로 키우는 것이었다."

[[questions.choices]]
text = "모델 크기는 고정하고 데이터만 늘린다."
feedback = "데이터만 늘리면 모델 크기가 병목이 되어 손실이 바닥 근처에서 평평해진다."

[[questions]]
id = "high-dim-extrapolation"
type = "multiple"
objective = 3
prompt = '''16차원 입력을 받는 모델을 학습 입력 500개로 학습했다. 같은 분포에서 새로 뽑은 입력에 대해 옳은 것을 모두 고르시오.'''
explanation = '''본문 실험에서 16차원 표준 가우시안의 새 입력은 100개 중 1개만 학습 입력 500개의 convex hull 안에 있었다. 고차원에서는 같은 분포의 입력도 거의 다 convex hull 밖에 떨어지므로, "convex hull 안이면 보간이라 믿을 수 있다"는 기준은 쓸모가 없다. 의미 있는 질문은 새 입력이 학습 분포에서 나왔는가, 즉 분포 이동이 있는가다. 반면 같은 분포의 입력이므로 시험 성능은 이 입력들에서의 성능을 추정하는 데 쓸 수 있다.'''

[[questions.choices]]
text = "대부분의 새 입력은 학습 입력의 convex hull 밖에 있다."
correct = true

[[questions.choices]]
text = "convex hull 밖에 있다는 이유만으로 이 입력들에서의 예측을 믿을 수 없다고 할 수는 없다."
correct = true

[[questions.choices]]
text = "같은 분포에서 뽑았으므로 대부분 convex hull 안에 있다."
feedback = "1차원에서는 그렇지만 차원이 높아지면 비율이 급격히 줄어든다(16차원에서 약 1%)."

[[questions.choices]]
text = "학습 데이터를 1000개로 늘리면 거의 모든 새 입력이 convex hull 안에 든다."
feedback = "필요한 표본 수는 차원에 따라 지수적으로 늘어난다. 두 배 정도로는 고차원의 상황이 바뀌지 않는다."
