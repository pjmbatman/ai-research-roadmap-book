# 16.7 시계열 분석 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "acf-seasonal-lag"
type = "single"
objective = 1
prompt = '''시간당 기온 시계열의 표본 ACF가 시차 1에서 0.95, 시차 12에서 $-0.60$, 시차 24에서 0.86이다. 이 모양이 가장 직접적으로 말해 주는 것은?'''
explanation = '''시차 24에서 다시 큰 양의 상관, 시차 12에서 음의 상관이 나오는 것은 주기 24의 계절성의 전형적인 신호다. 시차 1의 0.95도 상당 부분은 "한 시간 뒤에도 비슷한 시각대"라는 계절성에서 온다. 추세와 계절성을 뺀 잔차의 ACF를 다시 보아야 단기 의존성(이 장의 예에서 AR(1), 0.81)을 따로 볼 수 있다. 계절성이 있으면 평균이 시각에 따라 바뀌므로 원 시계열은 정상이 아니다.'''

[[questions.choices]]
text = "주기 24의 계절성이 지배한다. 계절성(과 추세)을 뺀 잔차의 ACF를 따로 봐야 단기 의존성을 알 수 있다."
correct = true

[[questions.choices]]
text = "시차 1의 ACF가 0.95이므로 이 시계열은 φ = 0.95인 AR(1) 과정이다."
feedback = "AR(1)이라면 ACF가 0.95^k로 단조 감소해야 한다. 시차 12의 음수와 시차 24의 반등은 AR(1)로 설명되지 않는다."

[[questions.choices]]
text = "ACF가 모든 시차에서 0이 아니므로 정상 과정이다."
feedback = "ACF가 0이 아닌 것은 의존성이 있다는 뜻일 뿐 정상성과 무관하다. 계절성은 평균을 시각에 따라 바꾸므로 원 시계열은 정상이 아니다."

[[questions.choices]]
text = "시차 12의 음의 상관은 측정 오류다."
feedback = "주기 24인 진동에서 반 주기 떨어진 값은 반대 위상이므로 음의 상관이 자연스럽다."

[[questions]]
id = "ar1-forecast-value"
type = "numeric"
objective = 2
prompt = '''추세와 계절성을 뺀 잔차가 계수 $\phi = 0.8$인 AR(1)을 따른다. 마지막 잔차가 $e_T = 2.0$ °C일 때, 3시간 뒤 잔차의 예측값 $\hat{e}_{T+3}$(°C)은?'''
answer = 1.024
tolerance = 0.001
explanation = '''미래 잡음의 기댓값은 0이므로 재귀 예측은 $\hat{e}_{T+1} = 0.8 \times 2.0 = 1.6$, $\hat{e}_{T+2} = 0.8 \times 1.6 = 1.28$, $\hat{e}_{T+3} = 0.8 \times 1.28 = 1.024$, 즉 $\phi^h e_T$다. horizon이 길어질수록 AR 성분의 기여는 0으로 사라지고 예측은 추세+계절성으로 돌아간다. 이 장의 backtest에서 AR 모델의 이점이 짧은 horizon에서 크고 긴 horizon에서 작았던 이유다.'''

[[questions]]
id = "ses-weight"
type = "numeric"
objective = 2
prompt = '''단순 지수평활 $\ell_t = \alpha y_t + (1-\alpha)\ell_{t-1}$에서 $\alpha = 0.3$이다. 수준 $\ell_t$를 과거 관측의 가중 평균으로 전개했을 때, 두 시점 전 관측 $y_{t-2}$에 붙는 가중치는?'''
answer = 0.147
tolerance = 0.001
explanation = '''전개하면 $\ell_t = \alpha y_t + \alpha(1-\alpha)y_{t-1} + \alpha(1-\alpha)^2 y_{t-2} + \cdots$이므로 $y_{t-2}$의 가중치는 $0.3 \times 0.7^2 = 0.147$이다. 가중치가 지수적으로 줄어 "지수평활"이라 부른다. $(1-\alpha)^2 = 0.49$를 답하는 실수는 앞의 $\alpha$를 빠뜨린 것이다.'''

[[questions]]
id = "filter-vs-smoother"
type = "single"
objective = 3
prompt = '''배터리 셀의 충전 상태를 실시간으로 추정하는 알고리즘을 개발했다. 실험이 끝난 뒤 전체 측정으로 RTS smoother를 돌려 얻은 추정 오차를 논문에 "실시간 추정 성능"으로 보고하려 한다. 문제는?'''
explanation = '''평활(smoothing)은 시점 $t$의 상태를 추정할 때 $t$ 이후의 관측까지 쓴다. 실시간 시스템은 그 시점까지의 관측만 쓸 수 있으므로 성능은 필터링 기준으로 재야 한다. 이 장의 예에서 평활 오차(0.101)는 필터링 오차(0.139)보다 27% 작았다. 이 차이는 알고리즘의 우수성이 아니라 미래 정보를 쓴 몫이다.'''

[[questions.choices]]
text = "평활은 미래 관측을 쓰므로 실시간에서는 얻을 수 없는 정확도다. 필터링 오차를 보고해야 한다."
correct = true

[[questions.choices]]
text = "문제없다. 같은 상태공간 모델이므로 평활과 필터링의 정확도는 같다."
feedback = "같은 모델이어도 쓰는 관측이 다르다. 평활은 앞뒤 관측을 모두 쓰므로 일반적으로 더 정확하다."

[[questions.choices]]
text = "평활은 필터링보다 덜 정확하므로 오히려 보수적인 보고다."
feedback = "반대다. 평활은 필터링이 쓰는 정보에 미래 관측을 더 쓰므로 오차가 작거나 같다."

[[questions.choices]]
text = "Kalman filter는 선형 모델에만 쓰므로 배터리에는 처음부터 적용할 수 없다."
feedback = "비선형 모델에는 extended·unscented Kalman filter 같은 확장이 쓰인다. 핵심 문제는 평가에 쓴 정보의 범위다."

[[questions]]
id = "persistence-horizon"
type = "single"
objective = 3
prompt = '''매일 23시를 원점으로 시간당 기온을 24시간 앞까지 예측했다. persistence(마지막 값 반복)의 RMSE가 1시간 뒤 1.16, 6시간 뒤 4.05, 24시간 뒤 1.07 °C였다. 24시간 뒤 오차가 6시간 뒤보다 작은 이유는?'''
explanation = '''persistence는 23시 값을 그대로 반복한다. 24시간 뒤 목표는 다시 23시이므로 하루 주기 성분이 상쇄되어 오차가 작다(이때 persistence와 seasonal naive는 같은 예측이다). 6시간 뒤는 하루 주기의 정점 근처여서 23시 값과 차이가 가장 크다. horizon별 오차는 단조 증가한다고 가정할 수 없고, 원점의 시각에 따라서도 모양이 바뀐다.'''

[[questions.choices]]
text = "24시간 뒤는 원점과 같은 시각이라 하루 주기 성분이 상쇄되고, 6시간 뒤는 주기의 정점 근처라 23시 값과 차이가 가장 크다."
correct = true

[[questions.choices]]
text = "원점이 20개뿐이라 생긴 우연이다. 원점을 늘리면 오차는 horizon에 따라 단조 증가한다."
feedback = "이 모양은 하루 주기에서 오는 체계적인 패턴이다. 원점을 늘려도 사라지지 않는다."

[[questions.choices]]
text = "AR(1) 성분의 기억이 24시간 뒤에 되살아나기 때문이다."
feedback = "AR(1)의 영향은 0.8^h로 단조 감소한다. 24시간 뒤의 회복은 계절성에서 온다."

[[questions.choices]]
text = "긴 horizon에서는 오차가 평균으로 돌아가므로 모든 모델의 오차가 줄어든다."
feedback = "예측 오차는 horizon이 길수록 보통 커진다. 여기서 줄어든 것은 persistence가 하루 주기와 우연히 맞아떨어졌기 때문이다."

[[questions]]
id = "future-features"
type = "multiple"
objective = 3
prompt = '''다음 시간의 전력 수요를 예측하는 모델에 쓸 특징 후보다. 예측 시점에 **알 수 없는** 정보를 담아 누수를 일으키는 것을 모두 고르시오.'''
explanation = '''중심 이동평균은 앞뒤 값을 평균하므로 미래 값이 들어 있다. 전체 기간(시험 구간 포함)으로 계산한 평균·표준편차로 정규화하면 시험 구간의 통계가 학습에 새어 든다. 나중에 확정·수정된 실측값(검침 후 보정된 수요)은 예측 시점에는 아직 없다. 한 시간 전 수요의 lag와 기상청이 예측 시점 이전에 발표한 기온 예보는 그 시점에 알 수 있는 값이다.'''

[[questions.choices]]
text = "앞뒤 2시간을 평균한 중심 이동평균의 직전 값"
correct = true

[[questions.choices]]
text = "전체 데이터 기간의 평균과 표준편차로 표준화한 수요"
correct = true

[[questions.choices]]
text = "한 달 뒤 검침으로 보정된 지난 시간의 실측 수요"
correct = true

[[questions.choices]]
text = "한 시간 전의 실시간 계측 수요"
feedback = "예측 시점에 이미 관측된 값이므로 정당한 lag 특징이다. 다만 실시간 계측이 실제로 지연 없이 도착하는지는 확인한다."

[[questions.choices]]
text = "예측 시점 이전에 발표된 다음 시간 기온 예보"
feedback = "예보는 미래에 대한 값이지만 예측 시점에 이미 발표되어 알 수 있다. 실측 기온을 대신 쓰면 누수다."

[[questions]]
id = "random-split-ar"
type = "single"
objective = 3
prompt = '''같은 시계열에서 한 시간 뒤 값을 예측하며, lag 특징을 쓰는 선형(Ridge) 모델과 $k$-NN 모델을 무작위 5-fold와 시간 순서 5-fold로 평가했다. Ridge는 두 분할에서 RMSE가 0.608, 0.609로 같았고 $k$-NN은 0.687, 0.749였다. 옳은 해석은?'''
explanation = '''오차가 무상관인 순수 자기회귀 형태의 모델에서는 무작위 $k$-fold도 타당할 수 있다(Bergmeir 외, 2018). Ridge의 결과가 그렇다. 유연한 모델은 시험 시점의 시간적 이웃(같은 기간의 수준)을 학습 데이터에서 보고 보간할 수 있어 무작위 분할이 낙관적이 된다. 모델마다 낙관의 크기가 다르므로, 무작위 분할로 모델을 비교하면 유연한 모델이 부당하게 유리해진다. 시간 순서를 지키는 평가가 기본이다.'''

[[questions.choices]]
text = "선형 AR 모델에는 무작위 분할의 낙관이 거의 없지만, 유연한 모델은 시간적 이웃을 보간해 낙관적이 된다. 모델 비교에는 시간 순서 분할을 써야 한다."
correct = true

[[questions.choices]]
text = "Ridge에서 차이가 없었으므로 시계열에도 무작위 분할을 써도 된다."
feedback = "그 결론은 선형 AR 형태의 모델에만 해당한다. 같은 데이터에서 k-NN은 무작위 분할에서 8% 낙관적이었다."

[[questions.choices]]
text = "k-NN이 시간 순서 분할에서 나쁜 것은 학습 데이터가 적은 fold가 있기 때문이므로 무작위 분할이 더 공정하다."
feedback = "시간 순서 분할은 실제 사용 조건(과거로 미래 예측)을 재현한다. 무작위 분할이 좋은 이유는 미래 쪽 이웃을 볼 수 있기 때문이다."

[[questions.choices]]
text = "두 분할에서 Ridge의 오차가 같으므로 Ridge가 과적합되지 않았다는 증거다."
feedback = "분할 방식에 대한 민감도는 과적합 여부가 아니라 모델이 시간적 이웃 정보를 쓸 수 있는지에 달려 있다."
