# 16.1 기준 모델의 철학 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "persistence-for-short-horizon"
type = "single"
objective = 1
prompt = '''10분 간격으로 측정한 실험실 온도로 **10분 뒤** 온도를 예측하는 모델을 만들었다. 온도는 하루 동안 천천히 오르내린다. 반드시 함께 보고해야 할 단순 baseline으로 가장 알맞은 것은?'''
explanation = '''예측 기간이 측정 간격과 같을 만큼 짧고 온도가 천천히 변하면, 마지막 관측값을 그대로 내놓는 persistence가 이미 매우 작은 오차를 낸다. 새 모델의 가치는 이 기준 대비 개선량으로만 판단할 수 있다. 전체 평균은 하루 중 온도 변화를 모두 오차로 남기므로 거의 모든 모델이 이기는 약한 기준이다.'''

[[questions.choices]]
text = "학습 기간 전체의 평균 온도"
feedback = "평균은 입력을 전혀 쓰지 않는 기준이라, 시간 상관이 강한 이 문제에서는 거의 모든 모델이 크게 이긴다. 이기기 쉬운 기준만 보고하면 문제의 난이도를 알 수 없다."

[[questions.choices]]
text = "마지막으로 측정한 온도를 그대로 내놓는 persistence"
correct = true

[[questions.choices]]
text = "baseline은 필요 없다. 학습 오차와 시험 오차가 비슷하면 모델이 잘 일반화한 것이다."
feedback = "학습·시험 오차가 비슷하다는 것은 과적합이 적다는 뜻일 뿐, 그 오차가 좋은 값인지는 말해 주지 않는다. 좋고 나쁨은 같은 분할·metric의 baseline과 비교해야 알 수 있다."

[[questions.choices]]
text = "같은 데이터로 학습한 더 큰 신경망"
feedback = "더 큰 모델은 비교 대상이 될 수 있지만 '단순 baseline'이 아니다. 학습 없이 얻는 성능을 먼저 재야 큰 모델의 이득을 해석할 수 있다."

[[questions]]
id = "skill-score-numeric"
type = "numeric"
objective = 2
prompt = '''같은 시험 세트에서 MAE가 평균 baseline 30.0, persistence 4.0, 새 모델 3.0이다. persistence를 기준으로 한 새 모델의 skill score $1 - E_{\text{model}}/E_{\text{baseline}}$은?'''
answer = 0.25
tolerance = 0.005
explanation = '''$1 - 3.0/4.0 = 0.25$다. 같은 모델을 평균 baseline 기준으로 재면 $1 - 3.0/30.0 = 0.90$이다. 같은 결과가 기준에 따라 0.90도 되고 0.25도 된다. 연구 주장에 의미 있는 값은 가장 강한 baseline 기준의 0.25다.'''

[[questions]]
id = "r2-is-weak-skill"
type = "single"
objective = 2
prompt = '''논문이 "제안 모델은 시험 세트에서 $R^2 = 0.95$를 달성했다"고만 보고한다. 이 숫자에 대한 해석으로 옳은 것은?'''
explanation = '''$R^2 = 1 - \mathrm{SSE}/\mathrm{SST}$는 평균을 내놓는 baseline 대비 skill score다. 평균은 대부분의 문제에서 가장 약한 기준이므로, $R^2$가 높아도 persistence·물리식·잘 튜닝된 고전 모델보다 나은지는 알 수 없다. 이 장의 예에서 평균 baseline 대비 skill 0.91인 모델이 물리식 baseline에는 졌다.'''

[[questions.choices]]
text = "평균 baseline보다 훨씬 낫다는 뜻일 뿐, 문제에 맞는 강한 baseline보다 나은지는 알 수 없다."
correct = true

[[questions.choices]]
text = "0.95는 1에 가까우므로 어떤 baseline보다도 낫다는 뜻이다."
feedback = "R²는 평균 baseline 하나와의 비교다. 시간 상관이 강하거나 물리식이 잘 맞는 문제에서는 단순 baseline도 R² 0.99를 낼 수 있다."

[[questions.choices]]
text = "R²는 척도에 무관한 지표이므로 baseline 비교가 필요 없다."
feedback = "척도에 무관하다는 것과 기준이 필요 없다는 것은 다르다. R² 자체가 이미 '평균'이라는 특정 기준과의 비교다."

[[questions.choices]]
text = "모델이 출력 분산의 95%를 인과적으로 설명한다는 뜻이다."
feedback = "R²는 예측 오차의 비율일 뿐, 인과적 설명과는 무관하다. 인과추론은 16.8장에서 다룬다."

[[questions]]
id = "fair-tuning-budget"
type = "single"
objective = 2
prompt = '''새 신경망은 검증 세트에서 설정 60개를 탐색해 고른 반면, gradient boosting baseline은 라이브러리 기본 설정 하나로 학습했다. 신경망이 시험 세트에서 조금 더 좋았다. 공정한 비교를 위해 해야 할 일은?'''
explanation = '''차이에 방법의 차이와 튜닝 노력의 차이가 섞여 있다. baseline에도 비슷한 탐색 예산을 같은 검증 세트에서 주고 다시 비교해야 방법의 차이를 말할 수 있다. 시험 세트는 어느 쪽의 튜닝에도 쓰지 않는다.'''

[[questions.choices]]
text = "baseline에도 같은 검증 세트에서 비슷한 탐색 예산을 주고 다시 비교한다."
correct = true

[[questions.choices]]
text = "baseline의 하이퍼파라미터를 시험 세트에서 골라 최대한 강하게 만든다."
feedback = "시험 세트로 튜닝하면 baseline의 시험 점수가 낙관적으로 편향된다(15.4장). 강하게 만드는 것은 맞지만 튜닝은 검증 데이터로 한다."

[[questions.choices]]
text = "기본 설정은 라이브러리 개발자가 고른 값이므로 이미 공정하다."
feedback = "기본 설정은 여러 문제에서 무난하도록 고른 값이지, 이 문제에 맞춘 값이 아니다. 새 방법만 이 문제에 맞춰 튜닝했다면 공정하지 않다."

[[questions.choices]]
text = "신경망의 탐색 결과 중 중간 순위의 설정을 보고해 균형을 맞춘다."
feedback = "새 방법을 일부러 약하게 만드는 것도 공정한 비교가 아니다. 양쪽 모두 같은 예산으로 최선을 다한 결과를 비교한다."

[[questions]]
id = "paired-ci-verdict"
type = "single"
objective = 3
prompt = '''시험 셀 12개에서 셀별로 (새 모델 MAE − 가장 강한 baseline MAE)를 계산했다. 평균 차이는 −0.4 mAh이고, 셀 단위 부트스트랩 95% 신뢰구간은 [−1.1, +0.3] mAh다. 가장 알맞은 결론은?'''
explanation = '''평균 차이는 새 모델 쪽이 작지만, 신뢰구간이 0을 포함하므로 이 시험 셀들만으로는 어느 쪽이 나은지 판정할 수 없다. 정직한 보고는 차이의 추정값과 구간을 함께 쓰고 "판정 불가"라고 말하는 것이다. 더 많은 독립 셀을 모으면 판정이 가능해질 수 있다.'''

[[questions.choices]]
text = "평균 차이가 음수이므로 새 모델이 이겼다."
feedback = "평균의 부호만으로는 운과 실력을 구분할 수 없다. 구간이 0을 포함하면 다른 시험 셀 표본에서는 부호가 뒤집힐 수 있다."

[[questions.choices]]
text = "신뢰구간이 0을 포함하므로 두 모델의 성능은 같다."
feedback = "0을 포함한다는 것은 차이를 판정할 수 없다는 뜻이지, 차이가 0이라는 증거가 아니다. 구간은 −1.1 mAh만큼 나은 경우도 허용한다."

[[questions.choices]]
text = "차이를 판정할 수 없다. 추정값과 구간을 함께 보고한다."
correct = true

[[questions.choices]]
text = "셀이 아니라 시험 샘플(사이클) 단위로 부트스트랩하면 구간이 좁아지므로 그렇게 다시 계산한다."
feedback = "같은 셀의 사이클들은 독립이 아니다. 샘플 단위로 부트스트랩하면 구간이 좁아 보이지만, 새 셀로 일반화한다는 주장에 대해서는 과소평가된 불확실성이다(12.5장)."

[[questions]]
id = "baseline-wins-signal"
type = "multiple"
objective = 2
prompt = '''잘 튜닝한 새 모델이 단순 baseline(최근값 또는 물리식)을 이기지 못했다. 이 결과가 보내는 신호로 적절한 것을 **모두** 고르시오.'''
explanation = '''baseline이 이기는 결과는 문제 정의·데이터·평가를 다시 보라는 신호다. 예측 기간이 너무 짧으면 최근값이 거의 완벽하고, metric이 쉬운 구간에 지배되면 차이가 드러나지 않으며, 모델이 baseline이 쓰는 정보(셀 자신의 최근 곡선, 물리식의 함수 형태)를 받지 못하고 있을 수도 있다. baseline을 표에서 빼는 것은 결과를 숨기는 일이다.'''

[[questions.choices]]
text = "예측 기간이 너무 짧아 최근값이 거의 완벽한, 연구 가치가 적은 문제일 수 있다."
correct = true

[[questions.choices]]
text = "모델이 baseline이 쓰는 정보(예: 물리식의 함수 형태, 대상 자신의 최근 이력)를 입력이나 구조로 받지 못하고 있을 수 있다."
correct = true

[[questions.choices]]
text = "단순 baseline은 학습을 하지 않으므로 표에서 빼고 학습 기반 모델끼리만 비교하면 된다."
feedback = "학습 여부와 상관없이 같은 입력 정보로 얻을 수 있는 성능이면 비교 대상이다. 이기지 못한 baseline을 빼면 독자가 문제의 난이도를 판단할 수 없다."

[[questions.choices]]
text = "baseline이 이긴 것은 시험 세트가 너무 작기 때문이므로, 학습 데이터에서 다시 평가한다."
feedback = "학습 데이터에서 평가하면 학습한 모델이 유리해질 뿐 일반화 성능이 아니다. 시험 세트가 작다면 신뢰구간으로 불확실성을 보고하고, 가능하면 독립 시험 단위를 늘린다."
