# 16.2 선형 모델과 정규화 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "ridge-prior-lambda"
type = "numeric"
objective = 2
prompt = '''선형회귀의 관측 잡음이 $\mathcal{N}(0, \sigma^2)$, $\sigma = 0.5$이고 계수의 사전분포가 $\mathcal{N}(\mathbf{0}, \tau^2\mathbf{I})$, $\tau = 0.25$이다. MAP 추정과 같은 Ridge 목적함수 $\lVert\mathbf{y} - \mathbf{X}\mathbf{w}\rVert^2 + \lambda\lVert\mathbf{w}\rVert^2$의 $\lambda$는?'''
answer = 4.0
tolerance = 0.01
explanation = '''음의 로그 사후분포는 $\frac{1}{2\sigma^2}\lVert\mathbf{y} - \mathbf{X}\mathbf{w}\rVert^2 + \frac{1}{2\tau^2}\lVert\mathbf{w}\rVert^2 + $ 상수다. $2\sigma^2$을 곱하면 $\lambda = \sigma^2/\tau^2 = 0.25/0.0625 = 4$다. 사전분포가 좁을수록($\tau$가 작을수록), 잡음이 클수록($\sigma$가 클수록) 정규화가 강해진다. $\tau/\sigma = 0.5$나 $\sigma/\tau = 2$로 답했다면 제곱을 빠뜨린 것이다.'''

[[questions]]
id = "lasso-exact-zeros"
type = "single"
objective = 2
prompt = '''같은 데이터에서 강도를 키우면 Lasso는 일부 계수를 **정확히 0**으로 만들지만, Ridge는 계수를 줄일 뿐 0으로 만들지 않는다. 이 차이에 대한 설명으로 옳은 것은?'''
explanation = '''제약 형태로 보면 L1 영역은 꼭짓점이 축 위에 있는 마름모(다면체)이고, 손실의 타원 등고선은 꼭짓점에 먼저 닿기 쉽다. 꼭짓점에서는 일부 좌표가 0이다. L2 영역은 매끄러운 원이라 축 위에서 닿을 특별한 이유가 없다. 같은 이야기를 1차원 최적화로 하면, L1 벌점의 기울기는 0에서도 크기 $\alpha$를 유지해 작은 상관을 가진 계수를 0에 묶어 두고(soft-thresholding), L2 벌점의 기울기 $2\lambda w$는 0 근처에서 0으로 사라진다.'''

[[questions.choices]]
text = "L1 제약 영역은 축 위에 꼭짓점이 있는 다면체라, 손실의 등고선이 꼭짓점(일부 좌표가 0인 점)에서 닿기 쉽기 때문이다."
correct = true

[[questions.choices]]
text = "Lasso의 강도가 Ridge보다 항상 크기 때문이다."
feedback = "강도의 크기 문제가 아니다. Ridge는 λ를 아무리 키워도 계수가 0에 다가갈 뿐 정확히 0이 되지 않는다. 차이는 벌점의 모양(0에서 꺾이는가)에서 온다."

[[questions.choices]]
text = "Lasso는 반복법으로 풀기 때문에 수치 오차로 작은 계수가 0으로 반올림된다."
feedback = "0은 반올림의 결과가 아니라 최적해의 성질이다. 좌표 하강법의 soft-thresholding은 |ρ| ≤ α이면 정확히 0을 준다. Ridge를 반복법으로 풀어도 0은 나오지 않는다."

[[questions.choices]]
text = "Ridge는 상관된 특징이 있을 때만 0이 아닌 계수를 남긴다."
feedback = "Ridge는 특징의 상관과 무관하게 모든 계수를 0이 아닌 값으로 둔다. 상관된 특징들 사이에 계수를 나눠 주는 경향이 있을 뿐이다."

[[questions]]
id = "standardize-before-penalty"
type = "single"
objective = 3
prompt = '''표준화 없이 Lasso를 적합했더니, 길이 특징을 m에서 mm로 바꾸기만 해도 선택되는 특징이 달라졌다. 원인과 처방으로 옳은 것은?'''
explanation = '''같은 효과를 내는 계수의 크기는 특징의 단위에 반비례한다. mm로 바꾸면 계수가 1000분의 1이 되어 벌점을 거의 받지 않고, m 단위에서는 그만큼 큰 벌점을 받는다. 벌점이 물리적으로 의미 없는 단위 선택에 따라 달라지는 것이다. 특징을 표준화하면 모든 계수가 "표준편차 1단위당 효과"라는 같은 척도에 놓인다. 표준화 통계량은 학습 데이터에서만 추정한다.'''

[[questions.choices]]
text = "벌점이 계수 크기를 보는데 계수 크기는 단위에 따라 바뀐다. 학습 데이터로 추정한 평균·표준편차로 표준화한 뒤 정규화한다."
correct = true

[[questions.choices]]
text = "mm 단위는 숫자가 커서 수치 오차가 생긴다. 모든 특징을 SI 기본 단위로 바꾸면 해결된다."
feedback = "수치 오차가 원인이 아니다. SI 단위로 통일해도 특징마다 퍼짐(표준편차)이 다르면 벌점은 여전히 특징마다 다르게 작용한다."

[[questions.choices]]
text = "Lasso의 고유한 문제이므로 Ridge로 바꾸면 단위와 무관해진다."
feedback = "Ridge의 L2 벌점도 계수 크기를 보므로 단위에 따라 해가 바뀐다. 0이 되지 않을 뿐 계수와 예측은 달라진다."

[[questions.choices]]
text = "정규화 강도를 단위 변환 비율(1000)만큼 바꾸면 된다."
feedback = "단위를 바꾼 특징 하나의 계수만 1000배 바뀌므로, 공통 강도 하나를 조정해서는 모든 특징의 상대적인 벌점을 맞출 수 없다."

[[questions]]
id = "threshold-from-costs"
type = "numeric"
objective = 1
prompt = '''보정된 확률을 내는 로지스틱 회귀로 시편의 파손을 예측한다. 파손을 놓치는 비용이 잘못된 경보 비용의 9배다. 기대 비용을 최소화하는 threshold(이 확률 이상이면 경보)는?'''
answer = 0.1
tolerance = 0.005
explanation = '''확률 $p$인 시편에 경보를 내면 기대 비용은 $(1-p)c_{\text{FP}}$, 내지 않으면 $p\,c_{\text{FN}}$이다. 경보가 나은 조건은 $p > c_{\text{FP}}/(c_{\text{FP}} + c_{\text{FN}}) = 1/(1+9) = 0.1$이다. 0.5는 두 비용이 같을 때의 값이고, 1/9 ≈ 0.11은 비용의 비를 그대로 쓴 흔한 실수다.'''

[[questions]]
id = "lasso-dropped-feature"
type = "single"
objective = 3
prompt = '''교차검증으로 고른 Lasso가 HDL 콜레스테롤 특징(s3)의 계수를 0으로 만들었다. 이 특징은 다른 콜레스테롤 지표들과 강하게 상관되어 있고, 부트스트랩 표본의 87%에서는 선택되었다. 가장 알맞은 해석은?'''
explanation = '''Lasso는 상관된 특징 중 일부를 임의로 버리는 경향이 있고, 어느 것을 버릴지는 표본의 작은 변화로 바뀐다. 부트스트랩의 87%에서 선택되었다는 것은 전체 데이터에서의 0이 안정적인 결론이 아니라는 뜻이다. 예측에 필요한 정보가 상관된 다른 특징으로 대체되었을 수 있을 뿐, 이 특징이 결과와 무관하다는 증거는 아니다.'''

[[questions.choices]]
text = "HDL은 질병 진행과 관계가 없다."
feedback = "계수가 0인 것은 '이 강도에서 예측에 추가로 필요하지 않다'는 뜻이다. 상관된 특징이 같은 정보를 담고 있으면 관련이 있어도 버려질 수 있다."

[[questions.choices]]
text = "선택은 불안정하고, 상관된 다른 특징이 같은 정보를 대신 담았을 수 있다. 0이라는 결과로 무관하다고 결론 내릴 수 없다."
correct = true

[[questions.choices]]
text = "교차검증이 고른 강도이므로 선택 결과는 신뢰할 수 있고, 부트스트랩 결과는 무시해도 된다."
feedback = "교차검증은 예측 오차를 기준으로 강도를 고를 뿐, 선택된 특징 집합의 안정성을 보장하지 않는다. 선택 비율은 해석의 신뢰도에 대한 별도의 정보다."

[[questions.choices]]
text = "s3의 계수가 0이 아니게 될 때까지 강도를 줄여 다시 보고한다."
feedback = "원하는 결과가 나올 때까지 설정을 바꾸는 것은 선택 편향을 만든다. 안정성 정보와 상관 구조를 함께 보고하는 것이 정직한 해석이다."

[[questions]]
id = "polynomial-extrapolation"
type = "single"
objective = 1
prompt = '''$t \in [0, 2]$ s에서 측정한 25개 점에 12차 다항 특징 + 최소제곱으로 곡선을 맞췄다. $t \in [2, 2.5]$ s의 예측에 대해 가장 알맞은 설명은?'''
explanation = '''다항식은 입력이 학습 구간을 벗어나면 최고차항이 지배해 빠르게 발산한다. 본문 실험에서 12차 다항식의 구간 밖 RMSE는 2000을 넘었다. 구간 안에서 학습 오차가 작다는 것은 외삽 성능의 근거가 되지 않는다. 외삽이 필요하면 물리식처럼 구간 밖에서도 의미가 있는 특징을 쓰거나, 외삽을 따로 검증한다.'''

[[questions.choices]]
text = "학습 구간 안에서 잘 맞았다면 바로 옆 구간에서도 비슷하게 맞는다."
feedback = "고차 다항식은 학습 구간 경계 근처에서 이미 크게 휘고, 경계를 벗어나면 최고차항 때문에 발산한다."

[[questions.choices]]
text = "최고차항이 지배해 예측이 크게 발산할 수 있다. 외삽 성능은 따로 검증해야 한다."
correct = true

[[questions.choices]]
text = "선형 모델이므로 구간 밖에서는 직선으로 연장된다."
feedback = "선형인 것은 파라미터에 대해서다. 입력 t에 대해서는 12차 다항식이므로 직선으로 연장되지 않는다."

[[questions.choices]]
text = "정규화를 걸면 외삽 문제가 해결된다."
feedback = "정규화는 계수를 줄여 진동을 완화할 수 있지만, 다항식 basis의 외삽 문제를 없애지는 못한다. 구간 밖 데이터가 없으면 무엇이 맞는 외삽인지 데이터가 말해 주지 않는다."
