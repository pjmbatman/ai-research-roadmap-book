# 16.5 비지도학습과 표현 탐색 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "pca-uncorrelated-not-independent"
type = "single"
objective = 1
prompt = '''서로 독립인 두 원천 신호(사인파와 사각파)를 센서 두 개가 섞어서 기록했다. 관측에 PCA를 적용하면 두 원천을 되찾지 못하는 이유로 가장 정확한 것은?'''
explanation = '''PCA 성분은 서로 **무상관**이지만, 무상관은 2차 통계량(공분산)만의 조건이다. 무상관인 성분을 회전해도 여전히 무상관이므로, 2차 통계량만으로는 원천에 해당하는 회전을 하나로 정할 수 없다. PCA는 그중 분산이 큰 방향을 고를 뿐이다. ICA는 3차 이상의 통계량(비가우스성)을 써서 독립에 해당하는 회전을 찾는다. 원천이 가우스 분포라면 ICA도 이 모호함을 풀 수 없다.'''

[[questions.choices]]
text = "PCA는 무상관인 성분을 찾을 뿐인데, 무상관 조건은 회전에 대해 하나로 정해지지 않아 독립인 원천을 특정하지 못한다."
correct = true

[[questions.choices]]
text = "센서가 2개뿐이라 PCA의 성분 수가 부족하다."
feedback = "원천도 2개이므로 성분 수는 충분하다. 문제는 개수가 아니라 PCA가 쓰는 기준(분산, 2차 통계량)이다."

[[questions.choices]]
text = "신호가 비선형으로 섞였기 때문이다. kernel PCA를 쓰면 풀린다."
feedback = "혼합은 행렬 곱, 즉 선형이다. kernel PCA도 분산 기준을 쓰므로 독립성을 찾지 않는다."

[[questions.choices]]
text = "데이터를 표준화하지 않았기 때문이다. 표준화하면 PCA 성분이 원천과 일치한다."
feedback = "표준화는 각 축의 분산을 맞출 뿐, 성분이 무상관 이상의 조건을 만족하게 만들지 않는다."

[[questions]]
id = "units-change-clusters"
type = "single"
objective = 1
prompt = '''온도(K)로 구별되는 세 집단에 집단과 무관하게 흔들리는 압력을 함께 넣고 k-means($k=3$)를 돌렸다. 압력을 Pa로 쓰면 ARI 0.00, kPa로 쓰면 0.99, 두 특징을 표준화하면 0.37이었다. 이 결과에서 얻어야 할 교훈은?'''
explanation = '''k-means는 유클리드 거리에 의존하므로 특징의 숫자 크기가 곧 그 특징의 가중치다. Pa로 쓰면 압력의 변동(표준편차 3000)이 거리를 지배해 압력을 세 구간으로 자른다. 표준화는 모든 특징에 같은 무게를 주는데, 집단과 무관한 특징이 섞여 있으면 그것도 같은 무게로 들어와 결과를 흐린다. 어떤 특징이 얼마나 중요해야 하는지는 연구 질문이 정하고, 스케일 선택을 바꿔도 결론이 유지되는지 확인해야 한다.'''

[[questions.choices]]
text = "특징의 스케일이 거리의 가중치 역할을 하므로, 스케일 선택이 군집을 정한다. 표준화도 하나의 선택일 뿐이다."
correct = true

[[questions.choices]]
text = "표준화하면 항상 올바른 군집을 얻으므로 표준화를 기본으로 한다."
feedback = "이 예에서 표준화는 0.37로 kPa(0.99)보다 나빴다. 표준화는 집단과 무관한 특징에도 같은 무게를 준다."

[[questions.choices]]
text = "k-means의 초기값 운이 나빴던 것이다. n_init을 늘리면 세 결과가 같아진다."
feedback = "세 경우는 서로 다른 거리 공간에서 푼 서로 다른 최적화 문제다. 초기값을 늘려도 각 문제의 최적해가 바뀌지 않는다."

[[questions.choices]]
text = "SI 기본 단위(Pa)를 쓴 결과가 물리적으로 올바른 군집이다."
feedback = "단위는 관례일 뿐, 거리에서의 가중치를 물리적으로 정당화하지 않는다. Pa 결과는 참 집단과 전혀 맞지 않았다."

[[questions]]
id = "silhouette-on-uniform"
type = "single"
objective = 3
prompt = '''구조가 없는 2차원 균일 분포에서 k-means를 $k = 2, \dots, 6$으로 돌렸더니 silhouette이 0.37–0.43으로 $k=4$에서 가장 컸고, GMM의 BIC는 성분 3개를 골랐다. 올바른 해석은?'''
explanation = '''군집 알고리즘과 기준은 구조가 없어도 답을 낸다. 균일 분포에서도 공간을 $k$조각으로 자르면 silhouette은 0.4 근처의 양수가 되고, 곡선이 평평하다. BIC는 밀도를 근사하는 데 필요한 가우스 성분 수를 고르는데, 정사각형 균일 밀도는 가우스 하나보다 여러 개로 더 잘 근사되므로 1보다 큰 값을 고른다. "군집이 있다"는 주장은 기준의 최댓값 하나가 아니라 곡선의 모양, 재표본 안정성, 군집에 쓰지 않은 변수로 검증해야 한다.'''

[[questions.choices]]
text = "두 기준 모두 답을 냈지만, 곡선이 평평하고 BIC는 밀도 근사에 필요한 성분 수를 고른 것이라 군집의 증거가 되지 못한다."
correct = true

[[questions.choices]]
text = "silhouette이 양수이므로 군집 4개가 존재한다."
feedback = "silhouette은 구조가 없어도 양수가 될 수 있다. 덩어리가 실제로 있던 예에서는 0.70으로 다른 k보다 뚜렷이 높았다."

[[questions.choices]]
text = "BIC는 확률모형에 근거하므로 silhouette보다 믿을 만하고, 군집은 3개다."
feedback = "BIC가 고르는 것은 밀도를 근사하는 가우스 성분의 수다. 떨어진 무리의 수와 같지 않다."

[[questions.choices]]
text = "두 기준이 다른 k를 골랐으므로 둘의 중간인 k를 쓴다."
feedback = "구조가 없는 데이터에서 기준들의 타협점을 고르는 것은 의미가 없다. 먼저 구조가 있는지부터 물어야 한다."

[[questions]]
id = "mahalanobis-anticorrelated"
type = "numeric"
objective = 1
prompt = '''평균이 $\mathbf{0}$, 두 특징의 분산이 각각 1, 상관계수가 $\rho = 0.95$인 2차원 가우스 데이터에서, 점 $\mathbf{x} = (1, -1)$의 **제곱** Mahalanobis 거리 $\mathbf{x}^\top\boldsymbol{\Sigma}^{-1}\mathbf{x}$는?'''
answer = 40
tolerance = 0.5
explanation = '''$\boldsymbol{\Sigma}^{-1} = \frac{1}{1-\rho^2}\begin{bmatrix}1 & -\rho\\ -\rho & 1\end{bmatrix}$이므로 $\mathbf{x}^\top\boldsymbol{\Sigma}^{-1}\mathbf{x} = \frac{1 + 1 + 2\rho}{1 - \rho^2} = \frac{2(1+\rho)}{(1-\rho)(1+\rho)} = \frac{2}{1-\rho} = 40$이다. 각 좌표의 z-점수는 1에 불과하지만, 상관을 거스르는 방향이라 거리는 $\sqrt{40} \approx 6.3$ 표준편차에 해당한다. 상관을 무시한 유클리드 제곱 거리는 2다. 축별 임계값이 이런 점을 놓치는 이유다.'''

[[questions]]
id = "tsne-what-to-read"
type = "multiple"
objective = 2
prompt = '''t-SNE 2차원 그림에서 **확인 절차를 거치면** 읽어도 되는 것을 모두 고르시오.'''
explanation = '''t-SNE는 이웃 확률 분포를 보존하도록 좌표를 최적화하므로, 그림에서 가까이 붙은 점들이 원공간에서도 이웃이라는 것과, 색으로 칠한 label이 한 섬에 모여 있다는 것은 (여러 설정에서 반복되면) 의미가 있다. 반면 점마다 커널 폭을 이웃 수에 맞추기 때문에 군집의 크기·밀도는 평준화되고, 군집 사이의 거리는 최적화 목표에 없어 보존되지 않는다. 이 장의 예에서 10배 퍼진 군집이 같은 크기로, 7배 먼 군집이 3배 거리로 그려졌다.'''

[[questions.choices]]
text = "가까이 붙은 점들이 원공간에서도 서로 이웃이다."
correct = true

[[questions.choices]]
text = "같은 label의 점들이 한 섬에 모여 있다(여러 perplexity·seed에서 반복될 때)."
correct = true

[[questions.choices]]
text = "그림에서 더 넓게 퍼진 군집이 원공간에서도 더 이질적이다."
feedback = "t-SNE는 점마다 커널 폭을 이웃 수에 맞춰 조절하므로 촘촘한 군집과 퍼진 군집이 비슷한 크기로 그려진다."

[[questions.choices]]
text = "그림에서 두 군집 사이 거리가 멀수록 원공간에서도 더 다르다."
feedback = "군집 사이 거리는 최적화 목표에 들어 있지 않다. 두꺼운 꼬리의 t 분포가 군집들을 밀어내 거리를 왜곡한다."

[[questions]]
id = "cluster-validation"
type = "multiple"
objective = 3
prompt = '''분광 데이터를 k-means로 군집 4개로 나누었다. 이 군집이 서로 다른 물리적 집단(예: 다른 상)이라는 주장을 뒷받침하는 **독립적인** 근거를 모두 고르시오.'''
explanation = '''군집 알고리즘이 최적화한 양(군집 내 제곱합)이나 같은 특징으로 계산한 내부 지표는 군집이 "잘 나뉘었다"는 것만 말한다. 물리적 의미를 주장하려면 군집에 쓰지 않은 정보가 군집에 따라 달라지는지, 재표본이나 새 데이터에서 같은 군집이 반복되는지를 보아야 한다. 측정 장비나 날짜와 군집이 대응한다면 오히려 측정 조건을 찾은 것일 수 있다는 경고 신호다.'''

[[questions.choices]]
text = "군집에 쓰지 않은 조성 측정값이 군집에 따라 뚜렷이 다르다."
correct = true

[[questions.choices]]
text = "부트스트랩 재표본과 새로 측정한 시료에서도 같은 군집이 반복된다(ARI가 높다)."
correct = true

[[questions.choices]]
text = "k = 4에서 군집 내 제곱합이 k = 3보다 작다."
feedback = "군집 내 제곱합은 k를 늘리면 항상 줄어든다. 군집의 존재에 대해 아무것도 말하지 않는다."

[[questions.choices]]
text = "네 군집이 측정 장비 네 대와 거의 일대일로 대응한다."
feedback = "이는 군집이 시료가 아니라 측정 조건을 반영했을 가능성을 보여 주는 경고 신호다."
