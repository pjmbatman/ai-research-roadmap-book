# 16.4 트리와 앙상블 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "tree-no-scaling"
type = "single"
objective = 1
prompt = '''온도 특징을 °C에서 K로 바꾸고, 농도 특징에 로그를 씌운 뒤 같은 설정으로 결정 트리를 다시 학습했다. 예측은 어떻게 되는가?'''
explanation = '''트리의 분할은 특징값의 **순서**만 쓴다. 단위 변환(아핀 변환)과 로그는 순서를 보존하는 단조 증가 변환이므로, 같은 샘플들이 같은 쪽으로 나뉘고 같은 잎 평균이 나온다. 문턱의 숫자만 변환된 척도로 바뀐다. 그래서 트리에는 표준화가 필요 없다. kNN·RBF 커널·정규화 선형 모델은 스케일에 따라 결과가 바뀐다.'''

[[questions.choices]]
text = "같다. 분할은 값의 순서만 쓰므로 단조 증가 변환은 같은 분할을 준다."
correct = true

[[questions.choices]]
text = "달라진다. 표준화하지 않은 특징은 숫자가 큰 쪽이 분할을 지배한다."
feedback = "그것은 거리나 벌점을 쓰는 방법(kNN, Ridge·Lasso)의 문제다. 트리의 분할 기준은 특징 하나씩 순서로 나누므로 다른 특징의 숫자 크기와 비교되지 않는다."

[[questions.choices]]
text = "로그 변환은 비선형이므로 트리 구조가 바뀐다."
feedback = "로그는 비선형이지만 단조 증가라 순서를 바꾸지 않는다. 트리는 순서만 보므로 같은 분할이 나온다."

[[questions.choices]]
text = "K는 °C보다 값이 크므로 온도 특징의 중요도가 커진다."
feedback = "평행이동은 순서와 분할을 바꾸지 않으므로 불순도 감소량, 즉 impurity 중요도도 그대로다."

[[questions]]
id = "oob-fraction"
type = "numeric"
objective = 1
prompt = '''학습 데이터 $N$개에서 $N$개를 복원추출해 부트스트랩 표본을 만든다. $N$이 클 때, 특정 샘플이 이 표본에 **한 번도** 뽑히지 않을 확률은? (소수 셋째 자리까지)'''
answer = 0.368
tolerance = 0.005
explanation = '''한 번 뽑을 때 그 샘플이 아닐 확률은 $1 - 1/N$이고, $N$번 모두 아닐 확률은 $(1 - 1/N)^N \to e^{-1} \approx 0.368$이다. 그래서 각 샘플은 약 37%의 트리에서 학습에 쓰이지 않았고, 그 트리들로 OOB 예측을 만든다. 0.632는 반대로 한 번 이상 뽑힐 확률이다.'''

[[questions]]
id = "rf-decorrelation"
type = "single"
objective = 1
prompt = '''bagging에서 트리 수 $B$를 아무리 늘려도 시험 오차가 어느 수준 아래로 내려가지 않았다. 분할마다 특징의 일부만 후보로 쓰는 랜덤 포레스트가 이 상황을 개선할 수 있는 이유는?'''
explanation = '''상관계수 $\rho$인 예측 $B$개 평균의 분산은 $\rho\sigma^2 + (1-\rho)\sigma^2/B$다. $B$를 늘리면 둘째 항만 사라지고 $\rho\sigma^2$는 남는다. 모든 트리가 같은 강한 특징으로 위쪽을 나누면 $\rho$가 크다. 특징 부분집합을 쓰면 트리들이 서로 달라져 $\rho$가 줄고, 평균의 분산 하한이 낮아진다. 개별 트리는 조금 나빠지지만 평균이 더 좋아진다.'''

[[questions.choices]]
text = "트리 사이의 상관을 낮춰, B를 늘려도 남는 분산 항 ρσ²를 줄이기 때문이다."
correct = true

[[questions.choices]]
text = "특징을 적게 쓰는 트리가 각각 더 정확하기 때문이다."
feedback = "특징 후보를 제한하면 개별 트리는 대개 조금 나빠진다. 이득은 개별 트리가 아니라 평균의 분산에서 온다."

[[questions.choices]]
text = "부트스트랩 표본이 더 다양해지기 때문이다."
feedback = "부트스트랩 표본은 bagging과 랜덤 포레스트에서 같은 방식으로 만든다. 차이는 분할 후보 특징의 무작위 선택이다."

[[questions.choices]]
text = "트리를 얕게 만들어 과적합을 줄이기 때문이다."
feedback = "랜덤 포레스트는 보통 깊은 트리를 그대로 키운다. 깊이를 제한하는 것이 아니라 트리들을 서로 다르게 만드는 것이 핵심이다."

[[questions]]
id = "boosting-residuals"
type = "single"
objective = 1
prompt = '''제곱 손실 $\frac{1}{2}(y - F)^2$의 gradient boosting에서 $m$번째 트리 $h_m$은 무엇에 맞추는가?'''
explanation = '''음의 gradient $-\partial L/\partial F = y - F$, 즉 현재 모델의 잔차 $y_i - F_{m-1}(\mathbf{x}_i)$에 맞춘다. 그 뒤 학습률 $\nu$를 곱해 $F_m = F_{m-1} + \nu h_m$으로 더한다. 원래 출력 $y_i$에 맞추면 매 단계 같은 트리를 반복하게 되고, bagging처럼 평균하는 것도 아니다.'''

[[questions.choices]]
text = '''현재 모델의 잔차 $y_i - F_{m-1}(\mathbf{x}_i)$'''
correct = true

[[questions.choices]]
text = '''원래 출력 $y_i$의 부트스트랩 표본'''
feedback = "그것은 bagging이다. boosting은 순차적으로, 앞 모델이 틀린 부분(잔차)에 다음 트리를 맞춘다."

[[questions.choices]]
text = '''잔차의 부호 $\operatorname{sign}(y_i - F_{m-1}(\mathbf{x}_i))$'''
feedback = "부호는 절댓값 손실 |y − F|의 음의 gradient다. 제곱 손실에서는 잔차 자체다."

[[questions.choices]]
text = '''현재 모델의 예측 $F_{m-1}(\mathbf{x}_i)$'''
feedback = "자기 예측에 맞추면 아무것도 고치지 못한다. 다음 트리는 무엇을 더 더해야 하는지, 즉 남은 오차를 배워야 한다."

[[questions]]
id = "tree-extrapolation"
type = "single"
objective = 2
prompt = '''시효 시간 0.5–12시간의 데이터로 학습한 gradient boosting 모델로 24시간 시효한 시편의 강도를 예측한다. 실제 강도는 시간이 길수록 계속 떨어지는 경향이 있다. 예측에 대한 설명으로 옳은 것은?'''
explanation = '''트리는 학습 범위 밖의 입력을 가장자리 영역에 넣어 그 영역의 상수를 예측한다. 트리들의 합인 boosting도 마찬가지로, 12시간을 넘는 시간에 대해 예측이 더 변하지 않는다. 추세를 연장하지 못하므로 외삽은 따로 검증하고, 필요하면 물리식이나 선형 항과 결합한다.'''

[[questions.choices]]
text = "12시간 근처의 예측과 거의 같은 값을 낸다. 트리는 학습 범위 밖에서 상수를 예측한다."
correct = true

[[questions.choices]]
text = "학습 데이터의 추세를 따라 강도가 계속 떨어지는 값을 낸다."
feedback = "선형 모델은 추세를 연장하지만, 트리의 예측은 계단 함수라 범위 밖에서 마지막 계단 높이에 머문다."

[[questions.choices]]
text = "트리를 수백 개 더한 모델이므로 외삽도 충분히 정확하다."
feedback = "상수 함수를 몇 개 더해도 범위 밖에서는 상수다. 트리 수는 외삽 능력을 주지 않는다."

[[questions.choices]]
text = "예측이 발산한다."
feedback = "고차 다항식과 달리 트리 앙상블은 발산하지 않는다. 대신 변하지 않는 것이 문제다."

[[questions]]
id = "impurity-importance-bias"
type = "single"
objective = 3
prompt = '''랜덤 포레스트의 impurity 기반 중요도에서, 출력과 무관한 로트 번호(값 1000종)가 실제 효과가 있는 공정 라인(값 5종)보다 두 배 높게 나왔다. 가장 알맞은 설명과 대응은?'''
explanation = '''impurity 중요도는 학습 데이터에서 각 분할이 줄인 불순도를 합한다. 값의 종류가 많은 특징은 문턱 후보가 많아 우연히 불순도를 줄이는 분할(잡음을 외우는 분할)을 찾기 쉽고, 그 감소량이 중요도로 쌓인다. 시험 데이터에서 permutation importance를 재면 일반화에 기여하지 않는 특징은 0 근처로 나온다(본문 실험에서 0.00).'''

[[questions.choices]]
text = "값의 종류가 많은 특징이 학습 데이터의 잡음을 나누는 데 쓰인 결과다. 시험 데이터에서 permutation importance로 확인한다."
correct = true

[[questions.choices]]
text = "로트 번호가 실제로 강도에 영향을 준다는 뜻이므로 공정 관리 대상으로 삼는다."
feedback = "로트 번호는 데이터 생성에서 출력과 무관했다. 학습 데이터에서 계산한 중요도는 잡음을 외운 분할도 중요도로 센다."

[[questions.choices]]
text = "트리 수를 늘리면 편향이 사라진다."
feedback = "트리 수를 늘리면 중요도 추정의 변동은 줄지만, 모든 트리에 같은 방향의 편향이 있으므로 사라지지 않는다."

[[questions.choices]]
text = "로트 번호를 표준화하면 중요도가 정상으로 돌아온다."
feedback = "트리는 순서만 보므로 표준화는 분할과 중요도를 바꾸지 않는다. 편향의 원인은 척도가 아니라 분할 후보의 수다."

[[questions]]
id = "importance-not-causal"
type = "multiple"
objective = 3
prompt = '''시험 데이터에서 계산한 permutation importance에 대해 옳은 것을 **모두** 고르시오.'''
explanation = '''permutation importance는 "이 모델이 일반화되는 예측에 이 특징을 얼마나 쓰는가"를 잰다. 같은 정보를 담은 상관된 특징이 있으면 하나를 섞어도 모델이 다른 하나에 기대어 둘 다 낮게 나올 수 있고, 섞은 값은 현실에 없는 입력 조합을 만들 수 있다. 원인과 상관된 특징이나 누수 특징도 높게 나오므로 인과적 중요도가 아니다.'''

[[questions.choices]]
text = "모델이 쓰지 않는 특징은 출력과 상관이 강해도 중요도가 0이다."
correct = true

[[questions.choices]]
text = "강하게 상관된 두 특징은 서로를 대신할 수 있어 둘 다 낮게 나올 수 있다."
correct = true

[[questions.choices]]
text = "시험 데이터에서 계산했으므로 중요도가 높은 특징을 바꾸면 출력이 바뀐다고 결론 내릴 수 있다."
feedback = "시험 데이터에서 잰 것은 일반화되는 예측 관계일 뿐이다. 개입했을 때 출력이 바뀌는지는 실험이나 인과추론으로만 답할 수 있다(16.8장)."

[[questions.choices]]
text = "impurity 중요도와 달리 값의 종류가 많은 특징에 대한 편향이 없으므로 모든 문제가 해결된다."
feedback = "값의 종류에 대한 편향은 크게 줄지만, 상관된 특징과 비현실적인 입력 조합의 문제는 남는다."
