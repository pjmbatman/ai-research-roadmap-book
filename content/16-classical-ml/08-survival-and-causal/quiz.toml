# 16.8 생존분석과 인과추론 기초 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "censoring-drop-bias"
type = "single"
objective = 1
prompt = '''셀 300개의 수명 시험에서 165개가 고장 나기 전에 시험이 끝났다. 고장 난 135개의 수명만으로 중앙 수명을 계산하면 참값과 비교해 어떻게 되는가?'''
explanation = '''시험이 끝날 때까지 고장 나지 않은 셀은 대개 오래 버틴 셀이다. 이들을 버리면 일찍 고장 난 셀만 남으므로 중앙 수명이 과소추정된다. 이 장의 예에서 참값 885 cycle에 대해 698 cycle이었다. 시험 종료 시점을 수명으로 쳐도 오래 버틴 셀의 수명을 깎으므로 같은 방향(687 cycle)으로 틀린다. 중도절단 셀은 "그 시점까지 살아 있었다"는 정보로 Kaplan–Meier 추정량의 위험 집합에 기여해야 한다.'''

[[questions.choices]]
text = "과소추정된다. 버린 셀은 대체로 오래 버틴 셀이기 때문이다."
correct = true

[[questions.choices]]
text = "편향이 없다. 표본이 줄어 분산만 커진다."
feedback = "중도절단은 무작위로 셀을 빼는 것이 아니라 오래 버틴 셀을 선택적으로 뺀다. 그래서 분산이 아니라 편향이 생긴다."

[[questions.choices]]
text = "과대추정된다. 고장 난 셀은 수명이 끝까지 관측되었으므로 정확한 값이기 때문이다."
feedback = "고장 셀의 수명 하나하나는 정확하지만, 어떤 셀이 고장 셀로 남는지가 수명에 의존한다. 남은 표본이 짧은 수명 쪽으로 치우친다."

[[questions.choices]]
text = "중도절단 비율이 절반을 넘으면 어떤 방법으로도 중앙 수명을 추정할 수 없다."
feedback = "Kaplan–Meier는 중도절단 셀의 정보를 써서 이 예에서 중앙 수명 868 cycle(참값 885)을 추정했다. 추정할 수 없는 것은 관측 기간 밖의 생존함수다."

[[questions]]
id = "km-by-hand"
type = "numeric"
objective = 1
prompt = '''셀 5개의 관측 시간과 상태가 다음과 같다: 2(고장), 3(중도절단), 5(고장), 6(중도절단), 7(고장). Kaplan–Meier 추정값 $\hat{S}(5)$는? 소수 셋째 자리까지 답한다.'''
answer = 0.533
tolerance = 0.005
explanation = '''$t = 2$: 위험 집합 5개 중 1개 고장 → $4/5$. $t = 3$의 중도절단은 고장이 아니므로 곱하지 않고 위험 집합에서만 빠진다. $t = 5$: 위험 집합은 관측 시간이 5 이상인 셀(5, 6, 7) 3개, 그중 1개 고장 → $2/3$. 따라서 $\hat{S}(5) = (4/5)(2/3) = 8/15 \approx 0.533$이다. 중도절단 셀을 버리고 고장 셀 3개만 쓰면 $1/3$을, 중도절단을 고장으로 치면 $2/5$를 얻는데 둘 다 과소추정이다.'''

[[questions]]
id = "rul-drop-censored"
type = "single"
objective = 1
prompt = '''잔여 수명(RUL) 회귀 모델을 만들려고 고장까지 관측된 셀만 모아 학습·시험 세트를 만들었다. 시험 RMSE가 작게 나왔다. 이 모델을 아직 시험 중인(중도절단된) 셀이 많은 실제 운용에 쓸 때의 위험은?'''
explanation = '''고장까지 관측된 셀만 쓰면 학습 데이터가 일찍 고장 나는 셀 쪽으로 치우치고, 시험 세트도 같은 방식으로 만들어 같은 편향을 공유한다. 그래서 시험 RMSE는 편향을 드러내지 못한다. 이 장의 예에서 이런 회귀는 수명 수준을 과소추정했을 뿐 아니라 온도의 효과까지 10 °C당 0.98배로 거의 지웠다(참값 0.74배). 운용에서는 오래 가는 셀의 수명을 체계적으로 짧게 예측한다.'''

[[questions.choices]]
text = "학습·시험 데이터가 모두 일찍 고장 나는 셀로 치우쳐, 시험 점수가 편향을 드러내지 못한다. 실제로는 수명과 공변량 효과를 모두 과소추정할 수 있다."
correct = true

[[questions.choices]]
text = "위험이 없다. 시험 세트에서 검증했으므로 일반화가 보장된다."
feedback = "시험 세트가 학습 세트와 같은 선택 과정(고장 셀만)을 거쳤다면, 그 선택이 만든 편향은 시험 점수에 나타나지 않는다."

[[questions.choices]]
text = "운용 데이터가 더 많으므로 분산만 줄어들 뿐 편향은 생기지 않는다."
feedback = "데이터를 더 모아도 선택 과정이 같으면 편향은 그대로다. 문제는 표본 크기가 아니라 어떤 셀이 데이터에 남는가다."

[[questions.choices]]
text = "중도절단된 셀을 학습에 넣으면 label이 틀리므로 이 방법이 유일하게 올바른 방법이다."
feedback = "중도절단 셀의 label은 틀린 것이 아니라 '최소 이만큼'이라는 부등식 정보다. 생존분석은 이 정보를 likelihood에 넣어 쓴다."

[[questions]]
id = "confounded-sign"
type = "single"
objective = 2
prompt = '''관찰 데이터에서 첨가제를 쓴 셀의 용량 감소가 쓰지 않은 셀보다 평균 0.72%p 컸다. 첨가제를 쓴 셀은 평균 운전 온도가 8.7 °C 높고, 온도가 높을수록 열화가 크다. 옳은 결론은?'''
explanation = '''운전 온도는 첨가제 사용(더운 현장에서 더 씀)과 열화(더우면 더 열화) 모두에 영향을 주는 교란 변수다. 단순 비교에는 온도 차이의 효과가 섞여 있어 첨가제의 효과를 말해 주지 않는다. 이 장의 예에서 참 효과는 −1.00%였고, 온도로 보정한 회귀는 −1.02%, 성향점수 가중은 −0.89%를 얻었다. 교란이 있으면 상관의 부호조차 인과 효과와 다를 수 있다.'''

[[questions.choices]]
text = "온도가 교란 변수이므로 단순 비교로는 첨가제의 효과를 알 수 없다. 온도로 보정하거나 무작위 실험을 해야 한다."
correct = true

[[questions.choices]]
text = "첨가제가 열화를 0.72%p 늘린다."
feedback = "관찰된 차이는 첨가제 효과와 온도 차이의 효과가 섞인 것이다. 이 예에서 첨가제의 참 효과는 열화를 줄이는 방향이었다."

[[questions.choices]]
text = "데이터가 충분히 많으면 단순 비교도 참 효과로 수렴한다."
feedback = "표본을 늘리면 단순 비교는 '교란이 섞인 차이'로 더 정확히 수렴할 뿐이다. 편향은 표본 크기로 줄지 않는다."

[[questions.choices]]
text = "첨가제와 열화의 상관이 양수이므로, 적어도 효과의 부호는 양수다."
feedback = "교란이 강하면 부호도 뒤집힌다. 이 예가 정확히 그런 경우다."

[[questions]]
id = "backdoor-adjustment-set"
type = "single"
objective = 3
prompt = '''인과 그래프가 다음과 같다: $Z \to T$, $Z \to Y$, $T \to M \to Y$, $T \to C \leftarrow Y$. $T$가 $Y$에 미치는 **총효과**를 추정하기 위한 보정 집합으로 backdoor 기준을 만족하는 것은?'''
explanation = '''뒷문 경로는 $T \leftarrow Z \to Y$ 하나이고 $Z$로 막힌다. $M$은 $T$의 후손(매개변수)이라 보정하면 $T \to M \to Y$ 경로가 막혀 총효과의 일부(이 장의 예에서는 전부)를 지운다. $C$는 충돌변수로, 보정하면(또는 $C$로 선별하면) 닫혀 있던 $T \to C \leftarrow Y$ 경로가 열려 가짜 연관이 생긴다. 아무것도 보정하지 않으면 뒷문 경로가 열려 있어 교란이 남는다.'''

[[questions.choices]]
text = '''$\{Z\}$'''
correct = true

[[questions.choices]]
text = '''$\{Z, M\}$'''
feedback = "M은 T의 결과(매개변수)다. 보정하면 T가 효과를 내는 경로를 막아 총효과가 사라진다. 이 장의 예에서 −1.00이 −0.01이 되었다."

[[questions.choices]]
text = '''$\{Z, C\}$'''
feedback = "C는 T와 Y의 공통 결과(충돌변수)다. 보정하거나 C로 선별하면 T와 Y 사이에 가짜 연관이 생긴다."

[[questions.choices]]
text = '''$\{\}$ (보정하지 않음)'''
feedback = "T ← Z → Y 뒷문 경로가 열려 있어 교란이 남는다."

[[questions]]
id = "feature-importance-not-causal"
type = "single"
objective = 2
prompt = '''셀의 사이클 수명을 예측하는 랜덤 포레스트에서 "100 cycle 시점의 내부 저항"의 permutation importance가 가장 높았다. 이 결과로 할 수 있는 말은?'''
explanation = '''permutation importance는 그 특징을 섞었을 때 **예측**이 얼마나 나빠지는지를 잰다. 100 cycle 시점의 저항은 초기 열화의 결과이자 수명과 공통 원인(셀의 제조 품질, 운전 조건)을 공유하는 지표라 예측에 매우 유용하다. 그러나 저항을 인위적으로 낮춘다고(예: 측정 방식을 바꾼다고) 수명이 늘어나지는 않는다. 개입의 효과는 인과 구조에 근거한 분석이나 실험으로 따로 확인해야 한다.'''

[[questions.choices]]
text = "이 특징이 수명 예측에 가장 많이 쓰인다는 것만 말할 수 있다. 저항을 낮추면 수명이 늘어난다는 인과적 결론은 따로 근거가 필요하다."
correct = true

[[questions.choices]]
text = "저항이 수명의 가장 큰 원인이므로, 저항을 낮추는 공정 개선이 수명을 가장 많이 늘린다."
feedback = "중요도는 예측에 대한 기여다. 저항은 열화의 결과이거나 공통 원인의 지표일 수 있어, 그 값을 바꾸는 개입이 수명을 바꾼다는 보장이 없다."

[[questions.choices]]
text = "impurity 중요도가 아니라 permutation importance이므로 인과적 해석이 가능하다."
feedback = "permutation importance는 impurity 중요도의 일부 편향(값이 많은 특징 선호)을 줄일 뿐, 여전히 예측 기여를 잰다."

[[questions.choices]]
text = "다른 특징과 상관이 없다면 중요도가 곧 인과 효과다."
feedback = "다른 특징과 무관해도 그 특징이 결과의 후손이거나 측정되지 않은 공통 원인의 지표라면 인과 효과가 아니다."

[[questions]]
id = "randomization-removes-confounding"
type = "single"
objective = 2
prompt = '''같은 현장들에서 첨가제 사용 여부를 동전 던지기로 정해 실험하면, 처치군과 대조군의 단순 평균 비교가 인과 효과를 추정하는 이유는?'''
explanation = '''무작위 배정에서는 처치가 운전 온도는 물론 측정하지 않은 어떤 변수와도 무관해진다. 인과 그래프에서 T로 들어오는 화살표가 모두 사라지므로 뒷문 경로가 없고, 두 군은 모든 특성에서 평균적으로 같은 분포를 가진다. 그래서 관측 여부와 상관없이 모든 교란이 평균적으로 균형을 이룬다. 이 장의 예에서 무작위 배정의 단순 비교는 −0.96%로 참값 −1.00%에 가까웠다.'''

[[questions.choices]]
text = "처치가 어떤 변수와도 무관해져, 측정하지 않은 교란까지 평균적으로 두 군에 균형 있게 나뉘기 때문이다."
correct = true

[[questions.choices]]
text = "무작위 배정을 하면 측정 잡음이 사라지기 때문이다."
feedback = "측정 잡음은 그대로 남는다. 무작위화가 없애는 것은 처치 배정과 다른 변수 사이의 연관이다."

[[questions.choices]]
text = "측정한 교란 변수(온도)가 두 군에서 정확히 같아지기 때문이다. 측정하지 않은 변수는 여전히 보정해야 한다."
feedback = "무작위 배정의 핵심 장점은 측정하지 않은 변수까지 평균적으로 균형을 맞춘다는 것이다. 개별 실험에서는 우연한 불균형이 있을 수 있지만 편향은 아니다."

[[questions.choices]]
text = "표본 수가 충분히 크기 때문이다. 관찰 데이터도 표본이 같으면 같은 결과를 준다."
feedback = "관찰 데이터의 단순 비교는 표본을 늘려도 교란이 섞인 값으로 수렴한다. 차이를 만드는 것은 배정 방식이다."
