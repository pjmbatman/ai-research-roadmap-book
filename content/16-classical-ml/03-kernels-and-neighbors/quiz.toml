# 16.3 커널 방법과 최근접 이웃 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "knn-scale-units"
type = "single"
objective = 1
prompt = '''농도(0.01–0.2 mol/L)와 온도(280–360 K)로 반응 속도를 예측하는 kNN 회귀를 표준화 없이 학습했더니 성능이 평균 baseline과 거의 같았다. 가장 그럴듯한 원인은?'''
explanation = '''Euclid 거리는 모든 특징의 차이를 같은 무게로 더한다. 온도 차이는 최대 80, 농도 차이는 최대 0.19이므로 거리는 사실상 온도만 반영한다. 속도를 크게 좌우하는 농도가 이웃 선택에서 무시되는 것이다. 학습 데이터의 통계량으로 표준화하면 해결된다(본문 실험에서 R² 0.176 → 0.991).'''

[[questions.choices]]
text = "숫자가 큰 온도 특징이 거리를 지배해, 중요한 농도 특징이 이웃 선택에서 무시되었다."
correct = true

[[questions.choices]]
text = "k가 너무 작아 과적합했다."
feedback = "k가 작으면 잡음에 민감해지지만, 성능이 평균 baseline 수준까지 떨어지는 주된 원인은 아니다. 거리가 어떤 특징을 보는지부터 확인한다."

[[questions.choices]]
text = "kNN은 비선형 관계를 표현하지 못한다."
feedback = "kNN은 국소 평균이라 비선형 관계를 잘 표현한다. 표준화하면 같은 데이터에서 R²가 0.99에 이른다."

[[questions.choices]]
text = "온도를 섭씨로 바꾸면 해결된다."
feedback = "섭씨로 바꿔도 범위(7–87 °C)는 여전히 농도보다 수백 배 크다. 단위 선택이 아니라 특징별 퍼짐을 맞추는 표준화가 필요하다."

[[questions]]
id = "knn-irrelevant-features"
type = "single"
objective = 1
prompt = '''출력이 두 특징에만 의존하는 데이터에 무관한 잡음 특징 64개를 더했다. 학습 데이터 수는 그대로다. kNN과 Ridge 선형 모델의 시험 성능은 어떻게 변하겠는가?'''
explanation = '''무관한 차원은 모든 점 사이의 거리에 비슷한 크기의 잡음을 더해, 최근접과 최원 거리의 차이를 줄이고 이웃을 무의미하게 만든다. 본문 실험에서 kNN R²는 0.96에서 0.19로 떨어졌다. 선형 모델은 무관한 특징의 계수를 0 근처로 두면 되므로 거의 영향을 받지 않았다(0.56 → 0.50).'''

[[questions.choices]]
text = "kNN은 크게 나빠지고, 선형 모델은 거의 그대로다."
correct = true

[[questions.choices]]
text = "둘 다 그대로다. 무관한 특징은 출력과 상관이 없으므로 무시된다."
feedback = "선형 모델은 계수로 특징을 무시할 수 있지만, kNN의 Euclid 거리는 모든 특징을 같은 무게로 더하므로 무관한 특징을 무시하지 못한다."

[[questions.choices]]
text = "kNN은 비모수 방법이라 특징이 많을수록 좋아진다."
feedback = "비모수 방법은 데이터가 충분하면 유연하지만, 차원이 늘면 '충분한' 데이터 수가 지수적으로 늘어난다. 같은 데이터 수에서는 나빠진다."

[[questions.choices]]
text = "둘 다 비슷한 정도로 크게 나빠진다."
feedback = "선형 모델은 정규화된 계수로 무관한 특징의 영향을 억제할 수 있다. 국소성에 의존하는 방법이 차원의 저주를 훨씬 강하게 받는다."

[[questions]]
id = "non-support-vector-removal"
type = "single"
objective = 1
prompt = '''선형 SVM을 학습한 뒤, 마진 밖에 있어 서포트 벡터가 아닌 학습 점 50개를 지우고 같은 $C$로 다시 학습했다. 결정 경계는?'''
explanation = '''쌍대 문제의 해에서 마진 밖의 점은 $\alpha_i = 0$이라 $\mathbf{w} = \sum_i \alpha_i y_i \mathbf{x}_i$에 기여하지 않는다. 이 점들을 지워도 남은 점들의 최적해는 그대로이므로 경계가 같다. hinge loss로 보면 이 점들은 손실이 정확히 0이고 기울기도 0이다. 로지스틱 회귀는 모든 점이 손실에 기여하므로 이 성질이 없다.'''

[[questions.choices]]
text = "그대로다. 서포트 벡터가 아닌 점은 해에 기여하지 않는다."
correct = true

[[questions.choices]]
text = "데이터가 줄었으므로 마진이 넓어진다."
feedback = "마진은 데이터 수가 아니라 경계 근처의 점(서포트 벡터)으로 정해진다. 서포트 벡터가 남아 있으면 마진도 그대로다."

[[questions.choices]]
text = "데이터의 25%를 지웠으므로 경계가 크게 바뀐다."
feedback = "지운 점들은 hinge loss가 0이고 쌍대 계수가 0이었다. 몇 개를 지웠는지보다 어떤 점을 지웠는지가 중요하다."

[[questions.choices]]
text = "학습 정확도가 1이 될 때까지 경계가 움직인다."
feedback = "같은 C에서 목적함수는 서포트 벡터에 의해서만 정해진다. 남은 서포트 벡터의 배치가 같으므로 해도 같다."

[[questions]]
id = "krr-equals-gp-mean"
type = "multiple"
objective = 2
prompt = '''같은 RBF 커널을 쓰는 커널 릿지 회귀(정규화 강도 $\lambda$)와 GP 회귀(관측 잡음 분산 $\sigma^2$, 사전평균 0)에 대해 옳은 것을 **모두** 고르시오.'''
explanation = '''KRR 예측 $\mathbf{k}(\mathbf{x})^\top(\mathbf{K} + \lambda\mathbf{I})^{-1}\mathbf{y}$와 GP 사후평균 $\mathbf{k}(\mathbf{x})^\top(\mathbf{K} + \sigma^2\mathbf{I})^{-1}\mathbf{y}$는 $\lambda = \sigma^2$이면 같은 식이다. GP는 여기에 사후분산을 더해, 데이터에서 멀어질수록 불확실성이 사전분산으로 커지는 것을 보여 준다. 두 방법 모두 $N \times N$ 선형계를 풀므로 계산량은 같은 차수이고, RBF 커널의 예측은 데이터에서 멀어지면 사전평균 0으로 돌아간다.'''

[[questions.choices]]
text = '''$\lambda = \sigma^2$이면 KRR 예측과 GP 사후평균이 같다.'''
correct = true

[[questions.choices]]
text = "GP는 학습 점에서 멀어질수록 커지는 사후분산을 함께 준다."
correct = true

[[questions.choices]]
text = "GP는 확률 모델이므로 KRR보다 계산량의 차수가 낮다."
feedback = "둘 다 (K + λI)의 선형계를 풀어 O(N³)이다. GP는 하이퍼파라미터를 주변우도로 최적화하면 그 계산을 반복하므로 오히려 더 비싸다."

[[questions.choices]]
text = "학습 범위 밖에서도 GP 사후평균은 데이터의 추세를 따라 외삽한다."
feedback = "RBF 커널은 거리가 멀면 상관이 0이 되므로, 사후평균은 사전평균(0)으로 돌아간다. 본문 실험에서 x = 12의 사후평균은 −0.08, 사후표준편차는 0.99였다."

[[questions]]
id = "length-scale-choice"
type = "single"
objective = 2
prompt = '''$[0, 10]$에서 약 0.33 간격으로 측정한 사인 곡선에 RBF 커널 릿지 회귀를 맞춘다. 길이 척도 $\ell = 0.1$을 쓰면 학습 점 **사이**의 예측은 어떻게 되는가?'''
explanation = '''$\ell$이 측정 간격보다 훨씬 짧으면, 학습 점에서 조금만 떨어져도 커널 값이 0에 가까워진다. 예측 $\sum_i \alpha_i k(x, x_i)$는 학습 점 근처에서만 값을 갖고 점 사이에서는 0(사전평균)으로 꺼진다. 본문 실험에서 학습 범위 안 RMSE는 $\ell = 0.1$에서 0.421, $\ell = 1$에서 0.100이었다. 길이 척도는 "얼마나 떨어진 입력까지 비슷하다고 볼지"라는 가정이다.'''

[[questions.choices]]
text = "학습 점 근처에서만 값을 갖고, 점 사이에서는 0 쪽으로 꺼진다."
correct = true

[[questions.choices]]
text = "길이 척도가 짧을수록 유연하므로 점 사이도 가장 정확하게 보간한다."
feedback = "유연성은 점 사이를 이어 줄 상관이 있을 때 의미가 있다. 길이 척도가 간격보다 짧으면 이웃한 학습 점 사이에 상관이 없어 보간 자체가 일어나지 않는다."

[[questions.choices]]
text = "모든 점을 잇는 거의 직선이 된다."
feedback = "그것은 길이 척도가 너무 긴 경우다. ℓ = 10이면 사인 곡선의 주기보다 길어 곡선이 펴진다."

[[questions.choices]]
text = "정규화 강도만 맞추면 길이 척도는 결과에 영향이 없다."
feedback = "정규화 강도는 잡음에 대한 가정이고, 길이 척도는 함수의 매끄러움에 대한 가정이다. 둘 다 데이터로 골라야 한다."

[[questions]]
id = "kernel-cost-scaling"
type = "numeric"
objective = 3
prompt = '''정확한 커널 릿지 회귀의 학습 시간이 Cholesky 분해의 $O(N^3)$ 항에 지배된다고 하자. 학습 데이터를 2,000개에서 8,000개로 늘리면 학습 시간은 대략 몇 배가 되는가?'''
answer = 64
tolerance = 0.5
explanation = '''$N$이 4배이므로 $4^3 = 64$배다. Gram 행렬의 메모리는 $4^2 = 16$배가 된다. 랭크 $m$인 Nyström이나 random features 근사를 쓰면 시간은 $O(Nm^2)$로 $N$에 선형이 되어 약 4배에 그친다. 16배라고 답했다면 메모리($N^2$)와 혼동한 것이다.'''
