# 8.4 자동미분과 역전파 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "reverse-mode-cost"
type = "single"
objective = 1
prompt = '''파라미터가 $10^6$개인 신경망의 스칼라 손실 $L$에 대해 모든 파라미터의 gradient가 필요하다. 가장 적은 계산으로 얻는 방법은?'''
explanation = '''출력이 스칼라 하나이면 reverse mode 한 번(순전파 한 번 + 역전파 한 번)으로 모든 입력에 대한 gradient가 나온다. 비용은 입력 차원과 무관하게 순전파 비용의 작은 상수배다. forward mode는 한 번에 한 방향의 방향미분(JVP)만 주므로 gradient 전체를 얻으려면 $10^6$번이 필요하고, 중앙차분은 함수 평가가 $2 \times 10^6$번 필요하다.'''

[[questions.choices]]
text = "reverse mode 한 번. 비용은 순전파의 작은 상수배다."
correct = true

[[questions.choices]]
text = "forward mode 한 번"
feedback = "forward mode 한 번은 입력의 한 방향에 대한 방향미분(JVP) 하나를 준다. gradient의 모든 성분을 얻으려면 입력 차원만큼(10^6번) 반복해야 한다."

[[questions.choices]]
text = "reverse mode를 파라미터마다 한 번씩, 총 10^6번"
feedback = "reverse mode는 출력 하나에 대해 한 번 실행하면 모든 입력에 대한 미분을 한꺼번에 준다. 반복 횟수는 입력이 아니라 출력의 차원에 비례한다."

[[questions.choices]]
text = "중앙차분. 함수를 두 번만 평가하면 된다."
feedback = "중앙차분은 성분 하나마다 함수를 두 번 평가한다. 10^6개 성분이면 2 × 10^6번이고, 결과도 근사값이다."

[[questions]]
id = "forward-mode-tall"
type = "single"
objective = 1
prompt = '''$f: \mathbb{R}^3 \to \mathbb{R}^{1000}$의 Jacobian 전체($1000 \times 3$)가 필요하다. 자동미분으로 계산할 때 더 적은 패스로 끝나는 것은?'''
explanation = '''forward mode 한 번은 Jacobian의 열 하나($\mathbf{J}\mathbf{e}_j$)를 주므로 입력 차원 3번이면 된다. reverse mode 한 번은 행 하나($\mathbf{e}_i^\top\mathbf{J}$)를 주므로 출력 차원 1000번이 필요하다. 입력이 적고 출력이 많으면 forward mode, 입력이 많고 출력이 적으면(손실 함수) reverse mode가 유리하다.'''

[[questions.choices]]
text = "forward mode, 3번"
correct = true

[[questions.choices]]
text = "reverse mode, 1번"
feedback = "reverse mode 한 번은 출력 하나에 대한 gradient, 즉 Jacobian의 한 행을 준다. 출력이 1000개이므로 1000번이 필요하다."

[[questions.choices]]
text = "어느 쪽이든 1번"
feedback = "Jacobian 전체를 한 번에 주는 모드는 없다. forward는 열을, reverse는 행을 하나씩 준다."

[[questions.choices]]
text = "reverse mode, 3번"
feedback = "입력 차원(3)에 비례하는 것은 forward mode다. reverse mode의 반복 횟수는 출력 차원에 비례한다."

[[questions]]
id = "grad-accumulate"
type = "numeric"
objective = 2
prompt = '''스칼라 자동미분 엔진으로 $z = u \cdot u + u$를 만들고 $u = 3$에서 `z.backward()`를 호출했다. 올바르게 구현된 엔진에서 `u.grad`는?'''
answer = 7
tolerance = 0
slider = { min = 0, max = 12, step = 1 }
explanation = '''$u$는 곱셈 노드에 두 번(국소 미분 각각 $u = 3$), 덧셈 노드에 한 번(국소 미분 1) 들어간다. chain rule에 따라 경로마다의 기여를 더하면 $3 + 3 + 1 = 7 = 2u + 1$이다. `p.grad = ...`처럼 덮어쓰면 마지막에 처리한 경로의 값(1이나 3)만 남는다. 그래서 역전파는 `+=`로 누적하고, 새 계산 전에 grad를 0으로 초기화해야 한다.'''

[[questions]]
id = "backprop-vs-training"
type = "single"
objective = 1
prompt = '''PyTorch에서 `loss.backward()`가 하는 일로 옳은 것은?'''
explanation = '''`backward()`는 reverse mode 자동미분으로 손실의 각 파라미터에 대한 gradient를 계산해 `.grad`에 **더할** 뿐이다. 파라미터를 바꾸는 것은 `optimizer.step()`(또는 직접 쓴 업데이트)이고, 학습률·모멘텀 같은 규칙도 그쪽에 있다. 그래서 `backward()`를 여러 번 부르면 gradient가 누적되고, 업데이트 없이 gradient만 계산해 분석에 쓸 수도 있다.'''

[[questions.choices]]
text = "손실의 각 파라미터에 대한 gradient를 계산해 .grad에 누적한다. 파라미터는 바꾸지 않는다."
correct = true

[[questions.choices]]
text = "gradient를 계산하고 파라미터를 gradient 반대 방향으로 업데이트한다."
feedback = "업데이트는 optimizer의 일이다. 역전파는 gradient 계산까지이고, 같은 gradient로 SGD·Adam 등 어떤 규칙도 적용할 수 있다."

[[questions.choices]]
text = "출력의 오차를 입력 쪽으로 보내 각 층의 출력값을 직접 수정한다."
feedback = "역전파가 거꾸로 보내는 것은 손실의 각 중간값에 대한 미분이다. 층의 출력값이나 가중치는 바뀌지 않는다."

[[questions.choices]]
text = ".grad를 새 값으로 덮어써서, 직전 step의 gradient는 자동으로 사라진다."
feedback = "PyTorch는 .grad에 더한다(accumulate). 그래서 학습 루프에서 매 step zero_grad()로 초기화한다."

[[questions]]
id = "fd-float32"
type = "single"
objective = 3
prompt = '''직접 구현한 gradient를 float32 텐서로 중앙차분($h = 10^{-6}$)과 비교했더니 상대오차가 $10^{-2}$였다. 가장 먼저 할 일은?'''
explanation = '''float32의 machine epsilon은 약 $1.2 \times 10^{-7}$이다. $h = 10^{-6}$이면 $f(x + h) - f(x - h)$에서 유효숫자 대부분이 상쇄되고, 반올림 오차가 $h$로 나뉘어 크게 증폭된다. 이 상대오차는 구현의 오류가 아니라 검증 방법의 정밀도 한계일 수 있다. float64로 바꾸고 $h \approx 10^{-6}$ 안팎에서 다시 비교한다. float64에서도 상대오차가 크면 그때 구현을 의심한다.'''

[[questions.choices]]
text = "float64로 바꿔 같은 비교를 다시 한다."
correct = true

[[questions.choices]]
text = "구현한 gradient가 틀렸으므로 유도를 다시 한다."
feedback = "float32에서 h = 1e-6의 중앙차분은 반올림 오차만으로 1e-2 수준의 오차를 낼 수 있다. 틀렸다고 결론 내리기 전에 검증 방법의 정밀도를 확인한다."

[[questions.choices]]
text = "h를 1e-10으로 더 줄여 근사를 정확하게 만든다."
feedback = "h를 줄이면 절단 오차는 줄지만 반올림 오차(대략 machine epsilon / h)는 커진다. float32에서는 오차가 오히려 더 커진다."

[[questions.choices]]
text = "상대오차 1e-2는 충분히 작으므로 통과로 본다."
feedback = "float64 중앙차분에서는 올바른 구현의 상대오차가 보통 1e-7 이하다. 1e-2는 부호나 상수배 오류도 숨길 수 있는 크기다."

[[questions]]
id = "fd-step-size"
type = "single"
objective = 3
prompt = '''float64(machine epsilon 약 $2.2 \times 10^{-16}$)에서 중앙차분 $\big(f(x+h) - f(x-h)\big)/(2h)$의 전체 오차가 가장 작아지는 $h$의 크기는 대략?'''
explanation = '''중앙차분의 절단 오차는 $h^2$에 비례하고, 반올림 오차는 $\epsilon/h$에 비례한다. 두 항의 합은 $h \sim \epsilon^{1/3} \approx 6 \times 10^{-6}$ 근처에서 가장 작다. 본문 실행 결과에서도 float64의 오차는 $h = 10^{-5}$에서 가장 작았다. $f$와 도함수의 크기에 따라 최적점은 조금 움직이므로, 실제 검증에서는 $h$를 몇 자리 바꿔 가며 결과가 안정적인지 본다.'''

[[questions.choices]]
text = '''$10^{-5}$ 근처'''
correct = true

[[questions.choices]]
text = '''$10^{-12}$ 근처, 작을수록 미분의 정의에 가깝다'''
feedback = "수학적 극한과 달리 부동소수점에서는 h가 작을수록 f(x+h) − f(x−h)의 상쇄 오차가 커진다. 반올림 오차는 대략 epsilon/h로 증가한다."

[[questions.choices]]
text = '''$10^{-1}$ 근처'''
feedback = "h가 크면 반올림 오차는 작지만 절단 오차(h²에 비례)가 커진다."

[[questions.choices]]
text = '''$2.2 \times 10^{-16}$, machine epsilon과 같게'''
feedback = "x + h가 x와 거의 구별되지 않아 차분이 0이나 반올림 잡음이 된다. 가장 나쁜 선택 중 하나다."

[[questions]]
id = "vanishing-sigmoid"
type = "numeric"
objective = 3
prompt = '''스칼라 입력·출력을 가진 층 10개를 합성한 $y = \sigma(w_{10}\,\sigma(\cdots\sigma(w_1 x)))$에서 모든 $w_k = 1$이다($\sigma$는 sigmoid). $\lvert dy/dx \rvert$의 가능한 최댓값은? (소수로 답한다. 예: 0.001)'''
answer = 9.5367431640625e-7
tolerance = 1e-8
explanation = '''sigmoid의 도함수 $\sigma'(a) = \sigma(a)(1 - \sigma(a))$는 $a = 0$에서 최댓값 $1/4$이다. chain rule로 $dy/dx = \prod_k w_k\,\sigma'(a_k)$이므로 $\lvert dy/dx \rvert \le (1/4)^{10} \approx 9.54 \times 10^{-7}$이다. 층마다 1보다 작은 배율이 곱해지면 gradient는 깊이에 따라 지수적으로 작아진다. 이것이 gradient 소실이다. (실제로는 모든 층이 동시에 $a_k = 0$일 수 없어 이 상한보다 더 작다.)'''
