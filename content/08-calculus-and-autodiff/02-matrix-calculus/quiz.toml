# 8.2 행렬 미분 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "grad-shape-matrix"
type = "single"
objective = 2
prompt = '''스칼라 손실 $L$과 가중치 행렬 $\mathbf{W} \in \mathbb{R}^{3 \times 5}$가 있다. 이 책의 규약에서 $\nabla_{\mathbf{W}} L$의 shape은?'''
explanation = '''이 책은 스칼라를 행렬로 미분한 gradient를 **그 행렬과 같은 shape**으로 쓴다. $(i, j)$ 성분이 $\partial L / \partial W_{ij}$인 $3 \times 5$ 행렬이다. 그래야 경사하강 $\mathbf{W} \leftarrow \mathbf{W} - \eta \nabla_{\mathbf{W}} L$이 성분별로 바로 맞고, PyTorch의 `.grad`도 같은 규약을 쓴다.'''

[[questions.choices]]
text = '''$3 \times 5$, $\mathbf{W}$와 같은 shape'''
correct = true

[[questions.choices]]
text = '''$5 \times 3$'''
feedback = "스칼라-행렬 미분을 numerator layout으로 쓰면 전치된 5 × 3이 나온다. 이 책은 gradient를 파라미터와 같은 shape으로 고정한다. 다른 교재의 공식을 옮길 때 이 차이로 전치가 생긴다."

[[questions.choices]]
text = '''$15 \times 1$ 열벡터'''
feedback = "행렬을 벡터로 펼치면(vec) 15차원 gradient로 볼 수 있지만, 그것은 계산의 중간 표현이다. 업데이트에 쓰는 gradient는 W와 같은 3 × 5로 다시 접는다."

[[questions.choices]]
text = '''$1 \times 15$ 행벡터'''
feedback = "펼친 벡터에 대한 Jacobian(1 × 15)이다. 같은 정보이지만 이 책의 gradient 규약이 아니다."

[[questions]]
id = "quadratic-form-gradient"
type = "single"
objective = 1
prompt = '''$\mathbf{A}$가 **대칭이 아닌** $n \times n$ 행렬일 때 $f(\mathbf{x}) = \mathbf{x}^\top \mathbf{A} \mathbf{x}$의 gradient는?'''
explanation = '''미분형으로 $df = d\mathbf{x}^\top \mathbf{A}\mathbf{x} + \mathbf{x}^\top\mathbf{A}\,d\mathbf{x} = \mathbf{x}^\top(\mathbf{A}^\top + \mathbf{A})\,d\mathbf{x}$이다. $df = \nabla f^\top d\mathbf{x}$의 꼴로 읽으면 $\nabla f = (\mathbf{A} + \mathbf{A}^\top)\mathbf{x}$다. $\mathbf{A}$가 대칭일 때만 $2\mathbf{A}\mathbf{x}$로 줄어든다.'''

[[questions.choices]]
text = '''$(\mathbf{A} + \mathbf{A}^\top)\mathbf{x}$'''
correct = true

[[questions.choices]]
text = '''$2\mathbf{A}\mathbf{x}$'''
feedback = "A가 대칭일 때만 맞다. 일반적인 A에서는 x가 양쪽에 있으므로 두 항 Ax와 A^T x가 따로 나온다."

[[questions.choices]]
text = '''$\mathbf{A}^\top\mathbf{x}$'''
feedback = "오른쪽 x에 대한 기여만 계산했다. 왼쪽 x^T에도 x가 있으므로 Ax 항이 더해져야 한다."

[[questions.choices]]
text = '''$\mathbf{x}^\top(\mathbf{A} + \mathbf{A}^\top)$'''
feedback = "값은 같지만 행벡터다. 이 책은 gradient를 열벡터로 쓰므로 이것을 전치한 것이 gradient다."

[[questions]]
id = "trace-differential"
type = "single"
objective = 1
prompt = '''스칼라 함수 $L(\mathbf{X})$의 미분형을 정리했더니 $dL = \operatorname{tr}(\mathbf{M}\,d\mathbf{X})$가 되었다. $\nabla_{\mathbf{X}} L$은?'''
explanation = '''gradient는 $dL = \operatorname{tr}(\mathbf{G}^\top d\mathbf{X}) = \sum_{ij} G_{ij}\,dX_{ij}$을 만족하는 $\mathbf{G}$다. $\operatorname{tr}(\mathbf{M}\,d\mathbf{X}) = \operatorname{tr}((\mathbf{M}^\top)^\top d\mathbf{X})$이므로 $\mathbf{G} = \mathbf{M}^\top$이다. 확인: $L = \operatorname{tr}(\mathbf{A}\mathbf{X})$이면 $\partial L/\partial X_{ij} = A_{ji}$이므로 gradient는 $\mathbf{A}^\top$이다.'''

[[questions.choices]]
text = '''$\mathbf{M}^\top$'''
correct = true

[[questions.choices]]
text = '''$\mathbf{M}$'''
feedback = "읽는 형식이 tr(G^T dX)라는 점을 놓쳤다. tr(M dX)에서 G^T = M이므로 G = M^T다. M이 대칭일 때만 둘이 같다."

[[questions.choices]]
text = '''$\operatorname{tr}(\mathbf{M})\,\mathbf{I}$'''
feedback = "trace는 미분형을 스칼라로 만드는 도구일 뿐이다. dX의 각 성분에 붙는 계수를 모아야 한다."

[[questions]]
id = "logdet-gradient-entry"
type = "numeric"
objective = 1
prompt = '''$\mathbf{X} = \begin{bmatrix} 2 & 1 \\ 0 & 4 \end{bmatrix}$일 때 $\nabla_{\mathbf{X}} \log\det\mathbf{X}$의 $(2, 1)$ 성분(2행 1열)은?'''
answer = -0.125
tolerance = 0.001
explanation = '''$\nabla_{\mathbf{X}} \log\det\mathbf{X} = \mathbf{X}^{-\top}$이다. $\mathbf{X}^{-1} = \tfrac{1}{8}\begin{bmatrix} 4 & -1 \\ 0 & 2 \end{bmatrix}$이므로 $\mathbf{X}^{-\top} = \begin{bmatrix} 0.5 & 0 \\ -0.125 & 0.25 \end{bmatrix}$이고, $(2, 1)$ 성분은 $-0.125$다. 직접 확인할 수도 있다. $\det\mathbf{X} = X_{11}X_{22} - X_{12}X_{21}$이므로 $\partial \log\det\mathbf{X} / \partial X_{21} = -X_{12}/\det\mathbf{X} = -1/8$이다. 전치를 빠뜨리고 $\mathbf{X}^{-1}$의 $(2, 1)$ 성분을 읽으면 0이 나온다.'''

[[questions]]
id = "softmax-ce-gradient"
type = "single"
objective = 3
prompt = '''logit $\mathbf{z} \in \mathbb{R}^K$, 확률 $\mathbf{p} = \operatorname{softmax}(\mathbf{z})$, one-hot 정답 $\mathbf{y}$에 대해 cross-entropy $L = -\sum_k y_k \log p_k$의 logit gradient $\nabla_{\mathbf{z}} L$은?'''
explanation = '''$\log p_k = z_k - \log\sum_j e^{z_j}$이므로 $\partial(\log p_k)/\partial z_i = \delta_{ki} - p_i$다. 따라서 $\partial L/\partial z_i = -\sum_k y_k(\delta_{ki} - p_i) = -y_i + p_i\sum_k y_k = p_i - y_i$다($\sum_k y_k = 1$). softmax의 Jacobian $\operatorname{diag}(\mathbf{p}) - \mathbf{p}\mathbf{p}^\top$과 $-\mathbf{y}/\mathbf{p}$의 곱을 정리해도 같은 결과가 나온다.'''

[[questions.choices]]
text = '''$\mathbf{p} - \mathbf{y}$'''
correct = true

[[questions.choices]]
text = '''정답 클래스 $c$의 성분만 $-1/p_c$이고 나머지는 0'''
feedback = "이것은 확률 p에 대한 gradient ∂L/∂p다. logit z까지 가려면 softmax의 Jacobian을 한 번 더 곱해야 하고, softmax는 모든 성분이 서로 얽혀 있어 나머지 성분도 0이 아니게 된다."

[[questions.choices]]
text = '''$\mathbf{y} - \mathbf{p}$'''
feedback = "부호가 반대다. 정답 클래스의 logit을 올리면 손실이 줄어야 하므로 그 성분의 gradient는 음수(p_c − 1 < 0)다."

[[questions.choices]]
text = '''$\mathbf{p} \odot (\mathbf{1} - \mathbf{p})$'''
feedback = "softmax Jacobian의 대각 성분만 가져온 것이다. softmax는 성분별 함수가 아니므로 비대각 성분 −p_i p_j도 기여한다."

[[questions]]
id = "softmax-ce-uniform"
type = "numeric"
objective = 3
prompt = '''클래스가 4개이고 네 logit이 모두 같다. 정답 클래스의 logit에 대한 cross-entropy의 편미분 $\partial L / \partial z_c$는?'''
answer = -0.75
tolerance = 0.001
explanation = '''logit이 모두 같으면 $\mathbf{p} = (1/4, 1/4, 1/4, 1/4)$이다. 정답 성분의 gradient는 $p_c - 1 = 0.25 - 1 = -0.75$, 나머지 성분은 각각 $0.25$다. 네 성분의 합은 0이다. 음수이므로 정답 logit을 올리는 방향으로 학습이 진행된다.'''

[[questions]]
id = "mlp-backprop-transpose"
type = "single"
objective = 3
prompt = '''한 샘플에 대해 $\mathbf{z} = \mathbf{W}_2\mathbf{h} + \mathbf{b}_2$이고 $\mathbf{W}_2 \in \mathbb{R}^{K \times H}$다. 출력 쪽 gradient $\mathbf{g}_z = \nabla_{\mathbf{z}} L \in \mathbb{R}^K$를 알 때, 은닉 출력의 gradient $\nabla_{\mathbf{h}} L$은?'''
explanation = '''$\mathbf{z}$의 $\mathbf{h}$에 대한 Jacobian은 $\mathbf{W}_2$ $(K \times H)$이다. chain rule에서 스칼라 손실의 gradient는 Jacobian의 전치를 곱해 전달되므로 $\nabla_{\mathbf{h}} L = \mathbf{W}_2^\top \mathbf{g}_z$, shape $(H \times K)(K,) = (H,)$이다. $\mathbf{g}_z\mathbf{h}^\top$은 $\mathbf{W}_2$의 gradient로, 다른 대상이다.'''

[[questions.choices]]
text = '''$\mathbf{W}_2^\top \mathbf{g}_z$'''
correct = true

[[questions.choices]]
text = '''$\mathbf{W}_2 \mathbf{g}_z$'''
feedback = "(K × H) 행렬에 K차원 벡터를 곱할 수 없다(H ≠ K). H = K일 때는 shape이 맞아 오류 없이 틀린 값이 나오므로 더 위험하다."

[[questions.choices]]
text = '''$\mathbf{g}_z \mathbf{h}^\top$'''
feedback = "이것은 가중치 W2에 대한 gradient(K × H)다. 은닉 출력 h에 대한 gradient는 H차원 벡터여야 한다."

[[questions.choices]]
text = '''$\mathbf{g}_z$를 그대로 전달한다'''
feedback = "선형층을 지날 때 gradient는 가중치의 전치로 변환된다. shape도 K에서 H로 바뀐다."
