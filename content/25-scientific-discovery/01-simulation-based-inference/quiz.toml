# 25.1 시뮬레이션 기반 추론 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "likelihood-free-meaning"
type = "single"
objective = 1
prompt = '''확률적 시뮬레이터로 파라미터를 추론할 때 "우도를 쓸 수 없다"는 말의 뜻으로 가장 정확한 것은?'''
explanation = '''시뮬레이터는 $\mathbf{x} \sim p(\mathbf{x} \mid \theta)$를 뽑을 수 있지만, 그 확률밀도의 값은 관측되지 않는 무작위 경로 $\mathbf{z}$ 전체에 대한 적분 $\int p(\mathbf{x}, \mathbf{z} \mid \theta)\,d\mathbf{z}$라서 계산할 수 없다. 사후분포는 여전히 잘 정의되어 있고, 시뮬레이션 표본으로 근사할 수 있다. 우도의 값이 필요한 MCMC의 수용 확률 같은 연산만 쓸 수 없다.'''

[[questions.choices]]
text = '''시뮬레이터로 $\mathbf{x}$를 뽑을 수는 있지만, 주어진 $\mathbf{x}$의 확률밀도 $p(\mathbf{x} \mid \theta)$를 계산할 수는 없다.'''
correct = true

[[questions.choices]]
text = "우도가 존재하지 않으므로 사후분포도 정의되지 않는다. 그래서 점추정만 가능하다."
feedback = "우도 함수는 수학적으로 존재한다. 계산할 수 없을 뿐이다. 그래서 사후분포도 존재하고, 시뮬레이션으로 근사한다."

[[questions.choices]]
text = "시뮬레이터가 결정론적이어서 확률 모델이 아니다."
feedback = "결정론적 순방향 모델에 가우시안 잡음을 더하는 경우는 오히려 우도를 바로 쓸 수 있다(24.7장). 우도 없는 추론은 시뮬레이터 안에 무작위 경로가 있어 그 적분을 계산할 수 없을 때의 문제다."

[[questions.choices]]
text = "관측 데이터가 너무 적어서 우도가 평평하다."
feedback = "데이터의 양과 우도의 계산 가능성은 다른 문제다. 데이터가 아무리 많아도 우도의 값을 계산할 수 없으면 우도 없는 추론이 필요하다."

[[questions]]
id = "uninformative-summary"
type = "single"
objective = 1
prompt = '''AR(1) 과정 $x_t = \rho x_{t-1} + \varepsilon_t$의 $\rho$를 ABC로 추론하면서 요약 통계로 **시계열의 평균 하나만** 쓰면, 받아들인 표본의 분포는 어떻게 될까? (사전분포 $\rho \sim U(0, 1)$, 허용 오차는 작게)'''
explanation = '''AR(1)의 평균은 $\rho$와 상관없이 0 근처다. 평균이 관측값과 가까운지는 $\rho$를 거의 가리지 못하므로, 받아들인 표본은 사전분포와 비슷하게 퍼진다. 본문 셀 2에서 사후 표준편차가 0.240으로 사전분포의 0.289와 크게 다르지 않았다. 허용 오차를 줄이면 통계에 담긴 정보까지는 정확해지지만, 통계에 없는 정보는 생기지 않는다. ABC의 정확도는 요약 통계가 $\theta$에 대해 얼마나 충분한지에 묶여 있다.'''

[[questions.choices]]
text = "사전분포와 비슷하게 넓게 퍼진다. 평균은 ρ에 대한 정보를 거의 담고 있지 않다."
correct = true

[[questions.choices]]
text = "허용 오차가 작으므로 정확한 사후분포에 가까워진다."
feedback = "허용 오차를 0으로 보내면 '요약 통계가 주어졌을 때의 사후분포'로 수렴한다. 그 통계가 ρ에 대한 정보를 담지 않으면 그 분포는 사전분포와 비슷하다."

[[questions.choices]]
text = "참값 근처의 좁은 분포가 되지만 약간 치우친다."
feedback = "좁아지려면 통계가 ρ에 따라 달라져야 한다. 평균은 ρ에 거의 의존하지 않는다."

[[questions.choices]]
text = "받아들이는 표본이 하나도 없어 알고리즘이 실패한다."
feedback = "수용 비율로 허용 오차를 정하면 항상 정해진 수만큼 받아들인다. 문제는 받아들인 표본이 정보를 담지 않는다는 것이다."

[[questions]]
id = "tolerance-to-prior"
type = "single"
objective = 1
prompt = '''ABC rejection에서 허용 오차 $\epsilon$을 계속 키우면(수용 비율 $q \to 1$) 받아들인 표본의 분포는 무엇에 가까워지는가?'''
explanation = '''$\epsilon$이 충분히 크면 모든 시뮬레이션을 받아들인다. 그 표본은 사전분포에서 뽑은 $\theta_i$ 그대로이므로 사전분포가 된다. 반대 극한 $\epsilon \to 0$에서는 요약 통계가 주어졌을 때의 사후분포 $p(\theta \mid \mathbf{s}_{\text{obs}})$가 된다. 본문 셀 2에서 $q = 0.5$의 사후 표준편차(0.190)가 $q = 0.01$(0.130)보다 사전분포 쪽(0.289)으로 넓어진 것이 이 경향이다.'''

[[questions.choices]]
text = "사전분포"
correct = true

[[questions.choices]]
text = "최대우도 추정값에 모인 점질량"
feedback = "허용 오차를 키우면 관측값과 먼 시뮬레이션도 받아들이므로 분포는 넓어진다. 점질량은 반대 방향의 극단에 가깝다."

[[questions.choices]]
text = "정확한 사후분포. 표본이 많아질수록 정확해지기 때문이다."
feedback = "표본 수가 늘어 몬테카를로 잡음은 줄지만, 관측값과 무관한 표본을 받아들이는 편향이 커진다."

[[questions.choices]]
text = "균일분포. 사전분포와 상관없이 받아들인 θ가 고르게 퍼진다."
feedback = "받아들인 θ는 사전분포에서 뽑은 값이다. 사전분포가 균일하지 않으면 결과도 균일하지 않다."

[[questions]]
id = "prior-interval-width"
type = "numeric"
objective = 3
prompt = '''사전분포가 $\rho \sim U(0, 1)$일 때, 데이터를 무시하고 언제나 **사전분포의 중앙 90% 구간**을 사후 구간으로 보고하는 "추론기"가 있다. 사전분포에서 참값을 뽑아 coverage를 재면 0.9가 나온다. 이 추론기가 보고하는 구간의 폭은 얼마인가?'''
answer = 0.9
tolerance = 0.005
slider = { min = 0, max = 1, step = 0.05 }
explanation = '''$U(0, 1)$의 중앙 90% 구간은 $[0.05, 0.95]$이고 폭은 0.9다. 사전분포에서 참값을 뽑으면 이 구간은 정확히 90%의 참값을 포함하므로 coverage 점검을 완벽하게 통과한다. 그러나 데이터에서 아무것도 배우지 않았다. coverage는 보정의 필요조건일 뿐이고, 구간 폭(sharpness)을 함께 보고해야 한다. 본문 셀 3의 $q = 0.8$ ABC(평균 폭 0.788)가 이 극단에 가깝다.'''

[[questions]]
id = "npe-amortization"
type = "multiple"
objective = 2
prompt = '''결합분포의 시뮬레이션 쌍 $(\theta_i, \mathbf{x}_i)$로 학습한 amortized 신경 사후 추정(NPE)에 대해 옳은 것을 모두 고르시오.'''
explanation = '''NPE는 $-\mathbb{E}[\log q_\phi(\theta \mid \mathbf{x})]$를 최소화해 모든 $\mathbf{x}$에 대한 조건부분포를 한꺼번에 학습하므로, 새 관측값에는 순방향 계산 한 번이면 된다(amortization). 학습에 우도는 필요 없다. 그러나 신경망이 근사이므로 과신할 수 있어 coverage 점검이 필요하고(Hermans 외, 2022), 시뮬레이터 안에서 학습했으므로 시뮬레이터가 현실과 다르면 그 오류를 그대로 물려받는다.'''

[[questions.choices]]
text = "한 번 학습하면 새 관측값의 사후분포를 재학습 없이 순방향 계산으로 얻는다."
correct = true

[[questions.choices]]
text = "학습에 시뮬레이터의 우도 값이 필요하지 않다."
correct = true

[[questions.choices]]
text = "음의 로그우도로 학습했으므로 사후분포가 자동으로 보정되어 있어 coverage 점검이 필요 없다."
feedback = "손실을 최소화하는 이상적인 해가 참 사후분포라는 뜻일 뿐, 유한한 데이터와 신경망으로 얻은 근사는 과신할 수 있다. 본문처럼 시험 데이터로 coverage를 확인한다."

[[questions.choices]]
text = "시뮬레이터로 학습했지만 실제 데이터의 측정 잡음까지 자동으로 학습한다."
feedback = "NPE는 시뮬레이터가 만든 데이터만 본다. 시뮬레이터에 없는 측정 잡음은 학습할 수 없고, 그런 데이터에서는 사후분포가 틀린다."

[[questions]]
id = "low-coverage-meaning"
type = "single"
objective = 3
prompt = '''시뮬레이터로 만든 시험 데이터에서는 90% 사후 구간의 coverage가 0.89였는데, 측정 잡음이 섞인 실제와 비슷한 데이터에서는 0.63으로 떨어졌다. 구간 폭은 두 경우 비슷했다. 가장 그럴듯한 해석은?'''
explanation = '''같은 추론기가 시뮬레이터 데이터에서는 보정되어 있으므로 알고리즘 자체의 문제는 아니다. 실제 데이터를 만든 과정이 시뮬레이터와 달라(model misspecification) 사후분포가 틀린 곳에 자신 있게 모인 것이다. 구간 폭이 비슷하므로 사후분포만 보아서는 알 수 없고, 추론에 쓰지 않은 통계로 한 사후 예측 점검이 이를 드러낸다. 해결책은 허용 오차나 표본 수가 아니라 시뮬레이터를 고치는 것이다.'''

[[questions.choices]]
text = "시뮬레이터가 실제 데이터 생성 과정과 달라서, 사후분포가 틀린 값 주변에 과신한 채 모였다."
correct = true

[[questions.choices]]
text = "사후분포가 너무 넓어서(보수적이어서) 참값을 놓쳤다."
feedback = "구간이 넓으면 참값을 더 자주 포함한다. coverage가 명목값보다 낮다는 것은 구간이 너무 좁거나 엉뚱한 곳에 있다는 뜻이다."

[[questions.choices]]
text = "시험 데이터가 300개뿐이라 생긴 우연한 변동이다. 데이터를 늘리면 0.9로 돌아온다."
feedback = "300개에서 명목값 0.9의 이항 표준오차는 약 0.017이다. 0.63은 우연으로 설명할 수 없는 차이이고, 같은 크기의 시뮬레이터 데이터에서는 0.89였다."

[[questions.choices]]
text = "ABC의 허용 오차를 더 줄이면 해결된다."
feedback = "허용 오차를 줄이면 시뮬레이터 안에서의 근사가 정확해질 뿐이다. 시뮬레이터가 틀렸으면 그 틀린 모델의 사후분포에 더 정확하게 수렴한다."
