# 25.5 과학 Foundation Model과 AI 에이전트 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "transfer-small-data"
type = "single"
objective = 1
prompt = '''같은 분포의 비표지 데이터로 사전학습한 표현을 쓰면 표지 10개에서 R²가 0.722 → 0.874로 크게 올랐지만, 표지 1000개에서는 0.927 → 0.930으로 거의 같았다. 이 결과의 해석으로 가장 정확한 것은?'''
explanation = '''사전학습 표현은 비표지 데이터의 구조(잠재 요인)를 미리 찾아 두므로, 표지 데이터가 적어 하위 모델이 그 구조를 스스로 찾기 어려울 때 크게 돕는다. 표지가 충분하면 원시 입력으로도 같은 구조를 배울 수 있어 이득이 사라진다. 그래서 사전학습의 가치는 "표지 데이터를 얼마나 아껴 주는가"로 말하는 것이 정확하고, 데이터 크기별 곡선으로 보고한다.'''

[[questions.choices]]
text = "사전학습의 이득은 주로 표지 데이터가 적을 때 나타나며, 표지가 충분하면 사라질 수 있다."
correct = true

[[questions.choices]]
text = "표지 1000개에서 이득이 없으므로 사전학습은 이 과제에 쓸모없다."
feedback = "표지 10–30개 구간의 큰 이득을 무시한 결론이다. 표지 데이터가 비싼 과학 과제에서는 그 구간이 바로 실제 상황이다."

[[questions.choices]]
text = "표지 1000개에서는 과적합이 일어나 사전학습 표현이 망가졌다."
feedback = "표현은 고정되어 있고 성능도 0.930으로 떨어지지 않았다. 원시 입력이 따라잡은 것이다."

[[questions.choices]]
text = "사전학습 모델이 클수록 표지 1000개에서도 이득이 커진다."
feedback = "이 결과에서 이득을 정한 것은 모델 크기가 아니라 표지 데이터의 양과 사전학습 데이터와 과제의 관계다."

[[questions]]
id = "label-efficiency"
type = "numeric"
objective = 1
prompt = '''아래는 같은 과제의 시험 R²(시드 20개 중앙값)다.

| 표지 수 | 원시 입력 | 사전학습 표현 |
|---|---|---|
| 10 | 0.722 | 0.874 |
| 30 | 0.870 | 0.915 |
| 100 | 0.913 | 0.927 |

사전학습 표현이 표지 10개로 낸 성능(0.874)에 원시 입력이 처음으로 가장 가까워지는 표지 수는 표의 값 중 무엇인가?'''
answer = 30
tolerance = 0
slider = { min = 10, max = 100, step = 10 }
explanation = '''원시 입력은 표지 30개에서 0.870으로 0.874에 가장 가까워진다(표지 100개의 0.913은 이미 넘어선 값이다). 즉 이 과제에서 사전학습 표현은 표지 데이터를 약 3배 아껴 준다. 사전학습 모델의 효과를 "R²가 몇 오른다" 대신 "같은 성능에 필요한 표지 수가 얼마나 줄어드는가"로 표현하면, 표지 하나의 비용(실험·계산)과 직접 비교할 수 있다.'''

[[questions]]
id = "split-leakage"
type = "single"
objective = 2
prompt = '''분자 물성 예측에서 같은 모델의 시험 R²가 무작위 분할에서 0.95, 골격(scaffold) 단위 분할에서 0.34였다. 새 골격의 분자를 설계하는 데 이 모델을 쓰려 한다면 어떤 숫자를 보고해야 하는가?'''
explanation = '''새 골격의 분자를 예측하는 것이 목적이면 시험 데이터도 학습에 없던 골격이어야 한다. 무작위 분할에서는 같은 골격의 형제 분자가 학습 데이터에 있어서, 모델은 형제의 성질을 베끼는 것만으로 높은 점수를 얻는다. 0.95는 "이미 본 골격의 변형"에 대한 성능이다. 두 숫자를 함께 보고하되, 용도에 맞는 것은 골격 단위 분할의 0.34다.'''

[[questions.choices]]
text = "골격 단위 분할의 0.34를 용도에 맞는 성능으로 보고하고, 두 분할의 차이를 함께 밝힌다."
correct = true

[[questions.choices]]
text = "더 높은 0.95. 무작위 분할이 표준적인 방법이기 때문이다."
feedback = "무작위 분할은 시험 시료와 거의 같은 형제가 학습에 들어가는 것을 막지 못한다. 용도(새 골격)와 시험 조건이 맞지 않는다."

[[questions.choices]]
text = "두 값의 평균 0.65"
feedback = "평균은 어떤 실제 사용 상황에도 대응하지 않는다. 용도에 맞는 분할의 결과를 보고한다."

[[questions.choices]]
text = "0.34는 모델이 나쁘다는 뜻이므로 모델을 바꾼 뒤 다시 무작위 분할로 평가한다."
feedback = "모델을 바꿔도 무작위 분할은 같은 누수를 갖는다. 평가 설계를 먼저 용도에 맞춘다."

[[questions]]
id = "pretraining-overlap"
type = "multiple"
objective = 2
prompt = '''공개 단백질 서열 전체로 사전학습한 모델을 단백질 안정성 벤치마크에 전이했더니 성능이 좋았다. "사전학습 데이터에 시험 단백질이 이미 있어서 생긴 이득이 아닌가"를 점검하는 방법을 모두 고르시오.'''
explanation = '''시험 단백질과 사전학습 데이터의 서열 유사도를 직접 검사하고, 유사한 것을 뺀 부분집합에서 따로 평가하고, 사전학습 데이터 수집 이후에 나온 단백질로 평가하면 암기와 전이를 구분할 수 있다. 사전학습이 비표지였다는 사실은 누수를 막지 못한다. 모델은 정답(안정성)은 몰라도 그 서열의 구조와 통계를 이미 학습했다.'''

[[questions.choices]]
text = "시험 단백질과 사전학습 데이터의 서열 유사도(근접 중복)를 직접 검사한다."
correct = true

[[questions.choices]]
text = "사전학습 데이터와 유사도가 높은 시험 단백질을 뺀 부분집합에서 따로 평가한다."
correct = true

[[questions.choices]]
text = "사전학습 데이터 수집 시점 이후에 새로 나온 단백질로 평가한다."
correct = true

[[questions.choices]]
text = "사전학습은 표지 없이 했으므로 누수가 생길 수 없어 점검할 필요가 없다."
feedback = "비표지 사전학습도 시험 시료의 서열 구조를 학습한다. 정답을 몰라도 그 시료에 대한 표현은 이미 최적화되어 있다."

[[questions]]
id = "agent-verification"
type = "single"
objective = 3
prompt = '''연구 에이전트가 시뮬레이션을 돌리고 분석 코드를 작성해 "물질 A의 확산 계수는 2.3 × 10⁻⁹ m²/s"라고 보고했다. 에이전트는 자신이 작성한 테스트도 모두 통과했다고 했다. 이 수치를 논문에 쓰기 전에 가장 필요한 것은?'''
explanation = '''에이전트가 스스로 쓴 테스트는 에이전트의 가정을 그대로 공유하므로 독립 검증이 아니다. 단계별 기록(도구 호출의 입력·출력)으로 무엇을 했는지 확인하고, 사람이 코드를 다시 실행해 수치를 재현하고, 답이 알려진 물질에 같은 절차를 적용해 알려진 값이 나오는지(양성 대조) 확인해야 한다. 도구가 만든 결과를 검증 없이 보고하면 책임은 보고한 연구자에게 있다.'''

[[questions.choices]]
text = "단계별 기록을 확인하고, 사람이 독립적으로 재실행해 재현하며, 답이 알려진 물질에서 같은 절차를 먼저 검증한다."
correct = true

[[questions.choices]]
text = "에이전트가 작성한 테스트를 통과했으므로 그대로 쓴다."
feedback = "같은 에이전트가 쓴 테스트는 같은 오해를 공유할 수 있다. 독립적인 재현과 양성 대조가 필요하다."

[[questions.choices]]
text = "같은 질문을 에이전트에게 다시 물어 같은 답이 나오면 쓴다."
feedback = "같은 시스템이 같은 답을 내는 것은 일관성이지 정확성이 아니다. 같은 오류를 반복할 수 있다."

[[questions.choices]]
text = "단위가 m²/s로 맞으므로 쓴다."
feedback = "단위가 맞는 것은 필요조건일 뿐이다. 값 자체가 맞는지는 재현과 대조로 확인한다."

[[questions]]
id = "dual-use-scope"
type = "single"
objective = 3
prompt = '''분자 생성 모델과 합성 경로 검색 도구를 연결한 에이전트를 공개하려 한다. 이중 용도 위험과 관련해 가장 적절한 판단은?'''
explanation = '''신약 설계와 같은 방식으로 해로운 화합물 설계도 가능하다는 것이 알려져 있다(Urbina 외, 2022). 그래서 공개 범위, 도구 접근 범위(특히 합성 경로와 위험 물질 정보), 사용 기록을 설계 단계에서 정하고, 기관의 연구 윤리·안전 절차를 거친다. "목적이 선하다"는 것은 도구가 다른 목적으로 쓰이는 것을 막지 못한다.'''

[[questions.choices]]
text = "목표를 바꾸면 해로운 분자 설계에도 쓰일 수 있으므로, 공개 전에 도구 접근 범위와 위험을 평가하고 기관 절차를 따른다."
correct = true

[[questions.choices]]
text = "신약 개발이 목적이므로 이중 용도 위험은 해당하지 않는다."
feedback = "개발자의 목적과 무관하게, 생성 모델은 목표 함수만 바꾸면 다른 목적으로 쓰일 수 있다."

[[questions.choices]]
text = "공개 데이터로만 학습했으므로 위험이 없다."
feedback = "공개 데이터로 학습한 모델도 그 데이터를 조합해 새로운 위험 물질을 제안할 수 있다. 위험은 데이터의 공개 여부가 아니라 모델의 능력에서 나온다."

[[questions.choices]]
text = "위험이 있으므로 관련 연구를 모두 중단해야 한다."
feedback = "이중 용도 위험은 연구를 금지하는 이유가 아니라 공개 범위·접근 통제·검토 절차를 설계할 이유다."
