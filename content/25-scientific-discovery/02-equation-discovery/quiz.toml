# 25.2 방정식 발견과 기호 회귀 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "finite-difference-noise"
type = "single"
objective = 1
prompt = '''측정 잡음이 있는 궤적에서 SINDy를 쓸 때, 샘플링 간격 $\Delta t$를 10배 촘촘하게 하고 미분은 중앙 유한차분으로 그대로 계산했다. 미분 추정값에 섞인 잡음은 어떻게 될까?'''
explanation = '''중앙 차분의 잡음 항은 $(\eta_{k+1} - \eta_{k-1}) / (2\Delta t)$이고 표준편차는 $\sigma_\eta / (\sqrt{2}\,\Delta t)$다. $\Delta t$를 10배 줄이면 잡음이 10배 커진다. 절단 오차 $O(\Delta t^2)$는 줄지만 잡음이 있는 데이터에서는 잡음 증폭이 지배한다. 그래서 평활 미분(Savitzky–Golay 등)이나 미분을 피하는 적분형 정식화를 쓴다.'''

[[questions.choices]]
text = "약 10배 커진다. 잡음이 1/Δt에 비례해 증폭되기 때문이다."
correct = true

[[questions.choices]]
text = "약 10배 작아진다. 간격이 촘촘할수록 미분이 정확해지기 때문이다."
feedback = "잡음이 없을 때의 절단 오차 이야기다. 잡음이 있으면 이웃한 두 측정값의 차이를 작은 Δt로 나누므로 잡음이 커진다."

[[questions.choices]]
text = "변하지 않는다. 측정 잡음의 크기는 샘플링 간격과 무관하다."
feedback = "측정값 하나의 잡음은 그대로지만, 미분은 그 차이를 Δt로 나눈다. 미분 추정값의 잡음은 Δt에 의존한다."

[[questions.choices]]
text = "점의 수가 10배 늘어 평균 효과로 잡음이 √10배 줄어든다."
feedback = "회귀 전체의 표본 수는 늘지만, 각 점의 미분 추정값 자체는 잡음이 10배 커진다. 증폭된 잡음이 회귀에 들어가면 엉뚱한 항이 선택된다."

[[questions]]
id = "library-missing-term"
type = "single"
objective = 1
prompt = '''참 동역학이 $\dot{x} = x - x y/(1 + x)$인데 사전이 2차까지의 다항식 $[1, x, y, x^2, xy, y^2]$뿐이다. STLSQ가 돌려줄 결과로 가장 그럴듯한 것은?'''
explanation = '''희소 회귀는 사전의 열 중에서만 고른다. 포화형 항 $xy/(1+x)$는 사전에 없으므로 찾을 수 없고, 회귀는 다항식 여러 개의 조합으로 그 항을 흉내 낸다. 그 결과는 항이 많고 계수가 지저분한 식이 되기 쉽고, 학습 범위 밖에서는 참 동역학과 어긋난다. 이런 결과가 나오면 사전이 틀렸을 가능성을 먼저 의심한다.'''

[[questions.choices]]
text = "사전에 없는 항은 찾지 못하고, 다항식 여러 개로 흉내 낸 식을 돌려준다."
correct = true

[[questions.choices]]
text = "희소성 제약 덕분에 포화형 항을 자동으로 만들어 낸다."
feedback = "STLSQ는 새 함수를 만들지 않는다. 사전의 열에 계수를 붙여 고를 뿐이다. 식의 구조를 만들어 내는 것은 기호 회귀다."

[[questions.choices]]
text = "x와 xy 두 항만 정확한 계수로 골라 낸다."
feedback = "xy/(1+x)는 xy와 다르다. 포화 효과(x가 크면 포식이 늘지 않음)를 xy 하나로는 표현할 수 없어 다른 항이 끼어든다."

[[questions.choices]]
text = "모든 계수가 0이 되어 아무 항도 선택하지 않는다."
feedback = "x 항과 다항식 근사는 데이터를 상당 부분 설명하므로 계수가 모두 사라지지는 않는다."

[[questions]]
id = "pi-group-count"
type = "numeric"
objective = 3
prompt = '''유체 속 구에 작용하는 항력 $F$가 유체 밀도 $\rho$, 흐름 속도 $v$, 구의 지름 $D$, 유체의 점성계수 $\mu$에 의존한다고 하자. 기본 차원은 질량·길이·시간이고, 다섯 변수의 차원 행렬의 rank는 3이다. 이 관계를 쓰는 데 필요한 무차원 π 그룹은 몇 개인가?'''
answer = 2
tolerance = 0
slider = { min = 1, max = 5, step = 1 }
explanation = '''Buckingham π 정리에 따라 π 그룹의 수는 변수 수 − 차원 행렬의 rank = 5 − 3 = 2다. 두 그룹은 예를 들어 항력 계수 꼴의 $F / (\rho v^2 D^2)$와 Reynolds 수 $\rho v D / \mu$다. 그래서 항력 법칙은 $F/(\rho v^2 D^2) = \phi(\rho v D/\mu)$ 꼴이 되고, 변수 4개의 함수를 찾는 문제가 변수 1개의 함수를 찾는 문제로 줄어든다.'''

[[questions]]
id = "pendulum-mass"
type = "single"
objective = 3
prompt = '''진자의 주기 $T$가 줄 길이 $L$, 중력가속도 $g$, 추의 질량 $m$, 진폭 $\theta_0$에 의존한다고 놓고 차원 분석을 하면, 실험 전에 "주기는 질량에 의존하지 않는다"는 결론이 나온다. 그 이유는?'''
explanation = '''질량 차원을 가진 변수가 $m$ 하나뿐이다. 무차원 조합 $T^{a} L^{b} g^{c} m^{e} \theta_0^{f}$에서 질량 지수의 합은 $e$ 하나이고, 이것이 0이어야 하므로 $e = 0$이다. 그래서 $m$은 어떤 π 그룹에도 들어갈 수 없다. 이 결론은 "관련 변수 목록이 완전하다"는 가정 위에서 성립한다. 공기 저항처럼 질량 차원을 가진 다른 변수(공기 밀도 등)가 관련되면 $m$이 다시 들어올 수 있다.'''

[[questions.choices]]
text = "변수 중 질량 차원을 가진 것이 m 하나뿐이라, m을 포함한 무차원 조합을 만들 수 없다."
correct = true

[[questions.choices]]
text = "중력은 모든 물체를 같은 가속도로 떨어뜨린다는 실험 사실을 차원 분석이 가정하기 때문이다."
feedback = "차원 분석은 운동 법칙을 가정하지 않는다. 단위의 일관성만으로 m이 들어갈 자리가 없다는 결론이 나온다."

[[questions.choices]]
text = "질량은 진폭에 비해 작은 영향을 주므로 근사적으로 무시한 것이다."
feedback = "근사가 아니다. 주어진 변수 목록에서는 m이 들어간 무차원 조합이 정확히 0개다."

[[questions.choices]]
text = "π 그룹의 수가 변수 수보다 적어서, 변수 하나는 반드시 빠져야 하기 때문이다."
feedback = "π 그룹이 적다고 특정 변수가 빠지는 것은 아니다. L과 g는 Π1 안에 함께 남는다. m이 빠지는 이유는 차원 행렬의 질량 행에 0이 아닌 값이 m 하나뿐이기 때문이다."

[[questions]]
id = "pareto-knee"
type = "single"
objective = 2
prompt = '''기호 회귀로 얻은 Pareto front에서 학습 RMSE가 복잡도 9에서 0.0049가 된 뒤, 복잡도 15에서 0.0046, 복잡도 25에서 0.0040으로 조금씩 더 줄어든다. 측정 잡음의 표준편차는 약 0.006이다. 어떤 식을 고르는 것이 가장 타당한가?'''
explanation = '''학습 오차가 측정 잡음 수준에 이르면 그 이상의 감소는 잡음을 외운 결과일 가능성이 크다. 그래서 오차가 크게 줄던 구간이 끝나는 무릎(여기서는 복잡도 9)의 식을 후보로 고르고, 외삽·대칭·극한·단위로 검증한다. 가장 단순한 식이 늘 옳은 것은 아니다. 학습 오차가 잡음보다 크게 남아 있는 식은 데이터의 구조를 놓친 것이다.'''

[[questions.choices]]
text = "오차가 잡음 수준에 처음 이르는 복잡도 9의 식을 고르고, 학습 구간 밖에서 검증한다."
correct = true

[[questions.choices]]
text = "학습 오차가 가장 작은 복잡도 25의 식을 고른다."
feedback = "학습 오차가 이미 잡음보다 작다. 더 복잡한 식의 추가 감소는 잡음을 맞춘 것이고, 외삽에서 대개 더 나빠진다."

[[questions.choices]]
text = "가장 단순한 복잡도 2의 상수 식을 고른다. 단순할수록 일반화가 잘 되기 때문이다."
feedback = "상수 식의 학습 오차(0.3)는 잡음(0.006)의 50배다. 데이터의 진폭 의존성을 설명하지 못하는 식이다."

[[questions.choices]]
text = "front의 모든 식을 평균한 식을 쓴다."
feedback = "여러 식의 평균은 해석 가능한 하나의 식이 아니고, 대칭을 어기는 식이 섞이면 평균도 그것을 물려받는다."

[[questions]]
id = "law-evidence"
type = "multiple"
objective = 2
prompt = '''데이터에서 찾은 식을 "지배 방정식"으로 보고하려 한다. 다음 중 그 주장을 뒷받침하는 **독립적인** 증거를 모두 고르시오.'''
explanation = '''학습에 쓰지 않은 조건에서의 예측, 알려진 보존량과 대칭의 유지, 알려진 극한의 재현, 단위 일관성은 모두 학습 데이터 적합과 독립적인 점검이다. 학습 구간의 높은 $R^2$나 많은 반복으로 얻은 낮은 학습 손실은 식이 학습 데이터에 맞는다는 것만 말한다. 본문 셀 5에서 학습 데이터에 잘 맞던 $\exp\theta$ 식이 대칭 점검에서 탈락한 것이 그 예다.'''

[[questions.choices]]
text = "학습에 쓰지 않은 초기 조건에서 적분한 궤적이 실제 궤적과 맞는다."
correct = true

[[questions.choices]]
text = "알려진 보존량이 찾은 식의 궤적에서도 보존된다."
correct = true

[[questions.choices]]
text = "작은 진폭 같은 알려진 극한에서 알려진 값이 나온다."
correct = true

[[questions.choices]]
text = "학습 구간에서 결정계수 R²가 0.999다."
feedback = "학습 데이터에 잘 맞는다는 것만 말한다. 본문의 exp θ 식도 학습 오차는 작았지만 대칭을 어겼다."
