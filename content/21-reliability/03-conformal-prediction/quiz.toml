# 21.3 Conformal Prediction — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "marginal-not-conditional"
type = "single"
objective = 1
prompt = '''90% split conformal 구간을 만들었다. 보정 데이터와 시험 데이터는 교환가능하다. 이 보장이 말하는 것은?'''
explanation = '''split conformal의 보장은 **주변**(marginal) 보장이다. 보정 데이터와 시험점을 모두 무작위로 볼 때 $\Pr[Y \in C(X)] \ge 0.9$이다. 특정 입력 $x$에서의 포함률 $\Pr[Y \in C(X) \mid X = x]$는 보장하지 않는다. 본문 실습에서 절댓값 점수의 구간은 전체 포함률이 0.89–0.90이었지만 잡음이 큰 $x \in [2, 3]$에서는 0.75였다. 또 보장은 보정 세트에 대한 평균이므로, 한 번 만든 보정 세트에서는 포함률이 0.9보다 조금 낮을 수 있다.'''

[[questions.choices]]
text = "보정 세트와 시험점을 모두 무작위로 볼 때, 시험점이 구간에 들 확률이 0.9 이상이다."
correct = true

[[questions.choices]]
text = "어떤 입력 x에서든 그 x의 관측이 구간에 들 확률이 0.9 이상이다."
feedback = "그것은 조건부 보장이다. 분포 가정 없이 유한 표본에서 조건부 보장을 얻는 것은 일반적으로 불가능하고, split conformal은 주변 보장만 준다."

[[questions.choices]]
text = "이번에 만든 보정 세트로 계산한 구간은 시험 데이터의 정확히 90%를 덮는다."
feedback = "보장은 보정 세트의 무작위성까지 평균 낸 것이다. 보정 세트 하나에 대한 포함률은 Beta 분포를 따라 흔들리고, 보정 데이터가 적으면 그 흔들림이 크다."

[[questions.choices]]
text = "점 예측 모델이 잘 맞을 때만 0.9 이상이다."
feedback = "주변 보장은 모델 품질과 무관하게 성립한다. 모델이 나쁘면 구간이 넓어질 뿐이다."

[[questions]]
id = "exchangeability-breaks"
type = "multiple"
objective = 1
prompt = '''split conformal의 포함 보장이 **깨질 수 있는** 상황을 모두 고르시오.'''
explanation = '''보장의 유일한 가정은 보정 데이터와 시험점의 교환가능성이다. 시험 입력의 분포가 바뀌는 공변량 이동, 시간에 따라 잡음이 커지는 drift는 교환가능성을 깨므로 보장이 사라진다. 반면 잡음이 가우시안이 아니거나 모델이 틀린 것은 보장과 무관하다. conformal은 분포 가정을 하지 않고, 모델이 나쁘면 구간이 넓어질 뿐 포함률은 유지된다.'''

[[questions.choices]]
text = "시험 입력이 학습·보정 때보다 잡음이 큰 영역으로 쏠렸다(공변량 이동)."
correct = true

[[questions.choices]]
text = "센서가 노화해 시간이 갈수록 측정 잡음이 커진다."
correct = true

[[questions.choices]]
text = "관측 잡음이 가우시안이 아니라 꼬리가 두꺼운 분포다."
feedback = "conformal은 분포 모양을 가정하지 않는다. 연습문제의 테스트도 Student-t 잡음에서 보장을 확인한다."

[[questions.choices]]
text = "점 예측 모델이 참 함수와 다르다(모델 오지정)."
feedback = "모델이 틀리면 점수가 커져 구간이 넓어진다. 포함률 보장은 그대로다."

[[questions]]
id = "conformal-rank"
type = "numeric"
objective = 2
prompt = '''보정 데이터 19개로 90% split conformal 구간을 만든다($\alpha = 0.1$). 정렬한 보정 점수 중 몇 번째로 작은 값을 $\hat q$로 쓰는가?'''
answer = 18
tolerance = 0
slider = { min = 15, max = 20, step = 1, unit = "번째" }
explanation = '''$k = \lceil (n+1)(1-\alpha) \rceil = \lceil 20 \times 0.9 \rceil = 18$이다. 시험점을 포함한 20개 점수가 교환가능하므로 시험 점수의 순위는 1–20에 고르게 분포한다. 시험 점수가 보정 점수 중 18번째 값 이하일 확률은 18/20 = 0.9다. $n$ 대신 $n+1$을 쓰는 것이 유한 표본 보정이다. $\lceil 19 \times 0.9 \rceil = 18$로 같은 값이 나오지만 우연이다. $n = 10$이면 $\lceil 11 \times 0.9\rceil = 10$, $\lceil 10 \times 0.9 \rceil = 9$로 갈린다.'''

[[questions]]
id = "too-few-calibration"
type = "single"
objective = 2
prompt = '''보정 데이터가 8개뿐이다. $\alpha = 0.1$로 split conformal 구간을 만들면?'''
explanation = '''$k = \lceil 9 \times 0.9 \rceil = \lceil 8.1 \rceil = 9 > 8$이다. 시험점을 포함한 9개 중 시험 점수가 가장 클 확률이 1/9 ≈ 0.11 > 0.1이므로, 어떤 유한한 구간도 90%를 보장할 수 없다. 그래서 구간은 실수 전체(무한)가 된다. 일반적으로 $n \ge 1/\alpha - 1$이어야 유한한 구간이 나온다.'''

[[questions.choices]]
text = "유한한 구간으로는 보장할 수 없어 구간이 무한대가 된다."
correct = true

[[questions.choices]]
text = "가장 큰 보정 점수를 쓰면 90% 보장이 성립한다."
feedback = "9개(보정 8 + 시험 1) 중 시험 점수가 가장 클 확률은 1/9 ≈ 0.111로, 가장 큰 보정 점수를 써도 포함률은 8/9 ≈ 0.889다."

[[questions.choices]]
text = "np.quantile(scores, 0.9)를 쓰면 된다."
feedback = "np.quantile은 n을 기준으로 보간하므로 유한 표본 보장을 주지 않는다. 오히려 가장 큰 점수보다도 작은 값을 고른다."

[[questions]]
id = "normalized-score-effect"
type = "single"
objective = 2
prompt = '''잡음이 $x$에 따라 커지는 데이터에서 비순응 점수를 $\lvert y - \hat\mu(x)\rvert$에서 $\lvert y - \hat\mu(x)\rvert / \hat\sigma(x)$로 바꿨다. 무엇이 기대되는가?'''
explanation = '''정규화 점수의 구간은 $\hat\mu(x) \pm \hat q\,\hat\sigma(x)$로, 폭이 입력마다 달라진다. 잡음이 작은 곳에서는 좁고 큰 곳에서는 넓어지므로 조건별 포함률이 목표에 가까워지고, 같은 주변 포함률을 더 좁은 평균 폭으로 얻는 경우가 많다. 주변 보장은 어떤 점수에서도 그대로다. 조건부 보장이 생기는 것은 아니다. $\hat\sigma$가 틀린 영역에서는 여전히 조건부 포함률이 어긋난다(본문: [0, 1)에서 0.873).'''

[[questions.choices]]
text = "주변 보장은 그대로이고, 조건별 포함률이 목표에 가까워지며 평균 폭이 줄 수 있다."
correct = true

[[questions.choices]]
text = "조건부 포함 보장이 새로 생긴다."
feedback = "점수를 바꿔도 보장의 종류는 주변 보장 그대로다. σ̂이 정확할수록 조건부로도 가까워질 뿐이다."

[[questions.choices]]
text = "σ̂ 추정이 틀릴 수 있으므로 주변 보장도 사라진다."
feedback = "주변 보장은 점수 함수가 무엇이든(보정 데이터와 독립으로 정해지기만 하면) 성립한다."
