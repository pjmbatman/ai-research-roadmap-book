# 21.2 예측분포와 구간의 평가 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "improper-absolute-score"
type = "single"
objective = 1
prompt = '''이진 사건의 확률 예측 $q$를 $\lvert q - y\rvert$($y \in \{0, 1\}$)의 평균으로 평가하기로 했다. 사건의 참 확률이 0.7일 때, 이 점수의 기대값을 가장 작게 만드는 보고값 $q$는?'''
explanation = '''기대 점수는 $0.7(1-q) + 0.3q = 0.7 - 0.4q$로 $q$에 대한 직선이므로 $q = 1$에서 가장 작다. 참 확률 0.7을 그대로 보고하는 것보다 1로 부풀리는 쪽이 점수가 좋다. 이런 점수를 적정하지 않다(improper)고 한다. Brier score $(q-y)^2$의 기대값 $0.7(1-q)^2 + 0.3q^2$는 $q = 0.7$에서 가장 작으므로 적정하다.'''

[[questions.choices]]
text = "1.0"
correct = true

[[questions.choices]]
text = "0.7"
feedback = "Brier score라면 맞다. 절댓값 점수의 기대값은 q에 대한 직선이라 끝점에서 최소가 된다. 계산해 보면 q = 0.7에서 0.42, q = 1에서 0.30이다."

[[questions.choices]]
text = "0.5"
feedback = "0.5는 가장 모르겠다는 보고다. 이 점수에서는 0.5가 오히려 기대값 0.5로 가장 나쁘다."

[[questions]]
id = "brier-single"
type = "numeric"
objective = 1
prompt = '''내일 비가 올 확률을 0.8로 예보했는데 비가 오지 않았다($y = 0$). 이 예보 하나의 Brier score $(q - y)^2$는?'''
answer = 0.64
tolerance = 0.001
explanation = '''$(0.8 - 0)^2 = 0.64$다. 비가 왔다면 $(0.8 - 1)^2 = 0.04$였다. Brier score는 0(완벽)부터 1(정반대로 확신)까지의 값을 가지며, 늘 0.5를 보고하는 예보는 결과와 상관없이 0.25를 받는다.'''

[[questions]]
id = "calibrated-not-sharp"
type = "single"
objective = 2
prompt = '''모든 날에 "과거 같은 달의 기온 분포"를 그대로 예보하는 기후값(climatology) 예보가 있다. PIT 히스토그램이 평평하고 90% 구간의 전체 포함률도 0.90이다. 이 예보에 대한 평가로 옳은 것은?'''
explanation = '''기후값 예보는 그날의 정보를 쓰지 않으므로 날마다 같은 넓은 분포를 낸다. 장기적으로는 보정되어 있지만(PIT 평평, 포함률 0.90), 날씨가 특별한 날을 구분하지 못해 구간이 넓다. Gneiting 외(2007)의 원칙대로 예측분포는 "보정이라는 제약 아래에서 sharpness를 최대화"해야 한다. 보정은 필요조건이고, 같은 보정이면 더 좁은 예측이 더 유용하다. 적정 점수(CRPS·NLL)는 이 둘을 함께 반영하므로, 정보를 쓰는 좋은 예보는 기후값보다 점수가 좋다. 본문 실습에서도 기후값은 조건별 포함률이 0.85 근처로 떨어졌다.'''

[[questions.choices]]
text = "보정은 되어 있지만 sharp하지 않다. 보정은 좋은 예보의 필요조건일 뿐이다."
correct = true

[[questions.choices]]
text = "보정이 완벽하므로 가장 좋은 예보다."
feedback = "보정만 보면 날씨 정보를 전혀 쓰지 않는 예보도 완벽할 수 있다. 같은 보정이라면 더 좁은 예측이 낫다."

[[questions.choices]]
text = "PIT가 평평하면 조건별 포함률도 모두 0.90이다."
feedback = "PIT 히스토그램은 모든 조건을 섞은 평균 보정이다. 조건별로 넓고 좁은 실패가 서로 상쇄되어도 평평하게 나온다."

[[questions]]
id = "ece-zero-limits"
type = "multiple"
objective = 2
prompt = '''분류 모델의 ECE가 0에 가깝다. 이것만으로 **알 수 없는** 것을 모두 고르시오.'''
explanation = '''ECE는 예측 확률 구간마다 평균 확률과 관측 빈도를 비교한 값의 가중 평균이다. 평균 보정만 보므로 (1) 늘 기저율을 예보하는 모델도 ECE가 0이 될 수 있어 판별력은 알 수 없고, (2) 확률 구간 안에서 집단별 오차가 상쇄될 수 있어 집단별 보정도 알 수 없고, (3) 학습 분포 밖에서 보정이 유지되는지도 알 수 없다. 반면 평가 데이터 전체에서 "확률 0.8이라고 한 예측들 중 실제로 약 80%가 맞았다"는 것은 ECE가 작다는 말의 내용 그 자체다(구간 폭 안의 근사로).'''

[[questions.choices]]
text = "모델이 class를 잘 구분하는지(판별력)"
correct = true

[[questions.choices]]
text = "환자 집단·장비별로도 보정이 맞는지"
correct = true

[[questions.choices]]
text = "분포 이동이 생긴 새 데이터에서도 보정이 유지되는지"
correct = true

[[questions.choices]]
text = "평가 데이터에서 확률 0.8로 예측한 사례들의 실제 적중 비율이 약 0.8인지"
feedback = "이것은 ECE가 작다는 말이 직접 뜻하는 내용이다(구간의 폭만큼의 근사로)."

[[questions]]
id = "interval-score-numeric"
type = "numeric"
objective = 2
prompt = '''90% 예측 구간 $[1, 3]$을 냈는데 관측값이 4였다. interval score $(u-l) + \frac{2}{\alpha}(l-y)\mathbb{1}[y<l] + \frac{2}{\alpha}(y-u)\mathbb{1}[y>u]$는 얼마인가?'''
answer = 22
tolerance = 0.01
explanation = '''$\alpha = 0.1$이므로 폭 $3 - 1 = 2$에 벌점 $\frac{2}{0.1}(4 - 3) = 20$을 더해 22다. 구간을 벗어난 거리에 $2/\alpha$를 곱하기 때문에, 목표 포함률이 높을수록(α가 작을수록) 벗어남을 크게 벌한다. 이 균형 덕분에 기대 점수는 참 분포의 $\alpha/2$, $1-\alpha/2$ 분위수에서 가장 작다.'''

[[questions]]
id = "temperature-keeps-accuracy"
type = "single"
objective = 2
prompt = '''과신하는 분류 모델에 temperature scaling($q = \sigma(z/T)$, $T > 1$)을 적용했다. 보정 데이터에서 NLL이 줄었다. 평가 데이터에서 무엇이 바뀌지 **않는가**?'''
explanation = '''$T > 0$으로 로짓을 나누는 것은 단조 변환이므로 로짓의 부호와 순서가 그대로다. 그래서 0.5 기준 예측 class와 정확도, 그리고 순위만 쓰는 AUC는 바뀌지 않는다. 바뀌는 것은 확률의 크기이고, 그래서 ECE·Brier·NLL이 바뀐다. 본문 실습에서 정확도는 0.747 그대로, ECE는 0.123에서 0.022로 줄었다.'''

[[questions.choices]]
text = "정확도와 AUC"
correct = true

[[questions.choices]]
text = "ECE"
feedback = "temperature scaling의 목적이 확률의 크기를 바꿔 ECE를 줄이는 것이다."

[[questions.choices]]
text = "Brier score"
feedback = "Brier score는 확률 값 자체를 쓰므로 확률이 바뀌면 함께 바뀐다."
