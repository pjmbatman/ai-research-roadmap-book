# 21.6 위험을 고려한 의사결정 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "bayes-threshold-numeric"
type = "numeric"
objective = 2
prompt = '''고장 확률 $p$가 보정되어 있다. 불필요한 점검(오경보)의 비용이 1, 놓친 고장(미탐지)의 비용이 9일 때, 기대 비용을 최소화하려면 $p$가 얼마를 넘을 때 경보를 내야 하는가?'''
answer = 0.1
tolerance = 0.001
slider = { min = 0.0, max = 1.0, step = 0.05 }
explanation = '''경보를 내면 기대 비용은 $(1-p) \times 1$, 내지 않으면 $p \times 9$다. $1 - p < 9p$, 즉 $p > 1/10$일 때 경보가 낫다. 일반식은 $c_{FP}/(c_{FP} + c_{FN})$이다. 미탐지가 오경보보다 아홉 배 비싸면 고장 확률 10%만 되어도 점검할 가치가 있다. 기본값 0.5는 두 비용이 같을 때만 최적이다.'''

[[questions]]
id = "threshold-needs-calibration"
type = "single"
objective = 2
prompt = '''비용으로 계산한 threshold $c_{FP}/(c_{FP}+c_{FN})$를 그대로 쓰려면 무엇이 필요한가?'''
explanation = '''이 threshold는 "$p$가 실제 고장 확률"이라는 가정에서 유도된다. 확률이 보정되어 있지 않으면(21.2장) 같은 숫자의 $p$가 다른 실제 확률을 뜻하므로 threshold가 어긋난다. 이때는 확률을 먼저 재보정하거나, 검증 데이터에서 비용을 직접 최소화하는 threshold를 고른다. 본문에서 보정이 틀린 모델은 이론 threshold로 1000대당 557.7, 검증으로 고른 threshold로 521.4였다. 정확도나 AUC가 높다는 것은 순위가 좋다는 뜻일 뿐 확률의 크기가 맞는다는 뜻이 아니다.'''

[[questions.choices]]
text = "모델 확률이 보정되어 있어야 한다."
correct = true

[[questions.choices]]
text = "모델의 AUC가 0.9 이상이어야 한다."
feedback = "AUC는 순위만 본다. 순위가 완벽해도 확률의 크기가 틀리면 이론 threshold는 어긋난다."

[[questions.choices]]
text = "고장과 정상의 비율이 같아야 한다."
feedback = "식에는 class 비율이 들어 있지 않다. 보정된 확률 p가 이미 class 비율을 반영하고 있다."

[[questions]]
id = "quantile-decision"
type = "single"
objective = 1
prompt = '''장비의 냉각 용량을 정한다. 예측 발열량의 분포가 주어져 있고, 냉각이 1 kW 부족할 때의 비용은 9, 1 kW 남을 때의 비용은 1이다. 기대 비용을 최소화하는 용량은?'''
explanation = '''부족 비용 $c_u$, 과잉 비용 $c_o$인 비대칭 선형 비용의 최적 결정은 예측분포의 $c_u/(c_u + c_o)$ 분위수다. 여기서는 $9/10 = 0.9$ 분위수다. 12.3장의 pinball loss와 같은 구조다. 평균으로 설계하면 부족이 절반 가까이 일어나고, 본문 계산에서 평균 비용이 0.9 분위수 설계의 두 배를 넘었다(6.973 대 3.052).'''

[[questions.choices]]
text = "예측분포의 0.9 분위수"
correct = true

[[questions.choices]]
text = "예측분포의 평균"
feedback = "평균은 제곱 오차처럼 대칭인 비용에서 최적이다. 부족이 과잉보다 아홉 배 비싸면 더 높은 쪽으로 가야 한다."

[[questions.choices]]
text = "예측분포의 평균에 모든 장비가 같은 여유를 더한 값"
feedback = "장비마다 예측 불확실성이 다르면 필요한 여유도 다르다. 같은 평균 용량이라도 불확실성에 맞춰 여유를 나눈 쪽이 비용이 작다(본문 3.052 대 3.457)."

[[questions]]
id = "coverage-risk"
type = "single"
objective = 2
prompt = '''분류 모델에서 확신이 큰 순서로 60%의 사례에만 답하고 나머지는 보류했더니, 답한 사례의 오류율이 0.221에서 0.111로 줄었다. 이 결과를 운영에 쓰기 전에 꼭 확인할 것은?'''
explanation = '''선택적 예측은 오류를 줄이는 대신 보류된 사례를 누군가 처리해야 하고, 보류가 특정 집단에 몰릴 수 있다. 본문 실험에서 coverage 0.6일 때 신호가 약한 집단 B의 응답률은 0.224로, 집단 A(0.692)의 3분의 1이었다. 모델이 어려워하는 집단일수록 서비스에서 빠지는 것이다. 평균 오류가 줄었다는 것만으로는 운영 가능성을 판단할 수 없다.'''

[[questions.choices]]
text = "보류된 사례가 특정 집단·조건에 몰리지 않는지, 그리고 보류 사례를 처리할 비용과 인력이 있는지"
correct = true

[[questions.choices]]
text = "답한 사례의 오류율이 더 줄어드는지 coverage를 0.2까지 낮춰 보는 것"
feedback = "coverage를 낮추면 오류율은 대개 더 줄지만, 그만큼 보류가 늘어난다. 문제는 오류율이 아니라 보류의 분포와 비용이다."

[[questions.choices]]
text = "확신도로 softmax 최대 확률 대신 로짓을 쓰는 것"
feedback = "단조 변환이라 같은 순위, 같은 결과를 준다. 근본 문제를 바꾸지 않는다."

[[questions]]
id = "chow-reject"
type = "numeric"
objective = 2
prompt = '''이진 분류에서 오류 비용이 1, 보류 비용이 $d = 0.2$다. 보정된 확률로 Chow의 규칙을 따른다면, 예측 class의 확률 $\max(p, 1-p)$가 얼마보다 작을 때 보류해야 하는가?'''
answer = 0.8
tolerance = 0.001
explanation = '''답하면 기대 비용은 오류 확률 $1 - \max(p, 1-p)$, 보류하면 $d$다. $1 - \max(p, 1-p) > d$, 즉 $\max(p, 1-p) < 1 - d = 0.8$이면 보류가 낫다(Chow, 1970). 본문에서 이 규칙은 평균 비용을 0.221에서 0.143으로 줄였지만 보류율이 0.520이었다. 보류 비용을 정직하게 매기지 않으면 규칙은 과도한 보류를 권한다.'''

[[questions]]
id = "default-threshold"
type = "multiple"
objective = 1
prompt = '''분류 모델의 기본 threshold 0.5가 **최적이 아닌** 상황을 모두 고르시오.'''
explanation = '''0.5는 오경보와 미탐지의 비용이 같고 확률이 보정되어 있을 때의 최적이다. 비용이 비대칭이거나, 확률의 보정이 틀렸거나, 운영 환경의 class 비율이 학습 때와 달라 확률이 어긋났으면(21.4장의 label shift) threshold를 다시 정해야 한다. 두 비용이 같고 확률이 보정되어 있으면 0.5가 정확히 최적이다.'''

[[questions.choices]]
text = "놓친 고장의 비용이 불필요한 점검의 20배다."
correct = true

[[questions.choices]]
text = "모델이 과신해 확률이 0과 1 쪽으로 몰려 있다."
correct = true

[[questions.choices]]
text = "운영 환경의 고장률이 학습 데이터의 다섯 배다."
correct = true

[[questions.choices]]
text = "두 오류의 비용이 같고 확률이 보정되어 있다."
feedback = "이 경우가 바로 0.5가 최적인 경우다. 경보의 기대 비용 (1-p)c와 미경보의 기대 비용 pc가 p = 0.5에서 같아진다."
