# 21.4 분포 이동과 OOD — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "shift-type-sensor"
type = "single"
objective = 1
prompt = '''결함 검출 모델을 공장 A에서 학습해 공장 B에 배포했다. 두 공장의 결함 판정 기준과 결함의 물리적 모습은 같지만, 공장 B는 결함률이 훨씬 높다(결함 제품 비율 2% → 10%). 입력 영상은 결함 여부가 같으면 두 공장에서 비슷해 보인다. 어떤 이동인가?'''
explanation = '''label 분포 $p(y)$가 바뀌고, 같은 label 안에서의 입력 분포 $p(x \mid y)$는 그대로이므로 label shift(prior shift)다. 이때는 모델 출력 확률을 새 사전확률로 다시 가중해 고칠 수 있다: $p_B(y \mid x) \propto p_A(y \mid x)\,p_B(y)/p_A(y)$. 공변량 이동은 $p(x)$가 바뀌고 $p(y \mid x)$가 그대로인 경우다. label shift에서도 $p(x)$는 바뀌지만, 그대로인 것이 $p(y \mid x)$가 아니라 $p(x \mid y)$라는 점이 다르다.'''

[[questions.choices]]
text = "label shift: p(y)가 바뀌고 p(x|y)는 그대로다."
correct = true

[[questions.choices]]
text = "공변량 이동: p(x)가 바뀌고 p(y|x)는 그대로다."
feedback = "결함률이 바뀌면 같은 x에 대한 결함 확률 p(y|x)도 바뀐다. 그대로인 것은 결함 제품이 어떻게 보이는가, 즉 p(x|y)다."

[[questions.choices]]
text = "conditional shift: 같은 영상에 대한 결함 판정 기준이 바뀌었다."
feedback = "판정 기준과 결함의 모습은 같다고 했다. 기준 자체가 바뀌었다면 conditional shift다."

[[questions]]
id = "iw-when-needed"
type = "single"
objective = 1
prompt = '''공변량 이동에서 중요도 가중 학습이 **가장 크게** 도움이 되는 경우는?'''
explanation = '''모델이 참 관계를 표현할 수 있으면(잘 지정된 모델), $p(y \mid x)$가 같으므로 어디에 데이터가 몰려 있든 같은 함수를 학습하고, 보통의 최대우도가 점근적으로 최적이다(Shimodaira, 2000). 모델이 틀렸을 때(오지정) 학습은 데이터가 많은 영역에 맞춘 타협을 하는데, 가중치는 그 타협을 운영 분포 쪽으로 옮긴다. 본문 실습에서 직선 모델로 휜 관계를 학습하자 가중 없이 target MSE 0.800, 가중하면 0.116이었다. 대가로 유효 표본이 500개 중 100개로 줄었다.'''

[[questions.choices]]
text = "모델이 참 관계를 표현할 수 없어(오지정) 학습 분포에 맞춘 타협을 할 때"
correct = true

[[questions.choices]]
text = "모델이 참 관계를 정확히 표현할 수 있을 때"
feedback = "잘 지정된 모델에서는 가중하지 않아도 같은 참 함수로 수렴한다. 가중은 유효 표본을 줄여 분산만 키울 수 있다."

[[questions.choices]]
text = "운영 입력이 학습 입력이 전혀 없는 영역에 있을 때"
feedback = "그 영역에서는 p_s(x) = 0이라 가능도 비가 정의되지 않는다. 가중은 이미 본 영역의 비중을 바꿀 뿐, 본 적 없는 영역의 정보를 만들지 못한다."

[[questions]]
id = "ood-detection-vs-generalization"
type = "single"
objective = 2
prompt = '''OOD 탐지기가 운영 데이터의 30%를 "분포 밖"으로 표시했다. 이 결과로 알 수 있는 것은?'''
explanation = '''OOD 탐지는 "이 입력이 학습 분포와 다른가"를 묻는다. OOD 일반화는 "분포가 다른 입력에서도 예측이 맞는가"를 묻는다. 두 질문은 독립이다. 분포 밖이어도 모델이 잘 맞을 수 있고(이동이 예측과 무관한 방향), 분포 안이어도 틀릴 수 있다. 표시된 입력에서의 성능은 레이블을 얻어 따로 평가해야 한다.'''

[[questions.choices]]
text = "그 30%가 학습 분포와 다르다는 것뿐이고, 그 입력에서 모델 성능이 나쁜지는 따로 평가해야 한다."
correct = true

[[questions.choices]]
text = "그 30%에서는 모델 예측이 틀린다."
feedback = "분포가 다르다는 것과 예측이 틀린다는 것은 다른 질문이다. 예측과 관련 없는 방향의 이동(예: 배경 밝기)은 성능에 영향을 주지 않을 수 있다."

[[questions.choices]]
text = "나머지 70%에서는 모델이 학습 때와 같은 성능을 낸다."
feedback = "탐지기가 놓친 이동(탐지기가 보지 않는 특징의 변화, conditional shift)이 있을 수 있다. 탐지되지 않았다는 것은 이동이 없다는 증거가 아니다."

[[questions]]
id = "marginal-tests-miss"
type = "single"
objective = 2
prompt = '''두 특징의 상관이 0에서 0.8로 바뀌었지만 각 특징의 분포는 그대로인 이동이 있다. 특징별 KS 검정과, 상호작용 특징을 쓰는 분류기 기반 2-표본 검정 중 무엇이 이 이동을 잡는가?'''
explanation = '''특징별 KS 검정은 각 특징의 주변분포만 비교하므로, 주변분포가 그대로이면 이동이 있어도 기각률이 유의수준 근처(본문 0.06)에 머문다. 분류기 기반 검정은 두 표본을 구분하는 분류기를 학습해 held-out 정확도나 AUC가 0.5보다 큰지 검정하므로, 분류기가 표현할 수 있는 모든 차이를 잡는다(본문 기각률 1.00, AUC 0.70). 다만 분류기가 표현하지 못하는 차이(예: 상호작용 특징이 없는 선형 분류기)는 잡지 못한다.'''

[[questions.choices]]
text = "분류기 기반 검정만 잡는다."
correct = true

[[questions.choices]]
text = "두 특징 모두에 KS 검정을 하면 잡는다."
feedback = "KS 검정은 특징 하나의 분포만 본다. 상관은 두 특징의 결합분포에만 나타난다."

[[questions.choices]]
text = "둘 다 잡지 못한다. 상관 변화는 검정할 수 없다."
feedback = "결합분포의 차이이므로 다변량 검정으로 잡을 수 있다. 분류기 기반 검정이 그런 다변량 검정이다."

[[questions]]
id = "monitoring-false-alarms"
type = "numeric"
objective = 3
prompt = '''운영 중인 모델의 입력 특징 20개를 매일 각각 KS 검정으로 기준 데이터와 비교하고, $p < 0.05$이면 경보를 낸다. 실제로는 아무 이동도 없을 때 하루 평균 몇 번의 경보가 나는가?'''
answer = 1
tolerance = 0.01
explanation = '''이동이 없으면 각 검정의 p-value는 균등분포를 따르므로(연속 분포에서) 검정 하나가 경보를 낼 확률은 0.05다. 20개면 기대 경보 수는 20 × 0.05 = 1이다. 한 달이면 약 30번의 오경보가 나고, 운영자는 곧 경보를 무시하게 된다. 다중 비교 보정(12.4장), 여러 배치에 걸친 누적 판정, 성능에 영향을 주는 이동인지 함께 보는 규칙이 필요하다.'''

[[questions]]
id = "worst-group"
type = "single"
objective = 2
prompt = '''환자 데이터에서 모델의 평균 정확도가 0.95다. 집단 A(전체의 95%)의 정확도는 0.97, 집단 B(5%)의 정확도는 얼마인가?'''
explanation = '''가중 평균 $0.95 \times 0.97 + 0.05 \times a_B = 0.95$에서 $a_B = (0.95 - 0.9215)/0.05 = 0.57$이다. 평균 정확도 0.95는 작은 집단의 0.57을 거의 드러내지 않는다. 그래서 집단별 성능과 최악 집단(worst-group) 성능을 따로 보고한다.'''

[[questions.choices]]
text = "0.57"
correct = true

[[questions.choices]]
text = "0.93"
feedback = "두 정확도의 단순 평균이 0.95가 되게 고른 값이다. 평균은 집단 크기로 가중해야 한다."

[[questions.choices]]
text = "0.95 근처"
feedback = "평균이 0.95라는 사실이 집단마다 0.95 근처라는 뜻은 아니다. 큰 집단이 평균을 결정한다."
