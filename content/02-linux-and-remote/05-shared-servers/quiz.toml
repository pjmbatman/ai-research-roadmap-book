# 2.5 공유 서버와 클러스터 사용 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "cuda-visible-renumber"
type = "single"
objective = 1
prompt = '''`nvidia-smi`에서 GPU 2와 3이 비어 있어 `CUDA_VISIBLE_DEVICES=2,3 python train.py`로 실행했다. 학습 코드 안에서 `torch.device("cuda:0")`은 어느 GPU인가? (`CUDA_DEVICE_ORDER=PCI_BUS_ID`로 nvidia-smi와 번호 순서를 맞춰 두었다고 가정한다.)'''
explanation = '''`CUDA_VISIBLE_DEVICES`는 프로세스에 보이는 GPU를 제한하고, 보이는 GPU에 **0부터 새 번호**를 붙인다. 그래서 `cuda:0`은 물리 GPU 2, `cuda:1`은 물리 GPU 3이다. 코드 안에서 `cuda:2`를 쓰면 보이는 GPU가 두 개뿐이라 오류가 난다. 이 재번호 매김 덕분에 코드에는 항상 `cuda:0`부터 쓰고, 어느 물리 GPU를 쓸지는 실행할 때 환경변수로 정한다. 단, CUDA의 기본 번호 순서는 nvidia-smi의 순서(PCI bus 순)와 다를 수 있어 `CUDA_DEVICE_ORDER=PCI_BUS_ID`를 함께 설정한다.'''

[[questions.choices]]
text = "물리 GPU 2. 보이는 GPU에 0부터 새 번호가 붙는다."
correct = true

[[questions.choices]]
text = "물리 GPU 0. cuda:0은 항상 서버의 첫 GPU다."
feedback = "CUDA_VISIBLE_DEVICES가 설정되면 프로세스는 GPU 0을 볼 수조차 없다. 번호는 보이는 GPU 안에서 다시 매겨진다."

[[questions.choices]]
text = "물리 GPU 2와 3에 나뉘어 올라간다."
feedback = "cuda:0은 GPU 하나를 가리킨다. 두 GPU를 함께 쓰려면 분산 학습 코드가 cuda:0과 cuda:1을 각각 써야 한다."

[[questions.choices]]
text = "오류가 난다. cuda:2라고 써야 물리 GPU 2를 쓴다."
feedback = "반대다. 이 프로세스에 보이는 GPU는 두 개(0, 1)뿐이므로 cuda:2가 오류를 낸다."

[[questions]]
id = "login-node-compute"
type = "single"
objective = 2
prompt = '''클러스터에 SSH로 접속하면 로그인 노드에 도착한다. 30분쯤 걸리는 데이터 전처리(CPU 16코어, 메모리 60 GB 사용)를 해야 한다. 알맞은 방법은?'''
explanation = '''로그인 노드는 수십·수백 명이 동시에 접속해 편집, 컴파일, 작업 제출을 하는 공용 입구다. 여기서 무거운 계산을 돌리면 모두의 접속이 느려지고, 많은 클러스터는 일정 이상의 CPU·메모리를 쓰는 프로세스를 자동으로 종료한다. 전처리도 계산이므로 `sbatch`로 제출하거나, 대화형으로 해야 하면 `srun --pty bash`·`salloc` 등으로 계산 노드를 받아 그 안에서 실행한다(정확한 명령은 클러스터 문서로 확인한다).'''

[[questions.choices]]
text = "필요한 CPU·메모리를 요청해 `sbatch`로 제출하거나, `srun`/`salloc`으로 계산 노드를 받아 실행한다."
correct = true

[[questions.choices]]
text = "GPU를 쓰지 않으니 로그인 노드에서 바로 실행해도 된다."
feedback = "로그인 노드의 CPU와 메모리도 모두가 함께 쓰는 자원이다. GPU 여부와 상관없이 무거운 계산은 계산 노드에서 한다."

[[questions.choices]]
text = "로그인 노드에서 `nice`로 우선순위를 낮춰 실행하면 문제없다."
feedback = "nice는 CPU 순서만 양보한다. 60 GB 메모리 사용은 그대로 다른 사람의 세션을 위협하고, 클러스터 규칙 위반이다."

[[questions.choices]]
text = "로그인 노드에서 tmux를 띄우고 그 안에서 실행하면 계산 노드로 옮겨진다."
feedback = "tmux는 세션을 유지할 뿐 실행 위치를 바꾸지 않는다. tmux 안의 프로세스도 로그인 노드에서 돈다."

[[questions]]
id = "array-concurrency"
type = "numeric"
objective = 2
prompt = '''`#SBATCH --array=0-9%3`으로 제출한 array job은 task를 모두 몇 개 만들고, 그중 **동시에 최대 몇 개**까지 실행되는가? 동시 실행 최대 개수를 답한다.'''
answer = 3
tolerance = 0
explanation = '''`0-9`는 task 번호 0부터 9까지, 즉 task 10개를 만든다. `%3`은 그중 동시에 실행되는 task를 최대 3개로 제한한다. 나머지는 앞의 task가 끝나는 대로 차례로 시작한다. 공유 클러스터에서 수백 개짜리 sweep을 제출할 때, 남의 몫까지 대기열을 점유하지 않도록 이 제한을 건다.'''

[[questions]]
id = "checkpoint-interval-minutes"
type = "numeric"
objective = 2
prompt = '''checkpoint 한 번에 $c = 3$분이 걸리고, 선점(preemption)은 평균 $M = 8$시간에 한 번 무작위로 일어난다. 본문의 1차 근사 $\tau^* \approx \sqrt{2cM}$로 구한 최적 checkpoint 주기는 약 몇 분인가? (정수로)'''
answer = 54
tolerance = 1
explanation = '''단위를 맞춘다. $c = 3$분, $M = 480$분이므로 $\tau^* = \sqrt{2 \times 3 \times 480} = \sqrt{2880} \approx 53.7$분, 약 54분이다. 시간 단위로 하면 $\sqrt{2 \times 0.05 \times 8} \approx 0.894$시간으로 같다. 주기가 이보다 짧으면 저장 비용이, 길면 선점 때 잃는 작업이 커진다. 본문의 Monte Carlo에서도 0.9시간 근처에서 총 소요 시간이 가장 짧았다. 단위를 섞어 $\sqrt{2 \times 3 \times 8}$로 계산하면 약 6.9가 나오는데, 이는 어떤 단위로도 맞지 않는 값이다.'''

[[questions]]
id = "scratch-not-backed-up"
type = "single"
objective = 3
prompt = '''클러스터 문서에 "scratch: 대용량·고속, 백업 없음, 30일 동안 접근하지 않은 파일은 자동 삭제"라고 되어 있다. 논문에 쓸 최종 모델 checkpoint와 결과 표는 어디에 두는가?'''
explanation = '''scratch는 학습 중의 중간 산출물(체크포인트, 캐시, 전처리된 데이터)을 빠르게 읽고 쓰는 작업 공간이다. 백업이 없고 오래된 파일이 지워지므로, 다시 만들 수 없는 결과의 **유일한 사본**을 두면 안 된다. 실험이 끝나면 최종 산출물을 백업되는 프로젝트 저장소(또는 연구실 NAS)로 옮기고, 가능하면 다른 위치에 사본을 하나 더 둔다. 홈 디렉터리는 백업되지만 quota가 작아 대용량 checkpoint에 맞지 않는 경우가 많다.'''

[[questions.choices]]
text = "학습 중에는 scratch에 쓰고, 끝나면 최종 산출물을 백업되는 프로젝트 저장소로 복사한다."
correct = true

[[questions.choices]]
text = "scratch가 가장 빠르고 크므로 그대로 둔다."
feedback = "속도와 크기는 작업 중에 중요하다. 보존에는 백업 여부가 중요하다. 30일 뒤 자동 삭제되면 결과를 되살릴 방법이 없다."

[[questions.choices]]
text = "계산 노드의 로컬 SSD에 둔다. 가장 빠르기 때문이다."
feedback = "로컬 SSD는 보통 job이 끝나면 비워지고, 다른 노드에서는 보이지도 않는다. 작업 중의 임시 공간으로만 쓴다."

[[questions.choices]]
text = "모든 checkpoint를 홈 디렉터리에 저장한다."
feedback = "홈은 백업되지만 quota가 작은 경우가 많다. checkpoint를 쌓다가 quota를 넘으면 저장이 실패하고, 홈이 가득 차 로그인 자체가 불편해질 수 있다."

[[questions]]
id = "shared-etiquette"
type = "multiple"
objective = 1
prompt = '''scheduler가 없는 연구실 공유 GPU 서버에서 지켜야 할 행동을 **모두** 고르시오.'''
explanation = '''scheduler가 없는 서버에서는 사람이 scheduler 역할을 한다. 쓰기 전에 `nvidia-smi`로 비어 있는지 확인하고, `CUDA_VISIBLE_DEVICES`로 쓸 GPU만 보이게 하고, 끝난 notebook 커널과 남은 프로세스를 정리한다. 비어 보인다고 모든 GPU를 말없이 쓰거나, 놀고 있어 보이는 남의 프로세스를 종료하는 것은 연구실 규칙(사용 시간, 우선순위, 사전 공지)을 확인하지 않은 행동이다. 남의 프로세스는 소유자에게 먼저 묻는다.'''

[[questions.choices]]
text = "쓰기 전에 `nvidia-smi`로 GPU가 비어 있는지 확인한다."
correct = true

[[questions.choices]]
text = "`CUDA_VISIBLE_DEVICES`로 내가 쓸 GPU만 보이게 하고 실행한다."
correct = true

[[questions.choices]]
text = "실험이 끝나면 Jupyter 커널과 남은 worker 프로세스를 정리한다."
correct = true

[[questions.choices]]
text = "밤에는 아무도 안 쓰니 비어 있는 GPU를 모두 말없이 쓴다."
feedback = "연구실마다 사용 시간·우선순위 규칙이 있다. 다른 사람의 마감이나 예약을 모른 채 모든 GPU를 점유하면 분쟁이 생긴다. 규칙을 확인하고 공지한다."

[[questions.choices]]
text = "사용률 0%인 남의 프로세스는 버려진 것이므로 `kill`한다."
feedback = "사용률 0%는 데이터 로딩, 디버깅 중, 잠시 멈춘 대화형 세션일 수도 있다. 소유자에게 먼저 묻고, 규칙상 정리 권한이 있는 사람에게 맡긴다."
