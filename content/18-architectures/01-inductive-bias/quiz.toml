# 18.1 귀납적 편향과 아키텍처 선택 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "locality-without-sharing"
type = "numeric"
objective = 1
prompt = '''길이 100인 1채널 신호를 받아 길이 100인 신호를 내는 층이 있다. 출력 위치마다 입력의 이웃 7칸(양끝은 zero padding)만 보되, 위치마다 **서로 다른** 가중치를 쓴다(국소성은 있고 가중치 공유는 없는 locally connected 층). bias를 빼면 가중치는 몇 개인가?'''
answer = 700
tolerance = 0
explanation = '''출력 위치 100개가 각자 가중치 7개를 가지므로 $100 \times 7 = 700$개다. 같은 크기의 dense 층은 $100 \times 100 = 10000$개, 가중치를 공유하는 합성곱은 kernel 크기인 7개다. 국소성은 파라미터를 $T^2$에서 $Tk$로, 가중치 공유는 다시 $k$로 줄인다. 두 가정은 서로 다른 제약이다.'''

[[questions]]
id = "pooling-makes-invariant"
type = "single"
objective = 1
prompt = '''원형 합성곱 층과 ReLU를 몇 번 쌓은 뒤 마지막에 위치 축 전체로 평균을 내는(global average pooling) 모델이 있다. 입력 신호를 원형으로 몇 칸 밀면 모델의 출력은 어떻게 되는가?'''
explanation = '''합성곱과 원소별 ReLU는 이동 등변이므로, 마지막 pooling 직전의 특징 지도는 입력과 같은 칸수만큼 밀린다. 위치 축 전체의 평균은 순서에 무관하므로 밀린 특징 지도와 원래 특징 지도의 평균이 같다. 등변 층 뒤에 불변 pooling을 붙이면 전체가 불변이 된다(7.10장의 합성 규칙).'''

[[questions.choices]]
text = "변하지 않는다(이동 불변)."
correct = true

[[questions.choices]]
text = "출력도 같은 칸수만큼 밀린다(이동 등변)."
feedback = "pooling 전 특징 지도는 밀리지만, 위치 축 전체를 평균 내면 위치 정보가 사라진다. 밀릴 위치 축이 출력에 남아 있지 않다."

[[questions.choices]]
text = "ReLU가 비선형이라 등변성이 깨지므로 출력이 달라진다."
feedback = "원소별 비선형 함수는 위치를 섞지 않으므로 이동 등변성을 깨지 않는다. 등변성을 깨는 것은 위치마다 다른 연산(위치별 가중치, stride로 버리는 칸 등)이다."

[[questions.choices]]
text = "kernel이 좌우 대칭일 때만 변하지 않는다."
feedback = "kernel의 모양은 이동 등변성과 무관하다. 모든 위치에 같은 kernel을 쓴다는 것(가중치 공유)이 등변성의 이유다."

[[questions]]
id = "augmentation-vs-constraint"
type = "single"
objective = 1
prompt = '''회전 대칭이 있는 데이터에서 일반 MLP를 무작위 회전 증강으로 학습했다. 이 모델에 대한 설명으로 옳은 것은?'''
explanation = '''증강은 회전한 입력에서도 손실이 작도록 **권장**할 뿐, 회전 불변성을 **보장**하지 않는다. 학습 분포 근처에서는 거의 불변이지만 멀어질수록 깨질 수 있고, 모델이 회전을 따로 배우느라 데이터와 계산을 쓴다. 구조적 제약(불변 특징, 등변 층)은 모든 입력에서 정확히 보장한다. 대신 데이터에 실제로 없는 대칭을 넣으면 그 오차는 데이터를 늘려도 사라지지 않는다.'''

[[questions.choices]]
text = "회전 불변성이 대략적으로 권장되지만, 정확히 보장되지는 않는다."
correct = true

[[questions.choices]]
text = "증강했으므로 모든 입력에서 정확히 회전 불변이다."
feedback = "손실은 학습에 쓴 회전된 표본에서만 작아진다. 실습(7.10장)에서도 증강한 MLP의 회전 민감도는 0이 아니었다."

[[questions.choices]]
text = "증강은 데이터만 바꾸므로 모델의 귀납적 편향과는 무관하다."
feedback = "증강도 '이 변환을 해도 답이 같다'는 가정을 학습에 넣는 방법이다. 구조가 아니라 데이터로 거는 귀납적 편향이다."

[[questions.choices]]
text = "구조적 제약보다 항상 정확도가 높다. 모델이 대칭을 스스로 배우기 때문이다."
feedback = "같은 데이터 크기에서는 대칭을 정확히 보장하는 구조가 보통 더 데이터 효율적이다. 대칭을 배우는 데 데이터가 쓰이기 때문이다."

[[questions]]
id = "mismatched-bias-plateau"
type = "single"
objective = 2
prompt = '''목표가 신호의 **절대 위치**에 의존하는데(예: 뒤쪽 시점일수록 영향이 크다) 합성곱 + 전체 합 pooling 모델(이동 불변)을 썼다. 학습 데이터를 계속 늘리면 test 성능은 어떻게 되는가?'''
explanation = '''이동 불변 모델은 위치 의존성을 표현할 수 없다. 데이터가 적을 때는 강한 가정 덕분에 빨리 좋아지지만, 표현할 수 없는 부분의 오차는 데이터를 늘려도 줄지 않아 성능이 한 수준에서 멈춘다. 이 장의 실습에서 합성곱 모델의 $R^2$는 약 0.73에서 멈췄고, 가정이 없는 MLP가 데이터 10000개 이상에서 앞질렀다. 편향은 데이터를 아끼는 대가로 표현할 수 있는 함수의 범위를 줄인다.'''

[[questions.choices]]
text = "처음에는 빨리 좋아지지만 일정 수준에서 멈추고, 데이터가 충분히 많으면 가정이 없는 모델에 추월당할 수 있다."
correct = true

[[questions.choices]]
text = "데이터를 충분히 늘리면 결국 정확히 맞춘다. 신경망은 보편 근사기이기 때문이다."
feedback = "보편 근사는 모델 클래스가 목표를 표현할 수 있을 때의 이야기다. 이동 불변 모델의 클래스에는 위치에 의존하는 함수가 없다."

[[questions.choices]]
text = "가정이 틀렸으므로 데이터 크기와 무관하게 MLP보다 항상 나쁘다."
feedback = "데이터가 적을 때는 틀린 가정이라도 대부분 맞는 부분 덕분에 가정 없는 모델보다 나을 수 있다(실습의 N ≤ 1000)."

[[questions]]
id = "match-data-to-bias"
type = "multiple"
objective = 2
prompt = '''데이터 구조와 그에 맞는 귀납적 편향의 짝으로 **적절한** 것을 모두 고르시오.'''
explanation = '''격자 위의 장(field)은 국소 상호작용과 위치 무관한 법칙이 많아 합성곱의 국소성·가중치 공유가 맞는다. 분자의 에너지는 좌표계와 원자 번호에 무관하므로 회전·평행이동·순열에 불변인 구조가 맞는다. 실험 조건 열 개로 이루어진 표 데이터는 열의 순서에 의미가 없고 열마다 의미가 다르므로, 이웃한 열을 같은 kernel로 묶는 합성곱의 가정이 성립하지 않는다. 언어처럼 순서가 의미를 갖는 시퀀스에 순서를 버리는 순열 불변 pooling만 쓰면 "개가 사람을 물었다"와 "사람이 개를 물었다"를 구별하지 못한다.'''

[[questions.choices]]
text = "기상 재분석 격자장의 국소 패턴 → 합성곱(국소성·가중치 공유)"
correct = true

[[questions.choices]]
text = "원자 좌표로 예측하는 분자 에너지 → 회전·평행이동·원자 순열에 불변인 구조"
correct = true

[[questions.choices]]
text = "실험 조건 10개(온도·압력·농도 …)로 이루어진 표 데이터 → 열 축 방향의 1차원 합성곱"
feedback = "표의 열 순서는 임의로 정한 것이고 열마다 단위와 의미가 다르다. 이웃한 열에 같은 kernel을 쓰는 가정이 성립하지 않는다. 트리 앙상블이나 MLP가 출발점이다."

[[questions.choices]]
text = "단어 순서가 의미를 바꾸는 문장 → 단어 embedding의 순열 불변 평균 pooling만 쓰는 모델"
feedback = "순열 불변 모델은 순서가 다른 두 문장에 같은 출력을 낸다. 순서가 정보인 데이터에서는 이 대칭이 실제로 없다."
