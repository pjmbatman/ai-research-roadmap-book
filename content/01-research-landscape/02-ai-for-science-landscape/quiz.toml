# 1.2 AI for Science의 지형 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "contribution-type"
type = "single"
objective = 1
prompt = '''지진계에 기록된 파형들로부터 지하의 속도 구조(어느 깊이에서 지진파가 얼마나 빠른가)를 추정하는 연구는 어느 기여 방식에 해당하는가?'''
explanation = '''속도 구조가 주어지면 파형이 정해지는 것이 순방향 모델 $y = F(\theta)$다. 이 연구는 관측 $y$(파형)에서 원인 $\theta$(속도 구조)를 거꾸로 추정하므로 역문제다. 역문제는 서로 다른 구조가 비슷한 파형을 낼 수 있어 답이 하나가 아닐 때가 많고, 그래서 사후분포 $p(\theta \mid y)$로 답하는 경우가 많다.'''

[[questions.choices]]
text = "대리모델"
feedback = "대리모델은 속도 구조를 입력으로 받아 파형을 빠르게 내는 순방향 함수다. 이 연구는 방향이 반대다."

[[questions.choices]]
text = "역문제·파라미터 추정"
correct = true

[[questions.choices]]
text = "역설계"
feedback = "역설계는 원하는 성질을 갖도록 구조를 정하는 것이다. 지하 구조는 설계 대상이 아니라 추정 대상이다."

[[questions.choices]]
text = "실험 자동화"
feedback = "실험 자동화는 다음에 어디에 지진계를 둘지 같은 결정을 고르는 것이다. 이 연구는 이미 기록된 파형에서 구조를 추정한다."

[[questions]]
id = "extrapolation-default"
type = "single"
objective = 2
prompt = '''기존 재료 2000종의 물성 데이터로 모델을 학습해 아직 합성되지 않은 새 조성의 물성을 예측하려 한다. 학습 데이터를 무작위로 80:20으로 나눈 테스트 점수에 대한 설명으로 옳은 것은?'''
explanation = '''이 연구의 일반화 대상은 "새 조성"이다. 무작위 분할에서는 조성이 비슷한 재료가 학습과 테스트에 함께 들어가므로, 테스트 점수는 이미 본 조성 근처의 보간 성능에 가깝다. 새 조성으로의 외삽 성능을 재려면 조성 계열 단위로 나누거나, 학습 범위 밖의 조성을 테스트로 떼어 놓아야 한다. 무작위 분할의 점수는 대개 외삽 성능보다 좋게 나온다.'''

[[questions.choices]]
text = "테스트 데이터를 학습에 쓰지 않았으므로 새 조성에 대한 성능의 공정한 추정이다."
feedback = "학습에 쓰지 않았다는 것만으로는 부족하다. 테스트 재료가 학습 재료와 조성이 비슷하면, 새 조성이 아니라 이미 본 조성 근처를 평가하는 셈이다."

[[questions.choices]]
text = "비슷한 조성이 양쪽에 들어가 보간 성능에 가까우므로, 새 조성에 대한 성능을 부풀릴 가능성이 크다."
correct = true

[[questions.choices]]
text = "무작위 분할은 최악의 경우를 측정하므로 실제 성능은 이보다 좋을 것이다."
feedback = "반대다. 무작위 분할은 학습과 테스트를 가장 가깝게 만드는 분할 중 하나라서, 외삽이 필요한 문제에서는 대개 낙관적이다."

[[questions.choices]]
text = "데이터가 2000개로 충분히 많으므로 분할 방식은 결과에 영향을 주지 않는다."
feedback = "데이터 수와 상관없이 분할 단위가 일반화 대상과 맞지 않으면 테스트가 측정하는 대상이 달라진다."

[[questions]]
id = "locate-field"
type = "single"
objective = 3
prompt = '''배터리 셀의 충방전 전압 곡선으로부터, 직접 측정하기 어려운 전극 내부의 확산 계수를 추정하는 연구를 이 장의 지형 위에 놓으면?'''
explanation = '''분야는 에너지·배터리(30부)이고, 확산 계수가 주어지면 전압 곡선이 정해지는 전기화학 모델이 순방향 모델이다. 관측(전압 곡선)에서 파라미터(확산 계수)를 거꾸로 찾으므로 역문제·파라미터 추정이다. 확산 계수를 입력으로 전압 곡선을 빠르게 내는 신경망을 만든다면 그것은 대리모델이고, 이 연구의 도구로 쓰일 수는 있다.'''

[[questions.choices]]
text = "에너지·배터리 분야의 대리모델 연구"
feedback = "대리모델은 파라미터에서 전압 곡선으로 가는 순방향 함수다. 이 연구는 전압 곡선에서 파라미터로 거꾸로 간다."

[[questions.choices]]
text = "에너지·배터리 분야의 역문제·파라미터 추정 연구"
correct = true

[[questions.choices]]
text = "화학·재료 분야의 역설계 연구"
feedback = "확산 계수를 원하는 값으로 만드는 전극을 설계한다면 역설계겠지만, 이 연구는 이미 있는 셀의 파라미터를 추정한다."

[[questions.choices]]
text = "발견 연구, 데이터에서 새 법칙을 찾으므로"
feedback = "전기화학 모델의 형태는 이미 정해져 있고, 그 안의 파라미터 값을 추정한다. 모델의 형태 자체를 찾는 것이 발견이다."

[[questions]]
id = "validation-ladder"
type = "multiple"
objective = 2
prompt = '''역설계 연구가 "목표 성질을 갖는 새 분자를 설계했다"고 주장하려 한다. 이 주장을 회고적 벤치마크보다 강하게 뒷받침하는 근거를 모두 고르시오.'''
explanation = '''설계한 후보를 실제로 합성해 측정하거나(실험 검증), 생성모델과 독립된 정밀 계산으로 판정하면 모델 자신의 판단과 독립된 근거가 된다. 모델을 만든 뒤에 생긴 데이터로 테스트하는 것(전향적 테스트)도 연구자가 테스트를 보고 설계를 고를 수 없으므로 더 강하다. 생성모델과 같은 계열의 예측 모델이 높은 점수를 준다는 것은 두 모델이 서로 동의한다는 뜻일 뿐이다.'''

[[questions.choices]]
text = "제안한 분자 몇 개를 실제로 합성해 성질을 측정했다."
correct = true

[[questions.choices]]
text = "생성모델과 독립된 정밀 양자화학 계산으로 후보의 성질을 다시 계산했다."
correct = true

[[questions.choices]]
text = "모델을 확정한 뒤 새로 공개된 측정 데이터로 예측 정확도를 확인했다."
correct = true

[[questions.choices]]
text = "생성모델을 학습시킬 때 쓴 것과 같은 예측 모델이 생성 분자의 98%에 높은 점수를 주었다."
feedback = "판정한 것이 설계에 쓴 바로 그 모델이다. 모델이 틀린 영역을 골랐을 가능성을 배제하지 못한다."

[[questions]]
id = "two-entrants"
type = "single"
objective = 3
prompt = '''이미지 분류 연구를 해 온 ML 연구자가 기후 시뮬레이션 대리모델 연구를 시작한다. 이 연구자가 먼저 채워야 할 빈칸으로 가장 적절한 것은?'''
explanation = '''ML 연구자는 모델 설계와 학습 코드는 이미 갖고 있지만, 데이터 쪽의 검증 장치(시뮬레이터 자체의 오차, 물리적 제약, 시간 자기상관을 고려한 분할, 격자 면적 가중 같은 분야의 평가 관행)를 모르는 경우가 많다. 이 빈칸을 채우지 않으면 무작위 분할의 높은 점수나 시뮬레이터 오차보다 작은 학습 오차를 성과로 보고하게 된다.'''

[[questions.choices]]
text = "더 최신의 아키텍처를 익히는 것"
feedback = "아키텍처는 이미 강점이다. 문제는 그 아키텍처의 결과를 과학적으로 검증하는 장치다."

[[questions.choices]]
text = "시뮬레이터의 오차, 물리적 제약, 시간 상관을 고려한 분할 같은 분야의 검증 장치"
correct = true

[[questions.choices]]
text = "Python과 학습 루프 작성법"
feedback = "이미지 분류 연구를 해 왔다면 이미 가진 능력이다. 과학자 쪽 입문자에게 더 흔한 빈칸이다."

[[questions.choices]]
text = "검증 데이터로 하이퍼파라미터를 고르는 관행"
feedback = "ML 연구자에게는 익숙한 관행이다. 오히려 AI를 배우는 과학자에게 흔한 빈칸이다."
