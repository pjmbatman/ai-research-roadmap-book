# 1.1 AI 연구의 생애주기 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "lifecycle-return-point"
type = "single"
objective = 1
prompt = '''무작위로 나눈 테스트 데이터에서는 오차가 작았던 모델이, 새로 들여온 측정 장비의 데이터에서는 크게 틀린다. 생애주기에서 가장 먼저 다시 볼 단계는?'''
explanation = '''테스트는 좋은데 새 장비에서 무너진다면, "새 장비에서도 써야 한다"는 일반화 대상이 문제 정의에 없었고 분할도 그것을 반영하지 않았다는 뜻이다. 수학적 정의 단계로 돌아가 일반화 대상(새 장비)을 정하고, 장비 단위로 분할을 다시 설계해야 한다. 모델을 키우거나 학습률을 바꾸는 것은 지금의 분할에서 점수를 올릴 뿐, 새 장비에서 통하는지는 여전히 측정하지 못한다.'''

[[questions.choices]]
text = "모델 단계: 더 큰 모델로 바꾼다."
feedback = "모델을 키워도 평가는 여전히 같은 장비의 무작위 분할로 한다. 새 장비에서 통하는지를 측정하는 장치가 없다."

[[questions.choices]]
text = "학습 단계: 학습률과 epoch 수를 다시 탐색한다."
feedback = "학습 설정은 주어진 분할 안의 점수를 바꿀 뿐이다. 문제는 분할이 새 장비라는 일반화 대상을 반영하지 않았다는 데 있다."

[[questions.choices]]
text = "수학적 정의 단계: 일반화 대상을 '새 장비'로 정하고 장비 단위로 분할을 다시 설계한다."
correct = true

[[questions.choices]]
text = "평가 단계: RMSE 대신 MAE로 지표를 바꾼다."
feedback = "지표를 바꿔도 테스트 데이터가 새 장비를 대표하지 않는다는 문제는 그대로다."

[[questions]]
id = "research-type"
type = "single"
objective = 1
prompt = '''한 논문이 여러 연구실의 측정 데이터를 모아 공개하고, "같은 시료는 한쪽에만 들어가도록" 하는 분할 규칙을 정한 뒤, 기존 모델 10개를 이 규칙으로 평가했다. 이 논문의 주된 기여는 어느 종류의 연구인가?'''
explanation = '''새 데이터와 평가 규칙(분할)을 만들고 기존 방법들을 그 기준으로 평가한 것이 주된 기여이므로 데이터·벤치마크 연구다. 이런 연구는 새 모델이 없어도 기여가 된다. 검증 대상은 데이터 품질과 분할 규칙의 타당성, 그리고 그 규칙에서 기존 방법의 순위가 어떻게 바뀌는지다.'''

[[questions.choices]]
text = "알고리즘 연구"
feedback = "새 모델이나 학습법을 제안하지 않았다. 기존 모델 10개를 평가했을 뿐이다."

[[questions.choices]]
text = "데이터·벤치마크 연구"
correct = true

[[questions.choices]]
text = "시스템 연구"
feedback = "계산을 더 빠르거나 싸게 만드는 것이 기여가 아니다."

[[questions.choices]]
text = "기존 모델만 썼으므로 연구 기여가 없다."
feedback = "문제를 정의하는 데이터와 평가 규칙 자체가 기여가 될 수 있다. 분할 규칙을 바꾸면 모델 순위가 바뀌는 일이 흔하다."

[[questions]]
id = "offline-online-gap"
type = "multiple"
objective = 2
prompt = '''오프라인 테스트 점수가 운영 환경의 성능을 대변한다는 가정을 깨뜨릴 수 있는 상황을 모두 고르시오.'''
explanation = '''오프라인 점수가 운영 성능을 대변하려면 테스트 데이터와 운영 데이터가 같은 분포에서 나와야 하고, 입력이 같은 방식으로 만들어져야 한다. 장비 교체는 분포 이동, 모델이 고른 후보만 실험하는 것은 모델이 데이터를 바꾸는 되먹임, 정제된 파일과 원시 입력의 차이는 입력 파이프라인의 불일치다. 테스트 데이터를 학습에 쓰지 않은 것은 오히려 오프라인 평가가 올바르게 되었다는 조건이다.'''

[[questions.choices]]
text = "운영 중에 측정 장비가 다른 모델로 교체된다."
correct = true

[[questions.choices]]
text = "모델이 좋다고 추천한 조건만 실험해 다음 학습 데이터를 모은다."
correct = true

[[questions.choices]]
text = "연구 중에는 정제된 파일을 읽었지만, 운영에서는 결측과 단위 오류가 섞인 원시 데이터가 들어온다."
correct = true

[[questions.choices]]
text = "테스트 데이터를 학습과 하이퍼파라미터 선택에 한 번도 쓰지 않았다."
feedback = "이것은 오프라인 평가가 올바르게 되기 위한 조건이지, 운영과의 간극을 만드는 원인이 아니다."

[[questions]]
id = "surrogate-tradeoff"
type = "single"
objective = 2
prompt = '''어떤 대리모델은 원래 시뮬레이터보다 1000배 빠르지만, 시뮬레이터 결과와 평균 2% 다르다. 이 대리모델을 쓰는 결정으로 가장 타당한 것은?'''
explanation = '''대리모델은 정확도를 조금 포기하고 계산량을 크게 줄이는 절충이다. 수천 번의 평가가 필요한 탐색 초기에는 후보를 거르는 데 이득이 크고, 2% 오차가 결론을 바꿀 수 있는 최종 판단은 시뮬레이터로 다시 확인하면 된다. 2%가 무시할 만한지는 문제의 요구 수준에 달려 있으므로 "항상"이라고 말할 수 없다.'''

[[questions.choices]]
text = "설계 탐색 초기에 수천 개 후보를 거르는 데 쓰고, 최종 후보는 시뮬레이터로 다시 확인한다."
correct = true

[[questions.choices]]
text = "2%는 작은 오차이므로 모든 단계에서 시뮬레이터 대신 쓴다."
feedback = "2%가 작은지는 요구 수준에 달려 있다. 최종 후보 사이의 차이가 2%보다 작으면 대리모델로는 순위를 정할 수 없다."

[[questions.choices]]
text = "시뮬레이터보다 정확하지 않으므로 어떤 단계에서도 쓰지 않는다."
feedback = "계산량도 연구의 제약이다. 수천 번 평가해야 하는 탐색에서 시뮬레이터만 쓰면 탐색 범위가 크게 줄어든다."

[[questions.choices]]
text = "빠른 쪽이 항상 낫다. 오차는 대리모델을 더 학습하면 사라진다."
feedback = "대리모델의 오차는 데이터와 모델 구조의 한계에서 오고, 학습을 늘린다고 반드시 사라지지 않는다. 절충은 문제의 요구 수준으로 판단한다."

[[questions]]
id = "evaluation-first"
type = "single"
objective = 2
prompt = '''평가 단위·지표·성공 기준을 정하기에 가장 적절한 시점은?'''
explanation = '''평가 설계는 수학적 정의 단계에서, 데이터와 모델 결과를 보기 전에 정한다. 결과를 본 뒤에 정하면 의도하지 않아도 이미 본 결과에 유리한 지표와 분할을 고르게 된다. 이후 되먹임으로 평가 설계를 바꿀 수는 있지만, 그때는 바꾼 이유와 시점을 기록하고 테스트 데이터가 더 이상 독립적이지 않다는 점을 밝힌다.'''

[[questions.choices]]
text = "수학적 정의 단계에서, 데이터와 모델 결과를 보기 전에"
correct = true

[[questions.choices]]
text = "모델 학습이 끝난 뒤, 결과를 가장 잘 보여 주는 지표를 고를 때"
feedback = "결과를 본 뒤 지표를 고르면 결과에 유리한 쪽으로 기운다. 대조군 없이 측정한 뒤 비교 대상을 고르는 것과 같다."

[[questions.choices]]
text = "논문을 쓸 때, 리뷰어가 기대할 만한 지표에 맞춰"
feedback = "지표는 연구 질문과 현실의 비용에서 나와야 한다. 리뷰어의 기대는 지표를 정하는 근거가 아니다."

[[questions.choices]]
text = "데이터를 탐색해 분포를 본 뒤, 점수가 잘 나올 분할을 고를 때"
feedback = "분할은 일반화 대상에서 나와야 한다. 점수가 잘 나올 분할을 고르면 테스트가 측정하는 것이 바뀐다."
