# 1.6 AI 연구 생태계 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "venue-choice"
type = "single"
objective = 1
prompt = '''한 연구의 주된 기여가 "모델이 제안한 전해질 후보 다섯 개를 합성해, 그중 두 개가 기존 전해질보다 이온 전도도가 높음을 실험으로 확인했다"는 것이다. 모델 자체는 기존 방법을 조금 바꾼 것이다. 이 결과의 기여를 가장 잘 평가받을 수 있는 경로는?'''
explanation = '''주된 기여가 새 방법이 아니라 실험으로 확인한 새 과학적 사실이므로, 그 사실의 의미와 실험의 타당성을 판단할 수 있는 분야 전문가가 심사하는 과학 분야 저널이나 학제간 저널이 맞다. ML 학회는 새 방법이나 ML 관점의 일반적 통찰을 주로 기여로 읽으므로, 방법이 기존 것과 비슷하면 "방법론적 기여가 작다"는 평가를 받기 쉽다. 프리프린트는 공개 시점을 기록할 수 있지만 심사를 대신하지 않는다.'''

[[questions.choices]]
text = "ML 학회 본 학회: AI를 썼으므로 ML 공동체가 평가해야 한다."
feedback = "ML 학회는 주로 새 방법이나 일반적인 통찰을 기여로 읽는다. 방법이 기존 것과 비슷하면 이 연구의 핵심(실험으로 확인한 새 후보)이 기여로 잘 읽히지 않는다."

[[questions.choices]]
text = "전해질·전기화학 분야 저널이나 학제간 저널: 실험 검증의 의미를 분야 전문가가 판단할 수 있다."
correct = true

[[questions.choices]]
text = "프리프린트만 올린다: 실험으로 확인했으므로 심사가 필요 없다."
feedback = "실험 결과도 측정 방법과 비교 조건의 타당성을 다른 전문가가 검토해야 한다. 프리프린트는 빠른 공유이지 심사가 아니다."

[[questions.choices]]
text = "어느 경로든 같다: 좋은 결과는 어디서나 같은 평가를 받는다."
feedback = "경로마다 심사자와 기여의 기준이 다르다. 같은 연구가 한 곳에서는 '방법 기여가 작다', 다른 곳에서는 '중요한 발견'으로 평가될 수 있다."

[[questions]]
id = "preprint-status"
type = "single"
objective = 1
prompt = '''arXiv에 올라온 지 2주 된 논문이 소셜 미디어에서 크게 화제가 되었고 벌써 수십 번 인용되었다. 이 논문의 상태에 대한 설명으로 옳은 것은?'''
explanation = '''arXiv 같은 프리프린트 서버는 형식과 주제 적합성 정도만 확인하고 동료 심사를 하지 않는다. 화제성과 인용 수는 관심의 지표이지 결과가 검증되었다는 지표가 아니다. 이 논문을 근거로 쓰려면 프리프린트임을 밝히고, 핵심 주장은 원문과 공개 코드로 직접 확인한다.'''

[[questions.choices]]
text = "많이 인용되었으므로 사실상 검증된 결과다."
feedback = "인용 수는 관심을 받았다는 뜻이다. 인용한 논문들이 그 결과를 재현했다는 뜻이 아니다."

[[questions.choices]]
text = "arXiv에 게시되었으므로 동료 심사를 통과했다."
feedback = "arXiv는 형식·주제 적합성 정도만 확인한다. 동료 심사는 학회나 저널에서 따로 받는다."

[[questions.choices]]
text = "동료 심사를 거치지 않은 프리프린트다. 근거로 쓰려면 원문과 코드를 직접 확인한다."
correct = true

[[questions.choices]]
text = "프리프린트는 믿을 수 없으므로 읽지 않는다."
feedback = "프리프린트는 최신 연구를 빠르게 접하는 중요한 경로다. 문제는 읽는 것이 아니라 검증 없이 근거로 쓰는 것이다."

[[questions]]
id = "peer-review-limits"
type = "multiple"
objective = 1
prompt = '''일반적인 학회·저널의 동료 심사가 **보장하지 않는** 것을 모두 고르시오.'''
explanation = '''대부분의 심사자는 코드를 실행하지 않으므로 표의 숫자가 다시 나오는지는 확인되지 않는 경우가 많다. 데이터 누수나 미묘한 구현 오류는 본문만 읽어서는 보이지 않을 수 있다. 반면 심사는 분야 전문가 몇 명이 논문을 읽고, 명백한 방법론적 문제를 지적할 기회를 갖는다는 것은 보장한다. 그래서 심사 통과는 출발점이고, 중요한 결과는 직접 확인한다.'''

[[questions.choices]]
text = "표에 보고된 숫자가 공개 코드로 다시 나온다는 것"
correct = true

[[questions.choices]]
text = "데이터 분할에 누수가 없다는 것"
correct = true

[[questions.choices]]
text = "분야 전문가 몇 명이 논문을 읽고 평가했다는 것"
feedback = "이것은 동료 심사가 하는 일 자체다."

[[questions.choices]]
text = "명백한 방법론적 결함이 있었다면 지적될 기회가 있었다는 것"
feedback = "심사는 이런 기회를 준다. 다만 모든 결함이 발견된다는 보장은 없다."

[[questions]]
id = "leaderboard-gain"
type = "single"
objective = 1
prompt = '''새 방법이 유명한 벤치마크 리더보드에서 1위 방법보다 정확도가 0.3%p 높아 1위가 되었다. 이 결과를 연구 기여로 판단하기 전에 가장 먼저 확인할 것은?'''
explanation = '''0.3%p의 차이가 seed·분할을 바꿨을 때의 흔들림보다 큰지, 그리고 계산량·추가 데이터 같은 조건이 같은지 확인해야 한다. 흔들림보다 작은 차이는 순위를 바꿀 수 있어도 방법이 낫다는 근거가 되지 못한다. 논문의 저자 소속이나 모델 크기는 결과의 타당성과 직접 관계가 없다.'''

[[questions.choices]]
text = "0.3%p 차이가 여러 seed·분할에서의 흔들림보다 크고, 계산·데이터 조건이 같은지"
correct = true

[[questions.choices]]
text = "저자가 유명한 연구 그룹 소속인지"
feedback = "소속은 결과의 타당성을 정하지 않는다. 같은 질문(흔들림, 조건)을 모든 결과에 똑같이 묻는다."

[[questions.choices]]
text = "1위가 되었으므로 확인할 것이 없다."
feedback = "순위는 표 하나의 숫자 비교다. 그 차이가 우연으로 설명되는지는 따로 확인해야 한다."

[[questions.choices]]
text = "새 방법의 파라미터 수가 더 많은지"
feedback = "파라미터 수는 비교 조건의 하나일 뿐이다. 더 근본적인 질문은 차이가 흔들림보다 큰지다."

[[questions]]
id = "progress-signals"
type = "multiple"
objective = 2
prompt = '''"AI가 새 촉매를 발견했다"는 기사가 나왔다. 이 결과가 실질적 진전일 가능성을 **높여 주는** 근거를 모두 고르시오.'''
explanation = '''같은 조건에서 분야의 표준 방법과 비교했는지, 모델이 제안한 후보를 실제로 합성·측정했는지, 코드와 데이터가 공개되어 다른 사람이 확인할 수 있는지는 모두 주장을 뒷받침하는 근거다. 기사의 화제성이나 "획기적"이라는 표현은 근거가 아니라 주목도다.'''

[[questions.choices]]
text = "같은 데이터·같은 분할에서 분야의 표준 계산 방법과 비교했다."
correct = true

[[questions.choices]]
text = "모델이 제안한 후보를 실제로 합성해 활성을 측정했다."
correct = true

[[questions.choices]]
text = "코드와 데이터가 공개되어 다른 그룹이 확인할 수 있다."
correct = true

[[questions.choices]]
text = "여러 언론과 소셜 미디어에서 '획기적'이라고 소개했다."
feedback = "주목도는 검증이 아니다. 같은 질문(비교, 실험 검증, 공개)에 답이 있는지 확인한다."
