# 30.2 배터리 모델의 계층 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "ecm-instant-drop"
type = "numeric"
objective = 2
prompt = '''1-RC 등가회로 모델에서 $R_0 = 25\ \mathrm{m\Omega}$, $R_1 = 15\ \mathrm{m\Omega}$, $C_1 = 2\ \mathrm{kF}$이다. 휴지 상태에서 6 A 방전을 시작하는 **순간** 단자 전압은 몇 mV 떨어지는가?'''
answer = 150
tolerance = 0
slider = { min = 0, max = 300, step = 5, unit = "mV" }
explanation = '''전류가 바뀌는 순간 커패시터 전압 $V_1$은 연속이므로(아직 0) 변하지 않고, 직렬 저항만 즉시 반응한다: $\Delta V = \Delta I \cdot R_0 = 6 \times 0.025 = 0.150$ V. $R_1$의 몫은 시상수 $\tau = R_1 C_1 = 30$ s에 걸쳐 천천히 더해져, 충분히 오래 지나면 총 강하가 $6 \times 0.040 = 240$ mV에 가까워진다(그동안 SOC가 줄어 OCV가 내려가는 몫은 따로다).'''

[[questions]]
id = "euler-step-instability"
type = "single"
objective = 2
prompt = '''$\tau = R_1 C_1 = 30$ s인 1-RC 모델을 $\Delta t = 90$ s 간격의 전진 Euler로 적분했더니 RC 전압이 매 step 부호를 바꾸며 커졌다. 옳은 설명과 처방은?'''
explanation = '''전진 Euler에서 RC 전압의 증폭률은 $1 - \Delta t/\tau = 1 - 3 = -2$로 크기가 1을 넘어 발산한다(9.6장의 안정 영역). 전류가 한 간격 동안 일정하면(영차 유지) RC 쌍의 선형 ODE는 정확히 풀 수 있고, 그 해 $V_{1,k+1} = e^{-\Delta t/\tau}V_{1,k} + R_1(1 - e^{-\Delta t/\tau})I_k$의 증폭률 $e^{-\Delta t/\tau}$는 어떤 $\Delta t$에서도 0과 1 사이다. 물리 파라미터는 문제가 아니다.'''

[[questions.choices]]
text = '''증폭률 $1 - \Delta t/\tau$의 크기가 1을 넘어 수치적으로 불안정하다. 영차 유지의 정확한 이산화를 쓰거나 $\Delta t$를 $2\tau$보다 충분히 작게 한다.'''
correct = true

[[questions.choices]]
text = "셀의 RC 파라미터가 물리적으로 불가능한 값이라 모델 자체가 발산한다."
feedback = "연속시간 모델은 V1이 I R1로 지수적으로 수렴하는 안정한 시스템이다. 발산은 적분 방법이 만든 것이다."

[[questions.choices]]
text = "전류 측정 잡음이 RC 쌍에서 증폭된 것이므로 전류를 평활하면 된다."
feedback = "잡음이 없는 계단 전류에서도 같은 발산이 생긴다. 평활은 원인을 고치지 못한다."

[[questions]]
id = "spm-assumption"
type = "single"
objective = 1
prompt = '''단일 입자 모델(SPM)이 높은 C-rate에서 DFN과 크게 어긋나는 주된 이유는?'''
explanation = '''SPM은 전해질의 농도와 전위가 전극 두께 방향으로 균일하다고 보고, 각 전극을 반응이 고르게 일어나는 입자 하나로 대표한다. 낮은 전류에서는 전해질 내 농도 기울기가 작아 이 가정이 맞지만, 높은 C-rate에서는 전해질 농도 기울기와 그에 따른 과전압, 전극 두께 방향의 반응 불균일이 커진다. SPMe는 전해질 몫을 보정항으로 더하고, DFN은 이를 직접 푼다. 고체 입자 안의 확산은 SPM도 푼다.'''

[[questions.choices]]
text = "전해질의 농도·전위 분포를 무시하고 전극 전체를 입자 하나로 대표하기 때문이다."
correct = true

[[questions.choices]]
text = "입자 내부의 고체 확산을 무시하기 때문이다."
feedback = "SPM의 핵심 상태가 바로 입자 반경 방향의 고체 농도다. 고체 확산은 푼다. 무시하는 것은 전해질 쪽이다."

[[questions.choices]]
text = "OCV 곡선을 쓰지 않기 때문이다."
feedback = "SPM도 각 전극의 개방 전위(입자 표면 농도의 함수)로 전압을 계산한다."

[[questions.choices]]
text = "열 모델이 결합되어 있지 않기 때문이다."
feedback = "DFN도 등온으로 풀 수 있다. 등온 조건에서도 고율에서 SPM과 DFN은 어긋난다."

[[questions]]
id = "cv-charging-dae"
type = "single"
objective = 1
prompt = '''1-RC 모델로 정전압(CV) 충전을 시뮬레이션한다. 단자 전압 $V = V_\max$가 주어지고 전류 $I$가 미지수가 된다. 이 문제의 구조에 대한 설명으로 옳은 것은?'''
explanation = '''CV 구간에서는 $g = \mathrm{OCV}(\mathrm{SOC}) - I R_0 - V_1 - V_\max = 0$이 대수 방정식이고, $I$는 도함수가 나오지 않는 대수 변수다. $\partial g/\partial I = -R_0 \neq 0$이므로 매 순간 $I$를 풀 수 있어 index 1인 DAE다(9.7장). CC에서 CV로 넘어가는 순간의 $I$도 이 식을 만족하는 값(일관된 초기조건)으로 정해야 한다. $R_0 = 0$이면 $g$에 $I$가 직접 나오지 않아 한 번 더 미분해야 하므로 index가 올라간다.'''

[[questions.choices]]
text = '''$I$는 대수 변수이고, $R_0 > 0$이면 매 순간 $g = 0$을 $I$에 대해 풀 수 있는 index 1 DAE다.'''
correct = true

[[questions.choices]]
text = "전압이 일정하므로 상태가 변하지 않아 시뮬레이션할 것이 없다."
feedback = "단자 전압이 고정되어도 SOC와 V1은 계속 변한다. 그래서 전류가 시간에 따라 줄어든다(CV 구간의 전류 감쇠)."

[[questions.choices]]
text = "I에 대한 미분 방정식을 새로 세워야 하므로 일반 ODE가 된다."
feedback = "I의 도함수는 모델에 없다. I는 대수 방정식으로 정해지는 변수다."

[[questions]]
id = "model-choice"
type = "multiple"
objective = 3
prompt = '''목적과 모델 수준의 짝으로 적절한 것을 모두 고르시오.'''
explanation = '''BMS에서 실시간으로 SOC를 추정하려면 상태가 적고 계산이 가벼운 ECM이 기본이다. 고속 충전에서의 리튬 석출 위험은 음극 표면의 전위와 농도에 달려 있으므로, 전극 내부 분포를 푸는 DFN 수준(석출 부모델 포함)이 필요하다. 짧은 펄스로 맞춘 1-RC를 몇 시간짜리 고율 연속 방전에 쓰면 느린 확산 과정을 놓친다(이 장 cell 5). 저온은 저항과 확산 계수를 모두 바꾸므로, 25 °C 파라미터 세트를 그대로 쓰면 적용 범위 밖이다.'''

[[questions.choices]]
text = "마이크로컨트롤러에서 1초마다 SOC 추정 — 1-RC 또는 2-RC 등가회로 모델"
correct = true

[[questions.choices]]
text = "고속 충전 프로토콜이 리튬 석출을 일으키는지 판단 — 전극 내부 분포를 푸는 DFN 수준 모델과 석출 부모델"
correct = true

[[questions.choices]]
text = "30 s 펄스로 맞춘 1-RC로 2C 연속 방전 1시간의 전압 곡선 예측"
feedback = "맞춤에 쓴 시간 규모(30 s)보다 훨씬 긴 운전에서는 느린 확산 몫을 놓친다. 긴 시간 규모의 데이터로 RC 쌍을 추가하거나 맞춰야 한다."

[[questions.choices]]
text = "25 °C에서 만든 파라미터 세트로 -10 °C 충전 시뮬레이션"
feedback = "저항·확산 계수·반응 속도가 온도에 크게 의존한다. 온도 의존성을 포함한 파라미터나 저온 데이터로 다시 맞춘 파라미터가 필요하다."

[[questions]]
id = "ocv-slope-soc-error"
type = "numeric"
objective = 3
prompt = '''OCV 곡선의 기울기가 2 mV/%SOC인 구간에서, 전압 측정에 5 mV의 계통 오차가 있다. 이 전압을 OCV 곡선에 대입해 SOC를 읽으면 SOC 오차는 몇 %p인가?'''
answer = 2.5
tolerance = 0.05
explanation = '''1차 근사로 $\Delta\mathrm{SOC} \approx \Delta V / (d\,\mathrm{OCV}/d\,\mathrm{SOC}) = 5 / 2 = 2.5$ %p다. 같은 5 mV 오차가 기울기 7 mV/% 구간에서는 약 0.7 %p에 그친다. 평탄한 OCV 곡선(LFP 등)에서 전압 기반 SOC 추정이 어려운 이유이고, 이 구간에서는 모델 선택보다 측정과 전류 적산의 정확도가 성능을 정한다(30.4장).'''
