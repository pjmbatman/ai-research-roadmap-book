# 30.3 배터리 데이터셋과 데이터 함정 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "dataset-heterogeneity"
type = "single"
objective = 1
prompt = '''공개 데이터셋 X로 학습한 SOH 추정 모델이 X의 테스트 셀에서는 오차 1%p, 다른 기관의 데이터셋 Y에서는 6%p를 냈다. 모델을 고치기 전에 가장 먼저 확인할 것은?'''
explanation = '''데이터셋 사이에는 화학과 셀 모델, 충방전 프로토콜, 온도, 샘플링 주기, 그리고 SOH 정의(분자와 분모)까지 다를 수 있다. 특히 SOH의 기준 용량이나 용량을 잰 시험(RPT 대 사이클링)이 다르면, 모델이 완벽해도 정의 차이만큼 오차가 난다. 이런 차이를 맞추거나 기록하지 않고 모델을 키우는 것은 원인을 모른 채 증상을 고치는 일이다.'''

[[questions.choices]]
text = "두 데이터셋의 화학·프로토콜·온도와 SOH 정의(어느 시험의 용량을 무엇으로 나눴는지)가 같은지"
correct = true

[[questions.choices]]
text = "모델이 과소적합했는지. 더 큰 모델로 X를 더 잘 맞히면 Y에서도 좋아진다."
feedback = "X에서 이미 오차가 작다. X를 더 잘 맞히는 것은 X와 Y의 차이를 줄이지 못하고, 오히려 X 특유의 조건에 더 맞출 수 있다."

[[questions.choices]]
text = "Y의 셀이 불량이었는지. 다른 기관의 데이터는 품질이 낮아 평가에서 빼는 것이 낫다."
feedback = "외부 데이터에서의 실패는 일반화 범위에 대한 가장 중요한 정보다. 차이의 원인을 확인하지 않고 빼면 성능을 과대평가한다."

[[questions]]
id = "cycle-split-leak"
type = "single"
objective = 2
prompt = '''40개 셀의 사이클별 특징(한 사이클 = 한 샘플)으로 셀 수명을 예측했다. 사이클 단위 무작위 KFold에서 MAE 58 사이클, 셀 단위 5-fold(한 셀의 사이클은 모두 같은 fold)에서 171 사이클, 모든 셀에 평균 수명을 예측하는 baseline은 169 사이클이었다. 옳은 해석은?'''
explanation = '''사이클 단위로 섞으면 같은 셀의 이웃 사이클이 학습과 테스트에 함께 들어간다. 셀마다 다른 초기 용량·저항 같은 "셀의 지문"이 수명과 무관하더라도, 모델은 지문으로 셀을 알아보고 그 셀의 수명을 그대로 돌려준다. 처음 보는 셀에서의 성능은 셀 단위 분할의 171 사이클이고, 이는 평균값 예측(169)과 다르지 않다. 즉 이 모델은 새 셀에 대해 아무것도 배우지 못했다.'''

[[questions.choices]]
text = "58은 같은 셀을 알아보는 누수 때문이다. 새 셀에 대한 성능은 171이고, 평균값 baseline보다 나을 것이 없다."
correct = true

[[questions.choices]]
text = "두 분할의 평균인 약 115 사이클이 실제 성능의 공정한 추정이다."
feedback = "누수가 섞인 추정과 섞이지 않은 추정을 평균 내면 여전히 누수가 섞인 추정이다."

[[questions.choices]]
text = "셀 단위 분할은 fold마다 셀 수가 적어 분산이 크므로, 사이클 단위 KFold를 보고하는 것이 더 안정적이다."
feedback = "분산이 작은 것과 편향이 없는 것은 다르다. 사이클 단위 KFold는 안정적으로 틀린 답을 준다."

[[questions]]
id = "split-unit-claim"
type = "single"
objective = 2
prompt = '''논문의 주장이 "처음 보는 **충전 프로토콜**로 운전한 셀의 수명도 예측한다"이다. 데이터에는 프로토콜마다 셀이 2–4개씩 있다. 이 주장을 검증하는 분할은?'''
explanation = '''분할의 단위는 주장의 범위가 정한다(15.4장). 셀 단위로 나누면 테스트 셀과 같은 프로토콜의 다른 셀이 학습에 들어가므로, 모델이 그 프로토콜의 수명 수준을 이미 본 상태다. 처음 보는 프로토콜에 대한 주장이라면 프로토콜 단위로 묶어 나눠야 한다(leave-protocol-out). 같은 배치·같은 시험 채널 같은 다른 공유 요인도 주장에 따라 묶음 단위가 된다.'''

[[questions.choices]]
text = "프로토콜 단위로 묶어, 한 프로토콜의 셀은 모두 학습이나 모두 테스트에 넣는다."
correct = true

[[questions.choices]]
text = "셀 단위로 나누면 충분하다. 같은 셀의 사이클만 섞이지 않으면 누수가 없다."
feedback = "셀 단위 분할은 '같은 프로토콜의 새 셀'에 대한 주장까지만 검증한다. 테스트 셀의 프로토콜을 학습에서 이미 보았다."

[[questions.choices]]
text = "프로토콜별로 층화해, 모든 프로토콜이 학습과 테스트에 고르게 나타나게 한다."
feedback = "층화는 반대 방향이다. 모든 테스트 프로토콜이 학습에 나타나므로 '처음 보는 프로토콜'을 전혀 검증하지 못한다."

[[questions]]
id = "censored-drop-bias"
type = "single"
objective = 3
prompt = '''40개 셀 중 13개가 1000 사이클 시험이 끝날 때까지 EOL에 닿지 않았다. 수명 회귀 모델을 만들면서 이 13개 셀을 "label이 없다"는 이유로 학습과 평가에서 모두 뺐다. 무엇이 문제인가?'''
explanation = '''수명이 긴 셀일수록 시험 안에 EOL에 닿지 못하므로, 중도절단된 셀을 빼면 학습과 평가 데이터가 수명이 짧은 셀 쪽으로 치우친다. 이 장의 예에서 참 평균 수명 908 사이클이 관측된 셀만으로는 790 사이클로 보였다. 모델은 짧은 수명 쪽으로 편향되고, 평가도 긴 수명 셀에서의 성능을 보지 못한다. 중도절단 셀은 "수명 ≥ 1000"이라는 정보를 담고 있으며, 생존분석의 likelihood(16.8장)로 그 정보를 쓸 수 있다.'''

[[questions.choices]]
text = "수명이 긴 셀만 체계적으로 빠지므로 학습과 평가가 모두 짧은 수명 쪽으로 편향된다."
correct = true

[[questions.choices]]
text = "셀 수가 줄어 분산이 커지는 것뿐이고 편향은 없다."
feedback = "빠지는 셀이 무작위가 아니다. 수명이 길수록 빠질 확률이 높으므로 편향이 생긴다."

[[questions.choices]]
text = "문제없다. 중도절단 셀의 수명을 1000으로 넣어 학습하면 더 나쁘다."
feedback = "1000으로 넣는 것도 수명을 깎는 편향이 있다(예에서 858). 그렇다고 빼는 것이 해법은 아니다. 두 처리 모두 정보를 잘못 쓴다. 중도절단을 likelihood에 그대로 반영하는 방법을 쓴다."

[[questions]]
id = "cycling-vs-rpt-capacity"
type = "single"
objective = 3
prompt = '''2C 사이클링 중 측정한 방전 용량은 같은 시점의 저율 RPT 용량보다 약 0.12 Ah 낮다. 사이클링 용량이 2.4 Ah(공칭 3.0 Ah의 80%) 아래로 처음 떨어진 사이클을 수명 label로 쓰면?'''
explanation = '''고율에서는 $IR$ 강하 때문에 컷오프에 일찍 닿아 용량이 낮게 측정된다(30.1장). 이 계통 차이 때문에 사이클링 용량은 RPT 용량보다 먼저 기준선에 닿고, 수명 label이 짧아진다. 이 장의 예에서 참 EOL 1291 사이클이 사이클링 용량으로는 1252가 되었다. 잡음을 평활해도 계통 차이는 남는다. RPT 시점에서 두 용량의 차이를 재 사이클링 용량을 보정하거나, label을 RPT 용량으로 정의한다.'''

[[questions.choices]]
text = "label이 계통적으로 짧아진다. RPT로 보정하거나 RPT 용량으로 label을 정의한다."
correct = true

[[questions.choices]]
text = "측정 잡음 문제이므로 이동 중앙값으로 평활하면 해결된다."
feedback = "평활은 무작위 잡음을 누를 뿐 0.12 Ah의 계통 차이를 없애지 못한다. 이 장의 예에서 평활 후에도 EOL은 1256으로 여전히 이르다."

[[questions.choices]]
text = "어차피 모든 셀에 같은 방향으로 작용하므로 수명 예측 성능에는 영향이 없다."
feedback = "차이의 크기는 C-rate·온도·저항에 따라 셀마다 다르다. 셀마다 다르게 틀린 label은 모델이 배울 수 없는 잡음이 되거나, 프로토콜과 상관된 편향이 된다."
