# 30.4 상태 추정과 수명 예측 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "measurable-inputs"
type = "single"
objective = 1
prompt = '''전기차 BMS에서 쓸 SOH 추정 모델을 실험실 데이터로 만든다. 다음 중 입력으로 쓰기에 가장 문제가 큰 것은?'''
explanation = '''실제 차량은 0%에서 100%까지 정해진 저율로 완전 충방전하는 일이 거의 없다. 실험실에서는 매 RPT마다 얻을 수 있는 전체 용량 곡선을 입력으로 쓰면 성능이 좋게 나오지만, 배치될 곳에서 그 입력은 존재하지 않는다. 입력은 배치 환경에서 실제로 측정되는 구간(예: 충전 중 특정 전압 구간, 부분 충전 곡선, 펄스 응답)으로 정의해야 한다. 나머지 선택지는 차량에서도 측정된다.'''

[[questions.choices]]
text = "매번 0%에서 100%까지 C/20으로 측정한 전체 방전 용량-전압 곡선"
correct = true

[[questions.choices]]
text = "충전 중 3.8–4.0 V 구간을 지나는 동안 들어간 전하량"
feedback = "부분 충전 구간은 차량이 충전할 때 자주 지나는 구간이라 실제로 측정할 수 있다. 다만 그 구간을 지나지 않는 충전 습관에서는 결측이 생기므로 결측 처리를 함께 설계한다."

[[questions.choices]]
text = "가속·감속 때 전류 계단에 대한 전압 응답에서 추정한 저항"
feedback = "주행 중 전류 변화는 늘 있으므로 펄스 응답 기반 저항은 차량에서 계속 얻을 수 있는 입력이다."

[[questions]]
id = "coulomb-offset-drift"
type = "numeric"
objective = 2
prompt = '''용량 2.5 Ah 셀의 전류 센서에 +0.05 A의 offset이 있다. 다른 오차가 없다면 10시간 동안 쿨롱 카운팅만으로 추적한 SOC에 쌓이는 오차는 몇 %p인가?'''
answer = 20
tolerance = 0.1
slider = { min = 0, max = 50, step = 1, unit = "%p" }
explanation = '''offset이 쌓는 전하량은 $0.05\ \mathrm{A} \times 10\ \mathrm{h} = 0.5\ \mathrm{Ah}$이고, 용량으로 나누면 $0.5/2.5 = 20\%$p다. 오차는 시간에 비례해 끝없이 쌓인다. 초기 SOC 오차는 그대로 남고(줄지도 늘지도 않는다), 용량 오차는 그동안 흐른 전하량에 비례한다. 쿨롱 카운팅에는 이 오차를 되돌리는 피드백이 없으므로, 전압 측정으로 보정하는 필터나 완전 충전 같은 기준 시점이 필요하다.'''

[[questions]]
id = "ekf-corrects-initial-error"
type = "single"
objective = 2
prompt = '''초기 SOC를 30%p 틀리게 시작했을 때, 쿨롱 카운팅의 오차는 2시간 뒤에도 약 26–30%p로 남았지만 1-RC 모델 기반 EKF는 1분 안에 오차를 1%p 아래로 줄였다. 차이의 이유로 가장 정확한 것은?'''
explanation = '''쿨롱 카운팅은 전류 적분뿐이라 초기 오차를 알아챌 방법이 없다. EKF는 매 step 측정 전압과 모델이 예측한 전압의 차이(혁신)를 보고, OCV 곡선의 기울기 $d\,\mathrm{OCV}/d\,\mathrm{SOC}$를 통해 그 차이를 SOC 보정으로 바꾼다. 따라서 보정의 힘은 OCV 곡선의 기울기와 모델(저항·RC 파라미터)의 정확도에 달려 있다. 평탄한 OCV 구간이나 모델 파라미터가 틀린 조건에서는 이 보정이 약해지거나 편향된다.'''

[[questions.choices]]
text = "EKF는 측정 전압과 모델 예측 전압의 차이를 OCV 기울기를 통해 SOC 보정으로 바꾸는 피드백이 있다."
correct = true

[[questions.choices]]
text = "EKF는 전류를 더 정확하게 적분하는 수치 방법이다."
feedback = "EKF의 예측 단계는 쿨롱 카운팅과 같은 전류 적분이다. 차이는 측정 갱신 단계의 피드백에서 온다."

[[questions.choices]]
text = "EKF는 SOC를 직접 측정한다."
feedback = "SOC는 직접 측정할 수 없는 잠재 상태다. EKF가 쓰는 측정은 단자 전압뿐이다."

[[questions]]
id = "ekf-flat-ocv"
type = "single"
objective = 2
prompt = '''같은 EKF를 OCV 곡선의 중간 구간이 매우 평탄한 셀(예: LFP)에 쓰면, 그 구간에서 어떤 일이 예상되는가?'''
explanation = '''관측 Jacobian의 SOC 성분이 $d\,\mathrm{OCV}/d\,\mathrm{SOC}$다. 이것이 0에 가까우면 칼만 이득의 SOC 성분도 작아져, 필터는 측정 전압으로 SOC를 거의 보정하지 못하고 예측 단계(쿨롱 카운팅)에 의존한다. 평탄 구간에서는 센서 offset과 용량 오차가 다시 쌓이며, 공분산도 잘 줄지 않는다(24.6장의 관측 가능성). 이 구간에서는 필터 튜닝보다 전류 센서의 정확도, 평탄 구간 바깥에서의 재보정, 다른 측정(온도 등)이 성능을 정한다.'''

[[questions.choices]]
text = "전압이 SOC에 대해 정보를 거의 주지 않아 보정이 약해지고, 쿨롱 카운팅 오차가 다시 쌓인다."
correct = true

[[questions.choices]]
text = "OCV가 일정하면 모델이 단순해지므로 EKF가 더 정확해진다."
feedback = "모델이 단순해지는 것과 상태가 관측 가능한 것은 다르다. 전압이 SOC에 따라 변하지 않으면 전압으로 SOC를 알 수 없다."

[[questions.choices]]
text = "측정 잡음 분산 R을 작게 잡으면 평탄 구간에서도 보정이 강해진다."
feedback = "R을 줄여도 이득의 SOC 성분은 기울기에 비례해 작다. 오히려 작은 전압 잡음을 큰 SOC 변화로 해석해 추정이 흔들릴 수 있다."

[[questions]]
id = "split-for-new-protocol"
type = "single"
objective = 3
prompt = '''초기 사이클 특징으로 수명을 예측하는 모델의 MAPE가 셀 단위 5-fold에서 14.6%, 프로토콜 단위(leave-one-protocol-out)에서 18.0%였다. 논문에 "처음 보는 충전 프로토콜로 운전한 셀의 수명을 예측한다"고 쓰려면 어떤 수치를 보고해야 하는가?'''
explanation = '''셀 단위 분할에서는 테스트 셀과 같은 프로토콜의 다른 셀이 학습에 있으므로, 모델은 그 프로토콜의 특징-수명 관계를 이미 본 상태다. 처음 보는 프로토콜에 대한 주장은 프로토콜 단위 분할의 18.0%가 뒷받침한다. 두 수치를 함께 보고하면 "같은 조건의 새 셀"과 "새 조건"에서의 성능 차이까지 전달할 수 있다.'''

[[questions.choices]]
text = "프로토콜 단위의 18.0%. 셀 단위 수치는 '이미 본 프로토콜의 새 셀'에 대한 것이다."
correct = true

[[questions.choices]]
text = "셀 단위의 14.6%. 셀 단위로 나눴으므로 누수가 없다."
feedback = "셀 단위 분할은 셀 수준의 누수를 막을 뿐, 프로토콜 수준의 정보는 학습에 남아 있다. 주장의 범위가 분할의 단위를 정한다."

[[questions.choices]]
text = "두 수치의 평균인 16.3%"
feedback = "서로 다른 질문에 대한 답을 평균 내면 어느 질문에도 답하지 않는다."

[[questions]]
id = "conformal-condition-coverage"
type = "single"
objective = 3
prompt = '''수명의 90% split conformal 예측 구간을 셀 단위 교차검증으로 평가했더니 전체 coverage는 90%였지만, 프로토콜별로는 70%에서 100%까지 퍼졌다. 옳은 해석은?'''
explanation = '''split conformal은 보정 데이터와 테스트 데이터가 교환 가능할 때 **전체(주변)** coverage를 보장한다(21.3장). 조건별(프로토콜별) coverage는 보장하지 않는다. 오차가 큰 프로토콜에서는 구간이 너무 좁고, 오차가 작은 프로토콜에서는 넓다. 조건별 신뢰성이 필요하면 조건별 coverage를 보고하고, 조건별로 보정하거나(데이터가 충분할 때) 오차 규모를 조건에 따라 바꾸는 방법을 쓴다. 처음 보는 프로토콜에서는 교환 가능성 자체가 깨져 전체 coverage도 떨어진다(이 장의 예에서 82%).'''

[[questions.choices]]
text = "conformal 구간은 전체 coverage만 보장하므로, 프로토콜별 coverage를 따로 보고하고 필요하면 조건별로 보정한다."
correct = true

[[questions.choices]]
text = "전체 coverage가 90%이므로 구간은 모든 프로토콜에서 신뢰할 수 있다."
feedback = "전체 coverage 90%는 프로토콜별로 70%와 100%가 섞여도 나온다. 70%인 프로토콜의 셀에게 '90% 구간'은 과신이다."

[[questions.choices]]
text = "구현 오류다. 올바른 conformal 구간은 모든 부분집합에서 90%를 보장한다."
feedback = "그런 조건부 보장은 일반적으로 불가능하다. split conformal의 보장은 교환 가능성 아래의 주변 coverage다."
