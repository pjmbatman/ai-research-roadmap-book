# 30.5 파라미터 추정과 하이브리드 모델링 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "r0-from-voltage-jump"
type = "numeric"
objective = 1
prompt = '''휴지 상태의 셀에 3 A 방전 펄스를 걸자 단자 전압이 펄스 시작 순간 60 mV 떨어지고, 이후 30초 동안 45 mV가 더 천천히 떨어져 거의 일정해졌다. 1-RC 등가회로 모델로 보면 $R_0$는 몇 mΩ인가?'''
answer = 20
tolerance = 0.5
slider = { min = 0, max = 50, step = 1, unit = "mΩ" }
explanation = '''펄스 시작 순간에는 RC 쌍의 전압 $V_1$이 아직 0이므로, 즉시 떨어진 전압은 $I R_0$뿐이다. $R_0 = 0.060\ \text{V} / 3\ \text{A} = 0.020\ \Omega = 20$ mΩ이다. 이후 천천히 떨어진 45 mV는 $I R_1$에 해당하므로 $R_1 = 15$ mΩ이다. 전체 강하 105 mV를 전류로 나눈 35 mΩ은 $R_0 + R_1$이다.'''

[[questions]]
id = "short-pulse-design"
type = "multiple"
objective = 2
prompt = '''시상수 $\tau = R_1C_1 \approx 30$ s인 셀에 3 s짜리 펄스만 걸고 휴지 구간 없이 기록했더니, $R_1$의 상대 표준오차가 2000%로 나왔다. $R_1$의 식별 가능성을 실제로 높이는 방법을 모두 고르시오.'''
explanation = '''펄스가 $\tau$보다 훨씬 짧으면 $V_1 \approx I t / C_1$로 거의 직선이라 $R_1$이 응답에 거의 나타나지 않는다. 펄스를 $\tau$ 이상으로 늘리면 $V_1$이 $I R_1$로 포화하는 모습이 보이고, 펄스 뒤 휴지 구간을 기록하면 이완 속도에서 $\tau$를 읽어 $R_1 = \tau / C_1$을 정할 수 있다(같은 3 s 펄스 뒤에 30 s 남짓의 휴지만 더해도 상대오차가 약 13%로 줄어든다). 초기값을 바꾸는 것은 같은 데이터의 평평한 방향 안에서 다른 점을 고르는 것일 뿐이고, 모델을 복잡하게 하면 식별해야 할 파라미터만 늘어난다.'''

[[questions.choices]]
text = "펄스 길이를 시상수 τ 이상(예: 수백 초)으로 늘린다."
correct = true

[[questions.choices]]
text = "펄스 뒤 휴지 구간의 전압 이완을 τ의 몇 배 동안 기록한다."
correct = true

[[questions.choices]]
text = "같은 3 s 데이터에서 최적화 초기값을 여러 개로 바꿔, 잔차가 가장 작은 해를 고른다."
feedback = "잔차가 거의 같은 해가 넓게 퍼져 있는 것이 문제다. 초기값을 바꾸면 그 평평한 골짜기 안에서 다른 점이 나올 뿐, 데이터의 정보는 늘지 않는다."

[[questions.choices]]
text = "모델을 2-RC로 바꿔 짧은 펄스 응답을 더 정확히 맞춘다."
feedback = "데이터의 정보는 그대로인데 파라미터가 늘어나므로 식별 가능성은 더 나빠진다. 잔차가 줄어드는 것과 파라미터가 정해지는 것은 다르다."

[[questions]]
id = "sampling-merges-r0-r1"
type = "single"
objective = 2
prompt = '''300 s 펄스 실험을 60 s 간격으로만 기록한 데이터에서 추정한 $R_0$와 $R_1$의 상관이 −0.998이었다. 이 결과에 대한 해석으로 가장 옳은 것은?'''
explanation = '''기록 간격(60 s)이 시상수(30 s)보다 길면 즉시 변화($R_0$)와 느린 변화($R_1$)를 구분할 샘플이 거의 없다. 펄스 동안의 전압 높이는 합 $R_0 + R_1$로 정해지므로, 한쪽을 늘리고 다른 쪽을 줄여도 데이터가 거의 똑같이 설명된다. 상관이 −1에 가깝다는 것은 이 방향이 평평하다는 뜻이다. 개별 값이 아니라 합만 해석하고, 둘을 분리하려면 샘플 간격을 줄이거나 다른 측정을 더한다.'''

[[questions.choices]]
text = '''데이터가 정하는 것은 사실상 합 $R_0 + R_1$이므로, 개별 값은 해석하지 않는다.'''
correct = true

[[questions.choices]]
text = '''$R_0$와 $R_1$은 물리적으로 반비례 관계에 있다는 것이 확인되었다.'''
feedback = "추정량 사이의 상관은 실험 설계가 만든 것이지 물리 법칙이 아니다. 같은 셀을 1 Hz로 기록하면 상관은 −0.968로 약해지고 두 값이 각각 1% 안으로 정해진다."

[[questions.choices]]
text = "잔차가 측정 잡음 수준이면 상관과 무관하게 두 추정값을 그대로 보고해도 된다."
feedback = "잔차는 모델이 데이터를 설명하는지를 말할 뿐, 파라미터가 유일하게 정해졌는지는 말하지 않는다. 이 설계에서 두 값의 상대오차는 13–17%다."

[[questions.choices]]
text = "상관이 높으므로 둘 중 하나를 0으로 두고 나머지 하나만 추정하면 된다."
feedback = "합만 정해지는 상황에서 하나를 0으로 두면 그 합을 다른 하나에 몰아줄 뿐이다. 그렇게 얻은 값은 물리적으로 해석할 수 없다. 다른 정보(EIS, 짧은 샘플 간격)로 하나를 따로 정하는 것과 다르다."

[[questions]]
id = "posterior-equals-prior"
type = "single"
objective = 2
prompt = '''$R_1$에 로그정규 사전분포(중앙값 10 mΩ, 90% 구간 4.4–22.7 mΩ)를 두고 3 s 펄스 데이터로 사후분포를 계산했더니 중앙값 9.8 mΩ, 90% 구간 4.3–22.3 mΩ이 나왔다. 옳은 해석은?'''
explanation = '''사후분포가 사전분포와 거의 같으면 우도가 그 방향으로 거의 평평하다는 뜻, 즉 데이터가 $R_1$에 대해 거의 아무것도 말하지 않았다는 뜻이다. 이때의 사후 중앙값 9.8 mΩ은 사전분포가 정한 값이다. 이를 "데이터로 추정한 값"으로 보고하면 사전분포를 데이터로 위장하게 된다. 사전분포와 사후분포를 나란히 보이는 것이 식별 가능성의 좋은 진단이다.'''

[[questions.choices]]
text = "데이터가 R1에 대한 정보를 거의 주지 않았으므로, 이 결과는 사전분포를 되풀이한 것이다."
correct = true

[[questions.choices]]
text = "사후분포가 사전분포를 확인해 주었으므로 R1 ≈ 10 mΩ이 데이터로 검증되었다."
feedback = "데이터가 정보를 주지 않아도 사후분포는 사전분포와 같아진다. 같다는 것은 확인이 아니라 정보가 없다는 신호다. 이 셀의 참값은 15 mΩ이었다."

[[questions.choices]]
text = "사후 구간이 사전 구간보다 조금 좁아졌으므로 베이지안 추정이 최소제곱보다 정확하다."
feedback = "구간의 차이는 격자·잡음 수준의 작은 차이다. 같은 설계로 최소제곱을 하면 상대오차가 2000%로, 두 방법 모두 데이터에 정보가 없다는 같은 사실을 다른 방식으로 보여 준다."

[[questions]]
id = "hybrid-extrapolation"
type = "single"
objective = 3
prompt = '''15–35 °C에서 추정한 $R_0$ 다섯 개로 (가) $T$의 2차 다항식과 (나) Arrhenius 꼴 $\ln R_0 = a + b/T$를 맞췄다. 두 모델은 25 °C에서 같은 값을 주지만 −10 °C에서는 (가)가 76.6 mΩ, (나)가 102.2 mΩ을 예측했다(참값 100 mΩ). 이 차이의 원인으로 가장 옳은 것은?'''
explanation = '''학습 범위 안에서는 두 모델 모두 데이터를 잘 맞추므로 시험 오차로는 구별되지 않는다. 범위 밖의 행동은 데이터가 아니라 모델의 **함수 꼴**이 정한다. Arrhenius 꼴은 온도가 내려갈수록 저항이 지수적으로 커지는 구조를 담고 있어 외삽이 그 방향을 따른다. 다항식은 범위 밖에서 아무 물리적 근거 없이 휜다. 단, 이 이점은 참 의존성이 실제로 Arrhenius에 가까울 때만 성립한다.'''

[[questions.choices]]
text = "Arrhenius 꼴은 저항의 온도 의존 구조를 함수 꼴로 담고 있어, 데이터가 없는 저온에서도 그 구조를 따라 외삽하기 때문이다."
correct = true

[[questions.choices]]
text = "Arrhenius 모델은 파라미터가 2개로 다항식(3개)보다 적어서 과적합이 덜하기 때문이다."
feedback = "파라미터 수 차이도 있지만 핵심은 아니다. 2차 다항식도 다섯 점을 잡음 수준으로 맞추고 25 °C 예측은 같다. 범위 밖의 차이를 만드는 것은 함수 꼴이 담은 구조다."

[[questions.choices]]
text = "다항식은 로그를 취하지 않아 수치 오차가 커졌기 때문이다."
feedback = "수치 오차의 크기는 mΩ 단위 예측 차이에 비해 무시할 만하다. 차이는 다항식이 범위 밖에서 휘는 방식에서 온다."

[[questions.choices]]
text = "학습 범위 안의 오차가 Arrhenius 쪽이 더 작았기 때문이다."
feedback = "범위 안에서는 두 모델이 거의 같다(25 °C에서 20.0 vs 20.1 mΩ). 범위 안의 오차로는 범위 밖의 성능을 판단할 수 없다는 것이 이 예의 요점이다."

[[questions]]
id = "surrogate-evaluation"
type = "multiple"
objective = 3
prompt = '''C-rate와 온도를 입력으로 방전 용량을 예측하는 대리모델을 BMS 설계에 쓰려고 한다. 평가 보고에 반드시 포함해야 할 것을 모두 고르시오.'''
explanation = '''대리모델은 정확도·물리적 일관성·속도의 세 축으로 평가한다. 학습 범위 밖(저온·고율)의 오차를 따로 보고해야 위험한 조건에서의 행동을 알 수 있고, 용량의 범위(0–1)와 C-rate에 대한 단조성 같은 물리 검사는 정확도와 별개로 실패할 수 있다(실습의 하이브리드는 가장 정확했지만 5점에서 음수 용량을 냈다). 속도는 고충실도 모델과 같은 조건에서 재야 비교가 된다. 학습 데이터에 대한 적합 오차는 일반화에 대해 아무것도 말하지 않는다.'''

[[questions.choices]]
text = "학습 범위 안과 밖(저온·고율)을 나눈 시험 오차(평균과 최대)"
correct = true

[[questions.choices]]
text = "용량이 0–1 범위에 있는지, C-rate가 커지면 줄어드는지 같은 물리적 일관성 검사"
correct = true

[[questions.choices]]
text = "같은 기계에서 잰 고충실도 모델 대비 평가 1회 시간"
correct = true

[[questions.choices]]
text = "학습에 쓴 고충실도 실행 30개에 대한 적합 오차"
feedback = "GP처럼 유연한 모델은 학습점을 거의 정확히 지나므로 적합 오차는 0에 가깝다. 이것은 새 조건에서의 정확도에 대해 아무것도 말하지 않는다."
