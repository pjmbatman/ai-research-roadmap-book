# 30.6 충전 최적화와 제어 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "cc-time-to-80"
type = "numeric"
objective = 1
prompt = '''3 Ah 셀을 SOC 10%에서 80%까지 2C 정전류로 충전한다. 전압 상한에 닿지 않고 쿨롱 효율이 100%라고 가정하면 몇 분이 걸리는가?'''
answer = 21
tolerance = 0.5
slider = { min = 0, max = 60, step = 1, unit = "min" }
explanation = '''2C는 정격 용량을 0.5시간에 채우는 전류(6 A)다. SOC 70%p는 용량의 0.7배이므로 $0.7 \times 0.5\ \text{h} = 0.35\ \text{h} = 21$분이다. C-rate로 쓰면 용량과 무관하게 $\Delta\mathrm{SOC} / c$ 시간이 된다. 본문 cell 1의 2C 결과(80%까지 21.0분)와 같다. 실제로는 전류가 클수록 CV가 더 낮은 SOC에서 시작하므로, 3C처럼 80% 전에 CV에 들어가면 이 계산보다 오래 걸린다.'''

[[questions]]
id = "cv-start-soc"
type = "single"
objective = 1
prompt = '''CC-CV 충전에서 CC 전류를 0.5C에서 3C로 6배 올렸더니, 80%까지의 시간은 거의 6분의 1이 되었지만 충전 종료(전류 C/20)까지의 시간은 약 3.5분의 1에 그쳤다. 가장 큰 이유는?'''
explanation = '''단자 전압은 개방 전압에 과전압 $I R_0 + V_1$을 더한 값이다. 전류가 크면 과전압이 커서 더 낮은 SOC에서 전압 상한에 닿고(본문에서 CV 시작 SOC 0.97 → 0.66), 그 뒤를 전류가 지수적으로 줄어드는 느린 CV로 채워야 한다. 그래서 전류를 키워도 CV 구간이 길어져 전체 시간은 비례해서 줄지 않는다.'''

[[questions.choices]]
text = "전류가 크면 과전압이 커져 더 낮은 SOC에서 전압 상한에 닿고, 느린 CV 구간이 길어지기 때문이다."
correct = true

[[questions.choices]]
text = "전류가 크면 셀 온도가 올라 용량 자체가 줄어들기 때문이다."
feedback = "온도는 오르지만 이 모델에서 용량은 온도와 무관하다. 시간 차이는 CV가 시작되는 SOC에서 온다."

[[questions.choices]]
text = "CV 단계의 전류는 CC 전류와 상관없이 항상 같은 시간이 걸리기 때문이다."
feedback = "CV 시간은 CV가 시작되는 전류와 SOC에 따라 다르다. 전류가 클수록 더 이른 SOC, 더 큰 전류에서 CV가 시작되어 CV 구간이 길어진다."

[[questions.choices]]
text = "C-rate가 클수록 쿨롱 효율이 크게 떨어지기 때문이다."
feedback = "이 모델은 쿨롱 효율을 100%로 둔다. 그래도 같은 현상이 나타나므로 원인은 효율이 아니라 과전압과 전압 상한이다."

[[questions]]
id = "pareto-reporting"
type = "multiple"
objective = 2
prompt = '''2단계 충전 프로토콜 961개를 시뮬레이터로 평가해 충전 시간과 열화 지표를 얻었다. 결과 보고로 적절한 것을 모두 고르시오.'''
explanation = '''두 목적이 충돌하므로 답은 점 하나가 아니라 Pareto front다. 제약을 어긴 후보는 front에서 빼고, 남은 점마다 제약 여유를 함께 보여야 실제 셀에서 얼마나 안전한지 판단할 수 있다. 가중합 하나로 고른 점만 보고하면 가중치가 답을 정했다는 사실이 숨는다. 제약을 어긴 빠른 프로토콜을 front에 넣으면 실현할 수 없는 trade-off를 보여 주게 된다.'''

[[questions.choices]]
text = "전압·온도 제약을 만족하는 후보만으로 그린 Pareto front"
correct = true

[[questions.choices]]
text = "front 위 각 프로토콜의 최고 전압·최고 온도와 한계까지의 여유"
correct = true

[[questions.choices]]
text = "시간과 열화의 가중합을 최소화한 프로토콜 하나와 그 가중합 값"
feedback = "가중합의 최솟값은 front 위의 한 점일 뿐이고, 가중치를 바꾸면 다른 점이 나온다. front가 볼록하지 않으면 가중합으로 찾을 수 없는 점도 있다(10.7장)."

[[questions.choices]]
text = "제약을 어긴 후보까지 포함한 front(더 빠른 충전이 가능함을 보이기 위해)"
feedback = "제약을 어긴 프로토콜은 실현할 수 없으므로 trade-off의 일부가 아니다. 그런 점이 front에 들어가면 실현 가능한 프로토콜이 부당하게 지배당해 front에서 빠질 수도 있다."

[[questions]]
id = "feasibility-acquisition"
type = "single"
objective = 2
prompt = '''제약 BO에서 획득함수로 EI에 제약 GP의 실현 가능 확률 $P(g \le 0)$을 곱한다. 대신 제약을 어긴 평가점의 목적값을 아주 큰 값(예: 1e6)으로 바꿔 넣고 보통의 BO를 돌리면 어떤 문제가 생기는가?'''
explanation = '''GP는 매끄러운 함수를 가정한다. 실현 가능한 영역과 불가능한 영역의 경계에서 목적값이 3에서 1e6으로 뛰면 GP가 이 불연속을 맞추느라 전체 예측이 왜곡되고, 실현 가능한 영역 안의 작은 차이(열화 지표 2.9 vs 3.1)를 구별하지 못하게 된다. 그런데 제약 최적화의 해는 대개 경계 위에 있다. 제약을 따로 GP로 모델링하면 목적 GP는 매끄럽게 유지되고, 경계 근처에서 "실현 가능할 확률"을 명시적으로 따질 수 있다.'''

[[questions.choices]]
text = "경계에서 목적값이 크게 뛰어 GP가 왜곡되고, 해가 있는 제약 경계 근처를 잘 모델링하지 못한다."
correct = true

[[questions.choices]]
text = "문제가 없다. 큰 값을 넣으면 BO가 그 영역을 피하므로 같은 결과를 더 간단히 얻는다."
feedback = "피하기는 하지만, 큰 값이 GP의 평균과 길이 척도 추정을 망쳐 실현 가능한 영역 안의 예측까지 나빠진다. 최적해가 경계 위에 있는 경우가 많아 그 근처의 정확도가 가장 중요하다."

[[questions.choices]]
text = "EI가 음수가 되어 계산이 불가능해진다."
feedback = "EI는 정의상 0 이상이다. 문제는 계산 가능성이 아니라 대리모델의 품질이다."

[[questions]]
id = "early-prediction-selection-bias"
type = "single"
objective = 3
prompt = '''초기 100사이클로 수명을 예측하는 모델을 BO의 관측으로 써서 급속 충전 프로토콜을 탐색했다. 탐색이 끝났을 때 "가장 좋은 관측값"을 낸 프로토콜에 대해 가장 옳은 설명은?'''
explanation = '''조기 예측에는 오차가 있고, BO는 관측값이 좋은 후보를 고른다. 그래서 관측값이 가장 좋은 후보는 실제로 좋은 프로토콜이면서 동시에 예측 오차가 유리한 쪽으로 난 후보일 가능성이 크다(선택에 의한 편향, 승자의 저주). 특히 BO가 조기 예측 모델이 학습하지 않은 영역으로 가면 오차가 체계적일 수 있다. 추천은 대리모델의 예측 평균으로 하고, 최종 후보는 수명을 끝까지 측정해 확인한다.'''

[[questions.choices]]
text = "예측 오차가 유리하게 난 후보가 뽑히기 쉬우므로, 실제 수명은 관측값보다 짧을 가능성이 크다. 끝까지 측정해 확인한다."
correct = true

[[questions.choices]]
text = "조기 예측 모델의 시험 오차가 9%이므로, 그 프로토콜의 실제 수명은 관측값의 ±9% 안에 있다."
feedback = "시험 오차는 무작위로 고른 셀에 대한 평균적인 오차다. 관측값이 가장 좋은 것을 골랐다는 선택 과정 때문에, 뽑힌 후보의 오차는 평균보다 유리한 쪽으로 치우친다."

[[questions.choices]]
text = "BO는 탐색과 활용을 균형 있게 하므로 선택 편향이 생기지 않는다."
feedback = "획득함수의 균형은 다음에 어디를 평가할지에 대한 것이다. 최종 추천을 관측값의 최댓값으로 하면 잡음에 의한 선택 편향은 그대로 남는다."

[[questions]]
id = "sim-to-real-margin"
type = "multiple"
objective = 3
prompt = '''공칭 셀 시뮬레이터에서 찾은 최적 충전 프로토콜(최고 4.176 V, 40.3 °C)을 파라미터가 다른 셀들에 적용했더니 절반 넘게 4.2 V 또는 45 °C를 넘었다. 이 프로토콜을 실제 셀에 쓰기 전에 필요한 것을 모두 고르시오.'''
explanation = '''제약 최적화의 해는 제약 경계에 붙어 있어 파라미터 차이에 가장 민감하다. 셀 편차·노화·주변 온도의 범위를 정해 그 범위 전체(또는 최악 조건)에서 제약을 확인하고, 여유는 그 범위에서 계산한다. 마지막으로 같은 배치의 셀 여러 개로 실제 시험해 시뮬레이터 예측과 비교한다. BO의 평가 횟수를 늘리는 것은 시뮬레이터 안의 최적을 더 정확히 찾을 뿐, 시뮬레이터와 실제의 차이는 줄이지 않는다.'''

[[questions.choices]]
text = "저항·열전달·주변 온도의 범위를 정하고, 그 범위의 최악 조건에서도 제약을 만족하는지 확인한다."
correct = true

[[questions.choices]]
text = "같은 배치의 셀 여러 개로 실제 시험해, 측정한 최고 전압·온도를 시뮬레이터 예측과 비교한다."
correct = true

[[questions.choices]]
text = "BO의 평가 횟수를 늘려 시뮬레이터 안의 최적해를 더 정확히 찾는다."
feedback = "실습에서 BO는 이미 90%의 시드에서 최적의 5% 이내를 찾았다. 문제는 최적화의 정확도가 아니라 시뮬레이터와 실제 셀의 차이다."

[[questions.choices]]
text = "온도 한계에 일괄적으로 5 °C 여유를 둔다."
feedback = "실습에서 5 °C 여유는 주변 온도 범위(최대 +10 °C)보다 작아 위반 비율을 줄이지 못했다. 여유는 감이 아니라 파라미터 범위에서 계산한다."
