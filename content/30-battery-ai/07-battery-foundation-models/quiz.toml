# 30.7 배터리 Foundation Model — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "cycle-split-leak"
type = "single"
objective = 1
prompt = '''셀 100개의 초기 사이클 특징으로 셀의 사이클 수명을 예측한다. 사이클(행)을 무작위로 나눴을 때 시험 오차가 3.3%, 셀 단위로 나눴을 때 27.9%였다. 차이의 원인으로 가장 옳은 것은?'''
explanation = '''행 단위로 나누면 같은 셀의 다른 사이클이 학습 데이터에 남는다. 같은 셀의 사이클들은 특징이 거의 같고 레이블(셀의 수명)은 정확히 같으므로, 모델은 시험 행과 같은 셀을 찾아 그 레이블을 읽기만 하면 된다. 수명과 무관한 셀 고유의 값이 이 지름길을 돕는다. 3.3%는 처음 보는 셀에 대한 성능이 아니다. 실제 사용 상황(새 셀의 수명 예측)을 재는 것은 셀 단위 분할이다.'''

[[questions.choices]]
text = "행 단위 분할에서는 시험 셀의 다른 사이클이 학습에 들어가, 모델이 셀을 알아보는 것만으로 레이블을 맞힐 수 있기 때문이다."
correct = true

[[questions.choices]]
text = "셀 단위 분할에서는 학습 행의 수가 줄어 모델이 과소적합되었기 때문이다."
feedback = "두 분할 모두 학습 데이터의 약 80%를 쓴다. 차이는 데이터 양이 아니라 시험 셀의 정보가 학습에 들어갔는지에서 온다."

[[questions.choices]]
text = "셀 단위 분할이 우연히 어려운 셀을 시험으로 골랐기 때문이다. 분할을 여러 번 하면 두 값이 비슷해진다."
feedback = "분할을 반복해도 행 단위 분할은 체계적으로 낮게 나온다. 같은 셀의 정보가 학습에 들어가는 구조 자체가 원인이기 때문이다."

[[questions.choices]]
text = "k-NN 같은 단순한 모델의 문제다. 신경망을 쓰면 행 단위 분할도 공정한 평가가 된다."
feedback = "유연한 모델일수록 셀 고유의 지문을 더 잘 외운다. 누수는 모델이 아니라 분할의 문제다."

[[questions]]
id = "sign-convention-merge"
type = "single"
objective = 1
prompt = '''데이터셋 A는 충전 전류를 양수로, 데이터셋 B는 방전 전류를 양수로 기록한다. 부호를 맞추지 않고 두 데이터셋을 합쳐 사전학습하면 가장 먼저 생길 문제는?'''
explanation = '''같은 물리적 상황(충전)이 데이터셋에 따라 반대 부호로 들어가므로, 모델은 "전류 부호와 전압 변화의 관계"를 데이터셋마다 다르게 배워야 하고, 결국 데이터셋 출처를 구별하는 단서로 쓴다. 이렇게 배운 표현은 처음 보는 데이터셋으로 전이되지 않는다. 전류를 적분한 값이 용량 변화와 같은 부호인지로 통합 후에 확인한다.'''

[[questions.choices]]
text = "모델이 충전과 방전을 데이터셋 출처로 구별하는 법을 배워, 표현이 출처에 묶이고 새 데이터셋으로 전이되지 않는다."
correct = true

[[questions.choices]]
text = "정규화(평균 빼기)를 하면 부호 차이가 사라지므로 문제가 없다."
feedback = "평균을 빼도 충전 구간과 방전 구간의 부호 관계는 그대로 뒤집혀 있다. 정규화는 척도를 맞출 뿐 부호 규약을 맞추지 않는다."

[[questions.choices]]
text = "모델이 충분히 크면 부호 규약을 스스로 알아내므로 신경 쓸 필요가 없다."
feedback = "모델은 부호 규약을 '알아내는' 대신 데이터셋 출처를 단서로 쓰는 법을 배운다. 그 단서는 새 데이터셋에서 쓸모가 없다."

[[questions]]
id = "missing-modality"
type = "single"
objective = 1
prompt = '''데이터셋 세 개 중 하나에는 셀 온도 기록이 없다. 통합할 때 가장 적절한 처리는?'''
explanation = '''결측을 0으로 채우면 "0 °C"라는 실제 값과 구별되지 않고, 모델은 그 값을 데이터셋 출처의 표지로 쓸 수 있다. 결측 마스크를 함께 넣으면 모델이 "측정되지 않음"을 명시적으로 알고, 사전학습 과제에서도 측정된 값만 손실에 넣을 수 있다. 다른 데이터셋의 평균으로 채우면 출처 표지는 약해지지만 그 데이터셋의 실제 온도 조건(예: 저온 시험)을 숨긴다.'''

[[questions.choices]]
text = "온도 채널을 결측 마스크와 함께 입력해, 측정된 값과 측정되지 않은 것을 구별하게 한다."
correct = true

[[questions.choices]]
text = "결측을 0으로 채운다. 정규화하면 0은 평균 근처이므로 영향이 작다."
feedback = "섭씨 0은 실제로 가능한 온도이고, 정규화 후의 0도 실제 값과 구별되지 않는다. 모델은 이 값을 '이 데이터셋에서 왔다'는 표지로 쓸 수 있다."

[[questions.choices]]
text = "다른 두 데이터셋의 평균 온도로 채운다."
feedback = "출처 표지는 약해지지만, 그 데이터셋이 실제로 다른 온도에서 시험되었다면 그 차이를 숨기고 잘못된 값을 입력한다."

[[questions]]
id = "negative-transfer-chemistry"
type = "single"
objective = 2
prompt = '''데이터셋 A·B로 사전학습한 모델을 다른 화학의 데이터셋 D에 레이블 셀 6개로 미세조정했다. 레이블 셀을 100번 다시 뽑았더니 처음부터 학습한 것보다 나은 경우가 16%였고, 이득의 5–95% 범위가 [−0.334, +0.134]였다. 옳은 결론은?'''
explanation = '''100개 분할 중 84%에서 미세조정이 처음부터 학습한 것보다 나빴고, RMSE 중앙값도 더 크다. 사전학습한 관계가 D에서는 틀린 출발점이 된 부정적 전이다. 이득 범위의 위쪽이 양수인 것은 일부 분할에서 우연히 이겼다는 뜻일 뿐이다. 그런 분할 하나만 보고하면 정반대의 결론이 나온다.'''

[[questions.choices]]
text = "D에서는 부정적 전이가 일어났다. 일부 분할에서 이긴 것은 레이블 셀 선택의 우연이다."
correct = true

[[questions.choices]]
text = "이득 범위에 양수가 포함되므로 전이가 도움이 된다고 볼 수 있다."
feedback = "범위의 일부가 양수라는 것은 '어떤 분할에서는 이긴다'는 뜻이다. 분할 대부분(84%)에서 졌고 중앙값도 나쁘다."

[[questions.choices]]
text = "사전학습 가중치 쪽으로 더 강하게 정규화하면 미세조정이 처음부터 학습한 것보다 나아진다."
feedback = "정규화를 강하게 할수록 미세조정은 사전학습 모델 그대로(zero-shot)에 가까워진다. D에서 zero-shot은 세 방법 중 가장 나빴다(RMSE 중앙값 0.870). 출발점 자체가 틀린 것이 원인이다."

[[questions]]
id = "controlled-transfer-baseline"
type = "multiple"
objective = 2
prompt = '''"사전학습 덕분에 새 화학의 셀 10개만으로 수명을 예측할 수 있다"는 주장을 검증하려 한다. 반드시 필요한 비교를 모두 고르시오.'''
explanation = '''전이 효과는 같은 레이블 셀 10개로 처음부터 학습한 기준선과의 차이다. 레이블 셀 선택에 따라 결과가 크게 달라지므로 여러 번 다시 뽑아 분포로 보고한다. 새 화학의 셀이 사전학습 데이터에 섞여 있지 않은지(중복 검사)도 확인해야 한다. 사전학습 데이터 안의 시험 셀 성능은 처음 보는 화학에 대한 주장의 근거가 아니다.'''

[[questions.choices]]
text = "같은 레이블 셀 10개로 처음부터 학습한 같은 구조의 모델과 단순한 기준선"
correct = true

[[questions.choices]]
text = "레이블 셀 10개를 여러 번 다시 뽑아 얻은 성능의 분포"
correct = true

[[questions.choices]]
text = "새 화학 데이터셋과 사전학습 데이터 사이의 중복 검사"
correct = true

[[questions.choices]]
text = "사전학습에 쓴 데이터셋 안에서 셀 단위로 나눈 시험 셀의 성능"
feedback = "이것은 사전학습 분포 안의 일반화를 잴 뿐이다. 주장은 새 화학에 대한 것이므로 사전학습에 쓰지 않은 데이터에서 재야 한다."

[[questions]]
id = "claim-checklist"
type = "multiple"
objective = 3
prompt = '''배터리 foundation model 논문이 다음과 같이 보고했다. 주장의 신뢰를 실제로 떨어뜨리는 것을 모두 고르시오.'''
explanation = '''사이클 단위 무작위 분할은 같은 셀이 학습과 시험에 함께 들어가는 누수다. 처음부터 학습한 기준선이 없으면 전이 효과를 알 수 없다. 사이클 수는 독립적인 정보의 크기를 과장한다(같은 셀의 사이클은 서로 거의 같다). 반면 전이가 실패한 조건을 함께 보고한 것은 신뢰를 높이는 정보다.'''

[[questions.choices]]
text = "시험 데이터를 사이클 단위로 무작위 분할했다."
correct = true

[[questions.choices]]
text = "미세조정 결과만 있고, 같은 레이블 수로 처음부터 학습한 기준선이 없다."
correct = true

[[questions.choices]]
text = "사전학습 데이터의 크기를 사이클 수(수백만)로만 밝히고 셀·화학의 수는 밝히지 않았다."
correct = true

[[questions.choices]]
text = "사전학습에 쓰지 않은 데이터셋 하나에서 전이가 실패한 결과도 함께 보고했다."
feedback = "실패 조건을 보고하는 것은 전이의 범위를 정직하게 보이는 것으로, 신뢰를 높인다. 체크리스트 6번 항목이다."
