# 30.1 ML 연구자를 위한 배터리 기초 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "c-rate-discharge-time"
type = "numeric"
objective = 1
prompt = '''공칭 용량 2.5 Ah인 셀을 5 A로 정전류 방전한다. 이 전류는 몇 C이고, 컷오프에 걸리지 않고 공칭 용량을 모두 내보낸다고 할 때 방전 시간은 몇 **분**인가? 방전 시간(분)을 답한다.'''
answer = 30
tolerance = 0
slider = { min = 0, max = 120, step = 5, unit = "분" }
explanation = '''C-rate는 전류를 공칭 용량으로 나눈 값이다: $5\ \mathrm{A} / 2.5\ \mathrm{Ah} = 2\ \mathrm{h}^{-1}$, 즉 2C다. 공칭 용량을 다 내보내는 데 걸리는 이상적인 시간은 $1/2$ 시간 = 30분이다. 실제 셀은 내부저항 때문에 높은 C-rate에서 컷오프 전압에 더 일찍 닿으므로 30분보다 짧게 끝나고, 내보낸 용량도 2.5 Ah보다 작다.'''

[[questions]]
id = "energy-depends-on-rate"
type = "single"
objective = 1
prompt = '''공칭 3.0 Ah, 공칭 전압 3.6 V인 셀을 0.2C와 2C로 각각 같은 컷오프 전압까지 방전했다. 2C에서 측정한 방전 에너지가 0.2C보다 크게 작은 이유로 가장 알맞은 것은?'''
explanation = '''방전 에너지는 $\int V I\,dt$다. 높은 전류에서는 내부저항에 의한 전압 강하 $IR$이 커져 (1) 같은 전하량을 내보내는 동안의 평균 단자 전압이 낮고, (2) 컷오프 전압에 더 일찍 닿아 내보낸 전하량 자체도 줄어든다. 공칭 에너지 10.8 Wh(= Ah × 공칭 V)는 정해진 시험 조건에서의 대표값이지 모든 조건에서의 보장값이 아니다.'''

[[questions.choices]]
text = "내부저항에 의한 전압 강하 때문에 평균 전압이 낮아지고, 컷오프에 일찍 닿아 내보낸 전하량도 줄기 때문이다."
correct = true

[[questions.choices]]
text = "에너지는 Ah × 공칭 전압으로 정해지므로 측정 오류다."
feedback = "공칭 에너지는 특정 시험 조건의 대표값이다. 실제 에너지는 ∫V I dt이고, V는 전류에 따라 달라진다."

[[questions.choices]]
text = "2C에서는 셀이 그 시험 한 번으로 크게 열화되어 용량을 잃었기 때문이다."
feedback = "한 번의 고율 방전으로 생기는 영구 열화는 대개 매우 작다. 같은 셀을 다시 0.2C로 방전하면 용량 대부분이 돌아온다. 차이의 대부분은 가역적인 전압 손실이다."

[[questions.choices]]
text = "C-rate가 높으면 쿨롱 효율이 1을 넘기 때문이다."
feedback = "쿨롱 효율은 (방전 전하량)/(충전 전하량)으로 1을 넘지 않는다. 그리고 이 차이는 전압 손실의 문제다."

[[questions]]
id = "soh-definition-mismatch"
type = "single"
objective = 1
prompt = '''같은 셀의 같은 RPT 용량 2.58 Ah를 두고, 한 데이터셋은 SOH 86.0%, 다른 데이터셋은 83.8%로 기록했다. 어떻게 해석해야 하는가?'''
explanation = '''SOH는 "현재 용량 / 기준 용량"이고 기준 용량은 공칭 용량(3.0 Ah)일 수도, 그 셀의 첫 측정 용량(3.08 Ah)일 수도 있다. $2.58/3.0 = 86.0\%$, $2.58/3.08 = 83.8\%$다. 두 값은 모두 맞고 정의만 다르다. 여러 데이터셋을 합칠 때 정의를 하나로 통일하지 않으면 같은 셀이 서로 다른 열화 상태로 보이고, EOL(예: SOH 80%)에 닿는 사이클도 달라진다.'''

[[questions.choices]]
text = "기준 용량의 정의(공칭 용량 대 첫 측정 용량)가 다르다. 둘 중 하나로 통일한 뒤 비교한다."
correct = true

[[questions.choices]]
text = "둘 중 하나는 측정 오류이므로 더 보수적인 83.8%를 쓴다."
feedback = "같은 용량에서 계산한 두 값이다. 측정 오류가 아니라 정의 차이이고, 정의를 통일하지 않은 채 보수적인 값을 고르면 비교가 더 꼬인다."

[[questions.choices]]
text = "SOH는 무차원이므로 데이터셋이 달라도 그대로 평균 내면 된다."
feedback = "무차원이라도 분모가 다르면 다른 양이다. 평균 내기 전에 기준을 맞춰야 한다."

[[questions]]
id = "efc-partial-cycles"
type = "numeric"
objective = 1
prompt = '''공칭 용량 3 Ah인 셀을 SOC 20%와 70% 사이에서 300번 왕복시켰다(충전·방전 각 300번). 등가 완전 사이클(EFC)은 몇인가?'''
answer = 150
tolerance = 0
slider = { min = 0, max = 600, step = 10 }
explanation = '''한 번 왕복할 때 방전 방향으로 $0.5 \times 3 = 1.5$ Ah를 내보낸다. 300번이면 450 Ah, 공칭 용량으로 나누면 $450/3 = 150$ EFC다. 열화를 비교할 때 "사이클 수"를 그대로 쓰면 부분 사이클로 운전한 셀이 같은 사이클 수에서 훨씬 덜 쓰인 셀이라는 사실을 놓친다.'''

[[questions]]
id = "sign-convention-check"
type = "single"
objective = 2
prompt = '''처음 받은 사이클 데이터에서, 전류가 +3 A로 일정한 구간 동안 단자 전압이 꾸준히 **올라간다**. 이 데이터의 전류 부호 규약은 무엇일 가능성이 가장 큰가?'''
explanation = '''충전하면 SOC가 올라 OCV가 오르고, 충전 전류의 과전압도 단자 전압을 OCV보다 높인다. 따라서 일정한 양의 전류에서 전압이 오르면 이 데이터는 **충전을 양수**로 기록한 것이다. 사이클러·데이터셋마다 규약이 다르므로, 문서를 읽은 뒤에도 전류와 $dV/dt$의 부호로 한 번 더 확인한다.'''

[[questions.choices]]
text = "충전 전류가 양수다."
correct = true

[[questions.choices]]
text = "방전 전류가 양수다."
feedback = "방전하면 SOC가 줄어 OCV가 내려가므로, 정전류 방전 중 전압은 내려간다."

[[questions.choices]]
text = "전압 변화로는 판단할 수 없고 문서로만 알 수 있다."
feedback = "문서가 우선이지만 문서가 틀리거나 없을 때가 있다. 정전류 구간의 전압 변화 방향은 부호를 확인하는 강력한 단서다."

[[questions]]
id = "knee-linear-extrapolation"
type = "single"
objective = 3
prompt = '''처음 400 사이클 동안 용량이 거의 직선으로 천천히 줄었다. 이 직선을 연장해 EOL(공칭 용량의 80%)을 3,400 사이클로 예측했는데, 실제로는 약 1,270 사이클에서 EOL에 닿았다. 가장 그럴듯한 설명은?'''
explanation = '''초기의 완만한 용량 감소는 주로 SEI 성장에 의한 리튬 손실처럼 느리게 진행되는 기작이 만든다. 어느 시점부터 리튬 석출이나 활물질 손실처럼 스스로 가속되는 기작이 지배하면 감소율이 급격히 커지는 **knee**가 나타난다. knee 이전 구간의 기울기에는 knee가 언제 올지에 대한 정보가 거의 없으므로, 초기 직선의 외삽은 수명을 크게 과대평가한다.'''

[[questions.choices]]
text = "열화가 가속되는 knee가 나타나 감소율이 커졌다. 초기 구간의 직선 외삽은 knee를 예측하지 못한다."
correct = true

[[questions.choices]]
text = "측정 잡음 때문에 직선의 기울기를 잘못 추정했다. 사이클을 더 촘촘히 측정하면 직선 외삽이 맞는다."
feedback = "잡음이 없어도 같은 일이 생긴다. 문제는 추정 정밀도가 아니라 열화 기작이 바뀌어 곡선의 모양이 달라진다는 점이다."

[[questions.choices]]
text = "선형 대신 2차 다항식으로 외삽하면 knee 시점도 정확히 맞힐 수 있다."
feedback = "knee 이전 구간은 거의 직선이라 2차항이 잘 정해지지 않는다. 초기 구간의 곡선 맞춤만으로는 knee 시점을 알기 어렵고, 이것이 조기 수명 예측이 별도의 연구 문제인 이유다(30.4장)."
