# 4.3 AI 코딩 도구의 활용과 검증 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "agent-vs-chat"
type = "single"
objective = 1
prompt = "대화형 assistant와 비교해 코딩 에이전트(터미널·클라우드에서 동작하는 도구)를 쓸 때 **새로 생기는** 검증 과제로 가장 적절한 것은?"
explanation = '''대화형 assistant는 텍스트를 돌려주고, 그것을 실행할지는 사람이 정한다. 에이전트는 파일을 고치고 명령을 실행하고 그 결과를 보고 다시 행동하는 반복을 스스로 한다. 그래서 "무슨 코드를 제안했는가"뿐 아니라 "무엇을 실행했고 무엇을 바꿨는가"를 확인해야 하고, 어떤 행동을 허용할지(권한)를 정해야 한다. 같은 언어 모델이 세 형태 모두에 쓰일 수 있으므로 형태가 정확도를 보장하지 않는다.'''

[[questions.choices]]
text = "에이전트가 실행한 명령과 바꾼 파일 전체를 확인하고, 어떤 행동을 허용할지 권한을 정하는 일"
correct = true

[[questions.choices]]
text = "에이전트는 코드를 직접 실행해 보므로 결과 코드의 정확성은 따로 검증하지 않아도 된다."
feedback = "실행이 성공했다는 것은 오류가 나지 않았다는 뜻일 뿐이다. 이 장의 broadcasting·데이터 누수 예처럼 틀린 코드도 잘 실행된다."

[[questions.choices]]
text = "에이전트는 더 큰 모델을 쓰므로 존재하지 않는 API를 만들어 내지 않는다."
feedback = "도구의 형태와 모델의 정확도는 별개다. 에이전트도 없는 함수나 옵션을 쓸 수 있고, 실행해서 실패하면 다른 방법으로 '우회'하기도 한다."

[[questions.choices]]
text = "IDE 자동완성은 짧은 코드만 제안하므로 검증할 필요가 없다."
feedback = "한 줄짜리 제안도 축 순서, 부호, 단위를 틀릴 수 있다. 짧다는 것은 검증하기 쉽다는 뜻이지 검증이 필요 없다는 뜻이 아니다."

[[questions]]
id = "broadcast-elements"
type = "numeric"
objective = 2
prompt = '''AI가 작성한 손실 함수가 `((pred - y) ** 2).mean()`이다. 모델 출력 `pred`의 shape이 `(100, 1)`, 정답 `y`의 shape이 `(100,)`일 때, `pred - y`에는 원소가 몇 개 있는가?'''
answer = 10000
tolerance = 0
explanation = '''NumPy와 PyTorch의 broadcasting은 뒤쪽 축부터 맞춘다. `(100, 1)`과 `(100,)`은 `(100, 1)`과 `(1, 100)`으로 보고 각 축을 늘려 `(100, 100)`, 즉 10000개 원소가 된다. 오류 없이 실행되고 손실 값도 그럴듯하게 나오지만, 모든 예측을 모든 정답과 비교한 평균이므로 MSE가 아니다. `pred.shape == y.shape`을 assert하거나 shape 주석을 달아 막는다.'''

[[questions]]
id = "gradient-check"
type = "single"
objective = 2
prompt = "AI가 새 손실 함수의 gradient를 손으로 유도해 코드로 작성했다. 이 gradient가 맞는지 확인하는 방법으로 가장 적절한 것은?"
explanation = '''유한차분 $(L(\mathbf{w} + h\mathbf{e}_i) - L(\mathbf{w} - h\mathbf{e}_i)) / 2h$는 gradient 정의에서 바로 나오는 독립적인 계산이다. 무작위 $\mathbf{w}$ 몇 개에서 해석적 gradient와의 상대 오차가 충분히 작은지(배정밀도에서 대략 $10^{-6}$ 이하) 본다. 손실이 줄어드는 것은 gradient가 대략 하강 방향이라는 뜻일 뿐이다. 이 장의 예처럼 L2 항의 부호가 틀려도 손실은 줄 수 있다.'''

[[questions.choices]]
text = "무작위 파라미터 몇 개에서 중앙 차분으로 구한 수치 gradient와 비교해 상대 오차를 본다."
correct = true

[[questions.choices]]
text = "학습을 돌려 손실이 줄어들면 gradient가 맞은 것이다."
feedback = "부호나 계수가 일부 틀린 gradient도 하강 방향이기만 하면 손실을 줄인다. 틀린 정도에 따라 다른 해로 수렴할 뿐이다."

[[questions.choices]]
text = "gradient의 shape이 파라미터의 shape과 같은지 확인한다."
feedback = "필요한 검사지만 충분하지 않다. 부호가 반대인 gradient도 shape은 같다."

[[questions.choices]]
text = "같은 질문을 다른 AI 도구에 물어 답이 같은지 확인한다."
feedback = "두 도구가 같은 오류를 낼 수 있고, 어느 쪽도 계산으로 확인한 것이 아니다. 독립적인 계산(유한차분, 자동미분)과 비교한다."

[[questions]]
id = "selection-leakage"
type = "single"
objective = 2
prompt = '''잡음 특징 5000개와 무작위 라벨(N = 100)로 만든 데이터에서, AI가 짠 코드가 **전체 데이터로** 라벨과 가장 관련 있는 특징 20개를 고른 뒤 5-fold 교차검증을 했더니 정확도가 0.81이었다. 이 결과의 해석으로 옳은 것은?'''
explanation = '''라벨은 입력과 무관하므로 어떤 방법도 처음 보는 데이터에서 0.5보다 의미 있게 나을 수 없다. 특징을 고르는 단계에서 이미 각 fold의 test 라벨을 보았기 때문에, 고른 특징이 그 표본의 우연한 상관을 담고 있다. 특징 선택을 교차검증의 각 fold 안(학습 부분)에서만 하면 정확도는 0.5 근처로 돌아온다(본문 예에서는 0.52). 전처리·특징 선택·하이퍼파라미터 선택은 모두 "모델의 일부"로 보고 fold 안에서 해야 한다.'''

[[questions.choices]]
text = "특징 선택이 test fold의 라벨을 보았기 때문에 생긴 누수다. 선택을 fold 안에서 해야 한다."
correct = true

[[questions.choices]]
text = "잡음 특징에도 약한 신호가 숨어 있었고, 교차검증이 그것을 찾아냈다."
feedback = "라벨을 입력과 독립적으로 만들었으므로 찾을 신호가 없다. 0.81은 선택 과정이 test 라벨을 본 결과다."

[[questions.choices]]
text = "표본이 작아서 생긴 우연이므로 seed를 바꿔 몇 번 더 돌리면 0.5로 돌아온다."
feedback = "누수는 seed와 무관하게 체계적으로 정확도를 부풀린다. seed를 바꿔도 대부분 0.5보다 크게 나온다."

[[questions.choices]]
text = "logistic regression이 과적합했으므로 더 단순한 모델을 쓰면 해결된다."
feedback = "과적합은 학습 데이터 성능과 test 성능의 차이로 드러난다. 여기서는 test 성능 자체가 부풀었다. 원인은 모델이 아니라 평가 절차다."

[[questions]]
id = "ai-citation"
type = "multiple"
objective = 2
prompt = '''AI 도구가 "이 전처리가 표준이다(Kim et al., 2021, *Nature*)"라는 문장을 초고에 넣었다. 이 인용을 논문에 남기기 전에 해야 할 일을 모두 고르시오.'''
explanation = '''AI 도구는 존재하지 않는 논문, 실제 저자와 엉뚱한 제목의 조합, 실제 논문이지만 그런 말을 하지 않은 인용을 만들 수 있다. 그래서 (1) 학술 데이터베이스나 DOI로 원문이 존재하는지 찾고, (2) 원문을 열어 해당 주장을 실제로 하는지 읽어야 한다. 같은 도구에 "진짜냐"고 묻는 것은 독립적인 확인이 아니다. 저자가 실존 인물이라는 사실은 그 논문이 존재한다는 증거가 아니다.'''

[[questions.choices]]
text = "DOI나 학술 데이터베이스에서 원문이 실제로 존재하는지 찾는다."
correct = true

[[questions.choices]]
text = "원문을 열어 그 논문이 해당 주장을 실제로 하는지 읽는다."
correct = true

[[questions.choices]]
text = "같은 AI 도구에 그 논문이 실제로 있는지 물어 확인받는다."
feedback = "도구는 자신이 만든 인용을 다시 그럴듯하게 설명할 수 있다. 확인은 도구 밖의 원천(데이터베이스, 원문)으로 한다."

[[questions.choices]]
text = "저자 이름이 그 분야의 실제 연구자이면 인용이 맞다고 본다."
feedback = "실존 저자의 이름에 존재하지 않는 제목이나 엉뚱한 학술지를 붙인 인용이 흔한 형태다."

[[questions]]
id = "task-sizing"
type = "single"
objective = 3
prompt = "검증 비용을 고려할 때, AI 코딩 도구에 맡기기에 가장 좋은 요청은?"
explanation = '''좋은 요청은 범위가 작고, 맥락(어느 파일, 무엇을 유지해야 하는지)이 있고, 완료 조건이 검증 가능하다. 그러면 결과를 리뷰하는 비용이 작고, 완료 조건(기존 테스트 통과, 출력이 이전과 같음)을 사람이 바로 확인할 수 있다. 범위가 넓은 요청은 리뷰할 diff가 커지고, "더 좋게" 같은 조건은 검증할 수 없으며, 실험 조건을 함께 바꾸게 두면 결과가 바뀐 이유를 알 수 없다.'''

[[questions.choices]]
text = "`data/loader.py`의 HDF5 읽기를 chunk 단위로 바꿔 줘. `tests/test_loader.py`가 통과하고, 출력 배열이 기존 구현과 `np.array_equal`로 같아야 한다."
correct = true

[[questions.choices]]
text = "학습 코드 전체를 더 빠르고 깔끔하게 리팩터링해 줘."
feedback = "범위가 넓고 완료 조건이 없다. 수백 줄의 diff를 받으면 동작이 바뀌지 않았는지 확인하는 비용이 직접 고치는 비용보다 클 수 있다."

[[questions.choices]]
text = "성능이 더 잘 나오도록 모델과 전처리를 알아서 개선하고 결과를 알려 줘."
feedback = "실험 조건을 도구가 바꾸게 두면 어떤 변경이 결과를 바꿨는지 알 수 없고, test set을 보며 조정했을 위험도 있다."

[[questions.choices]]
text = "논문의 방법 절을 붙여 넣을 테니 전체 실험 파이프라인을 처음부터 만들어 줘."
feedback = "초안 작성에는 쓸 수 있지만, 한 번에 받은 큰 파이프라인은 수식↔코드 대응, 데이터 분할, metric을 하나하나 검증해야 한다. 작은 단위로 나눠 요청하고 단위마다 확인하는 편이 총비용이 작다."
