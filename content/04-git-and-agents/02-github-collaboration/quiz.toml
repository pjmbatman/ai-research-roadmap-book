# 4.2 GitHub 협업과 저장소 관리 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "fetch-vs-pull"
type = "single"
objective = 1
prompt = '''동료가 원격 main에 commit을 push했다. 내 저장소의 main에서 `git fetch origin`만 실행했을 때 일어나는 일은?'''
explanation = '''fetch는 원격의 새 객체를 내려받고 원격 추적 branch(`origin/main`)만 갱신한다. 로컬 branch(`main`)와 working tree는 건드리지 않는다. 그래서 fetch는 언제 해도 안전하고, `git log main..origin/main`으로 무엇이 새로 왔는지 본 뒤 합칠지 정할 수 있다. 합치는 단계까지 한 번에 하는 것이 `git pull`(fetch + merge 또는 rebase)이다.'''

[[questions.choices]]
text = "`origin/main`만 원격의 최신 commit으로 갱신되고, 로컬 `main`과 작업 파일은 그대로다."
correct = true

[[questions.choices]]
text = "로컬 `main`에 동료의 commit이 merge되고 작업 파일도 바뀐다."
feedback = "그것은 git pull이 하는 일이다. fetch는 합치는 단계를 하지 않는다."

[[questions.choices]]
text = "아무것도 내려받지 않고, 원격에 새 commit이 있는지 개수만 알려 준다."
feedback = "fetch는 실제로 객체를 내려받는다. 그래서 fetch 뒤에는 네트워크 없이도 origin/main의 내용을 diff·log로 볼 수 있다."

[[questions.choices]]
text = "로컬 `main`이 원격과 같아지도록 내 미push commit이 지워진다."
feedback = "fetch는 로컬 branch를 옮기지 않는다. 로컬 commit을 지우는 것은 reset 같은 명령을 직접 실행했을 때뿐이다."

[[questions]]
id = "push-rejected"
type = "single"
objective = 1
prompt = '''공유 branch에 push했더니 `! [rejected] main -> main (fetch first)`라는 오류가 났다. 올바른 대응은?'''
explanation = '''원격에 내가 가지지 않은 commit이 있다는 뜻이다. fetch로 받아 와서 내 commit과 합치고(아직 push하지 않은 내 commit이면 rebase, 아니면 merge), 합친 결과를 테스트한 뒤 다시 push한다. force push는 원격에 있는 동료의 commit을 지운다. 새로 clone하면 내 로컬 commit을 잃을 수 있다.'''

[[questions.choices]]
text = "fetch로 원격 commit을 받아 내 commit과 합치고, 테스트한 뒤 다시 push한다."
correct = true

[[questions.choices]]
text = "`git push --force`로 내 이력을 원격에 반영한다."
feedback = "원격에만 있는 동료의 commit이 사라진다. 공유 branch에서 force push는 하지 않는다."

[[questions.choices]]
text = "저장소를 지우고 새로 clone한 뒤 내 변경을 다시 입력한다."
feedback = "필요 없는 수작업이고, 옮기면서 빠뜨린 변경은 잃는다. 합치는 일은 Git이 한다."

[[questions.choices]]
text = "push 권한이 없다는 뜻이므로 관리자에게 권한을 요청한다."
feedback = "권한 문제는 다른 오류(인증 실패, 403 등)로 나타난다. fetch first는 원격 이력이 앞서 있다는 뜻이다."

[[questions]]
id = "gitignore-tracked-file"
type = "single"
objective = 2
prompt = '''이미 commit된 `data/raw.csv`가 있는 저장소에서 `.gitignore`에 `data/`를 추가했다. 그 뒤 `data/raw.csv`를 고치자 `git status`에 여전히 수정된 파일로 나온다. 왜 그런가, 그리고 어떻게 하는가?'''
explanation = '''`.gitignore`는 아직 추적하지 않는(untracked) 파일에만 적용된다. 이미 index에 있는 파일은 계속 추적한다. `git rm --cached data/raw.csv`로 index에서만 지우고(디스크의 파일은 남는다) commit하면 이후로는 무시된다. 다만 과거 commit에는 그 파일이 그대로 남아 있으므로, 민감하거나 큰 파일이라면 이력을 다시 쓰는 별도 조치가 필요하다.'''

[[questions.choices]]
text = "`.gitignore`는 이미 추적 중인 파일에는 적용되지 않는다. `git rm --cached`로 추적을 끊고 commit한다."
correct = true

[[questions.choices]]
text = "`.gitignore`를 commit하지 않았기 때문이다. `.gitignore`를 commit하면 과거 이력에서도 파일이 빠진다."
feedback = ".gitignore는 커밋 여부와 무관하게 바로 적용되며, 이미 추적 중인 파일에는 적용되지 않는다. 과거 commit은 어떤 경우에도 바뀌지 않는다."

[[questions.choices]]
text = "패턴이 틀렸다. `data/*.csv`처럼 확장자까지 써야 한다."
feedback = "data/ 패턴은 그 디렉터리 전체를 무시한다. 문제는 패턴이 아니라 이미 추적 중이라는 점이다. git check-ignore -v로 확인할 수 있다."

[[questions.choices]]
text = "파일을 디스크에서 지워야만 추적이 끊긴다."
feedback = "git rm --cached는 index에서만 지우고 디스크의 파일은 남긴다."

[[questions]]
id = "checkpoint-in-history"
type = "multiple"
objective = 2
prompt = '''실수로 2 GB checkpoint `model.ckpt`를 commit해 push했고, 바로 다음 commit에서 그 파일을 지워 다시 push했다. 옳은 설명을 모두 고르시오.'''
explanation = '''지우는 commit은 이후 스냅숏에서 파일을 빼는 것일 뿐, 이전 commit은 그대로이므로 blob도 저장소에 남는다. 새로 clone하는 모든 사람이 그 2 GB를 내려받는다. 정말로 없애려면 이력을 다시 써야 하고(`git filter-repo` 등), 그러면 그 commit 이후 모든 commit id가 바뀌므로 협업자 전원의 조율이 필요하다. Git LFS는 앞으로 추가하는 파일을 포인터로 바꿔 줄 뿐, 이미 일반 blob으로 들어간 과거 commit을 자동으로 바꾸지 않는다(바꾸려면 역시 이력을 다시 쓰는 migrate가 필요하다).'''

[[questions.choices]]
text = "파일은 이전 commit에 그대로 남아 있어, 새로 clone하는 사람도 모두 내려받는다."
correct = true

[[questions.choices]]
text = "지우는 commit을 push했으므로 저장소 크기는 원래대로 돌아왔다."
feedback = "commit은 스냅숏이고 과거 스냅숏은 바뀌지 않는다. 그 blob은 이전 commit에서 여전히 도달 가능하다."

[[questions.choices]]
text = "완전히 없애려면 이력을 다시 써야 하고, 그러면 이후 commit id가 모두 바뀐다."
correct = true

[[questions.choices]]
text = "지금 `git lfs track \"*.ckpt\"`를 설정하면 과거 commit의 checkpoint도 자동으로 LFS로 옮겨진다."
feedback = "track은 앞으로 add하는 파일에만 적용된다. 과거 commit의 blob은 그대로다."

[[questions]]
id = "leaked-key-first-step"
type = "single"
objective = 3
prompt = '''공개 저장소에 API key가 담긴 파일을 push한 것을 30분 뒤에 알았다. **가장 먼저** 해야 할 일은?'''
explanation = '''push된 순간부터 그 key는 누군가 이미 복사했다고 가정해야 한다. 공개 저장소는 자동화된 수집 대상이 되기도 한다. 그래서 첫 조치는 그 key를 발급한 서비스에서 폐기(revoke)하고 새 key로 교체(rotate)하는 것이다. 폐기된 key는 이력에 남아 있어도 쓸 수 없다. 파일을 지우는 commit은 과거 commit을 바꾸지 않고, 저장소를 비공개로 돌려도 이미 생긴 clone·fork·캐시는 남는다. 이력 정리는 폐기 뒤에 필요하면 하는 두 번째 단계다.'''

[[questions.choices]]
text = "key를 발급한 서비스에서 그 key를 폐기하고 새 key로 교체한다."
correct = true

[[questions.choices]]
text = "파일을 지우는 commit을 만들어 push한다."
feedback = "지우는 commit은 이후 스냅숏에서만 파일을 뺀다. key는 이전 commit에 그대로 있다."

[[questions.choices]]
text = "저장소를 비공개로 전환한다."
feedback = "이미 만들어진 clone·fork·캐시에는 효과가 없고, 그사이 key가 수집되었을 수 있다. key가 유효한 한 위험은 남는다."

[[questions.choices]]
text = "`git filter-repo`로 이력에서 key를 지우고 force push한다."
feedback = "필요할 수 있는 두 번째 단계다. 하지만 이력을 지우는 동안에도 key는 유효하고, 다른 사람의 clone에는 남는다. 폐기가 먼저다."

[[questions]]
id = "secret-handling"
type = "single"
objective = 3
prompt = "학습 스크립트가 실험 추적 서비스의 API key를 써야 한다. 저장소 운영 방식으로 가장 적절한 것은?"
explanation = '''비밀은 코드와 분리해 실행 환경(환경변수, 비밀 관리 도구, CI의 secret 설정)에서 주입한다. 로컬에서는 `.env` 파일을 `.gitignore`에 넣고, 필요한 키 이름만 담은 `.env.example`을 commit해 다른 사람이 무엇을 설정해야 하는지 알게 한다. 비공개 저장소도 접근 권한이 바뀌거나 공개로 전환되거나 clone이 유출될 수 있으므로 비밀을 넣을 곳이 아니다. 인코딩은 암호화가 아니다.'''

[[questions.choices]]
text = "key는 환경변수로 주입하고, 실제 값이 든 `.env`는 무시하며 키 이름만 담은 `.env.example`을 commit한다."
correct = true

[[questions.choices]]
text = "비공개 저장소라면 `config.py`에 key를 적어 commit해도 된다."
feedback = "접근 권한은 바뀌고(외부 협업자 초대, 공개 전환), clone은 여러 컴퓨터에 퍼진다. 이력에 들어간 비밀은 지우기 어렵다."

[[questions.choices]]
text = "key를 base64로 인코딩해 코드에 넣으면 안전하다."
feedback = "base64는 누구나 되돌릴 수 있는 인코딩이지 암호화가 아니다. 비밀 탐지 도구도 흔히 이를 찾아낸다."

[[questions.choices]]
text = "노트북 셀에 key를 적고, commit하기 전에 셀 출력만 지운다."
feedback = "출력을 지워도 셀의 소스 코드에 key가 남는다."
