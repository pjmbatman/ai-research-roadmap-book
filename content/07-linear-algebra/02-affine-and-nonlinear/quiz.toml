# 7.2 아핀 구조와 비선형성 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "affine-is-not-linear"
type = "single"
objective = 1
prompt = '''$\mathbf{b} \neq \mathbf{0}$일 때 $f(\mathbf{x}) = \mathbf{A}\mathbf{x} + \mathbf{b}$에 대한 설명으로 옳은 것은?'''
explanation = '''선형사상은 반드시 $f(\mathbf{0}) = \mathbf{0}$을 만족한다. $f(\mathbf{0}) = \mathbf{b} \neq \mathbf{0}$이므로 $f$는 선형이 아니지만, 선형사상에 평행이동을 더한 아핀 사상이다. 비선형 함수와는 다르다: 아핀 사상은 직선을 직선으로, 평행선을 평행선으로 보낸다.'''

[[questions.choices]]
text = "선형사상이다."
feedback = "선형사상이면 원점이 원점으로 가야 한다. f(0)을 계산해 보자."

[[questions.choices]]
text = '''아핀 사상이지만 선형사상은 아니다. $f(\mathbf{0}) = \mathbf{b}$이기 때문이다.'''
correct = true

[[questions.choices]]
text = "비선형 함수다."
feedback = "아핀 사상은 직선과 평행성을 보존한다. 비선형 함수는 그렇지 않다."

[[questions.choices]]
text = '''$\mathbf{b}$의 크기가 작으면 선형이다.'''
feedback = "선형성은 근사가 아니라 정의의 문제다. 0이 아닌 b는 크기와 무관하게 선형성을 깬다."

[[questions]]
id = "stacked-affine-layers"
type = "single"
objective = 2
prompt = '''활성화 함수 없이 두 층을 쌓은 $g(\mathbf{x}) = \mathbf{W}_2(\mathbf{W}_1\mathbf{x} + \mathbf{b}_1) + \mathbf{b}_2$는 무엇과 같은가?'''
explanation = '''전개하면 $g(\mathbf{x}) = (\mathbf{W}_2\mathbf{W}_1)\mathbf{x} + (\mathbf{W}_2\mathbf{b}_1 + \mathbf{b}_2)$로, 하나의 아핀 사상이다. 활성화 없이 층을 아무리 쌓아도 표현할 수 있는 함수의 집합은 한 층과 같다(행렬 곱의 rank 때문에 오히려 줄어들 수는 있다).'''

[[questions.choices]]
text = '''가중치 $\mathbf{W}_2\mathbf{W}_1$, bias $\mathbf{W}_2\mathbf{b}_1 + \mathbf{b}_2$인 하나의 아핀 사상'''
correct = true

[[questions.choices]]
text = '''가중치 $\mathbf{W}_2\mathbf{W}_1$, bias $\mathbf{b}_1 + \mathbf{b}_2$인 하나의 아핀 사상'''
feedback = "b1에도 W2가 곱해진다는 점을 놓쳤다."

[[questions.choices]]
text = "두 층이므로 한 층보다 더 많은 종류의 함수를 표현하는 비선형 함수"
feedback = "합성해도 여전히 아핀이다. 깊이가 표현력을 늘리려면 층 사이에 비선형 함수가 필요하다."

[[questions]]
id = "affine-combinations"
type = "multiple"
objective = 1
prompt = '''두 점 $\mathbf{p}, \mathbf{q}$에 대해 다음 중 **아핀 결합**인 것을 모두 고르시오.'''
explanation = '''계수의 합이 1이면 아핀 결합이다. 그중 모든 계수가 0 이상이면 convex 결합이기도 하다. $1.5\mathbf{p} - 0.5\mathbf{q}$는 계수 합이 1이므로 아핀 결합이지만, 음수 계수가 있어 두 점을 잇는 선분 밖(직선 위)에 있다. $2\mathbf{p} + \mathbf{q}$는 계수 합이 3이므로 아핀 결합이 아니다.'''

[[questions.choices]]
text = '''$0.3\mathbf{p} + 0.7\mathbf{q}$'''
correct = true

[[questions.choices]]
text = '''$1.5\mathbf{p} - 0.5\mathbf{q}$'''
correct = true

[[questions.choices]]
text = '''$0.5\mathbf{p} + 0.5\mathbf{q}$'''
correct = true

[[questions.choices]]
text = '''$2\mathbf{p} + \mathbf{q}$'''
feedback = "계수의 합이 1이 아니다."

[[questions]]
id = "relu-linear-regions"
type = "numeric"
objective = 3
prompt = '''1차원 함수 $f(x) = \mathrm{ReLU}(x) + \mathrm{ReLU}(x-1) + \mathrm{ReLU}(x-2)$는 실수 전체를 몇 개의 구간으로 나누어, 각 구간에서 아핀 함수가 되는가?'''
answer = 4
tolerance = 0
slider = { min = 1, max = 8, step = 1 }
explanation = '''각 ReLU는 꺾이는 점을 하나씩 만든다: $x = 0, 1, 2$. 세 점이 실수 직선을 $(-\infty, 0], [0, 1], [1, 2], [2, \infty)$의 네 구간으로 나누고, 각 구간에서 기울기는 0, 1, 2, 3이다. ReLU 신경망은 이렇게 입력 공간을 조각내 조각마다 아핀 함수가 되는 함수(piecewise affine)를 만든다.'''

[[questions]]
id = "relu-extrapolation"
type = "single"
objective = 3
prompt = '''1차원 입력을 받는 ReLU 신경망을 $x \in [0, 5]$에서 $\sin x$에 맞도록 학습했다. 학습 구간보다 훨씬 큰 $x$(예: $x = 20$)에서 이 모델의 출력에 대해 옳은 것은?'''
explanation = '''ReLU 신경망은 조각별 아핀 함수이고, 모든 꺾이는 점보다 오른쪽에 있는 가장 바깥 조각에서는 하나의 아핀 함수다. 그래서 충분히 큰 $x$에서 출력은 직선을 따라 변한다. 보편 근사 정리는 정해진 구간 안의 근사만 말하므로 학습 구간 밖의 값을 보장하지 않는다.'''

[[questions.choices]]
text = "x가 충분히 크면 출력은 x에 대한 아핀 함수(직선)를 따라 변한다."
correct = true

[[questions.choices]]
text = '''보편 근사 정리에 따라 $\sin 20$에 가깝다.'''
feedback = "보편 근사 정리는 정해진 구간 안에서의 근사만 말한다. 학습 구간 밖은 보장하지 않는다."

[[questions.choices]]
text = "학습 구간 밖에서는 항상 0을 출력한다."
feedback = "바깥 조각에서 켜져 있는 뉴런이 있으면 출력은 0이 아닌 직선이다."

[[questions.choices]]
text = "학습 구간의 마지막 값에서 일정하게 유지된다."
feedback = "바깥 조각의 기울기가 우연히 0인 특수한 경우일 뿐이다. 일반적으로는 직선을 따라 증가하거나 감소한다."

[[questions]]
id = "homogeneous-coordinates"
type = "single"
objective = 1
prompt = '''$\mathbf{x} \in \mathbb{R}^n$에 1을 덧붙인 동차좌표 $\tilde{\mathbf{x}} = (\mathbf{x}, 1)$을 쓰면, 아핀 사상 $\mathbf{A}\mathbf{x} + \mathbf{b}$를 어떻게 하나의 행렬 곱으로 쓸 수 있는가?'''
explanation = '''$\begin{bmatrix}\mathbf{A} & \mathbf{b} \\ \mathbf{0}^\top & 1\end{bmatrix}\begin{bmatrix}\mathbf{x} \\ 1\end{bmatrix} = \begin{bmatrix}\mathbf{A}\mathbf{x} + \mathbf{b} \\ 1\end{bmatrix}$. 한 차원 높은 공간의 선형사상으로 아핀 사상을 표현하는 방법이다. bias를 가중치 행렬에 흡수하는 구현 기법과 같은 아이디어다.'''

[[questions.choices]]
text = '''$\begin{bmatrix}\mathbf{A} & \mathbf{b} \\ \mathbf{0}^\top & 1\end{bmatrix}\tilde{\mathbf{x}}$'''
correct = true

[[questions.choices]]
text = '''$\begin{bmatrix}\mathbf{A} & \mathbf{0} \\ \mathbf{b}^\top & 1\end{bmatrix}\tilde{\mathbf{x}}$'''
feedback = "b가 마지막 열에 있어야 x에 더해진다. 직접 곱해 확인해 보자."

[[questions.choices]]
text = "아핀 사상은 선형이 아니므로 어떤 행렬 곱으로도 쓸 수 없다."
feedback = "원래 공간에서는 그렇지만, 한 차원 높은 공간에서는 가능하다."
