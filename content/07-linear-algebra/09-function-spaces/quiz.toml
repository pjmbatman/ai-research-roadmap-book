# 7.9 함수공간과 연산자 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "l2-norm-sin"
type = "numeric"
objective = 1
prompt = '''구간 $[0, 2\pi]$ 위의 $L^2$ 내적 $\langle f, g \rangle = \int_0^{2\pi} f(x) g(x)\,dx$에서 $\lVert \sin \rVert^2 = \langle \sin, \sin \rangle$의 값은? (소수 둘째 자리까지)'''
answer = 3.14
tolerance = 0.01
explanation = '''$\sin^2 x = (1 - \cos 2x)/2$이므로 $\int_0^{2\pi}\sin^2 x\,dx = \pi \approx 3.14$다. 같은 방법으로 $\langle \sin, \cos \rangle = 0$이다. 그래서 $\{1, \cos kx, \sin kx\}$는 서로 직교하는 basis이고, 정규직교 basis로 만들려면 각 함수를 $\sqrt{\pi}$($1$은 $\sqrt{2\pi}$)로 나눈다.'''

[[questions]]
id = "grid-inner-product-scaling"
type = "single"
objective = 1
prompt = '''구간 $[0, 1]$을 $N$칸으로 나눈 격자에서 두 함수 값을 벡터 $\mathbf{f}, \mathbf{g} \in \mathbb{R}^N$로 만들었다. 격자를 $N = 100$에서 $N = 1000$으로 세밀하게 하면 벡터 내적 $\mathbf{f}^\top\mathbf{g}$는 어떻게 되는가?'''
explanation = '''$\mathbf{f}^\top\mathbf{g} = \sum_i f(x_i)g(x_i)$는 항이 $N$개인 합이라 대략 $N \langle f, g \rangle$이고, 격자를 10배 세밀하게 하면 약 10배가 된다. 해상도와 무관한 값($L^2$ 내적의 근사)을 얻으려면 칸 너비 $h = 1/N$을 곱해 $h\,\mathbf{f}^\top\mathbf{g}$로 쓴다. 격자 값 벡터의 노름·거리·내적을 그대로 쓰는 모델이나 손실은 해상도가 바뀌면 값의 척도가 바뀐다.'''

[[questions.choices]]
text = "약 10배가 된다. 해상도와 무관한 값을 얻으려면 칸 너비 h = 1/N을 곱해야 한다."
correct = true

[[questions.choices]]
text = "거의 변하지 않는다. 같은 두 함수의 내적이기 때문이다."
feedback = "같은 함수라도 벡터 내적은 표본 수만큼의 항을 더한다. 함수의 내적(적분)에 해당하려면 칸 너비를 곱해야 한다."

[[questions.choices]]
text = "약 1/10이 된다. 칸이 좁아지기 때문이다."
feedback = "칸이 좁아지는 것은 h에 반영되는 효과다. h를 곱하지 않은 벡터 내적은 항이 늘어나 오히려 커진다."

[[questions]]
id = "monomial-gram"
type = "single"
objective = 1
prompt = '''구간 $[-1, 1]$ 위에서 단항식 basis $1, x, \dots, x^{11}$의 Gram 행렬 조건수는 약 $5 \times 10^7$이고, 같은 공간을 span하는 Legendre 다항식 basis의 Gram 행렬 조건수는 23이다. 이 차이의 원인은?'''
explanation = '''Gram 행렬 $G_{ij} = \langle b_i, b_j \rangle$은 basis 함수들의 내적을 모은 행렬이다. 고차 단항식 $x^{10}$과 $x^{12}$는 $[-1, 1]$에서 모양이 매우 비슷해 거의 일차종속이고, Gram 행렬이 특이행렬에 가까워진다. Legendre 다항식은 서로 직교하므로 Gram 행렬이 대각이다. 같은 함수공간이라도 basis를 어떻게 고르느냐가 계수 계산(최소제곱)의 수치 안정성을 정한다.'''

[[questions.choices]]
text = "고차 단항식들이 구간 위에서 서로 매우 비슷해 거의 일차종속이고, Legendre 다항식은 서로 직교하기 때문이다."
correct = true

[[questions.choices]]
text = "단항식 basis가 span하는 공간이 Legendre 다항식 basis보다 크기 때문이다."
feedback = "두 basis 모두 차수 11 이하의 다항식 전체, 즉 같은 12차원 공간을 span한다. 다른 것은 basis의 기하(서로 이루는 각)다."

[[questions.choices]]
text = "단항식은 구간 끝에서 값이 커져 발산하기 때문이다."
feedback = "[-1, 1]에서 |x^k| ≤ 1이므로 값이 커지지 않는다. 문제는 크기가 아니라 방향이 서로 비슷하다는 것이다."

[[questions]]
id = "fd-error-order"
type = "numeric"
objective = 2
prompt = '''매끄러운 주기 함수의 미분을 중심 차분 $(u_{i+1} - u_{i-1})/(2h)$로 근사한다. 격자 간격 $h$를 절반으로 줄이면 최대 오차는 대략 몇 분의 1로 줄어드는가?'''
answer = 4
tolerance = 0.3
slider = { min = 1, max = 8, step = 0.1 }
explanation = '''Taylor 전개로 $\frac{u(x+h) - u(x-h)}{2h} = u'(x) + \frac{h^2}{6}u^{(3)}(x) + O(h^4)$이므로 오차는 $h^2$에 비례한다. $h$를 절반으로 줄이면 오차는 약 $1/4$이 된다. 본문 셀에서도 $N = 16, 32, 64$에서 오차가 $9.36 \times 10^{-2}$, $2.58 \times 10^{-2}$, $6.51 \times 10^{-3}$으로 약 4배씩 줄었다. 반면 매끄러운 주기 함수의 Fourier 미분은 오차가 $N$에 대해 지수적으로 줄어든다.'''

[[questions]]
id = "derivative-unbounded"
type = "single"
objective = 2
prompt = '''주기 격자에서 $-d^2/dx^2$를 중심 차분 행렬로 근사하면, 격자점 수 $N$을 두 배로 할 때마다 행렬의 최대 고윳값이 약 4배가 된다. 이 현상이 뜻하는 것으로 가장 알맞은 것은?'''
explanation = '''연속 연산자 $-d^2/dx^2$의 고윳값은 $k^2$($k = 0, 1, 2, \dots$)으로 상한이 없다. 즉 미분 연산자는 **유계가 아닌**(unbounded) 연산자다. 이산화는 격자가 표현할 수 있는 가장 높은 파수에서 이 스펙트럼을 잘라 내므로, 최대 고윳값이 $4/h^2 \propto N^2$으로 커진다. 그래서 해상도를 높이면 미분 행렬의 조건수가 커지고, 명시적 시간적분의 안정 조건이 엄격해진다(9.6장). 행렬 크기가 커진 것이 원인이 아니라, 연속 연산자의 성질이 드러난 것이다.'''

[[questions.choices]]
text = "연속 미분 연산자의 고윳값에 상한이 없어서, 더 높은 파수를 표현하는 격자일수록 더 큰 고윳값이 나타난다."
correct = true

[[questions.choices]]
text = "이산화 오차가 커지고 있다는 뜻이므로 격자를 세밀하게 하면 안 된다."
feedback = "낮은 파수 모드의 고윳값은 격자가 세밀해질수록 정확해진다. 최대 고윳값이 커지는 것은 오차가 아니라 새로 표현된 높은 파수 모드 때문이다."

[[questions.choices]]
text = "행렬 크기가 커지면 고윳값도 커지는 일반적인 현상이다."
feedback = "행렬 크기만으로 고윳값이 커지지는 않는다. 예를 들어 단위행렬은 크기와 무관하게 고윳값이 1이다. 이 행렬에는 1/h²이 곱해져 있다."

[[questions]]
id = "valid-kernels"
type = "multiple"
objective = 3
prompt = '''실수 입력 $x, x'$에 대해 다음 중 양의 정부호 커널(모든 유한 점 집합에서 Gram 행렬이 양의 준정부호)인 것을 모두 고르시오.'''
explanation = '''$xx'$는 특징 $\phi(x) = x$의 내적, $(xx' + 1)^2$은 특징 $(x^2, \sqrt{2}x, 1)$의 내적이므로 양의 정부호 커널이다. RBF 커널 $\exp(-(x - x')^2/2)$도 양의 정부호 커널이다(무한차원 특징의 내적으로 쓸 수 있다). $-(x - x')^2$은 대각 원소가 모두 0이고 비대각 원소가 음수라, 점이 두 개 이상이면 Gram 행렬의 고윳값 합(trace)이 0인데 0이 아닌 고윳값이 있어 음의 고윳값이 반드시 생긴다.'''

[[questions.choices]]
text = '''$\exp\!\big(-(x - x')^2 / 2\big)$'''
correct = true

[[questions.choices]]
text = '''$(xx' + 1)^2$'''
correct = true

[[questions.choices]]
text = '''$xx'$'''
correct = true

[[questions.choices]]
text = '''$-(x - x')^2$'''
feedback = "거리의 음수는 '가까울수록 크다'는 유사도처럼 보이지만, 두 점 x = 0, 1의 Gram 행렬 [[0, -1], [-1, 0]]만 봐도 고윳값 -1이 있다."

[[questions]]
id = "representer-theorem"
type = "single"
objective = 3
prompt = '''학습 점 $N = 50$개로 RBF 커널 ridge 회귀를 푼다. RBF 커널의 특징 공간은 무한차원이다. 학습된 함수 $f$를 계산하는 데 필요한 계수의 수는?'''
explanation = '''표현자 정리(representer theorem)에 따르면, 학습 점에서의 손실과 RKHS 노름 벌점의 합을 최소화하는 해는 $f(x) = \sum_{i=1}^N \alpha_i k(x, x_i)$ 꼴이다. 특징 공간이 무한차원이어도 최적해는 학습 점 위의 커널 함수 $N$개가 span하는 유한차원 부분공간 안에 있다. 그래서 $N \times N$ Gram 행렬 하나로 문제를 풀 수 있고, 대신 계산량이 데이터 수 $N$에 따라 커진다($O(N^3)$).'''

[[questions.choices]]
text = "학습 점 수와 같은 50개"
correct = true

[[questions.choices]]
text = "특징 공간이 무한차원이므로 무한히 많은 계수가 필요해 정확히 풀 수 없다."
feedback = "표현자 정리 덕분에 해는 학습 점의 커널 함수들의 선형결합으로 충분하다. 무한차원 특징을 명시적으로 다룰 필요가 없다(커널 트릭)."

[[questions.choices]]
text = "입력 차원과 같은 1개"
feedback = "그것은 선형 회귀의 계수 수다. 커널 회귀의 계수는 입력 차원이 아니라 학습 점마다 하나씩 있다."
