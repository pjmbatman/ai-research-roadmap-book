# 11.2 주요 분포와 지수족 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "photon-count-model"
type = "single"
objective = 1
prompt = '''약한 광원을 1 ms마다 관측해 검출기에 들어온 광자 수를 센다. 광자는 서로 독립적으로, 일정한 평균 비율로 도착한다. 1 ms당 광자 수의 분포로 가장 알맞은 것은?'''
explanation = '''일정한 비율로 독립적으로 일어나는 사건을 정해진 시간 동안 센 수는 Poisson 분포를 따른다. 시간을 아주 잘게 나눈 칸마다 사건이 일어날 확률이 작은 binomial의 극한으로 이해할 수 있다. 같은 과정에서 사건 사이의 **대기 시간**은 지수분포를 따른다. 평균 계수가 수백 이상이면 Poisson은 평균과 분산이 같은 정규분포로 잘 근사되지만, 약한 광원에서는 0, 1, 2 같은 작은 정수가 대부분이라 근사가 맞지 않는다.'''

[[questions.choices]]
text = "Poisson 분포"
correct = true

[[questions.choices]]
text = "binomial 분포"
feedback = "binomial은 정해진 시행 횟수 n이 있을 때의 성공 수다. 광자 수에는 정해진 n이 없다. 시행 수를 무한히 늘리고 확률을 줄인 극한이 Poisson이다."

[[questions.choices]]
text = "지수분포"
feedback = "지수분포는 같은 과정에서 다음 광자가 올 때까지의 대기 시간의 분포다. 개수가 아니라 연속적인 시간이다."

[[questions.choices]]
text = "정규분포"
feedback = "광자 수는 음이 아닌 정수이고, 약한 광원에서는 평균이 작아 분포가 비대칭이다. 정규 근사는 평균 계수가 클 때만 맞는다."

[[questions]]
id = "memoryless-lifetime"
type = "single"
objective = 1
prompt = '''수명이 지수분포를 따르는 부품이 이미 1000시간을 고장 없이 작동했다. 앞으로 500시간 더 작동할 확률은 새 부품이 500시간 작동할 확률과 비교해 어떤가?'''
explanation = '''지수분포는 무기억성(memoryless)을 갖는다: $P(T > s + t \mid T > s) = e^{-\lambda(s+t)}/e^{-\lambda s} = e^{-\lambda t} = P(T > t)$. 지금까지 버틴 시간이 앞으로의 수명에 아무 정보도 주지 않는다는 뜻이고, 고장률(hazard)이 시간에 따라 일정하다는 가정과 같다. 마모가 쌓이는 부품에는 이 가정이 맞지 않으므로 감마나 Weibull 분포처럼 고장률이 시간에 따라 변하는 분포를 쓴다.'''

[[questions.choices]]
text = "더 낮다. 이미 오래 썼으므로 낡았다."
feedback = "마모가 있는 부품이라면 그렇다. 그러나 그때는 수명 분포가 지수분포가 아니다. 지수분포를 가정하는 순간 '낡음'이 없다고 가정한 것이다."

[[questions.choices]]
text = "같다."
correct = true

[[questions.choices]]
text = "더 높다. 초기 불량을 이미 통과했다."
feedback = "초기 고장이 많은(고장률이 감소하는) 부품이라면 그렇지만, 그것도 지수분포가 아닌 경우다. 지수분포의 고장률은 일정하다."

[[questions]]
id = "poisson-relative-noise"
type = "numeric"
objective = 1
prompt = '''광자 계수가 평균 100인 Poisson 분포를 따른다. 계수의 표준편차는 얼마인가?'''
answer = 10
tolerance = 0.01
slider = { min = 0, max = 50, step = 1, unit = "개" }
explanation = '''Poisson 분포는 평균과 분산이 같다($\lambda$). 따라서 표준편차는 $\sqrt{100} = 10$이고, 상대 잡음은 $10/100 = 10\%$다. 평균 계수를 4배로 늘리면 상대 잡음은 절반이 된다. 측정 시간을 늘려 계수를 모으는 것이 신호 대 잡음비를 높이는 이유다.'''

[[questions]]
id = "bernoulli-natural-parameter"
type = "single"
objective = 2
prompt = '''Bernoulli 분포 $p(x) = \pi^x (1 - \pi)^{1 - x}$를 지수족 꼴 $\exp\big(\eta\,T(x) - A(\eta)\big)$로 쓸 때, $T(x) = x$에 대응하는 자연 파라미터 $\eta$는?'''
explanation = '''$p(x) = \exp\big(x \log \pi + (1 - x)\log(1 - \pi)\big) = \exp\big(x \log\frac{\pi}{1 - \pi} + \log(1 - \pi)\big)$이므로 $\eta = \log\frac{\pi}{1 - \pi}$, 즉 logit이다. 역으로 $\pi = 1/(1 + e^{-\eta})$는 sigmoid이고, $A(\eta) = \log(1 + e^{\eta})$다. 로지스틱 회귀가 자연 파라미터를 입력의 선형함수로 두는 모델인 이유가 여기에 있다.'''

[[questions.choices]]
text = '''$\eta = \pi$'''
feedback = "π는 평균 파라미터다. 지수족 꼴로 정리하면 x에 곱해지는 계수는 π가 아니라 log(π/(1-π))다."

[[questions.choices]]
text = '''$\eta = \log \pi$'''
feedback = "(1-x)log(1-π) 항에도 x가 들어 있다는 점을 놓쳤다. 두 항의 x 계수를 모으면 log π - log(1-π)가 된다."

[[questions.choices]]
text = '''$\eta = \log\frac{\pi}{1 - \pi}$ (logit)'''
correct = true

[[questions]]
id = "log-partition-derivatives"
type = "single"
objective = 2
prompt = '''지수족 $p(x \mid \eta) = h(x)\exp\big(\eta\,T(x) - A(\eta)\big)$에서 log-partition $A(\eta)$의 1계·2계 도함수는 무엇인가?'''
explanation = '''$A(\eta) = \log \int h(x) e^{\eta T(x)} dx$를 미분하면 $A'(\eta) = \mathbb{E}[T(X)]$, 한 번 더 미분하면 $A''(\eta) = \operatorname{Var}[T(X)] \ge 0$이다. 그래서 $A$는 볼록함수이고, 지수족의 음의 로그우도는 자연 파라미터에 대해 볼록하다. 최대우도 조건 $A'(\hat\eta) = \frac{1}{n}\sum_i T(x_i)$는 "모델의 충분통계량 평균 = 데이터의 충분통계량 평균"(모멘트 맞추기)이 된다.'''

[[questions.choices]]
text = '''$A'(\eta) = \mathbb{E}[T(X)]$, $A''(\eta) = \operatorname{Var}[T(X)]$'''
correct = true

[[questions.choices]]
text = '''$A'(\eta) = \eta$, $A''(\eta) = 1$'''
feedback = "A는 정규화 상수의 로그이고, 분포마다 모양이 다르다. Poisson에서는 A = e^η이므로 A' = A'' = e^η = λ다."

[[questions.choices]]
text = '''$A$는 정규화 상수일 뿐이라 미분해도 분포에 대한 정보가 없다.'''
feedback = "정규화 상수가 η에 의존하므로 그 미분에 분포의 모멘트가 담긴다. 본문 코드에서 유한차분으로 확인한 그대로다."

[[questions]]
id = "gaussian-fit-heavy-tail"
type = "single"
objective = 3
prompt = '''이상치가 가끔 섞이는 측정 잡음에 정규분포를 최대우도로 적합한 뒤, "중심에서 1.0 이상 벗어날 확률"을 이 적합으로 계산했다. 가장 가능성 높은 결과는?'''
explanation = '''정규분포의 적합은 평균과 분산 두 숫자만 맞춘다. 꼬리가 두꺼운 데이터에서는 분산을 키워 이상치를 일부 흡수하지만, 정규분포의 꼬리는 $e^{-x^2/2}$로 매우 빨리 줄어들기 때문에 먼 꼬리 확률은 여전히 크게 과소평가된다. 본문 예에서 표본 비율은 0.0135였지만 정규 적합은 0.0034를 주었다. 꼬리 확률이 중요한 문제(이상치 판정, 안전 한계)에서는 꼬리를 표현할 수 있는 분포(Student-t, 혼합분포)를 쓰고 QQ plot으로 꼬리를 확인한다.'''

[[questions.choices]]
text = "실제보다 작게 나온다. 정규분포의 꼬리는 너무 빨리 줄어든다."
correct = true

[[questions.choices]]
text = "대략 맞는다. 최대우도 적합은 분산을 데이터에 맞추므로 꼬리도 맞는다."
feedback = "분산이 맞아도 꼬리의 모양은 맞지 않는다. 같은 분산을 가진 분포라도 꼬리 확률은 몇 배씩 다를 수 있다(11.1장 실습)."

[[questions.choices]]
text = "실제보다 크게 나온다. 이상치 때문에 분산이 부풀려졌다."
feedback = "분산은 부풀려지지만, 그 효과는 중간 거리(1–2σ)의 확률을 늘리는 쪽으로 나타난다. 먼 꼬리에서는 가우시안의 급격한 감소가 이긴다."

[[questions]]
id = "fit-comparison-statements"
type = "multiple"
objective = 3
prompt = "여러 후보 분포를 같은 데이터에 적합해 비교할 때 옳은 것을 모두 고르시오."
explanation = '''모수가 많은 모델은 같은 데이터에서 로그우도가 거의 항상 같거나 높으므로, AIC($2k - 2\log L$)처럼 모수 수를 벌하는 기준을 쓴다. 데이터로 모수를 추정한 뒤 같은 데이터로 KS 검정을 하면, 분포가 데이터에 미리 맞춰져 있어 통계량이 작게 나오고 표준 KS 표의 p값은 지나치게 낙관적이다. 표본 꼬리 확률은 꼬리에 든 관측이 몇 개뿐이라 그 자체가 잡음이 크다. AIC가 가장 좋은 모델도 "후보 중 상대적으로 낫다"는 뜻이지 참 분포라는 뜻이 아니다.'''

[[questions.choices]]
text = "모수가 많은 모델은 로그우도가 높아지기 쉬우므로 AIC처럼 모수 수를 벌하는 기준으로 비교한다."
correct = true

[[questions.choices]]
text = "모수를 데이터로 추정한 뒤 같은 데이터로 계산한 KS 검정의 p값은 지나치게 낙관적이다."
correct = true

[[questions.choices]]
text = "AIC가 가장 작은 모델이 데이터를 만든 참 분포다."
feedback = "AIC는 후보들 사이의 상대 비교다. 참 분포가 후보에 없으면 가장 나은 후보도 틀린 모델이다. 실습의 잡음 데이터에서 Student-t는 정규·Laplace보다 AIC가 좋았지만 참 분포(혼합)는 아니었고, 꼬리 확률도 과소평가했다."

[[questions.choices]]
text = "표본 300개에서 센 꼬리 확률(예: 1%)은 충분히 정확하므로 그대로 참값으로 쓸 수 있다."
feedback = "1% 꼬리에는 관측이 3개 정도뿐이다. 실습에서 참값 0.0175인 꼬리의 표본 비율은 0.0100이었다. 꼬리 확률은 표본 비율과 적합한 분포를 함께 보고 불확실성을 따진다."
