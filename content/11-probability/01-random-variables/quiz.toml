# 11.1 확률공간과 확률변수 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "random-variable-statements"
type = "multiple"
objective = 1
prompt = "확률변수에 대해 옳은 것을 모두 고르시오."
explanation = '''확률변수는 표본공간의 각 결과 $\omega$에 실수 $X(\omega)$를 대응시키는 **함수**다. 무작위성은 어떤 $\omega$가 실현되는지에서 오고, 함수 자체는 고정되어 있다. 그래서 같은 실험(같은 표본공간) 위에 주사위 두 개의 합, 최댓값, 첫 주사위의 값처럼 여러 확률변수를 정의할 수 있다. 연속확률변수는 한 점의 확률이 0이지만, 그렇다고 그 값이 나올 수 없다는 뜻은 아니다. 관측값은 언제나 어떤 한 점이다. 확률 0과 불가능은 다르다.'''

[[questions.choices]]
text = '''확률변수는 표본공간의 결과 $\omega$마다 실수 $X(\omega)$를 정하는 함수다.'''
correct = true

[[questions.choices]]
text = "같은 표본공간 위에 서로 다른 확률변수를 여러 개 정의할 수 있다."
correct = true

[[questions.choices]]
text = "확률변수는 값이 무작위로 바뀌는 변수이므로 함수로 볼 수 없다."
feedback = "무작위인 것은 어떤 결과 ω가 실현되는지다. ω가 정해지면 X(ω)는 하나로 정해진다. 이 구분이 있어야 같은 실험에서 여러 확률변수를 함께 다룰 수 있다."

[[questions.choices]]
text = "연속확률변수에서 P(X = 0.3) = 0이므로, 값 0.3은 관측될 수 없다."
feedback = "연속확률변수에서는 모든 한 점의 확률이 0이지만, 관측값은 반드시 어떤 한 점이다. 확률 0은 '불가능'이 아니라 '구간의 넓이가 0'이라는 뜻이다."

[[questions]]
id = "dice-sum-cdf"
type = "numeric"
objective = 1
prompt = '''공정한 주사위 두 개를 던져 눈의 합을 $X$라 하자. $F_X(4) = P(X \le 4)$를 소수로 답하시오(소수 셋째 자리까지).'''
answer = 0.167
tolerance = 0.002
explanation = '''표본공간은 같은 확률의 순서쌍 36개다. 합이 2인 경우 1개, 3인 경우 2개, 4인 경우 3개이므로 $P(X \le 4) = 6/36 = 1/6 \approx 0.167$이다. 확률변수 $X$는 순서쌍을 합으로 보내는 함수이고, $X$의 분포는 각 값에 대응하는 순서쌍들의 확률을 모아서 얻는다. CDF는 그 PMF를 4까지 더한 값이다.'''

[[questions]]
id = "pdf-above-one"
type = "single"
objective = 2
prompt = '''$X \sim \mathrm{Unif}(0, 0.5)$의 PDF는 구간 안에서 $p(x) = 2$이다. 이에 대해 옳은 것은?'''
explanation = '''PDF는 확률이 아니라 **확률밀도**, 즉 단위 길이당 확률이다. 길이 $h$의 짧은 구간에 들어갈 확률이 $p(x)\,h$이고, 전체 적분이 1이기만 하면 PDF 값은 1보다 클 수 있다. 폭이 0.5인 구간에 확률 1을 펴 놓았으니 밀도는 2다. 구간 확률은 PDF의 적분(CDF의 차)으로 구한다.'''

[[questions.choices]]
text = "확률은 1을 넘을 수 없으므로 이 PDF는 잘못 정의되었다."
feedback = "1을 넘을 수 없는 것은 확률(PDF의 적분)이다. PDF 값 자체에는 상한이 없다."

[[questions.choices]]
text = "PDF는 단위 길이당 확률이므로 1보다 클 수 있다. 예를 들어 P(0.2 < X ≤ 0.21) ≈ 2 × 0.01 = 0.02다."
correct = true

[[questions.choices]]
text = '''$P(X = 0.2) = 2$라는 뜻이다.'''
feedback = "연속확률변수에서 한 점의 확률은 0이다. PDF 값은 그 점 근처의 짧은 구간 확률을 길이로 나눈 극한이다."

[[questions]]
id = "interval-from-cdf"
type = "numeric"
objective = 2
prompt = '''$X$의 CDF가 $F(x) = 1 - e^{-x}$ $(x \ge 0)$이다. $P(1 < X \le 2)$를 소수 셋째 자리까지 구하시오.'''
answer = 0.233
tolerance = 0.002
explanation = '''$P(a < X \le b) = F(b) - F(a) = (1 - e^{-2}) - (1 - e^{-1}) = e^{-1} - e^{-2} \approx 0.3679 - 0.1353 = 0.2325$이다. 구간 확률을 구할 때는 PDF 값을 읽는 것이 아니라 CDF의 차를 계산한다(같은 값이 PDF의 적분이다).'''

[[questions]]
id = "mixed-cdf-jump"
type = "single"
objective = 2
prompt = '''하루 강수량 $R$은 확률 0.6으로 정확히 0 mm이고, 비가 온 날(확률 0.4)에는 연속적인 양의 값을 갖는다. $R$의 분포를 옳게 설명한 것은?'''
explanation = '''$R$은 이산 부분(0에 질량 0.6)과 연속 부분이 섞인 혼합형 확률변수다. CDF는 0에서 0.6만큼 뛰어오르고 그 뒤로는 연속적으로 1을 향해 증가한다. 이런 변수는 PMF 하나나 PDF 하나로 표현할 수 없지만, CDF는 언제나 존재하므로 모든 확률변수를 같은 방식으로 다룰 수 있다.'''

[[questions.choices]]
text = "CDF가 0에서 0.6만큼 뛰고, 그 뒤로는 연속적으로 증가한다. PMF나 PDF 하나로는 표현되지 않는다."
correct = true

[[questions.choices]]
text = '''연속값을 가지므로 연속확률변수이고, PDF는 $p(0) = 0.6$이다.'''
feedback = "PDF 값은 확률이 아니므로 한 점에 확률 0.6을 담을 수 없다. 한 점의 확률이 양수이면 CDF가 그 점에서 뛴다."

[[questions.choices]]
text = "0이 가장 자주 나오므로 이산확률변수이고, PMF로 충분히 표현된다."
feedback = "비가 온 날의 강수량은 연속적인 값이라 PMF로는 3.27 mm 같은 값을 다룰 수 없다. 두 성분이 섞인 혼합형이다."

[[questions]]
id = "monotone-transform-median"
type = "single"
objective = 3
prompt = '''$X \sim \mathcal{N}(0, 0.5^2)$이고 $Y = e^X$이다. 다음 중 "$Y$의 통계량 = $e^{(X\text{의 같은 통계량})}$"이 성립하는 것은?'''
explanation = '''$g(x) = e^x$는 증가함수이므로 $P(Y \le e^m) = P(X \le m)$이다. 따라서 중앙값을 포함한 모든 분위수는 $g$를 그대로 통과한다: $Y$의 중앙값은 $e^0 = 1$이다. 평균은 통과하지 않는다. $e^x$가 볼록하므로 $\mathbb{E}[e^X] = e^{0.125} \approx 1.133 > e^{\mathbb{E}[X]} = 1$이다. 최빈값(밀도의 봉우리)도 통과하지 않는다. 변수변환에서 밀도에 Jacobian $1/y$가 곱해져 봉우리가 $e^{-0.25} \approx 0.779$로 옮겨 간다.'''

[[questions.choices]]
text = "평균"
feedback = "e^x가 볼록하므로 E[e^X] > e^{E[X]}이다(Jensen 부등식). 본문 실행 결과에서 Y의 표본 평균은 1.133이었다."

[[questions.choices]]
text = "중앙값"
correct = true

[[questions.choices]]
text = "최빈값"
feedback = "밀도는 변수변환에서 Jacobian 인자 |dx/dy| = 1/y가 곱해지므로 봉우리 위치가 바뀐다. Y의 최빈값은 e^{-0.25} ≈ 0.779다."
