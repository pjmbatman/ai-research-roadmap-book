# 11.5 기댓값·부등식·극한정리 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "linearity-without-independence"
type = "single"
objective = 1
prompt = '''$X$와 $Y$가 독립인지 모르는 두 확률변수다(기댓값과 분산은 모두 존재한다). 다음 중 **항상** 성립하는 것은?'''
explanation = '''기댓값의 선형성 $\mathbb{E}[X + Y] = \mathbb{E}[X] + \mathbb{E}[Y]$는 독립성과 무관하게 성립한다. 분산의 덧셈과 곱의 기댓값 분해는 공분산이 0일 때만 성립하고, 기댓값과 비선형 함수의 순서는 일반적으로 바꿀 수 없다(Jensen 부등식).'''

[[questions.choices]]
text = '''$\mathbb{E}[X + Y] = \mathbb{E}[X] + \mathbb{E}[Y]$'''
correct = true

[[questions.choices]]
text = '''$\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$'''
feedback = "분산에는 2Cov(X, Y) 항이 붙는다. 공분산이 0일 때만 분산이 그대로 더해진다."

[[questions.choices]]
text = '''$\mathbb{E}[XY] = \mathbb{E}[X]\,\mathbb{E}[Y]$'''
feedback = "E[XY] - E[X]E[Y]가 바로 공분산이다. 상관이 없을 때만 성립한다."

[[questions.choices]]
text = '''$\mathbb{E}[X^2] = (\mathbb{E}[X])^2$'''
feedback = "둘의 차이가 분산이다. X가 상수가 아니면 E[X^2]가 더 크다(Jensen 부등식)."

[[questions]]
id = "variance-of-difference"
type = "numeric"
objective = 1
prompt = '''같은 기준 시료를 두 센서로 측정한 값 $X$, $Y$의 분산이 각각 $\operatorname{Var}(X) = 4$, $\operatorname{Var}(Y) = 9$이고, 공유하는 기준 때문에 $\operatorname{Cov}(X, Y) = 3$이다. 두 측정의 차이 $X - Y$의 분산은?'''
answer = 7
tolerance = 0
explanation = '''$\operatorname{Var}(X - Y) = \operatorname{Var}X + \operatorname{Var}Y - 2\operatorname{Cov}(X, Y) = 4 + 9 - 6 = 7$이다. 양의 상관은 차이의 분산을 줄인다. 공분산을 무시하면 13, 부호를 틀리면 19가 나온다.'''

[[questions]]
id = "zero-correlation-dependence"
type = "single"
objective = 1
prompt = '''$X \sim \mathcal{N}(0, 1)$이고 $Y = X^2$이다. 둘의 관계에 대해 옳은 것은?'''
explanation = '''$\operatorname{Cov}(X, Y) = \mathbb{E}[X^3] - \mathbb{E}[X]\,\mathbb{E}[X^2] = 0$이다. 그러나 $Y$는 $X$로 완전히 결정되므로 둘은 독립이 아니다. 예를 들어 $\lvert X \rvert < 1$이면 반드시 $Y < 1$이다. 공분산과 상관계수는 선형 관계만 잰다.'''

[[questions.choices]]
text = "공분산이 0이므로 X와 Y는 독립이다."
feedback = "독립이면 공분산이 0이지만, 공분산이 0이라고 독립인 것은 아니다. X를 알면 Y가 정확히 정해진다."

[[questions.choices]]
text = "공분산은 0이지만 Y가 X로 완전히 결정되므로 독립이 아니다."
correct = true

[[questions.choices]]
text = "Y는 X가 커질수록 커지므로 공분산은 양수다."
feedback = "X가 음수 쪽에서 커질 때는 Y가 줄어든다. 양쪽이 대칭으로 상쇄되어 공분산은 정확히 0이다."

[[questions.choices]]
text = "공분산이 0에 가깝게 나오는 것은 표본 수가 부족해서 생기는 우연이다."
feedback = "이론적인 공분산이 정확히 0이다. E[X^3] = 0이기 때문이다. 표본을 늘려도 0으로 간다."

[[questions]]
id = "chebyshev-bound"
type = "numeric"
objective = 2
prompt = '''어떤 부품의 길이는 평균 50 mm, 표준편차 5 mm이고 분포의 모양은 모른다. Chebyshev 부등식이 보장하는 $\Pr(\lvert X - 50 \rvert \ge 15)$의 **상한**은? (소수로 답한다)'''
answer = 0.1111
tolerance = 0.002
explanation = '''$15 = 3\sigma$이므로 $\Pr(\lvert X - \mu \rvert \ge 3\sigma) \le 1/3^2 = 1/9 \approx 0.111$이다. 정규분포라면 실제 확률은 약 0.0027이지만, 분포를 모르면 Chebyshev가 줄 수 있는 보장은 1/9까지다. Markov 부등식을 $\lvert X - \mu \rvert$에 바로 쓰거나 $1/k$로 계산하면 1/3이라는 더 약한 값이 나온다.'''

[[questions]]
id = "jensen-elbo"
type = "single"
objective = 2
prompt = '''$\log p(x) = \log \mathbb{E}_{q}[p(x, z)/q(z)] \ \ge\ \mathbb{E}_{q}[\log (p(x, z)/q(z))]$에서 부등호가 성립하는 이유는?'''
explanation = '''로그는 오목 함수이므로 Jensen 부등식에 따라 $\log \mathbb{E}[W] \ge \mathbb{E}[\log W]$이다. 우변이 ELBO이고, 등호는 $W = p(x, z)/q(z)$가 상수, 즉 $q(z) = p(z \mid x)$일 때 성립한다. 부등호는 표본 수나 $W$의 크기와 무관한 정확한 부등식이다.'''

[[questions.choices]]
text = "로그가 오목 함수이므로, 평균의 로그가 로그의 평균보다 크거나 같다(Jensen 부등식)."
correct = true

[[questions.choices]]
text = "로그가 볼록 함수이므로, 로그의 평균이 평균의 로그보다 크거나 같다."
feedback = "로그는 위로 볼록한 오목 함수다. 볼록·오목을 바꾸면 부등호 방향이 반대가 된다."

[[questions.choices]]
text = "우변은 Monte Carlo 표본으로 근사하므로 표본 오차만큼 작게 나온다."
feedback = "부등식은 기댓값 사이의 정확한 관계다. 표본을 무한히 써도 간극은 남고, q가 사후분포와 같을 때만 사라진다."

[[questions.choices]]
text = "p(x, z)/q(z)가 항상 1보다 작아 로그가 음수이기 때문이다."
feedback = "이 비율은 1보다 클 수도 있다. 부등식은 비율의 크기가 아니라 로그 함수의 모양에서 나온다."

[[questions]]
id = "hoeffding-sample-size"
type = "numeric"
objective = 2
prompt = '''학습과 독립인 시험 데이터로 분류기의 정확도를 잰다. Hoeffding 부등식 $\Pr(\lvert \bar{X}_n - \mu \rvert \ge t) \le 2\exp(-2nt^2)$(값이 0 또는 1)를 써서, 측정한 정확도가 참 정확도에서 $0.05$ 이상 벗어날 확률을 $0.05$ 이하로 만드는 **최소** 시험 데이터 수 $n$은?'''
answer = 738
tolerance = 1
explanation = '''$2\exp(-2n \cdot 0.05^2) \le 0.05$를 풀면 $n \ge \log(40) / (2 \times 0.0025) \approx 737.8$이므로 $n = 738$이다. 같은 조건에서 Chebyshev(베르누이 분산의 최댓값 0.25 사용)는 $0.25 / (0.05 \times 0.05^2) = 2000$개를 요구한다. 하이퍼파라미터를 여러 번 고르는 데 같은 시험 데이터를 쓰면 이 보장은 성립하지 않는다.'''

[[questions]]
id = "clt-heavy-tail"
type = "multiple"
objective = 3
prompt = '''표본 평균과 극한정리에 대한 설명으로 옳은 것을 **모두** 고르시오.'''
explanation = '''Cauchy 표본 $n$개의 평균은 다시 표준 Cauchy 분포를 따르므로 $n$을 늘려도 흩어짐이 줄지 않는다. 고전적인 중심극한정리는 유한한 분산을 가정한다. 꼬리 지수 1.5인 Pareto 분포는 평균은 있지만 분산이 무한해, 표본 평균은 수렴하지만 $\sqrt{n}$ 척도의 정규 근사는 성립하지 않는다. $n = 30$은 경험칙일 뿐이고 치우친 분포에서는 훨씬 큰 $n$이 필요하다. 대수의 법칙은 합이 아니라 평균의 수렴이다.'''

[[questions.choices]]
text = "Cauchy 분포의 표본 평균은 n을 늘려도 흩어짐이 줄지 않는다."
correct = true

[[questions.choices]]
text = "고전적인 중심극한정리는 원래 분포의 분산이 유한하다고 가정한다."
correct = true

[[questions.choices]]
text = "꼬리 지수 1.5인 Pareto 분포에서는 표본 평균이 참 평균으로 수렴하지만, 표준오차를 쓴 정규 근사 구간은 믿을 수 없다."
correct = true

[[questions.choices]]
text = "어떤 분포든 n ≥ 30이면 표본 평균의 분포는 정규분포로 봐도 된다."
feedback = "경험칙일 뿐이다. 로그정규나 Pareto(α=2.5)처럼 치우친 분포는 n = 3000에서도 근사 95% 구간의 포함률이 0.93대였다(실습)."

[[questions.choices]]
text = "대수의 법칙에 따라 표본의 합도 참 평균으로 수렴한다."
feedback = "수렴하는 것은 합을 n으로 나눈 평균이다. 합 자체는 n μ 근처에서 √n 크기로 흩어지며 커진다."
