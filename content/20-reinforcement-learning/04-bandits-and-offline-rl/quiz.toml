# 20.4 밴딧·오프라인 RL·안전한 의사결정 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "ucb-bonus"
type = "single"
objective = 1
prompt = '''$t = 55$번째 선택이다. 팔 A는 50번 당겨 평균 보상 0.6, 팔 B는 5번 당겨 평균 0.5다. UCB1 지표 $\hat{\mu}_a + \sqrt{2\ln t / n_a}$로 고르면 어느 팔을 당기는가?'''
explanation = '''$\ln 55 \approx 4.007$이다. A의 지표는 $0.6 + \sqrt{8.01/50} \approx 0.6 + 0.40 = 1.00$, B는 $0.5 + \sqrt{8.01/5} \approx 0.5 + 1.27 = 1.77$이다. B의 평균은 낮지만 5번밖에 해 보지 않아 불확실성 보너스가 크므로 B를 고른다. "모르는 것은 낙관적으로 본다"는 원칙이 덜 해 본 팔을 다시 시도하게 만든다.'''

[[questions.choices]]
text = "A. 평균 보상이 더 높기 때문이다."
feedback = "평균만 보는 것은 탐욕 선택이다. UCB1은 평균에 불확실성 보너스를 더하고, 적게 해 본 B의 보너스(약 1.27)가 A(약 0.40)보다 훨씬 크다."

[[questions.choices]]
text = "B. 시행 수가 적어 상한이 더 크기 때문이다."
correct = true

[[questions.choices]]
text = "둘 중 무작위로 고른다."
feedback = "UCB1은 결정적 규칙이다. 지표가 큰 팔을 고른다. 무작위성을 쓰는 것은 ε-greedy와 Thompson sampling이다."

[[questions.choices]]
text = "A. 많이 해 본 팔의 추정이 더 믿을 만하기 때문이다."
feedback = "믿을 만한 것은 맞지만, UCB는 바로 그 이유로 덜 해 본 팔에 기회를 준다. 믿을 만한 추정만 쓰면 B가 실제로 더 좋을 가능성을 영영 확인하지 못한다."

[[questions]]
id = "thompson-posterior"
type = "numeric"
objective = 1
prompt = '''Bernoulli 팔에 사전분포 $\mathrm{Beta}(1, 1)$을 두고 Thompson sampling을 한다. 이 팔을 4번 당겨 3번 성공했다. 다음 선택에서 이 팔의 값을 뽑을 사후분포의 평균은? (소수 셋째 자리까지)'''
answer = 0.667
tolerance = 0.002
explanation = '''Beta–Bernoulli 켤레성(13.2장)으로 사후분포는 $\mathrm{Beta}(1 + 3, 1 + 1) = \mathrm{Beta}(4, 2)$이고 평균은 $4/6 \approx 0.667$이다. 경험 평균 $3/4 = 0.75$와 다른 것은 사전분포가 성공·실패 한 번씩의 가상 관측으로 작용하기 때문이다. Thompson sampling은 이 평균이 아니라 사후분포에서 **뽑은** 값으로 팔을 비교한다.'''

[[questions]]
id = "regret-linear"
type = "single"
objective = 1
prompt = '''$\varepsilon = 0.1$을 고정한 ε-greedy의 누적 후회는 지평 $T$가 커질 때 어떻게 자라는가? (최선 팔이 하나뿐이고 평균의 차이가 있는 문제)'''
explanation = '''최선 팔을 정확히 알게 된 뒤에도 매 step 10% 확률로 무작위 팔을 고르므로, 매 step 평균 $\varepsilon \times$(팔들의 평균 격차)의 후회가 계속 쌓인다. 그래서 후회는 결국 $T$에 비례(선형)한다. 본문 실험에서는 1000 step마다 약 12였다. $\varepsilon$을 시간에 따라 줄이거나 UCB·Thompson sampling을 쓰면 $\log T$ 수준으로 줄일 수 있다.'''

[[questions.choices]]
text = "선형으로 자란다. 학습이 끝나도 일정 비율로 무작위 탐험을 계속하기 때문이다."
correct = true

[[questions.choices]]
text = '''$\log T$로 자란다. 결국 최선 팔을 알게 되기 때문이다.'''
feedback = "최선 팔을 알아도 ε만큼은 계속 무작위로 고른다. log T가 되려면 탐험의 빈도가 시간에 따라 줄어야 한다."

[[questions.choices]]
text = "일정한 값에서 멈춘다."
feedback = "ε이 고정이면 탐험이 멈추지 않으므로 후회도 멈추지 않는다. 후회가 유한한 상수에 머무는 알고리즘은 일반적인 밴딧에서 불가능하다(Lai–Robbins 하한)."

[[questions.choices]]
text = "탐험을 하므로 무작위 선택과 같은 속도로 자란다."
feedback = "ε-greedy는 90%는 탐욕 선택을 하므로 무작위 선택보다 기울기가 훨씬 작다(본문: 1000 step마다 약 12 대 120). 다만 둘 다 선형이다."

[[questions]]
id = "offline-overestimate"
type = "single"
objective = 2
prompt = '''오프라인 데이터에서 행동별 경험 평균 보상을 계산해 가장 큰 행동을 골랐다. 고른 행동은 데이터에 3번만 나왔다. 이 행동의 실제 가치에 대해 가장 알맞은 판단은?'''
explanation = '''표본이 적은 행동의 경험 평균은 잡음이 크고, 여러 행동 중 최댓값을 고르면 잡음 때문에 우연히 높게 나온 것을 고르게 된다(winner's curse). 본문 실험에서 탐욕 선택은 자기 가치를 0.84로 믿었지만 실제는 0.54였다. 오프라인에서는 그 행동을 실제로 해 보고 추정을 고칠 기회가 없으므로, 표본 수를 반영한 하한(보수적 추정)으로 판단하거나 추가 데이터를 모아야 한다.'''

[[questions.choices]]
text = "경험 평균이 실제 가치의 불편 추정이므로 그대로 믿어도 된다."
feedback = "고정된 한 행동의 경험 평균은 불편이지만, 여러 행동 중 '가장 큰 것을 고른 뒤'의 평균은 위로 치우친다. 선택이 편향을 만든다."

[[questions.choices]]
text = "선택 과정 때문에 과대평가되었을 가능성이 크다. 표본 수를 반영해 보수적으로 평가한다."
correct = true

[[questions.choices]]
text = "표본이 적으면 과소평가되는 경향이 있으므로 실제 가치는 더 높다."
feedback = "표본이 적다고 한쪽으로 치우치지는 않는다. 치우침은 최댓값을 고르는 선택에서 오고, 그 방향은 과대평가다."

[[questions.choices]]
text = "보상 잡음의 평균이 0이므로 선택과 상관없이 편향은 없다."
feedback = "잡음의 평균이 0이어도, 잡음이 크게 양수로 나온 행동이 선택될 확률이 높다. 선택된 행동만 보면 잡음의 평균은 양수다."

[[questions]]
id = "is-weight-numeric"
type = "numeric"
objective = 2
prompt = '''행동 정책은 매 step 두 행동을 확률 0.5씩 골랐다. 평가할 정책은 결정적이고, 기록된 궤적(3 step)의 행동이 매 step 평가할 정책이 고를 행동과 같았다. 이 궤적의 importance weight $\prod_t \pi_e(a_t \mid s_t)/\pi_b(a_t \mid s_t)$는?'''
answer = 8
tolerance = 0
slider = { min = 0, max = 16, step = 1 }
explanation = '''매 step 비는 $1/0.5 = 2$이고, 3 step이면 $2^3 = 8$이다. 한 행동이라도 평가할 정책과 달랐다면 그 step의 비가 $0/0.5 = 0$이 되어 궤적 전체의 가중치가 0이다. 그래서 결정적 정책을 평가하면 대부분의 궤적은 버려지고, 남은 소수의 궤적이 $2^H$의 큰 가중치를 받는다. 지평이 길수록 분산이 지수적으로 커지는 이유다.'''

[[questions]]
id = "ois-vs-wis"
type = "multiple"
objective = 2
prompt = '''오프 정책 평가의 보통 IS(OIS)와 가중 IS(WIS)에 대해 옳은 것을 모두 고르시오.'''
explanation = '''OIS는 지지 조건 아래 불편이지만 가중치의 곱 때문에 지평이 길면 분산이 매우 크다(본문 H=20에서 표준편차 12.26). WIS는 가중치의 합으로 나누어 분산이 훨씬 작지만 유한 표본에서 편향이 있다(본문 H=20에서 평균 15.61, 참값 16). 둘 다 평가할 정책이 고르는 행동을 행동 정책도 0보다 큰 확률로 골랐어야 한다. 행동 정책이 그 행동을 한 번도 하지 않았다면 어떤 가중법도 정보를 만들어 내지 못한다.'''

[[questions.choices]]
text = "OIS는 지지 조건 아래 불편이지만, 지평이 길면 분산이 지수적으로 커질 수 있다."
correct = true

[[questions.choices]]
text = "WIS는 유한 표본에서 편향이 있지만, 보통 OIS보다 분산이 작다."
correct = true

[[questions.choices]]
text = "WIS를 쓰면 행동 정책이 한 번도 고르지 않은 행동을 하는 정책도 평가할 수 있다."
feedback = "그런 행동이 들어간 궤적은 데이터에 없다. 정규화 방식을 바꿔도 없는 데이터의 정보는 생기지 않는다. 지지 조건은 두 추정량 모두에 필요하다."

[[questions.choices]]
text = "유효 표본 크기(ESS)가 충분히 크면 추정이 반드시 정확하다."
feedback = "ESS는 뽑힌 표본의 가중치로만 계산한다(11.6장). 행동 정책이 거의 가지 않은 곳에 큰 가치가 숨어 있으면 ESS는 그것을 알 수 없다. 낮은 ESS는 확실히 나쁜 신호지만, 높은 ESS가 안전을 보장하지는 않는다."

[[questions]]
id = "constrained-lagrangian"
type = "single"
objective = 3
prompt = '''평균 비용 예산이 있는 제약 문제를 Lagrangian $r - \lambda c$로 풀었다. 학습된 정책이 예산을 넘는 비용을 내고 있다. 쌍대 변수 $\lambda$를 어떻게 바꿔야 하는가?'''
explanation = '''$\lambda$는 비용 한 단위의 벌점이다. 제약을 어기면 벌점을 키워(λ 증가) 비용이 큰 행동을 덜 매력적으로 만들고, 여유가 있으면 줄여 보상을 더 추구한다. 이것이 쌍대 변수에 대한 기울기 상승(10.2장)이다. 최적의 $\lambda^*$는 예산을 한 단위 늘렸을 때 늘어나는 보상, 즉 그림자 가격이다. 본문 예에서는 $\lambda^* = 1$에서 두 조건을 섞어 예산을 정확히 맞췄다.'''

[[questions.choices]]
text = "λ를 키운다. 비용의 벌점을 늘려 비용이 큰 행동을 덜 고르게 한다."
correct = true

[[questions.choices]]
text = "λ를 줄인다. 보상을 더 중시해야 제약을 지킬 수 있다."
feedback = "λ를 줄이면 비용의 벌점이 작아져 비용이 큰 행동이 더 매력적이 된다. 위반이 커진다."

[[questions.choices]]
text = "λ를 0으로 두고 비용이 예산을 넘는 행동을 데이터에서 지운다."
feedback = "개별 행동을 금지하면 기댓값 제약 문제의 최적해(비용이 다른 행동의 혼합)를 잃을 수 있다. 본문에서 최적은 비용 0.4인 조건을 절반 섞는 정책이었다."

[[questions.choices]]
text = "λ는 문제의 상수이므로 바꾸지 않고 예산을 늘린다."
feedback = "예산은 문제의 정의이고, λ는 그 예산을 지키도록 조정하는 쌍대 변수다. 결과가 마음에 들지 않는다고 예산을 바꾸면 다른 문제를 푼 것이 된다."
