# 20.3 모델 기반 방법과 최적제어 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "lqr-is-dp"
type = "single"
objective = 1
prompt = '''LQR과 20.1장의 동적계획법의 관계로 옳은 것은?'''
explanation = '''선형 동역학과 이차 비용에서는 가치함수가 이차식 $V(\mathbf{x}) = \mathbf{x}^\top\mathbf{P}\mathbf{x}$로 유지되고, Bellman 방정식의 최소화가 닫힌 식으로 풀린다. 그 결과가 Riccati 방정식이고, Riccati 반복은 행렬 $\mathbf{P}$ 위의 가치 반복이다. 최적 정책은 상태의 선형 함수 $\mathbf{u} = -\mathbf{K}\mathbf{x}$다. 연속 상태를 격자로 나눌 필요가 없다.'''

[[questions.choices]]
text = "LQR은 가치함수가 이차식으로 유지되는 경우의 동적계획법이고, Riccati 반복이 가치 반복에 해당한다."
correct = true

[[questions.choices]]
text = "LQR은 상태가 연속이라 동적계획법과 관계가 없는 별개의 이론이다."
feedback = "Bellman 방정식에 이차 가치함수를 넣으면 Riccati 방정식이 바로 나온다. 같은 원리를 다른 공동체가 다른 이름으로 쓴 것이다."

[[questions.choices]]
text = "LQR을 풀려면 상태 공간을 격자로 나눠 가치 반복을 해야 한다."
feedback = "선형-이차 구조 덕분에 가치함수 전체가 행렬 P 하나로 정확히 표현된다. 격자가 필요 없다."

[[questions.choices]]
text = "LQR의 최적 정책은 상태마다 표로 저장해야 하는 비선형 함수다."
feedback = "최적 입력은 u = -Kx로 상태의 선형 함수다. 이득 행렬 K 하나가 정책 전체다."

[[questions]]
id = "lqr-gain-scalar"
type = "numeric"
objective = 1
prompt = '''스칼라 시스템 $x_{t+1} = x_t + u_t$, 비용 $\sum_t (x_t^2 + u_t^2)$의 무한 지평 LQR을 푼다. Riccati 방정식 $P = 1 + P - P^2/(1 + P)$의 양의 해에서 최적 이득 $K = P/(1 + P)$는? (소수 셋째 자리까지)'''
answer = 0.618
tolerance = 0.002
explanation = '''Riccati 방정식을 정리하면 $P^2/(1+P) = 1$, 즉 $P^2 - P - 1 = 0$이므로 $P = (1 + \sqrt{5})/2 \approx 1.618$이다. $K = P/(1+P) \approx 1.618/2.618 \approx 0.618$이고, 폐루프는 $x_{t+1} = (1 - K)x_t \approx 0.382\,x_t$로 안정하다. 입력 비용이 없다면 $K = 1$로 한 step에 원점으로 보내겠지만, 입력 비용 때문에 한 번에 다 가지 않는다. $K = 1.618$이라고 답했다면 $P$와 $K$를 혼동한 것이다.'''

[[questions]]
id = "receding-horizon"
type = "single"
objective = 2
prompt = '''MPC가 매 step $H$개의 입력열을 최적화하고도 **첫 입력만** 적용한 뒤 다음 step에 다시 푸는 주된 이유는?'''
explanation = '''receding horizon은 피드백을 만든다. 모형 오차나 외란 때문에 실제 상태가 예측과 달라지면, 다음 step의 계획이 새로 측정한 상태에서 시작해 그 차이를 바로 교정한다. 계획 전체를 개루프로 실행하면 예측이 틀린 만큼 그대로 벗어난다. 계산 비용은 오히려 늘고(매 step 다시 푼다), 첫 입력이 가장 정확하다는 보장도 없다.'''

[[questions.choices]]
text = "새로 측정한 상태에서 다시 계획해, 모형 오차와 외란을 매 step 교정하기 위해서다."
correct = true

[[questions.choices]]
text = "계산량을 줄이기 위해서다."
feedback = "매 step 최적화를 새로 하므로 계산량은 계획을 한 번 하고 끝까지 실행하는 것보다 많다."

[[questions.choices]]
text = "입력열의 뒷부분은 제약을 어기기 때문이다."
feedback = "최적화된 입력열 전체가 (모형 위에서) 제약을 만족한다. 버리는 이유는 제약이 아니라 새 정보를 반영하기 위해서다."

[[questions.choices]]
text = "첫 입력만 최적이고 나머지는 근사이기 때문이다."
feedback = "유한 지평 문제의 해는 입력열 전체가 함께 최적이다. 다만 실제 상태가 예측과 달라지면 뒷부분은 더 이상 최적이 아니게 된다."

[[questions]]
id = "model-error-compounding"
type = "single"
objective = 2
prompt = '''진자 데이터로 적합한 동역학 모형의 1 step 예측 오차가 0.005 rad로 작았다. 이 모형으로 40 step 앞까지 계획하는 MPC를 만들려 한다. 가장 알맞은 판단은?'''
explanation = '''계획은 모형을 자기 예측 위에서 여러 step 굴리므로 1 step 오차가 쌓이고 동역학을 따라 증폭된다. 본문의 선형 회귀 모형은 1 step 오차가 0.005 rad였지만 40 step 굴리면 최대 오차가 평균 0.47 rad였다. 계획에 쓸 모형은 계획 지평만큼 굴린 오차로 검증해야 한다. 오차가 크면 지평을 줄이거나, 모형 구조를 고치거나, 불확실성을 반영해 계획한다.'''

[[questions.choices]]
text = "1 step 오차가 작으므로 40 step 계획에도 충분히 정확하다."
feedback = "오차는 step마다 다음 예측의 입력이 되어 쌓인다. 본문에서 같은 모형의 40 step 오차는 약 100배였다."

[[questions.choices]]
text = "모형을 40 step 굴린 예측 오차로 다시 검증하고, 크면 지평이나 모형 구조를 바꾼다."
correct = true

[[questions.choices]]
text = "MPC는 매 step 재계획하므로 모형 오차는 결과에 영향을 주지 않는다."
feedback = "재계획은 오차를 교정하지만 없애지 않는다. 계획 자체가 틀린 예측 위에서 만들어지면 정상 상태 오차나 제약 위반이 생긴다(실습의 선형 모형)."

[[questions.choices]]
text = "데이터를 더 모아 1 step 오차를 더 줄이면 문제가 해결된다."
feedback = "모형 구조가 틀리면(선형 모형으로 sin θ를 근사) 데이터를 늘려도 체계적 편향은 남고, 그 편향이 여러 step에 걸쳐 쌓인다."

[[questions]]
id = "mpc-vs-rl"
type = "multiple"
objective = 1
prompt = '''같은 제어 문제를 MPC(모형 사용)와 model-free RL로 풀 때의 비교로 옳은 것을 모두 고르시오.'''
explanation = '''MPC는 모형이 있으면 시행착오 없이 계획하므로 실제 상호작용이 거의 필요 없고, 제약을 최적화 문제 안에서 명시적으로 다룬다. 대신 매 step 최적화를 풀어야 해 실행 시간 계산이 크고, 성능이 모형의 정확도에 묶인다. model-free RL은 모형이 필요 없지만 상호작용이 많이 필요하고, 학습된 정책의 실행은 신경망 forward 한 번이라 빠르다. 제약은 보상 벌점 등으로 간접적으로만 다룬다.'''

[[questions.choices]]
text = "MPC는 모형이 정확하면 실제 시스템과의 상호작용이 거의 없이도 동작한다."
correct = true

[[questions.choices]]
text = "MPC는 상태·입력 제약을 최적화 문제 안에서 명시적으로 다룰 수 있다."
correct = true

[[questions.choices]]
text = "model-free RL은 실행 시점에 매 step 최적화를 풀어야 하므로 MPC보다 느리다."
feedback = "반대다. 학습된 정책은 실행 시 함수 계산 한 번이다. 매 step 최적화를 푸는 것은 MPC다."

[[questions.choices]]
text = "MPC의 성능은 모형의 정확도와 무관하다."
feedback = "MPC는 모형 위에서 계획하므로 모형 오차가 곧 계획 오차다. 실습에서 선형 모형은 정상 상태 오차가 두 배였다."

[[questions]]
id = "diffsim-exploding"
type = "single"
objective = 1
prompt = '''미분가능 시뮬레이터로 지평 80 step의 비용을 입력에 대해 미분했더니, 시스템이 뒤집힌 진자처럼 불안정할 때 기울기가 $10^{17}$ 수준이 되었다. 가장 알맞은 설명은?'''
explanation = '''수반 변수는 $\boldsymbol{\lambda}_t = \nabla c_t + (\partial f/\partial\mathbf{x})^\top\boldsymbol{\lambda}_{t+1}$로 거꾸로 전파된다. $\partial f/\partial\mathbf{x}$의 고윳값 크기가 1보다 크면(불안정) 전파될 때마다 곱해져 지평에 대해 지수적으로 커진다. 기울기 계산이 틀린 것이 아니라 시스템의 민감도가 실제로 그만큼 크다. 대응은 지평을 짧게 나누거나, 기울기를 자르거나, MPC처럼 짧은 지평을 반복하는 것이다.'''

[[questions.choices]]
text = "자동미분 구현에 버그가 있다. 정확한 기울기는 이렇게 커질 수 없다."
feedback = "본문에서 수반법 기울기는 유한차분과 일치했다. 불안정한 시스템에서는 초기 입력의 작은 변화가 실제로 지수적으로 증폭된다."

[[questions.choices]]
text = "불안정한 동역학의 Jacobian이 역방향 전파에서 반복해서 곱해져 지평에 대해 지수적으로 커진다."
correct = true

[[questions.choices]]
text = "학습률이 너무 커서 기울기가 커졌다."
feedback = "학습률은 기울기를 쓴 뒤의 갱신 크기에 영향을 줄 뿐, 기울기 자체의 크기를 바꾸지 않는다."

[[questions.choices]]
text = "부동소수점 반올림 오차가 쌓였다."
feedback = "반올림 오차는 상대적으로 작은 크기다. 10^17이라는 크기는 동역학의 고윳값이 지평만큼 거듭제곱된 결과다."
