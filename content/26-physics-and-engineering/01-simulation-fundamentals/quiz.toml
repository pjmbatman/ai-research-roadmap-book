# 26.1 ML 연구자를 위한 연속체 역학과 시뮬레이션 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "conservative-shock-speed"
type = "single"
objective = 1
prompt = '''Burgers 방정식을 $u_t + (u^2/2)_x = 0$(보존형)과 $u_t + u\,u_x = 0$(비보존형)으로 각각 같은 upwind 차분으로 이산화했다. 왼쪽 $u = 1$, 오른쪽 $u = 0$인 계단 초기조건에서 옳은 것은?'''
explanation = '''매끄러운 해에서는 두 식이 같지만, 충격파 속도는 적분형(보존 법칙)에서 나오는 Rankine–Hugoniot 조건이 정한다. 이 경우 속도는 $(1 + 0)/2 = 0.5$다. 보존형 이산화는 셀 사이 유속을 주고받아 적분형을 이산적으로 지키므로 올바른 속도로 수렴한다(Lax–Wendroff 정리). 비보존형은 충격파 앞 셀에서 $u\,u_x = 0$이라 충격파가 움직이지 않고, 격자를 줄여도 이 오류는 사라지지 않는다.'''

[[questions.choices]]
text = "보존형은 충격파를 속도 0.5로 옮기고, 비보존형은 격자를 줄여도 틀린 속도를 준다."
correct = true

[[questions.choices]]
text = "두 식은 수학적으로 같으므로 격자를 충분히 줄이면 두 방법 모두 같은 해로 수렴한다."
feedback = "두 식이 같은 것은 해가 미분 가능한 곳에서뿐이다. 불연속에서는 적분형만 의미가 있고, 비보존형 차분은 그 적분형을 지키지 않는다."

[[questions.choices]]
text = "비보존형이 더 정확하다. u u_x가 충격파 근처의 기울기를 직접 반영하기 때문이다."
feedback = "충격파 앞 셀의 u가 0이라 u u_x 항이 0이 되고, 충격파가 출발점에 멈춘다. 본문 셀 1에서 확인할 수 있다."

[[questions.choices]]
text = "차이는 시간 간격 때문이므로 CFL 수를 줄이면 두 방법이 일치한다."
feedback = "시간 간격을 줄여도 비보존형 차분이 놓친 유속 균형은 돌아오지 않는다. 문제는 안정성이 아니라 이산화의 형태다."

[[questions]]
id = "pipe-reynolds-number"
type = "numeric"
objective = 1
prompt = '''지름 2 cm인 관에서 물($\nu = 1.0\times10^{-6}$ m²/s)이 평균 속도 0.5 m/s로 흐른다. 지름을 대표 길이로 쓴 Reynolds 수 $\mathrm{Re} = UD/\nu$는?'''
answer = 10000
tolerance = 1
explanation = '''$\mathrm{Re} = 0.5\ \text{m/s} \times 0.02\ \text{m} / (1.0\times10^{-6}\ \text{m}^2/\text{s}) = 10000$이다. 단위가 모두 상쇄되어 무차원이 된다. cm를 m로 바꾸지 않으면 100배 큰 값이 나온다. 원관 유동의 전이 기준으로 흔히 쓰는 2300보다 훨씬 크므로 보통의 조건에서는 난류로 예상한다.'''

[[questions]]
id = "same-reynolds-similarity"
type = "multiple"
objective = 1
prompt = '''점성 Burgers 문제의 기준 조건이 $U = 1$ m/s, $L = 1$ m, $\nu = 0.01$ m²/s다. 다음 중 기준 조건과 **같은 무차원 해**를 주는 조건을 모두 고르시오.'''
explanation = '''무차원화한 방정식에 남는 파라미터는 $\mathrm{Re} = UL/\nu$ 하나이므로 Re가 같으면 무차원 해가 같다. 기준은 Re = 100이다. (2 m/s, 0.5 m, 0.01)과 (2 m/s, 1 m, 0.02)는 Re = 100이다. (2 m/s, 1 m, 0.01)은 Re = 200, (1 m/s, 2 m, 0.005)는 Re = 400이다. 길이를 늘리고 점성을 줄이면 서로 상쇄될 것 같지만, 둘 다 Re를 키우는 방향이다.'''

[[questions.choices]]
text = "U = 2 m/s, L = 0.5 m, ν = 0.01 m²/s"
correct = true

[[questions.choices]]
text = "U = 2 m/s, L = 1 m, ν = 0.02 m²/s"
correct = true

[[questions.choices]]
text = "U = 2 m/s, L = 1 m, ν = 0.01 m²/s"
feedback = "속도만 두 배가 되어 Re = 200이다. 같은 방정식이라도 Re가 다르면 무차원 해의 모양이 달라진다."

[[questions.choices]]
text = "U = 1 m/s, L = 2 m, ν = 0.005 m²/s"
feedback = "L은 분자, ν는 분모에 있으므로 길이를 늘리고 점성을 줄이면 Re가 4배(400)가 된다. 상쇄되지 않는다."

[[questions]]
id = "max-grid-spacing-peclet"
type = "numeric"
objective = 3
prompt = '''정상 이류-확산 방정식을 2차 중심차분으로 풀려 한다. 유속 $U = 0.2$ m/s, 확산계수 $D = 1.0\times10^{-3}$ m²/s일 때, 격자 Péclet 수 $U\Delta x/D$가 2를 넘지 않게 하는 최대 격자 간격 $\Delta x$는 몇 mm인가?'''
answer = 10
tolerance = 0.5
slider = { min = 1, max = 40, step = 1, unit = "mm" }
explanation = '''$\Delta x \le 2D/U = 2 \times 10^{-3} / 0.2 = 0.01$ m $= 10$ mm다. 이보다 큰 간격에서는 중심차분 해가 진동해 0과 1 사이에 있어야 할 농도가 음수가 될 수 있다. solver는 이 경우에도 선형계를 정확히 풀었으므로 "수렴"을 보고한다.'''

[[questions]]
id = "unconverged-training-data"
type = "single"
objective = 3
prompt = '''한 연구가 격자 하나로 만든 시뮬레이션 데이터로 대리 모델을 학습해 "시뮬레이션 대비 상대 오차 0.5%"를 보고했다. 같은 조건의 격자 수렴 연구를 해 보니 그 격자의 출력량 이산화 오차는 약 6%였다. 가장 타당한 해석은?'''
explanation = '''대리 모델은 그 격자의 시뮬레이션 출력을 0.5% 이내로 흉내 낸다. 그러나 그 출력 자체가 수렴값과 6% 다르므로, 물리적 참값에 대한 모델의 오차는 6% 수준이다. 이산화 오차는 체계적이어서 데이터를 더 모아도 줄지 않는다. 대리 모델의 정확도를 주장하려면 데이터의 이산화 오차를 함께 보고하고, 가능하면 수렴한 격자로 만든 기준과 비교한다.'''

[[questions.choices]]
text = "모델은 그 격자의 출력을 잘 흉내 낼 뿐이고, 물리적 참값에 대한 오차는 데이터의 이산화 오차(약 6%)보다 작다고 말할 수 없다."
correct = true

[[questions.choices]]
text = "모델 오차가 0.5%이므로 물리적 참값에 대해서도 0.5% 정확하다."
feedback = "모델의 기준이 된 데이터가 참값에서 6% 떨어져 있다. 기준이 틀리면 기준에 대한 작은 오차는 참값에 대한 정확도를 보장하지 않는다."

[[questions.choices]]
text = "학습 데이터를 열 배로 늘리면 이산화 오차가 평균으로 상쇄되어 문제가 사라진다."
feedback = "이산화 오차는 무작위 잡음이 아니라 같은 격자에서 같은 방향으로 생기는 체계적 오차다. 표본을 늘려도 평균으로 사라지지 않는다."

[[questions.choices]]
text = "모델이 이산화 오차를 보정해 시뮬레이션보다 참값에 더 가까울 가능성이 크다."
feedback = "모델은 이 격자의 출력만 보고 학습했으므로 참값에 대한 정보가 없다. 이산화 오차를 보정할 근거가 데이터에 없다."

[[questions]]
id = "verification-before-validation"
type = "single"
objective = 2
prompt = '''한 시뮬레이션이 거친 격자에서는 풍동 실험의 항력 계수와 1% 이내로 맞았는데, 격자를 두 배로 줄이자 8% 벗어났다. 다음 단계로 가장 적절한 것은?'''
explanation = '''거친 격자에서의 일치는 이산화 오차가 모델 오차(난류 모델, 경계조건 등)를 우연히 상쇄한 결과일 수 있다. 실험과의 비교(확인, validation)에 앞서 격자 수렴 연구로 이산화 오차를 정량화하는 것(검증, verification)이 먼저다. 수렴한 해와 실험의 차이가 비로소 수학 모델의 오차다.'''

[[questions.choices]]
text = "격자 수렴 연구로 이산화 오차를 먼저 정량화하고, 수렴한 해를 실험과 비교한다."
correct = true

[[questions.choices]]
text = "실험과 잘 맞은 거친 격자를 표준 설정으로 정하고 데이터 생성에 쓴다."
feedback = "실험과의 일치가 격자에 따라 사라졌다면 그 일치는 오차들의 상쇄일 가능성이 크다. 다른 조건에서는 같은 상쇄가 일어난다는 보장이 없다."

[[questions.choices]]
text = "고운 격자 결과가 실험과 다르므로 고운 격자 설정에 오류가 있다고 보고 거친 격자로 돌아간다."
feedback = "고운 격자가 실험에서 멀어졌다는 사실은 오히려 수학 모델(난류 모델 등)의 오차를 드러낸 것일 수 있다. 판단은 수렴 연구 뒤에 한다."
