# 26.5 시뮬레이션 학습의 벤치마크와 평가 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "one-step-not-enough"
type = "single"
objective = 1
prompt = '''두 학습 시뮬레이터의 한 step 상대 오차가 0.0028과 0.0029로 거의 같다. 이 결과로부터 말할 수 있는 것은?'''
explanation = '''한 step 오차는 정답 상태를 입력으로 줄 때의 오차다. rollout에서는 모델이 자기 예측을 다시 입력으로 받으므로, 학습 분포 밖으로 밀려난 입력에서의 행동이 결과를 정한다. 본문에서 한 step 오차가 같은 두 모델 중 하나는 시험 궤적의 1/3이 발산했고, 다른 하나는 하나도 발산하지 않았다. rollout 오차, 발산 비율, 물리 검사를 따로 재야 한다.'''

[[questions.choices]]
text = "긴 rollout에서의 정확도와 안정성에 대해서는 거의 아무것도 말할 수 없다."
correct = true

[[questions.choices]]
text = "rollout 오차도 거의 같을 것이다. 오차는 step 수에 비례해 누적되기 때문이다."
feedback = "오차는 선형으로 더해지지 않는다. 자기 예측을 입력으로 받는 되먹임 때문에 모델마다 증폭 정도가 크게 다르다."

[[questions.choices]]
text = "파라미터가 적은 모델이 rollout에서 항상 더 안정하다."
feedback = "본문에서는 그랬지만 일반 법칙이 아니다. 같은 파라미터 3개 모델도 학습 범위 밖의 점성에서는 모두 발산했다. 안정성은 측정해야 안다."

[[questions]]
id = "trajectory-split"
type = "single"
objective = 2
prompt = '''궤적 36개에서 얻은 (현재 상태, 다음 상태) 쌍 1800개를 무작위로 섞어 80%를 학습, 20%를 시험에 썼다. 이 분할의 문제는?'''
explanation = '''같은 궤적의 인접한 상태는 매우 비슷하다. 쌍을 무작위로 나누면 시험 쌍의 바로 앞뒤 상태가 학습에 들어가 있어, 모델이 새 초기조건을 일반화하는지가 아니라 이미 본 궤적을 보간하는지를 재게 된다. 시험 오차가 낙관적이 된다. 최소한 궤적 단위로 나누고, 일반화를 주장하려면 OOD 축(파라미터, 초기조건 종류, 해상도) 단위로 나눈다.'''

[[questions.choices]]
text = "같은 궤적의 인접 상태가 학습과 시험에 나뉘어 들어가 시험 오차가 낙관적이 된다."
correct = true

[[questions.choices]]
text = "문제없다. 쌍마다 입력과 출력이 다르므로 서로 독립인 표본이다."
feedback = "입력이 다르다고 독립은 아니다. 같은 궤적의 연속된 상태는 강하게 상관되어 있다."

[[questions.choices]]
text = "시험 비율 20%가 너무 작아 오차 추정의 분산이 크다는 것이 주된 문제다."
feedback = "표본 수보다 표본의 독립성이 문제다. 쌍을 아무리 많이 시험해도 학습 궤적과 겹치면 일반화를 재지 못한다."

[[questions]]
id = "high-wavenumber-energy"
type = "single"
objective = 1
prompt = '''$t = 1$에서 파수 8 이상의 에너지 비율을 기준 시뮬레이터와 비교했더니, 모델 A는 기준의 22배, 모델 B는 0.43배였다. 옳은 해석은?'''
explanation = '''고파수 에너지가 기준보다 훨씬 많다는 것은 기준에 없는 작은 규모의 진동을 만들었다는 뜻이고, 흔히 발산의 전조다. 기준보다 적다는 것은 작은 규모를 뭉갠다(과도한 소산)는 뜻이다. 장의 L² 오차는 에너지가 큰 저파수 오차가 지배하므로, 이런 차이를 잘 드러내지 못한다. 두 모델은 서로 반대 방향의 약점을 가진다.'''

[[questions.choices]]
text = "A는 비물리적 고파수 진동을 만들고, B는 작은 규모를 기준보다 뭉갠다."
correct = true

[[questions.choices]]
text = "A가 작은 규모를 더 잘 해상하므로 더 정확하다."
feedback = "기준 시뮬레이터보다 22배 많은 고파수 에너지는 해상이 아니라 기준에 없는 진동이다. 기준과 같은 값이 정확한 것이다."

[[questions.choices]]
text = "장의 L² 오차가 작다면 스펙트럼 차이는 무시해도 된다."
feedback = "L² 오차는 에너지가 큰 저파수에 지배된다. 고파수의 큰 상대 오차는 L² 오차에 거의 나타나지 않으면서 장기 안정성과 물리량(소산율 등)을 바꾼다."

[[questions]]
id = "explicit-stability-ood"
type = "numeric"
objective = 2
prompt = '''학습된 보존형 모델의 확산 항이 한 step에 $r = c\,\nu$(학습된 계수 $c = 3.4$)만큼의 explicit 확산 갱신을 한다. explicit 확산의 안정 조건 $r \le 1/2$을 지키는 가장 큰 점성 $\nu$는? (소수 셋째 자리까지)'''
answer = 0.147
tolerance = 0.002
explanation = '''$\nu \le 0.5 / 3.4 \approx 0.147$이다. 학습 범위가 $\nu \le 0.1$이면 $r \le 0.34$로 안전하지만, $\nu = 0.3$에서는 $r \approx 1.0$이 되어 rollout이 발산한다. 학습된 계수 자체는 학습 범위에서 정확했다. 문제는 그 계수가 explicit 갱신 안에서 쓰인다는 구조이고, 이는 한 step 오차로는 드러나지 않는다.'''

[[questions]]
id = "strong-baseline"
type = "single"
objective = 2
prompt = '''학습된 시뮬레이터가 고해상도 solver보다 100배 빠르고 $t = 1$ 오차가 7%다. 같은 계산 시간이 드는 절반 해상도 solver의 오차는 11%다. 가장 타당한 결론은?'''
explanation = '''같은 계산 예산에서 비교하면 학습 모델의 이득은 "100배 빠름"이 아니라 "같은 비용에서 오차 7% 대 11%"다. 게다가 본문 실습처럼 수치 baseline은 OOD 조건에서도 발산하지 않고 비슷한 오차를 유지할 수 있다. 공정한 보고는 같은 비용의 가장 좋은 수치 설정과의 비교, 그리고 OOD 축에서의 비교를 함께 담는다.'''

[[questions.choices]]
text = "같은 비용에서의 이득은 오차 7% 대 11%이고, OOD 조건에서의 비교도 함께 봐야 한다."
correct = true

[[questions.choices]]
text = "고해상도 solver보다 100배 빠르므로 100배의 속도 이득을 보고한다."
feedback = "고해상도 solver는 학습 모델보다 훨씬 정확한 답을 낸다. 정확도가 다른 두 방법의 시간 비는 이득이 아니다."

[[questions.choices]]
text = "절반 해상도 solver는 학습 모델보다 부정확하므로 비교할 필요가 없다."
feedback = "같은 비용의 수치 baseline과의 차이가 학습 모델의 실제 기여다. 이 비교를 빼는 것이 약한 baseline 문제의 핵심이다."

[[questions]]
id = "ood-axes"
type = "multiple"
objective = 2
prompt = '''학습된 유동 시뮬레이터의 일반화를 주장하려 한다. 다음 중 **OOD 시험으로 의미 있는** 것을 모두 고르시오.'''
explanation = '''일반화는 학습 분포에서 어느 축을 따라 벗어났는지로 기술한다. 학습 범위 밖의 Reynolds 수, 학습에 없던 형상, 다른 해상도, 학습 rollout보다 긴 시간 지평은 모두 의미 있는 OOD 축이다. 같은 분포에서 시드만 바꾼 초기조건은 분포 안(in-distribution) 시험이다. 필요하지만 일반화의 증거는 아니다.'''

[[questions.choices]]
text = "학습 범위 밖의 Reynolds 수"
correct = true

[[questions.choices]]
text = "학습에 없던 형상(예: 다른 단면의 장애물)"
correct = true

[[questions.choices]]
text = "학습과 다른 격자 해상도"
correct = true

[[questions.choices]]
text = "같은 분포에서 무작위 시드만 바꾼 초기조건"
feedback = "같은 분포의 새 표본은 분포 안 시험이다. 궤적 단위 분할로 꼭 해야 하지만, 일반화를 주장하는 근거는 되지 못한다."
