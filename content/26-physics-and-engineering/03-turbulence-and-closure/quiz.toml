# 26.3 난류와 closure 모델 학습 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "filtered-product-stress"
type = "numeric"
objective = 1
prompt = '''고해상도 격자의 두 칸 값이 $u = 1, 3$이고, 이 두 칸을 평균해 거친 격자의 한 칸을 만든다. subgrid 응력 $\tau = \tfrac{1}{2}(\overline{u^2} - \bar{u}^2)$는?'''
answer = 0.5
tolerance = 0.01
explanation = '''$\bar{u} = 2$, $\overline{u^2} = (1 + 9)/2 = 5$이므로 $\tau = (5 - 4)/2 = 0.5$다. 평균의 제곱($\bar{u}^2 = 4$)과 제곱의 평균($\overline{u^2} = 5$)이 다르다는 것이 closure 문제의 출발점이다. 블록 평균 필터에서 이 차이는 블록 안의 분산이므로 음수가 될 수 없다.'''

[[questions]]
id = "realizability-of-tau"
type = "single"
objective = 1
prompt = '''블록 평균 필터로 정의한 Burgers 방정식의 subgrid 응력 $\tau = \tfrac{1}{2}(\overline{u^2} - \bar{u}^2)$에 대해, 학습된 closure가 반드시 만족해야 하는 성질은?'''
explanation = '''블록 평균 필터에서 $\overline{u^2} - \bar{u}^2$은 블록 안 값들의 분산이므로 $\tau \ge 0$이다(실현성). 3차원에서는 $\tau_{ij}$가 양의 준정부호여야 한다는 같은 조건이 된다. $\tau$의 부호는 $\bar{u}_x$와 무관하고, $\tau$가 작다는 것은 블록 안 변동이 작다는 뜻일 뿐 항상 성립하는 성질이 아니다.'''

[[questions.choices]]
text = "모든 점에서 τ ≥ 0이다."
correct = true

[[questions.choices]]
text = "τ의 부호는 기울기 ū_x의 부호와 반대다."
feedback = "그것은 Smagorinsky 모델 τ = −ν_t ū_x가 가정하는 꼴이다. 참 τ는 분산이라 ū_x의 부호와 관계없이 0 이상이다."

[[questions.choices]]
text = "τ의 공간 평균은 0이다."
feedback = "τ는 모든 점에서 0 이상이고 블록 안 변동이 있으면 양수이므로 평균도 양수다. 주기 경계에서 평균이 0인 것은 τ의 기울기 τ_x다."

[[questions.choices]]
text = "τ는 이류항 (ū²/2)_x보다 항상 한 자릿수 이상 작다."
feedback = "크기 비는 필터 폭, Re, 흐름 상태에 따라 달라진다. 본문에서는 약 5%였지만 일반적인 성질이 아니다."

[[questions]]
id = "a-priori-not-enough"
type = "single"
objective = 2
prompt = '''closure 후보 A는 시험 데이터에서 $\tau$ 예측의 상대 오차가 0.20, 후보 B는 0.68이다. 두 후보 중 하나를 LES에 쓰려 한다. 가장 적절한 판단은?'''
explanation = '''a priori 오차는 걸러 낸 데이터에서 τ를 얼마나 맞추는지를 잴 뿐이다. 결합 후에는 모델이 자기 오차로 바뀐 입력을 다시 받고, a priori 목표에 없는 거친 격자의 이산화 오차까지 영향을 준다. 본문과 실습에서 a priori 오차가 세 배 이상 작은 MLP가 결합 후 Smagorinsky보다 나빴다. 선택은 solver에 결합한 a posteriori 평가로 한다.'''

[[questions.choices]]
text = "두 후보를 solver에 결합해 a posteriori 정확도와 안정성을 비교한 뒤 고른다."
correct = true

[[questions.choices]]
text = "A를 고른다. τ를 세 배 정확하게 맞추므로 결합 후에도 더 정확하다."
feedback = "a priori 정확도와 결합 후 정확도의 순위는 뒤집힐 수 있다. 본문 셀 2와 셀 3이 그 예다."

[[questions.choices]]
text = "B를 고른다. a priori 오차가 큰 모델이 결합 후에 더 안정하다."
feedback = "a priori 오차의 크기 자체가 안정성을 주지는 않는다. 안정성은 모델이 에너지를 어떻게 주고받는지, 학습 범위 밖 입력에서 어떻게 행동하는지에 달려 있고, 결합해 봐야 안다."

[[questions]]
id = "eddy-viscosity-dissipation"
type = "single"
objective = 2
prompt = '''$\tau = -\nu_t\,\bar{u}_x$, $\nu_t \ge 0$ 꼴의 closure(eddy viscosity)를 쓰면 closure가 해상된 운동에너지에 주는 효과 $\int \tau\,\bar{u}_x\,dx$에 대해 옳은 것은?'''
explanation = '''$\int \tau\,\bar{u}_x\,dx = -\int \nu_t\,\bar{u}_x^2\,dx \le 0$이므로 closure는 항상 에너지를 빼앗는다(소산). 그래서 결합 후 에너지가 쌓여 발산하는 일을 구조적으로 막는다. 대가는 작은 규모가 에너지를 큰 규모로 되돌리는 역산란을 표현할 수 없다는 것이다.'''

[[questions.choices]]
text = "항상 0 이하다. 에너지를 소산시키기만 하고 역산란은 표현하지 못한다."
correct = true

[[questions.choices]]
text = "학습한 ν_t에 따라 양수도 음수도 될 수 있다."
feedback = "ν_t ≥ 0이고 ū_x²도 0 이상이므로 적분은 0 이하로 고정된다. 부호를 자유롭게 하려면 ν_t < 0을 허용해야 한다."

[[questions.choices]]
text = "항상 0이다. 주기 경계에서 기울기 항의 적분은 사라진다."
feedback = "주기 경계에서 사라지는 것은 τ_x 자체의 적분이다. 에너지에 대한 효과는 ū와 곱한 적분이고, 부분적분하면 −∫ν_t ū_x² dx가 된다."

[[questions]]
id = "inviscid-limit-check"
type = "multiple"
objective = 3
prompt = '''점성이 없는 극한($\nu = 0$)에서는 고해상도 기준 해를 만들 수 없다. 거친 격자 Burgers 시뮬레이션의 closure를 이 조건에서 점검할 때, 기준 해 없이 **실패의 근거**가 되는 관측을 모두 고르시오.'''
explanation = '''점성 없는 Burgers 방정식의 올바른(엔트로피) 해는 충격파에서 에너지를 잃고, 새 극값을 만들지 않는다. 따라서 에너지가 정확히 보존되거나 늘어나는 것, 최댓값이 초기 최댓값을 넘는 것은 모두 실패의 신호다. 에너지가 감소하는 것은 올바른 방향이지만, 감소량이 맞는지는 기준 해 없이는 알 수 없다. 물리 검사는 실패를 찾을 뿐 정확도를 보장하지 않는다.'''

[[questions.choices]]
text = "운동에너지가 시간에 따라 정확히 보존된다."
correct = true

[[questions.choices]]
text = "최댓값이 초기 최댓값보다 커진다."
correct = true

[[questions.choices]]
text = "운동에너지가 시간에 따라 감소한다."
feedback = "충격파가 있는 점성 없는 Burgers 해는 에너지를 잃어야 하므로 감소는 올바른 방향이다. 실패의 근거가 아니다."

[[questions.choices]]
text = "closure가 없는 시뮬레이션과 결과가 다르다."
feedback = "closure가 없는 거친 격자 해가 오히려 틀렸다(에너지 보존, 최댓값 증가). 다르다는 사실만으로는 어느 쪽이 맞는지 말할 수 없다."

[[questions]]
id = "galilean-invariant-features"
type = "single"
objective = 3
prompt = '''closure 입력 특징으로 $\bar{u}_x$, $\bar{u}\,\bar{u}_x$, $\bar{u}^2$을 쓴다. 학습 데이터의 평균 속도가 0인데, 적용할 흐름은 전체가 일정 속도 $V$로 움직인다(Galilean 변환). 어떤 문제가 생기는가?'''
explanation = '''Galilean 변환 $u \to u + V$에서 블록 안 분산인 참 $\tau$와 기울기 $\bar{u}_x$는 변하지 않는다. 그러나 $\bar{u}\,\bar{u}_x$와 $\bar{u}^2$은 $V$에 따라 바뀐다. 이 특징을 쓰는 모델은 물리적으로 같은 흐름에 다른 τ를 예측하고, 학습 범위 밖의 값을 받는다. 특징을 변환에 불변인 양으로 만들면 구조로 피할 수 있다.'''

[[questions.choices]]
text = "참 τ는 V와 무관한데 ū ū_x와 ū² 특징은 V에 따라 바뀌어, 같은 흐름에 다른 τ를 예측한다."
correct = true

[[questions.choices]]
text = "문제없다. 모든 특징이 국소 양이므로 평행이동에 불변이다."
feedback = "공간 평행이동과 속도 변환(Galilean)은 다르다. 국소 특징은 공간 평행이동에는 등변이지만, ū가 들어간 특징은 속도를 더하면 값이 바뀐다."

[[questions.choices]]
text = "참 τ가 V²에 비례해 커지므로 ū² 특징이 오히려 필요하다."
feedback = "τ는 블록 안 분산이라 모든 값에 V를 더해도 변하지 않는다."
