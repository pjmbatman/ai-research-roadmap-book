# 23.5 실험 설계 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "paired-seed-count"
type = "numeric"
objective = 1
prompt = "같은 분할·seed에서 두 방법을 짝지어 비교한다. 짝지은 차이의 표준편차는 0.012이고, 검출하고 싶은 최소 개선은 0.01이다. 양측 $\\alpha = 0.05$, 검정력 80%에 필요한 실행(짝) 수를 정규 근사 $n = \\big((z_{0.975} + z_{0.8})\\,\\sigma_d / \\delta\\big)^2$로 계산하고 올림하면? ($z_{0.975} \\approx 1.96$, $z_{0.8} \\approx 0.84$)"
explanation = "$n = (2.80 \\times 0.012 / 0.01)^2 = (3.36)^2 \\approx 11.3$이므로 12쌍이다. 정규 근사는 $t$ 분포의 두꺼운 꼬리를 무시하므로 실제로는 한두 개 더 필요하다. 짝짓지 않고 방법마다 따로 돌리면, 본문 예(실행 간 표준편차 0.02)에서는 차이의 표준편차가 $\\sqrt{2} \\times 0.02$가 되어 방법당 60개가 넘게 필요하다. seed 3–5개로는 이 크기의 개선을 반증할 수도, 확인할 수도 없다."
answer = 12
tolerance = 0

[[questions]]
id = "uncontrolled-comparison"
type = "single"
objective = 1
prompt = "제안 방법은 새로 정제한 데이터 판(v2)으로 학습해 test 정확도 0.87을 얻었고, baseline의 0.84는 원 논문(v1 데이터)의 표에서 가져왔다. '제안 방법이 3%p 낫다'는 결론의 가장 큰 문제는?"
explanation = "두 숫자 사이에 방법 말고도 데이터 판이 달라졌다. 통제 변수(데이터 판, 분할, 학습 예산, 환경)가 하나라도 다르면 차이를 방법의 효과로 돌릴 수 없다. baseline을 v2 데이터에서 같은 분할·예산으로 다시 돌려야 한다. 데이터 정제만으로 3%p가 오를 수도 있다."

[[questions.choices]]
text = "방법과 데이터 판이 함께 바뀌어, 차이가 어느 쪽에서 왔는지 알 수 없다. baseline을 같은 데이터·분할·예산으로 다시 돌려야 한다."
correct = true

[[questions.choices]]
text = "원 논문의 숫자는 심사를 거쳤으므로 그대로 비교해도 된다."
feedback = "숫자 자체가 맞더라도 다른 조건에서 나온 숫자다. 비교는 같은 조건에서만 의미가 있다."

[[questions.choices]]
text = "seed가 하나뿐인 것이 유일한 문제다."
feedback = "seed 변동도 문제지만, seed를 늘려도 데이터 판의 차이는 그대로 남는다. 통제되지 않은 변수가 더 근본적인 문제다."

[[questions]]
id = "tuning-budget"
type = "single"
objective = 2
prompt = "제안 방법은 하이퍼파라미터를 50번 탐색했고 baseline은 기본 설정과 몇 가지 값으로 5번 탐색했다. 본문의 시뮬레이션에서 두 방법이 **같은** 방법이어도 이 조건이면 test 점수에 약 +0.02의 차이가 났다. 이 비교를 공정하게 만드는 방법으로 가장 적절한 것은?"
explanation = "탐색 예산이 다르면 더 많이 탐색한 쪽이 validation 잡음과 설정 간 차이 덕분에 더 좋은 설정을 고를 가능성이 높다. 두 방법에 같은 탐색 예산(같은 시도 횟수 또는 같은 계산 시간)과 같은 탐색 절차를 주고, 그 예산을 보고한다. 예산에 따른 성능 곡선을 함께 보이면 더 좋다."

[[questions.choices]]
text = "두 방법에 같은 탐색 예산과 같은 탐색 절차를 주고, 예산을 보고한다."
correct = true

[[questions.choices]]
text = "baseline의 설정은 원 논문의 기본값이므로 이미 최적이라고 본다."
feedback = "원 논문의 기본값은 원 논문의 데이터에서 고른 값이다. 내 데이터에서는 최적이 아닐 수 있다."

[[questions.choices]]
text = "제안 방법의 탐색 결과 중 중간 정도의 설정을 골라 보고한다."
feedback = "결과를 본 뒤 설정을 고르는 방식을 바꾸는 것은 공정성을 해결하지 못하고 새 선택 편향을 만든다."

[[questions]]
id = "structure-vs-recipe"
type = "single"
objective = 3
prompt = "새 구조를 제안하면서 학습 recipe(학습률 스케줄, 더 긴 학습, 증강)도 함께 바꿨다. '새 구조 + 새 recipe'가 '옛 구조 + 옛 recipe'보다 3.3%p 높았다. 구조의 기여를 주장하려면 최소한 어떤 실험이 필요한가?"
explanation = "구조와 recipe를 각각 켜고 끈 2×2 조합이 필요하다. 특히 '옛 구조 + 새 recipe'가 있어야 recipe만으로 얼마나 오르는지 알 수 있다. 본문의 요인 설계에서는 3.3%p 중 recipe 주효과가 2.6%p였고, 옛 recipe에서 구조만 바꾼 효과는 0.2%p였다. 구조의 효과가 새 recipe에서만 나타난다면(교호작용) 그것도 함께 보고해야 한다."

[[questions.choices]]
text = "구조와 recipe를 각각 켜고 끈 2×2 조합, 특히 '옛 구조 + 새 recipe'를 같은 조건에서 실행한다."
correct = true

[[questions.choices]]
text = "새 구조에서 구성요소를 하나씩 빼는 ablation만 하면 된다."
feedback = "새 recipe 아래에서의 ablation은 구조 내부의 기여를 보여 줄 뿐, recipe 변경의 효과를 분리하지 못한다."

[[questions.choices]]
text = "seed를 늘려 3.3%p가 유의한지 확인한다."
feedback = "차이가 확실해져도 그 차이가 구조 때문인지 recipe 때문인지는 여전히 알 수 없다."

[[questions]]
id = "sensitivity-purpose"
type = "multiple"
objective = 3
prompt = "제안 방법의 핵심 하이퍼파라미터 하나에 대해 민감도 분석(값을 넓은 범위에서 바꿔 가며 성능을 보는 실험)을 한다. 민감도 분석이 답해 주는 것을 모두 고르시오."
explanation = "민감도 분석은 결과가 특정 설정에 얼마나 기대는지 보여 준다. 좁은 범위에서만 좋다면 다른 데이터에서는 다시 튜닝해야 하고, 보고된 개선의 일부가 그 값을 찾은 탐색 덕일 수 있다. 같은 범위에서 baseline도 함께 보면 비교가 공정해진다. 민감도 분석은 방법이 왜 작동하는지(원인)를 직접 보여 주지는 않는다. 그것은 ablation과 통제된 분석 실험의 몫이다."

[[questions.choices]]
text = "개선이 넓은 범위의 값에서 유지되는지, 좁은 범위에서만 나타나는지"
correct = true

[[questions.choices]]
text = "새 데이터에 적용할 때 다시 튜닝이 필요할지에 대한 단서"
correct = true

[[questions.choices]]
text = "제안 방법이 왜 작동하는지에 대한 인과적 설명"
feedback = "값에 따른 성능 변화는 원인을 직접 보여 주지 않는다. 원인은 구성요소를 통제해 바꾸는 ablation과 분석 실험으로 확인한다."

[[questions]]
id = "post-hoc-metric"
type = "single"
objective = 2
prompt = "실험 계획서에는 주 지표를 RMSE로 정했다. 결과를 보니 RMSE는 baseline과 차이가 없고, MAE와 상위 10% 오차에서는 제안 방법이 낫다. 가장 적절한 보고 방식은?"
explanation = "주 지표는 계획서대로 RMSE로 판정하고(차이 없음), MAE와 상위 10% 오차의 결과는 사전에 정하지 않은 **탐색적** 결과로 구분해 보고한다. 결과를 본 뒤 주 지표를 바꾸면 여러 지표 중 유리한 것을 고른 셈이어서, 23.4장의 사후 가설과 같은 거짓 양성이 생긴다. 탐색적 결과가 흥미로우면 새 계획서로 새 데이터에서 확인한다."

[[questions.choices]]
text = "주 지표(RMSE) 기준으로는 차이가 없다고 보고하고, MAE·상위 10% 오차 결과는 탐색적 결과로 구분해 함께 보고한다."
correct = true

[[questions.choices]]
text = "MAE가 이 문제에 더 적절한 지표였으므로 주 지표를 MAE로 바꿔 보고한다."
feedback = "결과를 본 뒤 지표를 바꾸면 그 지표가 더 적절하다는 판단 자체가 결과에 영향을 받는다. 바꾸려면 이유와 시점을 밝히고 원래 지표의 결과도 함께 보고한다."

[[questions.choices]]
text = "RMSE 결과는 실패이므로 보고하지 않는다."
feedback = "사전에 정한 주 지표의 결과를 빼면 독자는 지표를 고른 과정을 알 수 없다. 부정적 결과도 보고한다."
