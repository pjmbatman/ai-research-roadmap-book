# 23.9 Figure와 Table 제작 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "error-bar-overlap"
type = "single"
objective = 1
prompt = '''같은 seed 5개로 두 방법을 학습했다. 방법별 RMSE의 95% 신뢰구간 막대는 크게 겹치지만, 같은 seed끼리 짝지은 차이 B − A의 95% 구간은 [−0.028, −0.015] K이고 다섯 seed 모두에서 B가 낫다. 옳은 해석은?'''
explanation = '''방법별 구간에는 seed마다 두 방법이 함께 흔들리는 공통 변동이 들어 있다. 짝지은 차이를 계산하면 이 공통 변동이 상쇄되어, 차이 자체는 0에서 분명히 떨어져 있다. 막대가 겹치는지는 검정이 아니다. 특히 짝지은 설계에서는 겹침이 아무것도 말하지 않는다. 그림도 이 구조를 따라 seed별 점을 선으로 잇거나 차이와 구간을 직접 그려야 한다.'''

[[questions.choices]]
text = "막대가 겹치므로 두 방법의 차이는 유의하지 않다."
feedback = "독립 표본에서도 겹침은 엄밀한 검정이 아니고, 짝지은 설계에서는 공통 변동 때문에 더욱 그렇다. 짝지은 차이의 구간을 본다."

[[questions.choices]]
text = "짝지은 차이의 구간이 0을 포함하지 않으므로 B가 낫다는 근거가 있다. 그림은 seed별 짝이나 차이를 직접 보여야 한다."
correct = true

[[questions.choices]]
text = "두 결과가 모순되므로 seed를 늘려 막대가 겹치지 않을 때까지 실험한다."
feedback = "두 결과는 모순이 아니다. 방법별 막대는 공통 변동을 포함하고 짝지은 차이는 그것을 뺀다. 질문에 맞는 것은 짝지은 차이다."

[[questions]]
id = "truncated-axis-ratio"
type = "numeric"
objective = 1
prompt = '''정확도 0.912(A)와 0.925(B)를 막대 그래프로 그리면서 y축을 0.905에서 시작했다. 그림에서 B의 막대 높이는 A의 막대 높이의 몇 배로 보이는가? (소수 둘째 자리까지)'''
answer = 2.86
tolerance = 0.02
explanation = '''막대의 보이는 높이는 값에서 축의 시작점을 뺀 것이다. A는 $0.912 - 0.905 = 0.007$, B는 $0.925 - 0.905 = 0.020$이므로 B가 $0.020 / 0.007 \approx 2.86$배로 보인다. 실제 값의 비는 $0.925/0.912 \approx 1.014$다. Tufte의 lie factor로는 (보이는 변화율 1.857) ÷ (데이터의 변화율 0.0143) ≈ 130이다. 막대는 길이로 값을 나타내므로 축이 0에서 시작해야 하고, 작은 차이를 보이려면 차이와 그 구간을 점으로 그린다.'''

[[questions]]
id = "rainbow-colormap"
type = "single"
objective = 1
prompt = '''2차원 온도장을 색 지도로 그린다. 기본값 대신 `jet` 컬러맵을 쓰자는 의견이 나왔다. 가장 적절한 판단은?'''
explanation = '''연속 컬러맵에서 크기를 읽는 주된 단서는 밝기다. `jet`은 밝기가 단조롭지 않아 가장 밝은 노란 띠가 중간 값에 생기고, 양 끝(파랑·빨강)의 밝기가 비슷하다. 그래서 데이터에 없는 경계가 보이고, 흑백 인쇄와 색각 이상에서는 큰 값과 작은 값이 구별되지 않는다. `viridis`처럼 밝기가 단조롭게 변하는 지각적으로 균일한 컬러맵을 쓴다. 0을 중심으로 한 편차라면 발산형 컬러맵을 쓰고 중심을 0에 맞춘다.'''

[[questions.choices]]
text = "`jet`은 색이 다양해 미세한 온도 차이를 더 잘 보여 주므로 쓴다."
feedback = "색상이 바뀌는 지점이 경계처럼 보일 뿐, 그 경계는 데이터가 아니라 컬러맵의 성질이다. 밝기가 단조롭지 않으면 크기의 순서를 읽을 수 없다."

[[questions.choices]]
text = "`jet`은 밝기가 단조롭지 않아 없는 경계를 만들고 흑백·색각 이상에서 순서가 사라지므로, 밝기가 단조로운 컬러맵(예: `viridis`)을 쓴다."
correct = true

[[questions.choices]]
text = "컬러맵은 취향의 문제이므로 공동 저자 다수가 좋아하는 것을 쓴다."
feedback = "컬러맵은 데이터를 읽는 방식을 바꾼다. 밝기의 단조성과 색각 이상 접근성은 측정할 수 있는 기준이다."

[[questions]]
id = "log-axis"
type = "single"
objective = 1
prompt = '''격자 간격 $h$를 $10^{-3}$부터 $10^{-1}$까지 바꾸며 수치 오차 $e$를 측정했더니 오차가 $10^{-7}$부터 $10^{-3}$까지 변했다. 수렴 차수(대략 $e \propto h^p$의 $p$)를 보여 주는 그림으로 가장 알맞은 것은?'''
explanation = '''양쪽 로그 축에서 $e \propto h^p$는 $\log e = p\log h + \text{상수}$, 즉 기울기 $p$인 직선이다. 여기서는 오차가 4자릿수, 간격이 2자릿수 변하므로 기울기는 약 2다. 선형 축에서는 작은 $h$의 점들이 원점에 몰려 보이지 않고, 한쪽만 로그로 하면 거듭제곱 관계가 직선이 되지 않는다. 막대 그래프는 로그 축에서 길이가 의미를 잃는다.'''

[[questions.choices]]
text = "선형 축의 산점도. 축을 변형하지 않아야 정직하다."
feedback = "선형 축에서는 $10^{-7}$–$10^{-5}$의 점들이 모두 바닥에 붙어 구별되지 않는다. 축 변형은 밝히기만 하면 정직하다."

[[questions.choices]]
text = "양쪽 로그 축의 선 그래프. 기울기가 수렴 차수(여기서는 약 2)가 된다."
correct = true

[[questions.choices]]
text = "세로축만 로그인 막대 그래프."
feedback = "한쪽 로그 축에서 거듭제곱 관계는 직선이 되지 않고, 로그 축의 막대는 축의 시작점에 따라 길이가 임의로 바뀐다."

[[questions]]
id = "hand-edited-figure"
type = "single"
objective = 2
prompt = '''논문 그림을 matplotlib으로 그린 뒤 벡터 그래픽 편집기에서 범례 위치와 레이블을 손으로 고쳤다. 투고 1주일 전 데이터 전처리 버그를 고쳐 모든 결과가 조금씩 바뀌었다. 이 상황에서 드러나는 문제와 대책으로 옳은 것은?'''
explanation = '''손으로 고친 작업은 다시 할 수 없다. 결과가 바뀌면 그림을 처음부터 다시 만들고 같은 편집을 반복해야 하고, 그 과정에서 숫자와 그림이 어긋나기 쉽다. 레이블·범례·색을 모두 코드에서 정하고, 결과 파일에서 명령 하나로 모든 그림과 표를 다시 만드는 파이프라인을 두면 버그 수정 후 한 번 실행으로 끝난다. 이전 그림을 그대로 두는 것은 논문의 그림과 결과가 다른 상태로 투고하는 것이다.'''

[[questions.choices]]
text = "변화가 작으므로 이전 그림을 그대로 쓴다."
feedback = "작은 변화라도 그림과 본문·표의 숫자가 어긋난다. 독자와 리뷰어는 어긋난 숫자로 결과를 의심한다."

[[questions.choices]]
text = "편집기에서 점의 위치를 새 결과에 맞게 손으로 옮긴다."
feedback = "손으로 옮긴 점은 정확하지 않고 검증할 수 없다. 데이터 조작으로 보일 수도 있다."

[[questions.choices]]
text = "범례·레이블까지 코드로 옮기고, 결과 파일에서 모든 그림과 표를 한 번에 다시 만드는 스크립트로 바꾼다."
correct = true

[[questions]]
id = "sig-fig-mean"
type = "numeric"
objective = 2
prompt = '''seed 5개의 평균이 2.71828, 표준편차가 0.0347이다. 불확실성을 유효숫자 2자리로 반올림하고 평균을 같은 자릿수까지 쓰면 평균은 얼마로 쓰는가?'''
answer = 2.718
tolerance = 0.00001
explanation = '''표준편차 0.0347을 유효숫자 2자리로 반올림하면 0.035로 소수 셋째 자리까지다. 평균도 소수 셋째 자리까지 반올림해 2.718로 쓴다. 결과는 "2.718 ± 0.035"다. 2.71828까지 쓰면 넷째·다섯째 자리는 표준편차보다 훨씬 작은 잡음이다. 2.72로 쓰면 불확실성이 허락하는 정보를 조금 버린다.'''
