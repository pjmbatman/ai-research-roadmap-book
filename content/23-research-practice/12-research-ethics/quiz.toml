# 23.12 연구 윤리와 오픈 사이언스 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "selective-reporting"
type = "single"
objective = 1
prompt = '''제안 방법을 seed 5개로 학습했더니 test 정확도가 0.81, 0.79, 0.84, 0.78, 0.80이 나왔다. baseline은 0.82다. 논문 표에 제안 방법을 0.84로 쓰는 것에 대한 설명으로 옳은 것은?'''
explanation = '''0.84는 실제로 나온 숫자이므로 위조는 아니다. 그러나 다섯 결과 중 가장 좋은 하나만 보고하면 독자는 제안 방법이 baseline보다 낫다고 읽는다. 다섯 개의 평균은 0.804로 baseline보다 낮다. 결과를 골라 연구가 정확히 표현되지 않게 하는 것은 선택 보고이고, 결과를 빼는 것을 변조에 포함하는 정의에 가깝다. 모든 실행의 평균과 퍼짐, 실행 횟수를 보고한다.'''

[[questions.choices]]
text = "실제로 나온 숫자이므로 문제없다."
feedback = "숫자 하나는 사실이어도, 다섯 개 중 하나를 골라 보고하면 보고서 전체가 실제 결과와 다른 그림을 그린다."

[[questions.choices]]
text = "선택 보고다. 다섯 실행의 평균(0.804)과 퍼짐, 실행 횟수를 보고해야 하며, 그러면 baseline보다 낫다고 말할 수 없다."
correct = true

[[questions.choices]]
text = "best seed를 보고하는 것은 ML의 표준 관행이므로 각주만 달면 된다."
feedback = "best seed 보고는 비교를 부풀린다. 더구나 baseline은 한 번만 돌렸다면 두 숫자는 같은 조건의 비교가 아니다."

[[questions.choices]]
text = "위조에 해당한다."
feedback = "위조는 존재하지 않는 결과를 만드는 것이다. 이 경우는 있는 결과를 골라 보고한 선택 보고다. 둘 다 연구를 부정확하게 표현한다는 점에서 문제다."

[[questions]]
id = "public-data-use"
type = "multiple"
objective = 1
prompt = '''웹에 공개된 환자 흉부 X선 데이터셋으로 모델을 학습하고, 전처리한 데이터와 모델을 함께 공개하려 한다. 먼저 확인해야 할 것을 모두 고르시오.'''
explanation = '''공개 데이터라도 라이선스·이용 약관이 사용 목적과 재배포를 제한할 수 있고, 사람에게서 나온 데이터는 원래 동의·승인 범위가 이용을 제한할 수 있다. 데이터셋이 지정한 인용 의무도 지켜야 한다. 내려받을 수 있다는 사실, 이미 많은 논문이 썼다는 사실은 이 조건들을 대신하지 않는다. 판단이 어려우면 제공자와 기관 담당 부서에 확인한다.'''

[[questions.choices]]
text = "데이터의 라이선스·이용 약관(상업적 이용, 재배포·파생물 조건)"
correct = true

[[questions.choices]]
text = "환자 동의와 연구윤리 승인의 범위, 소속 기관의 IRB 절차가 필요한지"
correct = true

[[questions.choices]]
text = "데이터셋이 지정한 인용 형식"
correct = true

[[questions.choices]]
text = "다른 논문 여러 편이 이미 썼는지 — 썼다면 조건 확인 없이 써도 된다"
feedback = "다른 연구가 썼다는 것은 그들이 조건을 지켰다는 보장도, 내 용도가 같다는 보장도 아니다. 조건은 직접 확인한다."

[[questions.choices]]
text = "누구나 내려받을 수 있는지 — 내려받을 수 있으면 공개도 자유롭다"
feedback = "접근할 수 있다는 것과 재배포·파생물 공개가 허용된다는 것은 다르다."

[[questions]]
id = "license-missing"
type = "single"
objective = 2
prompt = '''논문의 코드를 공개 GitHub 저장소에 올렸지만 `LICENSE` 파일을 넣지 않았다. 다른 연구자의 입장에서 옳은 설명은?'''
explanation = '''저작물은 기본적으로 저작권자에게 권리가 있으므로, 명시적인 라이선스가 없으면 다른 사람이 그 코드를 안심하고 수정·재배포하거나 자기 프로젝트에 포함할 근거가 없다. 공개 저장소에 올렸다는 사실만으로 이용 허락이 생기지 않는다. 공개의 목적이 재사용이라면 라이선스를 명시한다. 구체적인 법적 효과는 나라마다 다르므로, 법률 판단이 필요하면 기관의 담당 부서에 확인한다.'''

[[questions.choices]]
text = "공개 저장소에 있으므로 누구나 자유롭게 쓰고 고칠 수 있다."
feedback = "공개는 볼 수 있다는 뜻이지 이용 허락이 아니다. 라이선스가 없으면 재사용의 근거가 없다."

[[questions.choices]]
text = "라이선스가 없으면 퍼블릭 도메인으로 간주된다."
feedback = "라이선스 표기가 없다고 저작권이 사라지지 않는다."

[[questions.choices]]
text = "이용 허락이 명시되지 않아, 다른 사람이 코드를 수정·재배포하거나 자기 프로젝트에 넣을 근거가 없다."
correct = true

[[questions.choices]]
text = "학술 목적이라면 라이선스와 무관하게 자유롭게 쓸 수 있다."
feedback = "학술 목적이라는 이유로 라이선스 조건이 일반적으로 면제되지 않는다. 조건은 라이선스와 이용 허락에서 정해진다."

[[questions]]
id = "reproduction-package"
type = "multiple"
objective = 2
prompt = '''공동 연구 계약 때문에 원 데이터를 공개할 수 없는 논문의 재현 패키지에 넣을 것으로 적절한 것을 모두 고르시오.'''
explanation = '''원 데이터를 공개할 수 없어도 재현 패키지는 만들 수 있다. 코드와 라이선스, 고정된 환경, 표·그림과 명령의 대응표, 데이터 접근 안내와 스키마 문서, 같은 스키마의 합성 예시 데이터가 있으면 다른 사람이 파이프라인을 검증하고, 접근 권한을 얻으면 결과를 재현할 수 있다. 최종 checkpoint만 올리는 것은 결과가 어떻게 나왔는지 보여 주지 않는다.'''

[[questions.choices]]
text = "표·그림마다 그것을 만드는 실행 명령과 기대 결과(변동 범위)를 적은 README"
correct = true

[[questions.choices]]
text = "데이터 스키마·단위·결측 표기를 설명한 문서와 접근 신청 방법"
correct = true

[[questions.choices]]
text = "같은 스키마의 작은 합성 데이터로 파이프라인 전체가 돌아가는 예시"
correct = true

[[questions.choices]]
text = "데이터를 공개할 수 없으므로 재현 패키지 대신 최종 checkpoint 파일만 올린다."
feedback = "checkpoint만으로는 학습·평가 과정을 확인할 수 없다. 데이터가 없어도 코드·환경·문서·합성 예시는 공개할 수 있다."

[[questions]]
id = "dual-use-release"
type = "single"
objective = 1
prompt = '''독성이 낮은 후보 분자를 생성하도록 학습한 분자 생성 모델을 공개하려 한다. 목표 함수를 바꾸면 독성이 높은 분자를 생성하는 데 쓰일 수 있다는 것을 알게 되었다. 가장 적절한 대응은?'''
explanation = '''이중 용도 위험이 있을 때 선택지는 전부 공개와 전부 비공개만이 아니다. 위험을 실질적으로 높이는 구성 요소(가중치, 특정 생성 결과 등)를 찾아 공개 형태를 정하고, 기관의 담당 부서와 분야 전문가의 의견을 구하고, 그 판단을 논문에 기록한다. 공개가 항상 옳다거나, 위험이 있으면 연구 자체를 숨겨야 한다는 양 극단은 모두 판단을 생략한다.'''

[[questions.choices]]
text = "오픈 사이언스 원칙에 따라 가중치와 생성 결과를 모두 제한 없이 공개한다."
feedback = "공개의 이익은 크지만, 이중 용도 위험이 구체적일 때는 공개 형태를 검토해야 한다."

[[questions.choices]]
text = "위험의 근원(가중치·생성 결과·방법)을 나누어 공개 형태를 정하고, 기관의 담당 부서·분야 전문가와 검토한 뒤 판단을 논문에 기록한다."
correct = true

[[questions.choices]]
text = "오용 가능성이 있으므로 논문도 내지 않고 연구를 중단한다."
feedback = "위험을 아무도 모르게 두는 것도 해법이 아니다. 방법과 위험에 대한 판단을 공개하는 것이 공동체에 도움이 되는 경우가 많다."

[[questions.choices]]
text = "독성 예측은 연구 목적이 아니었으므로 고려하지 않아도 된다."
feedback = "이중 용도는 의도와 무관하게 연구 결과가 가진 성질이다. 의도하지 않았어도 위험을 알게 되었다면 검토한다."

[[questions]]
id = "ai-use-disclosure"
type = "single"
objective = 3
prompt = '''대화형 AI로 관련 연구 절의 초안을 만들고, 코딩 에이전트로 분석 스크립트를 작성했다. 투고 전에 할 일로 가장 적절한 것은?'''
explanation = '''AI 도구는 원고 내용에 책임을 질 수 없으므로 저자가 될 수 없고, 도구가 만든 부분까지 포함해 책임은 저자에게 있다. 그래서 인용·코드를 직접 검증하고, 사용 기록을 바탕으로 투고처 정책이 정한 방식대로 사용을 밝힌다. 정책은 학회·저널마다 다르므로 원문을 확인한다.'''

[[questions.choices]]
text = "결과 숫자에는 영향이 없으므로 따로 밝히지 않는다."
feedback = "분석 스크립트는 결과 숫자를 만든다. 그리고 공개 의무는 투고처 정책이 정한다. 확인하지 않고 밝히지 않으면 정책 위반이 될 수 있다."

[[questions.choices]]
text = "AI가 상당 부분을 썼으므로 AI 도구를 공동 저자로 올린다."
feedback = "AI 도구는 원고에 책임을 지거나 이해 상충을 밝힐 수 없으므로 저자 요건을 충족하지 못한다는 것이 출판 윤리 기구의 입장이다."

[[questions.choices]]
text = "AI가 제시한 인용을 모두 원문에서 확인하고 스크립트를 검증한 뒤, 투고처 정책에 따라 도구와 용도를 밝힌다."
correct = true

[[questions.choices]]
text = "AI가 제시한 참고문헌은 형식이 정확하므로 그대로 쓰고, 감사의 글에 도구 이름만 적는다."
feedback = "AI 도구는 존재하지 않는 논문이나 그런 주장을 하지 않은 논문을 그럴듯하게 제시할 수 있다. 인용은 원문을 확인한 것만 쓴다."

[[questions]]
id = "gift-authorship"
type = "single"
objective = 3
prompt = '''연구 그룹의 관행에 따라, 연구비를 확보했지만 연구의 설계·분석·원고 작성에는 참여하지 않았고 원고도 읽지 않은 교수를 저자로 넣으려 한다. ICMJE 기준에 비추어 옳은 설명은?'''
explanation = '''ICMJE 권고는 네 조건(실질적 기여, 원고 작성·비판적 수정, 최종본 승인, 책임 동의)을 모두 충족해야 저자로 보고, 연구비 확보나 일반적인 지도만으로는 저자 자격이 되지 않는다고 본다. 그런 기여는 감사의 글에 적는다. 분야마다 관행이 다르므로 저자 기준은 프로젝트 초기에 명시적으로 합의한다. 원고를 읽지도 않은 사람을 저자로 넣으면 그 사람은 확인하지 않은 내용에 책임을 지게 된다.'''

[[questions.choices]]
text = "연구비가 없었다면 연구도 없었으므로 저자 자격이 있다."
feedback = "ICMJE 권고는 연구비 확보만으로는 저자 자격이 되지 않는다고 본다. 이 기여는 감사의 글에 쓴다."

[[questions.choices]]
text = "저자 조건을 충족하지 않으므로 감사의 글에 기여를 적는다. 저자로 넣으려면 원고의 비판적 수정·최종본 승인·책임 동의를 포함해 기준을 충족해야 한다."
correct = true

[[questions.choices]]
text = "저자 수가 많을수록 논문의 신뢰도가 높아지므로 넣는 것이 좋다."
feedback = "저자 목록은 공로와 책임의 기록이다. 기여 없는 저자는 실제 기여자의 공로를 희석하고 책임의 소재를 흐린다."

[[questions.choices]]
text = "CRediT의 '연구비 확보(funding acquisition)' 역할이 있으므로 자동으로 저자가 된다."
feedback = "CRediT는 기여를 기록하는 어휘이지 저자 자격을 판정하는 기준이 아니다. 저자 기준과 함께 쓴다."
