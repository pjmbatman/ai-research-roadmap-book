# 23.3 논문 재현 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "similar-number-different-condition"
type = "single"
objective = 1
prompt = "공개 코드를 그대로 돌렸더니 논문 표와 거의 같은 RMSE가 나왔다. 그런데 논문 본문은 \"셀 단위로 분할했다\"고 쓰고, 코드는 측정 단위로 무작위 분할한다. 가장 정확한 결론은?"
explanation = "숫자가 같다는 것은 **공개 코드의 조건**이 재현되었다는 뜻이다. 논문이 주장하는 조건(셀 단위 분할, 즉 새 셀에 대한 일반화)은 아직 시험되지 않았다. 본문의 실험처럼 무작위 분할과 셀 단위 분할은 결론의 방향까지 바꿀 수 있으므로, 불일치를 기록하고 논문이 말한 조건에서 따로 실험해야 한다."

[[questions.choices]]
text = "공개 코드의 조건은 재현되었지만, 논문이 주장하는 조건(셀 단위 분할)은 아직 재현되지 않았다. 불일치를 기록하고 셀 단위 분할로 따로 실험한다."
correct = true

[[questions.choices]]
text = "숫자가 같으므로 논문의 결과가 재현되었다."
feedback = "같은 숫자가 다른 조건에서 나왔다. 무작위 분할에서는 학습에 쓴 셀의 다른 측정이 시험에 들어가 점수가 좋아질 수 있다."

[[questions.choices]]
text = "논문이 분할 방식을 거짓으로 썼으므로 결과를 신뢰할 수 없다."
feedback = "불일치는 흔하고 대개 실수다. 판단하기 전에 두 조건의 결과를 측정하고, 저자에게 확인한다."

[[questions]]
id = "gap-not-author-fault"
type = "single"
objective = 1
prompt = "독립 재구현으로 얻은 정확도가 논문보다 0.02 낮다. 같은 조건의 seed 간 표준편차는 아직 재지 않았다. 다음 중 가장 먼저 할 일은?"
explanation = "차이의 크기를 해석하려면 먼저 기준 잡음, 즉 같은 조건에서 seed만 바꿨을 때의 흔들림을 알아야 한다. seed 표준편차가 0.015라면 0.02는 단일 실행 사이에서 흔히 나오는 차이다. 그다음 데이터·구현·하이퍼파라미터·환경의 불일치를 하나씩 확인한다. 저자 탓이나 내 구현 탓으로 바로 결론 내리는 것은 둘 다 근거가 없다."

[[questions.choices]]
text = "같은 조건에서 seed를 여러 개 돌려 흔들림을 재고, 0.02가 그 범위 밖인지 확인한다."
correct = true

[[questions.choices]]
text = "논문의 결과가 과장되었다고 결론 내리고 재현 보고서에 쓴다."
feedback = "seed 변동, 조건 불일치, 내 구현의 버그를 배제하기 전에는 근거가 없다. 재현 실패의 대부분은 조건 차이에서 나온다."

[[questions.choices]]
text = "논문 수치에 맞을 때까지 하이퍼파라미터를 조정한다."
feedback = "보고값에 맞추려고 조정하면 재현이 아니라 보고값에 대한 과적합이 된다. 조정했다면 그 과정과 시도 횟수를 기록해야 한다."

[[questions.choices]]
text = "내 구현에 버그가 있을 것이므로 처음부터 다시 짠다."
feedback = "버그일 수도 있지만, 차이가 잡음 범위인지부터 알아야 다시 짤 필요가 있는지 판단할 수 있다."

[[questions]]
id = "single-run-halfwidth"
type = "numeric"
objective = 1
prompt = "같은 조건에서 seed 10개로 재현한 정확도의 평균이 0.850, 표본 표준편차가 0.010이다. 논문의 **단일 실행값**이 재현 범위 안에 있는지 판단하려고 새 단일 실행의 95% 예측구간 $\\bar{x} \\pm t_{0.975,9}\\, s\\sqrt{1 + 1/n}$을 만든다. 반폭은 얼마인가? ($t_{0.975,9} \\approx 2.262$, 소수 셋째 자리까지)"
explanation = "반폭은 $2.262 \\times 0.010 \\times \\sqrt{1.1} \\approx 0.024$다. 보고값이 0.826과 0.874 사이에 있으면 단일 실행으로서 이상하지 않다. 평균의 신뢰구간 반폭 $2.262 \\times 0.010/\\sqrt{10} \\approx 0.007$과 비교하면 안 된다. 그것은 평균이 얼마나 정확한지의 구간이지, 한 번 실행한 값이 어디에 떨어지는지의 구간이 아니다."
answer = 0.024
tolerance = 0.001

[[questions]]
id = "isolate-causes"
type = "single"
objective = 1
prompt = "논문 본문과 공개 코드 사이에 불일치가 세 개(분할 방식, 표준화, 정규화 스케일) 있다. 각 불일치가 결과에 얼마나 기여하는지 알고 싶다. 가장 적절한 설계는?"
explanation = "세 불일치를 켜고 끈 $2^3 = 8$개 조합을 각각 여러 seed로 돌리면, 각 불일치의 주효과와 불일치 사이의 교호작용을 모두 추정할 수 있다. 셋을 한꺼번에 바꾸면 무엇이 원인인지 알 수 없고, 하나씩만 바꾸면 교호작용(본문 예에서 분할 방식에 따라 정규화 스케일의 효과가 반대가 된 것)을 놓친다. 조합이 너무 많을 때는 공개 코드 설정에서 하나씩 바꾸는 것으로 시작하되, 큰 효과를 보인 요인끼리는 조합을 확인한다."

[[questions.choices]]
text = "세 불일치를 켜고 끈 8개 조합을 각각 여러 seed로 실행해 주효과와 교호작용을 추정한다."
correct = true

[[questions.choices]]
text = "세 불일치를 한꺼번에 논문대로 고친 결과와 공개 코드 결과를 비교한다."
feedback = "두 결과의 차이가 세 원인 중 어디서 왔는지 알 수 없다."

[[questions.choices]]
text = "seed 하나로 불일치를 하나씩 바꿔 본다."
feedback = "seed 하나로는 차이가 잡음인지 알 수 없고, 하나씩 바꾸면 불일치 사이의 교호작용을 놓친다."

[[questions]]
id = "report-contents"
type = "multiple"
objective = 2
prompt = "재현 보고서에 반드시 들어가야 하는 것을 모두 고르시오."
explanation = "재현 보고서의 핵심은 '어떤 조건에서 무엇이 재현되었고 무엇이 되지 않았는가'를 다른 사람이 확인할 수 있게 하는 것이다. 원 논문의 조건, 내가 실제로 쓴 조건, 둘의 차이, 여러 seed의 결과와 변동, 재현되지 않은 결과와 시도한 원인 분석이 모두 필요하다. 재현에 실패한 결과도 결과다."

[[questions.choices]]
text = "원 논문의 조건과 내가 실제로 쓴 조건, 그리고 둘 사이의 모든 차이"
correct = true

[[questions.choices]]
text = "여러 seed의 결과와 그 변동, 보고값과의 비교 방법"
correct = true

[[questions.choices]]
text = "재현되지 않은 결과와 원인 분석, 확인하지 못한 것(한계)"
correct = true

[[questions.choices]]
text = "보고값과 가장 가깝게 나온 실행 하나의 결과만"
feedback = "가장 가까운 실행만 고르면 선택 편향이 생기고, 재현 범위를 알 수 없다. 모든 실행을 보고한다."
