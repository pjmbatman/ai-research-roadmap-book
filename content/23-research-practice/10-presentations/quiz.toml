# 23.10 발표와 학술 소통 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "show-all-experiments"
type = "single"
objective = 1
prompt = '''15분 학회 발표를 준비한다. 지난 1년간 한 실험이 12개이고, 논문의 핵심 주장을 직접 뒷받침하는 것은 그중 4개다. 가장 적절한 구성은?'''
explanation = '''15분 동안 청중이 따라갈 수 있는 근거는 많지 않다. 핵심 주장을 뒷받침하는 결과만 본 발표에 넣고, 나머지는 예비 슬라이드로 발표 뒤에 두어 질문이 오면 보여 준다. 12개를 모두 넣으면 슬라이드마다 시간이 모자라 어느 결과도 이해되지 않고, 대개 한계와 요약을 건너뛰게 된다. 노력의 양을 보여 주는 것은 발표의 목적이 아니다.'''

[[questions.choices]]
text = "1년간의 노력을 보이기 위해 12개 실험을 모두 한 장씩 빠르게 보여 준다."
feedback = "슬라이드 한 장에 1분도 안 되면 청중은 어느 결과도 이해하지 못한다. 핵심 주장도 묻힌다."

[[questions.choices]]
text = "핵심 주장의 근거가 되는 결과만 본 발표에 넣고, 나머지는 질문에 대비한 예비 슬라이드로 둔다."
correct = true

[[questions.choices]]
text = "결과가 가장 좋은 실험 4개를 골라 보여 준다."
feedback = "기준은 결과가 좋은가가 아니라 핵심 주장의 근거인가다. 불리한 조건의 결과가 주장의 범위를 정하는 데 필요하면 넣어야 한다."

[[questions]]
id = "slide-headline"
type = "single"
objective = 1
prompt = '''온도별 오차 차이 그림 하나를 담은 슬라이드의 제목으로 가장 좋은 것은?'''
explanation = '''슬라이드 제목은 청중이 그 슬라이드에서 가져갈 주장을 완전한 문장으로 쓴다. 그러면 청중은 제목을 읽고 그림에서 그 문장을 확인한다. 주제 이름("실험 결과 2")은 무엇을 봐야 하는지 알려 주지 않고, 수식어로 부풀린 제목("압도적")은 근거보다 넓은 주장이다.'''

[[questions.choices]]
text = "\"실험 결과 2\""
feedback = "주제 이름은 청중에게 무엇을 봐야 하는지 알려 주지 않는다. 슬라이드 제목만 이어 읽어도 발표의 논리가 통해야 한다."

[[questions.choices]]
text = "\"물리 손실을 넣으면 상온·고온에서 오차가 줄지만, 저온에서는 늘어난다\""
correct = true

[[questions.choices]]
text = "\"제안 방법의 압도적 성능\""
feedback = "저온에서 나빠진 결과를 숨기고 근거보다 넓게 주장한다. 질문에서 바로 드러난다."

[[questions]]
id = "audience-structure"
type = "single"
objective = 1
prompt = '''같은 연구를 이번 주 5분 연구실 미팅에서 보고한다. 이번 주에 저온 성능 문제의 원인을 찾지 못했다. 연구실 미팅 발표의 구성으로 가장 알맞은 것은?'''
explanation = '''연구실 미팅의 청중은 배경을 이미 알고, 무엇이 바뀌었고 무엇을 도와야 하는지 알고 싶어 한다. 지난 결정, 이번 결과와 해석, 막힌 점, 구체적인 요청 순서가 맞다. 학회용 동기 설명은 시간을 쓰고 도움이 필요한 부분을 가린다. 잘 된 결과만 보여 주면 동료들이 도울 기회가 사라진다.'''

[[questions.choices]]
text = "학회 발표와 같이 문제의 중요성과 동기부터 시작해, 잘 된 상온 결과를 중심으로 보여 준다."
feedback = "청중은 배경을 이미 안다. 동기 설명에 시간을 쓰면 정작 도움이 필요한 저온 문제를 논의할 시간이 없다."

[[questions.choices]]
text = "지난 미팅의 결정 한 줄, 이번 결과 그림 하나와 해석, 저온 문제에서 시도한 것과 막힌 점, 필요한 도움 순서로 3–4장을 보인다."
correct = true

[[questions.choices]]
text = "원인을 찾을 때까지 이번 주 보고는 건너뛴다."
feedback = "막힌 주의 보고가 도움을 받기에 가장 좋은 때다. 미루면 같은 문제로 시간을 더 잃는다."

[[questions]]
id = "qa-challenge"
type = "multiple"
objective = 2
prompt = '''학회 발표 뒤 "성능 향상이 단지 모델이 더 커서 생긴 것 아닌가요?"라는 질문을 받았다. 적절한 대응을 모두 고르시오.'''
explanation = '''이 질문은 대안 설명(용량)에 대한 도전이다. 질문을 다시 말해 확인한 뒤, 배제한 실험이 있으면 그 결과(같은 파라미터 수 baseline, ablation)를 예비 슬라이드로 보이며 답한다. 실험하지 않았다면 그 사실과 확인 방법을 말한다. 질문을 무시하거나 방어적으로 일축하면, 근거가 있는 경우에도 신뢰를 잃는다.'''

[[questions.choices]]
text = "질문을 짧게 다시 말해 확인한 뒤, 한 문장으로 답부터 한다."
correct = true

[[questions.choices]]
text = "같은 파라미터 수로 키운 baseline과 ablation 결과를 예비 슬라이드로 보이며 이득 중 모델 크기로 설명되는 부분과 아닌 부분을 말한다."
correct = true

[[questions.choices]]
text = "그 비교를 하지 않았다면, 하지 않았다고 말하고 어떤 실험으로 확인할 수 있는지 말한다."
correct = true

[[questions.choices]]
text = "\"모델 크기는 본질적인 문제가 아닙니다\"라고 답하고 다음 질문으로 넘어간다."
feedback = "근거 없이 일축하면 질문자와 청중은 대안 설명이 배제되지 않았다고 판단한다."

[[questions]]
id = "qa-unknown"
type = "single"
objective = 2
prompt = '''"다른 화학조성(LFP) 셀에서도 같은 결과가 나오나요?"라는 질문을 받았다. LFP 셀은 실험하지 않았다. 가장 좋은 답은?'''
explanation = '''정직한 답은 사실(실험하지 않음), 예상과 그 근거의 강도, 확인 방법의 세 부분으로 이루어진다. 아는 척 단정하면 나중에 틀린 것이 드러날 때 발표 전체의 신뢰를 잃는다. "모릅니다"로만 끝내는 것보다 예상과 확인 방법을 함께 말하는 쪽이 연구자의 판단을 보여 주고, 공동 연구로 이어질 수도 있다.'''

[[questions.choices]]
text = "\"네, 원리상 화학조성과 무관하므로 같은 결과가 나올 것입니다.\""
feedback = "실험하지 않은 조건을 단정했다. 원리상 무관하다는 주장 자체가 검증되지 않았다."

[[questions.choices]]
text = "\"모르겠습니다.\""
feedback = "사실은 맞지만, 예상과 그 근거, 확인 방법이 없어 대화가 끝난다. 질문자는 연구자가 그 문제를 생각해 보았는지 알 수 없다."

[[questions.choices]]
text = "\"LFP는 실험하지 않았습니다. 저온에서 성능이 떨어진 것을 보면 열화 양상이 다른 화학조성에서는 결과가 달라질 수 있다고 예상하지만, 근거는 없습니다. 확인하려면 LFP 셀 데이터로 같은 비교를 해야 합니다.\""
correct = true
