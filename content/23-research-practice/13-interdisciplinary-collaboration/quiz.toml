# 23.13 도메인 과학자와의 협업 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "term-validation"
type = "single"
objective = 1
prompt = '''협업 회의에서 기계공학자가 "이 열전달 모델은 이미 검증(validation)했다"고 말했다. ML 연구자가 할 일로 가장 적절한 것은?'''
explanation = '''공학에서 validation은 흔히 모델의 예측을 독립된 실험·관측과 비교해 타당성을 확인하는 일을 뜻한다. ML의 validation split(하이퍼파라미터 선택용 분할)과는 다른 개념이다. 아는 단어일수록 같은 뜻이라고 가정하기 쉬우므로, 무엇과 어떻게 비교했는지 묻고 용어 대응표에 이 프로젝트에서 쓸 뜻을 적는다.'''

[[questions.choices]]
text = "validation set의 성능이 좋다는 뜻이므로 test set 성능을 물어본다."
feedback = "공학의 validation은 대개 실험·관측과의 비교를 뜻한다. ML의 분할 개념을 그대로 대입하면 대화가 어긋난다."

[[questions.choices]]
text = "무엇과 어떤 조건에서 비교했는지(어떤 실험 데이터, 어떤 오차 기준) 묻고, 용어 대응표에 이 프로젝트에서 쓸 뜻을 기록한다."
correct = true

[[questions.choices]]
text = "이미 검증된 모델이므로 그 출력을 정답 label로 바로 쓴다."
feedback = "검증의 범위(어떤 조건에서 어느 정도 맞았는가)를 모른 채 출력을 정답으로 쓰면, 그 모델의 오차가 label에 숨는다."

[[questions.choices]]
text = "용어 차이는 사소하므로 넘어가고 모델 구조에 집중한다."
feedback = "같은 단어를 다른 뜻으로 쓰는 것은 협업에서 가장 늦게 드러나는 오해다. 초기에 정리하는 비용이 훨씬 작다."

[[questions]]
id = "problem-intersection"
type = "single"
objective = 1
prompt = '''전해질 연구자가 "이 전해질이 왜 고온에서 빨리 열화되는지 알고 싶다"며 셀 200개의 사이클 데이터를 건넸다. 문제 정의 합의를 위한 첫 대응으로 가장 적절한 것은?'''
explanation = '''도메인 과학자의 질문("왜")과 ML이 바로 풀 수 있는 문제("얼마나 빨리")는 다를 수 있다. 결과가 어떤 결정·이해를 바꾸는지, 지금은 어떻게 판단하는지, 무엇을 보여 줘야 믿을지를 묻고, 예측 모델이 답하는 부분과 답하지 못하는 부분을 문제 정의서에 함께 적는다. 그래야 몇 달 뒤 "원한 결과가 아니다"를 피한다.'''

[[questions.choices]]
text = "열화 속도를 예측하는 가장 정확한 모델을 만들어 보여 준다."
feedback = "예측 정확도는 '왜'에 대한 답이 아닐 수 있다. 무엇을 만들지 합의하기 전에 모델부터 만들면 기대가 어긋난다."

[[questions.choices]]
text = "결과로 무엇을 결정하려는지, 지금은 어떻게 판단하는지, 무엇을 보여 주면 믿겠는지 묻고, 예측 모델이 '왜'에 어디까지 답하는지를 문제 정의서에 함께 적는다."
correct = true

[[questions.choices]]
text = "데이터가 200개뿐이므로 ML로 풀 수 없다고 답한다."
feedback = "데이터 양만으로 판단하기 전에 질문을 정의해야 한다. 질문에 따라 200개로 충분한 분석(예: 특징과 열화의 관계 분석)도 있다."

[[questions.choices]]
text = "해석 가능한 모델을 쓰면 '왜'에 자동으로 답할 수 있으므로 해석 가능한 모델을 고른다."
feedback = "모델의 해석은 데이터 안의 연관을 보여 줄 뿐, 메커니즘에 대한 인과적 설명을 자동으로 주지 않는다. 무엇을 주장할 수 있는지부터 합의한다."

[[questions]]
id = "hit-rate-enrichment"
type = "numeric"
objective = 2
prompt = '''후보 물질 중 무작위로 고른 것의 실험 적중률은 5%다. 모델이 고른 상위 10개 후보를 실험했더니 3개가 적중했다. 모델의 선택은 무작위 선택보다 몇 배 효율적인가?'''
answer = 6
tolerance = 0.01
slider = { min = 1, max = 10, step = 0.5, unit = "배" }
explanation = '''모델이 고른 후보의 적중률은 $3/10 = 0.30$이고, 무작위 적중률은 $0.05$이므로 $0.30 / 0.05 = 6$배다. 후보 선별 문제에서는 평균 오차보다 이런 적중률·배수가 도메인 과학자의 결정(어떤 실험에 자원을 쓸지)과 직접 연결된다. 다만 10개 중 3개는 표본이 작으므로, 실제 보고에서는 불확실성도 함께 쓴다.'''

[[questions]]
id = "metric-vs-physics"
type = "multiple"
objective = 2
prompt = '''화학 반응기의 농도 예측 모델이 test RMSE를 기존 모델보다 5% 줄였다. 이 결과를 "과학적 기여"로 보고하기 전에 확인해야 할 것을 모두 고르시오.'''
explanation = '''RMSE 개선이 도메인에서 의미 있으려면 측정 반복성보다 커야 하고, 예측이 물리 제약(음이 아닌 농도, 질량 보존)을 지켜야 하며, 합의한 일반화 대상에 맞는 분할에서 나와야 한다. 파라미터 수나 학습 시간은 비용 정보이지 과학적 타당성의 점검이 아니다.'''

[[questions.choices]]
text = "개선 폭이 같은 시료를 다시 측정할 때의 반복성(표준편차)보다 큰가"
correct = true

[[questions.choices]]
text = "예측 농도가 음수가 되거나 질량 보존을 어기는 경우가 얼마나 있는가"
correct = true

[[questions.choices]]
text = "합의한 일반화 대상(예: 새 운전 조건)에 맞는 분할에서 나온 결과인가"
correct = true

[[questions.choices]]
text = "모델의 파라미터 수가 기존 모델보다 많은가"
feedback = "모델의 크기는 복잡성이지 기여의 크기가 아니다(23.4장). 과학적 타당성은 물리 제약·측정 잡음·일반화로 판단한다."

[[questions]]
id = "domain-expert-role"
type = "multiple"
objective = 1
prompt = '''도메인 과학자가 수년간 측정한 데이터를 받았다. 협업을 데이터 제공에 그치지 않게 하는 방법으로 적절한 것을 모두 고르시오.'''
explanation = '''도메인 과학자는 데이터의 맥락(배치, 장비, 결측 표기)과 결과의 의미를 아는 공동 연구자다. 첫 주부터 작은 결과(데이터 요약, 이상한 측정, 가장 단순한 baseline의 오류)를 도메인 단위로 함께 보고, 데이터 문서의 수집 항목을 함께 채우고, 평가 기준을 함께 정한다. 완성된 모델만 몇 달 뒤 보여 주면 맥락을 모른 채 만든 결과가 나온다.'''

[[questions.choices]]
text = "첫 주에 데이터 요약과 이상해 보이는 측정 몇 개를 도메인 단위의 그림으로 보여 주고 의견을 묻는다."
correct = true

[[questions.choices]]
text = "데이터 문서의 수집 항목(장비, 배치, 반복 측정, 결측 표기)을 함께 채운다."
correct = true

[[questions.choices]]
text = "평가 기준(기준값, 물리적 점검, 실패 시 결론)을 결과를 보기 전에 함께 정한다."
correct = true

[[questions.choices]]
text = "상대의 시간을 아끼기 위해, 모델이 완성되어 좋은 결과가 나올 때까지 연락하지 않는다."
feedback = "맥락 없이 만든 모델은 배치 효과나 잘못 해석한 결측 같은 문제를 안고 있기 쉽다. 짧고 잦은 공유가 상대의 시간을 더 아낀다."

[[questions]]
id = "authorship-timing"
type = "single"
objective = 3
prompt = '''ML 연구실과 실험 연구실의 공동 프로젝트가 시작되었다. 저자 기준과 발표 경로는 언제 어떻게 정하는 것이 가장 적절한가?'''
explanation = '''결과가 나온 뒤에는 각자의 기대가 이미 굳어 있어 갈등이 커진다. 시작할 때 저자 기준(예: 실질적 기여, 원고 검토, 최종 승인, 책임), 각자의 목표(방법 논문·응용 논문·학위), 투고처를 합의해 문서로 남기고, 기여가 바뀌면 다시 확인한다. 데이터를 만든 연구자에게는 기준을 충족할 기회(원고 검토 참여 등)를 준다.'''

[[questions.choices]]
text = "결과가 나와 기여가 분명해진 논문 작성 단계에서 정한다."
feedback = "그때는 각자의 기대가 이미 굳어 있다. 기준은 처음에, 적용은 기여가 바뀔 때마다 다시 확인한다."

[[questions.choices]]
text = "프로젝트 시작 때 저자 기준·각자의 목표·발표 경로를 합의해 문서로 남기고, 기여가 바뀌면 다시 확인한다."
correct = true

[[questions.choices]]
text = "데이터를 제공한 실험 연구실은 감사의 글에 쓰고, 모델을 만든 쪽만 저자로 올린다."
feedback = "데이터 생성에 실질적으로 기여하고 원고 검토·승인·책임에 참여한 연구자는 저자 기준을 충족한다. 역할로 미리 배제하지 않는다."

[[questions.choices]]
text = "양쪽 연구 책임자가 논문 제출 직전에 협의해 정한다."
feedback = "실제로 일한 학생·연구원의 기여와 목표가 빠지기 쉽다. 기준을 처음부터 모두가 공유한다."
