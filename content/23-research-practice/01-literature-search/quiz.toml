# 23.1 문헌 탐색과 지식 관리 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "forward-snowball"
type = "single"
objective = 1
prompt = "2018년에 나온 핵심 논문 하나를 찾았다. 이 논문의 방법이 어떤 조건에서 실패한다고 보고한 **이후의** 연구를 찾고 싶다. 가장 직접적인 방법은?"
explanation = "이후 연구는 그 논문을 **인용한** 논문들 가운데 있다. 피인용 목록을 따라가는 forward snowballing이 직접적인 방법이다. 참고문헌 목록(backward)은 그 논문보다 앞선 연구만 담고, 방법 이름으로 하는 키워드 검색은 같은 문제를 다른 용어로 부르는 반박 연구를 놓치기 쉽다."

[[questions.choices]]
text = "그 논문을 인용한 논문 목록(forward)을 훑고, 그중 한계·실패를 다룬 것을 고른다."
correct = true

[[questions.choices]]
text = "그 논문의 참고문헌 목록(backward)을 끝까지 따라간다."
feedback = "참고문헌은 그 논문보다 먼저 나온 연구다. 이후의 반박은 거기에 없다."

[[questions.choices]]
text = "그 논문의 방법 이름으로 키워드 검색을 한다."
feedback = "반박·분석 연구는 방법 이름을 제목에 쓰지 않는 경우가 많고, 다른 분야는 같은 것을 다른 용어로 부른다. 키워드 검색은 보조 수단이다."

[[questions.choices]]
text = "최근 서베이 논문 하나를 읽으면 충분하다."
feedback = "서베이는 출발점으로 좋지만, 작성 시점 이후의 연구와 서베이 저자가 고르지 않은 반박은 빠져 있다."

[[questions]]
id = "citation-count-meaning"
type = "single"
objective = 1
prompt = "본문의 가상 인용 그래프에서 `원전15`와 `후속18`은 둘 다 4번 인용되지만 PageRank는 `원전15`가 0.313, `후속18`이 0.158이다. 이 차이를 가장 잘 설명하는 것은?"
explanation = "PageRank는 인용의 **수**뿐 아니라 인용한 논문이 얼마나 중요한지(그 논문도 많이 인용되는지)를 반영한다. `원전15`는 많이 인용되는 후속 연구들에게 인용되므로 더 높다. 다만 두 지표 모두 인용 구조의 요약일 뿐, 논문의 주장이 맞는지와는 무관하다. 인용 지표는 무엇을 먼저 읽을지 정하는 단서로만 쓴다."

[[questions.choices]]
text = "`원전15`를 인용한 논문들 자체가 많이 인용되는 논문이어서, 중요한 논문에게 받은 인용이 더 큰 가중치를 받는다."
correct = true

[[questions.choices]]
text = "`원전15`가 더 정확한 결과를 담고 있기 때문이다."
feedback = "PageRank는 인용 구조만 본다. 결과의 정확성은 원문을 읽고 판단해야 한다."

[[questions.choices]]
text = "`원전15`가 더 오래되어 시간에 따른 가중치를 받기 때문이다."
feedback = "이 계산에는 시간 가중치가 없다. 오래된 논문이 인용을 모을 시간이 많았던 것은 사실이지만, 여기서 두 논문의 피인용 수는 같다."

[[questions.choices]]
text = "`후속18`의 참고문헌이 많아서 점수가 깎였기 때문이다."
feedback = "자기 참고문헌의 수는 자신이 **나눠 주는** 몫을 정할 뿐, 자기 점수를 깎지 않는다."

[[questions]]
id = "dedup-identifier"
type = "single"
objective = 2
prompt = "arXiv 프리프린트(2020년, 제목 A)와 저널 게재본(2021년, 제목이 조금 바뀐 A')이 검색 결과에 함께 들어 있다. 두 레코드가 같은 논문임을 가장 확실하게 판단하는 근거는?"
explanation = "제목과 연도는 판(version)에 따라 바뀐다. 같은 arXiv id나 DOI가 두 레코드에 공통으로 걸려 있으면(예: 한 도구가 저널 레코드에 arXiv id를 함께 표시) 같은 논문으로 묶을 수 있다. 식별자가 없을 때만 정규화한 제목의 유사도를 쓰고, 그 경우에도 사람이 확인할 후보로 둔다."

[[questions.choices]]
text = "두 레코드를 잇는 공통 식별자(arXiv id 또는 DOI)"
correct = true

[[questions.choices]]
text = "제목과 연도가 정확히 같은지"
feedback = "판이 바뀌면 제목과 연도가 함께 바뀌는 일이 흔하다. 이 기준으로는 같은 논문을 두 편으로 센다."

[[questions.choices]]
text = "첫 저자의 이름이 같은지"
feedback = "같은 저자가 같은 해에 비슷한 주제로 여러 편을 쓰는 일은 흔하다."

[[questions]]
id = "map-by-assumption"
type = "multiple"
objective = 2
prompt = "관련 연구 지도를 만들 때, 논문마다 노트에 기록해 두면 이후 연구 질문을 찾는 데 도움이 되는 것을 모두 고르시오."
explanation = "같은 방법 이름을 쓰는 논문들도 푸는 문제, 기대는 가정, 드러난 한계가 다르다. 이 세 축으로 정리하면 '이 가정이 깨지는 곳에서 아무도 시험하지 않았다' 같은 빈틈이 보인다. 원문에서 확인한 위치를 함께 적어야 나중에 인용할 때 다시 확인할 수 있다. 방법의 이름과 인용 수만으로는 빈틈이 드러나지 않는다."

[[questions.choices]]
text = "논문이 푸는 문제(입력·출력·일반화 대상)"
correct = true

[[questions.choices]]
text = "결과가 기대는 가정(데이터 분포, 물리적 가정, 평가 분할)"
correct = true

[[questions.choices]]
text = "저자가 밝힌 한계와 내가 발견한 한계, 그리고 원문의 해당 위치"
correct = true

[[questions.choices]]
text = "방법의 이름과 인용 수만 적으면 충분하다."
feedback = "같은 이름의 방법도 가정이 다르고, 인용 수는 주장의 타당성과 무관하다. 이것만으로는 연구의 빈틈이 보이지 않는다."

[[questions]]
id = "cite-from-abstract"
type = "single"
objective = 2
prompt = "AI 요약 도구가 \"논문 X는 이 방법이 모든 PDE에서 기존 방법보다 10배 빠르다고 보였다\"고 알려 줬다. 이 문장을 내 논문의 관련 연구 절에 인용하기 전에 할 일은?"
explanation = "요약과 초록은 조건(어떤 PDE, 어떤 해상도, 무엇과 비교한 속도인지)을 빼먹기 쉽고, AI 요약은 존재하지 않는 수치를 만들기도 한다. 인용하는 주장은 원문에서 해당 표·절을 직접 찾아 조건과 함께 확인하고, 노트에 위치를 남긴다."

[[questions.choices]]
text = "원문에서 그 수치가 나온 표나 절을 찾아 조건(문제·비교 대상·하드웨어)을 확인하고, 노트에 위치와 함께 기록한다."
correct = true

[[questions.choices]]
text = "초록에 같은 내용이 있으면 그대로 인용한다."
feedback = "초록은 가장 유리한 결과를 조건 없이 요약하는 경우가 많다. 인용하는 주장의 범위는 본문의 실험이 정한다."

[[questions.choices]]
text = "인용 수가 많은 논문이면 확인 없이 인용해도 된다."
feedback = "인용 수는 주장이 맞는지 알려 주지 않는다. 많이 인용된 수치도 조건이 빠진 채 전달되며 변형되기 쉽다."
