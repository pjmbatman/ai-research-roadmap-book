# 23.11 투고와 동료 심사 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "self-citation-anonymity"
type = "single"
objective = 1
prompt = '''이중 맹검(double-blind) 학회에 투고하는 논문에서 자신의 이전 연구 [12]를 언급해야 한다. 가장 적절한 방법은?'''
explanation = '''이중 맹검에서는 자기 연구도 다른 사람의 연구처럼 3인칭으로 인용한다. 그러면 심사자는 [12]가 저자의 연구인지 알 수 없고, 관련 연구도 빠지지 않는다. 1인칭 인용과 실명 저장소 링크는 신원을 드러내고, 인용을 지우면 관련 연구가 빠진 논문이 된다. 구체적인 익명화 규칙(익명 사본 제출 허용 여부 등)은 학회마다 다르므로 해당 규정을 확인한다.'''

[[questions.choices]]
text = '''"Kim 외 [12]는 이 방법이 ...임을 보였다"처럼 3인칭으로 인용한다.'''
correct = true

[[questions.choices]]
text = '''"우리의 이전 연구 [12]에서 보였듯이"라고 쓴다.'''
feedback = "1인칭 표현과 인용 번호를 함께 쓰면 참고문헌 목록에서 저자가 바로 드러난다."

[[questions.choices]]
text = "익명성을 지키기 위해 자신의 이전 연구는 인용하지 않는다."
feedback = "관련 연구가 빠진 논문이 되고, 심사자는 기존 연구와의 차이를 판단할 수 없다. 익명성은 3인칭 인용으로 지킨다."

[[questions.choices]]
text = "이전 연구의 코드가 있는 실명 GitHub 저장소 링크를 본문에 넣어 재현성을 보인다."
feedback = "실명 계정의 링크는 신원을 드러낸다. 코드는 학회가 허용하는 방식의 익명화된 사본으로 낸다."

[[questions]]
id = "reviewer-conflict-of-interest"
type = "multiple"
objective = 1
prompt = '''심사 배정을 받은 논문의 저자 목록을 보았다. 다음 중 일반적으로 **이해 상충**으로 신고하거나 편집자·AC에게 알려야 하는 관계를 모두 고르시오. (구체적인 기간과 범위는 학회·저널 규정을 따른다.)'''
explanation = '''최근의 공동 저자, 같은 기관 소속, 지도 관계는 대부분의 규정에서 이해 상충으로 다룬다. 판단이 호의나 반감으로 기울 수 있는 관계이기 때문이다. 반면 저자의 논문을 읽고 인용한 적이 있거나, 같은 분야에서 일하는 것은 이해 상충이 아니다. 그런 사람이 바로 그 논문을 평가할 전문성을 가진 심사자다.'''

[[questions.choices]]
text = "2년 전 저자 중 한 명과 논문을 함께 썼다."
correct = true

[[questions.choices]]
text = "저자 중 한 명이 나와 같은 학과 소속이다."
correct = true

[[questions.choices]]
text = "저자 중 한 명이 나의 박사 지도교수였다."
correct = true

[[questions.choices]]
text = "저자들의 이전 논문을 읽고 내 논문에서 인용한 적이 있다."
feedback = "인용은 이해 상충이 아니다. 그 분야를 안다는 뜻이고, 심사자로 배정된 이유일 수 있다."

[[questions.choices]]
text = "나도 같은 주제(그래프 신경망을 이용한 분자 물성 예측)를 연구한다."
feedback = "같은 분야에서 일하는 것은 심사자의 자격이다. 다만 같은 결과를 두고 직접 경쟁하는 연구를 진행 중이라면 심사를 맡기 전에 알린다."

[[questions]]
id = "kappa-from-table"
type = "numeric"
objective = 2
prompt = '''두 심사자가 논문 100편에 채택·거절 권고를 냈다. 둘 다 채택 15편, 둘 다 거절 65편, 심사자 1만 채택 10편, 심사자 2만 채택 10편이었다. Cohen kappa를 소수점 둘째 자리까지 구하시오.'''
answer = 0.467
tolerance = 0.01
explanation = '''관측 일치율 $p_o = (15 + 65)/100 = 0.80$이다. 심사자 1의 채택 비율은 $(15 + 10)/100 = 0.25$, 심사자 2도 $0.25$다. 우연 일치율 $p_e = 0.25 \times 0.25 + 0.75 \times 0.75 = 0.625$이므로 $\kappa = (0.80 - 0.625)/(1 - 0.625) = 0.175/0.375 \approx 0.47$이다. 일치율 0.80 중 상당 부분은 두 심사자가 모두 거절을 많이 하기 때문에 생긴 우연 일치다.'''

[[questions]]
id = "calibrated-scores"
type = "single"
objective = 2
prompt = '''심사자 H는 맡은 논문들에 평균 3.5점(표준편차 1)을, 심사자 L은 평균 7.5점(표준편차 1)을 주었다. 논문 X는 H에게 5점, 논문 Y는 L에게 7점을 받았다. 두 심사자가 받은 논문들의 질이 평균적으로 비슷하다고 가정할 때 옳은 해석은?'''
explanation = '''심사자별로 표준화하면 X는 $(5 - 3.5)/1 = +1.5$, Y는 $(7 - 7.5)/1 = -0.5$다. X는 엄격한 심사자에게서 평균보다 훨씬 높은 점수를, Y는 관대한 심사자에게서 평균보다 낮은 점수를 받았다. 이 해석은 두 심사자가 받은 논문들의 질이 비슷하다는 가정에 기댄다. 그래서 실제 AC는 숫자 보정과 함께 리뷰의 내용과 확신도를 읽는다.'''

[[questions.choices]]
text = "원점수가 높은 Y가 더 좋은 평가를 받았다."
feedback = "심사자마다 점수를 주는 습관이 다르다. L에게 7점은 평균 이하다."

[[questions.choices]]
text = "심사자별로 표준화하면 X(+1.5)가 Y(-0.5)보다 상대적으로 좋은 평가를 받았다."
correct = true

[[questions.choices]]
text = "심사자가 다르므로 두 점수에서는 아무것도 알 수 없다."
feedback = "가정 없이는 비교가 어렵지만, 각 심사자의 점수 분포를 알면 그 심사자 기준의 상대적 위치는 알 수 있다. 문제의 가정 아래에서는 비교할 수 있다."

[[questions.choices]]
text = "두 점수의 평균 6점으로 두 논문을 같게 본다."
feedback = "두 논문은 서로 다른 심사자에게 평가받았다. 점수를 섞어 평균 내면 심사자의 습관 차이가 그대로 남는다."

[[questions]]
id = "constructive-weakness"
type = "single"
objective = 3
prompt = '''다음 중 리뷰의 약점 항목으로 가장 건설적인 것은?'''
explanation = '''건설적인 약점 지적은 무엇이 문제인지(seed 하나), 왜 결론에 영향을 주는지(개선이 변동보다 큰지 모름), 무엇을 하면 해소되는지(여러 seed의 평균과 표준편차)를 담는다. 저자는 무엇을 고칠지 알고, AC는 그 약점이 얼마나 중요한지 판단할 수 있다.'''

[[questions.choices]]
text = "실험이 부족하다. 더 많은 실험이 필요하다."
feedback = "어떤 실험이 왜 필요한지 없다. 저자는 무엇을 추가해야 할지 알 수 없다."

[[questions.choices]]
text = "표 2의 개선(0.3%p)은 seed 하나의 결과다. seed 5개 이상의 평균과 표준편차를 보고하면 개선이 seed 변동보다 큰지 판단할 수 있다."
correct = true

[[questions.choices]]
text = "저자들은 이 분야의 기본적인 관행을 모르는 것 같다."
feedback = "논문이 아니라 사람을 평가하는 문장이다. 어떤 관행이 어디서 빠졌는지 구체적으로 쓴다."

[[questions.choices]]
text = "이 문제에는 내가 제안한 방법 X가 더 적합하므로 X를 인용하고 비교해야 한다."
feedback = "자기 논문의 인용을 요구하는 것은 심사자의 이해 상충이다. 비교가 결론에 꼭 필요하다면 다른 관련 연구와 같은 기준으로 근거를 들어 요청한다."

[[questions]]
id = "rebuttal-to-misreading"
type = "single"
objective = 3
prompt = '''심사자가 "분할 단위별(셀 단위) 평가가 없다"고 지적했지만, 그 결과는 이미 4.3절의 표 3에 있다. rebuttal에서 가장 효과적인 대응은?'''
explanation = '''심사자가 놓쳤다면 다른 독자도 놓친다. 결과의 위치를 정확히 알려 주고, 눈에 잘 띄지 않았던 서술을 어떻게 고칠지 제시하면 심사자와 AC가 바로 확인할 수 있고, 수정본의 품질도 올라간다. 심사자의 부주의를 탓하는 문장은 사실이어도 판단을 바꾸지 못한다.'''

[[questions.choices]]
text = "심사자가 논문을 꼼꼼히 읽지 않았다고 AC에게 지적한다."
feedback = "AC는 한 심사자가 놓친 곳을 다른 독자도 놓칠 곳으로 읽는다. 탓하는 문장은 정보를 주지 않는다."

[[questions.choices]]
text = "결과가 4.3절 표 3에 있다고 위치를 알려 주고, 그 결과가 눈에 띄도록 서론의 기여 목록과 3절에서 언급하겠다고 수정 내용을 제시한다."
correct = true

[[questions.choices]]
text = "오해에서 나온 지적이므로 답하지 않고 다른 지적에 분량을 쓴다."
feedback = "답하지 않으면 심사자와 AC는 그 약점이 실제로 있다고 남겨 둔다. 짧게라도 위치를 알려 준다."

[[questions.choices]]
text = "같은 결과를 다른 형식으로 다시 계산해 새 실험인 것처럼 보고한다."
feedback = "이미 있는 결과를 새 실험처럼 보이게 하는 것은 정확한 정보가 아니다. 있는 결과의 위치를 알려 주면 된다."

[[questions]]
id = "resubmission-after-rejection"
type = "multiple"
objective = 1
prompt = '''ML 학회에서 거절된 논문을 다른 곳에 다시 내려 한다. 다음 중 적절한 것을 모두 고르시오.'''
explanation = '''리뷰의 타당한 지적, 특히 여러 심사자의 공통 지적을 먼저 반영하고, 새 투고처의 형식·익명성 규칙을 다시 확인한다. 거절 이유가 투고처와의 맞지 않음이라면 투고처를 다시 고른다. 같은 원고를 고치지 않고 내면 같은 심사자를 다시 만날 수 있고, 두 곳에 동시에 내는 이중 투고는 일반적으로 금지된다.'''

[[questions.choices]]
text = "여러 심사자가 공통으로 지적한 약점부터 고친 뒤 투고한다."
correct = true

[[questions.choices]]
text = "새 투고처의 쪽수·형식·익명성 규칙을 다시 확인해 원고를 맞춘다."
correct = true

[[questions.choices]]
text = "심사는 잡음이 크므로 원고를 고치지 않고 다음 마감에 그대로 낸다."
feedback = "잡음이 크다는 것이 리뷰에 정보가 없다는 뜻은 아니다. 같은 분야의 심사자 집단은 작아 같은 심사자를 다시 만날 수 있다."

[[questions.choices]]
text = "결정을 빨리 받기 위해 학회와 저널 두 곳에 동시에 투고한다."
feedback = "이중 투고는 일반적으로 금지되고, 드러나면 두 곳 모두에서 거절되거나 더 무거운 조치를 받을 수 있다."

[[questions.choices]]
text = "거절 이유가 \"ML 기여가 작다\"였다면, 과학적 결과가 기여인 연구로서 분야 저널을 투고처로 검토한다."
correct = true
