# 23.8 논문 작성 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "claim-evidence-mapping"
type = "single"
objective = 1
prompt = '''초록에 "제안한 모델은 새로운 배터리 화학조성으로 일반화된다"라고 썼다. 그런데 실험은 모두 NMC 셀이고, 시험 세트는 학습에 쓰지 않은 NMC 셀 80개다. 투고 전에 할 일로 가장 적절한 것은?'''
explanation = '''주장–근거 표에서 이 주장의 근거 칸은 비어 있다. 시험 세트가 보여 주는 것은 "같은 화학조성의 새 셀"로의 일반화이지 "새 화학조성"으로의 일반화가 아니다. 주장을 근거의 범위로 좁히거나(같은 화학조성의 새 셀), 다른 화학조성의 셀로 실험을 추가해야 한다. 한계 절에 쓰는 것만으로는 부족하다. 초록의 주장 자체가 근거보다 넓기 때문이다.'''

[[questions.choices]]
text = "주장을 \"학습에 쓰지 않은 같은 화학조성(NMC)의 셀에서 성능이 유지된다\"로 좁히거나, 다른 화학조성의 셀로 실험을 추가한다."
correct = true

[[questions.choices]]
text = "초록은 그대로 두고, 한계 절에 \"다른 화학조성은 시험하지 않았다\"를 덧붙인다."
feedback = "초록이 근거보다 넓은 주장을 하는 문제는 그대로 남는다. 독자는 초록을 읽고 한계 절은 읽지 않을 수 있다."

[[questions.choices]]
text = "시험 셀 80개는 학습에 쓰지 않은 데이터이므로 일반화의 근거로 충분하다."
feedback = "학습에 쓰지 않았다는 것과 새 화학조성이라는 것은 다르다. 근거가 보이는 일반화는 같은 분포의 새 표본까지다."

[[questions]]
id = "limitations-specific"
type = "single"
objective = 2
prompt = '''제안한 방법이 저온(0 °C)에서는 baseline보다 나빴다. 한계 서술로 가장 적절한 것은?'''
explanation = '''한계 절은 주장의 범위를 정확히 하는 절이다. 어떤 조건에서 얼마나 나빴는지(숫자와 근거 위치), 가능한 원인과 그것을 확인했는지, 검증하지 않은 범위를 구체적으로 쓴다. 모호한 한 줄은 독자에게 아무 정보도 주지 않고, 불리한 결과를 빼는 것은 리뷰어가 발견하면 논문 전체의 신뢰를 떨어뜨린다.'''

[[questions.choices]]
text = "\"본 연구에는 일부 한계가 있으며 향후 연구에서 보완할 예정이다.\""
feedback = "어떤 조건에서 무엇이 얼마나 부족한지 없다. 독자는 이 방법을 어디에 쓰면 안 되는지 알 수 없다."

[[questions.choices]]
text = "0 °C 결과는 주장과 맞지 않으므로 표에서 빼고, 25 °C와 45 °C 결과만 보고한다."
feedback = "결과를 본 뒤 불리한 조건을 빼면 선택 편향이다. 저온에서 이 방법을 쓰는 독자가 손해를 본다."

[[questions.choices]]
text = "\"제안한 방법은 0 °C에서 baseline보다 MAE가 0.27 %p 컸다(표 2). 저온 데이터 증량으로는 판정할 수 있는 개선이 없었으며(부록 C), 저온에서의 원인은 확인하지 못했다.\""
correct = true

[[questions]]
id = "report-variability"
type = "multiple"
objective = 1
prompt = '''결과 표에 "정확도 0.912 ± 0.004"라고만 썼다. 독자가 이 숫자의 신뢰도를 판단하는 데 빠진 정보를 모두 고르시오.'''
explanation = '''"±" 뒤의 값이 표준편차인지 표준오차인지 신뢰구간 반폭인지에 따라 해석이 $\sqrt{n}$배 이상 달라진다. 몇 번을 무엇을 바꿔 반복했는지(seed 수, 분할 방식)가 없으면 변동성의 출처를 알 수 없다. 데이터셋과 시험 조건도 필요하다. 소수점 아래 자릿수를 늘리는 것은 정보가 아니다. 변동성이 0.004면 셋째 자리가 이미 불확실하다.'''

[[questions.choices]]
text = "± 값이 표준편차인지, 표준오차인지, 신뢰구간 반폭인지"
correct = true

[[questions.choices]]
text = "몇 번 반복했고(seed·분할 수) 무엇을 바꿔 변동을 쟀는지"
correct = true

[[questions.choices]]
text = "어떤 데이터셋·시험 조건에서 잰 값인지"
correct = true

[[questions.choices]]
text = "소수점 아래 다섯째 자리까지의 값"
feedback = "변동성이 0.004인데 다섯째 자리를 쓰면 의미 없는 정밀도를 과시하는 것이다. 자릿수는 불확실성에 맞춘다(23.9장)."

[[questions]]
id = "overclaim-generalize"
type = "single"
objective = 1
prompt = '''한 데이터셋에서 seed 5개로 실험해, 제안 방법의 오차가 baseline보다 작았고 짝지은 차이의 95% 구간이 0을 포함하지 않았다. 다음 중 근거에 맞는 초록 문장은?'''
explanation = '''근거는 "한 데이터셋, seed 5개, 짝지은 구간이 0을 포함하지 않음"이다. 이에 맞는 문장은 데이터셋을 밝히고 효과 크기와 구간을 쓰는 것이다. "해결한다"는 기준이 없고, "다양한 조건에서 일반화"는 시험하지 않은 범위로 주장을 넓힌 것이며, "모델이 물리를 이해한다"는 내부 메커니즘을 확인하지 않은 해석이다.'''

[[questions.choices]]
text = "\"제안한 방법은 배터리 수명 예측 문제를 해결한다.\""
feedback = "해결의 기준이 없고, 데이터셋 하나의 결과를 문제 전체로 넓혔다."

[[questions.choices]]
text = "\"제안한 방법은 다양한 조건에서 일반화되는 강건한 성능을 보인다.\""
feedback = "실험은 데이터셋 하나다. '다양한 조건'과 '강건한'은 시험하지 않은 범위를 주장한다."

[[questions.choices]]
text = "\"데이터셋 D의 시험 셀에서 제안한 방법은 baseline보다 MAE를 0.19 %p(95% 구간 [0.13, 0.25], seed 5개) 줄였다.\""
correct = true

[[questions.choices]]
text = "\"제안한 모델은 배터리 열화의 물리를 이해한다.\""
feedback = "예측 오차가 작다는 것은 모델 내부가 물리를 표현한다는 증거가 아니다. 메커니즘을 확인하지 않은 해석이다."

[[questions]]
id = "latex-notation-macro"
type = "single"
objective = 3
prompt = '''공동 저자와 논의한 끝에 논문 전체에서 파라미터 벡터 표기를 `\theta`에서 `\boldsymbol{\theta}`로 바꾸기로 했다. 본문·부록·알고리즘 박스에 이 기호가 120번 나온다. 앞으로 같은 일을 가장 안전하게 하는 방법은?'''
explanation = '''preamble에 `\newcommand{\vtheta}{\boldsymbol{\theta}}` 같은 매크로를 정의하고 본문에서는 매크로만 쓰면, 표기를 바꿀 때 정의 한 줄만 고치면 된다. 일괄 치환은 다른 뜻으로 쓴 `\theta`(예: 각도)까지 바꾸거나 일부를 놓친다. 표기 표만 두는 것은 일관성을 강제하지 못한다.'''

[[questions.choices]]
text = "편집기의 전체 바꾸기로 `\\theta`를 `\\boldsymbol{\\theta}`로 바꾼다."
feedback = "각도처럼 다른 뜻으로 쓴 \\theta까지 바뀌고, 그림 안의 기호나 다른 파일은 빠질 수 있다."

[[questions.choices]]
text = "preamble에 표기 매크로(예: `\\vtheta`)를 정의하고 본문에서는 매크로만 쓴다."
correct = true

[[questions.choices]]
text = "논문 앞에 표기 표를 두고, 저자들이 표를 보고 직접 맞춰 쓴다."
feedback = "표기 표는 독자를 위한 것이고 일관성을 강제하지 못한다. 고칠 때마다 120곳을 손으로 찾아야 한다."

[[questions]]
id = "ai-citation-check"
type = "single"
objective = 3
prompt = '''AI 글쓰기 도구에 관련 연구 단락을 다듬어 달라고 했더니, 원고에 없던 참고문헌 두 개가 그럴듯한 서지 정보와 함께 추가되었다. 어떻게 해야 하는가?'''
explanation = '''AI 도구는 존재하지 않는 논문이나 틀린 서지 정보를 그럴듯하게 만들어 낼 수 있다. 인용은 원문을 직접 확인한 것만 쓴다. 원문을 찾아 읽고 주장이 실제로 그 논문에 있는지 확인한 뒤에만 남긴다. 서지 정보가 형식에 맞는다는 것은 존재의 증거가 아니다. 도구 사용 사실은 연구 노트에 기록하고, 투고처 정책이 요구하면 밝힌다.'''

[[questions.choices]]
text = "서지 정보가 BibTeX 형식에 맞고 저자 이름이 실제 연구자이므로 그대로 둔다."
feedback = "형식이 맞고 저자가 실재해도 논문 자체가 없거나 다른 내용일 수 있다."

[[questions.choices]]
text = "두 논문의 원문을 직접 찾아 읽고, 존재하고 해당 주장을 실제로 담고 있을 때만 남긴다. 확인되지 않으면 지운다."
correct = true

[[questions.choices]]
text = "인용 문장 끝에 \"(AI 도구가 제시함)\"이라고 표시하고 남긴다."
feedback = "출처 표시는 확인을 대신하지 못한다. 존재하지 않는 논문을 인용하는 문제는 그대로다."
