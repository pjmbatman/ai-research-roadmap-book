# 23.6 결과 분석과 주장의 범위 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "average-hides-subgroup"
type = "single"
objective = 1
prompt = '''시험 셀 440개에서 새 모델 B의 평균 절대오차가 A보다 0.112 %p 낮았다. 온도별로 나누면 0 °C(60개)에서 B − A = +0.270, 25 °C(300개)에서 −0.186, 45 °C(80개)에서 −0.124였다. 이 결과가 지지하는 서술은?'''
explanation = '''전체 평균은 조건별 평균을 샘플 수로 가중한 값이다. 0 °C 셀이 전체의 14%뿐이라 그 조건의 손해가 평균에 묻혔다. 조건별 분해가 보여 주는 것은 "상온·고온에서는 B가 낫고 저온에서는 A가 낫다"이다. 0 °C를 샘플이 적다는 이유로 무시하면, 저온에서 B를 쓰는 독자가 손해를 본다. 또 평균이 낫다는 것은 개별 셀마다 낫다는 뜻도 아니다(25 °C에서도 B가 나은 셀은 63%였다).'''

[[questions.choices]]
text = "B는 전체 평균이 더 낮으므로 모든 온도에서 A보다 낫다."
feedback = "전체 평균은 샘플이 많은 25 °C가 지배한다. 0 °C에서는 B의 오차가 0.270 %p 더 크다."

[[questions.choices]]
text = "B는 25 °C와 45 °C에서 A보다 낫고, 0 °C에서는 A보다 나쁘다. 저온에는 B를 권할 수 없다."
correct = true

[[questions.choices]]
text = "0 °C는 셀이 60개뿐이라 신뢰할 수 없으므로 빼고, B가 A보다 낫다고 쓴다."
feedback = "샘플이 적으면 구간이 넓어질 뿐, 결과를 버릴 이유가 되지 않는다. 결과를 본 뒤 불리한 조건을 빼는 것은 선택 편향이다."

[[questions.choices]]
text = "평균이 낮으므로 B는 대부분의 개별 셀에서 A보다 오차가 작다."
feedback = "평균 차이와 개별 셀의 승률은 다르다. 이 시뮬레이션의 25 °C에서도 B가 나은 셀은 63%였고, 0 °C에서는 37%였다."

[[questions]]
id = "mean-only-win"
type = "single"
objective = 2
prompt = '''seed 3개로 학습한 결과 정확도 평균이 B 0.912, A 0.905였다. 같은 seed끼리 짝지은 차이 B − A의 95% 구간은 [−0.004, +0.018]이다. 가장 적절한 서술은?'''
explanation = '''구간이 0을 포함하므로 이 데이터로는 방향을 말할 수 없다. "판정 보류"가 맞다. 평균이 높다는 것만으로 우월을 주장하면 seed 변동을 무시한 것이다. 반대로 "두 방법은 같다"고 쓰는 것도 틀렸다. 구간은 +0.018의 개선도 배제하지 못한다. 결론이 원하는 방향으로 나올 때까지 seed를 바꾸는 것은 선택 편향을 만든다. seed를 늘리려면 미리 정한 수만큼 늘리고 전부 보고한다.'''

[[questions.choices]]
text = "B의 평균이 0.007 높으므로 B가 A보다 낫다고 쓴다."
feedback = "평균 차이는 seed 변동보다 작을 수 있다. 짝지은 차이의 구간이 0을 포함하므로 우월을 주장할 근거가 없다."

[[questions.choices]]
text = "구간이 0을 포함하므로 두 방법의 성능이 같다고 쓴다."
feedback = "0을 포함한다는 것은 차이가 0이라는 증거가 아니다. 구간은 +0.018의 개선도 데이터와 맞는다고 말한다."

[[questions.choices]]
text = "판정을 보류한다. 개선 방향은 시사되지만 seed 3개로는 차이가 변동보다 크다고 말할 수 없다."
correct = true

[[questions.choices]]
text = "seed를 하나씩 추가하며 구간이 0을 벗어나는 순간 실험을 멈추고 B 우세로 보고한다."
feedback = "결과를 보면서 멈추는 시점을 고르면 거짓 양성 확률이 명목값보다 커진다. 반복 수는 미리 정한다."

[[questions]]
id = "holm-count"
type = "numeric"
objective = 2
prompt = '''네 조건에서 두 방법을 비교한 p-value가 0.004, 0.014, 0.020, 0.200이다. 가족별 오류율 $\alpha = 0.05$로 Holm 절차를 적용하면 몇 개의 가설이 기각되는가?'''
answer = 3
tolerance = 0
slider = { min = 0, max = 4, step = 1, unit = "개" }
explanation = '''p-value를 정렬해 차례로 비교한다. $0.004 \le 0.05/4 = 0.0125$ 기각, $0.014 \le 0.05/3 \approx 0.0167$ 기각, $0.020 \le 0.05/2 = 0.025$ 기각, $0.200 > 0.05/1$에서 멈춘다. 3개가 기각된다. 같은 데이터에 Bonferroni(모두 $0.0125$와 비교)를 쓰면 1개만 기각된다. Holm은 같은 가족별 오류율 보장을 유지하면서 Bonferroni보다 항상 같거나 많이 기각한다.'''

[[questions]]
id = "ablation-alternative"
type = "multiple"
objective = 2
prompt = '''새 모델 B는 baseline A보다 파라미터가 3배 많고, B는 하이퍼파라미터를 50번 탐색했지만 A는 기본 설정이다. B가 A보다 낫다는 결과를 "B의 새 구성 요소 덕분"이라고 주장하려 할 때, 대안 설명을 배제하는 데 필요한 실험을 모두 고르시오.'''
explanation = '''대안 설명 하나마다 그것만 바꾸는 실험이 필요하다. 용량 설명은 A를 같은 파라미터 수로 키운 비교로, 튜닝 예산 설명은 A에도 같은 탐색 예산을 준 비교로, 구성 요소의 기여는 그 요소만 뺀 ablation으로 확인한다. 시험 세트를 키우거나 seed를 늘리면 차이의 구간이 좁아질 뿐, 차이가 어디서 왔는지는 알려 주지 않는다.'''

[[questions.choices]]
text = "A를 B와 같은 파라미터 수로 키워 다시 비교한다."
correct = true

[[questions.choices]]
text = "A에도 같은 하이퍼파라미터 탐색 예산(50번)을 주고 다시 비교한다."
correct = true

[[questions.choices]]
text = "B에서 새 구성 요소만 빼고 나머지는 같게 학습해 비교한다."
correct = true

[[questions.choices]]
text = "B와 A를 두 배 큰 시험 세트에서 다시 평가한다."
feedback = "시험 세트를 키우면 차이를 더 정밀하게 잴 뿐, 차이가 용량·튜닝·구성 요소 중 어디서 왔는지는 구별하지 못한다."

[[questions.choices]]
text = "B의 seed를 10개로 늘려 B의 결과가 안정적임을 보인다."
feedback = "B의 변동이 작다는 것은 B가 이긴 이유와 무관하다. 대안 설명은 비교 조건을 바꾸는 실험으로만 배제된다."

[[questions]]
id = "null-is-not-absence"
type = "single"
objective = 3
prompt = '''새 정규화 기법을 시험했더니 오차 변화(새 기법 − 기존)의 95% 구간이 [−0.30, +0.05]였다. 의미 있는 개선의 기준은 0.05 이상 감소다. 연구 노트에 남길 결론으로 가장 적절한 것은?'''
explanation = '''구간이 0을 포함하지만 넓다. −0.30(큰 개선)부터 +0.05(약간 악화)까지 모두 데이터와 맞으므로 "효과 없음이 확인됨"이 아니라 "판정 불가"다. 효과 없음을 주장하려면 구간이 0 근처에 좁게 모여 의미 있는 크기의 효과(여기서는 0.05 이상의 감소)를 배제해야 한다. 판정 불가로 기록하고, 결론을 내리는 데 필요한 seed·데이터 규모를 함께 적는다.'''

[[questions.choices]]
text = "효과 없음. 이 기법은 다시 시도하지 않는다고 기록한다."
feedback = "구간이 −0.30까지 걸쳐 있어 큰 개선도 배제하지 못한다. 넓은 구간을 효과 없음으로 기록하면 쓸모 있는 아이디어를 버릴 수 있다."

[[questions.choices]]
text = "판정 불가. 구간이 큰 개선과 효과 없음을 모두 포함하므로, 필요한 seed·데이터 규모와 함께 미결로 기록한다."
correct = true

[[questions.choices]]
text = "점추정값이 음수이므로 개선 효과가 있다고 기록한다."
feedback = "구간이 0을 포함하므로 방향도 확정되지 않았다. 점추정값만으로 결론을 내리면 우연을 효과로 기록할 수 있다."

[[questions]]
id = "negative-result-record"
type = "single"
objective = 3
prompt = '''한 달 동안 시도한 데이터 증강 기법이 효과를 보이지 않았다. 반년 뒤 자신이나 동료가 이 결과를 다시 쓸 수 있게 하려면 무엇을 기록해야 하는가?'''
explanation = '''부정적 결과는 "왜 실패했는가"를 판단할 수 있어야 쓸모가 있다. 가설과 예상 효과 크기, 정확한 설정(커밋·설정 파일·데이터 버전), 결과와 구간, 시도한 범위(하이퍼파라미터·seed 수), 실패 원인에 대한 가설과 그중 배제한 것을 남긴다. "효과 없음" 한 줄은 구현 버그였는지, seed가 부족했는지, 아이디어 자체가 틀렸는지 구별하지 못한다.'''

[[questions.choices]]
text = "\"증강 X: 효과 없음\" 한 줄이면 충분하다. 실패한 실험의 세부는 다시 볼 일이 없다."
feedback = "한 줄로는 구현 실패·판정 불가·효과 없음 확인을 구별할 수 없다. 같은 실험을 다시 하게 되는 가장 흔한 이유다."

[[questions.choices]]
text = "가설과 예상 효과, 커밋·설정·데이터 버전, 결과와 구간, 시도한 하이퍼파라미터 범위와 seed 수, 실패 원인 가설과 배제 여부를 기록한다."
correct = true

[[questions.choices]]
text = "성공한 실험만 기록하고, 실패한 실험의 코드와 결과는 저장소를 깔끔하게 하기 위해 지운다."
feedback = "실패를 지우면 시도한 것의 분모가 사라져, 성공한 결과가 얼마나 우연인지 판단할 수 없다. 코드는 브랜치나 커밋으로 남긴다."
