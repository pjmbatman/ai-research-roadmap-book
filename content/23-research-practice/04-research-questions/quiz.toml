# 23.4 연구 질문과 가설 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "testable-hypothesis"
type = "single"
objective = 1
prompt = "재현 실험에서 '학습 온도 범위 밖에서 오차가 급격히 커진다'는 관찰을 했다. 이 관찰에서 나온 가설 중 검증 가능한 형태로 가장 잘 쓴 것은?"
explanation = "검증 가능한 가설은 무엇을 바꾸면(물리 제약 항 추가) 어떤 조건에서(학습 범위 밖 온도, 온도 기준 분할) 무엇이 어떻게(RMSE 비율) 달라질지를 말하고, 어떤 결과가 나오면 틀렸다고 볼지가 정해져 있다. '더 좋아질 것이다', '이해한다'는 반증할 방법이 없고, 모델을 키우는 것은 가설이 아니라 시도다."

[[questions.choices]]
text = "에너지 보존 제약을 손실에 더하면, 온도 기준 분할의 범위 밖 시험 구간에서 RMSE가 baseline 대비 20% 이상 줄어든다. 줄지 않으면 외삽 실패의 원인은 보존 법칙 위반이 아니다."
correct = true

[[questions.choices]]
text = "물리 지식을 넣으면 모델이 더 좋아질 것이다."
feedback = "무엇을, 어떤 조건에서, 얼마나가 빠져 있어 어떤 결과도 이 문장을 반증하지 못한다."

[[questions.choices]]
text = "더 큰 모델을 쓰면 외삽 문제가 해결될 것이다."
feedback = "관찰된 실패의 원인에 대한 가설이 없다. 결과가 나와도 왜 그런지 말할 수 없다."

[[questions.choices]]
text = "모델이 온도와 열화의 관계를 이해하는지 확인한다."
feedback = "'이해'를 무엇으로 측정할지 정의되지 않았다. 측정 가능한 예측으로 바꿔야 검증할 수 있다."

[[questions]]
id = "harking-rate"
type = "numeric"
objective = 1
prompt = "참 효과가 전혀 없는 실험에서, 서로 독립인 하위 그룹 10개의 결과를 보고 가장 좋아 보이는 그룹을 골라 그 그룹에 대한 단측 검정($\\alpha = 0.05$)을 '가설'로 보고한다. 적어도 한 그룹에서 '유의한 개선'이 나올 확률은? (소수 둘째 자리까지)"
explanation = "각 그룹이 우연히 유의할 확률이 0.05이고 독립이면, 하나도 유의하지 않을 확률은 $0.95^{10} \\approx 0.599$이므로 적어도 하나가 유의할 확률은 $1 - 0.599 \\approx 0.40$이다. 본문 시뮬레이션의 0.399와 같다. 결과를 본 뒤 가설을 고르면 명목 유의수준 5%가 실제로는 40%가 된다. 이것이 사후 가설(HARKing)의 비용이다."
answer = 0.40
tolerance = 0.01

[[questions]]
id = "contribution-type"
type = "single"
objective = 2
prompt = "한 연구가 새 모델을 제안하지 않고, 널리 쓰이는 물성 예측 벤치마크에서 무작위 분할을 화학 계열 단위 분할로 바꾸면 기존 방법 10개의 순위가 크게 바뀐다는 것을 보였다. 이 연구의 기여로 가장 적절한 것은?"
explanation = "이 연구는 기존 평가 방식의 문제를 드러내고 새 평가 규칙을 제시한 **분석·벤치마크** 기여다. 새 구조가 없다고 기여가 작은 것이 아니다. 이후의 모든 비교가 이 평가 규칙에 기대게 되므로 영향이 클 수 있다. 이런 기여에 필요한 근거는 SOTA 숫자가 아니라 분할의 타당성과 순위 변화의 견고성(여러 seed·여러 데이터)이다."

[[questions.choices]]
text = "분석·벤치마크 기여: 기존 평가가 일반화 대상과 맞지 않음을 보이고 새 평가 규칙을 제시한다."
correct = true

[[questions.choices]]
text = "새로운 모델을 제안하지 않았으므로 기여가 없다."
feedback = "기여의 종류는 구조·학습법만이 아니다. 데이터·분석·벤치마크 기여는 분야 전체의 비교 기준을 바꾼다."

[[questions.choices]]
text = "기존 방법 중 1위가 된 방법이 기여다."
feedback = "그 방법은 다른 사람의 기여다. 이 연구의 기여는 순위를 바꾼 평가 규칙과 그 근거다."

[[questions]]
id = "complexity-vs-contribution"
type = "single"
objective = 2
prompt = "방법 A는 새 모듈 세 개를 더해 baseline보다 오차를 3% 줄였다. 방법 B는 입력 정규화 한 줄을 바꿔 같은 3%를 줄였고, 그 이유를 실험으로 설명했다. 두 결과 모두 seed 변동보다 확실히 크다. 연구 기여에 대해 옳은 것은?"
explanation = "기여의 크기는 모델의 복잡성이 아니라 무엇을 새로 알게 되었는지와 남이 얼마나 쓸 수 있는지로 정해진다. B는 같은 개선을 더 단순하게 얻었고 원인까지 밝혔으므로, 다른 연구자가 바로 쓰고 다른 문제로 옮길 수 있다. A는 세 모듈 중 무엇이 효과를 냈는지 ablation이 없다면 설명되지 않은 개선이다."

[[questions.choices]]
text = "B의 기여가 작지 않다. 같은 개선을 더 단순하게 얻고 원인을 밝혔으므로 재사용성과 설명력이 더 크다."
correct = true

[[questions.choices]]
text = "A의 기여가 더 크다. 새로 만든 구성요소가 더 많기 때문이다."
feedback = "구성요소의 수는 기여의 크기가 아니다. 무엇이 효과를 냈는지 설명되지 않으면 오히려 약점이다."

[[questions.choices]]
text = "B는 너무 단순해서 논문이 될 수 없다."
feedback = "단순한 변화가 큰 효과를 내는 이유를 보인 연구는 분야에 오래 남는다. 단순함은 기여를 깎지 않는다."

[[questions]]
id = "inconclusive-result"
type = "single"
objective = 3
prompt = "사전에 '의미 있는 최소 개선은 0.02, 성공은 개선의 하한이 0보다 큰 것, 중단은 개선의 상한이 0.02보다 작은 것'으로 정했다. seed 3개로 실험했더니 짝지은 차이의 단측 95% 구간이 [−0.01, +0.04]였다. 사전 규칙에 따른 판정은?"
explanation = "하한(−0.01)이 0보다 크지 않으므로 성공이 아니고, 상한(+0.04)이 0.02보다 작지 않으므로 의미 있는 개선을 배제하지도 못한다. 판정은 **보류**다. 본문의 시뮬레이션처럼 seed 3개로는 참 효과가 없을 때도 절반 정도가 보류로 끝난다. 보류일 때 무엇을 할지(seed를 몇 개로 늘릴지, 그래도 보류면 어떻게 할지)도 미리 정해 두어야 한다. '유의하지 않으니 효과 없음'으로 중단하는 것은 규칙 위반이다."

[[questions.choices]]
text = "보류: 성공도 중단도 아니다. 사전에 정한 대로 seed를 늘려 다시 판정한다."
correct = true

[[questions.choices]]
text = "중단: 유의한 개선이 없으므로 효과가 없다."
feedback = "유의하지 않다는 것은 효과가 없다는 증거가 아니다. 구간이 0.02를 넘는 개선을 아직 포함한다."

[[questions.choices]]
text = "성공: 구간의 대부분이 0보다 크다."
feedback = "사전 규칙은 하한이 0보다 클 것을 요구했다. 결과를 본 뒤 기준을 '대부분'으로 바꾸면 사전 규칙의 의미가 없어진다."
