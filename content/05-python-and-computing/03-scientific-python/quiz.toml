# 5.3 NumPy·pandas·SciPy — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "which-modify-original"
type = "multiple"
objective = 1
prompt = '''`a = np.arange(6.0)`에서 시작한다. 다음 중 실행한 뒤 **`a`의 값이 바뀌는** 코드를 모두 고르시오.'''
explanation = '''basic slicing(`a[1:4]`)과 `reshape`는 가능한 한 같은 메모리를 다른 shape·stride로 보는 **view**를 만든다. view를 제자리에서 바꾸면(`b[:] = 0`, `b *= 2`) 원본이 바뀐다. fancy indexing(`a[[1, 2]]`)과 boolean mask(`a[a > 2]`)는 항상 **copy**를 만들므로 결과를 바꿔도 원본은 그대로다. 단, `a[a > 2] = 0`처럼 인덱싱이 할당문의 **왼쪽**에 있으면 원본에 직접 쓴다.'''

[[questions.choices]]
text = "`b = a[1:4]; b[:] = 0`"
correct = true

[[questions.choices]]
text = "`b = a.reshape(2, 3); b *= 2`"
correct = true

[[questions.choices]]
text = "`b = a[[1, 2]]; b[:] = 0`"
feedback = "정수 리스트로 인덱싱하는 fancy indexing은 새 배열(copy)을 만든다. b를 바꿔도 a는 그대로다."

[[questions.choices]]
text = "`b = a[a > 2]; b[:] = 0`"
feedback = "boolean mask로 꺼낸 결과도 copy다. 원본을 바꾸려면 `a[a > 2] = 0`처럼 할당문 왼쪽에 써야 한다."

[[questions]]
id = "broadcast-column-minus-row"
type = "single"
objective = 1
prompt = '''모델 출력 `y_pred`의 shape이 `(N, 1)`, 정답 `y`의 shape이 `(N,)`이다. `np.mean((y_pred - y) ** 2)`는 무엇을 계산하는가?'''
explanation = '''broadcasting은 shape을 **뒤에서부터** 맞춘다. `(N,)`은 `(1, N)`으로 취급되고, `(N, 1)`과 `(1, N)`은 크기 1인 축이 늘어나 `(N, N)`이 된다. 결과는 모든 예측과 모든 정답 쌍의 차이 제곱 평균이다. 오류 없이 숫자 하나가 나오기 때문에 발견하기 어렵다. 손실 계산 전에 shape을 맞추고(`y_pred[:, 0]` 또는 `y_pred.squeeze(-1)`), `assert y_pred.shape == y.shape`로 확인한다.'''

[[questions.choices]]
text = "N개 예측의 평균 제곱 오차(MSE)"
feedback = "shape이 같아야 원소끼리 짝지어진다. (N, 1)과 (N,)은 같은 shape이 아니다."

[[questions.choices]]
text = "N × N개의 모든 (예측, 정답) 쌍에 대한 차이 제곱의 평균"
correct = true

[[questions.choices]]
text = "shape이 달라 `ValueError`가 난다."
feedback = "broadcasting 규칙상 (N, 1)과 (N,)은 호환된다. 오류가 나지 않아서 위험하다."

[[questions]]
id = "mean-axis-0"
type = "single"
objective = 1
prompt = '''`X`의 shape이 `(N, D)` = (샘플 수, 특성 수)일 때 특성마다의 평균을 구하는 식은?'''
explanation = '''`axis=k`는 **그 축을 따라 줄여서 없앤다**는 뜻이다. 특성마다의 평균은 샘플 축(축 0)을 따라 평균을 내 없애야 하므로 `X.mean(axis=0)`이고 결과 shape은 `(D,)`다. `axis=1`은 샘플마다 특성들의 평균을 내 `(N,)`을 만든다. `N == D`이면 둘 다 shape 오류 없이 실행되므로 값으로 확인해야 한다.'''

[[questions.choices]]
text = "`X.mean(axis=0)` — 결과 shape `(D,)`"
correct = true

[[questions.choices]]
text = "`X.mean(axis=1)` — 결과 shape `(D,)`"
feedback = "axis=1은 특성 축을 줄여 없애므로 샘플마다의 평균, shape (N,)이 나온다. axis는 '남길 축'이 아니라 '줄일 축'이다."

[[questions.choices]]
text = "`X.mean()` — 결과 shape `(D,)`"
feedback = "axis를 주지 않으면 모든 원소의 평균인 스칼라 하나가 나온다."

[[questions]]
id = "int-array-assign"
type = "numeric"
objective = 1
prompt = '''`a = np.array([1, 2, 3])`(정수 배열) 다음 `a[0] = 0.9`를 실행했다. `a[0]`의 값은?'''
answer = 0
tolerance = 0
explanation = '''배열의 dtype은 만들 때 정해지고, 원소를 할당해도 바뀌지 않는다. 정수 배열에 0.9를 넣으면 정수로 변환되면서 소수부가 버려져 0이 된다(반올림이 아니라 0 쪽으로 자름). 오류도 경고도 없다. 실수 값을 넣을 배열은 처음부터 `dtype=float`로 만들거나 `np.zeros(n)`(기본 float64)으로 만든다.'''

[[questions]]
id = "why-vectorization-fast"
type = "single"
objective = 2
prompt = '''NumPy로 벡터화한 계산이 같은 계산의 Python 반복문보다 수십~수백 배 빠른 **주된** 이유는?'''
explanation = '''Python 반복문은 원소마다 바이트코드 해석, 객체 생성, 타입 확인, 함수 호출을 반복한다. 벡터화하면 반복이 컴파일된 C 코드 안으로 들어가 한 번의 호출로 연속된 메모리의 같은 타입 원소를 처리하고, CPU의 SIMD 명령도 쓸 수 있다. NumPy의 기본 원소별 연산은 GPU를 쓰지 않고, 대부분 단일 스레드다(행렬 곱 같은 일부 연산만 BLAS 라이브러리를 통해 멀티스레드로 돈다).'''

[[questions.choices]]
text = "원소마다 드는 인터프리터 비용(바이트코드 해석·객체 생성·타입 확인)이 없어지고, 반복이 연속 메모리 위의 컴파일된 코드에서 돌기 때문이다."
correct = true

[[questions.choices]]
text = "NumPy가 계산을 자동으로 GPU에 보내기 때문이다."
feedback = "NumPy는 CPU에서만 계산한다. GPU 배열은 CuPy·PyTorch·JAX 같은 다른 라이브러리의 영역이다."

[[questions.choices]]
text = "NumPy의 모든 연산이 CPU 코어 전체를 써서 병렬로 돌기 때문이다."
feedback = "원소별 연산과 축소 연산은 대부분 단일 스레드다. 멀티스레드는 BLAS를 쓰는 행렬 곱 같은 일부 연산에 한정된다. 단일 스레드에서도 수십 배 차이가 난다."

[[questions.choices]]
text = "벡터화하면 계산량(연산 횟수)이 줄어들기 때문이다."
feedback = "같은 수식을 계산하면 연산 횟수는 같다. broadcasting은 오히려 중간 배열을 만드느라 메모리를 더 쓸 수 있다. 차이는 연산 하나당 드는 부대 비용에서 온다."

[[questions]]
id = "resample-daily-rows"
type = "numeric"
objective = 3
prompt = '''`DatetimeIndex`가 2024-07-01 00:00부터 1시간 간격으로 72개인 시계열에 `.resample("D").mean()`을 적용하면 몇 행이 나오는가?'''
answer = 3
tolerance = 0
slider = { min = 1, max = 72, step = 1 }
explanation = '''72시간은 7월 1일 00시부터 7월 3일 23시까지다. `resample("D")`는 시간 인덱스를 하루 단위 구간으로 나누고 각 구간을 하나의 값으로 줄이므로 3행이 된다. `groupby`가 열의 값으로 묶는다면, `resample`은 시간 인덱스를 일정한 간격의 구간으로 묶는다. 관측이 없는 날도 구간으로 만들어져 `NaN` 행이 생긴다는 점이 `groupby`와 다르다.'''
