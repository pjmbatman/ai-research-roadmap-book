# 5.4 자료구조·알고리즘·계산 비용 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "membership-list-vs-set"
type = "single"
objective = 1
prompt = '''원소 $n$개가 든 컨테이너에서 `x in container`의 평균 비용으로 옳은 것은?'''
explanation = '''list와 tuple은 앞에서부터 원소를 하나씩 `==`로 비교하므로 $O(n)$이다. set과 dict(키 검사)는 hash 값으로 저장 위치를 바로 계산하므로 평균 $O(1)$이다. hash 충돌이 심한 최악의 경우에는 set도 느려질 수 있지만, 일반적인 키(정수, 문자열, tuple)에서는 평균 $O(1)$로 생각해도 된다. 정렬된 list라면 `bisect`로 $O(\log n)$에 찾을 수 있지만 `in` 연산자는 정렬 여부를 이용하지 않는다.'''

[[questions.choices]]
text = "list는 $O(n)$, set은 평균 $O(1)$"
correct = true

[[questions.choices]]
text = "둘 다 $O(1)$ — 내장 자료구조는 C로 구현되어 있으므로"
feedback = "C로 구현되어 상수 배수가 작을 뿐, list의 `in`은 원소를 차례로 비교하는 선형 탐색이다. 구현 언어는 복잡도를 바꾸지 않는다."

[[questions.choices]]
text = "list는 $O(\\log n)$, set은 $O(1)$ — list는 내부적으로 정렬되어 있으므로"
feedback = "list는 넣은 순서를 지킬 뿐 정렬되어 있지 않다. 정렬된 list에서도 `in`은 선형 탐색이다. 이진 탐색을 쓰려면 `bisect`를 직접 호출해야 한다."

[[questions.choices]]
text = "list는 $O(n)$, set은 $O(\\log n)$ — set은 균형 이진 트리이므로"
feedback = "Python의 set과 dict는 트리가 아니라 hash table이다. 정렬 순서를 유지하지 않는 대신 평균 O(1)에 찾는다."

[[questions]]
id = "hidden-quadratic"
type = "single"
objective = 2
prompt = '''다음 코드에서 `ids`의 길이가 $n$일 때 전체 시간 복잡도는?

```python
unique = []
for sid in ids:
    if sid not in unique:
        unique.append(sid)
```'''
explanation = '''반복문 자체는 $n$번이지만, 매번 `sid not in unique`가 `unique` 길이에 비례하는 선형 탐색을 한다. 중복이 적으면 `unique`가 거의 $n$까지 자라므로 전체는 $1 + 2 + \cdots + n \approx n^2/2$, 즉 $O(n^2)$이다. 반복문이 한 겹으로 보여도 안에서 부르는 연산의 비용을 곱해야 한다. `seen`을 set으로 바꾸면 $O(n)$이 된다.'''

[[questions.choices]]
text = "$O(n)$ — 반복문이 한 겹이므로"
feedback = "반복문 안의 `not in`이 리스트 전체를 훑는 숨은 반복문이다."

[[questions.choices]]
text = "$O(n^2)$"
correct = true

[[questions.choices]]
text = "$O(n \\log n)$ — 정렬과 같은 비용이므로"
feedback = "이 코드는 정렬도 이진 탐색도 쓰지 않는다. 매 단계 선형 탐색이므로 제곱이다."

[[questions]]
id = "quadratic-scaling"
type = "numeric"
objective = 2
prompt = '''$O(n^2)$인 전처리 단계가 $n = 10^4$에서 2초 걸렸다. 같은 코드를 $n = 4 \times 10^4$에 실행하면 대략 몇 초가 걸릴 것으로 예측하는가?'''
answer = 32
tolerance = 0
slider = { min = 0, max = 64, step = 2, unit = "초" }
explanation = '''$O(n^2)$이면 시간은 $n^2$에 비례한다. $n$이 4배가 되면 시간은 $4^2 = 16$배, 즉 $2 \times 16 = 32$초다. 같은 논리로 $n = 10^6$이면 $100^2 = 10^4$배인 약 5.5시간이 된다. 작은 데이터에서 "충분히 빠른" 제곱 알고리즘이 실제 데이터에서 병목이 되는 이유다. 반대로 측정한 시간이 $n$이 두 배일 때 4배씩 늘면 제곱 알고리즘을 의심한다.'''

[[questions]]
id = "list-pop-front"
type = "single"
objective = 1
prompt = '''작업 대기열을 list로 만들고 `queue.pop(0)`으로 맨 앞의 작업을 꺼낸다. 대기열에 $n$개가 있을 때 `pop(0)` 한 번의 비용과 더 나은 자료구조는?'''
explanation = '''list는 원소를 연속된 배열에 저장하므로, 맨 앞을 꺼내면 나머지 $n-1$개를 한 칸씩 앞으로 옮겨야 한다. 그래서 `pop(0)`과 `insert(0, x)`는 $O(n)$이다. 맨 뒤의 `append`와 `pop()`만 (amortized) $O(1)$이다. 양쪽 끝에서 넣고 빼는 대기열에는 `collections.deque`를 쓴다. `popleft`와 `appendleft`가 $O(1)$이다.'''

[[questions.choices]]
text = "$O(n)$, `collections.deque`의 `popleft()`"
correct = true

[[questions.choices]]
text = "$O(1)$, 지금 그대로 충분하다"
feedback = "맨 뒤의 pop()은 O(1)이지만, 맨 앞을 빼면 나머지 원소를 모두 한 칸씩 옮긴다."

[[questions.choices]]
text = "$O(n)$, set으로 바꾼다"
feedback = "set은 순서를 지키지 않으므로 '맨 앞'이라는 개념이 없다. 대기열에는 순서가 필요하다."

[[questions.choices]]
text = "$O(\\log n)$, `heapq`로 바꾼다"
feedback = "heapq는 '가장 작은 원소'를 O(log n)에 꺼내는 우선순위 큐다. 들어온 순서대로 꺼내는 대기열이라면 deque가 맞다."

[[questions]]
id = "bisect-comparisons"
type = "numeric"
objective = 1
prompt = '''정렬된 원소 $10^6$개에서 이진 탐색(`bisect`)으로 값의 위치를 찾을 때, 원소와의 비교는 최대 대략 몇 번 필요한가? (가장 가까운 정수)'''
answer = 20
tolerance = 1
slider = { min = 0, max = 40, step = 1, unit = "번" }
explanation = '''이진 탐색은 비교 한 번마다 후보 구간을 절반으로 줄인다. $2^{20} = 1{,}048{,}576 \ge 10^6$이므로 약 $\log_2 10^6 \approx 19.9$, 즉 20번이면 충분하다. 선형 탐색이 최대 $10^6$번 비교하는 것과 비교하면 5만 배 차이다. 단, 이 이득은 데이터가 이미 정렬되어 있을 때만 얻는다. 정렬 자체는 $O(n \log n)$이므로, 한 번만 찾을 거라면 정렬하는 쪽이 손해다.'''

[[questions]]
id = "profile-reading"
type = "single"
objective = 3
prompt = '''데이터 로더를 cProfile로 측정했더니 `json.loads`의 `ncalls`가 샘플 수와 같은 3000이고 전체 시간의 60%를 차지했다. 라벨 파일은 하나뿐이다. 가장 타당한 다음 행동은?'''
explanation = '''`ncalls`가 샘플 수와 같다는 것은 샘플마다 같은 라벨 파일을 다시 파싱한다는 뜻이다. 파일이 하나뿐이므로 한 번만 읽어 dict로 보관하면 그 60%가 거의 사라진다. profiling은 "어떤 함수가 느린가"보다 "**왜 그렇게 많이 불리는가**"를 먼저 묻게 한다. 더 빠른 JSON 파서로 바꾸는 것은 호출 횟수를 그대로 둔 채 상수 배수만 줄이는 일이다.'''

[[questions.choices]]
text = "라벨 파일을 한 번만 읽어 보관하도록 고쳐 호출 횟수를 1로 줄인다."
correct = true

[[questions.choices]]
text = "`json`보다 빠른 JSON 파서 라이브러리로 교체한다."
feedback = "파싱이 몇 배 빨라져도 같은 파일을 3000번 읽는 구조는 그대로다. 호출 횟수를 줄이는 쪽이 훨씬 크게 이득이다."

[[questions.choices]]
text = "DataLoader의 worker 수를 늘려 병렬로 읽는다."
feedback = "같은 낭비를 여러 코어에 나눠 할 뿐이다. 낭비를 없애는 것이 먼저다."

[[questions.choices]]
text = "cProfile 자체의 부하 때문일 수 있으므로 결과를 무시한다."
feedback = "profiler는 함수 호출마다 부하를 더해 절대 시간을 부풀릴 수 있지만, 호출 횟수(ncalls)는 정확하다. 호출 횟수가 샘플 수와 같다는 사실은 profiler 부하로 설명되지 않는다."
