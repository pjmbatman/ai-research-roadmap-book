# 17.7 Trainer 설계: 직접 작성과 프레임워크 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "trainer-boundary"
type = "single"
objective = 1
prompt = '''회귀·분류·물리 손실 항이 있는 학습을 **같은 trainer.py**로 돌리려 한다. trainer 안에 두지 말고 step 함수(과제 코드)로 빼야 하는 것은?'''
explanation = '''trainer는 모든 실험에서 같아야 하는 것(step 순서, 검증 주기, callback 호출, 상태 저장)을 맡고, 실험마다 다른 것은 밖에서 받는다. forward와 loss의 정의는 과제마다 다르므로 step 함수의 몫이다. 반대로 `zero_grad → backward → step`의 순서는 과제와 무관하고 틀리기 쉬워서 trainer에 한 번만 두는 편이 낫다.'''

[[questions.choices]]
text = "과제별 forward와 loss 계산"
correct = true

[[questions.choices]]
text = "`zero_grad → backward → step`의 순서"
feedback = "이 순서는 과제와 무관하게 같고, 실험마다 복사하면 틀릴 기회만 늘어난다. trainer가 한 번 구현한다."

[[questions.choices]]
text = "정해진 주기로 검증 함수를 호출하는 일"
feedback = "검증 주기는 모든 실험에서 같은 규칙으로 처리되어야 비교가 공정하다. trainer의 책임이다."

[[questions.choices]]
text = "학습 상태(모델·optimizer·callback)의 저장과 복원"
feedback = "저장할 항목은 과제와 무관하다. trainer가 맡아야 모든 실험이 같은 방식으로 재개된다."

[[questions]]
id = "callback-vs-loop-structure"
type = "multiple"
objective = 1
prompt = '''다음 중 trainer를 고치지 않고 **callback으로** 붙이기에 알맞은 기능을 모두 고르시오.'''
explanation = '''callback은 루프의 흐름을 그대로 두고 정해진 시점에 관찰·저장·멈춤 신호를 보내는 기능에 맞는다. 학습률 기록, 예측 샘플 저장, 조기 종료가 그렇다. 한 step에 optimizer 두 개를 번갈아 쓰는 GAN이나 안쪽 루프가 따로 있는 이중수준 최적화는 루프의 **구조**가 달라서, callback으로 흉내 내면 trainer의 순서와 충돌한다. 별도의 trainer나 루프를 쓴다.'''

[[questions.choices]]
text = "매 검증 뒤 현재 학습률과 metric을 기록하기"
correct = true

[[questions.choices]]
text = "10 epoch마다 검증 데이터의 예측 그림 몇 장을 저장하기"
correct = true

[[questions.choices]]
text = "검증 metric이 정체되면 학습을 멈추라고 알리기"
correct = true

[[questions.choices]]
text = "한 step 안에서 생성자와 판별자의 optimizer를 번갈아 업데이트하기(GAN)"
feedback = "업데이트 순서 자체가 trainer의 루프와 다르다. 이런 학습은 별도 루프로 쓴다."

[[questions.choices]]
text = "바깥 step마다 안쪽 최적화 루프를 끝까지 돌리기(이중수준 최적화)"
feedback = "루프 안에 또 다른 루프가 있는 구조다. callback으로 흉내 내지 말고 전용 루프를 쓴다."

[[questions]]
id = "early-stopping-epoch"
type = "numeric"
objective = 1
prompt = '''`patience = 2`, `min_delta = 0`인 early stopping에 epoch 1–6의 검증 손실이 1.0, 0.8, 0.85, 0.79, 0.80, 0.81 순서로 들어온다. 개선이 없는 검증이 2번 연속되면 멈춘다. 몇 번째 epoch의 검증 뒤에 멈추는가?'''
answer = 6
tolerance = 0
slider = { min = 1, max = 6, step = 1 }
explanation = '''epoch 2에서 best가 0.8이 되고, epoch 3(0.85)은 개선이 아니어서 기다림 1, epoch 4(0.79)는 개선이어서 기다림이 0으로 돌아간다. epoch 5(0.80)와 6(0.81)이 연속으로 개선이 아니므로 epoch 6 뒤에 멈춘다. 이때 복원할 best는 epoch 4다. epoch 3에서 쌓인 기다림을 epoch 4의 개선 뒤에도 이어서 세면 epoch 5에서 멈춘다고 잘못 계산하게 된다.'''

[[questions]]
id = "eval-script-separation"
type = "multiple"
objective = 1
prompt = '''`eval.py`를 학습 코드(trainer·optimizer)와 분리해, checkpoint만으로 평가할 수 있게 만드는 이유로 옳은 것을 모두 고르시오.'''
explanation = '''평가를 분리하면 metric 버그를 고친 뒤 재학습 없이 모든 checkpoint를 다시 평가할 수 있고, baseline과 제안 방법을 같은 코드로 평가할 수 있고, 학습 코드가 바뀐 뒤에도 옛 checkpoint를 평가할 수 있다. 분리는 학습 속도와는 관계가 없다.'''

[[questions.choices]]
text = "metric 계산의 버그를 고친 뒤, 다시 학습하지 않고 저장된 checkpoint를 모두 다시 평가할 수 있다."
correct = true

[[questions.choices]]
text = "baseline과 제안 방법의 checkpoint를 같은 평가 코드로 평가해 비교를 공정하게 만든다."
correct = true

[[questions.choices]]
text = "학습 코드가 나중에 바뀌어도 예전 checkpoint를 평가할 수 있다."
correct = true

[[questions.choices]]
text = "학습 중 검증에 걸리는 시간이 줄어 학습이 빨라진다."
feedback = "분리는 코드의 의존성 문제다. 학습 중 검증 시간과는 관계가 없다."

[[questions]]
id = "adamw-default-weight-decay"
type = "single"
objective = 2
prompt = '''PyTorch에서 `torch.optim.Adam(params, lr=1e-2)`를 `torch.optim.AdamW(params, lr=1e-2)`로 바꾸고 다른 인자는 주지 않았다. 실험 기록에 "optimizer만 Adam → AdamW로 변경"이라고 쓰면 무엇이 빠지는가? (집필 시점 PyTorch 2.15 기준)'''
explanation = '''`Adam`의 `weight_decay` 기본값은 0이고, `AdamW`의 기본값은 0.01이다. 인자를 그대로 두고 클래스만 바꾸면 decoupled weight decay 0.01이 새로 적용된다. 기록에는 optimizer 변경과 weight decay 추가가 함께 들어가야 한다. 이런 차이는 해석이 끝난 설정 전체를 기록하면 드러난다.'''

[[questions.choices]]
text = "weight decay 0.01이 새로 적용되었다는 사실"
correct = true

[[questions.choices]]
text = "빠진 것이 없다. 인자를 주지 않았으므로 두 optimizer는 같은 설정이다."
feedback = "인자를 주지 않았다는 것은 기본값을 썼다는 뜻이다. 두 클래스의 weight_decay 기본값이 다르다."

[[questions.choices]]
text = "학습률이 AdamW의 기본값 1e-3으로 바뀌었다는 사실"
feedback = "lr=1e-2를 명시했으므로 학습률은 바뀌지 않았다. 바뀐 것은 지정하지 않은 인자다."

[[questions.choices]]
text = "AdamW는 momentum을 쓰지 않는다는 사실"
feedback = "AdamW도 Adam과 같은 1·2차 moment를 쓴다. 차이는 weight decay를 적용하는 방식과 그 기본값이다."

[[questions]]
id = "framework-adoption"
type = "single"
objective = 2
prompt = '''다음 상황 중 학습 프레임워크(예: Lightning)보다 **직접 쓴 짧은 trainer**가 더 적합한 경우는?'''
explanation = '''프레임워크는 표준화된 반복 코드(분산 학습, mixed precision, 로깅)를 줄여 주지만, 루프 구조를 바꾸려면 그 추상화를 우회해야 한다. 업데이트 순서 자체가 연구 대상이면 직접 쓴 루프가 더 짧고 명확하다. 여러 노드의 분산 학습이나 팀 공용 코드는 프레임워크의 이점이 큰 경우다.'''

[[questions.choices]]
text = "새로운 업데이트 순서(한 step에 두 데이터 소스와 두 optimizer를 번갈아 씀)가 연구 대상인 경우"
correct = true

[[questions.choices]]
text = "표준 모델을 여러 노드의 GPU 수십 개로 mixed precision 학습해야 하는 경우"
feedback = "분산·정밀도 관리는 틀리기 쉬운 표준 반복 코드다. 검증된 프레임워크를 쓰는 이점이 크다."

[[questions.choices]]
text = "팀 전체가 같은 프레임워크로 코드를 공유하고 서로 리뷰하는 경우"
feedback = "공통 구조를 공유하는 것 자체가 이점이다. 이때는 프레임워크를 쓰되 기본값을 기록하는 규칙을 둔다."

[[questions.choices]]
text = "모델 구조만 연구 대상이고 학습 루프는 표준적인 경우"
feedback = "루프가 표준적이면 프레임워크의 추상화와 충돌하지 않는다. 어느 쪽이든 가능하지만 직접 쓰는 이점이 특별히 크지 않다."
