# 17.8 학습 모니터링과 대시보드 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "what-to-log-before-divergence"
type = "multiple"
objective = 1
prompt = '''학습이 가끔 수천 step 뒤에 NaN으로 끝난다. 다음 실행에서 **원인을 좁히는 데** 도움이 되는 기록을 모두 고르시오.'''
explanation = '''발산은 보통 손실보다 gradient norm과 업데이트 크기에서 먼저 보인다. 업데이트 비율 $\lVert\Delta\theta\rVert / \lVert\theta\rVert$가 갑자기 커지면 학습률이나 gradient가 문제이고, 실제 학습률을 기록하면 warm-up·scheduler 설정 오류를 확인할 수 있다. epoch마다 한 번 기록하는 검증 손실은 발산 직전의 수천 step을 보여 주지 못한다.'''

[[questions.choices]]
text = "step마다의 global gradient norm"
correct = true

[[questions.choices]]
text = "업데이트 크기와 파라미터 크기의 비율"
correct = true

[[questions.choices]]
text = "optimizer가 실제로 쓴 학습률"
correct = true

[[questions.choices]]
text = "epoch 끝의 검증 손실 하나"
feedback = "epoch 단위 기록은 발산 직전의 step 단위 변화를 보여 주지 못한다. 손실이 NaN이 된 뒤에야 알게 된다."

[[questions]]
id = "tensorboard-remote-access"
type = "single"
objective = 2
prompt = '''공유 GPU 서버에서 학습하며 TensorBoard를 띄워, 내 노트북의 브라우저로 보려 한다. 가장 적절한 방법은?'''
explanation = '''서버에서 TensorBoard를 기본값(localhost에서만 대기)으로 띄우고, 노트북에서 SSH 포트 포워딩(`ssh -L 6006:localhost:6006 서버`)으로 연결한다. 연결이 SSH로 암호화되고, 같은 서버의 다른 사용자나 외부에 대시보드가 노출되지 않는다. `--bind_all`은 모든 네트워크 인터페이스에 대시보드를 열어, 인증 없이 누구나 볼 수 있게 만든다.'''

[[questions.choices]]
text = "서버에서 기본값으로 TensorBoard를 띄우고, 노트북에서 SSH 포트 포워딩으로 접속한다."
correct = true

[[questions.choices]]
text = "서버에서 `--bind_all`로 띄우고 서버의 공인 IP와 포트로 접속한다."
feedback = "대시보드가 인증 없이 모든 인터페이스에 열린다. 실험 데이터와 파일 경로가 외부에 노출될 수 있다."

[[questions.choices]]
text = "학습이 끝날 때마다 이벤트 파일을 노트북으로 복사해 로컬에서 연다."
feedback = "동작은 하지만 실시간 관찰이 안 된다. 학습 중의 이상을 늦게 발견한다."

[[questions.choices]]
text = "서버의 6006번 포트를 방화벽에서 열어 둔다."
feedback = "TensorBoard에는 기본 인증이 없다. 포트를 여는 것은 --bind_all과 같은 노출 문제를 만든다."

[[questions]]
id = "overfitting-pattern"
type = "single"
objective = 3
prompt = '''train 손실은 끝까지 내려가는데, 검증 손실은 epoch 26에서 가장 낮고 그 뒤 천천히 오른다. 두 곡선의 차이도 계속 벌어진다. 가장 알맞은 해석과 다음 실험은?'''
explanation = '''train은 계속 좋아지고 검증이 나빠지며 차이가 벌어지는 것은 과적합의 전형적인 모양이다. 다음 실험은 regularization(weight decay, dropout, 데이터 증강)을 늘리거나, 모델을 줄이거나, 데이터를 늘리는 방향이고, 그동안은 best checkpoint(epoch 26 근처)를 쓴다. 학습률을 키우거나 학습을 늘리는 것은 과소적합일 때의 처방이다.'''

[[questions.choices]]
text = "과적합이다. regularization을 늘리거나 모델·데이터 규모를 조정하고, best checkpoint를 쓴다."
correct = true

[[questions.choices]]
text = "과소적합이다. 모델을 키우고 더 오래 학습한다."
feedback = "과소적합이면 train 손실도 높은 곳에서 멈춘다. 여기서는 train이 계속 내려가고 있다."

[[questions.choices]]
text = "학습률이 너무 크다. 학습률을 줄인다."
feedback = "학습률이 크면 곡선이 크게 흔들리거나 발산한다. 매끄럽게 벌어지는 차이는 그 징후가 아니다."

[[questions.choices]]
text = "검증 데이터에 잡음이 있을 뿐이다. 학습을 그대로 더 늘린다."
feedback = "잡음은 위아래로 흔들리지만, 여러 epoch에 걸친 일관된 상승과 벌어지는 차이는 잡음으로 설명되지 않는다."

[[questions]]
id = "ema-without-debias"
type = "numeric"
objective = 3
prompt = '''smoothing 가중치 $w = 0.9$, 초기 상태 $s_0 = 0$인 **보정 없는** 지수이동평균 $s_k = w\,s_{k-1} + (1-w)\,x_k$에 손실 10, 10이 차례로 들어온다. 두 번째 smoothed 값 $s_2$는?'''
answer = 1.9
tolerance = 0.001
explanation = '''$s_1 = 0.9 \cdot 0 + 0.1 \cdot 10 = 1$, $s_2 = 0.9 \cdot 1 + 0.1 \cdot 10 = 1.9$다. 실제 손실은 10인데 곡선은 1.9를 보여 준다. 0에서 출발한 치우침 때문이며, $1 - w^k = 0.19$로 나누는 보정을 하면 정확히 10이 된다. 보정이 없는 smoothing은 학습 초반의 손실을 실제보다 훨씬 낮게 보여 준다.'''

[[questions]]
id = "dashboard-train-loss"
type = "single"
objective = 3
prompt = '''대시보드에서 epoch마다 찍힌 train 손실(그 epoch 동안 batch 손실의 평균)이 같은 epoch 끝에 계산한 검증 손실보다 **높다.** 가장 먼저 확인할 설명은?'''
explanation = '''epoch 평균 train 손실은 epoch 동안 계속 바뀐 모델들의 손실을 평균한 것이고, dropout 같은 학습 모드의 무작위성도 들어 있다. 검증 손실은 epoch 끝의 모델 하나를 평가 모드로 계산한 값이다. 둘은 같은 모델의 같은 조건이 아니므로, 비교하려면 epoch 끝 모델로 train 데이터(또는 그 일부)를 평가 모드로 다시 계산한다. 본문의 예에서 대시보드 값은 1.053, 다시 계산한 값은 0.242였다.'''

[[questions.choices]]
text = "train 손실은 epoch 동안 바뀐 모델들의 평균이고 학습 모드로 계산되어, epoch 끝의 검증 손실과 같은 조건이 아니다."
correct = true

[[questions.choices]]
text = "검증 데이터가 train 데이터에 섞여 들어간 누수다."
feedback = "누수도 가능하지만, 이 현상은 누수 없이도 집계 방식만으로 흔히 생긴다. 먼저 같은 조건에서 다시 계산해 본다."

[[questions.choices]]
text = "모델이 과소적합이므로 더 크게 만들어야 한다."
feedback = "train이 검증보다 높다는 사실만으로는 과소적합을 판단할 수 없다. 두 숫자가 같은 조건에서 계산되었는지가 먼저다."

[[questions.choices]]
text = "검증 손실 계산에 버그가 있다는 확실한 증거다."
feedback = "버그가 없어도 생기는 현상이다. 독립 평가 스크립트와 대조해 확인할 수는 있지만 증거는 아니다."
