# 17.9 학습 실패 진단 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "initial-loss-value"
type = "numeric"
objective = 2
prompt = '''class 10개가 고르게 섞인 분류 문제에서, 출력층을 작은 값으로 초기화해 처음 logit이 거의 모두 0이다. cross-entropy 손실의 첫 값은 대략 얼마여야 하는가? (자연로그)'''
answer = 2.303
tolerance = 0.01
explanation = '''logit이 모두 같으면 softmax 확률은 모든 class에 1/10이고, 정답 class의 음의 로그확률은 $-\ln(1/10) = \ln 10 \approx 2.303$이다. 첫 손실이 이보다 크게 다르면(예: 수십) 입력 스케일이나 초기화가 logit을 크게 만들고 있거나, 손실 계산이 잘못된 것이다. 이 값은 class 비율과 무관하다. 모든 class에 같은 확률을 주면 어느 표본이든 손실이 $\ln 10$이기 때문이다.'''

[[questions]]
id = "overfit-one-batch-limits"
type = "multiple"
objective = 2
prompt = '''표본 16개짜리 batch 하나로 수백 step 학습해 손실이 거의 0이 되는지 보는 검사가 **잡을 수 있는** 버그를 모두 고르시오.'''
explanation = '''batch 하나 과적합은 "이 모델·손실·업데이트가 주어진 label을 외울 수 있는가"를 본다. 모델 끝에 softmax를 한 번 더 붙이면 출력 확률의 범위가 좁아져 손실이 0 근처로 내려가지 못하고, gradient가 누적되거나 학습률이 0이면 수렴하지 못한다. 반면 label이 입력과 어긋나도 신경망은 16개쯤은 외우므로 이 검사를 통과한다. 평가 모드 누락도 학습 경로와 무관해 드러나지 않는다. 그래서 데이터 확인과 평가 결정성 검사를 따로 둔다.'''

[[questions.choices]]
text = "모델 끝의 softmax와 CrossEntropyLoss의 중복(softmax 두 번)"
correct = true

[[questions.choices]]
text = "optimizer에 파라미터가 등록되지 않아 아무것도 업데이트되지 않음"
correct = true

[[questions.choices]]
text = "입력을 섞을 때 label을 함께 섞지 않아 입력과 label이 어긋남"
feedback = "신경망은 어긋난 label도 16개쯤은 외운다. 본문의 예에서 무작위 label도 손실 0.0004까지 내려갔다."

[[questions.choices]]
text = "평가 함수에서 model.eval()을 빠뜨림"
feedback = "이 검사는 학습 경로만 본다. 평가를 두 번 해서 같은 값이 나오는지 따로 확인한다."

[[questions]]
id = "nan-first-response"
type = "single"
objective = 1
prompt = '''수천 step 잘 학습하던 모델의 손실이 갑자기 NaN이 되었다. 가장 먼저 할 일로 알맞은 것은?'''
explanation = '''체계적 진단은 관찰을 고정하는 데서 시작한다. 기록(gradient norm, 학습률, 업데이트 비율)에서 처음 비유한 값이나 spike가 나온 step을 찾고, 그 step의 batch와 checkpoint로 실패를 재현한다. 재현되면 forward hook이나 anomaly mode로 처음 NaN을 만든 연산을 좁힌다. 여러 설정을 한꺼번에 바꾸면 증상이 사라져도 원인을 알 수 없다.'''

[[questions.choices]]
text = "기록에서 처음 이상이 나타난 step을 찾고, 그 batch와 직전 checkpoint로 실패를 재현한다."
correct = true

[[questions.choices]]
text = "학습률을 낮추고, batch 크기를 키우고, gradient clipping을 켜서 다시 학습한다."
feedback = "세 가지를 동시에 바꾸면 해결되어도 무엇이 원인이었는지 모른다. 또 데이터의 NaN처럼 학습률과 무관한 원인을 덮어 버릴 수 있다."

[[questions.choices]]
text = "float64로 바꾸어 처음부터 다시 학습한다."
feedback = "정밀도가 원인일 수도 있지만, 확인하지 않은 가설이다. 먼저 어느 step, 어느 연산에서 시작되었는지 찾는다."

[[questions.choices]]
text = "NaN이 나온 step의 손실을 0으로 바꾸고 계속 학습하는 코드를 넣는다."
feedback = "증상을 숨길 뿐이다. 원인이 데이터의 이상값이라면 그 표본이 계속 학습을 오염시킨다."

[[questions]]
id = "suspiciously-good"
type = "single"
objective = 1
prompt = '''이전 연구들이 70% 정도에 머문 예측 문제에서, 새 모델이 검증 정확도 99%를 냈다. 가장 먼저 의심할 것은?'''
explanation = '''기대보다 훨씬 좋은 결과는 버그를 의심할 신호다. 같은 표본(또는 같은 시료·환자·분자에서 나온 표본)이 train과 검증에 함께 들어갔거나, 정답을 거의 그대로 담은 특징(정답에서 계산된 값, 측정 순서 등)이 입력에 섞인 누수가 가장 흔한 원인이다(15.4장). 중복 행 검사와 특징별 단독 예측력 검사로 먼저 확인한다.'''

[[questions.choices]]
text = "train과 검증 사이의 중복·누수, 또는 정답을 담은 특징"
correct = true

[[questions.choices]]
text = "모델 구조가 이전 연구보다 뛰어나다는 것"
feedback = "그럴 수도 있지만, 그 결론은 누수와 평가 버그를 배제한 뒤에야 내릴 수 있다."

[[questions.choices]]
text = "학습률이 너무 작다는 것"
feedback = "학습률 문제는 성능을 낮추는 쪽으로 나타난다. 기대보다 높은 성능의 설명이 아니다."

[[questions.choices]]
text = "검증 데이터가 너무 크다는 것"
feedback = "검증 데이터가 크면 추정이 더 정확해질 뿐이다. 성능을 부풀리지 않는다."

[[questions]]
id = "one-change-at-a-time"
type = "single"
objective = 1
prompt = '''학습이 안 되어 정규화 추가, 초기화 변경, 학습률 1/10 세 가지를 한꺼번에 바꿨더니 학습이 된다. 디버깅 기록과 다음 행동으로 가장 알맞은 것은?'''
explanation = '''세 변경 중 무엇이 필요했는지 모르면, 다음 실험에서 같은 문제가 다른 형태로 나타났을 때 대응할 수 없고, 논문에 쓴 설정 중 어떤 것이 결과에 중요한지도 말할 수 없다. 하나씩 되돌리거나(또는 하나씩 적용해) 각 변경의 효과를 확인하고, 가설·실험·결과를 기록한다. 작은 설정에서 빠르게 돌리면 비용이 크지 않다.'''

[[questions.choices]]
text = "변경을 하나씩 되돌려 각 변경이 필요한지 확인하고, 가설·실험·결과를 기록한다."
correct = true

[[questions.choices]]
text = "학습이 되었으니 세 변경을 모두 유지하고 다음 실험으로 넘어간다."
feedback = "원인을 모른 채 넘어가면, 불필요한 변경이 이후 실험의 기본값이 되고 같은 실패가 다시 와도 대응할 수 없다."

[[questions.choices]]
text = "세 변경 중 가장 그럴듯한 하나를 원인으로 기록한다."
feedback = "확인하지 않은 원인을 기록하면 기록이 오히려 틀린 지식을 남긴다."

[[questions.choices]]
text = "시드를 바꿔 한 번 더 돌려 보고, 또 되면 세 변경을 모두 유지한다."
feedback = "재현성은 확인되지만, 세 변경 중 무엇이 필요한지는 여전히 모른다."
