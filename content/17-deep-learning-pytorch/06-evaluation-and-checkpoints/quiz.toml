# 17.6 평가·추론·체크포인트 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "eval-does-not-disable-grad"
type = "single"
objective = 1
prompt = '''평가 루프에서 `model.eval()`만 호출하고 `torch.no_grad()`나 `torch.inference_mode()`는 쓰지 않았다. 옳은 설명은?'''
explanation = '''`eval()`은 모듈의 `training` 플래그만 바꾼다. dropout이 꺼지고 BatchNorm이 running 통계를 쓰므로 **출력값은 올바르다.** 그러나 gradient 기록은 그대로 켜져 있어, 출력의 `requires_grad`가 `True`이고 역전파용 중간값이 메모리에 쌓인다. 숫자는 맞지만 메모리와 시간을 낭비하고, 큰 모델에서는 메모리 부족으로 이어질 수 있다.'''

[[questions.choices]]
text = "평가 숫자는 맞지만, autograd가 그래프를 기록해 메모리와 시간을 낭비한다."
correct = true

[[questions.choices]]
text = "`eval()`이 gradient 기록도 끄므로 아무 문제가 없다."
feedback = "eval()은 모듈 모드 스위치일 뿐이다. 출력의 requires_grad를 찍어 보면 True다."

[[questions.choices]]
text = "dropout이 켜져 있으므로 평가 숫자가 실행마다 달라진다."
feedback = "dropout을 끄는 것은 eval()이다. gradient 모드는 층의 동작을 바꾸지 않는다."

[[questions.choices]]
text = "BatchNorm의 running 통계가 평가 데이터로 갱신된다."
feedback = "running 통계는 학습 모드에서 갱신된다. eval() 상태에서는 저장된 통계를 읽기만 한다."

[[questions]]
id = "no-grad-train-mode-batchnorm"
type = "single"
objective = 1
prompt = '''`model.train()` 상태에서 `with torch.no_grad():` 안에 검증 데이터를 통과시켰다. BatchNorm 층에서 일어나는 일은?'''
explanation = '''BatchNorm은 학습 모드에서 현재 batch의 평균·분산으로 정규화하고, running 통계를 $\hat{\mu} \leftarrow (1-m)\hat{\mu} + m\mu_B$로 갱신한다. 이 갱신은 gradient가 아니라 buffer에 값을 대입하는 연산이므로 `no_grad`와 무관하게 일어난다. 결과적으로 평가 점수는 batch 구성에 따라 달라지고, 모델의 running 통계는 검증 데이터로 오염된다.'''

[[questions.choices]]
text = "현재 batch의 통계로 정규화하고, running 통계도 검증 데이터로 갱신된다."
correct = true

[[questions.choices]]
text = "`no_grad`이므로 running 통계는 갱신되지 않고, 현재 batch 통계로만 정규화한다."
feedback = "running 통계는 gradient로 학습되는 parameter가 아니라 forward에서 직접 대입되는 buffer다. no_grad는 이 대입을 막지 않는다."

[[questions.choices]]
text = "`no_grad`가 평가 모드를 함께 켜므로 running 통계로 정규화한다."
feedback = "gradient 모드와 모듈 모드는 독립된 스위치다. no_grad는 training 플래그를 바꾸지 않는다."

[[questions.choices]]
text = "학습 모드와 no_grad를 함께 쓰면 오류가 난다."
feedback = "두 스위치는 자유롭게 조합할 수 있고, 이 조합도 오류 없이 실행된다. 그래서 더 위험하다."

[[questions]]
id = "mean-of-batch-means"
type = "numeric"
objective = 2
prompt = '''평가 데이터 10개를 batch 크기 4로 나누었더니 batch가 4개, 4개, 2개였고, 각 batch의 MAE는 1.0, 1.0, 4.0이었다. 평가 데이터 전체의 MAE는?'''
answer = 1.6
tolerance = 0.001
explanation = '''batch MAE에 batch 크기를 곱해 오차의 합으로 되돌리면 4 + 4 + 8 = 16이고, 전체 표본 수 10으로 나누면 1.6이다. batch 평균을 단순히 평균한 (1 + 1 + 4)/3 = 2.0은 표본 2개짜리 마지막 batch를 4개짜리처럼 센 값이다.'''

[[questions]]
id = "masked-average-definitions"
type = "multiple"
objective = 2
prompt = '''길이가 다른 시계열을 padding해 batch로 묶고 mask로 관측 위치를 표시했다. 오차 평균의 계산으로 **옳은** 것을 모두 고르시오.'''
explanation = '''padding 위치는 어떤 정의에서도 세지 않는다. 그 위에서 관측값 하나하나를 같은 무게로 보는 평균(분모 = mask의 합)과, 시계열마다 평균을 낸 뒤 시계열을 같은 무게로 보는 평균은 서로 다른 질문에 대한 답이며 둘 다 쓸 수 있다. 어느 쪽을 썼는지 보고하면 된다. batch마다 관측 단위 평균을 내고 그것을 다시 단순 평균하면, batch마다 관측 수가 다를 때 어느 정의와도 맞지 않는다.'''

[[questions.choices]]
text = "모든 batch에 걸쳐 (mask × 오차)의 합을 mask의 합으로 나눈다."
correct = true

[[questions.choices]]
text = "시계열마다 관측값의 평균을 내고, 그 평균들을 시계열 수로 평균한다."
correct = true

[[questions.choices]]
text = "padding 위치의 오차를 0으로 두고 batch 전체 원소 수로 나눈다."
feedback = "padding을 오차 0인 관측처럼 세므로 평균이 작아진다. 분모는 관측 수여야 한다."

[[questions.choices]]
text = "batch마다 관측 단위 평균을 내고, 그 값들을 batch 수로 평균한다."
feedback = "batch마다 관측 수가 다르면 관측이 적은 batch가 과대 대표된다. 합과 개수를 끝까지 따로 누적한다."

[[questions]]
id = "resume-checkpoint-contents"
type = "multiple"
objective = 3
prompt = '''AdamW·cosine scheduler·dropout을 쓰는 학습을 중단했다가 **끊김 없는 학습과 같은 결과로** 재개하려 한다. checkpoint에 반드시 있어야 하는 것을 모두 고르시오. (매 step은 `zero_grad → forward → backward → step` 순서다.)'''
explanation = '''다음 step의 결과에 영향을 주는 상태가 모두 필요하다. 모델의 parameter·buffer, optimizer의 moment와 step 수, scheduler의 현재 위치, dropout과 데이터 표집에 쓰이는 RNG 상태다. 마지막 step의 `.grad`는 다음 step 시작의 `zero_grad`가 지우고 backward가 새로 계산하므로 필요 없다. forward의 중간 활성값도 다음 step에서 새로 계산된다.'''

[[questions.choices]]
text = "모델의 parameter와 buffer (`model.state_dict()`)"
correct = true

[[questions.choices]]
text = "optimizer 상태 (AdamW의 moment와 step 수)"
correct = true

[[questions.choices]]
text = "scheduler 상태"
correct = true

[[questions.choices]]
text = "RNG 상태 (dropout과 데이터 표집용)"
correct = true

[[questions.choices]]
text = "마지막 step에서 계산된 parameter의 `.grad`"
feedback = "다음 step의 zero_grad가 지우고 backward가 새로 채운다. 재개 결과에 영향을 주지 않는다."

[[questions.choices]]
text = "마지막 forward의 중간 활성값"
feedback = "활성값은 역전파를 위해 한 step 동안만 필요하다. 다음 step의 forward가 새로 만든다."

[[questions]]
id = "best-checkpoint-selection"
type = "single"
objective = 3
prompt = '''여러 epoch의 checkpoint 중 하나를 골라 논문에 성능을 보고하려 한다. 가장 적절한 절차는?'''
explanation = '''고르는 데 쓴 데이터의 점수는 여러 후보 중 잡음이 유리하게 나온 것을 고른 결과라 낙관적으로 치우친다. 그래서 검증 데이터로 고르고, 고르는 데 쓰지 않은 test 데이터에서 한 번 평가한 숫자를 보고한다. last가 best보다 항상 낫다는 보장은 없다. 과적합이 시작되면 last가 더 나쁠 수 있다.'''

[[questions.choices]]
text = "검증 metric이 가장 좋은 checkpoint를 고르고, 고르는 데 쓰지 않은 test 데이터의 점수를 보고한다."
correct = true

[[questions.choices]]
text = "test 점수가 가장 좋은 checkpoint를 고르고 그 test 점수를 보고한다."
feedback = "test로 고르면 test 점수가 선택 과정의 일부가 되어 낙관적으로 치우친다. 독립된 평가가 남지 않는다."

[[questions.choices]]
text = "검증 metric이 가장 좋은 checkpoint를 고르고, 그 검증 점수를 최종 성능으로 보고한다."
feedback = "고르는 데 쓴 검증 점수는 잡음이 유리하게 나온 값일 수 있다. 본문의 모의 실험에서 best의 검증 손실 0.607은 기저 곡선 0.623보다 낮았다."

[[questions.choices]]
text = "가장 오래 학습했으므로 항상 last checkpoint를 보고한다."
feedback = "과적합이 시작된 뒤에는 last가 best보다 나쁠 수 있다. 어느 것을 보고할지는 학습 전에 정한 규칙을 따른다."
