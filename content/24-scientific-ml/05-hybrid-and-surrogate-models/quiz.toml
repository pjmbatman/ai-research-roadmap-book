# 24.5 하이브리드 모델과 대리모델 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "residual-hybrid-extrapolation"
type = "single"
objective = 1
prompt = '''물리 모델 $f(T; \theta_0)$의 파라미터 $\theta_0$가 틀렸다. 300–340 K 데이터로 잔차 $y - f(T; \theta_0)$를 RBF 커널 GP로 학습해 $\hat{y} = f(T; \theta_0) + \hat{r}(T)$를 만들었다. 학습 범위에서 멀리 떨어진 400 K에서 이 하이브리드 모델의 예측은 대략 무엇과 같은가?'''
explanation = '''RBF 커널 GP의 사후 평균은 데이터에서 길이척도보다 멀어지면 사전 평균(여기서는 학습 잔차의 평균)으로 돌아간다. 그래서 400 K의 예측은 $f(400; \theta_0)$에 300–340 K 잔차의 평균을 더한 값이다. 잔차가 온도에 따라 커지는 경향은 학습되지 않으므로, 틀린 파라미터가 만든 외삽 오차가 대부분 남는다. 본문 cell 2에서 잔차 학습 하이브리드의 외삽 오차(0.371)가 물리 전용 모델(0.497)과 크게 다르지 않았던 이유다.'''

[[questions.choices]]
text = '''틀린 물리 모델의 예측에 학습 범위 잔차의 평균을 더한 값'''
correct = true

[[questions.choices]]
text = '''참값. 잔차를 학습했으므로 물리 모델의 오차가 모든 온도에서 보정된다.'''
feedback = "잔차는 학습 범위에서만 관측되었다. GP는 범위 밖의 잔차가 어떻게 변하는지 모르고, 사전 평균 쪽으로 돌아간다."

[[questions.choices]]
text = '''학습 데이터의 $y$ 평균. GP가 사전 평균으로 돌아가기 때문이다.'''
feedback = "그것은 데이터 전용 GP의 외삽이다. 하이브리드 모델에서 GP는 잔차만 맡으므로, 물리 모델 f(400)이 예측의 대부분을 정한다."

[[questions.choices]]
text = '''학습 범위 경계(340 K)의 잔차를 직선으로 연장한 값'''
feedback = "RBF 커널 GP는 추세를 직선으로 연장하지 않는다. 직선 연장은 선형 평균함수나 ReLU 신경망의 외삽에 가깝다."

[[questions]]
id = "combination-choice"
type = "multiple"
objective = 1
prompt = '''잔차 학습보다 **파라미터 학습**(물리 모델의 식은 유지하고 계수만 데이터로 추정)이 더 알맞은 상황을 모두 고르시오.'''
explanation = '''파라미터 학습은 물리 모델의 구조를 믿고 계수만 고친다. 구조가 검증되어 있고 학습 범위 밖으로 외삽해야 할 때, 그리고 데이터가 적어 유연한 보정 함수를 학습하기 어려울 때 알맞다. 반대로 물리 모델이 중요한 과정을 빠뜨렸다는 증거가 있으면 계수를 아무리 맞춰도 구조 오차가 남으므로, 불일치 항이나 직렬 결합으로 빠진 부분을 학습해야 한다. 정해진 운전 범위에서 정밀도만 중요하다면 잔차 학습이 계수 조정보다 나을 수 있다.'''

[[questions.choices]]
text = "식의 구조가 여러 실험으로 검증되었고, 측정 범위 밖의 조건을 예측해야 한다."
correct = true

[[questions.choices]]
text = "측정이 10개 정도로 적어서 유연한 보정 함수를 학습하기 어렵다."
correct = true

[[questions.choices]]
text = "물리 모델이 중요한 과정을 빠뜨렸다는 증거가 있다."
feedback = "구조가 틀리면 계수를 맞춰도 빠진 과정의 오차는 남는다. 실습의 '구조 불일치' 경우처럼 파라미터 학습도 외삽에서 실패한다."

[[questions.choices]]
text = "정해진 운전 범위 안에서만 쓰고, 그 범위의 데이터가 충분히 많다."
feedback = "이 경우에는 범위 안의 정밀도가 중요하므로 잔차 학습이 계수 조정보다 나을 수 있다. 외삽이 필요 없으면 구조를 지키는 이점이 줄어든다."

[[questions]]
id = "pod-modes"
type = "numeric"
objective = 2
prompt = '''평균을 뺀 snapshot 행렬의 특이값이 $10, 5, 2, 1, 0.5$이다. 에너지 $\sum_{k \le r}\sigma_k^2 / \sum_k \sigma_k^2$를 **99% 이상** 보존하는 최소 모드 수 $r$은?'''
answer = 3
tolerance = 0
slider = { min = 1, max = 5, step = 1, unit = "개" }
explanation = '''에너지는 특이값의 **제곱**에 비례한다: $100, 25, 4, 1, 0.25$, 합 $130.25$. 누적 비율은 $r=1$: 0.768, $r=2$: 0.960, $r=3$: 0.990(정확히는 $129/130.25 \approx 0.9904$)이므로 $r = 3$이다. 특이값 자체의 비율($17/18.5 \approx 0.92$ 등)로 계산하면 모드 수를 잘못 고른다.'''

[[questions]]
id = "multifidelity-rho"
type = "numeric"
objective = 2
prompt = '''저충실도 모델이 $f_L(x) = 0.5 f_H(x) + 10(x - 0.5) - 5$이다. $f_H(x) = \rho f_L(x) + \delta(x)$로 쓸 때, $\delta$가 $x$의 1차 함수가 되도록 하는 $\rho$는?'''
answer = 2
tolerance = 0.01
explanation = '''$f_L$을 $f_H$에 대해 풀면 $f_H = 2 f_L - 20(x - 0.5) + 10 = 2 f_L - 20x + 20$이다. 따라서 $\rho = 2$이고 $\delta(x) = -20x + 20$은 1차 함수다. 다른 $\rho$를 쓰면 $\delta$에 $f_H$의 굴곡이 남아 $\delta$를 학습하기 어려워진다. 본문 cell 3이 고충실도 4점으로 $\rho = 2.00$을 되찾은 것도 이 구조 덕분이다. $\rho = 0.5$는 $f_L$을 $f_H$로 나타내는 계수와 혼동한 값이다.'''

[[questions]]
id = "maxvar-ignores-y"
type = "single"
objective = 2
prompt = '''하이퍼파라미터(길이척도·잡음)를 고정한 GP로 "사후분산이 가장 큰 후보"를 다음 실행점으로 고른다. 이 선택에 대해 옳은 것은?'''
explanation = '''GP 사후분산 $k(x_*, x_*) - \mathbf{k}_*^\top(\mathbf{K} + \sigma_n^2\mathbf{I})^{-1}\mathbf{k}_*$에는 관측값 $\mathbf{y}$가 들어가지 않는다. 그래서 하이퍼파라미터를 고정하면 선택 순서는 이미 고른 입력 위치와 길이척도만으로 정해지고, 결과는 공간을 고르게 채우는 설계가 된다. 함수가 급하게 변하는 곳에 점을 모으려면 관측값을 반영하는 하이퍼파라미터 재추정이나, 목표에 맞는 다른 획득 함수가 필요하다.'''

[[questions.choices]]
text = "관측값과 무관하게 입력 위치와 길이척도만으로 정해지며, 공간을 고르게 채우는 설계에 가깝다."
correct = true

[[questions.choices]]
text = "관측값이 크게 변하는 곳(기울기가 큰 곳)에 점을 자동으로 모은다."
feedback = "사후분산 식에는 y가 없다. 기울기가 큰 곳에 점을 모으려면 관측값이 선택에 들어가야 한다."

[[questions.choices]]
text = "함수의 최댓값 근처에 점을 모아 최적화에 가장 효율적이다."
feedback = "최댓값을 찾는 것이 목적이면 기대 개선량 같은 획득 함수를 쓴다(25.3장). 최대 분산은 전체 정확도를 높이는 선택이다."

[[questions.choices]]
text = "무작위 선택과 평균적으로 같은 성능을 낸다."
feedback = "본문 cell 4에서 최대 분산 선택은 같은 실행 수에서 평균 RMSE를 열 배 이상 줄였다. 점이 한쪽에 몰리지 않기 때문이다."

[[questions]]
id = "strongest-baseline"
type = "single"
objective = 1
prompt = '''새 하이브리드 모델(물리 모델 + 신경망 잔차)이 "물리 모델보다 오차가 40% 작다"고 보고하려 한다. 비교 대상인 물리 모델로 가장 알맞은 것은?'''
explanation = '''문헌값 그대로의 물리 모델은 파라미터 오차를 그대로 가지고 있어 이기기 쉬운 baseline이다. 같은 학습 데이터로 물리 파라미터만 다시 추정한 모델이 공정하고 강한 baseline이다. 하이브리드 모델이 이 baseline을 이기지 못하면, 신경망은 파라미터 재추정으로 충분한 일을 복잡하게 한 것이다. 시험 데이터로 파라미터를 맞추는 것은 누수다.'''

[[questions.choices]]
text = "같은 학습 데이터로 파라미터만 다시 추정한 물리 모델"
correct = true

[[questions.choices]]
text = "문헌값 그대로의 물리 모델"
feedback = "문헌값 모델은 파라미터 오차를 가지고 있어, 하이브리드 모델의 개선 중 상당 부분이 단순한 재추정으로도 얻을 수 있는 것일 수 있다."

[[questions.choices]]
text = "시험 데이터로 파라미터를 맞춘 물리 모델"
feedback = "시험 데이터를 학습에 쓰면 누수다. baseline도 하이브리드 모델과 같은 학습 데이터만 써야 한다."

[[questions.choices]]
text = "신경망만으로 학습한 데이터 전용 모델"
feedback = "데이터 전용 모델도 함께 보고할 baseline이지만, '물리 모델보다 낫다'는 주장의 비교 대상은 아니다."
