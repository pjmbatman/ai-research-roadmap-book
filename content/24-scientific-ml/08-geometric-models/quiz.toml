# 24.8 대칭성을 반영한 과학 모델 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "force-target"
type = "single"
objective = 1
prompt = '''분자 동역학에 쓸 원자 간 퍼텐셜 모델을 만든다. 원자마다의 힘을 예측해야 할 때 가장 알맞은 설계는?'''
explanation = '''힘은 분자와 함께 도는 벡터이므로 회전에 등변이어야 하고, 퍼텐셜의 음의 gradient여야(보존력) 장시간 시뮬레이션에서 에너지가 보존된다. $E(3)$ 불변 에너지 모델을 만들고 $\mathbf{F}_i = -\partial E/\partial \mathbf{x}_i$를 자동미분으로 구하면 두 성질이 구조적으로 보장된다. 불변 모델로 힘의 세 성분을 직접 예측하면 분자를 돌려도 힘이 돌지 않는다. 좌표를 펼친 MLP와 증강은 등변성을 근사적으로만 얻고 보존력도 보장하지 않는다.'''

[[questions.choices]]
text = "E(3) 불변 에너지 모델을 만들고 힘은 에너지를 좌표로 미분해 얻는다."
correct = true

[[questions.choices]]
text = "E(3) 불변 모델로 원자마다 힘의 x, y, z 세 성분을 직접 예측한다."
feedback = "불변 모델의 출력은 회전해도 바뀌지 않는다. 힘은 분자와 함께 돌아야 하므로 불변 출력으로 쓸 수 없다."

[[questions.choices]]
text = "좌표를 펼쳐 MLP에 넣고 회전 증강으로 학습해 힘을 예측한다."
feedback = "증강은 등변성을 권장할 뿐 보장하지 않고, 예측한 힘이 어떤 퍼텐셜의 gradient라는 보장도 없어 에너지가 표류할 수 있다."

[[questions.choices]]
text = "원자 번호 순서를 고정한 뒤 일반 MLP로 에너지를 예측한다."
feedback = "번호 순서를 고정해도 회전·평행이동 대칭은 빠져 있다. 또 같은 종류의 원자끼리 번호를 바꾸는 순열 대칭도 깨진다."

[[questions]]
id = "internal-dof"
type = "numeric"
objective = 1
prompt = '''일직선이 아닌 배치의 원자 4개가 있다. 전체 회전과 평행이동을 빼면, 에너지를 정하는 내부 자유도는 몇 개인가?'''
answer = 6
tolerance = 0
slider = { min = 0, max = 12, step = 1, unit = "개" }
explanation = '''좌표는 $3 \times 4 = 12$개이고, 전체 평행이동 3개와 전체 회전 3개를 빼면 $3N - 6 = 6$개다. 원자 4개의 쌍별 거리도 $\binom{4}{2} = 6$개라서, 이 경우에는 쌍별 거리가 내부 자유도와 같은 수다. 쌍별 거리의 좌표에 대한 Jacobian의 rank가 6인 것으로 확인할 수 있다. 12로 답하면 대칭을 빼지 않은 것이고, 9는 평행이동만 뺀 것이다.'''

[[questions]]
id = "egnn-message-inputs"
type = "single"
objective = 2
prompt = '''EGNN 층을 구현하면서 메시지 MLP $\phi_e$에 거리 제곱 $\lVert \mathbf{x}_i - \mathbf{x}_j \rVert^2$ 대신 상대 벡터 $\mathbf{x}_i - \mathbf{x}_j$의 세 성분을 넣었다. 무엇이 깨지는가?'''
explanation = '''상대 벡터는 평행이동에는 불변이지만 회전하면 $\mathbf{Q}(\mathbf{x}_i - \mathbf{x}_j)$로 바뀐다. MLP는 성분별 비선형 함수라 이 변화를 따라 돌려 주지 않으므로, 메시지 $\mathbf{m}_{ij}$가 회전에 따라 달라지고 노드 특징의 불변성과 좌표의 등변성이 모두 깨진다. 평행이동 대칭은 유지된다. EGNN의 원칙은 MLP에는 불변량만 넣고, 등변량(상대 벡터)은 불변 스칼라의 계수로만 쓰는 것이다.'''

[[questions.choices]]
text = "회전 대칭이 깨진다. 평행이동 대칭은 유지된다."
correct = true

[[questions.choices]]
text = "평행이동 대칭이 깨진다. 회전 대칭은 유지된다."
feedback = "상대 벡터는 x_i - x_j라서 평행이동 t가 상쇄된다. 깨지는 것은 회전이다."

[[questions.choices]]
text = "아무것도 깨지지 않는다. 상대 벡터는 등변량이므로 메시지도 등변이 된다."
feedback = "등변량을 비선형 MLP에 넣으면 출력은 등변도 불변도 아니다. 등변량은 불변 스칼라를 곱하는 방식으로만 써야 한다."

[[questions.choices]]
text = "순열 대칭만 깨진다."
feedback = "메시지는 여전히 모든 쌍에 같은 MLP를 쓰고 합으로 모으므로 순열 등변성은 유지된다."

[[questions]]
id = "augmentation-vs-equivariance"
type = "multiple"
objective = 3
prompt = '''x축으로 정렬된 구조로 학습하고 무작위로 회전한 구조로 시험한 본문 cell 2의 결과에 대해 옳은 것을 모두 고르시오.'''
explanation = '''불변 특징은 대칭이 구조로 보장되어 회전된 시험의 오차가 같은 방향 시험과 같고, 같은 데이터로 오차가 훨씬 작다(데이터 효율). 좌표 표현은 같은 방향 시험에서는 그럭저럭 맞지만 회전 시험에서 크게 나빠져, 회전 시험 없이는 약점이 보이지 않는다. 증강은 회전 시험의 격차를 줄이지만 대칭을 보장하지 않고, 이 실험에서는 순열 대칭도 빠져 있어 불변 특징을 따라가지 못했다.'''

[[questions.choices]]
text = "불변 특징 모델은 회전된 시험셋에서도 같은 방향 시험셋과 같은 오차를 낸다."
correct = true

[[questions.choices]]
text = "같은 방향의 시험셋만으로는 좌표 표현의 약점을 알아채기 어렵다."
correct = true

[[questions.choices]]
text = "회전 증강을 하면 좌표 표현도 불변 특징과 같은 데이터 효율을 얻는다."
feedback = "증강은 회전 시험의 격차를 줄였지만, 같은 학습 크기에서 오차는 불변 특징보다 여러 배 크다. 증강은 대칭을 권장할 뿐 보장하지 않는다."

[[questions.choices]]
text = "학습 데이터가 충분히 많으면 좌표 표현도 회전된 시험셋에서 불변 특징만큼 정확해진다."
feedback = "학습 구조가 모두 x축으로 정렬되어 있으면, 데이터를 늘려도 다른 방향의 구조는 학습 분포 밖에 남는다. 실습 표에서도 N = 400까지 회전 오차는 1을 넘었다."

[[questions]]
id = "rotated-test-claim"
type = "single"
objective = 3
prompt = '''논문 초안에 "등변 모델이 비등변 모델보다 오차가 20% 작다"고 썼다. 시험셋은 학습셋과 같은 방식으로 정렬·저장된 구조다. 등변성의 효과를 주장하려면 가장 먼저 무엇을 더해야 하는가?'''
explanation = '''같은 방향으로 정렬된 시험셋에서는 비등변 모델도 학습 분포 안에서 평가되므로, 등변성이 주는 회전 일반화의 이점이 드러나지 않는다. 시험 구조를 무작위로 회전·반사·치환한 시험셋과, 데이터 크기를 바꿔 가며 그린 학습 곡선이 등변성의 두 효과(회전 일반화, 데이터 효율)를 직접 보여 준다. 모델 크기·학습 시간 비교도 필요하지만, 그것만으로는 차이가 대칭 때문인지 알 수 없다.'''

[[questions.choices]]
text = "시험 구조를 무작위로 회전·반사·치환한 시험셋과, 데이터 크기별 학습 곡선"
correct = true

[[questions.choices]]
text = "같은 시험셋에서 시드를 바꾼 반복 실험만"
feedback = "반복 실험은 필요하지만, 같은 방향의 시험셋으로는 등변성의 효과(회전 일반화)를 측정하지 못한다."

[[questions.choices]]
text = "두 모델의 파라미터 수를 같게 맞춘 비교만"
feedback = "공정한 비교에 필요하지만, 회전된 시험이 없으면 차이가 대칭 때문인지 다른 귀납 편향 때문인지 구별할 수 없다."

[[questions.choices]]
text = "등변 모델의 층 수를 늘린 ablation"
feedback = "층 수 ablation은 깊이의 효과를 보여 줄 뿐, 등변 제약의 효과를 분리하지 못한다."

[[questions]]
id = "field-breaks-symmetry"
type = "single"
objective = 1
prompt = '''z축 방향의 균일한 전기장 안에 놓인 분자의 에너지를 예측한다(장의 방향은 모든 데이터에서 같다). 모델이 지켜야 할 대칭으로 가장 알맞은 것은?'''
explanation = '''장은 공간에 방향 $\hat{\mathbf{z}}$를 정하므로, 분자만 임의로 돌리면 에너지가 바뀔 수 있다. 남는 대칭은 z축을 축으로 한 회전, 평행이동(균일한 장), 같은 원자끼리의 순열이다. 완전한 $E(3)$ 불변 모델은 분자가 장에 대해 어느 방향인지 볼 수 없어 데이터를 늘려도 줄지 않는 오차 바닥이 생긴다(cell 3). 대칭을 모두 버리면 남은 대칭을 다시 데이터로 배워야 한다. 장 벡터를 입력으로 함께 넣는 등변 모델도 올바른 선택이다.'''

[[questions.choices]]
text = "z축 둘레의 회전, 평행이동, 같은 원자끼리의 순열"
correct = true

[[questions.choices]]
text = "E(3) 전체(모든 회전·반사·평행이동)와 순열"
feedback = "장이 방향을 정하므로 z축이 아닌 축으로 돌리면 에너지가 바뀐다. 이 제약을 걸면 cell 3처럼 오차 바닥이 생긴다."

[[questions.choices]]
text = "대칭이 깨졌으므로 대칭을 전혀 넣지 않는다."
feedback = "z축 둘레의 회전, 평행이동, 순열은 여전히 성립한다. 남은 대칭을 버리면 그것까지 데이터로 배워야 해 데이터 효율을 잃는다."

[[questions.choices]]
text = "순열만. 공간 대칭은 모두 깨졌다."
feedback = "균일한 장은 평행이동과 장 방향 둘레의 회전을 깨지 않는다. 깨진 것은 장 방향을 바꾸는 회전뿐이다."
