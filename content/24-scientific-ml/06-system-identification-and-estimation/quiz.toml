# 24.6 시스템 식별과 상태 추정 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "structural-vs-practical"
type = "single"
objective = 1
prompt = '''낙하 속도 $v(t) = v_\infty(1 - e^{-t/\tau})$를 0–1 s 동안만 측정해 $v_\infty$와 $\tau$를 추정했더니 두 추정값의 상관이 거의 1이었다. 가장 알맞은 해석은?'''
explanation = '''$v_\infty$와 $\tau$는 측정 구간이 충분히 길면 따로 정해지므로 구조적으로는 식별 가능하다. 짧은 구간에서는 $v(t) \approx (v_\infty/\tau)t$라서 비율만 보이고, 두 파라미터를 함께 키우는 방향으로 출력이 거의 변하지 않는다. 이것은 실험 설계가 만든 **실용적** 식별 불가능이다. 본문 cell 1에서 측정 구간을 0–10 s로 늘리자 상대오차가 5%에서 0.1–0.2%로 줄었다. 반면 $(m, c)$는 어떤 구간을 재도 비율로만 나타나므로 구조적으로 식별 불가능하다.'''

[[questions.choices]]
text = "구조적으로는 식별 가능하지만, 이 실험 설계에서는 실용적으로 식별하기 어렵다. 측정 구간을 늘리면 해결된다."
correct = true

[[questions.choices]]
text = "구조적으로 식별 불가능하므로 측정을 아무리 늘려도 두 값을 따로 정할 수 없다."
feedback = "그것은 (m, c)의 경우다. v_inf와 tau는 시간이 지나 곡선이 꺾이는 모양까지 재면 따로 정해진다."

[[questions.choices]]
text = "측정 잡음을 줄이면 상관도 0으로 내려간다."
feedback = "잡음을 줄이면 두 값의 분산은 줄지만 상관 구조는 민감도 행렬, 즉 측정 시각이 정한다. 상관을 바꾸려면 실험 설계를 바꿔야 한다."

[[questions.choices]]
text = "최적화가 수렴하지 않았다는 뜻이므로 학습률을 줄이고 다시 추정한다."
feedback = "최적화가 완벽히 수렴해도 상관은 그대로다. 상관은 데이터가 담은 정보의 구조이지 최적화 실패가 아니다."

[[questions]]
id = "observability-rank"
type = "numeric"
objective = 1
prompt = '''상태 $\mathbf{x} = (\text{위치}, \text{속도})$, $\mathbf{F} = \begin{bmatrix} 1 & \Delta t \\ 0 & 1 \end{bmatrix}$인 등속 운동에서 **속도만** 측정한다($\mathbf{H} = [0\ \ 1]$). 관측 가능성 행렬 $\mathcal{O} = \begin{bmatrix} \mathbf{H} \\ \mathbf{H}\mathbf{F} \end{bmatrix}$의 rank는?'''
answer = 1
tolerance = 0
slider = { min = 0, max = 2, step = 1 }
explanation = '''$\mathbf{H}\mathbf{F} = [0\ \ 1]$이므로 $\mathcal{O} = \begin{bmatrix} 0 & 1 \\ 0 & 1 \end{bmatrix}$이고 rank는 1이다. 상태 차원 2보다 작으므로 관측 가능하지 않다. 영공간 방향 $(1, 0)$, 즉 위치는 측정에 전혀 나타나지 않는다. 속도를 적분하면 위치의 변화만 알 수 있고 출발 위치는 알 수 없다. 위치를 재면($\mathbf{H} = [1\ \ 0]$) rank가 2가 된다.'''

[[questions]]
id = "threshold-units"
type = "single"
objective = 2
prompt = '''STLSQ로 동역학 식을 찾는다. 같은 데이터에서 온도를 켈빈 대신 밀리켈빈으로 바꿔 라이브러리를 다시 만들고, 임계값 $\lambda$는 그대로 두었다. 무엇이 일어날 수 있는가?'''
explanation = '''STLSQ는 계수의 **절댓값**을 임계값과 비교한다. 변수의 단위를 바꾸면 그 변수가 들어간 라이브러리 열의 크기가 바뀌고, 같은 물리적 기여를 내는 계수의 크기가 반대로 바뀐다(밀리켈빈이면 $T$ 계수는 1000분의 1, $T^2$ 계수는 100만분의 1). 그래서 같은 $\lambda$로도 참 항이 잘리거나 가짜 항이 남을 수 있다. 라이브러리 열을 표준화하거나 무차원화(24.1장)한 뒤 임계값을 정하고, 결과를 원래 단위로 되돌린다.'''

[[questions.choices]]
text = "온도가 들어간 항의 계수 크기가 바뀌어, 같은 임계값에서 참 항이 잘리거나 가짜 항이 남을 수 있다."
correct = true

[[questions.choices]]
text = "최소제곱은 단위와 무관하므로 선택되는 항은 바뀌지 않는다."
feedback = "최소제곱의 적합값은 단위와 무관하지만, 계수의 크기는 단위에 따라 바뀐다. 임계값은 계수의 크기에 걸리므로 선택이 바뀐다."

[[questions.choices]]
text = "모든 계수가 같은 비율로 바뀌므로 임계값만 같은 비율로 바꾸면 항상 같은 결과가 나온다."
feedback = "T, T^2, xT처럼 온도의 거듭제곱이 다른 항은 서로 다른 비율로 바뀐다. 임계값 하나로는 모두 맞출 수 없다."

[[questions.choices]]
text = "수치 미분의 오차가 줄어 식이 더 정확해진다."
feedback = "단위를 바꾸는 것은 잡음 대 신호의 비율을 바꾸지 않는다. 미분 오차는 측정 잡음과 시간 간격이 정한다."

[[questions]]
id = "noisy-sindy"
type = "multiple"
objective = 2
prompt = '''측정 잡음이 있는 궤적에 중심차분과 STLSQ를 적용했더니 참 항 하나가 빠지고 다른 항의 계수가 크게 바뀌었다. 상황을 개선할 수 있는 방법을 모두 고르시오.'''
explanation = '''잡음은 두 경로로 문제를 만든다. 수치 미분이 잡음을 $1/\Delta t$ 배로 키우고, 잡음이 라이브러리 $\mathbf{\Theta}(\mathbf{X})$에도 들어가 계수를 0 쪽으로 줄인다. 미분 전에 평활하거나, 미분을 피하는 적분·약형식을 쓰거나, 잡음 수준과 임계값을 바꿔 가며 식이 안정적인지 확인하는 것이 대책이다. 샘플 간격을 줄이면($\Delta t$를 작게) 오히려 차분의 잡음 증폭이 커진다. 임계값을 0으로 두면 모든 항이 남아 희소성이 사라진다.'''

[[questions.choices]]
text = "미분하기 전에 궤적을 평활한다."
correct = true

[[questions.choices]]
text = "미분 대신 식을 시간에 대해 적분한 형태(적분·약형식)로 회귀한다."
correct = true

[[questions.choices]]
text = "같은 측정 장비로 샘플링 간격을 더 줄여 같은 시간 동안 더 자주 측정한다."
feedback = "측정마다 잡음이 같다면 간격 Δt가 작을수록 중심차분이 잡음을 σ/(√2 Δt)로 더 크게 키운다. 미분 잡음의 분산은 1/Δt²로 늘고 점 수는 1/Δt로만 늘므로, 평균하는 이득보다 증폭이 커서 오히려 나빠진다."

[[questions.choices]]
text = "임계값을 0으로 두어 모든 후보 항을 남긴다."
feedback = "그러면 희소성이 사라지고 모든 항이 잡음을 맞추는 데 쓰인다. 식을 해석할 수 없게 된다."

[[questions]]
id = "kalman-gain-limits"
type = "single"
objective = 3
prompt = '''칼만 필터 갱신에서 측정 잡음 공분산 $\mathbf{R}$을 매우 크게($\mathbf{R} \to \infty$) 설정하면 갱신된 평균 $\mathbf{m}_k$는 어떻게 되는가?'''
explanation = '''$\mathbf{K}_k = \mathbf{P}^-_k\mathbf{H}^\top(\mathbf{H}\mathbf{P}^-_k\mathbf{H}^\top + \mathbf{R})^{-1}$에서 $\mathbf{R} \to \infty$이면 $\mathbf{K}_k \to \mathbf{0}$이다. 따라서 $\mathbf{m}_k \to \mathbf{m}^-_k$로 측정을 무시하고 예측을 그대로 쓴다. 반대로 $\mathbf{R} \to \mathbf{0}$이고 $\mathbf{H} = \mathbf{I}$이면 $\mathbf{K}_k \to \mathbf{I}$가 되어 측정을 그대로 믿는다. 이득은 예측 불확실성과 측정 잡음의 상대적 크기로 정해진다.'''

[[questions.choices]]
text = '''예측 평균 $\mathbf{m}^-_k$에 머문다. 측정을 무시한다.'''
correct = true

[[questions.choices]]
text = '''측정값 $\mathbf{y}_k$를 그대로 따른다.'''
feedback = "그것은 R이 0에 가까울 때(그리고 H = I일 때)다. 측정 잡음이 크다고 설정하면 필터는 측정을 덜 믿는다."

[[questions.choices]]
text = '''예측과 측정의 단순 평균이 된다.'''
feedback = "단순 평균은 P와 R의 크기가 특정 비율일 때만 나온다. R이 무한히 크면 측정의 가중치는 0으로 간다."

[[questions.choices]]
text = '''공분산 $\mathbf{P}_k$가 0이 되어 필터가 확신한다.'''
feedback = "측정을 무시하면 불확실성이 줄지 않는다. P_k는 예측 공분산 P_k^-에 머물고, 시간이 지나며 Q만큼 커진다."

[[questions]]
id = "effective-sample-size"
type = "numeric"
objective = 3
prompt = '''입자 4개의 정규화된 가중치가 $(0.5, 0.5, 0, 0)$이다. 유효 표본 수 $n_{\text{eff}} = 1/\sum_i (w^{(i)})^2$는?'''
answer = 2
tolerance = 0
slider = { min = 1, max = 4, step = 0.5 }
explanation = '''$\sum_i (w^{(i)})^2 = 0.25 + 0.25 = 0.5$이므로 $n_{\text{eff}} = 2$다. 입자는 4개지만 사후분포를 실제로 표현하는 것은 가중치가 있는 2개뿐이다. 모든 가중치가 0.25로 같으면 $n_{\text{eff}} = 4$, 한 입자가 가중치 1을 가지면 1이다. 입자 수 $n$이 아니라 $n_{\text{eff}}$가 표본의 질을 말한다.'''
