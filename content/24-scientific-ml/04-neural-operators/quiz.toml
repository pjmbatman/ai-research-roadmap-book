# 24.4 Neural Operator와 동역학 학습 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).
# 계산으로 확인할 수 있는 정답은 labs/scientific-ml/neural-operators/test_quiz.py가 검증한다.

[[questions]]
id = "operator-problem"
type = "single"
objective = 1
prompt = '''열전달 문제에서 다음 중 **연산자 학습**(operator learning) 문제로 정의된 것은?'''
explanation = '''연산자 학습은 함수(초기 온도 분포)를 함수(나중 온도 분포)로 보내는 사상을 배우고, 그 사상이 특정 격자와 무관하게 정의되기를 요구한다. 격자 64점 벡터를 64점 벡터로 보내는 회귀는 같은 데이터를 쓰더라도 사상이 그 격자에 묶여 있어, 다른 해상도나 센서 배치에 바로 쓸 수 없다. 하나의 초기 조건에 대한 해를 학습하는 PINN은 함수 하나를 배우는 것이고, 조건이 바뀌면 다시 학습해야 한다.'''

[[questions.choices]]
text = "초기 온도 분포 u₀(x)에서 1시간 뒤 분포 u(x, T)로 가는 사상을, 입력·출력을 어떤 격자로 샘플링해도 쓸 수 있게 학습한다."
correct = true

[[questions.choices]]
text = "64점 격자의 초기 온도 벡터를 64점 격자의 나중 온도 벡터로 보내는 MLP를 학습한다."
feedback = "같은 데이터를 쓰지만, 학습된 사상이 64점 격자에 묶여 있다. 128점 데이터나 다른 센서 배치에는 그대로 쓸 수 없다."

[[questions.choices]]
text = "주어진 초기 조건 하나에 대해 u(x, t)를 신경망으로 표현하고 방정식 잔차로 학습한다."
feedback = "24.2장의 PINN이다. 함수 하나(해 하나)를 학습하므로, 초기 조건이 바뀌면 다시 학습해야 한다."

[[questions.choices]]
text = "열전도도 값 하나에서 최고 온도 값 하나로 가는 회귀를 학습한다."
feedback = "스칼라에서 스칼라로 가는 대리모델이다. 입력과 출력이 함수가 아니다."

[[questions]]
id = "fno-resolution"
type = "single"
objective = 3
prompt = '''본문 셀 3에서 같은 가중치의 스펙트럼 합성곱은 32점과 256점 격자에서 같은 함수를 냈지만, 3점 합성곱 [0.25, 0.5, 0.25]는 격자에 따라 결과가 0.3 넘게 달라졌다. 그 이유는?'''
explanation = '''스펙트럼 합성곱의 가중치는 Fourier 모드, 즉 물리적 파수에 묶여 있다. 계수를 $N$으로 정규화하면 같은 함수의 계수는 격자와 무관하므로, 같은 가중치가 같은 연속 연산자를 정의한다. 3점 합성곱의 가중치는 격자 칸에 묶여 있어, 격자가 촘촘해지면 같은 커널이 물리적으로 더 좁은 영역을 평균한다. 격자마다 다른 연산자가 되는 것이다. 7.9장의 "이산 연산자는 연속 연산자의 그림자"라는 관점이다.'''

[[questions.choices]]
text = "스펙트럼 가중치는 물리적 파수에 묶여 있고, 3점 커널은 격자 칸에 묶여 있어 격자가 바뀌면 다른 연산자가 된다."
correct = true

[[questions.choices]]
text = "FFT가 유한차분보다 반올림 오차가 작기 때문이다."
feedback = "차이는 반올림 수준(10^-12)이 아니라 0.3이다. 3점 합성곱은 정확히 계산되었지만, 격자에 따라 다른 연산을 한다."

[[questions.choices]]
text = "3점 커널의 가중치를 격자마다 다시 학습하지 않았기 때문이며, 다시 학습하면 해상도 불변이 된다."
feedback = "격자마다 다시 학습하면 그 격자에서는 맞출 수 있지만, 그것은 해상도마다 다른 모델이다. 해상도 불변성은 같은 파라미터가 모든 해상도에서 같은 연산자를 뜻하는 성질이다."

[[questions]]
id = "truncation-advection"
type = "single"
objective = 3
prompt = '''본문 셀 4에서 모드 12개로 학습한 스펙트럼 층은 열방정식에서는 고주파 입력에도 오차가 $10^{-7}$이었지만, 이류(shift)에서는 고주파 입력에 대해 해상도 64와 256 모두 오차가 0.17이었다. 옳은 해석은?'''
explanation = '''두 해상도에서 오차가 같으므로 해상도 불변성은 성립한다. 오차의 원인은 모드 절단이다. 학습된 층은 파수 13 이상의 성분을 버린다. 열방정식은 그 성분을 $e^{-(2\pi k)^2 T}$로 거의 지우므로 버려도 문제가 없지만, 이류는 모든 모드의 크기를 보존하므로 버린 만큼이 그대로 오차가 된다. 해상도 불변성은 정확도를 보장하지 않으며, 연산자가 고주파를 어떻게 다루는지에 따라 필요한 모드 수가 다르다.'''

[[questions.choices]]
text = "해상도 불변성이 깨져서 생긴 오차다."
feedback = "해상도 64와 256의 오차가 같다(0.17). 해상도 불변성은 성립하고 있다."

[[questions.choices]]
text = "모드 절단 때문이다. 이류는 고주파 성분을 보존하므로 버린 모드가 그대로 오차가 되고, 열방정식은 그 성분을 스스로 지운다."
correct = true

[[questions.choices]]
text = "학습 데이터가 200개로 부족했기 때문이며 데이터를 늘리면 해결된다."
feedback = "학습 데이터에는 파수 12까지만 있었고, 층에도 모드 12개만 있다. 같은 분포의 데이터를 늘려도 파수 13 이상은 배울 수 없다."

[[questions]]
id = "deeponet-sensors"
type = "single"
objective = 2
prompt = '''DeepONet의 branch 망이 센서 32개의 값을 입력으로 받도록 학습했다. 다른 장비가 같은 함수를 센서 위치에서 반 칸씩 어긋난 32곳에서 측정해, 그 값을 그대로 branch에 넣었더니 상대 오차가 0.11이었다. 옳은 설명은?'''
explanation = '''DeepONet의 출력 쪽(trunk)은 임의의 위치 $y$에서 평가할 수 있지만, 입력 쪽(branch)은 학습 때 정한 센서 위치의 값 벡터를 받는다. 값의 개수가 같아도 위치가 다르면 다른 입력이다. 다른 격자의 측정은 먼저 학습 센서 위치로 보간해야 하고, 이때 보간 오차가 추가된다(본문 셀 2에서 50점 입력의 선형 보간은 오차 $2.4 \times 10^{-3}$). 입력 이산화가 바뀌는 상황이 많다면 입력도 함수로 다루는 FNO나 커널 적분 계열이 더 자연스럽다.'''

[[questions.choices]]
text = "branch는 학습 때 정한 센서 위치의 값만 이해하므로, 다른 위치의 측정은 센서 위치로 보간해 넣어야 한다."
correct = true

[[questions.choices]]
text = "trunk 망이 어긋난 위치를 처리하지 못해서다. trunk에 센서 위치를 넣으면 된다."
feedback = "trunk는 출력 위치 y를 받는다. 입력 함수의 센서 위치는 branch 쪽 문제다."

[[questions.choices]]
text = "값의 개수(32)가 같으므로 오차는 학습 부족 때문이다."
feedback = "같은 센서 위치의 값을 넣으면 오차가 반올림 수준이다. 개수가 같아도 위치가 다르면 다른 입력이다."

[[questions]]
id = "rollout-growth"
type = "numeric"
objective = 3
prompt = '''한 step 연산자를 학습했더니 어떤 Fourier 모드의 증폭 인자가 $|w_k| = 1.0037$이었다(참값은 1). 이 연산자를 1000 step rollout하면 그 모드의 진폭은 처음의 약 몇 배가 되는가? (정수로)'''
answer = 40
tolerance = 1
slider = { min = 1, max = 100, step = 1 }
explanation = '''$1.0037^{1000} = e^{1000\ln 1.0037} \approx e^{3.69} \approx 40$배다. 한 step에서 0.37%의 오차는 한 step 평가로는 거의 보이지 않지만, rollout에서는 지수적으로 쌓인다. 본문 셀 6에서 이런 모드 하나가 처음에는 에너지가 작았는데도 1000 step 뒤 전체 노름을 1.76배로 키웠다. 반대로 $|w_k| < 1$이면 그 모드는 지나치게 감쇠한다. 증폭 인자를 물리적으로 맞는 범위(이류라면 $|w_k| = 1$, 확산이라면 $\le 1$)로 제한하면 이런 폭주를 막는다.'''

[[questions]]
id = "unseen-modes"
type = "single"
objective = 2
prompt = '''파수 12까지의 성분만 가진 입력 함수들로 스펙트럼 층의 가중치를 모드별 최소제곱 $w_k = \sum \hat{b}_k \overline{\hat{a}_k} / \sum |\hat{a}_k|^2$로 학습하려 한다. 층의 모드 수를 16으로 잡으면 파수 13–16의 가중치는?'''
explanation = '''파수 13–16에서 입력 계수 $\hat{a}_k$는 (반올림 잡음을 빼면) 0이므로 분모와 분자가 모두 0에 가깝다. 계산된 가중치는 반올림 잡음의 비로, 아무 의미가 없다. 그런데도 이 가중치는 고주파를 가진 새 입력에는 그대로 곱해진다. 데이터가 덮지 않는 모드는 데이터가 정하지 못한다. 본문은 그래서 모드 수를 입력이 가진 파수(12)로 맞췄다. 신경망 FNO에서도 같은 일이 일어나며, 이때 그 모드의 가중치는 초기값과 정규화가 정한다.'''

[[questions.choices]]
text = "데이터가 정하지 못한다. 0/0에 가까운 값이라 반올림 잡음이 결과를 정한다."
correct = true

[[questions.choices]]
text = "자동으로 0이 되므로 해가 없다."
feedback = "분자와 분모가 모두 반올림 수준의 작은 값이라 비가 0이 되지 않는다. 아무 값이나 나올 수 있다."

[[questions.choices]]
text = "열방정식의 참값 exp(-(2πk)²T)로 정확히 추정된다."
feedback = "참값을 추정하려면 그 파수의 성분이 입력에 있어야 한다. 데이터에 없는 정보는 최소제곱으로 만들어지지 않는다."
