# 9.3 수치 선형대수 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "explicit-inverse"
type = "single"
objective = 1
prompt = '''$\mathbf{A}\mathbf{x} = \mathbf{b}$를 풀 때 `np.linalg.inv(A) @ b` 대신 `np.linalg.solve(A, b)`를 쓰라고 하는 이유로 가장 정확한 것은?'''
explanation = '''`solve`는 LU 분해 한 번과 삼각 시스템 풀이로 해를 구하며 backward stable하다. 역행렬을 만들면 연산이 더 들고(역행렬 계산 자체가 LU 분해 뒤 $n$개의 오른쪽 변을 푸는 것이다), 결과의 backward error가 조건수에 비례해 커져 해의 정확도도 대개 나빠진다. 희소 행렬이면 문제가 더 크다. 희소 행렬의 역행렬은 일반적으로 꽉 찬 행렬이라 메모리에 들어가지 않을 수 있다.'''

[[questions.choices]]
text = "역행렬은 연산이 더 들고 backward stable하지 않아 정확도도 대개 나쁘며, 희소 행렬의 역행렬은 꽉 차기 때문이다."
correct = true

[[questions.choices]]
text = "inv와 solve는 결과가 완전히 같고, 단지 solve가 조금 더 빠를 뿐이다."
feedback = "속도뿐 아니라 정확도도 다르다. 9.2장의 Hilbert 실험에서 n = 11일 때 inv @ b의 오차는 solve보다 약 100배 컸다."

[[questions.choices]]
text = "역행렬은 특이행렬에서만 문제가 되므로, 가역행렬이면 inv를 써도 같다."
feedback = "가역이어도 조건수가 크면 inv @ b의 backward error가 커진다. 정확도 차이는 특이행렬이 아니어도 나타난다."

[[questions.choices]]
text = "역행렬은 float64로 표현할 수 없기 때문이다."
feedback = "역행렬도 float64 행렬로 계산된다. 문제는 그 계산 경로가 오차를 더 키운다는 점이다."

[[questions]]
id = "factor-once"
type = "single"
objective = 1
prompt = '''같은 $2000 \times 2000$ dense 행렬 $\mathbf{A}$에 대해 오른쪽 변 $\mathbf{b}_1, \dots, \mathbf{b}_{500}$을 차례로 받아 풀어야 한다. 가장 효율적인 방법은?'''
explanation = '''LU 분해는 약 $\tfrac{2}{3}n^3$ 연산이고, 분해한 인수로 오른쪽 변 하나를 푸는 전진·후진 대입은 약 $2n^2$ 연산이다. 한 번 분해하고(`scipy.linalg.lu_factor`) 500번 대입하면(`lu_solve`) 매번 `solve`를 부르는 것보다 수백 배 적은 연산으로 끝난다. $\mathbf{A}$가 대칭 양의 정부호이면 Cholesky(`cho_factor`)로 연산을 절반으로 줄인다.'''

[[questions.choices]]
text = "LU 분해를 한 번 해 두고, 각 오른쪽 변은 삼각 시스템 대입으로 푼다."
correct = true

[[questions.choices]]
text = "매번 np.linalg.solve(A, b_i)를 호출한다."
feedback = "solve는 호출할 때마다 O(n³)의 분해를 처음부터 다시 한다. 500번이면 분해를 500번 하는 셈이다."

[[questions.choices]]
text = "역행렬을 한 번 계산해 두고 매번 곱한다. 연산량과 정확도 모두 LU와 같다."
feedback = "연산량은 비슷한 차수지만 정확도는 같지 않다. 역행렬을 거치면 backward stability를 잃는다. 분해를 재사용하면 같은 효율에 더 정확하다."

[[questions.choices]]
text = "dense 행렬이므로 CG 같은 반복법으로 매번 푼다."
feedback = "CG는 A가 대칭 양의 정부호여야 하고, dense 행렬에서는 반복 한 번에 O(n²)이 들어 반복 수가 많으면 분해 재사용보다 느리다."

[[questions]]
id = "cg-requirements"
type = "multiple"
objective = 1
prompt = '''conjugate gradient(CG)에 대한 설명으로 옳은 것을 모두 고르시오.'''
explanation = '''CG는 $\mathbf{A}$가 대칭 양의 정부호(SPD)일 때 쓰는 Krylov 부분공간 방법이다. $\mathbf{A}$의 원소가 아니라 행렬–벡터 곱만 필요하므로 행렬을 만들지 않는(matrix-free) 계산에 맞는다. 반복 수는 대략 $\sqrt{\kappa(\mathbf{A})}$에 비례하므로, 조건수를 줄이는 전처리가 핵심이다. 대칭이 아닌 행렬에는 GMRES, BiCGSTAB 같은 다른 Krylov 방법을 쓴다.'''

[[questions.choices]]
text = "행렬이 대칭 양의 정부호여야 한다."
correct = true

[[questions.choices]]
text = "행렬의 원소 대신 행렬–벡터 곱만 있으면 된다."
correct = true

[[questions.choices]]
text = "반복 수는 대략 조건수의 제곱근에 비례해 늘어난다."
correct = true

[[questions.choices]]
text = "임의의 정사각 가역행렬에 쓸 수 있다."
feedback = "대칭이 아니거나 양의 정부호가 아니면 CG의 이론적 근거(A-내적에서의 직교성)가 무너져 수렴을 보장하지 않는다. 비대칭 행렬에는 GMRES 등을 쓴다."

[[questions]]
id = "cholesky-jitter"
type = "single"
objective = 1
prompt = '''Gaussian process 회귀에서 커널 행렬 $\mathbf{K}$(이론적으로 양의 준정부호)를 Cholesky 분해하려 했더니 "양의 정부호가 아니다"라는 오류가 났다. 입력점이 촘촘하고 length scale이 길다. 가장 적절한 대응은?'''
explanation = '''촘촘한 점과 긴 length scale에서는 커널 행렬의 행들이 거의 같아져 고유값이 $10^{-16}$ 수준까지 떨어진다. 반올림 오차로 가장 작은 고유값이 0이나 음수로 계산되면 Cholesky가 실패한다. 대각에 작은 양수(jitter, 또는 관측 잡음 분산) $\epsilon\mathbf{I}$를 더하면 모든 고유값이 $\epsilon$ 이상이 되어 분해가 안정적으로 성공한다. 이것은 문제를 조금 바꾸는 것이므로, 더한 값을 기록하고 결과가 jitter 크기에 민감하지 않은지 확인한다.'''

[[questions.choices]]
text = "대각에 작은 양수(jitter)를 더해 K + εI를 분해하고, 더한 값을 기록한다."
correct = true

[[questions.choices]]
text = "Cholesky 대신 np.linalg.inv(K)로 역행렬을 구해 쓴다."
feedback = "조건수가 1e16을 넘는 행렬의 역행렬은 반올림 오차가 지배해 의미 있는 값이 아니다. 오류 메시지가 사라질 뿐 문제는 그대로다."

[[questions.choices]]
text = "K는 이론적으로 양의 준정부호이므로 Cholesky 구현의 버그다. 다른 라이브러리로 바꾼다."
feedback = "이론적으로 준정부호여도 부동소수점에서 계산한 고유값은 음수가 될 수 있다. 어떤 라이브러리에서도 같은 일이 생긴다."

[[questions.choices]]
text = "float32로 바꿔 계산하면 작은 음수 고유값이 0으로 반올림되어 해결된다."
feedback = "정밀도를 낮추면 반올림 오차가 커져 음수 고유값이 더 자주, 더 크게 나타난다."

[[questions]]
id = "dense-memory"
type = "numeric"
objective = 2
prompt = '''$100 \times 100$ 격자 위의 2차원 Poisson 문제는 미지수가 $N = 10^4$개다. 이 $N \times N$ 행렬을 float64 dense 배열로 저장하면 몇 GB가 필요한가? ($1\,\text{GB} = 10^9$ 바이트)'''
answer = 0.8
tolerance = 0.05
explanation = '''원소 수는 $N^2 = 10^8$개이고, float64 원소 하나가 8바이트이므로 $8 \times 10^8$ 바이트 = 0.8 GB다. 0이 아닌 원소는 행마다 최대 5개라 약 $5 \times 10^4$개뿐이고, CSR로 저장하면 1 MB도 들지 않는다. 격자를 $1000 \times 1000$으로 키우면 dense 저장은 8 TB가 되어 불가능하지만 CSR은 약 60 MB다.'''

[[questions]]
id = "sparse-fill-in"
type = "single"
objective = 2
prompt = '''희소 행렬 $\mathbf{A}$(nnz 약 $5 \times 10^4$)를 희소 LU로 분해했더니 $\mathbf{L}$과 $\mathbf{U}$의 nnz 합이 $6 \times 10^5$을 넘었다. 이에 대한 설명으로 옳은 것은?'''
explanation = '''소거 과정에서 원래 0이던 자리에 새 값이 생기는 것을 fill-in이라 한다. 희소 행렬의 인수는 원래 행렬보다 훨씬 조밀해질 수 있고, 그 정도는 행·열의 순서에 크게 의존한다. 희소 직접법은 COLAMD, nested dissection 같은 재정렬로 fill-in을 줄인다. 2차원 Poisson에서는 재정렬로 인수의 nnz가 A의 40배에서 13배로 줄었다. 3차원 문제에서는 재정렬해도 fill-in이 빠르게 커져 반복법이 유리해진다.'''

[[questions.choices]]
text = "소거 중 0이던 자리가 채워지는 fill-in 때문이며, 행·열 재정렬로 크게 줄일 수 있다."
correct = true

[[questions.choices]]
text = "LU 구현의 버그다. 희소 행렬의 인수는 원래 행렬과 nnz가 같아야 한다."
feedback = "삼중대각 행렬처럼 특수한 경우를 빼면 인수의 nnz는 원래 행렬보다 크다. fill-in은 소거의 본질적인 성질이다."

[[questions.choices]]
text = "부동소수점 반올림 오차가 0이던 원소를 작은 수로 바꿔서 생긴 것이다."
feedback = "fill-in은 정확한 산술에서도 생긴다. 소거할 때 한 행의 배수를 다른 행에서 빼면, 앞 행의 0이 아닌 위치가 뒤 행으로 옮겨 온다."

[[questions.choices]]
text = "fill-in은 행렬의 순서와 무관하게 행렬 자체가 정한다."
feedback = "순서가 결정적이다. 같은 행렬도 재정렬에 따라 인수의 nnz가 몇 배씩 달라진다."
