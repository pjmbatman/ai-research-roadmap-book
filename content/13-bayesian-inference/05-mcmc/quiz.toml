# 13.5 근사 추론 I: MCMC — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "normalizing-constant-cancels"
type = "single"
objective = 1
prompt = '''사후분포 $p(\theta \mid \mathcal{D}) = \tilde p(\theta) / Z$에서 정규화 상수 $Z = p(\mathcal{D})$를 모르는데도 Metropolis–Hastings를 실행할 수 있는 이유는?'''
explanation = '''수용 확률은 두 점의 밀도 **비** $p(\theta') / p(\theta) = \tilde p(\theta') / \tilde p(\theta)$로만 정해지고, 비를 취하면 $Z$가 약분된다. 대칭 제안분포에서 약분되는 것은 제안분포 $q$이지 $Z$가 아니다. MH는 $Z$를 추정하지 않으며, $Z$(evidence)가 필요하면 별도의 방법이 필요하다.'''

[[questions.choices]]
text = '''수용 확률이 두 점의 밀도 비로만 정해지고, 비에서 $Z$가 약분되기 때문이다.'''
correct = true

[[questions.choices]]
text = "제안분포가 대칭이라 $Z$가 약분되기 때문이다."
feedback = "대칭 제안에서 약분되는 것은 $q(\\theta' \\mid \\theta)$와 $q(\\theta \\mid \\theta')$다. $Z$는 제안분포가 비대칭이어도 약분된다."

[[questions.choices]]
text = "워밍업(burn-in) 동안 체인이 $Z$를 추정하기 때문이다."
feedback = "워밍업은 시작점의 영향을 지우는 단계다. MH는 어느 단계에서도 $Z$를 추정하지 않는다."

[[questions.choices]]
text = "표본 수가 충분히 많으면 $Z$의 영향이 평균되어 사라지기 때문이다."
feedback = "$Z$는 상수라서 평균될 대상이 아니다. 알고리즘이 처음부터 비만 쓰므로 필요하지 않을 뿐이다."

[[questions]]
id = "hastings-correction"
type = "numeric"
objective = 1
prompt = '''현재 점 $\theta$와 제안된 점 $\theta'$에서 정규화되지 않은 사후밀도가 $\tilde p(\theta) = 8$, $\tilde p(\theta') = 2$다. 제안분포는 비대칭이어서 $q(\theta' \mid \theta) = 0.1$, $q(\theta \mid \theta') = 0.3$이다. Metropolis–Hastings의 수용 확률은?'''
answer = 0.75
tolerance = 0.01
slider = { min = 0, max = 1, step = 0.05 }
explanation = '''$\alpha = \min\!\Big(1, \dfrac{\tilde p(\theta')\, q(\theta \mid \theta')}{\tilde p(\theta)\, q(\theta' \mid \theta)}\Big) = \min\!\Big(1, \dfrac{2 \times 0.3}{8 \times 0.1}\Big) = 0.75$. 밀도 비만 보면 $0.25$지만, 되돌아오는 제안이 세 배 쉬우므로 Hastings 보정이 수용 확률을 세 배로 올린다. 보정을 빼면 체인이 $\theta'$ 쪽을 덜 방문해 정상분포가 사후분포와 달라진다.'''

[[questions]]
id = "acceptance-rate-misread"
type = "single"
objective = 2
prompt = '''강한 상관($\rho = 0.95$)을 가진 2차원 사후분포에 random-walk Metropolis를 돌렸다. 보폭 0.05에서 수용률 0.91, 보폭 0.5에서 0.43, 보폭 5에서 0.02였다. 가장 옳은 판단은?'''
explanation = '''수용률이 높다는 것은 대부분 아주 짧게 움직였다는 뜻일 수 있다. 보폭 0.05의 체인은 거의 모든 제안을 받아들였지만 5000번 반복 뒤에도 평균이 참값 0에서 1 이상 떨어져 있었다. 너무 큰 보폭은 거의 모든 제안을 거절해 제자리에 머문다. 고차원 random-walk Metropolis에서는 수용률 약 0.23이 최적이라는 이론 결과가 있고, 실제 판단은 ESS로 한다.'''

[[questions.choices]]
text = "수용률이 가장 높은 보폭 0.05가 가장 좋다. 버리는 계산이 없기 때문이다."
feedback = "작은 보폭은 거의 다 수용되지만 한 걸음이 짧아 분포를 가로지르는 데 오래 걸린다. 수용률이 아니라 ESS가 효율의 척도다."

[[questions.choices]]
text = "수용률은 효율의 척도가 아니다. 너무 높으면 걸음이 짧고 너무 낮으면 제자리에 머무르므로, 중간 보폭을 고르고 ESS로 확인한다."
correct = true

[[questions.choices]]
text = "보폭 5가 가장 좋다. 큰 걸음이 분포 전체를 가장 빨리 탐색한다."
feedback = "수용률 0.02면 체인이 98%의 반복에서 제자리에 있다. 큰 제안은 대부분 확률이 낮은 곳에 떨어진다."

[[questions]]
id = "gibbs-autocorrelation"
type = "numeric"
objective = 2
prompt = '''상관계수 $\rho = 0.9$인 2차원 표준 가우시안 $(x_1, x_2)$에서 Gibbs sampling으로 $x_1 \sim p(x_1 \mid x_2)$, $x_2 \sim p(x_2 \mid x_1)$를 번갈아 뽑는다. 정상상태에서 $x_1$ 체인의 1-시차 자기상관은? (소수로)'''
answer = 0.81
tolerance = 0.02
slider = { min = 0, max = 1, step = 0.01 }
explanation = '''$x_1^{(t+1)} = \rho x_2^{(t)} + \text{잡음}$이고 $x_2^{(t)} = \rho x_1^{(t)} + \text{잡음}$이므로 $x_1^{(t+1)} = \rho^2 x_1^{(t)} + \text{독립 잡음}$, 즉 계수 $\rho^2$인 AR(1) 과정이다. 1-시차 자기상관은 $\rho^2 = 0.81$이다. 상관이 0.99면 0.98이 되어 체인이 거의 움직이지 않는다. 좌표축 방향으로만 움직이는 Gibbs가 대각선 방향 능선에서 느린 이유다.'''

[[questions]]
id = "hmc-divergence"
type = "single"
objective = 2
prompt = '''HMC에서 leapfrog 보폭을 0.3에서 0.5로 올렸더니 수용률이 0.83에서 0으로 떨어지고 에너지 오차 $|\Delta H|$가 $10^{18}$ 규모로 커졌다. 가장 옳은 해석과 대응은?'''
explanation = '''leapfrog는 가장 좁은 방향의 곡률 $\omega_{\max}$에 대해 $\varepsilon\,\omega_{\max} < 2$일 때만 안정하다. 정밀도 행렬의 가장 큰 고윳값이 20이면 $\omega_{\max} = \sqrt{20} \approx 4.47$이라 한계는 약 0.447이다. 이를 넘으면 궤적이 발산(divergence)하고 모든 제안이 거절된다. 보폭을 줄이거나, 곡률이 고르도록 재매개변수화하거나 mass matrix를 맞춘다. 걸음 수를 늘리면 발산이 더 커질 뿐이다.'''

[[questions.choices]]
text = "보폭이 가장 좁은 방향의 안정 한계를 넘어 적분이 발산했다. 보폭을 줄이거나 곡률을 고르게 하는 재매개변수화를 한다."
correct = true

[[questions.choices]]
text = "궤적이 너무 짧아서다. 걸음 수 $L$을 늘린다."
feedback = "불안정한 보폭에서는 걸음마다 오차가 증폭된다. $L$을 늘리면 발산이 더 커진다."

[[questions.choices]]
text = "사후분포가 다봉이라는 신호다. 체인 수를 늘린다."
feedback = "이 목표는 가우시안(단봉)이다. 에너지 폭주는 적분기의 수치 불안정에서 온다."

[[questions.choices]]
text = "반복 수가 부족해서다. 더 오래 돌리면 수용률이 회복된다."
feedback = "보폭이 고정되어 있는 한 모든 궤적이 발산하므로 반복을 늘려도 체인은 제자리에 있다."

[[questions]]
id = "convergence-statements"
type = "multiple"
objective = 3
prompt = "MCMC 수렴 진단에 대해 옳은 것을 모두 고르시오."
explanation = '''R-hat은 체인 간 분산과 체인 내 분산을 비교하므로 흩어진 시작점의 여러 체인이 필요하고, 앞뒤 절반을 나누면(split) 한 체인 안의 추세도 잡는다. 자기상관이 크면 ESS는 표본 수보다 훨씬 작다. 진단 통과는 필요조건일 뿐이다. 모든 체인이 같은 봉우리에 갇히면 R-hat은 1이어도 다른 봉우리를 놓친다. divergence는 체인이 탐색하지 못한 영역이 있다는 신호이므로 R-hat이 좋아도 무시하지 않는다.'''

[[questions.choices]]
text = "흩어진 시작점에서 출발한 체인 여러 개의 R-hat이 1.01보다 크면 아직 수렴했다고 보지 않는다."
correct = true

[[questions.choices]]
text = "표본이 4000개여도 자기상관이 크면 ESS는 100보다 작을 수 있다."
correct = true

[[questions.choices]]
text = "R-hat이 1.00이면 사후분포를 모두 탐색했다는 것이 보장된다."
feedback = "모든 체인이 같은 봉우리에 갇혀도 R-hat은 1이 될 수 있다. 진단은 실패를 드러낼 뿐 성공을 증명하지 못한다."

[[questions.choices]]
text = "R-hat과 ESS가 기준을 넘으면 HMC의 divergence 경고는 무시해도 된다."
feedback = "divergence는 곡률이 급한 영역을 체인이 들어가지 못했다는 뜻이고, 이때 사후 요약은 편향될 수 있다. R-hat은 이 편향을 보지 못한다."

[[questions]]
id = "mcse-from-ess"
type = "numeric"
objective = 3
prompt = '''한 파라미터의 사후 표준편차가 2.0이고, 표본 4000개의 ESS가 100이다. 사후 평균 추정치의 Monte Carlo 표준오차(MCSE)는?'''
answer = 0.2
tolerance = 0.005
explanation = '''MCSE $\approx \text{sd} / \sqrt{\text{ESS}} = 2.0 / \sqrt{100} = 0.2$. 표본 수 4000을 그대로 쓰면 $2/\sqrt{4000} \approx 0.032$로, 실제 오차를 6배 넘게 과소평가한다. 사후 평균을 소수 둘째 자리까지 보고하려면 ESS가 훨씬 커야 한다.'''
