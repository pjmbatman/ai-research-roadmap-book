# 13.6 근사 추론 II: 변분추론과 Laplace 근사 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "elbo-gap"
type = "single"
objective = 1
prompt = '''변분분포 $q(\theta)$에 대해 $\log p(\mathcal{D}) - \mathrm{ELBO}(q)$는 무엇과 같은가?'''
explanation = '''$\log p(\mathcal{D}) = \mathrm{ELBO}(q) + \mathrm{KL}\big(q(\theta) \,\|\, p(\theta \mid \mathcal{D})\big)$이므로 차이는 $q$에서 사후분포로의 KL, 즉 reverse KL이다. KL은 0 이상이라 ELBO는 항상 $\log p(\mathcal{D})$ 이하이고, ELBO 최대화는 이 KL 최소화와 같다. 기대값이 $q$에 대해 취해지므로 방향이 $q \| p$다.'''

[[questions.choices]]
text = '''$\mathrm{KL}\big(q(\theta) \,\|\, p(\theta \mid \mathcal{D})\big)$'''
correct = true

[[questions.choices]]
text = '''$\mathrm{KL}\big(p(\theta \mid \mathcal{D}) \,\|\, q(\theta)\big)$'''
feedback = "ELBO의 기대값은 $q$에 대해 취해진다. 사후분포에 대한 기대값은 계산할 수 없다는 것이 애초에 문제였다."

[[questions.choices]]
text = '''$q$의 엔트로피 $\mathbb{H}[q]$'''
feedback = "엔트로피는 ELBO를 이루는 한 항이지 ELBO와 evidence의 차이가 아니다."

[[questions.choices]]
text = "0이다. ELBO는 log evidence의 다른 이름이다."
feedback = "$q$가 사후분포와 정확히 같을 때만 0이다. 일반적으로 ELBO는 하한(lower bound)이다."

[[questions]]
id = "elbo-numeric"
type = "numeric"
objective = 1
prompt = '''어떤 모델의 $\log p(\mathcal{D}) = -420.1$이고, 변분분포 $q$와 참 사후분포 사이의 $\mathrm{KL}(q \,\|\, p(\theta \mid \mathcal{D})) = 3.1$이다. 이 $q$의 ELBO는?'''
answer = -423.2
tolerance = 0.05
explanation = '''$\mathrm{ELBO} = \log p(\mathcal{D}) - \mathrm{KL} = -420.1 - 3.1 = -423.2$. 본문 첫 코드에서 $q = \mathcal{N}(1.45, 0.1^2)$의 값과 같다. ELBO가 log evidence보다 클 수는 없다.'''

[[questions]]
id = "reparameterization-purpose"
type = "single"
objective = 2
prompt = '''변분 파라미터 $(m, s)$에 대한 $\nabla \mathbb{E}_{q_{m,s}}[\log p(\mathcal{D}, \theta)]$를 추정할 때 재매개변수화 $\theta = m + s\,\varepsilon$, $\varepsilon \sim \mathcal{N}(0, 1)$을 쓰는 이유는?'''
explanation = '''기대값을 취하는 분포 자체가 $(m, s)$에 의존하므로 표본 $\theta \sim q_{m,s}$를 그대로 미분할 수 없다. $\theta$를 파라미터와 무관한 잡음 $\varepsilon$의 결정론적 함수로 쓰면 기대값이 $\varepsilon$에 대한 것으로 바뀌어, gradient를 기대값 안으로 넣고 $\nabla_\theta \log p$로 계산할 수 있다. 이 추정량은 보통 score-function 추정량보다 분산이 작다. 편향을 없애거나 mini-batch를 가능하게 하는 것은 재매개변수화의 역할이 아니다.'''

[[questions.choices]]
text = "기대값의 분포가 변분 파라미터에 의존해서 직접 미분할 수 없으므로, 잡음을 바깥으로 빼 gradient를 기대값 안으로 넣기 위해서다."
correct = true

[[questions.choices]]
text = "Monte Carlo 추정의 편향을 없애기 위해서다."
feedback = "단순 Monte Carlo 평균도 ELBO의 비편향 추정량이다. 재매개변수화는 gradient 추정을 가능하게 하고 분산을 줄인다."

[[questions.choices]]
text = "데이터를 mini-batch로 나누기 위해서다."
feedback = "mini-batch는 데이터 합을 부분합으로 추정하는 별개의 기법이다. 재매개변수화는 $\\theta$ 표본에 대한 것이다."

[[questions.choices]]
text = "변분분포를 가우시안이 아닌 분포로 바꾸기 위해서다."
feedback = "재매개변수화는 분포족을 바꾸지 않는다. 같은 $q$에서 뽑는 방법을 미분 가능한 형태로 다시 쓸 뿐이다."

[[questions]]
id = "reverse-kl-bimodal"
type = "single"
objective = 2
prompt = '''사후분포가 $-2$와 $+2$ 근처에 같은 크기의 봉우리 두 개를 가진다. 가우시안 하나 $q = \mathcal{N}(m, s^2)$로 $\mathrm{KL}(q \,\|\, p)$를 최소화하면 대체로 어떤 결과가 나오는가?'''
explanation = '''reverse KL $\mathbb{E}_q[\log q - \log p]$는 $p$가 거의 0인 곳에 $q$가 질량을 두면 크게 벌한다. 두 봉우리 사이는 $p$가 작으므로 $q$는 한 봉우리 안에 들어가 그 봉우리의 폭에 맞춘다(mode-seeking). 어느 봉우리를 고르는지는 초기값에 달려 있다. 두 봉우리를 덮는 넓은 가우시안은 forward KL $\mathrm{KL}(p \| q)$의 해(mass-covering)다.'''

[[questions.choices]]
text = "한 봉우리에 붙은 좁은 가우시안. 다른 봉우리는 무시된다."
correct = true

[[questions.choices]]
text = "두 봉우리를 모두 덮는 평균 0의 넓은 가우시안"
feedback = "그것은 forward KL $\\mathrm{KL}(p \\| q)$를 최소화한 결과다. reverse KL은 $p$가 작은 두 봉우리 사이에 $q$의 질량을 두는 것을 크게 벌한다."

[[questions.choices]]
text = "평균 0의 아주 좁은 가우시안"
feedback = "$m = 0$은 $p$가 거의 0인 곳이라 $\\log p$가 매우 작아 reverse KL이 크다. 최적해가 될 수 없다."

[[questions]]
id = "mean-field-sd"
type = "numeric"
objective = 2
prompt = '''참 사후분포가 각 성분의 분산 1, 상관계수 $\rho = 0.8$인 2차원 가우시안이다. 독립 가우시안 곱(mean-field) $q(\theta_1)q(\theta_2)$로 $\mathrm{KL}(q \,\|\, p)$를 최소화하면 각 성분의 표준편차는?'''
answer = 0.6
tolerance = 0.01
slider = { min = 0, max = 1.2, step = 0.05 }
explanation = '''가우시안 사후분포에 대한 mean-field reverse-KL의 해는 평균은 정확하고, 각 성분의 분산이 정밀도 행렬 대각 원소의 역수 $1/\Lambda_{ii}$다. 2차원에서는 $1 - \rho^2 = 0.36$이므로 표준편차 0.6이다. 참 주변 표준편차 1보다 작다. 즉 mean-field VI는 상관이 클수록 불확실성을 더 크게 과소평가한다.'''

[[questions]]
id = "laplace-sd"
type = "numeric"
objective = 3
prompt = '''로그 사후밀도의 최빈값 $\hat\theta$에서 2차 도함수가 $\frac{d^2}{d\theta^2}\log p(\theta \mid \mathcal{D})\big|_{\hat\theta} = -400$이다. Laplace 근사로 얻은 사후 표준편차는?'''
answer = 0.05
tolerance = 0.001
explanation = '''Laplace 근사는 $\mathcal{N}(\hat\theta, H^{-1})$이고 $H = -\frac{d^2}{d\theta^2}\log p = 400$이다. 표준편차는 $1/\sqrt{400} = 0.05$다. 2차 도함수의 부호를 바꾸지 않거나 역수의 제곱근을 빼먹는 실수가 흔하다.'''

[[questions]]
id = "laplace-when-poor"
type = "multiple"
objective = 3
prompt = "Laplace 근사가 나쁜 근사가 되기 쉬운 경우를 모두 고르시오."
explanation = '''Laplace 근사는 최빈값 한 점의 곡률만 보므로, 사후분포가 비대칭이거나(계수가 작은 Poisson rate, 0 근처의 분산 파라미터) 여러 봉우리를 가지면 틀린다. 양수 제약이 있는 파라미터를 원래 척도에서 근사하면 음수에 질량을 둔다. 반대로 데이터가 많고 모델이 정칙이면 사후분포가 가우시안에 가까워져(Bernstein–von Mises) Laplace 근사가 정확해진다.'''

[[questions.choices]]
text = "관측 사건 수가 몇 개뿐인 Poisson rate를 rate 자체의 척도에서 근사할 때"
correct = true

[[questions.choices]]
text = "사후분포에 봉우리가 여러 개일 때"
correct = true

[[questions.choices]]
text = "관측이 수천 개이고 파라미터가 잘 식별되는 로지스틱 회귀"
feedback = "데이터가 많고 모델이 정칙이면 사후분포가 가우시안에 가까워져 Laplace 근사가 잘 맞는다."

[[questions.choices]]
text = "사후분포가 정확히 가우시안일 때"
feedback = "가우시안이면 로그 밀도가 정확히 2차식이라 Laplace 근사는 정확하다."
