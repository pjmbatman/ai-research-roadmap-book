# 13.8 베이지안 워크플로 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "vague-prior-predictive"
type = "single"
objective = 1
prompt = '''평판 한 장의 평균 집락 수 $\lambda$에 대해 $\log\lambda \sim \mathcal{N}(0, 10^2)$이라는 "정보가 없는" 사전분포를 두었다. 사전 예측 점검을 하면 무엇을 보게 되고, 어떻게 해석해야 하는가?'''
explanation = '''$\log\lambda$의 표준편차 10은 $\lambda$ 척도에서 $e^{\pm 20}$, 즉 $10^{-9}$부터 $10^{9}$까지를 그럴듯하다고 보는 주장이다. 본문 시뮬레이션에서 사전 표본의 절반이 평판당 1개 미만, 24%가 1000개 초과였다. "넓은" 사전분포는 정보가 없는 것이 아니라 비현실적인 값에 대부분의 확률을 주는 강한 주장이다. 데이터가 많으면 사후분포에 큰 영향이 없을 수 있지만, 데이터가 적거나 계층 모델의 분산 파라미터처럼 데이터가 약하게 정하는 파라미터에서는 결과를 왜곡하고 샘플러를 어렵게 만든다.'''

[[questions.choices]]
text = "평판당 1개 미만이나 수천 개 이상 같은 비현실적인 집락 수가 대부분이다. 이 사전분포는 무정보가 아니라 비현실적인 값에 확률을 몰아주는 주장이므로, 도메인 지식으로 범위를 좁힌다."
correct = true

[[questions.choices]]
text = "집락 수가 고르게 퍼져 나온다. 무정보 사전분포이므로 그대로 쓰는 것이 가장 객관적이다."
feedback = "로그 척도의 넓은 정규분포는 원래 척도에서 고르지 않다. 극단적인 값에 대부분의 확률을 준다."

[[questions.choices]]
text = "사전 예측 점검은 데이터를 보기 전 단계라 결과를 해석할 필요가 없다. 사후분포만 점검하면 된다."
feedback = "사전 예측 점검의 목적이 바로 데이터를 보기 전에 모델이 어떤 데이터를 그럴듯하다고 보는지 확인하는 것이다."

[[questions]]
id = "ppc-overdispersion"
type = "single"
objective = 1
prompt = '''집락 수 40개에 Poisson 모델을 적합하고 사후 예측 점검을 했다. 검정 통계량 "분산/평균"의 관측값은 3.72인데, 복제 데이터의 90% 범위는 [0.64, 1.37]이고 사후 예측 p-value는 0.000이었다. 같은 점검에서 "평균"의 p-value는 0.50이었다. 가장 옳은 결론은?'''
explanation = '''Poisson 모델은 분산이 평균과 같다고 가정하므로 분산/평균이 1 근처인 데이터만 만들어 낸다. 관측 데이터는 그보다 훨씬 퍼져 있다(과분산). 평균은 모델이 직접 맞추는 양이라 거의 항상 통과하므로 이 결함을 드러내지 못한다. 대응은 분산을 따로 가지는 모델(음이항, 평판별 무작위 효과)로 확장하는 것이다. 사후 예측 p-value는 가설 검정의 p-value처럼 "모델이 참일 확률"이 아니라, 모델이 데이터의 특정 측면을 재현하는지에 대한 진단이다.'''

[[questions.choices]]
text = "모델이 데이터의 과분산을 재현하지 못한다. 평균 점검은 모델이 직접 맞춘 양이라 통과한 것이니, 분산을 따로 가지는 모델로 확장한다."
correct = true

[[questions.choices]]
text = "평균의 p-value가 0.5이므로 모델은 적절하다. 분산/평균은 부차적인 통계량이다."
feedback = "모델이 직접 맞추는 통계량(평균)은 거의 항상 통과한다. 점검에는 모델이 직접 맞추지 않는 측면을 고른다."

[[questions.choices]]
text = "MCMC 표본이 부족해서 생긴 결과다. 표본 수를 늘리면 p-value가 커진다."
feedback = "복제 데이터의 분산/평균이 0.64–1.37에 몰려 있는 것은 Poisson 가정의 구조적 결과다. 표본을 늘려도 이 범위는 3.72에 닿지 않는다."

[[questions.choices]]
text = "p < 0.05이므로 Poisson 모델이 참일 확률은 5% 미만이다."
feedback = "사후 예측 p-value는 모델이 참일 확률이 아니다. 특정 통계량에서 관측 데이터가 모델의 복제 데이터와 얼마나 다른지를 나타낸다."

[[questions]]
id = "sbc-u-shape"
type = "single"
objective = 1
prompt = '''사후 표본을 만드는 코드를 SBC로 점검했더니 참값의 순위 히스토그램이 양 끝 칸에 몰린 U자 모양이었다. 가장 그럴듯한 원인은?'''
explanation = '''참값이 사후 표본보다 작거나 큰 경우가 너무 자주 나온다는 것은 사후분포가 참값을 덮기에 너무 좁다는 뜻이다(과신, 분산 과소평가). 본문에서 분산을 1/4로 줄인 사후분포가 정확히 이 모양을 만들었다. 사후분포가 너무 넓으면 순위가 가운데로 몰리는 ∩ 모양, 평균이 한쪽으로 치우치면 한쪽 끝으로 몰리는 비대칭 모양이 된다.'''

[[questions.choices]]
text = "사후분포가 너무 좁다(불확실성을 과소평가한다)."
correct = true

[[questions.choices]]
text = "사후분포가 너무 넓다(불확실성을 과대평가한다)."
feedback = "사후분포가 너무 넓으면 참값이 대부분 표본의 가운데에 놓여 순위가 가운데로 몰린다(∩ 모양)."

[[questions.choices]]
text = "사후 평균이 위쪽으로 치우쳤다."
feedback = "한 방향의 편향은 순위를 한쪽 끝으로만 몰리게 해 비대칭 히스토그램을 만든다. 양 끝이 모두 높으면 폭의 문제다."

[[questions.choices]]
text = "추론은 정확하고, 시뮬레이션 횟수가 부족해서 생긴 잡음이다."
feedback = "시뮬레이션 잡음은 특정 모양 없이 흩어진다. 양 끝 칸이 체계적으로 높다면 균일성 검정으로 확인해 볼 만한 구조다."

[[questions]]
id = "sbc-rank-bin"
type = "numeric"
objective = 1
prompt = '''SBC에서 시뮬레이션마다 사후 표본 $L = 99$개를 뽑아 참값의 순위(0–99)를 기록한다. 추론이 정확하다면, 1000번의 시뮬레이션 중 순위가 0–9인 경우는 평균 몇 번인가?'''
answer = 100
tolerance = 0
slider = { min = 0, max = 300, step = 10, unit = "번" }
explanation = '''추론이 정확하면 참값과 사후 표본 99개는 같은 분포에서 나온 100개의 교환 가능한 값이므로, 참값의 순위는 0–99에서 균일하다. 0–9의 10개 순위에 들어갈 확률은 10/100이고, 1000번 중 평균 100번이다. 본문의 올바른 사후분포에서 이 칸의 개수는 91이었다.'''

[[questions]]
id = "elpd-difference"
type = "numeric"
objective = 1
prompt = '''두 모델의 LOO 기대 로그 예측 밀도가 $\mathrm{elpd}_A = -179.8$, $\mathrm{elpd}_B = -150.8$이다. 점별 차이로 계산한 차이의 표준오차는 10.0이다. 차이 $\mathrm{elpd}_B - \mathrm{elpd}_A$는?'''
answer = 29.0
tolerance = 0.05
explanation = '''$-150.8 - (-179.8) = 29.0$. elpd는 클수록 좋으므로 모델 B의 예측 성능이 더 낫고, 차이가 표준오차의 약 3배다. 차이의 표준오차는 각 모델의 표준오차에서 따로 구하지 않고, 점별 차이 $d_i$의 표준편차 $\times\sqrt{N}$으로 구한다. 같은 데이터 위의 두 모델은 점별 성능이 강하게 상관되어 있기 때문이다(12.5장의 짝지은 비교와 같은 논리).'''

[[questions]]
id = "comparison-statements"
type = "multiple"
objective = 1
prompt = "모델 비교에 대해 옳은 것을 모두 고르시오."
explanation = '''LOO-CV와 WAIC는 새 데이터에 대한 예측 성능을 추정하고, 데이터가 충분하면 둘이 비슷한 값을 준다. Bayes factor는 두 모델의 evidence 비로, 파라미터 사전분포의 폭에 민감해서 사후분포가 거의 같아도 사전분포를 넓히는 것만으로 크게 바뀔 수 있다. elpd 차이가 표준오차보다 작으면 데이터가 두 모델을 구별하지 못한다는 뜻이지, 단순한 모델이 참이라는 증거는 아니다.'''

[[questions.choices]]
text = "LOO-CV는 각 관측을 뺀 사후분포로 그 관측을 예측하는 성능을 잰다."
correct = true

[[questions.choices]]
text = "Bayes factor는 파라미터 사전분포의 폭을 넓히기만 해도 크게 바뀔 수 있다."
correct = true

[[questions.choices]]
text = "elpd 차이가 표준오차보다 작으면 더 단순한 모델이 참이라는 증거다."
feedback = "차이가 작다는 것은 이 데이터로 두 모델의 예측 성능을 구별할 수 없다는 뜻이다. 어느 모델이 참인지에 대한 증거가 아니다."

[[questions.choices]]
text = "사후분포가 거의 같으면 Bayes factor도 1에 가깝다."
feedback = "Bayes factor는 사후분포가 아니라 evidence(사전분포에 대한 우도의 평균)의 비라, 사후분포가 같아도 사전분포의 폭에 따라 크게 달라진다."
