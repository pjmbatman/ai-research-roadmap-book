# 12.5 모델 비교의 통계 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "sd-vs-se"
type = "single"
objective = 1
prompt = '''같은 설정으로 seed만 바꿔 10번 학습했더니 RMSE의 평균이 0.411, 표준편차가 0.011이었다. 표에 "0.411 ± 0.011"이라고 쓸 때 0.011이 말하는 것은?'''
explanation = '''표준편차는 **실행 하나**의 결과가 seed에 따라 얼마나 흩어지는지, 즉 누군가 이 방법을 한 번 돌렸을 때 기대할 수 있는 변동이다. 평균 0.411의 불확실성은 표준오차 $0.011/\sqrt{10} \approx 0.0035$로 3배 이상 작다. 둘 다 유용한 숫자지만 뜻이 다르므로 어느 것인지 표에 밝혀야 한다. 그리고 둘 다 seed에 따른 변동만 반영한다. 데이터 분할이나 데이터셋 자체의 변동은 따로 따져야 한다.'''

[[questions.choices]]
text = "실행 하나의 결과가 seed에 따라 흩어지는 정도(표준편차)다. 평균의 불확실성은 이보다 작다."
correct = true

[[questions.choices]]
text = "참 RMSE가 0.400과 0.422 사이에 있을 확률이 95%라는 뜻이다."
feedback = "표준편차 하나를 더하고 뺀 범위는 신뢰구간이 아니다. 신뢰구간은 표준오차와 t 분위수로 만들고, 그 해석도 '확률이 95%'가 아니다(12.4장)."

[[questions.choices]]
text = "평균 0.411의 표준오차다."
feedback = "표준오차는 표준편차를 √n으로 나눈 값, 여기서는 약 0.0035다. 둘을 혼동하면 정밀도를 3배 넘게 잘못 전달한다."

[[questions]]
id = "se-from-sd"
type = "numeric"
objective = 1
prompt = '''seed 9개로 얻은 점수의 표본 표준편차가 0.012다. 평균 점수의 표준오차는?'''
answer = 0.004
tolerance = 0.0002
explanation = '''표준오차는 $\mathrm{sd}/\sqrt{n} = 0.012/\sqrt{9} = 0.012/3 = 0.004$다. $n$으로 나누어 0.0013을 얻거나, $n-1$로 나누는 표본 표준편차의 공식과 혼동하는 실수가 흔하다.'''

[[questions]]
id = "single-seed-claim"
type = "single"
objective = 1
prompt = '''한 번의 분할과 seed 하나로 A의 RMSE 0.4265, B의 RMSE 0.3849를 얻었다. 같은 실험에서 seed만 바꿀 때 A의 RMSE 표준편차는 약 0.011, 분할만 바꿀 때는 약 0.067이다. 이 결과로 할 수 있는 말은?'''
explanation = '''차이 0.042는 seed 변동(0.011)보다 크지만 분할 변동(0.067)보다 작다. 단일 실행으로는 그 차이가 방법의 차이인지, 그 분할과 seed에서의 운인지 구별할 수 없다. 이 장의 실험에서 같은 두 방법의 평균 차이는 0.009였고, 100개 (분할, seed) 조합 중 22%에서는 A가 이겼다. 여러 seed와 분할에서 **짝지은** 차이를 보아야 한다.'''

[[questions.choices]]
text = "차이 0.042가 seed 표준편차 0.011의 약 4배이므로 B가 확실히 낫다."
feedback = "seed 변동만 보고 분할 변동을 빠뜨렸다. 분할에 따른 변동(0.067)은 차이보다 크다."

[[questions.choices]]
text = "단일 실행으로는 차이가 방법 때문인지 이 분할과 seed 때문인지 구별할 수 없다. 여러 seed·분할에서 짝지은 차이를 봐야 한다."
correct = true

[[questions.choices]]
text = "분할 변동이 차이보다 크므로 두 방법은 같은 성능이다."
feedback = "변동이 크다는 것은 이 실험만으로는 판단할 수 없다는 뜻이지, 차이가 없다는 증거가 아니다. 짝지은 비교는 분할에 공통인 변동을 상쇄해 작은 차이도 드러낼 수 있다."

[[questions]]
id = "why-pairing"
type = "single"
objective = 2
prompt = '''같은 테스트 샘플에서 두 모델의 샘플별 오차 $e_A$, $e_B$를 얻었다. 평균 차이의 불확실성을 계산할 때 짝지은 차이 $d_i = e_{B,i} - e_{A,i}$를 쓰면 표준오차가 크게 줄어드는 이유는?'''
explanation = '''$\operatorname{Var}(e_B - e_A) = \operatorname{Var}(e_B) + \operatorname{Var}(e_A) - 2\operatorname{Cov}(e_A, e_B)$다. 어려운 샘플에서는 두 모델이 함께 크게 틀리므로 공분산이 양수이고, 차이를 먼저 계산하면 이 공통 변동이 상쇄된다. 이 장의 예에서 두 모델 오차의 상관은 0.76이었고 표준오차가 절반으로 줄었다. 상관이 0에 가까우면 짝을 지어도 이득이 거의 없다.'''

[[questions.choices]]
text = "두 모델의 오차가 양의 상관을 가지므로, 차이에서 공통 변동이 상쇄된다."
correct = true

[[questions.choices]]
text = "짝지은 비교는 샘플 수를 두 배로 늘리는 효과가 있다."
feedback = "짝을 지으면 차이 값은 오히려 n개(두 모델 합 2n개가 아니라)다. 이득은 개수가 아니라 상관에서 온다."

[[questions.choices]]
text = "짝지은 비교는 언제나 같은 결과를 주지만 계산이 빠르다."
feedback = "짝을 짓는지에 따라 표준오차가 달라지므로 결론도 달라질 수 있다. 이득의 크기는 두 모델 오차의 상관에 달려 있다."

[[questions]]
id = "repeated-cv-se"
type = "single"
objective = 2
prompt = '''한 데이터셋에서 10-fold 교차검증을 10번 반복해 점수 100개를 얻고, 표준오차를 $\mathrm{sd}/\sqrt{100}$으로 계산했다. 이 계산의 문제는?'''
explanation = '''점수 100개는 모두 같은 데이터셋에서 나왔고, fold의 학습 데이터는 크게 겹친다. 점수들은 독립이 아니므로 $\sqrt{100}$으로 나눌 근거가 없다. 반복 횟수를 늘리면 이 "표준오차"는 얼마든지 작아지지만, 데이터셋이 하나라는 사실에서 오는 불확실성은 줄지 않는다. 이 장의 시뮬레이션에서 반복을 16번으로 늘리자 순진한 SE는 0.008까지 줄었지만 CV 추정값의 실제 표준편차는 약 0.043 그대로였다.'''

[[questions.choices]]
text = "점수들이 같은 데이터에서 나와 서로 상관되어 있으므로, 표준오차를 크게 과소평가한다."
correct = true

[[questions.choices]]
text = "반복을 늘릴수록 정확해지므로 문제없다. 100번 반복하면 더 좋다."
feedback = "반복은 분할 방식에 따른 변동만 평균한다. 데이터셋 자체에서 오는 불확실성은 그대로이므로 반복 횟수로 나누면 안 된다."

[[questions.choices]]
text = "10-fold 대신 5-fold를 쓰면 점수들이 독립이 된다."
feedback = "fold 수를 바꿔도 학습 데이터는 겹치고 점수는 같은 데이터셋에서 나온다. 독립이 되지 않는다."

[[questions]]
id = "critical-difference"
type = "numeric"
objective = 2
prompt = '''방법 3개를 데이터셋 12개에서 비교한다. Nemenyi 검정의 critical difference $\mathrm{CD} = q_\alpha\sqrt{k(k+1)/(6N)}$를 $q_{0.05} = 2.343$으로 계산하면? (소수 둘째 자리까지)'''
answer = 0.96
tolerance = 0.01
explanation = '''$k = 3$, $N = 12$이므로 $\sqrt{3 \cdot 4 / 72} = \sqrt{1/6} \approx 0.408$이고, $\mathrm{CD} = 2.343 \times 0.408 \approx 0.96$이다. 두 방법의 평균 순위 차이가 0.96보다 커야 유의하다. 이 장의 예에서 A와 B의 평균 순위 차이는 0.25로 CD보다 작고, B와 C의 차이는 1.00으로 CD보다 크다.'''

[[questions]]
id = "five-seed-sign-test"
type = "numeric"
objective = 2
prompt = '''두 방법을 seed 5개로 비교했더니 5번 모두 B가 이겼다. 두 방법이 같다면 각 seed에서 누가 이길지는 동전 던지기와 같다. 양측 부호 검정(sign test)의 p-value는? (소수 넷째 자리까지)'''
answer = 0.0625
tolerance = 0.001
explanation = '''5번 모두 B가 이길 확률은 $(1/2)^5 = 1/32$이고, 양측이므로 5번 모두 A가 이기는 경우도 더해 $2/32 = 0.0625$다. "5전 5승"은 강해 보이지만 seed 5개로는 양측 0.05 기준을 넘을 수 없다. seed 수가 적으면 승패만 세지 말고 차이의 크기와 구간을 함께 보고, 가능하면 데이터 단위(셀·샘플)의 짝지은 비교를 더한다.'''
