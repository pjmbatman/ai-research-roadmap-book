# 12.4 구간 추정·가설 검정·부트스트랩 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "ci-meaning"
type = "single"
objective = 1
prompt = '''한 실험에서 평균 감쇠비의 95% 신뢰구간이 [0.105, 0.119]로 나왔다. 빈도주의 신뢰구간의 해석으로 옳은 것은?'''
explanation = '''빈도주의에서 참값은 고정된 미지량이고 무작위인 것은 구간이다. "95%"는 이 구간을 만드는 **절차**가 반복 실험에서 참값을 덮는 비율이다. 이미 계산된 구간 [0.105, 0.119]는 참값을 덮거나 덮지 않거나 둘 중 하나이고, 그 확률을 말하려면 사전분포를 둔 베이지안 credible interval이 필요하다. 또 신뢰구간은 평균에 대한 구간이지 개별 측정값의 95%가 들어가는 범위(예측 구간)가 아니다.'''

[[questions.choices]]
text = "같은 방법으로 실험과 구간 계산을 반복하면, 그렇게 만든 구간의 약 95%가 참 평균을 포함한다."
correct = true

[[questions.choices]]
text = "참 평균이 [0.105, 0.119] 안에 있을 확률이 95%다."
feedback = "빈도주의에서 참 평균은 확률변수가 아니다. 이 문장은 사전분포를 두고 얻은 베이지안 credible interval의 해석이다."

[[questions.choices]]
text = "개별 측정값의 95%가 [0.105, 0.119] 안에 들어간다."
feedback = "그것은 예측 구간의 해석이다. 평균의 신뢰구간은 데이터가 늘수록 좁아지지만, 개별 측정값의 퍼짐은 줄지 않는다(12.3장)."

[[questions]]
id = "p-value-meaning"
type = "single"
objective = 1
prompt = '''새 촉매와 기존 촉매의 수율을 비교한 검정에서 p = 0.03이 나왔다. p-value의 정의에 맞는 설명은?'''
explanation = '''p-value는 **귀무가설이 참이라고 가정했을 때**, 관측된 것만큼 또는 그보다 극단적인 검정통계량이 나올 확률이다. 귀무가설이 참일 확률이 아니고, 효과의 크기나 재현 가능성을 직접 말하지도 않는다. 귀무가설이 참일 확률을 말하려면 사전확률이 필요하다.'''

[[questions.choices]]
text = "귀무가설(두 촉매의 평균 수율이 같다)이 참일 확률이 3%다."
feedback = "p-value는 귀무가설이 참이라는 가정 아래에서 계산한 데이터의 확률이다. 가설의 확률로 뒤집으려면 사전확률과 Bayes 정리가 필요하다."

[[questions.choices]]
text = "두 촉매의 평균 수율이 같다면, 지금 관측된 차이만큼 또는 그보다 큰 차이가 나올 확률이 3%다."
correct = true

[[questions.choices]]
text = "같은 실험을 반복하면 97%의 확률로 다시 유의한 결과가 나온다."
feedback = "재현 확률은 참 효과 크기와 검정력에 달려 있다. p = 0.03인 결과의 재현 확률은 97%보다 훨씬 낮을 수 있다."

[[questions]]
id = "significance-vs-importance"
type = "multiple"
objective = 1
prompt = '''그룹당 10만 개 샘플로 두 공정을 비교했더니 평균 차이 0.024, 95% 신뢰구간 [0.015, 0.033], p = 1e-7, Cohen's d = 0.02였다. 옳은 것을 모두 고르시오.'''
explanation = '''표본이 매우 크면 아주 작은 차이도 통계적으로 유의해진다. p-value가 작다는 것은 차이가 0이 아니라는 증거일 뿐이고, 차이가 중요하다는 뜻이 아니다. Cohen's d = 0.02는 차이가 측정값 퍼짐의 2% 수준이라는 뜻이다. 실질적으로 중요한지는 도메인 기준(공정 허용오차 등)과 신뢰구간을 비교해 판단한다.'''

[[questions.choices]]
text = "차이가 0이 아니라는 증거는 강하다."
correct = true

[[questions.choices]]
text = "차이의 크기는 측정값의 퍼짐에 비해 매우 작다."
correct = true

[[questions.choices]]
text = "p-value가 매우 작으므로 실질적으로도 중요한 차이다."
feedback = "p-value는 표본 크기에 따라 작아진다. 실질적 중요성은 효과 크기와 도메인 기준으로 판단한다."

[[questions.choices]]
text = "신뢰구간이 0을 포함하지 않으므로 효과 크기는 계산할 필요가 없다."
feedback = "신뢰구간이 0을 제외하는 것은 유의성과 같은 정보다. 크기가 의미 있는지는 구간의 위치를 도메인 기준과 비교해야 알 수 있다."

[[questions]]
id = "bootstrap-unit"
type = "single"
objective = 2
prompt = '''배터리 셀 20개에서 각각 50 사이클을 측정해 시험 샘플 1000개로 두 모델의 평균 오차 차이를 비교한다. 결론을 "새로운 셀"에 일반화하려 한다. 부트스트랩에서 무엇을 재표본화해야 하는가?'''
explanation = '''부트스트랩은 "데이터가 모집단에서 뽑힌 방식"을 흉내 내야 한다. 새 셀에 일반화하려면 독립적으로 뽑힌 단위는 셀이다. 같은 셀의 사이클들은 서로 상관되어 있으므로 샘플 단위로 재표본화하면 정보량을 20개가 아니라 1000개로 착각해 구간이 지나치게 좁아진다. 이 장의 실습에서 샘플 단위 짝지은 부트스트랩의 포함 확률은 0.34에 불과했다.'''

[[questions.choices]]
text = "샘플 1000개를 복원추출한다. 샘플이 많을수록 구간이 정확해진다."
feedback = "같은 셀의 샘플은 독립이 아니다. 독립 정보의 단위는 셀이고, 샘플 단위 재표본화는 구간을 지나치게 좁힌다."

[[questions.choices]]
text = "셀 20개를 복원추출하고, 뽑힌 셀의 모든 샘플을 함께 쓴다."
correct = true

[[questions.choices]]
text = "부트스트랩은 분포 가정이 없으므로 무엇을 재표본화하든 결과가 같다."
feedback = "부트스트랩은 분포 모양을 가정하지 않을 뿐, 독립 단위에 대한 가정은 그대로 한다. 재표본화 단위가 그 가정이다."

[[questions]]
id = "fwer-ten-tests"
type = "numeric"
objective = 3
prompt = '''서로 독립인 가설 검정 10개를 각각 유의수준 0.05로 수행한다. 모든 귀무가설이 참일 때, 적어도 하나가 "유의"하게 나올 확률은 몇 %인가? (정수로 답한다.)'''
answer = 40
tolerance = 1
slider = { min = 0, max = 100, step = 1, unit = "%" }
explanation = '''검정 하나가 유의하지 않을 확률은 0.95이고, 10개가 모두 유의하지 않을 확률은 $0.95^{10} \approx 0.599$다. 따라서 적어도 하나가 유의할 확률은 $1 - 0.599 \approx 0.401$, 약 40%다. 이것이 가족별 오류율(FWER)이다. Bonferroni 보정은 각 검정의 유의수준을 $0.05/10$으로 낮춰 이 확률을 0.05 이하로 묶는다.'''

[[questions]]
id = "bh-controls-fdr"
type = "single"
objective = 3
prompt = '''유전자 100개의 발현 차이를 검정하고 Benjamini–Hochberg 절차를 $q = 0.05$로 적용했다. 이 절차가 보장하는 것은?'''
explanation = '''BH 절차는 거짓 발견 비율(false discovery proportion)의 **기댓값**, 즉 FDR을 $q$ 이하로 유지한다(검정들이 독립이거나 특정한 양의 의존성을 가질 때). 거짓 발견이 하나도 없다는 보장(FWER 제어)은 Bonferroni처럼 더 보수적인 절차가 준다. 이 장의 시뮬레이션에서 BH는 평균 FDP 0.043을 유지하면서 Bonferroni보다 참 발견을 더 많이 찾았지만, 거짓 발견이 하나 이상 나온 반복의 비율은 0.24였다.'''

[[questions.choices]]
text = "기각한 가설들 가운데 거짓 발견이 차지하는 비율의 기댓값이 0.05 이하다."
correct = true

[[questions.choices]]
text = "거짓 발견이 하나라도 나올 확률이 0.05 이하다."
feedback = "그것은 가족별 오류율(FWER)이고, Bonferroni 같은 절차가 제어한다. BH는 거짓 발견의 개수가 아니라 비율의 기댓값을 제어한다."

[[questions.choices]]
text = "각 검정의 1종 오류 확률이 0.05/100 이하다."
feedback = "그것은 Bonferroni의 검정별 기준이다. BH의 기준은 순위에 따라 $kq/m$으로 달라진다."
