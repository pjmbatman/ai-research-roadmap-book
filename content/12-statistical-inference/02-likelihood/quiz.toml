# 12.2 우도와 최대우도 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "likelihood-not-density"
type = "single"
objective = 1
prompt = '''20번 시도 중 7번 성공한 데이터의 우도 $L(\theta) = \binom{20}{7}\theta^7(1-\theta)^{13}$을 $\theta \in [0, 1]$에서 적분했더니 약 0.048이 나왔다. 이 결과의 올바른 해석은?'''
explanation = '''우도는 데이터를 고정하고 $\theta$를 바꿔 가며 본 $p(\mathcal{D} \mid \theta)$다. $y$에 대해 합하면 1이 되지만, $\theta$에 대해 적분하면 1이 될 이유가 없다(이 경우 $1/21$). 그래서 우도는 $\theta$의 확률분포가 아니다. $\theta$에 대한 분포를 원하면 사전분포를 곱하고 정규화해야 하고, 그것이 13장의 사후분포다.'''

[[questions.choices]]
text = '''우도는 $\theta$에 대한 확률분포가 아니므로 적분이 1일 필요가 없다.'''
correct = true

[[questions.choices]]
text = "계산이 틀렸다. 우도는 확률이므로 적분하면 1이어야 한다."
feedback = '''$y$에 대한 합은 1이지만, 같은 식을 $\theta$의 함수로 본 우도는 $\theta$에 대해 정규화되어 있지 않다.'''

[[questions.choices]]
text = "이 데이터가 관측될 확률이 4.8%라는 뜻이다."
feedback = '''$\theta$를 하나로 정해야 데이터의 확률이 정해진다. $\theta$에 대해 적분한 값은 그런 확률이 아니다.'''

[[questions]]
id = "exponential-mle"
type = "numeric"
objective = 2
prompt = '''배터리 셀 4개의 고장까지 걸린 시간이 2, 3, 5, 10시간이다. 고장 시간이 지수분포 $p(t \mid \lambda) = \lambda e^{-\lambda t}$를 따른다고 가정할 때 고장률 $\lambda$의 MLE는 몇 [1/h]인가?'''
answer = 0.2
tolerance = 0.001
explanation = '''로그우도는 $\ell(\lambda) = n\log\lambda - \lambda\sum_i t_i$이고, 미분해 0으로 두면 $n/\lambda - \sum_i t_i = 0$, 즉 $\hat\lambda = n / \sum_i t_i = 1/\bar{t} = 4/20 = 0.2$ [1/h]다. 평균 수명 5시간의 역수다. 수명의 MLE를 $\bar{t}$로 구한 뒤 역수를 취해도 같은 답이 나오는데, 이것이 MLE의 불변성(invariance)이다.'''

[[questions]]
id = "why-log-likelihood"
type = "multiple"
objective = 2
prompt = "우도 대신 로그우도를 최대화하는 이유로 옳은 것을 모두 고르시오."
explanation = '''로그는 단조증가 함수이므로 최대점이 바뀌지 않는다. 독립 관측의 곱이 합으로 바뀌어 미분과 계산이 쉬워지고, 1보다 작은 수를 수천 번 곱할 때 생기는 underflow(0.0)를 피할 수 있다. 로그를 취한다고 추정값의 bias가 사라지지는 않는다. 예를 들어 정규분포 분산의 MLE는 로그우도로 구해도 $n$으로 나눈 편향된 추정량이다.'''

[[questions.choices]]
text = "로그는 단조증가이므로 최대점이 같다."
correct = true

[[questions.choices]]
text = "독립 관측의 곱이 합으로 바뀌어 미분과 계산이 쉬워진다."
correct = true

[[questions.choices]]
text = "작은 확률을 많이 곱할 때 생기는 underflow를 피한다."
correct = true

[[questions.choices]]
text = "로그를 취하면 MLE의 bias가 사라진다."
feedback = "로그는 최대점을 바꾸지 않으므로 같은 추정량이 나온다. bias도 그대로다."

[[questions]]
id = "mse-gaussian-statements"
type = "multiple"
objective = 3
prompt = "평균제곱오차(MSE)로 회귀 모델을 학습하는 것에 대해 옳은 것을 모두 고르시오."
explanation = '''분산이 고정된 가우시안 우도의 NLL은 $\frac{1}{2\sigma^2}\mathrm{MSE} + \text{상수}$이므로 최소점이 같다. 잡음 분산이 입력마다 다르면 "고정된 $\sigma$" 가정이 깨지고, 이분산 모델(12.3장)이 필요하다. 그러나 잡음이 가우시안이 아니어도 MSE 최소화는 여전히 조건부 평균을 추정하므로 무의미하지 않다. 다만 꼬리가 두꺼운 잡음에서는 비효율적이다. MSE 값 자체는 NLL과 척도와 상수가 다르므로 같은 숫자가 아니다.'''

[[questions.choices]]
text = "분산이 고정된 가우시안 잡음을 가정한 최대우도 추정과 같은 해를 준다."
correct = true

[[questions.choices]]
text = "잡음 분산이 입력에 따라 달라지면 고정 분산 가우시안 가정이 깨진다."
correct = true

[[questions.choices]]
text = "잡음이 가우시안이 아니면 MSE로 학습한 결과는 의미가 없다."
feedback = "MSE 최소화는 잡음의 분포와 상관없이 조건부 평균을 추정한다(12.3장). 가우시안이 아니면 최선의 효율을 보장하지 못할 뿐이다."

[[questions.choices]]
text = "MSE 값은 가우시안 NLL 값과 같은 숫자다."
feedback = '''NLL은 MSE에 $1/(2\sigma^2)$을 곱하고 상수를 더한 것이다. 최소점은 같지만 값은 다르다.'''

[[questions]]
id = "l1-laplace"
type = "single"
objective = 3
prompt = '''회귀 모델을 평균 절댓값 오차(MAE, L1 손실)로 학습했다. 이것은 어떤 잡음 모형의 최대우도 추정과 같은가?'''
explanation = '''Laplace 분포의 밀도는 $\frac{1}{2b}\exp(-\lvert y - \mu \rvert / b)$이고, 음의 로그우도는 $\log 2b + \lvert y - \mu \rvert / b$다. $b$가 고정되면 이를 최소화하는 것은 절댓값 오차를 최소화하는 것과 같다. Laplace 분포는 가우시안보다 꼬리가 두꺼워 큰 잔차를 덜 이례적으로 보므로, L1 손실은 이상치에 덜 민감하다.'''

[[questions.choices]]
text = "가우시안 잡음"
feedback = "가우시안 NLL은 잔차의 제곱에 비례한다. 그것은 MSE에 대응한다."

[[questions.choices]]
text = "Laplace 잡음"
correct = true

[[questions.choices]]
text = "균등분포 잡음"
feedback = "균등분포 잡음의 우도는 모든 잔차가 구간 안에 있으면 상수이고, 하나라도 벗어나면 0이다. 절댓값 오차의 합과 대응하지 않는다."

[[questions]]
id = "zero-failure-mle"
type = "single"
objective = 2
prompt = '''새 촉매로 반응을 3번 시도해 3번 모두 성공했다. 성공 확률 $\theta$의 MLE와 그 문제점에 대해 옳은 것은?'''
explanation = '''Bernoulli 우도 $\theta^3$은 $\theta = 1$에서 최대이므로 MLE는 1이다. 이 추정은 "실패는 절대 일어나지 않는다"고 말하므로, 다음 시도에서 실패가 한 번만 나와도 NLL이 무한대가 된다. 작은 표본에서 MLE가 극단값으로 가는 대표적인 예다. 사전분포 Beta(2, 2)를 두면 MAP는 $(3+1)/(3+2) = 0.8$로 극단값을 피한다.'''

[[questions.choices]]
text = "MLE는 1이고, 이후 실패가 한 번이라도 관측되면 그 관측의 NLL이 무한대가 된다."
correct = true

[[questions.choices]]
text = "MLE는 0.5다. 데이터가 적으면 MLE는 중간값을 준다."
feedback = "MLE는 데이터만 보고 우도를 최대화한다. 데이터가 적다고 해서 중간값 쪽으로 끌어당기는 장치는 없다. 그런 역할은 사전분포(MAP)가 한다."

[[questions.choices]]
text = "MLE는 1이지만, MLE는 일관 추정량이므로 3번의 시도에서도 믿을 수 있다."
feedback = '''일관성은 $n \to \infty$에서의 성질이다. $n = 3$에서의 신뢰도에 대해서는 아무것도 말하지 않는다.'''

[[questions]]
id = "ridge-as-prior"
type = "single"
objective = 3
prompt = '''가우시안 잡음 $\mathcal{N}(0, \sigma^2)$을 가정한 선형회귀에 사전분포 $\mathbf{w} \sim \mathcal{N}(\mathbf{0}, \tau^2\mathbf{I})$를 두고 MAP 추정을 한다. 옳은 것은?'''
explanation = '''음의 로그 사후분포는 $\frac{1}{2\sigma^2}\sum_i (y_i - \mathbf{x}_i^\top\mathbf{w})^2 + \frac{1}{2\tau^2}\lVert\mathbf{w}\rVert^2 + \text{상수}$이고, $2\sigma^2$을 곱하면 ridge 목적함수와 같아진다. 정규화 강도는 $\lambda = \sigma^2/\tau^2$이다. 사전분포가 넓을수록($\tau$가 클수록) $\lambda$가 작아 MLE에 가까워진다. MAP는 사후분포의 최빈값 하나만 주는 점추정이고, 사후분포 전체를 다루는 베이지안 추론과는 다르다(13.1장).'''

[[questions.choices]]
text = '''MAP는 정규화 강도 $\lambda = \sigma^2/\tau^2$인 ridge 회귀와 같다. $\tau$를 키우면 정규화가 약해진다.'''
correct = true

[[questions.choices]]
text = '''MAP는 정규화 강도 $\lambda = \tau^2/\sigma^2$인 ridge 회귀와 같다. $\tau$를 키우면 정규화가 강해진다.'''
feedback = '''사전분포의 항은 $\lVert\mathbf{w}\rVert^2 / (2\tau^2)$이다. 사전분포가 넓을수록(τ가 클수록) 이 항이 작아져 정규화가 약해진다.'''

[[questions.choices]]
text = "MAP는 사후분포 전체를 구하므로 베이지안 추론과 같다."
feedback = "MAP는 사후분포의 최빈값 하나다. 불확실성 정보는 버린다. 사후분포 전체는 13장에서 다룬다."
