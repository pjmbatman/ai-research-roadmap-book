# 12.1 추정량의 성질 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "estimator-vs-estimate"
type = "single"
objective = 1
prompt = '''고유진동수를 25번 측정해 표본 평균 $\bar{X} = \frac{1}{n}\sum_i X_i$를 계산했더니 1.963 Hz가 나왔다. 옳은 설명은?'''
explanation = '''$\bar{X}$는 표본을 입력으로 받는 규칙, 즉 **추정량**이고, 표본이 확률변수이므로 추정량도 확률변수다. 1.963 Hz는 그 규칙에 이번 표본을 넣어 얻은 **추정값**, 즉 고정된 숫자다. bias·분산·MSE 같은 성질은 추정량(반복 실험에서의 분포)에 붙는 말이고, 숫자 하나인 추정값에는 분산이 없다.'''

[[questions.choices]]
text = '''1.963 Hz는 추정값이고, $\bar{X}$는 실험을 반복할 때마다 값이 달라지는 확률변수인 추정량이다.'''
correct = true

[[questions.choices]]
text = "1.963 Hz는 모집단 평균이다."
feedback = "모집단 평균은 알 수 없는 고정된 참값이다. 1.963 Hz는 표본 하나에서 얻은 추정값이고, 다른 표본을 뽑으면 다른 값이 나온다."

[[questions.choices]]
text = '''1.963 Hz의 분산은 $\sigma^2/n$이다.'''
feedback = '''$\sigma^2/n$은 추정량 $\bar{X}$의 분산이다. 이미 계산된 숫자 하나에는 분산이 없다.'''

[[questions]]
id = "what-shrinks-with-n"
type = "multiple"
objective = 1
prompt = '''같은 모집단에서 표본 크기 $n$을 늘린다. 옳은 것을 모두 고르시오.'''
explanation = '''$\bar{X}$의 표준오차 $\sigma/\sqrt{n}$은 $n$이 늘면 줄어든다. 반면 표본 표준편차 $s$는 모집단 표준편차 $\sigma$의 추정값이므로 0이 아니라 $\sigma$로 다가간다. 모집단의 퍼짐 $\sigma$는 측정 대상의 성질이라 표본 크기와 무관하다. 표준오차가 작아진다는 것은 반복 실험에서 추정값이 참값 근처에 모일 **확률**이 커진다는 뜻이지, 어떤 특정 실험에서 추정값이 반드시 더 가까워진다는 뜻은 아니다.'''

[[questions.choices]]
text = '''추정량 $\bar{X}$의 표준오차 $\sigma/\sqrt{n}$이 줄어든다.'''
correct = true

[[questions.choices]]
text = '''표본 표준편차 $s$는 0이 아니라 모집단 표준편차 $\sigma$에 가까워진다.'''
correct = true

[[questions.choices]]
text = '''모집단 표준편차 $\sigma$가 줄어든다.'''
feedback = "σ는 모집단(측정 대상과 장비)의 성질이다. 표본을 더 뽑는다고 측정 잡음 자체가 줄지는 않는다."

[[questions.choices]]
text = "어떤 특정 실험에서도 $n = 100$의 추정값은 $n = 50$의 추정값보다 반드시 참값에 더 가깝다."
feedback = "표준오차는 반복 실험에서의 퍼짐이다. 실험 하나만 보면 운에 따라 $n = 50$ 쪽이 더 가까울 수 있다."

[[questions]]
id = "mse-from-bias-variance"
type = "numeric"
objective = 2
prompt = '''어떤 추정량의 bias가 0.3, 분산이 0.16이다. 이 추정량의 MSE는?'''
answer = 0.25
tolerance = 0.001
explanation = '''$\mathrm{MSE} = \mathrm{bias}^2 + \mathrm{Var} = 0.3^2 + 0.16 = 0.09 + 0.16 = 0.25$. bias는 제곱해서 더한다는 점이 핵심이다. bias를 그대로 더해 0.46으로 계산하거나, 분산 대신 표준편차 0.4를 더하는 실수가 흔하다.'''

[[questions]]
id = "unbiased-not-lowest-mse"
type = "single"
objective = 2
prompt = '''정규분포에서 뽑은 $n = 5$인 표본으로 분산을 추정한다. 편차 제곱합을 $n-1$, $n$, $n+1$로 나눈 세 추정량을 MSE로 비교하면?'''
explanation = '''정규분포에서 $n-1$로 나눈 추정량은 불편이지만 분산이 가장 커서 MSE가 가장 크다(0.50). $n+1$로 나누면 아래로 편향되지만 분산이 크게 줄어 MSE가 가장 작다(0.33). 불편성은 좋은 성질 중 하나일 뿐이고, 평가 기준(MSE)에 따라 편향된 추정량이 더 나을 수 있다. 다만 MSE 최소의 나누는 수는 분포의 꼬리에 따라 달라진다(실습).'''

[[questions.choices]]
text = "불편 추정량인 $n-1$ 쪽의 MSE가 가장 작다."
feedback = "불편이라는 것은 bias가 0이라는 뜻일 뿐이다. 이 추정량은 분산이 가장 커서 MSE는 오히려 가장 크다."

[[questions.choices]]
text = "$n+1$ 쪽이 bias는 가장 크지만 MSE는 가장 작다."
correct = true

[[questions.choices]]
text = "세 추정량은 $n$이 같으므로 MSE도 같다."
feedback = "나누는 수가 다르면 bias와 분산이 모두 달라진다. $n = 5$처럼 작은 표본에서는 차이가 크다."

[[questions]]
id = "unbiased-but-inconsistent"
type = "single"
objective = 2
prompt = '''모평균을 추정하는 데 표본 $n$개 중 첫 번째 관측값 $X_1$만 쓴다. 이 추정량에 대해 옳은 것은?'''
explanation = '''$\mathbb{E}[X_1] = \mu$이므로 불편이다. 그러나 분산이 $n$과 무관하게 $\sigma^2$로 고정되어 $n$이 커져도 참값으로 모이지 않으므로 일관성이 없다. 반대로 $n$으로 나눈 분산 추정량은 편향되었지만 일관성이 있다. 불편성과 일관성은 서로 다른 성질이다.'''

[[questions.choices]]
text = "불편이지만 일관성이 없다."
correct = true

[[questions.choices]]
text = "불편이므로 일관성도 있다."
feedback = '''일관성은 $n$이 커질 때 추정량이 참값으로 모이는 성질이다. $X_1$의 분산은 $n$이 커져도 $\sigma^2$ 그대로다.'''

[[questions.choices]]
text = "관측값 하나만 쓰므로 편향되어 있다."
feedback = '''$\mathbb{E}[X_1] = \mu$이므로 bias는 0이다. 문제는 bias가 아니라 줄지 않는 분산이다.'''

[[questions]]
id = "median-sample-size"
type = "numeric"
objective = 2
prompt = '''정규분포 데이터에서 표본 평균은 $n = 100$으로 어떤 정밀도(분산)를 얻는다. 같은 분산을 표본 **중앙값**으로 얻으려면 표본이 대략 몇 개 필요한가? (중앙값의 점근 분산은 $\frac{\pi}{2}\cdot\frac{\sigma^2}{n}$이다.)'''
answer = 157
tolerance = 3
explanation = '''중앙값의 분산 $\frac{\pi}{2}\frac{\sigma^2}{m}$을 평균의 분산 $\frac{\sigma^2}{100}$과 같게 두면 $m = 100 \cdot \pi/2 \approx 157$이다. 정규분포에서 중앙값의 상대 효율은 $2/\pi \approx 0.64$, 즉 같은 정밀도에 표본이 약 1.57배 필요하다. 반대로 Laplace처럼 꼬리가 두꺼운 분포에서는 중앙값이 평균보다 효율적이다.'''

[[questions]]
id = "poisson-crlb"
type = "numeric"
objective = 2
prompt = '''검출기가 1초 동안 센 광자 수가 Poisson($\lambda$) 분포를 따른다. 1초짜리 측정을 $n = 100$번 했고 참값은 $\lambda = 4$다. 관측 하나의 Fisher 정보가 $I(\lambda) = 1/\lambda$일 때, 불편 추정량의 **표준편차**가 가질 수 있는 Cramér–Rao 하한은?'''
answer = 0.2
tolerance = 0.005
explanation = '''Cramér–Rao 하한은 분산에 대해 $\operatorname{Var}(\hat\lambda) \ge 1/(n I(\lambda)) = \lambda/n = 4/100 = 0.04$이다. 표준편차로는 $\sqrt{0.04} = 0.2$다. 표본 평균 $\bar{X}$의 분산이 정확히 $\lambda/n$이므로, Poisson 모형에서 $\bar{X}$는 이 하한을 달성하는 효율적 추정량이다. 분산 하한 0.04를 그대로 답하는 실수에 주의한다.'''
