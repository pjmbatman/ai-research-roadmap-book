# 31.1 단계별 종합 프로젝트 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "scope-too-large"
type = "single"
objective = 3
prompt = '''3단계에 막 들어선 학습자가 프로젝트 D의 계획서를 썼다. "공개된 배터리 데이터셋 다섯 개를 모두 합쳐, 모든 화학계와 운전 조건에 통하는 수명 예측 Transformer를 3개월 안에 만든다." 이 계획을 가장 적절하게 고친 것은?'''
explanation = '''질문 하나, 데이터셋 하나, 주 metric 하나로 시작하고, 기한을 먼저 정한 뒤 범위를 거기에 맞춘다. 다섯 데이터셋을 합치는 일만으로도 단위·측정 프로토콜·셀 식별자를 맞추는 데이터 통합 단계에서 몇 달이 걸릴 수 있고, 그동안 baseline도 보고서도 생기지 않는다. 계산 자원을 늘리거나 기한을 늘리는 것은 범위 문제를 해결하지 않는다.'''

[[questions.choices]]
text = "데이터셋 하나, 질문 하나(예: 초기 100 사이클로 수명 예측), 주 metric 하나로 줄이고, baseline 표를 먼저 만든 뒤 시간이 남으면 넓힌다."
correct = true

[[questions.choices]]
text = "계획은 그대로 두고, GPU를 더 확보해 학습 시간을 줄인다."
feedback = "병목은 학습 시간이 아니라 데이터 통합과 판단 기준(분할·baseline)을 세우는 일이다. 자원이 늘어도 여섯 단계 중 앞 단계의 일은 줄지 않는다."

[[questions.choices]]
text = "계획은 그대로 두고, 기한을 6개월로 늘린다."
feedback = "기한을 늘리는 방식은 끝나지 않는 프로젝트를 만든다. 늦어지면 기한이 아니라 범위를 줄이는 것이 원칙이다."

[[questions.choices]]
text = "가장 큰 모델부터 학습해 성능 상한을 확인한 뒤, 데이터셋 수를 줄일지 결정한다."
feedback = "모델에서 시작하는 순서다. 분할과 baseline이 없으면 '성능 상한'이라는 숫자가 좋은지 나쁜지도 판단할 수 없다."

[[questions]]
id = "baseline-first"
type = "single"
objective = 2
prompt = '''프로젝트 A에서 그래디언트 부스팅 모델의 테스트 RMSE가 0.42로 나왔다. 이 숫자로 "모델이 잘 작동한다"고 보고하기 전에 가장 먼저 필요한 것은?'''
explanation = '''성능 숫자는 모델의 실력과 문제의 난이도가 섞인 값이다. 같은 분할·같은 metric에서 평균 예측과 선형 회귀 같은 baseline의 RMSE가 있어야 0.42가 개선인지 판단할 수 있다. 평균 예측의 RMSE가 0.43이라면 모델은 거의 아무것도 배우지 못한 것이다. 다른 논문의 숫자는 분할과 전처리가 달라 비교 대상이 되지 못하고, 더 큰 모델이나 더 긴 학습은 판단 기준을 만들지 않는다.'''

[[questions.choices]]
text = "같은 분할·같은 metric으로 평가한 평균 예측과 선형 회귀 baseline의 RMSE"
correct = true

[[questions.choices]]
text = "같은 데이터셋을 쓴 논문에 보고된 RMSE"
feedback = "논문의 분할·전처리·metric 정의가 자신의 것과 같다는 보장이 없다. 조건이 다른 숫자와의 비교는 비교가 아니다."

[[questions.choices]]
text = "더 오래 학습했을 때의 RMSE"
feedback = "학습을 더 해도 0.42가 좋은 값인지 판단할 기준은 생기지 않는다."

[[questions.choices]]
text = "테스트 데이터에서 하이퍼파라미터를 다시 튜닝한 RMSE"
feedback = "테스트 데이터로 튜닝하면 테스트 점수가 낙관적으로 부풀려진다. 하이퍼파라미터는 검증 데이터로 고르고 테스트는 마지막에 한 번 쓴다."

[[questions]]
id = "domain-split"
type = "multiple"
objective = 1
prompt = '''프로젝트 D의 분야별 변형에서, 실제 사용 상황을 반영하는 분할을 **모두** 고르시오.'''
explanation = '''과학 데이터에서는 같은 대상에서 나온 표본이 서로 강하게 닮아 있다. 배터리는 같은 셀의 사이클, 기후는 인접한 날짜, 화학은 같은 분자 골격, 생명과학은 서열이 비슷한 단백질이 그렇다. 실제 사용 상황(새 셀, 미래의 기간, 새 골격의 분자, 새 계통의 단백질)을 반영하려면 이 묶음 단위로 나눈다. 행이나 날짜를 무작위로 섞으면 테스트 표본의 "가까운 친척"이 학습에 들어가 점수가 부풀려진다.'''

[[questions.choices]]
text = "배터리 수명 예측: 셀 단위로 학습·테스트 셀을 나눈다."
correct = true

[[questions.choices]]
text = "지역 기온 예측: 연도 단위로 과거 연도는 학습, 이후 연도는 테스트로 나눈다."
correct = true

[[questions.choices]]
text = "분자 물성 예측: scaffold(분자 골격)가 겹치지 않게 나눈다."
correct = true

[[questions.choices]]
text = "배터리 수명 예측: 모든 셀의 사이클 행을 섞어 80%를 학습, 20%를 테스트로 쓴다."
feedback = "같은 셀의 사이클이 학습과 테스트에 모두 들어가, 모델이 처음 보는 셀이 아니라 이미 본 셀의 다른 시점을 예측하게 된다."

[[questions.choices]]
text = "단백질 기능 예측: 서열 단위로 무작위로 나눈다. 같은 서열이 두 번 들어가지만 않으면 된다."
feedback = "같은 서열이 아니어도 서열 유사도가 높은 단백질은 기능이 비슷하다. 서열 유사도 클러스터 단위로 나누어야 새 계통에 대한 성능을 잰다."

[[questions]]
id = "skip-artifact"
type = "single"
objective = 1
prompt = '''프로젝트 C(PyTorch 연구 템플릿)를 학습 루프까지만 만들고 checkpoint 재개와 테스트는 미룬 채 프로젝트 F(논문 재현)를 시작했다. 재현한 숫자가 논문과 달랐을 때 생기는 가장 큰 문제는?'''
explanation = '''앞 단계의 산출물은 다음 단계의 출발점이자 검증 도구다. 테스트와 결정적 실행이 확인되지 않은 코드 위에서 재현이 실패하면, 그 차이가 논문 쪽 원인(보고되지 않은 조건, 구현 차이)인지 자기 코드의 버그인지 분리할 수 없다. 이 때문에 각 단계의 산출물 없이 다음 단계로 넘어가지 않는다.'''

[[questions.choices]]
text = "숫자의 차이가 논문 쪽 원인인지 자기 학습 코드의 버그인지 분리할 수 없다."
correct = true

[[questions.choices]]
text = "논문 재현은 PyTorch 템플릿과 무관하므로 별문제가 없다."
feedback = "재현 실험도 학습·평가·checkpoint를 쓴다. 검증되지 않은 코드 위의 재현은 실패 원인을 좁힐 수 없다."

[[questions.choices]]
text = "논문의 코드가 공개되어 있으면 그것만 실행하면 되므로 문제가 되지 않는다."
feedback = "공개 코드를 실행해도 데이터 준비·평가·여러 seed 실행·ablation은 직접 해야 한다. 그리고 공개 코드의 숫자가 다를 때도 원인을 나누려면 자신의 평가 코드가 검증되어 있어야 한다."

[[questions.choices]]
text = "학습 시간이 길어질 뿐 결과 해석에는 영향이 없다."
feedback = "시간보다 큰 문제는 해석이다. 버그가 있을 수 있는 코드에서 나온 차이는 재현 실패의 근거가 되지 못한다."

[[questions]]
id = "hybrid-claim"
type = "single"
objective = 1
prompt = '''프로젝트 G에서 하이브리드 모델이 학습 온도 범위 안의 테스트에서 순수 데이터 모델보다 오차가 20% 작았다. 범위 밖 조건과 계산 시간은 아직 재지 않았다. 지금 쓸 수 있는 결론은?'''
explanation = '''주장은 평가한 조건까지만 확장된다. 범위 안 결과만으로 일반화나 계산 효율을 주장할 수 없다. 프로젝트 G가 정확도·일반화·계산 비용 세 축을 모두 재도록 설계된 이유가 이것이다. 또 시뮬레이터 자체의 수치 오차를 추정하지 않았다면 20% 차이가 그 오차보다 큰지도 함께 확인해야 한다.'''

[[questions.choices]]
text = "학습 온도 범위 안에서는 하이브리드 모델의 오차가 더 작았다. 범위 밖 일반화와 계산 비용은 아직 판단할 수 없다."
correct = true

[[questions.choices]]
text = "물리 정보를 넣었으므로 하이브리드 모델이 범위 밖에서도 더 잘 일반화한다."
feedback = "물리 구조가 일반화를 도울 것이라는 기대는 가설이다. 범위 밖 조건에서 재기 전에는 결론이 아니다."

[[questions.choices]]
text = "하이브리드 모델이 세 모델 중 가장 좋은 모델이다."
feedback = "세 축 중 한 축의 일부만 쟀다. 범위 밖 오차, 제약 위반, 계산 비용에서 순위가 바뀔 수 있다."

[[questions.choices]]
text = "오차가 20% 작으므로 물리 모델은 더 이상 필요 없다."
feedback = "하이브리드 모델 자체가 물리 모델 위에 서 있다. 또한 순수 물리 모델과의 비교도 아직 범위 안에서만 했다."
