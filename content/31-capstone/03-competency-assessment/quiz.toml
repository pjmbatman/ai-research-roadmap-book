# 31.3 역량 평가와 다음 단계 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "results-only"
type = "single"
objective = 1
prompt = '''한 대학원생이 1년을 돌아보며 "올해 벤치마크 두 개에서 최고 점수를 냈고, 써 본 모델이 열다섯 종이므로 연구 역량이 충분히 자랐다"고 평가했다. 이 평가의 가장 큰 문제는?'''
explanation = '''점수와 모델 목록은 역량의 대리 지표다. 최고 점수에는 운이 좋은 seed, 약하게 튜닝된 baseline, 계산 자원이 섞일 수 있고, 써 본 모델 목록은 사용과 이해(설명·구현·검증)를 구분하지 않는다. 연구 역량은 결과를 만드는 과정의 능력(실패 원인 분리, 공정한 비교, 재현, 한계 명시)이고, 평가 질문마다 근거 파일로 확인한다.'''

[[questions.choices]]
text = "결과 수치와 사용 경험만 보고, 그 결과를 만든 과정의 능력(원인 분리·공정한 비교·재현·한계 명시)을 근거로 확인하지 않았다."
correct = true

[[questions.choices]]
text = "벤치마크 두 개는 너무 적다. 다섯 개 이상에서 최고 점수를 내야 역량이 자랐다고 할 수 있다."
feedback = "벤치마크 수를 늘려도 여전히 결과 수치로만 평가하는 것이다. 문제는 개수가 아니라 평가 대상이다."

[[questions.choices]]
text = "모델 열다섯 종은 많지 않다. 최신 모델을 더 써 봐야 한다."
feedback = "모델을 써 본 것은 대개 인지(1) 수준의 근거다. 이론 축의 수준은 그 모델이 하는 일을 설명할 수 있는지로, 구현 축의 수준은 직접 작성하고 검증한 코드로 매긴다."

[[questions.choices]]
text = "다른 연구실 학생들의 점수와 비교하지 않았다."
feedback = "루브릭은 같은 사람의 시간에 따른 변화를 보는 도구다. 배경이 다른 사람과의 비교는 자신에게 필요한 칸을 보여 주지 않는다."

[[questions]]
id = "evidence-rule-mean"
type = "numeric"
objective = 1
prompt = '''한 축의 네 항목에 스스로 매긴 수준이 $(4, 3, 3, 2)$이고, 근거 파일로 보일 수 있는 최고 수준이 $(4, 2, 1, 2)$이다. 근거 규칙 $\ell_i = \min(c_i, e_i)$를 적용한 뒤 이 축의 평균 수준을 구하시오.'''
answer = 2.25
tolerance = 0
slider = { min = 0.0, max = 5.0, step = 0.25 }
explanation = '''근거 규칙을 적용하면 $(\min(4,4), \min(3,2), \min(3,1), \min(2,2)) = (4, 2, 1, 2)$이고 평균은 $9/4 = 2.25$다. 스스로 매긴 수준의 평균 3.0과의 차이 0.75가 과대평가의 크기다. 근거가 없는 칸을 한 단계씩만 내리면 $(4, 2, 2, 2)$로 평균 2.5가 되지만, 근거 규칙은 근거로 보일 수 있는 수준까지 내린다. 또 이 축의 최저는 1이라는 점을 평균과 함께 본다.'''

[[questions]]
id = "mean-hides-lowest"
type = "single"
objective = 2
prompt = '''본문 코드의 출력에서 축 평균은 지식 3.50, 기술 3.00, 연구 습관 2.50이고, 항목별로는 "실패 원인 분리"가 1, "한계 명시"가 2로 가장 낮다. 이 독자의 다음 성장 목표로 가장 적절한 것은?'''
explanation = '''연구를 막는 것은 평균이 아니라 가장 낮은 칸이다. 기술 축은 평균 3.00이지만 그 안의 "실패 원인 분리"가 1이고, 처음 진단 이후 근거가 늘지 않았다. 축 평균이 가장 낮은 연구 습관 축 전체를 다시 공부하는 것보다, 가장 낮은 칸(실패 원인 분리, 그다음 한계 명시)을 근거를 만드는 프로젝트로 채우는 것이 먼저다. 가장 높은 지식 축을 더 키우는 것은 즐겁지만 연구의 병목을 풀지 않는다.'''

[[questions.choices]]
text = "실패 원인 분리(수준 1)를 먼저, 그다음 한계 명시(수준 2)를 채운다. 예를 들어 디버깅 기록과 조건별 calibration 표를 근거로 만든다."
correct = true

[[questions.choices]]
text = "축 평균이 가장 낮은 연구 습관 축의 장(23부)을 처음부터 다시 읽는다."
feedback = "축 평균은 그 안의 최저 칸을 가린다. 가장 낮은 칸은 평균 3.00인 기술 축 안에 있다."

[[questions.choices]]
text = "기술 축은 평균이 3.00이므로 충분하다. 지식 축을 수준 5까지 끌어올린다."
feedback = "평균 3.00 안에 수준 1인 칸이 숨어 있다. 이미 높은 칸을 더 높이는 것은 연구의 병목을 풀지 않는다."

[[questions.choices]]
text = "스스로 매긴 수준(claimed)으로 다시 집계하면 모든 칸이 3 이상이므로 새 목표가 필요 없다."
feedback = "근거 없는 수준은 인정하지 않는 것이 근거 규칙이다. 스스로 매긴 수준과 근거 수준이 어긋나는 칸이 바로 다음 목표다."

[[questions]]
id = "domain-trust"
type = "single"
objective = 1
prompt = '''분자 용해도 예측 모델의 평균 오차가 기존 방법보다 작다. 함께 일하는 화학자가 이 모델을 후보 선별에 쓸 수 있을지 판단하도록 돕는 데 가장 효과적인 것은?'''
explanation = '''도메인 전문가의 신뢰는 평균 점수가 아니라 "어떤 분자에서 믿을 수 있고, 어디서 틀리는가"에서 나온다. 골격별 오차, 학습 분포에서 먼 분자를 표시하는 적용 범위 판별, 실패 사례를 함께 보이면 화학자가 자기 후보 분자에 모델을 쓸지 판단할 수 있다. 더 큰 모델의 더 작은 평균 오차나, 근거 없는 설명 그림은 이 판단을 돕지 않는다.'''

[[questions.choices]]
text = "골격별 오차 표, 학습 분포에서 먼 분자를 표시하는 적용 범위 판별, 모델이 크게 틀린 분자의 사례를 함께 보여 준다."
correct = true

[[questions.choices]]
text = "더 큰 모델로 평균 오차를 더 줄여 보여 준다."
feedback = "평균 오차가 줄어도 화학자의 질문(내 후보 분자에서 믿을 수 있는가)에는 답하지 않는다."

[[questions.choices]]
text = "attention 가중치 그림을 보여 주며 모델이 화학적으로 의미 있는 부분을 본다고 설명한다."
feedback = "해석 그림이 예측의 신뢰도를 보장하지는 않는다(21.5장). 조건별 오차와 적용 범위가 더 직접적인 근거다."

[[questions.choices]]
text = "여러 벤치마크에서 기존 방법보다 순위가 높다는 표를 보여 준다."
feedback = "벤치마크 순위는 평균 점수의 다른 표현이다. 화학자의 후보 분자가 벤치마크 분포와 닮았는지는 알려 주지 않는다."

[[questions]]
id = "growth-plan"
type = "multiple"
objective = 2
prompt = '''책을 마친 뒤 1년 성장 계획을 쓴다. 이 장의 원칙에 맞는 항목을 **모두** 고르시오.'''
explanation = '''1년 계획은 기간이 아니라 산출물로 쓰고, 산출물마다 확인 방법과 대응하는 루브릭 칸을 적는다. 심화 방향은 도메인 하나와 방법론 하나로 좁혀야 어느 하나라도 확장(5) 수준에 이른다. 재진단 일정이 있어야 계획을 고칠 근거가 생기고, 커뮤니티 참여도 산출물이 있는 형태로 계획한다. "심화 장을 모두 읽는다"는 산출물이 아니고, "논문 세 편"만 목표로 두면 결과 수치로 자신을 평가하게 된다.'''

[[questions.choices]]
text = "분기마다 산출물, 확인 방법, 그 산출물이 근거가 되는 루브릭 칸을 적는다."
correct = true

[[questions.choices]]
text = "심화 방향을 도메인 하나와 방법론 하나로 정한다."
correct = true

[[questions.choices]]
text = "분기마다 루브릭을 다시 채우고 성장 기록에 남긴다."
correct = true

[[questions.choices]]
text = "남은 심화(advanced) 장을 모두 읽는 것을 1년 목표로 둔다."
feedback = "읽기는 산출물이 아니다. 어떤 칸을 어떤 근거로 올릴지가 빠져 있다."

[[questions.choices]]
text = "1년 목표를 '논문 세 편 투고'로만 정한다."
feedback = "논문 수는 결과 수치다. 어떤 역량을 키울지, 그 근거가 무엇인지가 계획에 없다."

[[questions]]
id = "portfolio-evidence"
type = "single"
objective = 3
prompt = '''루브릭의 질문 4 "실패 원인을 데이터·이론·구현·환경으로 분리하는가"에서 수준 4(검증)의 근거로 포트폴리오에 넣기에 가장 적절한 것은?'''
explanation = '''수준 4는 원인을 실제로 한 층으로 좁혔다는 기록으로 확인된다. 가설을 층별로 세우고, 각 가설을 확인 절차(작은 batch 과적합, 다른 환경에서 같은 코드 실행, 분할 점검 등)로 하나씩 배제해 원인을 찾은 디버깅 기록이 그 근거다. 실패를 많이 겪었다는 경험, 도구를 안다는 사실, 최종 성능은 이 능력을 보여 주지 않는다.'''

[[questions.choices]]
text = "학습이 발산한 사례에서 층별 가설을 세우고 확인 절차로 하나씩 배제해 원인(예: 환경의 라이브러리 버전 차이)을 찾은 디버깅 기록"
correct = true

[[questions.choices]]
text = "지난 1년 동안 학습 실패를 수십 번 겪었다는 회고"
feedback = "실패를 겪은 횟수는 원인을 분리하는 능력의 근거가 아니다. 원인을 좁힌 과정의 기록이 필요하다."

[[questions.choices]]
text = "디버거와 profiler의 사용법을 정리한 노트"
feedback = "도구를 아는 것은 설명(2) 수준의 근거다. 실제 실패에서 원인을 좁힌 기록이 검증(4)의 근거다."

[[questions.choices]]
text = "최종 모델이 baseline보다 높은 점수를 낸 결과 표"
feedback = "결과 표는 질문 6(주장 판단)의 재료일 수는 있어도, 실패 원인을 분리하는 능력을 보여 주지 않는다."
