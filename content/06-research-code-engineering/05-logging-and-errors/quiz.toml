# 6.5 로깅과 오류 처리 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "logger-handler-levels"
type = "numeric"
objective = 1
prompt = '''logger의 level을 `INFO`로, 콘솔 handler의 level을 `WARNING`으로, 파일 handler의 level을 `DEBUG`로 설정했다. 그 logger로 `debug`, `info`, `warning`, `error`를 한 번씩 호출하면 **파일**에는 몇 줄이 남는가?'''
answer = 3
tolerance = 0
slider = { min = 0, max = 4, step = 1, unit = "줄" }
explanation = '''레코드는 두 번 걸러진다. 먼저 logger의 level이 레코드를 만들지 말지 정하고, 통과한 레코드만 각 handler에 전달되어 handler의 level로 다시 걸러진다. logger가 `INFO`이므로 `debug` 호출은 handler에 도달하지 못한다. 파일 handler가 `DEBUG`여도 받지 못한 레코드는 쓸 수 없다. 그래서 파일에는 `info`, `warning`, `error` 세 줄이 남고, 콘솔에는 `warning`, `error` 두 줄이 남는다. 파일에 DEBUG까지 남기려면 logger의 level도 `DEBUG`로 낮춰야 한다.'''

[[questions]]
id = "what-to-log-at-start"
type = "multiple"
objective = 1
prompt = "학습 스크립트가 시작할 때 run 디렉터리의 로그에 남겨 두면 나중에 실패 원인을 찾는 데 도움이 되는 것을 모두 고르시오."
explanation = '''실험을 다시 만들고 실패를 설명하는 데 필요한 것은 실제로 적용된 설정(resolved config), 코드 revision(커밋 hash와 커밋되지 않은 변경 여부), 환경(Python·주요 패키지 버전, 장치), 데이터 통계(샘플 수, 결측 수, 값의 범위)다. 비밀정보는 로그에 남기면 안 된다. 로그는 공유되고 복사되기 때문이다. batch마다 텐서 전체를 INFO로 남기면 로그가 너무 커져 정작 중요한 줄을 찾을 수 없다. 필요하면 DEBUG로, 요약 통계로 남긴다.'''

[[questions.choices]]
text = "기본값과 override가 모두 반영된 실제 설정(resolved config)"
correct = true

[[questions.choices]]
text = "git 커밋 hash와 커밋되지 않은 변경이 있었는지 여부"
correct = true

[[questions.choices]]
text = "학습·검증 데이터의 샘플 수, 결측 수, 주요 변수의 범위"
correct = true

[[questions.choices]]
text = "재현을 위해 환경변수 전체(API key·토큰 포함)"
feedback = "비밀정보는 로그에 남기지 않는다. 로그 파일은 동료에게 공유되고 저장소나 issue에 붙여지기도 한다. 필요한 환경변수만 이름을 골라 기록한다."

[[questions.choices]]
text = "모든 batch의 입력 텐서 값 전체를 INFO 레벨로"
feedback = "로그가 수 GB가 되어 정작 중요한 경고를 찾을 수 없다. 텐서는 shape과 요약 통계(평균·최댓값·NaN 수)를, 필요할 때 DEBUG로 남긴다."

[[questions]]
id = "print-vs-logging"
type = "single"
objective = 1
prompt = "여러 실험을 서버에서 밤새 돌리는 코드가 진행 상황을 `print`로만 출력한다. `logging`으로 바꾸는 가장 중요한 이유는?"
explanation = '''`logging`은 메시지마다 수준(level)과 출처(logger 이름)를 붙이고, 코드를 고치지 않고 설정만으로 어떤 수준을 어디(콘솔·run 디렉터리의 파일·JSON 줄)에 남길지 바꿀 수 있다. 그래서 평소에는 INFO만 보고, 문제가 생긴 run에서는 파일에 남은 DEBUG까지 읽을 수 있다. `print`를 파일로 리다이렉트해도 수준·시각·출처가 없고, 디버깅용 출력과 결과 출력이 한 흐름에 섞인다.'''

[[questions.choices]]
text = "수준·출처를 붙이고, 코드 수정 없이 수준별로 출력 대상(콘솔·파일)을 나눌 수 있어서"
correct = true

[[questions.choices]]
text = "`print`보다 실행 속도가 빨라서"
feedback = "속도가 이유가 아니다. 포맷팅과 handler를 거치는 logging이 print보다 빠르다는 보장도 없다. 이유는 구조와 제어다."

[[questions.choices]]
text = "바꿀 필요가 없다. `python train.py > out.txt`로 리다이렉트하면 같은 정보가 남는다"
feedback = "리다이렉트하면 저장은 되지만 수준도 시각도 출처도 없다. 실패한 run에서 경고만 골라 보거나, 디버깅 출력을 끄고 켜려면 결국 코드를 고쳐야 한다."

[[questions.choices]]
text = "logging을 쓰면 예외가 자동으로 처리되어 프로그램이 멈추지 않아서"
feedback = "logging은 예외를 처리하지 않는다. `logger.exception`은 예외와 traceback을 기록할 뿐이고, 계속할지 멈출지는 코드가 정한다."

[[questions]]
id = "silent-except"
type = "single"
objective = 2
prompt = '''데이터 로딩 코드에 다음이 있다. 이 코드의 가장 큰 문제는?

```python
for path in files:
    try:
        samples.append(load(path))
    except Exception:
        pass
```'''
explanation = '''읽지 못한 파일이 아무 흔적 없이 빠진다. 손상된 파일, 잘못된 경로, 단위가 다른 파일, 심지어 `load` 함수 안의 버그(오타로 생긴 `NameError`)까지 모두 같은 방식으로 사라진다. 학습은 끝까지 돌고 결과도 나오지만, 데이터의 일부만 쓴 결과다. 빠진 파일이 특정 조건(예: 고온 실험)에 몰려 있으면 결론이 바뀐다. 예상한 예외만 좁게 잡고, 건너뛴 파일과 이유를 기록하고, 건너뛴 비율이 정한 한도를 넘으면 실패로 멈춘다.'''

[[questions.choices]]
text = "실패한 파일과 이유가 남지 않아, 데이터 일부가 빠진 결과를 정상 결과로 믿게 된다."
correct = true

[[questions.choices]]
text = "문제없다. 긴 학습이 파일 하나 때문에 멈추지 않게 하는 견고한 코드다."
feedback = "멈추지 않는 것과 옳은 것은 다르다. 무엇이 왜 빠졌는지 모르면 결과를 믿을 근거가 없다. 견고함은 '기록하고, 한도를 정하고, 넘으면 멈추는 것'이다."

[[questions.choices]]
text = "`except Exception:` 대신 `except:`로 써야 모든 오류를 잡을 수 있다."
feedback = "오히려 더 나쁘다. 맨 `except:`는 Ctrl+C(KeyboardInterrupt)와 SystemExit까지 삼켜 프로그램을 멈추지도 못하게 만든다. 문제는 잡는 범위가 넓다는 것이지 좁다는 것이 아니다."

[[questions.choices]]
text = "`pass` 대신 `logger.debug`로 남기면 해결된다."
feedback = "DEBUG는 평소 꺼져 있는 경우가 많고, 남더라도 학습은 그대로 진행된다. 기록과 함께 건너뛴 비율의 한도를 정하고, 예상하지 못한 예외는 잡지 않아야 한다."

[[questions]]
id = "nan-equality"
type = "single"
objective = 2
prompt = '''loss가 NaN이 되면 학습을 멈추려고 `if loss == float("nan"): raise FloatingPointError(...)`를 넣었다. loss가 실제로 NaN이 되면 어떻게 되는가?'''
explanation = '''IEEE 754 부동소수점에서 NaN은 자기 자신을 포함한 어떤 값과도 같지 않다. `nan == nan`은 `False`다. 그래서 이 가드는 절대 발동하지 않고, 학습은 NaN 상태로 끝까지 진행된다. `math.isnan(loss)`, 배열이면 `np.isnan`을 쓰고, 무한대까지 잡으려면 `not math.isfinite(loss)` 또는 `np.isfinite`를 쓴다.'''

[[questions.choices]]
text = "조건이 항상 거짓이라 가드가 발동하지 않고, 학습이 NaN인 채로 계속된다."
correct = true

[[questions.choices]]
text = "의도대로 FloatingPointError가 나며 학습이 멈춘다."
feedback = "NaN은 자기 자신과도 같지 않다. float('nan') == float('nan')을 직접 실행해 보면 False가 나온다."

[[questions.choices]]
text = "NaN과 비교하는 순간 TypeError가 나서 어쨌든 멈춘다."
feedback = "NaN은 float이므로 비교 자체는 오류 없이 실행된다. 결과가 False일 뿐이다. 조용히 넘어가므로 더 위험하다."

[[questions.choices]]
text = "loss가 NaN이면 멈추지만 inf일 때는 멈추지 않는다."
feedback = "NaN일 때도 멈추지 않는다. inf는 inf == float('inf')가 True라서 이런 식으로 잡을 수는 있지만, NaN은 그렇지 않다. 둘 다 잡으려면 math.isfinite를 쓴다."

[[questions]]
id = "assert-for-validation"
type = "single"
objective = 2
prompt = "사용자가 준 설정 파일의 값을 `assert cfg.lr > 0, \"lr must be positive\"`로 검증한다. 이 방식의 문제로 옳은 것은?"
explanation = '''Python을 `-O` 옵션(최적화 모드)으로 실행하면 `assert` 문은 컴파일 단계에서 제거된다. 그래서 외부 입력(설정 파일, 명령행 인자, 데이터 파일)의 검증을 assert에 맡기면, 실행 방식에 따라 검증이 사라진다. 외부 입력은 `if not cfg.lr > 0: raise ValueError(...)`처럼 명시적으로 검증하고, assert는 "내 코드가 옳다면 항상 참이어야 하는" 내부 불변조건(예: 함수 안에서 계산한 배열의 shape)에 쓴다.'''

[[questions.choices]]
text = "`python -O`로 실행하면 assert가 제거되어 검증 자체가 사라진다."
correct = true

[[questions.choices]]
text = "assert는 테스트 코드 안에서만 동작하고 일반 스크립트에서는 무시된다."
feedback = "일반 스크립트에서도 동작한다. 사라지는 조건은 -O로 실행했을 때다."

[[questions.choices]]
text = "문제없다. AssertionError 메시지로 원인을 알 수 있으므로 가장 좋은 검증 방법이다."
feedback = "메시지는 남지만 -O에서 검증이 사라진다는 문제가 남는다. 또 AssertionError는 '코드의 버그'라는 신호로 읽히는데, 잘못된 설정은 입력의 오류이므로 ValueError가 의도를 더 정확히 전달한다."

[[questions.choices]]
text = "assert는 NaN을 잡지 못한다."
feedback = "assert의 문제가 아니라 조건식의 문제다. cfg.lr > 0은 lr이 NaN이면 False이므로 오히려 NaN도 걸러 낸다."

[[questions]]
id = "repeated-warning-once"
type = "single"
objective = 2
prompt = "밤새 돌린 학습 로그에 `RuntimeWarning: divide by zero encountered in log`가 **한 번** 찍혀 있다. 기본 경고 필터를 바꾸지 않았다면, 이 로그에서 결론 낼 수 있는 것은?"
explanation = '''Python의 기본 경고 동작(`default`)은 같은 경고를 **코드 위치마다 한 번만** 보여 준다. 같은 줄에서 같은 경고가 천 번 나도 화면에는 한 번만 보인다. 그래서 한 번 찍혔다는 것은 "그 위치에서 최소 한 번 일어났다"는 뜻일 뿐, 몇 번 일어났는지는 알 수 없다. 횟수가 중요하면 경고를 예외로 바꾸거나(`warnings.simplefilter("error")`, `np.errstate(divide="raise")`), 값을 직접 검사해 문제 batch의 수를 기록한다.'''

[[questions.choices]]
text = "그 코드 위치에서 최소 한 번 일어났다는 것만 알 수 있고, 몇 번 일어났는지는 알 수 없다."
correct = true

[[questions.choices]]
text = "문제가 된 batch는 정확히 하나다."
feedback = "기본 필터는 같은 위치의 같은 경고를 한 번만 보여 준다. 실제로는 수백 batch에서 일어났을 수도 있다."

[[questions.choices]]
text = "경고는 결과에 영향을 주지 않으므로 무시해도 된다."
feedback = "log(0) = -inf는 평균이나 loss에 그대로 전파된다. 경고는 '아직 멈추지는 않았지만 계산이 정의 밖으로 나갔다'는 신호다."

[[questions.choices]]
text = "첫 batch에서 일어났다."
feedback = "경고가 언제 처음 일어났는지는 로그의 위치(앞뒤 줄)로 짐작할 수 있을 뿐, 첫 batch라는 근거는 없다."
