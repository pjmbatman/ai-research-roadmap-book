# 6.1 연구 프로젝트 구조 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "eval-independent"
type = "single"
objective = 1
prompt = '''학습을 마친 모델의 test 성능을 나중에 다시 확인해야 한다. 평가 코드를 어떻게 두는 것이 가장 좋은가?'''
explanation = '''평가는 checkpoint와 데이터 설정만 있으면 다시 실행할 수 있어야 한다. 그래야 metric 버그를 고친 뒤 재계산하고, 여러 checkpoint를 같은 기준으로 비교하고, 새 test set에 같은 모델을 적용할 수 있다. 평가 로직은 `src/<project>/evaluation/`에, 실행은 얇은 진입점 `scripts/eval.py`에 둔다. 학습 중에 같은 평가 함수를 불러 쓰는 것은 괜찮다. 문제는 평가가 학습 안에서만 실행되는 구조다.'''

[[questions.choices]]
text = '''`train.py`의 마지막 epoch 뒤에 평가 코드를 둔다. 학습할 때마다 자동으로 평가되기 때문이다.'''
feedback = "평가를 다시 하려면 학습을 다시 돌려야 한다. 이미 저장된 checkpoint를 다시 평가하거나 여러 checkpoint를 같은 코드로 비교할 수 없다."

[[questions.choices]]
text = '''평가 함수는 `src/<project>/evaluation/`에 두고, checkpoint 경로와 데이터 설정만 받아 실행하는 `scripts/eval.py`에서 호출한다.'''
correct = true

[[questions.choices]]
text = "학습 로그에 남은 마지막 validation metric을 test 성능으로 그대로 보고한다."
feedback = "학습 중 metric은 그때의 코드와 데이터 분할로 계산된 값이다. validation과 test는 다른 데이터이고, metric 계산을 고치면 로그의 숫자는 다시 만들 수 없다."

[[questions.choices]]
text = "평가는 notebook에서 한다. 결과 그림을 바로 볼 수 있기 때문이다."
feedback = "그림은 notebook에서 그려도 된다. 하지만 metric 계산 자체가 notebook에 있으면 실행 순서와 숨은 상태에 따라 숫자가 달라질 수 있고, 다른 스크립트와 테스트에서 재사용할 수 없다."

[[questions]]
id = "notebook-hidden-state"
type = "numeric"
objective = 2
prompt = '''notebook의 셀이 다음 순서로 실행되었다. 셀 4의 출력은?

```python
# 셀 1
scale = 2.0
# 셀 2
def normalize(v):
    return v / scale
# 셀 3
scale = 4.0
# 셀 4
normalize(8.0)
```'''
answer = 2.0
tolerance = 0
explanation = '''함수 본문의 `scale`은 함수를 정의할 때가 아니라 **호출할 때** 전역 이름공간에서 찾는다. 셀 4를 실행하는 시점의 `scale`은 4.0이므로 $8.0 / 4.0 = 2.0$이다. 셀 3을 건너뛰거나 셀 순서를 바꿔 실행하면 같은 셀 4가 4.0을 출력한다. 이처럼 결과가 셀의 실행 이력에 의존하는 코드는 재현하기 어렵다. `scale`을 인자로 받는 함수로 바꾸면 호출만 보고 결과를 알 수 있다.'''

[[questions]]
id = "what-goes-to-src"
type = "multiple"
objective = 2
prompt = '''notebook에서 작성한 코드 중 `src/`로 옮겨야 할 것을 모두 고르시오.'''
explanation = '''여러 곳에서 재사용하는 코드와, 보고하는 결과(논문의 숫자·그림)를 만드는 코드는 `src/`로 옮겨 한 곳에서 관리하고 테스트한다. 한 번 보고 마는 탐색과 특정 run을 들여다보는 일회성 확인은 notebook의 일이다. 탐색 결과가 논문에 들어가기로 정해지면 그때 스크립트로 옮긴다.'''

[[questions.choices]]
text = "notebook 세 개에 복사해 쓰고 있는 결측치 처리 함수"
correct = true

[[questions.choices]]
text = "논문 표의 숫자를 만드는 metric 계산 함수"
correct = true

[[questions.choices]]
text = "데이터 분포를 한 번 훑어보려고 그린 histogram"
feedback = "일회성 탐색은 notebook의 역할이다. 모든 셀을 src로 옮기면 탐색 속도만 떨어진다."

[[questions.choices]]
text = "특정 run 하나의 예측값 몇 개를 눈으로 확인하는 셀"
feedback = "특정 결과를 들여다보는 일회성 확인은 notebook에 두어도 된다. 같은 확인을 매번 반복하게 되면 그때 평가 스크립트의 출력으로 옮긴다."

[[questions]]
id = "run-id-config-hash"
type = "single"
objective = 1
prompt = '''run ID의 뒷부분을 `json.dumps(config, sort_keys=True)`의 SHA-256 앞 8자리로 만든다. 기준 설정 `{"model": {"width": 64}, "train": {"lr": 0.001, "seed": 0}}`과 **같은** hash가 나오는 것은?'''
explanation = '''`sort_keys=True`는 모든 깊이의 키를 정렬해 직렬화하므로, 키 순서만 다른 설정은 같은 문자열이 되고 같은 hash가 된다. 반면 값의 **타입**이 달라지면 JSON 문자열이 달라진다. `64`와 `64.0`, `0.001`과 `"0.001"`은 사람 눈에는 같아 보여도 다른 hash를 만든다. 설정을 읽을 때 타입을 검증해야 하는 이유 중 하나다(6.3장).'''

[[questions.choices]]
text = '''`{"train": {"seed": 0, "lr": 0.001}, "model": {"width": 64}}`'''
correct = true

[[questions.choices]]
text = '''`{"model": {"width": 64}, "train": {"lr": 0.001, "seed": 1}}`'''
feedback = "seed가 다르다. 결과가 달라질 수 있는 실행이므로 다른 hash가 나오는 것이 맞다."

[[questions.choices]]
text = '''`{"model": {"width": 64.0}, "train": {"lr": 0.001, "seed": 0}}`'''
feedback = "JSON에서 64는 \"64\", 64.0은 \"64.0\"으로 직렬화된다. 값이 같아 보여도 타입이 다르면 hash가 달라진다."

[[questions.choices]]
text = '''`{"model": {"width": 64}, "train": {"lr": "0.001", "seed": 0}}`'''
feedback = "문자열 \"0.001\"은 숫자 0.001과 다르게 직렬화된다. 설정 파일이나 명령행에서 숫자가 문자열로 들어오는 실수가 이런 차이를 만든다."

[[questions]]
id = "template-benefit"
type = "single"
objective = 3
prompt = '''연구실 공통 프로젝트 템플릿을 쓰는 가장 중요한 이유는?'''
explanation = '''템플릿이 공유하는 것은 코드의 내용이 아니라 **자리**다. 진입점·설정·테스트·출력이 프로젝트마다 같은 곳에 있으면, 동료는 처음 보는 프로젝트에서도 어디부터 읽을지 알고, CI·lint·실행 스크립트 같은 도구를 고치지 않고 재사용할 수 있다. 템플릿만으로 재현성이 보장되지는 않는다. 설정 기록(6.3장)과 환경 고정(3부)이 따로 필요하다.'''

[[questions.choices]]
text = "모든 프로젝트가 같은 모델 코드를 공유하게 되어 중복이 사라진다."
feedback = "템플릿은 구조를 공유하지 코드를 공유하지 않는다. 여러 프로젝트가 정말 같은 코드를 쓴다면 템플릿이 아니라 별도 패키지로 만든다."

[[questions.choices]]
text = "어느 프로젝트든 진입점·설정·테스트·출력이 같은 자리에 있어, 사람과 도구가 프로젝트마다 새로 배우지 않고 쓸 수 있다."
correct = true

[[questions.choices]]
text = "템플릿의 모든 디렉터리를 처음부터 채워야 하므로 설계를 미리 끝내게 된다."
feedback = "빈 디렉터리는 비워 두어도 된다. 템플릿은 코드가 생겼을 때 놓을 자리를 미리 정해 둘 뿐이다."

[[questions.choices]]
text = "템플릿을 따르면 실험 결과의 재현성이 자동으로 보장된다."
feedback = "구조는 재현에 필요한 일을 쉽게 만들 뿐이다. 설정 기록, seed, 환경 고정은 따로 해야 한다."

[[questions]]
id = "premature-abstraction"
type = "single"
objective = 1
prompt = '''두 실험 스크립트에 비슷한 데이터 로딩 코드가 있다. 이 코드를 공통 모듈로 옮기기에 가장 적절한 시점은?'''
explanation = '''두 개의 사례만으로는 무엇이 공통이고 무엇이 실험마다 달라지는지 알기 어렵다. 세 번째 사용처가 생기고, 같은 부분과 달라지는 부분이 분명해졌을 때 공통 모듈로 옮기면 인터페이스를 덜 틀리게 정할 수 있다. 미리 일반화한 추상화는 대개 필요 없는 곳에서 유연하고 필요한 곳에서 경직된다. 반대로 끝까지 복사본을 두면, 한 복사본의 버그 수정이 다른 곳에 반영되지 않는다.'''

[[questions.choices]]
text = "처음 작성할 때부터 어떤 데이터든 받을 수 있는 플러그인 구조로 만든다."
feedback = "아직 오지 않은 변화를 예측한 추상화는 대개 틀린 방향으로 유연하다. 읽고 고치기 어려운 코드만 남는다."

[[questions.choices]]
text = "옮기지 않는다. 실험마다 복사본을 두는 것이 실험의 독립성을 지킨다."
feedback = "복사본 하나의 버그를 고쳐도 다른 복사본에는 반영되지 않는다. 결국 서로 다른 전처리로 만든 결과를 비교하게 된다."

[[questions.choices]]
text = "같은 코드가 세 번째로 필요해지고, 같은 부분과 달라지는 부분이 분명해졌을 때"
correct = true

[[questions.choices]]
text = "한 번만 쓰는 코드라도 `src/`에 있는 코드가 많을수록 좋은 구조이므로 바로 옮긴다."
feedback = "src의 코드는 유지·테스트 대상이다. 한 실험에서만 쓰는 코드는 그 실험 스크립트에 두는 편이 읽기 쉽다."
