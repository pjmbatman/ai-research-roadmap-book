# 6.6 테스트와 디버깅 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "allclose-zero-atol"
type = "single"
objective = 1
prompt = '''표준화한 배열의 열 평균이 0인지 `np.testing.assert_allclose(z.mean(axis=0), 0.0)`으로 테스트했더니, 올바른 구현인데도 실패했다. 열 평균은 `8.4e-16`, `-1.4e-15` 같은 값이다. 원인과 고칠 방법으로 옳은 것은?'''
explanation = '''`assert_allclose`는 $|a - d| \le \text{atol} + \text{rtol} \cdot |d|$를 검사한다. 기본값은 `rtol=1e-7`, `atol=0`이다. 기댓값 $d$가 0이면 상대 허용오차 항이 $\text{rtol} \cdot 0 = 0$이 되어, 허용오차가 정확히 0이 된다. 부동소수점 오차로 생긴 $10^{-15}$ 수준의 값도 통과하지 못한다. 0과 비교할 때는 문제의 크기에 맞는 절대 허용오차를 준다(예: `atol=1e-12`).'''

[[questions.choices]]
text = "기댓값이 0이면 상대 허용오차가 아무 역할을 하지 못하므로, 절대 허용오차 `atol`을 준다."
correct = true

[[questions.choices]]
text = "`rtol`을 `1e-3`처럼 크게 늘린다."
feedback = "기댓값이 0이면 rtol을 얼마로 키워도 rtol × 0 = 0이다. 0과의 비교에는 atol이 필요하다."

[[questions.choices]]
text = "`assert z.mean(axis=0).tolist() == [0.0, 0.0, 0.0, 0.0]`처럼 정확히 비교한다."
feedback = "올바른 구현도 부동소수점 오차 때문에 평균이 정확히 0이 되지 않는다. 정확한 비교는 더 자주 실패한다."

[[questions.choices]]
text = "구현에 버그가 있다는 뜻이므로 구현을 고친다."
feedback = "1e-15 수준의 평균은 float64 계산에서 정상적인 반올림 오차다. 테스트가 이 오차를 허용하도록 고쳐야 한다."

[[questions]]
id = "test-duplicates-implementation"
type = "single"
objective = 1
prompt = '''metric 함수를 테스트하면서, 기댓값을 구현 코드와 같은 식으로 테스트 안에서 다시 계산해 비교했다. 이 테스트의 가장 큰 약점은?

```python
def test_rmse():
    y, y_hat = make_data()
    expected = np.sqrt(np.mean((y - y_hat) ** 2))   # 구현과 같은 식
    assert rmse(y, y_hat) == expected
```'''
explanation = '''테스트가 구현을 복제하면, 식 자체가 틀렸을 때(예: 제곱근을 빠뜨림, 잘못된 축으로 평균) 구현과 테스트가 함께 틀려서 통과한다. 이 테스트가 잡는 것은 "식을 옮겨 적다가 생긴 오타"뿐이다. 기댓값은 구현과 독립적인 근거에서 와야 한다: 손으로 계산할 수 있는 작은 예(오차 [3, 4]의 RMSE는 $\sqrt{12.5}$), 알려진 성질(오차가 0이면 0, 모든 오차가 상수 $c$이면 $|c|$), 더 느리지만 다른 방법의 구현. 덤으로 `==` 비교는 계산 순서만 바뀌어도 깨진다.'''

[[questions.choices]]
text = "식 자체가 틀렸다면 구현과 테스트가 똑같이 틀려 함께 통과하므로, 그 오류를 잡지 못한다."
correct = true

[[questions.choices]]
text = "약점이 없다. 같은 식으로 계산했으니 가장 정확한 기댓값이다."
feedback = "같은 식이라는 것이 문제다. 기댓값이 구현과 같은 가정에서 나오면, 그 가정이 틀렸을 때 테스트가 알려 주지 못한다."

[[questions.choices]]
text = "`make_data()`가 무작위이면 테스트가 불안정하다는 것이 유일한 약점이다."
feedback = "시드를 고정하면 해결되는 부차적 문제다. 더 큰 문제는 기댓값이 구현을 복제했다는 점이다."

[[questions.choices]]
text = "테스트가 너무 짧다. 같은 비교를 여러 데이터로 반복하면 해결된다."
feedback = "같은 식으로 계산한 기댓값과 비교하는 한, 데이터를 몇 개로 늘려도 식의 오류는 드러나지 않는다."

[[questions]]
id = "what-to-test-first"
type = "multiple"
objective = 1
prompt = "시간이 한정되어 있다. 재료 물성 예측 프로젝트에서 **먼저** 작성해야 할 테스트를 모두 고르시오. (같은 시료를 여러 번 측정한 데이터다.)"
explanation = '''우선순위의 기준은 "이 부분이 틀리면 논문의 결론이 바뀌는가"다. 같은 시료가 train과 test에 나뉘어 들어가면 test 점수가 과대평가된다. batch 크기에 따라 달라지는 metric은 모델 비교를 뒤집을 수 있다. checkpoint에서 재개한 학습이 다르면 긴 실험의 결과를 믿을 수 없다. 반면 설정 객체의 getter나 그림의 색은 틀려도 결론이 바뀌지 않고, 틀리면 눈으로 바로 보인다. 테스트하기 쉬운 것부터 테스트하면 이런 테스트만 쌓인다.'''

[[questions.choices]]
text = "같은 시료 ID가 train과 test에 동시에 들어가지 않는지"
correct = true

[[questions.choices]]
text = "batch 크기를 바꿔도 평가 metric 값이 같은지"
correct = true

[[questions.choices]]
text = "checkpoint에서 재개한 학습이 중단 없이 학습한 결과와 같은지"
correct = true

[[questions.choices]]
text = "설정 dataclass의 각 필드를 읽고 쓸 수 있는지"
feedback = "dataclass의 필드 접근은 Python이 보장한다. 쉽게 쓸 수 있지만 틀릴 가능성도, 틀렸을 때 결론에 미치는 영향도 거의 없다."

[[questions.choices]]
text = "결과 그림의 색과 글꼴이 연구실 규칙과 같은지"
feedback = "그림 스타일은 틀리면 눈에 바로 보이고 결론을 바꾸지 않는다. 테스트를 쓸 시간은 조용히 틀리는 부분에 쓴다."

[[questions]]
id = "pdb-on-failure"
type = "single"
objective = 2
prompt = "실패를 재현하는 테스트가 하나 있다. 실패하는 순간의 지역 변수(배열의 shape, 중간 값)를 보고 싶다. 가장 효율적인 방법은?"
explanation = '''`pytest --pdb`는 테스트가 실패하거나 예외가 난 지점에서 디버거(pdb)를 연다. 그 자리에서 `p x.shape`로 값을 보고, `u`/`d`로 호출 스택을 오르내리며 각 함수의 지역 변수를 확인할 수 있다. 가설이 틀렸으면 다른 변수를 바로 보면 된다. 특정 줄에서 멈추고 싶으면 코드에 `breakpoint()`를 넣는다. `print`를 넣는 방법도 동작하지만, 볼 변수를 미리 정해야 하고 가설이 바뀔 때마다 코드를 고쳐 다시 실행해야 한다.'''

[[questions.choices]]
text = "`pytest --pdb`로 실행해 실패 지점에서 열린 디버거로 변수를 보고 호출 스택을 오르내린다."
correct = true

[[questions.choices]]
text = "의심 가는 곳마다 `print`를 넣고 다시 실행한다. 디버거는 원격 서버에서 쓸 수 없다."
feedback = "print도 동작하지만 가설마다 코드를 고치고 다시 실행해야 한다. pdb는 터미널만 있으면 되므로 SSH로 접속한 서버에서도 쓸 수 있다."

[[questions.choices]]
text = "테스트를 `try/except`로 감싸 예외를 무시하고 끝까지 실행되게 한 뒤 결과를 본다."
feedback = "예외를 삼키면 실패 지점의 정보가 사라진다. 실패는 숨기는 대상이 아니라 조사하는 대상이다."

[[questions.choices]]
text = "traceback의 마지막 줄만 읽으면 변수 값까지 알 수 있다."
feedback = "traceback은 어느 줄에서 실패했는지 알려 주지만 변수 값은 보여 주지 않는다(pytest는 assert 문의 값 일부를 보여 준다). 값을 보려면 디버거가 필요하다."

[[questions]]
id = "bisect-steps"
type = "numeric"
objective = 2
prompt = "통과하던 커밋 A 이후 실패하는 커밋 B까지 1,024개의 커밋이 있다(B 포함). 첫 실패 커밋을 이분 탐색으로 찾을 때, 최악의 경우 테스트를 몇 번 실행해야 하는가? (A는 통과, B는 실패로 이미 알고 있다.)"
answer = 10
tolerance = 0
slider = { min = 1, max = 32, step = 1, unit = "번" }
explanation = '''첫 실패 커밋의 후보는 A 다음부터 B까지 1,024개다. 테스트 한 번마다 후보가 절반으로 줄어든다(가운데 커밋이 통과하면 뒤쪽 절반, 실패하면 앞쪽 절반이 남는다). $2^{10} = 1024$이므로 10번이면 후보가 하나로 줄어든다. 하나씩 차례로 시험하면 최악의 경우 1,023번이다. 이 차이 때문에 `git bisect`는 수천 개의 커밋 사이에서도 실용적이다. 단, 테스트가 무작위로 실패하면(flaky) 한 번의 잘못된 판정이 탐색 전체를 엉뚱한 곳으로 보낸다.'''

[[questions]]
id = "flaky-test-in-ci"
type = "single"
objective = 3
prompt = "CI에서 학습 smoke test가 대략 20번에 한 번 실패한다. 실패한 job을 다시 실행하면 대개 통과한다. 올바른 대응은?"
explanation = '''이런 테스트를 flaky test라 한다. 원인은 대개 고정하지 않은 난수, 실행 순서·병렬성에 따라 달라지는 계산, 너무 빡빡한 허용오차다. 시드를 고정하고, 허용오차를 문제의 수치 정밀도나 통계적 변동(여러 시드에서 관측한 범위)에 근거해 정한다. "다시 돌리면 통과"를 습관으로 만들면 CI의 빨간불이 아무 의미가 없어지고, 진짜 회귀도 "또 그거겠지"로 넘기게 된다.'''

[[questions.choices]]
text = "원인(고정하지 않은 시드, 근거 없는 허용오차 등)을 찾아, 같은 코드에서는 항상 같은 판정이 나오게 고친다."
correct = true

[[questions.choices]]
text = "실패하면 통과할 때까지 job을 다시 실행한다. 대부분 통과하므로 코드는 정상이다."
feedback = "20번에 한 번 실패하는 테스트는 진짜 회귀가 생겨도 '또 그거겠지'로 넘기게 만든다. CI의 판정을 믿을 수 없게 된다."

[[questions.choices]]
text = "테스트를 삭제한다. 불안정한 테스트는 없는 것보다 나쁘다."
feedback = "그 테스트가 지키던 불변조건이 사라진다. 삭제가 아니라 결정적(deterministic)으로 고치는 것이 먼저다."

[[questions.choices]]
text = "허용오차를 100배로 늘린다."
feedback = "근거 없이 늘린 허용오차는 진짜 버그도 통과시킨다. 허용오차는 수치 정밀도나 여러 시드에서 관측한 변동에 근거해 정한다."
