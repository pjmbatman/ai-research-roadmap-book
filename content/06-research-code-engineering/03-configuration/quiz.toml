# 6.3 설정 관리 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "cwd-relative-path"
type = "single"
objective = 1
prompt = '''`src/my_project/data.py` 안에 `open("data/train.csv")`가 있다. 프로젝트 root에서 실행하면 동작하는데, `notebooks/`에서 실행한 notebook이 이 함수를 부르면 `FileNotFoundError`가 난다. 상대 경로 `"data/train.csv"`는 무엇을 기준으로 해석되는가?'''
explanation = '''`open`에 넘긴 상대 경로는 코드가 있는 파일이나 프로젝트 root가 아니라 **현재 작업 디렉터리**(current working directory)를 기준으로 해석된다. notebook 커널의 작업 디렉터리는 보통 notebook 파일이 있는 `notebooks/`이므로 `notebooks/data/train.csv`를 찾는다. 경로는 설정에서 받고, 상대 경로라면 프로젝트 root처럼 정해진 기준에 붙여 절대 경로로 바꾼 뒤 쓴다.'''

[[questions.choices]]
text = "그 코드가 들어 있는 파일(`data.py`)의 위치"
feedback = "파일 위치를 기준으로 하려면 `Path(__file__).parent`를 직접 붙여야 한다. `open`은 그렇게 하지 않는다."

[[questions.choices]]
text = "현재 작업 디렉터리"
correct = true

[[questions.choices]]
text = "`pyproject.toml`이 있는 프로젝트 root"
feedback = "Python은 프로젝트 root라는 개념을 모른다. root를 기준으로 하려면 코드가 root를 찾아 경로를 붙여야 한다."

[[questions.choices]]
text = "`sys.path`의 첫 번째 항목"
feedback = "`sys.path`는 import할 모듈을 찾는 경로 목록이다. 파일 열기와는 관계가 없다."

[[questions]]
id = "shallow-merge"
type = "single"
objective = 2
prompt = '''`defaults = {"model": {"width": 64, "depth": 3}, "train": {"lr": 0.001}}`, `exp = {"model": {"width": 128}}`일 때 `{**defaults, **exp}["model"]`은?'''
explanation = '''`{**a, **b}`는 **최상위** 키만 병합한다. `model` 키의 값이 통째로 `exp`의 `{"width": 128}`으로 바뀌므로 `depth`가 사라진다. 이후 코드가 `cfg["model"]["depth"]`를 읽으면 `KeyError`가 나고, `.get("depth", 2)`처럼 기본값을 주는 코드라면 조용히 다른 값으로 실행된다. 중첩 설정에는 깊은 병합이 필요하다.'''

[[questions.choices]]
text = '''`{"width": 128}`'''
correct = true

[[questions.choices]]
text = '''`{"width": 128, "depth": 3}`'''
feedback = "깊은 병합의 결과다. `{**a, **b}`는 중첩 dict 안으로 들어가지 않는다."

[[questions.choices]]
text = '''`{"width": 64, "depth": 3}`'''
feedback = "뒤에 펼친 dict의 값이 우선한다. `model` 키는 `exp`의 값으로 바뀐다."

[[questions.choices]]
text = "같은 키가 두 번 나와 오류가 난다."
feedback = "dict 펼치기에서 같은 키는 뒤의 값이 덮어쓴다. 오류는 나지 않는다."

[[questions]]
id = "dataclass-no-type-check"
type = "single"
objective = 2
prompt = '''다음 코드의 결과는?

```python
from dataclasses import dataclass

@dataclass
class TrainConfig:
    seed: int = 0

cfg = TrainConfig(seed="0")
```'''
explanation = '''dataclass의 type hint는 **실행 중에 검사되지 않는다**. `TrainConfig(seed="0")`은 오류 없이 `seed`가 문자열 `'0'`인 객체를 만든다. 이 값은 나중에 난수 생성기에 들어갈 때 오류를 내거나, 더 나쁘게는 문자열로 hash되어 다른 run ID를 만든다. 타입 검증이 필요하면 `__post_init__`에서 직접 검사하거나, 검증 기능이 있는 라이브러리(pydantic 등)를 쓴다. mypy 같은 정적 검사기는 코드에 쓴 리터럴은 잡지만, 설정 파일에서 읽어 온 값은 실행 전에 알 수 없다.'''

[[questions.choices]]
text = "`TypeError`가 난다."
feedback = "dataclass는 생성자에서 타입을 검사하지 않는다. type hint는 문서와 정적 분석을 위한 것이다."

[[questions.choices]]
text = "`seed`가 정수 0으로 변환된다."
feedback = "dataclass는 값을 변환하지 않는다. 변환과 검증을 하는 라이브러리도 있지만 표준 dataclass는 아니다."

[[questions.choices]]
text = "오류 없이 `seed`가 문자열 `'0'`인 객체가 만들어진다."
correct = true

[[questions.choices]]
text = "mypy가 실행 중에 오류를 낸다."
feedback = "mypy는 실행 전 정적 검사기이고 실행 중에는 아무것도 하지 않는다. 설정 파일에서 읽은 값의 타입은 정적 검사로 알 수 없다."

[[questions]]
id = "string-lr-remedy"
type = "single"
objective = 2
prompt = '''YAML 설정의 `lr: 1e-3`이 문자열로 읽혀(YAML 1.1 규칙을 따르는 로더에서 생기는 일이다), 학습 중간에 optimizer가 `TypeError`를 냈다. 가장 좋은 대응은?'''
explanation = '''설정은 읽는 시점에 한 번 타입과 범위를 검증하고, 실패하면 즉시 멈춰야 한다. 그러면 오류가 학습 도중이 아니라 시작 직후에, "train.lr은 float여야 한다"처럼 원인을 가리키는 메시지로 나온다. 사용하는 곳마다 `float()`를 붙이면 검증이 흩어지고 빠지는 곳이 생긴다. 사람이 표기법을 조심하는 것은 다음 사람에게 전해지지 않는다.'''

[[questions.choices]]
text = "optimizer를 만드는 곳에서 `float(cfg['lr'])`로 변환한다."
feedback = "lr을 쓰는 곳이 여러 곳이면 모두 고쳐야 하고, 하나라도 빠지면 같은 문제가 남는다. 다른 키의 같은 문제도 막지 못한다."

[[questions.choices]]
text = "설정을 읽은 직후 설정 객체로 바꾸며 타입을 검증해, 잘못된 값이면 실행을 시작하기 전에 실패시킨다."
correct = true

[[questions.choices]]
text = "앞으로는 `1.0e-3`처럼 소수점을 넣어 쓰도록 연구실에 공지한다."
feedback = "사람의 주의에 의존하는 규칙은 지켜지지 않는다. 같은 종류의 다른 실수(예: `yes`가 불리언으로 읽힘)도 막지 못한다."

[[questions.choices]]
text = "설정 파일을 쓰지 않고 학습률을 코드에 상수로 둔다."
feedback = "문제를 피하는 대신 실험마다 코드를 고치게 되어, 어떤 실행이 어떤 값을 썼는지 추적할 수 없게 된다."

[[questions]]
id = "resolved-config-timing"
type = "single"
objective = 3
prompt = '''기본 설정 파일, 실험 파일, 명령행 override를 병합해 실행한다. 실행의 설정을 언제, 무엇을 저장해야 하는가?'''
explanation = '''저장해야 하는 것은 모든 병합과 검증을 마친 **최종 설정**(resolved config)이다. 그리고 학습을 시작하기 **전에** 저장해야 중간에 실패한 실행도 어떤 설정이었는지 남는다. 기본 설정 파일의 복사본은 override를 빠뜨리고, 명령행 문자열만 남기면 나중에 기본값이 바뀌었을 때 같은 명령이 다른 설정을 만든다.'''

[[questions.choices]]
text = "실행 시작 시 `configs/default.toml`을 run 디렉터리에 복사한다."
feedback = "실험 파일과 명령행 override가 빠진다. 저장된 설정과 실제 실행 설정이 달라지는 대표적인 경로다."

[[questions.choices]]
text = "모든 병합과 검증을 마친 최종 설정을, 학습을 시작하기 전에 저장한다."
correct = true

[[questions.choices]]
text = "학습이 정상적으로 끝난 뒤 최종 설정을 저장한다."
feedback = "중간에 실패하거나 중단된 실행은 설정이 남지 않는다. 실패한 실행의 설정이야말로 원인을 찾는 데 필요하다."

[[questions.choices]]
text = "실행한 명령행 문자열만 저장한다. 같은 명령을 다시 실행하면 된다."
feedback = "같은 명령도 기본 설정 파일이나 코드 속 기본값이 바뀌면 다른 설정을 만든다. 명령행은 함께 남기되 최종 설정을 대신하지 못한다."

[[questions]]
id = "restore-requirements"
type = "multiple"
objective = 3
prompt = '''결과 파일 하나에서 그 결과를 만든 실행을 정확히 다시 만들려 한다. resolved config 외에 함께 기록해야 하는 것을 모두 고르시오.'''
explanation = '''같은 설정이라도 코드가 다르면 다른 결과가 나온다. 그래서 코드 revision(커밋 해시)과, 그 시점에 커밋되지 않은 변경이 있었는지(dirty 여부)를 함께 남긴다. dirty였다면 커밋 해시만으로는 그 코드를 복원할 수 없다. 데이터 경로가 같아도 파일 내용이 바뀌었을 수 있으므로 데이터 버전이나 checksum도 필요하다. 실행 시간은 결과의 일부로 남길 가치가 있지만 재현에 필요한 입력은 아니다.'''

[[questions.choices]]
text = "코드 revision(커밋 해시)"
correct = true

[[questions.choices]]
text = "실행 시점에 커밋되지 않은 변경이 있었는지 여부"
correct = true

[[questions.choices]]
text = "데이터의 버전 또는 checksum"
correct = true

[[questions.choices]]
text = "학습에 걸린 wall-clock 시간"
feedback = "성능 비교에는 유용하지만, 실행을 다시 만드는 데 필요한 입력은 아니다."
