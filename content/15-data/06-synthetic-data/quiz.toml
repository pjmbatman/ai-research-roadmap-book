# 15.6 합성 데이터와 시뮬레이션 데이터 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "config-reproducibility"
type = "multiple"
objective = 1
prompt = '''다른 연구자가 시뮬레이션 데이터셋을 바이트 단위로 똑같이 다시 만들 수 있으려면 무엇을 기록해야 하는가? 모두 고르시오.'''
explanation = '''시뮬레이션 데이터셋은 (시뮬레이터 코드, 파라미터 범위와 실험 설계, 난수 시드, solver 설정)의 함수다. 하나라도 빠지면 같은 데이터를 만들 수 없다. solver의 step 크기나 tolerance가 다르면 같은 파라미터에서도 출력이 달라진다(9.6장). 생성된 파일의 이름은 결과를 가리킬 뿐 만드는 방법을 담지 않는다. 설정을 한 파일로 모아 해시를 기록하면 "어떤 설정으로 만든 데이터인가"를 한 값으로 추적할 수 있다.'''

[[questions.choices]]
text = "시뮬레이터 코드의 버전(커밋)"
correct = true

[[questions.choices]]
text = "파라미터 범위와 실험 설계 방법(grid·LHS·Sobol 등), 표본 수"
correct = true

[[questions.choices]]
text = "난수 시드와 solver 설정(step 크기, tolerance)"
correct = true

[[questions.choices]]
text = "생성된 데이터 파일의 이름"
feedback = "파일 이름은 결과를 가리킬 뿐, 그 결과를 다시 만드는 방법을 담지 않는다. 설정과 코드 버전이 필요하다."

[[questions]]
id = "grid-projection"
type = "numeric"
objective = 2
prompt = '''파라미터 2개에 대해 4 × 4 격자로 16번 시뮬레이션했다. 첫 번째 파라미터 축에서 서로 다른 값은 몇 개 시험되었는가?'''
answer = 4
tolerance = 0
slider = { min = 1, max = 16, step = 1, unit = "개" }
explanation = '''격자는 축마다 4개의 값만 쓰고 각 값을 4번씩 반복한다. 출력이 주로 첫 번째 파라미터에 의존한다면, 16번의 실행 중 실제 정보는 4가지 값에 대한 것뿐이다. 같은 16번으로 Latin hypercube나 Sobol 수열을 쓰면 축마다 16개의 서로 다른 값을 시험한다(본문 실행 결과).'''

[[questions]]
id = "grid-curse"
type = "numeric"
objective = 2
prompt = '''파라미터 6개를 각각 10단계로 나누는 완전 격자 설계는 시뮬레이션을 몇 번 실행해야 하는가?'''
answer = 1000000
tolerance = 0
explanation = '''완전 격자의 실행 수는 단계 수의 차원 거듭제곱, $10^6 = 1{,}000{,}000$이다. 한 번에 1분이 걸리면 약 2년이다. 차원이 늘면 격자는 금방 불가능해진다. Latin hypercube나 Sobol 수열은 실행 수를 차원과 무관하게 정할 수 있고, 적은 수로도 축마다 많은 값을 시험한다.'''

[[questions]]
id = "lhs-property"
type = "single"
objective = 2
prompt = '''$n$개 점의 Latin hypercube 표본에 대해 항상 성립하는 것은?'''
explanation = '''LHS는 각 축을 $n$개 구간으로 나누어 모든 축에서 구간마다 정확히 한 점이 있게 한다. 그래서 1차원 투영(주변 분포)은 고르게 덮인다. 그러나 축 사이의 짝은 무작위이므로, 여러 차원을 함께 보았을 때 빈 영역이 없다는 보장은 없다. 다차원 균일성을 더 높이려면 최적화된 LHS나 Sobol 같은 저불일치 수열을 쓴다.'''

[[questions.choices]]
text = "각 축을 $n$개 구간으로 나누면, 모든 축에서 구간마다 정확히 한 점이 있다."
correct = true

[[questions.choices]]
text = "다차원 공간의 어느 영역에도 빈 곳이 생기지 않는다."
feedback = "LHS가 보장하는 것은 축마다의(1차원) 균등함이다. 축 사이의 짝은 무작위라, 극단적으로는 모든 점이 대각선 근처에 놓일 수도 있다."

[[questions.choices]]
text = "같은 개수의 무작위 표본보다 항상 discrepancy가 작다."
feedback = "대개 작지만 '항상'은 아니다. LHS도 무작위 순열에 의존하므로 운이 나쁜 표본이 있을 수 있다."

[[questions.choices]]
text = "점들이 격자의 교차점에 놓인다."
feedback = "격자와 달리 LHS는 축마다 n개의 서로 다른 값을 쓴다. 점은 각 구간 안의 무작위 위치에 놓인다."

[[questions]]
id = "domain-classifier-auc"
type = "single"
objective = 3
prompt = '''시뮬레이션 샘플과 실측 샘플을 섞어, 어느 쪽에서 왔는지 맞히는 분류기를 학습했다. 교차검증 AUC가 0.91이다. 이것이 뜻하는 것은?'''
explanation = '''두 분포가 같다면 어떤 분류기도 출처를 맞히지 못해 AUC가 0.5 근처에 머문다. 0.91은 시뮬레이션과 실측이 입력 공간에서 쉽게 구별된다는 뜻, 즉 domain gap이 크다는 뜻이다. 다만 AUC가 0.5라고 해서 간극이 없다고 증명되지는 않는다. 그 분류기가 차이를 못 찾았을 뿐이다. 어떤 특징이 구별에 쓰였는지 보면 시뮬레이터가 놓친 현상을 찾는 단서가 된다.'''

[[questions.choices]]
text = "시뮬레이션과 실측의 입력 분포가 쉽게 구별될 만큼 다르다. 즉 domain gap이 크다."
correct = true

[[questions.choices]]
text = "분류기가 정확하므로 시뮬레이터가 실측을 잘 재현한다."
feedback = "방향이 반대다. 출처를 잘 맞힐수록 두 데이터가 다르다는 뜻이다. 재현이 완벽하면 AUC는 0.5 근처가 된다."

[[questions.choices]]
text = "시뮬레이션으로 학습한 모델의 실측 오차가 9% 정도다."
feedback = "AUC는 두 분포를 구별하는 정도이지 예측 오차가 아니다. 간극이 예측 성능에 미치는 영향은 실측 label로 따로 재야 한다."

[[questions.choices]]
text = "AUC가 0.5보다 크므로 과적합이 일어났다."
feedback = "교차검증으로 잰 AUC이므로 과적합이 아니라 실제로 구별 가능한 차이를 반영한다."

[[questions]]
id = "sim-only-claim"
type = "single"
objective = 3
prompt = '''시뮬레이터의 기본 파라미터로 만든 데이터를 무작위로 나누어 학습·평가했고, test 오차가 매우 작았다. 이 결과로 주장할 수 있는 것은?'''
explanation = '''같은 시뮬레이터, 같은 파라미터에서 나온 test는 "이 시뮬레이터의 이 설정 안에서" 잘 맞는다는 것만 보여 준다. 실제 계의 다른 파라미터, 시뮬레이터가 모르는 물리(비선형성, 센서 특성), 측정 잡음에 대한 일반화는 이 결과로 알 수 없다. 파라미터 범위를 실험 설계로 덮고, 실측 데이터로 따로 검증해야 일반화를 주장할 수 있다.'''

[[questions.choices]]
text = "그 시뮬레이터의 그 설정 안에서 모델이 잘 맞는다는 것까지만 주장할 수 있다."
correct = true

[[questions.choices]]
text = "시뮬레이터가 물리 법칙에 기반하므로 실제 계에서도 같은 오차를 낼 것이다."
feedback = "시뮬레이터는 실제 계의 근사다. 모르는 물리와 센서 특성이 빠져 있으면 본문의 예처럼 실측 오차가 몇 배로 커진다."

[[questions.choices]]
text = "데이터를 무작위로 나누었으므로 일반화가 증명되었다."
feedback = "분할이 무작위여도 train과 test가 같은 생성 과정에서 나왔다. 일반화 대상(실제 계, 다른 파라미터)이 test에 없다."

[[questions.choices]]
text = "데이터를 더 많이 생성하면 실제 계에 대한 일반화가 보장된다."
feedback = "같은 설정으로 데이터를 늘려도 시뮬레이터의 가정은 그대로다. 간극은 데이터 양이 아니라 생성 과정의 차이에서 온다."
