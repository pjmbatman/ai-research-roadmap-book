# 15.2 저장 형식과 대용량 데이터 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "csv-rounding-error"
type = "numeric"
objective = 1
prompt = '''전압(V)을 CSV로 저장하면서 `float_format="%.3f"`로 소수 셋째 자리까지만 썼다. 다시 읽은 값과 원래 값의 차이는 최대 몇 V인가?'''
answer = 0.0005
tolerance = 0.00005
explanation = '''소수 셋째 자리로 반올림하면 오차는 마지막 자리 간격 0.001의 절반, 즉 최대 0.0005 V다. 본문의 실행 결과도 5.0e-04였다. 텍스트 형식은 쓰는 자릿수만큼만 정보를 담는다. 센서 분해능보다 큰 반올림 오차를 넣지 않으려면 자릿수를 데이터 사전의 분해능에 맞추거나, 값을 그대로 보존하는 이진 형식을 쓴다.'''

[[questions]]
id = "columnar-partial-read"
type = "single"
objective = 1
prompt = '''열 200개, 행 1억 개인 표에서 두 열의 평균만 필요하다. 같은 데이터를 CSV와 Parquet으로 저장해 두었을 때 옳은 설명은?'''
explanation = '''Parquet은 열 지향 형식이라 열마다 따로 저장되고, 필요한 열의 데이터만 읽을 수 있다. CSV는 행 단위 텍스트이므로 두 열만 필요해도 모든 줄을 읽고 구분자를 따라 파싱해야 한다. 열 지향 저장은 같은 종류의 값이 붙어 있어 압축도 잘 된다.'''

[[questions.choices]]
text = "Parquet은 필요한 두 열만 읽을 수 있고, CSV는 모든 줄을 읽고 파싱해야 한다."
correct = true

[[questions.choices]]
text = "CSV도 `usecols`로 두 열만 고르면 디스크에서 두 열만 읽는다."
feedback = "usecols는 파싱 결과에서 열을 고를 뿐이다. 행 단위 텍스트에서는 줄 안의 위치를 알 수 없으므로 모든 바이트를 읽고 구분자를 찾아야 한다."

[[questions.choices]]
text = "두 형식 모두 전체 파일을 읽어야 하므로 속도는 압축률로만 결정된다."
feedback = "열 지향 형식의 핵심 이점은 읽지 않아도 되는 열을 건너뛰는 것이다. 압축은 그다음 이점이다."

[[questions.choices]]
text = "Parquet은 압축되어 있으므로 압축을 풀기 위해 CSV보다 항상 느리다."
feedback = "압축 해제 비용보다 디스크에서 읽는 바이트 수를 줄이는 이득이 대개 더 크다. 게다가 198개 열은 아예 읽지 않는다."

[[questions]]
id = "npy-row-offset"
type = "numeric"
objective = 2
prompt = '''헤더가 128 bytes인 NPY 파일에 shape (N, 3)의 float64 배열이 행 우선(C) 순서로 저장되어 있다. 0부터 센 10번째 행은 파일의 몇 번째 byte에서 시작하는가? (파일 첫 byte를 0으로 센다)'''
answer = 368
tolerance = 0
explanation = '''한 행은 3 × 8 = 24 bytes다. 10번째 행 앞에는 헤더 128 bytes와 행 10개(240 bytes)가 있으므로 시작 위치는 128 + 240 = 368이다. 고정 폭 이진 형식은 이 계산 하나로 원하는 행으로 바로 갈 수 있다(random access). 줄마다 길이가 다른 CSV는 앞의 줄을 모두 읽어야 위치를 안다.'''

[[questions]]
id = "small-files"
type = "single"
objective = 2
prompt = '''이미지 샘플 수백만 개가 각각 별도 파일로 클러스터의 공유 파일시스템에 있다. 학습 중 GPU가 자주 데이터를 기다린다. 가장 근본적인 개선은?'''
explanation = '''공유 파일시스템에서는 파일마다 열기·메타데이터 조회 비용이 든다. 파일이 수백만 개면 데이터 양보다 파일 수가 병목이 된다. 샘플을 수천 개씩 묶은 큰 파일(shard)과 색인으로 바꾸면 순차 읽기가 늘고 메타데이터 요청이 줄어든다. 학습 중에는 shard 순서와 shard 안의 순서를 섞어 무작위성을 유지한다.'''

[[questions.choices]]
text = "샘플을 큰 shard 파일 여러 개로 묶고, 색인으로 샘플 위치를 찾는다."
correct = true

[[questions.choices]]
text = "파일마다 gzip으로 압축해 크기를 줄인다."
feedback = "파일 수는 그대로다. 병목은 바이트 수가 아니라 파일마다 드는 열기·메타데이터 비용이다. 압축 해제 비용만 더해진다."

[[questions.choices]]
text = "각 이미지를 CSV로 바꿔 텍스트로 저장한다."
feedback = "파일 수는 그대로이고 크기와 파싱 비용은 늘어난다."

[[questions.choices]]
text = "DataLoader의 worker 수를 계속 늘린다."
feedback = "어느 정도는 도움이 되지만, 공유 파일시스템의 메타데이터 서버가 병목이면 worker를 늘릴수록 서버 부하만 커진다. 다른 사용자에게도 피해를 준다(2.5장)."

[[questions]]
id = "streaming-variance"
type = "single"
objective = 2
prompt = '''Unix 시각(약 $1.7 \times 10^9$ s)처럼 큰 offset 위에서 조금씩 변하는 값의 분산을, 덩어리마다 $\sum x$와 $\sum x^2$만 누적해 $\mathbb{E}[x^2] - (\mathbb{E}[x])^2$로 계산했다. 무엇이 문제인가?'''
explanation = '''$\mathbb{E}[x^2]$와 $(\mathbb{E}[x])^2$는 모두 $10^{18}$ 크기이고, 둘의 차인 분산은 그보다 훨씬 작다. float64의 상대 정밀도는 약 $10^{-16}$이므로 두 수에 이미 수백 정도의 반올림 오차가 들어 있고, 빼면 그 오차만 남는다(소거 오차). 덩어리마다 평균을 먼저 빼서 편차 제곱합을 구하고 병합 공식으로 합치면 이 문제가 없다(연습문제 `chunked-mean-var`).'''

[[questions.choices]]
text = "큰 두 수의 차로 작은 수를 구하므로 유효숫자가 사라져 분산이 0이나 음수로도 나올 수 있다."
correct = true

[[questions.choices]]
text = "덩어리로 나누어 더했기 때문에 합의 순서가 바뀌어 결과가 달라진다. 한 번에 더하면 문제없다."
feedback = "한 번에 계산해도 E[x²] - E[x]²은 같은 소거 오차를 겪는다. 문제는 덩어리가 아니라 공식이다."

[[questions.choices]]
text = "정수 overflow가 생긴다."
feedback = "float64는 10^308까지 표현하므로 10^18은 overflow가 아니다. 문제는 크기가 아니라 상대 정밀도다."

[[questions.choices]]
text = "문제없다. 수학적으로 같은 식이므로 결과도 같다."
feedback = "수학적으로 같은 식도 부동소수점에서는 다른 결과를 낸다(9.1장). 실행해 보면 분산이 0.0으로 나오기도 한다."

[[questions]]
id = "memory-map"
type = "single"
objective = 2
prompt = '''`np.load("x.npy", mmap_mode="r")`로 연 배열에 대한 설명으로 옳은 것은?'''
explanation = '''memory mapping은 파일을 가상 메모리 주소에 대응시키고, 실제 읽기는 배열의 해당 부분에 접근할 때 운영체제가 페이지 단위로 한다. 그래서 RAM보다 큰 파일도 열 수 있고, 일부 행만 쓰면 그 부분만 읽는다. 대신 접근이 흩어져 있으면 디스크를 여러 번 오가야 하므로 접근 패턴이 성능을 정한다.'''

[[questions.choices]]
text = "파일을 바로 읽지 않고, 배열의 일부에 접근할 때 그 부분만 디스크에서 읽는다."
correct = true

[[questions.choices]]
text = "파일 전체를 RAM에 복사한 뒤 읽기 전용으로 표시한다."
feedback = "그것은 일반 np.load다. memory mapping은 필요한 페이지만 읽으므로 RAM보다 큰 파일도 열 수 있다."

[[questions.choices]]
text = "파일을 압축해 메모리 사용량을 줄인다."
feedback = "memory mapping은 압축과 관계없다. 오히려 압축된 데이터에는 쓸 수 없다. 바이트 위치가 계산 가능해야 한다."

[[questions.choices]]
text = "어떤 순서로 접근해도 RAM에 올린 배열과 속도가 같다."
feedback = "처음 접근하는 페이지는 디스크에서 읽어야 한다. 무작위로 흩어진 접근은 순차 접근보다 훨씬 느릴 수 있다."
