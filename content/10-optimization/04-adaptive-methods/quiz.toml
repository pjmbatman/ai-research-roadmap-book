# 10.4 적응적 방법과 학습 레시피 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "adam-first-step"
type = "numeric"
objective = 1
prompt = '''bias correction을 하는 Adam($\beta_1 = 0.9$, $\beta_2 = 0.999$, $\epsilon \approx 0$)을 학습률 $\eta = 0.001$로 시작했다. 첫 gradient가 $\mathbf{g}_1 = (0.02,\ -50)$일 때, 첫 step에서 **두 번째 좌표**가 움직이는 거리(절댓값)는?'''
answer = 0.001
tolerance = 0.00001
explanation = '''첫 step에서 $m_1 = (1 - \beta_1)g_1$, $v_1 = (1 - \beta_2)g_1^2$이고, bias correction 후 $\hat{m}_1 = g_1$, $\hat{v}_1 = g_1^2$이다. 이동량은 $\eta\,\hat{m}_1/\sqrt{\hat{v}_1} = \eta\,g_1/\lvert g_1 \rvert$, 즉 gradient의 크기와 무관하게 좌표마다 $\eta = 0.001$이다. 첫 좌표도 똑같이 0.001 움직인다. SGD라면 두 번째 좌표는 $0.001 \times 50 = 0.05$, 첫 좌표는 $0.00002$만큼 움직였을 것이다.'''

[[questions]]
id = "bias-correction-why"
type = "single"
objective = 1
prompt = '''Adam이 $\hat{m}_t = m_t/(1 - \beta_1^t)$, $\hat{v}_t = v_t/(1 - \beta_2^t)$로 bias correction을 하는 이유는?'''
explanation = '''$m$과 $v$는 0에서 시작하는 지수이동평균이라 초기 몇 step 동안 0 쪽으로 치우친다. $\beta_2 = 0.999$인 $v$는 특히 오래 치우쳐서, 보정하지 않으면 $\sqrt{v}$가 너무 작아 초기 step이 커진다. 본문의 예에서 보정 없는 첫 step은 학습률의 약 3.16배($= 0.1/\sqrt{0.001}$)였다. 보정은 이 초기화 편향만 없애며, $t$가 커지면 보정 계수는 1에 가까워진다.'''

[[questions.choices]]
text = "0에서 시작한 이동평균이 초기에 0 쪽으로 치우친 것을 바로잡기 위해서다. 특히 v가 작게 추정되어 초기 step이 커지는 것을 막는다."
correct = true

[[questions.choices]]
text = "학습률을 시간에 따라 줄이는 decay 역할을 하기 위해서다."
feedback = "보정 계수는 t가 커지면 1로 가므로 학습 후반에는 아무 효과가 없다. 학습률 감소는 스케줄의 역할이다."

[[questions.choices]]
text = "mini-batch gradient의 잡음을 제거하기 위해서다."
feedback = "잡음을 줄이는 것은 이동평균 자체(β1)의 역할이다. bias correction은 초기화로 생긴 편향만 바로잡는다."

[[questions.choices]]
text = "m만 보정하면 충분하고, v의 보정은 수치 안정성을 위한 부가 기능이다."
feedback = "β2 = 0.999인 v의 편향이 더 오래 남는다. v를 보정하지 않으면 초기 step이 커져 불안정해질 수 있다."

[[questions]]
id = "diagonal-preconditioning"
type = "single"
objective = 1
prompt = '''곡률이 $1$과 $100$인 이차함수에서, 골짜기가 좌표축과 나란할 때 RMSProp은 momentum SGD보다 훨씬 빨랐지만, 같은 골짜기를 45도 회전하자 이점이 사라졌다(두 경우 모두 optimizer마다 학습률을 튜닝했다). 이유로 가장 알맞은 것은?'''
explanation = '''RMSProp·Adam의 적응적 스케일링은 **좌표별**(대각) 전처리다. 곡률이 좌표축 방향으로 갈려 있으면 좌표마다 다른 스케일을 줘서 조건수를 사실상 없앨 수 있다. 골짜기가 회전되어 있으면 큰 곡률과 작은 곡률이 두 좌표에 섞여, 좌표별 스케일만으로는 조건수를 줄일 수 없다. 회전은 Hessian의 고윳값(조건수 100)을 바꾸지 않으며, momentum SGD의 성능은 회전과 무관하다.'''

[[questions.choices]]
text = "좌표별 스케일링은 좌표축 방향의 곡률 차이만 보정할 수 있고, 회전된 골짜기의 조건수는 줄이지 못한다."
correct = true

[[questions.choices]]
text = "회전하면 Hessian의 조건수가 커지기 때문이다."
feedback = "회전은 고윳값을 바꾸지 않는다. 두 경우 모두 조건수는 100이다."

[[questions.choices]]
text = "회전된 경우에 RMSProp의 학습률을 잘못 골랐기 때문이다."
feedback = "두 경우 모두 학습률을 격자에서 튜닝했다. 최선의 학습률로도 이점이 사라진다."

[[questions.choices]]
text = "RMSProp은 볼록 함수에서 수렴이 보장되지 않기 때문이다."
feedback = "이 실험에서 RMSProp은 두 경우 모두 수렴했다. 차이는 수렴 여부가 아니라 속도다."

[[questions]]
id = "adam-l2-vs-adamw"
type = "single"
objective = 2
prompt = '''Adam의 gradient에 L2 정규화 항 $\lambda\mathbf{w}$를 더하는 방식(Adam + L2)과 AdamW의 decoupled weight decay의 차이로 옳은 것은?'''
explanation = '''Adam + L2에서는 $\lambda w_i$가 gradient에 섞여 함께 $\sqrt{\hat{v}_i}$로 나뉜다. 과거 gradient가 큰 좌표일수록 $\sqrt{\hat{v}_i}$가 커서 감쇠가 약해진다. AdamW는 감쇠를 적응적 스케일링 밖에서 $\mathbf{w} \leftarrow \mathbf{w} - \eta\lambda\mathbf{w}$로 따로 적용하므로 모든 좌표가 같은 비율로 줄어든다. 본문의 실험에서 Adam + L2는 L2 정규화 문제의 해(좌표마다 0.0099, 0.5, 0.99)로 가고, AdamW는 세 좌표 모두 0.9514로 같았다. SGD에서는 두 방식이 같다.'''

[[questions.choices]]
text = "Adam + L2에서는 감쇠 항도 √v로 나뉘어, gradient가 큰 좌표일수록 덜 감쇠된다. AdamW는 모든 좌표를 같은 비율로 감쇠한다."
correct = true

[[questions.choices]]
text = "SGD에서처럼 Adam에서도 두 방식은 수학적으로 같다."
feedback = "SGD에서는 같지만, Adam은 gradient를 좌표별로 나누므로 감쇠 항이 gradient에 들어가느냐 밖에 있느냐에 따라 결과가 달라진다."

[[questions.choices]]
text = "AdamW의 weight decay는 손실함수에 (λ/2)||w||²를 더한 것과 같다."
feedback = "그것은 Adam + L2의 정의다. AdamW의 감쇠는 손실에 항을 더하는 것으로 표현되지 않는다."

[[questions.choices]]
text = "Adam + L2가 모든 좌표를 더 강하게 감쇠하므로, AdamW보다 항상 작은 가중치를 만든다."
feedback = "좌표마다 다르다. gradient가 작은 좌표는 Adam + L2에서 더 강하게, 큰 좌표는 더 약하게 감쇠된다."

[[questions]]
id = "decay-transfer"
type = "multiple"
objective = 2
prompt = '''weight decay와 L2 정규화에 대해 옳은 것을 모두 고르시오.'''
explanation = '''SGD의 갱신 $\mathbf{w} \leftarrow \mathbf{w} - \eta(\nabla L + \lambda\mathbf{w})$는 $\mathbf{w} \leftarrow (1 - \eta\lambda)\mathbf{w} - \eta\nabla L$과 같으므로 L2 정규화와 weight decay가 같다. Adam에서는 다르다. decoupled weight decay의 실제 감쇠 비율은 step마다 $\eta\lambda$이므로 학습률·스케줄과 엮여 있다. 그래서 같은 $\lambda$ 값이라도 optimizer나 학습률이 바뀌면 효과가 달라지고, 그대로 옮겨 쓸 수 없다.'''

[[questions.choices]]
text = "SGD에서는 L2 정규화와 weight decay가 같은 갱신을 만든다."
correct = true

[[questions.choices]]
text = "Adam에서는 L2 정규화와 decoupled weight decay가 다른 해로 간다."
correct = true

[[questions.choices]]
text = "weight decay 값 λ는 optimizer를 SGD에서 AdamW로 바꿔도 그대로 옮겨 쓸 수 있다."
feedback = "감쇠의 실제 효과는 optimizer와 학습률에 따라 달라진다. optimizer를 바꾸면 λ도 다시 고른다."

[[questions.choices]]
text = "decoupled weight decay의 step당 감쇠 비율은 학습률과 무관하다."
feedback = "흔한 구현(PyTorch의 AdamW 등)에서 감쇠는 w ← w − ηλw로 학습률 η가 곱해진다. 학습률 스케줄이 감쇠의 세기도 바꾼다."

[[questions]]
id = "warmup-reason"
type = "single"
objective = 3
prompt = '''학습률 warm-up(처음 수백~수천 step 동안 학습률을 0 근처에서 목표값까지 올리는 것)을 쓰는 주된 이유로 가장 알맞은 것은?'''
explanation = '''학습 초기에는 파라미터가 무작위 초기값 근처에 있고, 손실 지형의 곡률이나 Adam의 2차 모멘트 추정 같은 통계가 아직 안정되지 않았다. 이때 목표 학습률을 바로 쓰면 손실이 튀거나 발산할 수 있다. 큰 batch로 학습률을 비례해 키울 때 처음 몇 epoch 동안 작은 학습률로 시작하는 warm-up이 초기 최적화의 어려움을 해결했다는 보고가 대표적이다(Goyal 외, 2017). warm-up은 정규화나 국소해 탈출을 위한 장치가 아니다.'''

[[questions.choices]]
text = "학습 초기의 불안정한 상태에서 큰 학습률이 손실을 튀게 하거나 발산시키는 것을 막기 위해서다."
correct = true

[[questions.choices]]
text = "학습 초기에는 gradient가 0에 가까워서 학습률을 낮춰도 손해가 없기 때문이다."
feedback = "초기 gradient는 대개 작지 않다. 오히려 크고 불안정해서 작은 학습률이 필요하다."

[[questions.choices]]
text = "초기에 학습률을 높게 유지해 나쁜 국소해에서 탈출하기 위해서다."
feedback = "warm-up은 초기 학습률을 낮게 시작하는 것이다. 높게 유지하는 것과 반대다."

[[questions.choices]]
text = "최종 모델의 일반화를 높이는 정규화 기법이기 때문이다."
feedback = "warm-up의 주된 목적은 초기 최적화의 안정성이다. 일반화에 영향을 줄 수는 있지만 그것이 설계 이유는 아니다."

[[questions]]
id = "accumulation-divisor"
type = "numeric"
objective = 3
prompt = '''메모리 때문에 batch 64를 한 번에 못 올려, 크기 16인 micro-batch 4개의 gradient를 누적한다. 각 micro-batch의 gradient는 그 micro-batch의 **평균** 손실에 대한 것이다. 누적한 합을 몇으로 나눠야 batch 64의 평균 손실 gradient와 같아지는가?'''
answer = 4
tolerance = 0
slider = { min = 1, max = 64, step = 1 }
explanation = '''평균 손실의 gradient는 샘플별 gradient의 평균이다. 크기가 같은 micro-batch 4개의 평균 gradient를 더하면 전체 평균의 4배가 되므로 4(누적 step 수)로 나눈다. 나누지 않으면 유효 학습률이 4배가 된다. micro-batch 크기가 서로 다르면 단순 평균이 아니라 샘플 수로 가중해야 한다.'''
