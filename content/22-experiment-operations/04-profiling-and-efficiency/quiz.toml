# 22.4 Profiling과 학습 효율화 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "sync-timing"
type = "single"
objective = 1
prompt = '''GPU에서 큰 행렬 곱 한 번의 시간을 `t0 = time.perf_counter(); y = x @ w; t1 = time.perf_counter()`로 쟀더니 수십 마이크로초가 나왔다. 이 숫자에 대한 설명으로 옳은 것은?'''
explanation = '''GPU 연산은 비동기다. `x @ w`는 kernel을 GPU 대기열에 넣고 바로 돌아오므로, 위 코드는 kernel을 **넣는** 시간만 잰다. 실제 계산 시간을 재려면 측정 구간 앞뒤에서 `torch.cuda.synchronize()`로 앞선 작업이 끝나기를 기다리거나, CUDA event로 GPU 쪽 시간을 잰다. 동기화 없이 재면 계산 시간이 뒤에 나오는 `.item()`이나 `print` 같은 동기화 지점에 몰려 엉뚱한 줄이 느려 보인다.'''

[[questions.choices]]
text = "kernel을 대기열에 넣는 시간만 잰 것이다. 앞뒤로 synchronize하거나 CUDA event로 다시 잰다."
correct = true

[[questions.choices]]
text = "GPU가 매우 빠르므로 실제 계산 시간이다."
feedback = "큰 행렬 곱은 GPU에서도 수 밀리초가 걸릴 수 있다. 이 코드는 계산이 끝나기를 기다리지 않는다."

[[questions.choices]]
text = "첫 호출이라 오히려 실제보다 길게 잰 것이다. warm-up 후에는 더 짧아진다."
feedback = "warm-up도 필요하지만, 이 숫자가 작은 이유는 동기화가 없어서다. warm-up만 해도 여전히 대기열에 넣는 시간만 잰다."

[[questions]]
id = "warmup-first-step"
type = "single"
objective = 1
prompt = '''학습 step 100개의 시간을 기록했더니 첫 step이 나머지 평균의 30배였다. 처리량(샘플/초)을 보고할 때 가장 알맞은 처리는?'''
explanation = '''첫 step(들)에는 메모리 할당, cuDNN 알고리즘 선택, `torch.compile`의 컴파일, 데이터 캐시 채우기 같은 일회성 비용이 섞인다. 정상 상태의 처리량을 보고하려면 앞의 몇 step을 warm-up으로 빼고 나머지의 중앙값이나 평균을 쓴다. 다만 일회성 비용 자체도 짧은 실험에서는 무시할 수 없으므로 따로 기록한다. 30배 차이를 그대로 평균에 넣으면 정상 상태 처리량을 크게 과소평가한다.'''

[[questions.choices]]
text = "앞의 몇 step을 warm-up으로 빼고 나머지로 처리량을 계산하며, 일회성 비용은 따로 기록한다."
correct = true

[[questions.choices]]
text = "모든 step을 평균한다. 첫 step도 실제로 걸린 시간이기 때문이다."
feedback = "총 소요 시간을 말할 때는 맞지만, 정상 상태의 처리량을 비교할 때는 일회성 비용이 결과를 왜곡한다. 둘을 나눠 보고한다."

[[questions.choices]]
text = "가장 빠른 step 하나의 시간으로 처리량을 계산한다."
feedback = "최솟값은 잡음이 가장 적은 경우를 보여 주지만, 실제 학습에서 계속 얻을 수 있는 속도보다 낙관적이다. step 시간 분포의 중앙값이 대표값으로 낫다."

[[questions]]
id = "amdahl"
type = "numeric"
objective = 2
prompt = '''한 step에서 데이터 대기가 40%, 계산이 60%를 차지하고 둘은 겹치지 않는다(순서대로 일어난다). mixed precision으로 계산 부분만 2배 빨라지면 step 전체는 몇 배 빨라지는가? (소수점 둘째 자리까지)'''
answer = 1.43
tolerance = 0.01
explanation = '''새 step 시간은 $0.4 + 0.6/2 = 0.7$이므로 전체 속도 향상은 $1/0.7 \approx 1.43$배다. 계산을 2배 빠르게 해도 전체가 2배 빨라지지 않는 것은 개선하지 않은 부분(데이터 대기 40%)이 그대로 남기 때문이다(Amdahl의 법칙). 계산을 무한히 빠르게 해도 상한은 $1/0.4 = 2.5$배다. 데이터 대기를 계산과 겹치게 하면 step 시간이 $\max(0.4, 0.3) = 0.4$가 되어 2.5배까지 갈 수 있다. 어느 쪽을 먼저 고칠지는 이런 계산으로 정한다.'''

[[questions]]
id = "low-util-diagnosis"
type = "multiple"
objective = 2
prompt = '''GPU 사용률이 30–60% 사이에서 들쭉날쭉하고, profiler에서 step 시간의 절반 이상이 다음 batch를 기다리는 데 쓰인다. 효과를 기대할 수 있는 조치를 모두 고르시오.'''
explanation = '''증상은 데이터 공급 병목이다. DataLoader worker를 늘리거나 prefetch로 데이터 준비를 계산과 겹치게 하고, 매 epoch 반복되는 무거운 전처리는 미리 해서 저장하고, 작은 파일 수십만 개 대신 큰 shard 파일로 읽고, pinned memory와 `non_blocking=True`로 장치 복사를 계산과 겹치게 하는 것이 모두 데이터 쪽을 줄인다. mixed precision은 계산을 줄이는 조치라, 데이터를 기다리는 시간이 지배적인 지금은 효과가 작다. 오히려 계산이 빨라진 만큼 데이터 대기 비율이 더 커진다.'''

[[questions.choices]]
text = "DataLoader의 worker 수를 늘리고 prefetch로 데이터 준비를 계산과 겹치게 한다."
correct = true

[[questions.choices]]
text = "매 epoch 반복되는 전처리를 미리 해서 저장하고, 작은 파일 대신 큰 shard 파일로 읽는다."
correct = true

[[questions.choices]]
text = "pinned memory와 non_blocking 복사로 CPU→GPU 전송을 계산과 겹치게 한다."
correct = true

[[questions.choices]]
text = "mixed precision(bf16)을 켜서 계산 시간을 줄인다."
feedback = "계산이 병목이 아닐 때 계산을 줄여도 step 시간은 거의 줄지 않는다. 데이터 대기 비율만 더 커진다."

[[questions]]
id = "speed-vs-accuracy"
type = "single"
objective = 2
prompt = '''bf16 mixed precision을 켰더니 학습이 1.6배 빨라졌고, 최종 검증 정확도는 0.912에서 0.908로 바뀌었다(각각 seed 하나). 이 변화를 보고하는 방법으로 가장 알맞은 것은?'''
explanation = '''최적화는 속도와 수치 결과를 **함께** 보고해야 한다. 0.004의 차이가 정밀도 때문인지 seed 잡음인지는 seed 하나로는 알 수 없다. 두 설정을 같은 seed 여러 개로 돌려 정확도의 평균과 퍼짐을 비교하고(22.2장), 차이가 seed 간 변동 안에 있으면 "속도 1.6배, 정확도 차이는 변동 범위 안"이라고, 밖에 있으면 그 손실을 속도와 함께 보고한다. 출력 수준의 비교(기준 정밀도 대비 상대 오차, 예측 일치율)도 함께 남기면 원인을 좁힐 수 있다.'''

[[questions.choices]]
text = "같은 seed 여러 개로 두 설정을 돌려, 정확도 차이가 seed 간 변동 안인지 확인하고 속도와 함께 보고한다."
correct = true

[[questions.choices]]
text = "속도가 1.6배 빨라졌으므로 속도만 보고한다. 0.004는 작은 차이다."
feedback = "작아 보이는 차이도 비교 대상 사이의 차이와 비슷한 크기일 수 있다. 속도를 얻고 정확도를 잃은 것을 놓치는 전형적인 실패다."

[[questions.choices]]
text = "정확도가 떨어졌으므로 bf16은 쓰지 않는다."
feedback = "seed 하나의 0.004 차이는 잡음일 수 있다. 변동을 재기 전에는 판단할 수 없다."

[[questions]]
id = "batch-throughput"
type = "single"
objective = 2
prompt = '''batch 크기를 32에서 512로 늘렸더니 처리량(샘플/초)이 5배가 되었다. "학습이 5배 빨라졌다"고 말할 수 있는가?'''
explanation = '''처리량은 같은 시간에 처리하는 샘플 수다. 학습의 목표는 목표 성능에 도달하는 것이고, batch 크기는 최적화 자체를 바꾼다. 같은 epoch에서 update 횟수가 1/16로 줄고, learning rate 같은 하이퍼파라미터를 다시 맞춰야 하며, 같은 정확도에 도달하는 데 더 많은 epoch가 필요할 수 있다. 비교 기준은 처리량이 아니라 목표 검증 성능에 도달하는 시간(time-to-accuracy)과 그때의 최종 성능이다.'''

[[questions.choices]]
text = "말할 수 없다. batch 크기는 최적화를 바꾸므로 목표 성능에 도달하는 시간과 최종 성능으로 비교해야 한다."
correct = true

[[questions.choices]]
text = "말할 수 있다. 처리량이 5배이면 epoch당 시간이 1/5이므로 학습도 5배 빠르다."
feedback = "epoch당 시간은 줄지만, 같은 성능에 도달하는 데 필요한 epoch 수가 같다는 보장이 없다. 큰 batch는 update 횟수가 적다."

[[questions.choices]]
text = "말할 수 있다. 단 GPU 메모리 사용량이 늘어난 것만 함께 보고하면 된다."
feedback = "메모리도 중요하지만, 핵심은 batch 크기가 학습 결과 자체를 바꾼다는 점이다."
