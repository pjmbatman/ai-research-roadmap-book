# 22.2 재현성 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "reproducibility-levels"
type = "single"
objective = 3
prompt = '''다른 연구실이 논문의 설명만 보고 코드를 새로 작성해, 다른 데이터 수집 장비로 모은 데이터에서 같은 경향을 얻었다. 이것은 어느 수준의 재현인가?'''
explanation = '''원 저자의 코드와 환경을 쓰지 않고, 방법의 설명만으로 새로 구현해 같은 결론을 얻었으므로 **독립 재구현** 수준이다. 세 수준 중 가장 강한 증거다. 같은 코드·같은 환경으로 다시 돌리는 재실행은 기록이 충분한지를, 같은 코드를 다른 환경에서 돌리는 재현은 결과가 환경에 얼마나 민감한지를 확인한다. 독립 재구현은 결론이 특정 구현의 우연이 아님을 보인다.'''

[[questions.choices]]
text = "같은 환경 재실행"
feedback = "같은 환경 재실행은 원래 코드와 환경을 그대로 써서 다시 돌리는 것이다. 이 연구실은 코드도 환경도 새로 만들었다."

[[questions.choices]]
text = "다른 환경 재현"
feedback = "다른 환경 재현은 원래 코드를 다른 기계·다른 라이브러리 버전에서 돌리는 것이다. 여기서는 코드 자체가 새로 작성되었다."

[[questions.choices]]
text = "독립 재구현"
correct = true

[[questions]]
id = "seed-not-enough"
type = "multiple"
objective = 1
prompt = '''`torch.manual_seed(0)`을 호출했는데도 같은 서버에서 같은 스크립트를 두 번 돌린 결과가 마지막 자리에서 다르다. 가능한 원인을 모두 고르시오.'''
explanation = '''seed는 난수 생성기의 출발점만 고정한다. 결과가 달라지는 다른 길은 많다. cuDNN의 benchmark 모드는 실행할 때마다 시간을 재서 가장 빠른 알고리즘을 고르므로 실행마다 다른 알고리즘(따라서 다른 덧셈 순서)이 선택될 수 있다. GPU의 병렬 reduction과 atomic 덧셈은 스레드가 끝나는 순서에 따라 더하는 순서가 바뀐다. CPU 연산도 스레드 수가 바뀌면 reduction을 나누는 방식이 바뀐다. 부동소수점 덧셈은 결합법칙이 성립하지 않으므로 순서가 바뀌면 값이 바뀐다. `torch.manual_seed`는 CPU와 모든 장치의 난수 생성기를 함께 설정한다.'''

[[questions.choices]]
text = "cuDNN benchmark 모드가 실행마다 다른 convolution 알고리즘을 골랐다."
correct = true

[[questions.choices]]
text = "GPU의 병렬 덧셈(reduction·atomic)이 실행마다 다른 순서로 더해졌다."
correct = true

[[questions.choices]]
text = "두 실행의 CPU 스레드 수 설정이 달랐다."
correct = true

[[questions.choices]]
text = "`torch.manual_seed`는 CPU 난수만 고정하고 GPU 난수는 고정하지 않는다."
feedback = "`torch.manual_seed`는 모든 장치의 난수 생성기 seed를 설정한다. 원인은 난수가 아니라 연산 순서에 있다."

[[questions]]
id = "float-order"
type = "numeric"
objective = 1
prompt = '''float32에서 $2^{24} = 16777216$이다. float32로 `(16777216 + 1) - 16777216`을 계산하면 결과는? (같은 세 수를 `(16777216 - 16777216) + 1` 순서로 계산하면 1이다.)'''
answer = 0
tolerance = 0
explanation = '''float32의 가수는 24비트라서 $2^{24}$ 근처에서는 이웃한 수의 간격이 2다. $2^{24} + 1$은 표현할 수 없어 짝수 쪽으로 반올림되어 $2^{24}$가 되고, 여기서 $2^{24}$를 빼면 0이다. 같은 세 수라도 더하는 순서에 따라 0과 1이 나온다. 부동소수점 덧셈은 결합법칙이 성립하지 않는다(9.1장). 병렬 계산에서 덧셈 순서가 바뀌면 결과가 바뀌는 이유다.'''

[[questions]]
id = "global-rng-shift"
type = "single"
objective = 1
prompt = '''모든 코드가 `np.random.seed(0)` 뒤의 전역 난수 생성기 하나를 쓴다. 증강 코드 한 줄을 추가했더니, 증강과 무관한 데이터 순서까지 바뀌어 이전 실험과 비교할 수 없게 되었다. 가장 근본적인 해결책은?'''
explanation = '''전역 생성기 하나를 나눠 쓰면 앞에서 난수를 몇 개 소비하느냐에 따라 뒤의 모든 난수가 밀린다. 초기화·데이터 순서·증강처럼 용도마다 생성기를 따로 만들면(예: `SeedSequence(seed).spawn`, 또는 이름으로 정해지는 스트림), 한 용도에 코드를 추가해도 다른 용도의 난수는 그대로다. 증강 위치를 옮기는 것은 이번 경우만 피하는 임시방편이다.'''

[[questions.choices]]
text = "용도마다 별도의 난수 생성기를 만들어, 한 용도의 소비가 다른 용도에 영향을 주지 않게 한다."
correct = true

[[questions.choices]]
text = "증강 코드를 데이터 순서를 정하는 코드 뒤로 옮긴다."
feedback = "이번에는 피할 수 있지만, 다음에 다른 곳에 난수 호출을 추가하면 같은 문제가 생긴다. 구조가 바뀌지 않았다."

[[questions.choices]]
text = "seed를 0이 아닌 다른 값으로 바꾼다."
feedback = "seed 값과는 무관하다. 어떤 seed든 전역 생성기를 나눠 쓰면 소비 순서가 결과를 바꾼다."

[[questions.choices]]
text = "증강을 쓸 때만 seed를 다시 0으로 설정한다."
feedback = "중간에 seed를 다시 설정하면 그 뒤의 난수가 앞의 난수를 반복하는 등 의도하지 않은 상관이 생기고, 호출 위치에 따라 결과가 바뀌는 문제는 그대로다."

[[questions]]
id = "deterministic-tradeoff"
type = "single"
objective = 2
prompt = '''`torch.use_deterministic_algorithms(True)`를 켰을 때 일어나는 일로 옳은 것은?'''
explanation = '''이 설정은 결정적 구현이 있는 연산은 그 구현을 쓰게 하고, 비결정적 구현만 있는 연산은 호출할 때 `RuntimeError`를 내게 한다. 결정적 구현은 순서를 고정하느라 대개 더 느리다. 이 보장은 같은 소프트웨어·같은 하드웨어에서 같은 입력에 같은 출력을 낸다는 뜻이고, 다른 GPU 모델이나 다른 PyTorch 버전 사이의 일치는 보장하지 않는다. 난수 seed도 설정하지 않으므로 seed는 따로 고정해야 한다.'''

[[questions.choices]]
text = "결정적 구현을 쓰게 하고, 비결정적 구현만 있는 연산은 오류를 낸다. 대개 더 느려진다."
correct = true

[[questions.choices]]
text = "다른 GPU 모델과 다른 PyTorch 버전에서도 비트 단위로 같은 결과를 보장한다."
feedback = "보장 범위는 같은 소프트웨어·같은 하드웨어다. 하드웨어나 버전이 바뀌면 다른 kernel이 쓰일 수 있다."

[[questions.choices]]
text = "난수 seed도 자동으로 고정하므로 `manual_seed`를 따로 부를 필요가 없다."
feedback = "결정적 알고리즘과 난수 seed는 별개다. seed를 고정하지 않으면 초기화부터 달라진다."

[[questions.choices]]
text = "성능에는 영향이 없으므로 항상 켜 두는 것이 좋다."
feedback = "결정적 구현은 순서를 고정하거나 더 느린 알고리즘을 쓰므로 대개 느리다. 비용을 재 보고 켤지 정한다."

[[questions]]
id = "when-determinism"
type = "single"
objective = 2
prompt = '''결정적 실행 설정(결정적 알고리즘, cuDNN benchmark 끄기)을 언제 켜는 것이 가장 합리적인가?'''
explanation = '''결정성이 가장 큰 가치를 내는 곳은 버그 추적과 회귀 테스트다. 코드를 바꿨을 때 결과가 달라지면, 그 차이가 코드 변경 때문인지 실행마다의 잡음 때문인지 가를 수 있어야 하기 때문이다. 본 실험은 성능 비용을 치르지 않고 기본 설정으로 돌리되, 결과를 여러 seed로 보고해 변동을 드러낸다. 결정적으로 돌린 run 하나는 "재실행하면 같다"를 보장할 뿐, 그 결과가 seed와 무관하게 대표적이라는 것을 보장하지 않는다.'''

[[questions.choices]]
text = "버그 추적·회귀 테스트에서는 켜고, 본 실험은 기본 설정으로 돌리되 여러 seed로 변동을 보고한다."
correct = true

[[questions.choices]]
text = "모든 실험에서 켜고, 그러면 seed 하나로 돌려도 결과를 믿을 수 있다."
feedback = "결정성은 같은 seed의 재실행을 같게 만들 뿐이다. 다른 seed에서 얼마나 달라지는지는 여전히 알 수 없다."

[[questions.choices]]
text = "논문 제출 직전 마지막 실험에서만 켠다."
feedback = "본 실험과 다른 설정으로 마지막 결과를 만들면, 그동안의 비교와 설정이 다른 결과를 보고하게 된다."

[[questions]]
id = "bitwise-across-machines"
type = "single"
objective = 3
prompt = '''논문 결과를 다른 기계(다른 GPU 모델)에서 다시 돌렸더니 정확도가 보고값과 비트 단위로 같지 않다. 어떻게 판단해야 하는가?'''
explanation = '''다른 환경에서는 연산 순서와 kernel이 달라 비트 단위 일치를 기대할 수 없다. 다른 환경 재현의 기준은 **보고된 변동 범위**다. 논문이 seed 여러 개의 평균과 퍼짐을 보고했다면, 새 기계에서 돌린 몇 개 seed의 평균이 그 범위(예: 예측구간) 안에 드는지로 판정한다. 그래서 원 논문이 변동을 보고하지 않으면 재현을 판정할 근거 자체가 없다.'''

[[questions.choices]]
text = "보고된 변동 범위(seed 여러 개의 평균과 퍼짐) 안에 드는지로 판정한다."
correct = true

[[questions.choices]]
text = "비트 단위로 같지 않으므로 재현에 실패했다."
feedback = "비트 단위 일치는 같은 환경 재실행에서나 기대할 수 있다. 다른 GPU에서는 다른 kernel과 연산 순서가 쓰인다."

[[questions.choices]]
text = "소수점 둘째 자리까지 같으면 재현, 아니면 실패로 판정한다."
feedback = "고정된 자릿수 기준은 결과의 실제 변동 크기를 무시한다. 변동이 큰 실험에서는 너무 엄격하고, 작은 실험에서는 너무 느슨하다."
