# 22.1 실험 추적과 결과 관리 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "what-to-record"
type = "multiple"
objective = 1
prompt = '''논문 표의 숫자 하나에서 그 실험을 **정확히 다시 실행**하려면 run 기록에 무엇이 있어야 하는가? 모두 고르시오.'''
explanation = '''다시 실행하려면 그 run이 실제로 쓴 입력을 모두 되살릴 수 있어야 한다. 기본값·설정 파일·명령행 override가 합쳐진 resolved config, 코드를 가리키는 커밋 해시와 커밋되지 않은 변경 여부(있었다면 diff), 데이터를 가리키는 manifest 해시와 분할이 그 입력이다. 설정 파일의 **경로**는 입력이 아니다. 파일 내용은 나중에 바뀔 수 있으므로 경로가 아니라 실제로 쓴 값을 저장해야 한다. 출력 디렉터리 위치는 결과에 영향을 주지 않으므로 재실행에 필요하지 않다.'''

[[questions.choices]]
text = "기본값·설정 파일·명령행 override를 모두 반영한 resolved config"
correct = true

[[questions.choices]]
text = "코드 커밋 해시와 커밋되지 않은 변경이 있었는지(있었다면 그 diff)"
correct = true

[[questions.choices]]
text = "데이터 manifest 해시와 분할(split manifest)"
correct = true

[[questions.choices]]
text = "사용한 설정 파일의 경로(예: configs/exp.yaml)"
feedback = "경로는 나중에 다른 내용을 가리킬 수 있다. 파일을 고치거나 override를 붙였다면 경로만으로는 실제 값을 알 수 없다. 실제로 쓴 값(resolved config)을 저장한다."

[[questions.choices]]
text = "결과를 저장한 출력 디렉터리의 절대 경로"
feedback = "출력 위치는 결과에 영향을 주지 않는다. run ID로 디렉터리를 찾을 수 있으면 충분하다."

[[questions]]
id = "config-hash-ignored-keys"
type = "single"
objective = 1
prompt = '''run ID에 쓰는 설정 hash를 계산할 때 `out_dir`, `log_level` 같은 키를 빼는 이유로 가장 알맞은 것은?'''
explanation = '''설정 hash는 "같은 실험인가"를 판정하는 데 쓰인다. 결과에 영향을 주지 않는 값(출력 위치, 로그 수준)까지 hash에 넣으면, 같은 실험을 다른 디렉터리에서 돌렸다는 이유만으로 다른 실험처럼 보인다. 그러면 중복 실행을 찾거나, 끝난 run을 건너뛰거나, 같은 설정의 seed들을 묶는 일이 모두 어긋난다. 반대로 seed는 결과를 바꾸므로 hash에 남긴다.'''

[[questions.choices]]
text = "결과에 영향을 주지 않는 값이 달라도 같은 실험이 같은 hash를 갖게 하려고"
correct = true

[[questions.choices]]
text = "hash 계산을 빠르게 하려고"
feedback = "설정 dict 하나의 hash는 순식간에 계산된다. 속도가 아니라 '같은 실험'의 정의 문제다."

[[questions.choices]]
text = "같은 이유로 seed도 빼야 한다. seed가 달라도 같은 설정이기 때문이다."
feedback = "seed는 결과를 바꾼다. seed가 다른 두 run은 다른 run이다. seed를 묶어 평균을 내는 것은 결과 표를 만들 때 group_by로 한다."

[[questions.choices]]
text = "출력 경로가 기록에 남으면 보안상 위험하기 때문에"
feedback = "출력 경로는 run 기록에 남겨도 된다. hash에서 빼는 것과 기록하지 않는 것은 다르다."

[[questions]]
id = "dirty-commit"
type = "single"
objective = 1
prompt = '''커밋 `3f2a9c1`에서 실험을 돌렸는데, 그때 `git status`에 수정된 파일이 하나 있었다. run 기록에는 커밋 해시만 남겼다. 이 기록에 대한 설명으로 옳은 것은?'''
explanation = '''커밋 해시는 커밋된 코드만 가리킨다. 실행 당시 작업 디렉터리에 있던 수정은 어디에도 남지 않았으므로, 그 run의 코드를 복원할 방법이 없다. 그 수정이 결과에 영향을 주었는지도 이제는 알 수 없다. 실행 전에 커밋하거나, 적어도 `git diff`를 run 디렉터리에 저장하고 "dirty" 표시를 남긴다.'''

[[questions.choices]]
text = "커밋 해시가 있으므로 그 코드를 언제든 복원할 수 있다."
feedback = "커밋 해시는 커밋되지 않은 수정을 담지 않는다. checkout하면 수정 전의 코드가 나온다."

[[questions.choices]]
text = "실행 당시의 코드를 복원할 수 없다. 실행 전에 커밋하거나 diff를 함께 저장했어야 한다."
correct = true

[[questions.choices]]
text = "수정이 결과에 영향을 주지 않는 부분이었다면 문제없으므로, 기록은 충분하다."
feedback = "수정 내용이 남지 않았으므로 영향이 있었는지 판단할 근거도 없다."

[[questions.choices]]
text = "파일 수정 시각을 보면 어느 코드였는지 알 수 있다."
feedback = "수정 시각은 내용을 알려 주지 않는다. 그 뒤로 파일이 다시 바뀌었을 수도 있다."

[[questions]]
id = "jsonl-append"
type = "single"
objective = 1
prompt = '''epoch마다 metric을 기록할 때, 리스트 전체를 JSON 파일 하나로 다시 쓰는 대신 **한 줄에 JSON 객체 하나**(JSON Lines)를 덧붙이는 주된 이유는?'''
explanation = '''JSON Lines는 덧붙이기만 한다. 이미 쓴 줄은 다시 건드리지 않으므로, 학습이 기록 도중 죽어도 잃는 것은 많아야 마지막 한 줄이다. 리스트 전체를 매번 다시 쓰는 방식은 쓰는 도중 죽으면 파일 전체가 깨진 JSON이 되어 앞선 기록까지 읽을 수 없다. 또 학습 중에도 다른 프로세스가 앞부분을 줄 단위로 읽을 수 있다.'''

[[questions.choices]]
text = "기록 도중 프로세스가 죽어도 앞서 쓴 줄은 온전히 남기 때문에"
correct = true

[[questions.choices]]
text = "JSON Lines가 일반 JSON보다 파일 크기가 훨씬 작기 때문에"
feedback = "크기는 비슷하다. 차이는 덧붙이기만 한다는 쓰기 방식에 있다."

[[questions.choices]]
text = "JSON Lines는 숫자를 더 정밀하게 저장하기 때문에"
feedback = "각 줄은 평범한 JSON이다. 숫자 표현은 같다."

[[questions]]
id = "naive-mean-with-failed"
type = "numeric"
objective = 2
prompt = '''lr = 0.1인 run 4개 가운데 3개는 끝났고 마지막 검증 손실이 각각 0.30, 0.32, 0.31이다. 나머지 하나는 발산해 실패했고 마지막으로 기록된 손실은 7.9다. 결과 표를 만드는 스크립트가 **status를 보지 않고** 네 run의 마지막 손실을 평균하면 표에 어떤 값이 찍히는가? (소수점 넷째 자리까지)'''
answer = 2.2075
tolerance = 0.001
explanation = '''$(0.30 + 0.32 + 0.31 + 7.9)/4 = 8.83/4 = 2.2075$다. 끝난 run 세 개의 평균 0.31과 비교하면 일곱 배가 넘는다. 실패한 run의 마지막 값은 "그 설정의 성능"이 아니라 "학습이 멈춘 시점의 값"이므로 평균에 섞으면 안 된다. 대신 그 실패를 빠진 개수(1/4)로 표에 함께 적는다.'''

[[questions]]
id = "failed-run-in-table"
type = "single"
objective = 2
prompt = '''제안 방법을 seed 5개로 돌렸더니 2개가 발산했다. 논문 표에 쓰는 방법으로 가장 알맞은 것은?'''
explanation = '''끝난 3개의 평균과 퍼짐을 쓰고, 5개 중 2개가 발산했다는 사실을 함께 적는다. 발산 자체가 그 방법의 성질(학습 안정성)에 대한 정보다. 실패한 run을 조용히 빼거나, 성공할 때까지 seed를 바꿔 5개를 채우면, 잘 된 run만 고른 것과 같은 선택 편향이 생긴다. 발산한 run의 손실을 평균에 넣는 것은 의미 없는 숫자를 만든다.'''

[[questions.choices]]
text = "끝난 3개의 평균 ± 표준편차를 쓰고, 5개 중 2개가 발산했다고 함께 적는다."
correct = true

[[questions.choices]]
text = "발산한 2개는 버그로 보고 빼서, 끝난 3개의 평균만 쓴다."
feedback = "실패를 숨기면 독자는 이 방법이 늘 안정적이라고 읽는다. 실패율도 결과다."

[[questions.choices]]
text = "다른 seed로 다시 돌려 성공한 run 5개를 채운 뒤 그 평균을 쓴다."
feedback = "성공할 때까지 다시 돌리면 성공한 seed만 고른 셈이 되어 성능과 안정성을 모두 과대평가한다."

[[questions.choices]]
text = "발산한 run의 마지막 손실까지 포함한 5개의 평균을 쓴다."
feedback = "발산한 run의 마지막 값은 성능이 아니라 학습이 멈춘 시점의 값이다. 평균이 의미를 잃는다."

[[questions]]
id = "dashboard-vs-raw"
type = "single"
objective = 2
prompt = '''대시보드의 학습 곡선에 smoothing을 0.9로 걸어 둔 채, 마우스를 올려 보이는 마지막 검증 정확도를 논문 표에 옮겨 적었다. 무엇이 문제인가?'''
explanation = '''smoothing을 건 곡선의 값은 원래 기록이 아니라 이전 값들과 섞인 지수이동평균이다. 마지막 값조차 원본과 다르다. 손으로 옮기는 과정에서 run도 헷갈리기 쉽다. 표의 숫자는 run 디렉터리의 원본 metric 파일에서 스크립트로 뽑고, 그 숫자가 어느 run에서 왔는지(run ID)를 함께 남긴다. 대시보드는 보는 도구이고 원천은 파일이다.'''

[[questions.choices]]
text = "smoothing된 값은 원본 기록이 아니다. 표는 원본 metric 파일에서 스크립트로 만들고 run ID를 함께 남긴다."
correct = true

[[questions.choices]]
text = "smoothing은 잡음을 줄여 주므로 오히려 더 정확한 값이다. 문제없다."
feedback = "smoothing은 보기 좋게 만들 뿐, 표에 쓸 측정값을 바꾼다. 같은 run을 다시 열어 smoothing을 바꾸면 다른 숫자가 나온다."

[[questions.choices]]
text = "마지막 값만 옮기면 문제없고, 중간 값을 옮길 때만 smoothing이 문제가 된다."
feedback = "지수이동평균에서는 마지막 값도 이전 값들과 섞여 있다."
