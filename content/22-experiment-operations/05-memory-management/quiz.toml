# 22.5 GPU 메모리 관리 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "adam-bytes-per-param"
type = "numeric"
objective = 1
prompt = '''파라미터 1억($10^8$)개인 모델을 fp32 + Adam으로 학습한다. 파라미터·gradient·optimizer 상태가 차지하는 메모리의 합은 몇 GB($10^9$ byte)인가? 활성값과 임시 버퍼는 빼고 계산한다.'''
answer = 1.6
tolerance = 0.01
slider = { min = 0.0, max = 3.2, step = 0.1, unit = "GB" }
explanation = '''파라미터 4 byte + gradient 4 byte + Adam의 $m$·$v$ 8 byte = 파라미터당 16 byte다. $10^8 \times 16 = 1.6 \times 10^9$ byte = 1.6 GB. 모델 파일(fp32 가중치 0.4 GB)의 네 배이고, 여기에 batch에 비례하는 활성값이 더해진다. 0.4 GB는 가중치만, 0.8 GB는 가중치와 gradient만, 1.2 GB는 optimizer 상태를 하나만 센 값이다.'''

[[questions]]
id = "nvidia-smi-vs-allocated"
type = "single"
objective = 1
prompt = '''학습 중 `nvidia-smi`는 이 프로세스가 GPU 메모리 18 GiB를 쓴다고 보여 주는데, `torch.cuda.memory_allocated()`는 11 GiB를 반환한다. 가장 그럴듯한 설명은?'''
explanation = '''PyTorch의 caching allocator는 해제된 텐서의 메모리를 드라이버에 돌려주지 않고 재사용하려고 들고 있다(reserved). `nvidia-smi`는 이 캐시와 CUDA context까지 포함한 프로세스 전체 사용량을 보여 주므로 살아 있는 텐서의 합(allocated)보다 크다. 이 차이는 누수의 증거가 아니다. 누수는 step마다 allocated나 max allocated가 계속 늘어나는 것으로 판단한다.'''

[[questions.choices]]
text = "7 GiB만큼 메모리가 새고 있으므로 코드에 누수가 있다."
feedback = "allocated와 nvidia-smi의 차이는 정상적으로 생긴다. 누수인지는 step마다 allocated가 계속 느는지로 판단한다."

[[questions.choices]]
text = "allocator가 재사용하려고 들고 있는 캐시(reserved)와 CUDA context가 nvidia-smi 숫자에 포함되어 있다."
correct = true

[[questions.choices]]
text = "`torch.cuda.memory_allocated()`는 gradient를 세지 않기 때문이다."
feedback = "gradient도 텐서이므로 allocated에 포함된다."

[[questions.choices]]
text = "`torch.cuda.empty_cache()`를 매 step 부르면 두 숫자가 같아지고 OOM도 사라진다."
feedback = "empty_cache는 쓰지 않는 캐시 블록만 드라이버에 돌려준다. 살아 있는 텐서는 줄지 않으므로 같은 프로세스의 OOM은 고쳐지지 않고, 매 step 부르면 재할당 비용으로 느려진다."

[[questions]]
id = "checkpoint-segment"
type = "numeric"
objective = 2
prompt = '''같은 크기의 층 64개로 된 모델에 activation checkpointing을 건다. 길이 $k$인 구간으로 나누면 최대 저장량이 층 하나의 활성값을 단위로 $64/k + k$라고 하자. $k$를 64의 약수 중에서 가장 좋게 고를 때 최대 저장량은 몇 층 분량인가?'''
answer = 16
tolerance = 0
slider = { min = 0, max = 64, step = 1, unit = "층" }
explanation = '''$64/k + k$는 $k = \sqrt{64} = 8$에서 최소 $8 + 8 = 16$이다. checkpointing이 없을 때의 64층에 비해 4분의 1이다. $k = 64$(구간 하나)는 경계는 하나지만 backward 때 64층을 모두 다시 만들어 들고 있어야 하므로 $1 + 64 = 65$로 오히려 나쁘다. 대가는 forward 약 한 번의 재계산이다.'''

[[questions]]
id = "autocast-saves-what"
type = "single"
objective = 2
prompt = '''fp32 + Adam으로 학습하던 코드에 `torch.autocast(device_type="cuda", dtype=torch.bfloat16)`만 추가했다. 메모리에 대해 옳은 설명은?'''
explanation = '''autocast는 파라미터를 fp32로 둔 채 연산할 때만 bf16으로 바꾼다. 그래서 파라미터·gradient·Adam 상태(파라미터당 16 byte)는 그대로이고, 연산이 backward를 위해 저장하는 활성값이 대략 절반이 된다. 연산에 쓰려고 만든 bf16 가중치 사본이 저장될 수도 있어서, 활성값이 작은 설정에서는 저장량이 오히려 늘 수 있다. 줄었는지는 측정으로 확인한다.'''

[[questions.choices]]
text = "모든 텐서가 bf16이 되므로 학습 메모리 전체가 절반으로 준다."
feedback = "autocast는 파라미터의 dtype을 바꾸지 않는다. 파라미터·gradient·optimizer 상태는 fp32 그대로다."

[[questions.choices]]
text = "정적 메모리(파라미터·gradient·optimizer 상태)는 그대로이고, 주로 활성값이 준다."
correct = true

[[questions.choices]]
text = "Adam의 $m$과 $v$가 bf16으로 저장되어 optimizer 상태가 절반이 된다."
feedback = "optimizer 상태는 파라미터(fp32)를 따라 fp32로 만들어진다. autocast는 optimizer에 관여하지 않는다."

[[questions.choices]]
text = "정밀도만 바뀌고 메모리는 전혀 바뀌지 않는다."
feedback = "bf16 연산이 저장하는 활성값은 2 byte이므로 활성값 메모리가 준다. 다만 정적 메모리는 그대로다."

[[questions]]
id = "accumulation-what-changes"
type = "multiple"
objective = 2
prompt = '''micro-batch 64를 한 번에 돌리던 학습을 micro-batch 16 × gradient accumulation 4회로 바꿨다(손실은 표본 평균, 누적 시 4로 나눔). 옳은 것을 모두 고르시오.'''
explanation = '''활성값은 micro-batch에 비례하므로 최대 활성값 메모리는 약 4분의 1이 된다. 유효 batch는 $16 \times 4 = 64$로 같으므로 학습률과 스케줄은 그대로 둘 수 있다. 파라미터·gradient·optimizer 상태는 batch와 무관하므로 줄지 않는다. BatchNorm은 통계를 micro-batch(16개)에서 계산하므로 64개에서 계산할 때와 다르다. 따라서 BatchNorm이 있으면 완전히 같은 학습이 아니다.'''

[[questions.choices]]
text = "최대 활성값 메모리가 약 4분의 1이 된다."
correct = true

[[questions.choices]]
text = "유효 batch가 64로 같으므로 학습률을 바꿀 필요가 없다."
correct = true

[[questions.choices]]
text = "optimizer 상태 메모리도 4분의 1이 된다."
feedback = "optimizer 상태는 파라미터 수에 비례하고 batch와 무관하다. 정적 메모리가 문제라면 accumulation으로는 해결되지 않는다."

[[questions.choices]]
text = "BatchNorm이 있는 모델에서도 batch 64와 정확히 같은 학습이다."
feedback = "BatchNorm의 평균·분산은 forward 한 번의 batch, 즉 micro-batch 16개에서 계산된다. 64개에서 계산한 통계와 다르다."

[[questions]]
id = "oom-batch-halving"
type = "single"
objective = 2
prompt = '''batch 64, 학습률 $10^{-3}$, warm-up 1000 step으로 튜닝한 설정이 새 GPU에서 OOM이 났다. 같은 학습을 유지하는 가장 적절한 대응은?'''
explanation = '''micro-batch를 32로 줄이고 2회 누적하면 유효 batch 64, 학습률, step 단위의 warm-up과 스케줄이 모두 그대로다. batch만 32로 줄이면 유효 batch가 절반이 되고 epoch당 step이 두 배가 되어 다른 학습이 된다. checkpointing을 먼저 시도하는 것도 같은 학습을 유지하는 좋은 방법이다. `empty_cache`는 살아 있는 텐서를 줄이지 않는다.'''

[[questions.choices]]
text = "batch를 32로 줄이고 나머지 설정은 그대로 둔다."
feedback = "유효 batch가 32로 바뀌어 다른 학습이 된다. 학습률·warm-up·스케줄은 batch 64에 맞춰져 있었다."

[[questions.choices]]
text = "micro-batch 32 × gradient accumulation 2회로 바꾸고 학습률·warm-up은 그대로 둔다."
correct = true

[[questions.choices]]
text = "batch를 32로 줄이고 학습률을 두 배로 올린다."
feedback = "학습률을 키우는 방향이 반대다. 선형 스케일링 규칙을 따르더라도 batch가 절반이면 학습률도 절반이 되어야 하고, 그래도 같은 학습이라는 보장은 없다."

[[questions.choices]]
text = "매 step 끝에 `torch.cuda.empty_cache()`를 호출한다."
feedback = "empty_cache는 캐시 블록을 드라이버에 돌려줄 뿐 살아 있는 텐서를 줄이지 않는다."
