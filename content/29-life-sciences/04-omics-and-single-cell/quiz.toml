# 29.4 유전체·단일세포 데이터 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "poisson-zeros"
type = "numeric"
objective = 1
prompt = '''어떤 유전자의 개수가 세포마다 평균 0.1개인 Poisson 분포를 따른다. 이 유전자가 0으로 관측되는 세포의 비율은? (소수 둘째 자리까지)'''
answer = 0.90
tolerance = 0.01
explanation = '''평균이 $m$인 Poisson 변수가 0일 확률은 $e^{-m}$이다. $e^{-0.1} \approx 0.905$이므로 세포의 약 90%에서 0이 관측된다. 이 유전자는 모든 세포에서 발현되고 있지만 표본에 잡히지 않을 뿐이다. 단일세포 데이터의 0 대부분은 이렇게 표본 추출로 설명된다.'''

[[questions]]
id = "normalized-value"
type = "numeric"
objective = 1
prompt = '''세포 하나의 총 개수가 2,000이고 유전자 A의 개수가 10이다. 총합을 $10^4$으로 맞춘 뒤 자연로그 $\log(1 + x)$로 변환한 유전자 A의 값은? (소수 둘째 자리까지)'''
answer = 3.93
tolerance = 0.01
explanation = '''총합을 $10^4$으로 맞추면 $10 / 2000 \times 10^4 = 50$이고, $\ln(1 + 50) = \ln 51 \approx 3.93$이다. 총 개수가 4,000인 세포에서 같은 유전자가 20개였다면 같은 값이 나온다. 정규화는 크기 인자의 차이를 없애고, 로그는 배수 차이를 덧셈 차이로 바꾼다.'''

[[questions]]
id = "log1p-zero"
type = "single"
objective = 1
prompt = '''정규화한 개수에 $\log x$ 대신 $\log(1 + x)$를 쓰는 주된 이유는?'''
explanation = '''개수 행렬의 많은 값이 0이고 $\log 0$은 정의되지 않는다. 1을 더하면 0은 0으로 가고 큰 값에서는 $\log x$와 거의 같다. 1이라는 상수는 편의를 위한 선택이라, 작은 값 근처에서 변환의 모양은 이 상수와 정규화 목표값($10^4$)에 따라 달라진다.'''

[[questions.choices]]
text = "0이 많은데 log 0은 정의되지 않기 때문이다."
correct = true

[[questions.choices]]
text = "크기 인자의 차이를 없애기 위해서다."
feedback = "크기 인자는 총 개수로 나누는 정규화 단계가 다룬다. 1을 더하는 것은 0 때문이다."

[[questions.choices]]
text = "개수 데이터를 정확히 정규분포로 바꾸기 위해서다."
feedback = "log1p는 분산을 줄이고 배수 차이를 덧셈 차이로 바꿀 뿐, 정규분포를 보장하지 않는다. 특히 0이 많은 유전자는 변환 뒤에도 0에 몰려 있다."

[[questions]]
id = "pc1-library-size"
type = "single"
objective = 1
prompt = '''단일세포 데이터의 PCA에서 첫 주성분이 세포별 총 개수와 강한 상관을 보인다. 가장 먼저 의심할 것은?'''
explanation = '''원 개수나 정규화가 부족한 데이터에서는 크기 인자(포획 효율·시퀀싱 깊이)가 모든 유전자에 함께 작용하므로 분산이 가장 큰 방향이 된다. 이 경우 첫 주성분과 그 위의 군집은 생물학이 아니라 측정 깊이를 반영한다. 정규화가 제대로 되었는지, 품질 지표와 상관이 남는지 먼저 확인한다.'''

[[questions.choices]]
text = "크기 인자가 제거되지 않아 첫 주성분이 측정 깊이를 반영하고 있다."
correct = true

[[questions.choices]]
text = "세포 크기가 큰 새로운 세포 유형을 발견했다."
feedback = "총 개수는 세포 크기뿐 아니라 포획 효율과 시퀀싱 깊이에 크게 좌우된다. 정규화를 확인하기 전에는 생물학으로 해석하지 않는다."

[[questions.choices]]
text = "주성분 분석은 개수 데이터에 쓸 수 없으므로 t-SNE로 바꾸어야 한다."
feedback = "문제는 방법이 아니라 입력이다. t-SNE도 정규화하지 않은 입력에서는 같은 깊이 차이를 따라간다."

[[questions]]
id = "overcorrection"
type = "single"
objective = 2
prompt = '''배치 2에만 처리된 시료가 일부 있고 세포 구성도 다르다. 배치마다 전체 평균을 빼는 보정 뒤 군집과 세포 유형의 ARI가 0.84로 좋아졌다. 이 결과에 대한 판단으로 옳은 것은?'''
explanation = '''배치 평균에는 배치 효과뿐 아니라 그 배치의 세포 구성과 처리 반응이 섞여 있다. 평균을 통째로 빼면 처리 반응이 줄고, 반응하지 않은 세포 유형에 가짜 반응이 생길 수 있다. 이 장의 예에서 군집 ARI는 0.84로 좋았지만 반응 차이는 +1.23에서 +0.76으로 줄고 유형 0에 −0.54의 가짜 반응이 생겼다. 보정은 배치 혼합과 생물학 보존을 함께 평가한다.'''

[[questions.choices]]
text = "군집이 세포 유형과 맞으므로 보정이 성공했고, 보정된 값으로 처리 효과를 추정해도 된다."
feedback = "군집 지표는 과보정을 드러내지 못할 수 있다. 처리 반응처럼 배치와 함께 움직이는 생물학적 차이가 보존되었는지 따로 확인해야 한다."

[[questions.choices]]
text = "배치 평균에 섞인 구성 차이와 처리 반응까지 빠졌을 수 있으므로, 공통 세포 유형의 알려진 차이가 보존되는지 확인해야 한다."
correct = true

[[questions.choices]]
text = "보정 전에도 세포 유형은 같으므로 보정 여부는 결론에 영향을 주지 않는다."
feedback = "보정 전에는 군집이 배치를 따라갔다. 보정 방식에 따라 처리 효과의 크기와 다른 유형의 가짜 효과가 달라진다."

[[questions]]
id = "batch-cluster-evidence"
type = "multiple"
objective = 2
prompt = '''통합 데이터의 UMAP에서 따로 떨어진 군집 하나를 찾았다. 이 군집이 **배치 효과일 가능성**을 높이는 근거를 모두 고르시오.'''
explanation = '''군집이 거의 한 배치의 세포로만 이루어져 있거나, 그 군집을 정의하는 유전자 차이가 같은 배치의 다른 세포 유형에서도 똑같이 나타나면(배치 전체에 걸린 이동), 배치 효과일 가능성이 높다. 같은 군집이 다른 배치의 같은 조직 시료에서 나타나지 않는 것도 근거다. UMAP에서 멀리 떨어져 보인다는 사실과 세포 수가 많다는 사실은 군집의 기원에 대해 아무것도 말하지 않는다.'''

[[questions.choices]]
text = "군집의 세포가 거의 모두 한 배치에서 왔다."
correct = true

[[questions.choices]]
text = "군집을 정의하는 유전자 차이가 같은 배치의 다른 세포 유형에서도 똑같이 나타난다."
correct = true

[[questions.choices]]
text = "UMAP에서 다른 군집들과 멀리 떨어져 있다."
feedback = "UMAP의 군집 간 거리는 원래 공간의 거리를 반영한다는 보장이 없고, 배치 효과든 생물학이든 떨어져 보일 수 있다."

[[questions.choices]]
text = "군집에 세포가 많다."
feedback = "세포 수는 군집의 기원을 알려 주지 않는다."
