# 29.5 생명과학 AI의 평가와 누수 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "greedy-cluster-guarantee"
type = "single"
objective = 1
prompt = '''서열을 하나씩 보며 기존 대표 서열과 동일성이 0.3 이상이면 그 군집에 넣고, 아니면 새 대표로 삼는 탐욕적 군집으로 데이터를 나누었다. 군집 단위로 train·test를 나눈 뒤 보장되는 것은?'''
explanation = '''탐욕적 군집에서 각 서열은 자기 대표와만 동일성 0.3 이상이 보장된다. 다른 군집의 대표와는 0.3 미만이지만, 다른 군집의 **구성원**과는 0.3 이상일 수 있다. 그래서 test 서열과 train 서열 사이에 기준 이상의 쌍이 남을 수 있다. 모든 test–train 쌍이 기준 미만이라는 보장은 단일 연결(동일성 ≥ 기준인 쌍으로 이은 연결 성분) 군집에서만 성립한다. 어떤 군집을 쓰든 분할 후 test–train 최대 동일성을 직접 계산해 확인한다.'''

[[questions.choices]]
text = "모든 test 서열은 모든 train 서열과 동일성 0.3 미만이다."
feedback = "그 보장은 단일 연결 군집의 성질이다. 탐욕적 군집에서는 다른 군집의 구성원끼리 0.3 이상일 수 있다."

[[questions.choices]]
text = "각 서열이 자기 군집의 대표와 동일성 0.3 이상이라는 것뿐이다. test–train 사이에 0.3 이상인 쌍이 남을 수 있다."
correct = true

[[questions.choices]]
text = "같은 군집 안의 모든 서열 쌍은 동일성 0.3 이상이다."
feedback = "두 구성원이 모두 대표와 0.3 이상이어도 서로는 0.3 미만일 수 있다. 동일성은 추이적이지 않다."

[[questions]]
id = "time-split-homology"
type = "single"
objective = 1
prompt = '''단백질 기능 예측 모델을 2020년 이전에 등록된 서열로 학습하고, 이후에 등록된 서열로 평가했다. 이 시간 분할의 성능이 뒷받침하는 주장은?'''
explanation = '''시간 분할은 미래에 등록될 서열에 대한 성능을 잰다. 그러나 새로 등록된 서열의 상당수는 이미 등록된 가족의 구성원이라, train에 가까운 친척이 있다. 새 가족에 대한 일반화를 주장하려면 미래 서열 중 과거 서열과 동일성이 기준 미만인 것만 test로 쓰거나, 동일성 구간별 성능을 함께 보고한다.'''

[[questions.choices]]
text = "앞으로 등록될 서열에 대한 성능. 새 가족에 대한 일반화는 따로 확인해야 한다."
correct = true

[[questions.choices]]
text = "처음 보는 단백질 가족에 대한 일반화. 미래 데이터는 학습에 쓰이지 않았기 때문이다."
feedback = "미래에 등록된 서열도 대부분 기존 가족의 친척이다. 시간이 분리되었다고 진화적 유사성이 분리되지는 않는다."

[[questions.choices]]
text = "아무것도 뒷받침하지 못한다. 시간 분할은 누수를 만든다."
feedback = "시간 분할은 미래 시점의 성능을 재는 정당한 분할이다. 다만 새 가족에 대한 주장까지 대신하지 못한다."

[[questions]]
id = "zero-hits-upper-bound"
type = "numeric"
objective = 2
prompt = '''모델이 추천한 후보 50개를 실험했는데 활성인 것이 하나도 없었다. 실제 성공률 $p$의 단측 95% 상한(Clopper–Pearson)은? 0개 성공일 때 상한은 $1 - 0.05^{1/n}$이다. (소수 셋째 자리까지)'''
answer = 0.058
tolerance = 0.002
explanation = '''$n$번 중 0번 성공할 확률 $(1 - p)^n$이 0.05가 되는 $p$가 단측 95% 상한이다. $1 - 0.05^{1/50} \approx 0.058$이다. 즉 이 결과는 "성공률 0%"가 아니라 "5.8% 이하일 가능성이 높다"는 뜻이다. 근사적으로 $3/n$(= 0.06)이라 기억하기도 한다.'''

[[questions]]
id = "hit-rate-report"
type = "single"
objective = 2
prompt = '''한 논문이 "모델이 제안한 서열 중 7개의 활성을 실험으로 확인했다"고 보고한다. 이 결과를 해석하는 데 **가장 먼저** 필요한 정보는?'''
explanation = '''성공 수만으로는 성공률을 알 수 없다. 몇 개를 실험했는지(분모), 실험할 후보를 어떻게 골랐는지(모델 점수만인지, 사람이 추가로 걸렀는지), 무작위나 기존 방법으로 고른 후보의 성공률(비교 기준)이 있어야 모델의 기여를 판단할 수 있다. 실험 수가 적으면 신뢰구간도 함께 본다.'''

[[questions.choices]]
text = "활성이 확인된 서열의 구조 예측 신뢰도"
feedback = "구조 신뢰도는 부가 정보일 뿐이다. 분모와 비교 기준 없이는 7개가 많은지 적은지 판단할 수 없다."

[[questions.choices]]
text = "실험한 후보의 총수, 후보 선택 과정, 무작위·기존 방법의 성공률"
correct = true

[[questions.choices]]
text = "모델의 매개변수 수와 학습 시간"
feedback = "모델 규모는 성공률 해석과 무관하다."

[[questions]]
id = "in-silico-circularity"
type = "single"
objective = 2
prompt = '''단백질 설계 모델이 만든 서열을 구조 예측 모델에 넣었더니 90%가 목표 구조와 맞게 예측되었다. 두 모델은 같은 구조 데이터베이스로 학습되었다. 이 결과에 대한 판단으로 옳은 것은?'''
explanation = '''계산 검증은 필요조건일 뿐이다. 설계 모델과 검증 모델이 같은 데이터와 편향을 공유하면, 검증 모델이 설계 모델의 오차를 같은 방향으로 "맞다"고 판정할 수 있어 독립적인 검증이 아니다. 계산 검증 통과율은 실험 성공률의 상한에 가깝게 해석하고, 실험 검증으로 확인한다.'''

[[questions.choices]]
text = "구조 예측 모델이 정확하므로 실험 성공률도 약 90%로 예상할 수 있다."
feedback = "두 모델이 편향을 공유하면 계산 검증 통과율은 실험 성공률보다 크게 높을 수 있다."

[[questions.choices]]
text = "두 모델이 같은 데이터의 편향을 공유하므로 독립적인 검증이 아니다. 실험 검증이 필요하다."
correct = true

[[questions.choices]]
text = "같은 데이터로 학습한 모델끼리 비교했으므로 공정한 검증이다."
feedback = "같은 데이터라는 점이 바로 문제다. 검증은 설계 과정과 독립적일수록 강하다."

[[questions]]
id = "reproducibility-record"
type = "multiple"
objective = 3
prompt = '''서열 기능 예측 결과를 다른 연구실이 재현할 수 있도록 기록해야 하는 것을 모두 고르시오.'''
explanation = '''데이터베이스의 판과 최종 데이터셋의 지문, 분할을 만든 도구의 버전과 옵션(동일성 정의·기준값·군집 방식), 분할 파일과 시드가 있어야 같은 데이터·같은 분할을 다시 만들 수 있다. 가장 좋은 시드의 결과만 남기는 것은 재현이 아니라 선택 편향이고, 여러 시드의 평균과 흩어짐을 보고해야 한다.'''

[[questions.choices]]
text = "데이터베이스 판과 최종 데이터셋의 지문(해시)"
correct = true

[[questions.choices]]
text = "정렬·군집 도구의 버전과 옵션(동일성 정의, 기준값, 군집 방식)"
correct = true

[[questions.choices]]
text = "분할 파일과 분할·학습에 쓴 시드"
correct = true

[[questions.choices]]
text = "여러 시드 중 가장 좋은 결과 하나"
feedback = "가장 좋은 시드만 보고하면 성능이 부풀려진다. 여러 시드의 평균과 흩어짐을 보고한다."
