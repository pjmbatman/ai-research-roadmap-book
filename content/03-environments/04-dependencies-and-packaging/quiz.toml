# 3.4 의존성과 패키징 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "compatible-release"
type = "single"
objective = 1
prompt = "의존성 선언 `foo~=1.4.2`를 만족하는 버전은?"
explanation = "`~=`는 호환 릴리스(compatible release) 연산자다. `~=1.4.2`는 `>=1.4.2, ==1.4.*`와 같아서, 마지막 자리만 올라가는 1.4.x(단 1.4.2 이상)를 허용한다. 1.5.0은 두 번째 자리가 바뀌므로 제외된다. `~=1.4`라고 쓰면 `>=1.4, ==1.*`가 되어 1.5.0도 허용된다."

[[questions.choices]]
text = "1.4.9"
correct = true

[[questions.choices]]
text = "1.5.0"
feedback = "~=1.4.2는 마지막 자리(1.4.x)만 올라가는 것을 허용한다. 1.5.0까지 허용하려면 ~=1.4로 쓴다."

[[questions.choices]]
text = "2.0.0"
feedback = "major가 바뀌는 버전은 ~=1.4.2와 ~=1.4 모두 허용하지 않는다."

[[questions.choices]]
text = "1.4.1"
feedback = "~=1.4.2는 >=1.4.2를 포함한다. 1.4.1은 하한보다 낮다."

[[questions]]
id = "transitive-count"
type = "numeric"
objective = 1
prompt = '''프로젝트가 `pandas`, `scipy`, `matplotlib`에 직접 의존한다. 각 패키지의 의존성은 다음과 같다: `pandas` → `numpy`, `python-dateutil` / `scipy` → `numpy` / `matplotlib` → `numpy`, `pillow` / `python-dateutil` → `six`. 직접 의존성이 **아닌** 전이 의존성은 몇 개인가?'''
answer = 4
tolerance = 0
slider = { min = 0, max = 8, step = 1, unit = "개" }
explanation = "그래프를 따라가면 numpy, python-dateutil, pillow, six의 네 패키지가 전이 의존성이다. numpy는 세 패키지가 함께 요구하지만 한 번만 센다. 이렇게 여러 경로로 요구되는 패키지에는 각 경로의 버전 제약이 모두 걸리고, 그 교집합이 비면 충돌이 난다."

[[questions]]
id = "freeze-as-declaration"
type = "single"
objective = 2
prompt = "`pip freeze` 출력(설치된 모든 패키지의 `이름==버전` 목록)을 그대로 `pyproject.toml`의 `dependencies`에 넣으면 생기는 가장 큰 문제는?"
explanation = "freeze 결과에는 직접 의존성과 전이 의존성이 구분 없이 섞여 있고, 모두 정확한 버전으로 고정되어 있다. 무엇이 정말 필요한 의존성인지(의도)가 사라지고, 다른 플랫폼이나 Python 버전에서 필요한 다른 버전을 resolver가 고를 여지가 없어진다. 의존성 선언에는 직접 의존성과 필요한 범위만 쓰고, 정확한 버전 고정은 lockfile에 맡긴다."

[[questions.choices]]
text = "직접·전이 의존성이 섞이고 모두 정확한 버전으로 고정되어, 의도가 사라지고 다른 플랫폼에서 해를 찾기 어려워진다."
correct = true

[[questions.choices]]
text = "freeze의 `이름==버전` 형식은 pyproject.toml에서 쓸 수 없는 문법이다."
feedback = "`numpy==2.5.4`는 유효한 의존성 표기다. 문법이 아니라 내용이 문제다."

[[questions.choices]]
text = "freeze 결과에는 버전 정보가 없어서 재현이 안 된다."
feedback = "freeze는 정확한 버전을 모두 적는다. 문제는 오히려 너무 많이, 너무 정확하게 고정한다는 것이다."

[[questions.choices]]
text = "문제없다. 오히려 가장 안전한 의존성 선언이다."
feedback = "같은 머신에서는 재현될지 몰라도, 다른 OS·Python 버전에서는 그 정확한 버전의 wheel이 없을 수 있다. 의존성의 의도도 사라진다."

[[questions]]
id = "lockfile-facts"
type = "multiple"
objective = 2
prompt = "uv 프로젝트의 `pyproject.toml`과 `uv.lock`에 대해 옳은 설명을 모두 고르시오."
explanation = "`pyproject.toml`은 사람이 쓰는 의존성 선언(직접 의존성과 허용 범위)이고, `uv.lock`은 resolver가 그 선언을 풀어 얻은 결과(전이 의존성까지 정확한 버전, 파일 해시)다. 둘 다 저장소에 커밋한다. `uv sync --locked`는 lockfile이 선언과 맞지 않으면 갱신하지 않고 실패하므로, CI나 새 머신에서 '기록된 그대로'를 강제하는 데 쓴다. lockfile도 해당 플랫폼용 wheel이 없으면 소스 빌드가 필요하며, 같은 결과를 무조건 보장하지는 않는다."

[[questions.choices]]
text = "`uv.lock`은 전이 의존성까지 포함한 모든 패키지의 정확한 버전과 파일 해시를 기록한다."
correct = true

[[questions.choices]]
text = "`uv sync --locked`는 lockfile이 pyproject.toml과 맞지 않으면 lockfile을 고치지 않고 실패한다."
correct = true

[[questions.choices]]
text = "`uv.lock`과 `pyproject.toml`을 모두 저장소에 커밋한다."
correct = true

[[questions.choices]]
text = "`uv.lock`이 있으면 `pyproject.toml`의 `dependencies`는 지워도 된다."
feedback = "lockfile은 선언을 푼 결과다. 선언이 없으면 무엇을 왜 고정했는지, 다음에 무엇을 다시 풀어야 하는지 알 수 없다."

[[questions.choices]]
text = "lockfile이 있으면 어떤 OS와 아키텍처에서도 빌드 없이 같은 환경이 만들어진다."
feedback = "lockfile은 버전과 파일을 고정할 뿐이다. 그 플랫폼용 wheel이 없으면 소스 빌드가 일어나고, 컴파일러 등 시스템 조건에 따라 실패할 수 있다."

[[questions]]
id = "read-resolver-error"
type = "single"
objective = 3
prompt = '''`uv lock`이 다음 메시지로 실패했다.

"Because pandas>=3.1.1 depends on numpy>=2.0.2 and your project depends on numpy<2, we can conclude that your project and pandas>=3.1.1 are incompatible. And because your project depends on pandas==3.1.1, we can conclude that your project's requirements are unsatisfiable."

충돌의 원인을 가장 정확하게 요약한 것은?'''
explanation = "메시지는 추론의 사슬이다. pandas 3.1.1 이상은 numpy 2.0.2 이상을 요구하고, 프로젝트는 numpy 2 미만을 요구하므로 둘은 함께 설치될 수 없다. 그런데 프로젝트가 pandas==3.1.1을 요구하므로 전체 요구가 불가능하다. 해결은 두 제약 중 하나를 바꾸는 것이다: numpy<2가 꼭 필요하지 않다면 완화하고, 꼭 필요하다면 numpy 1.x를 지원하는 pandas 버전으로 내린다."

[[questions.choices]]
text = "프로젝트가 직접 건 `numpy<2`와 pandas 3.1.1이 요구하는 `numpy>=2.0.2`가 겹치지 않는다."
correct = true

[[questions.choices]]
text = "pandas 3.1.1이 PyPI에 존재하지 않는다."
feedback = "메시지는 pandas 3.1.1의 의존성(numpy>=2.0.2)을 알고 있다. 존재하지 않는 버전이면 다른 메시지가 나온다."

[[questions.choices]]
text = "네트워크 문제로 numpy 정보를 받지 못했다."
feedback = "네트워크 오류라면 연결 실패 메시지가 나온다. 이 메시지는 받아 온 메타데이터로 논리적 모순을 증명하고 있다."

[[questions.choices]]
text = "Python 버전이 너무 새로워 pandas를 설치할 수 없다."
feedback = "메시지 어디에도 Python 버전 제약은 등장하지 않는다. 충돌한 것은 numpy의 버전 범위다."

[[questions]]
id = "unexpected-source-build"
type = "single"
objective = 3
prompt = "Python 3.13 환경에서 `numpy<2`를 추가했더니, 설치가 몇 분 동안 C 코드를 컴파일하기 시작했다. 가장 가능성 높은 이유는?"
explanation = "패키지 관리자는 현재 Python·ABI·플랫폼에 맞는 wheel을 먼저 찾고, 없으면 소스 배포본(sdist)을 받아 그 자리에서 빌드한다. numpy 1.x의 마지막 버전에는 Python 3.13용(cp313) wheel이 없으므로 소스 빌드가 일어난다. 컴파일러와 빌드 도구가 없으면 실패하고, 있어도 오래 걸린다. 해결은 제약을 바꾸거나(numpy 2.x), wheel이 있는 Python 버전을 쓰는 것이다."

[[questions.choices]]
text = "제약을 만족하는 numpy 버전 중 Python 3.13용 wheel이 없어 소스 배포본(sdist)을 빌드하고 있다."
correct = true

[[questions.choices]]
text = "numpy는 항상 설치할 때 컴퓨터에 맞게 컴파일된다."
feedback = "맞는 wheel이 있으면 미리 컴파일된 파일을 내려받아 풀기만 한다. 컴파일은 wheel이 없을 때만 일어난다."

[[questions.choices]]
text = "GPU용 numpy를 빌드하기 위해 CUDA 코드를 컴파일하고 있다."
feedback = "numpy는 CPU 라이브러리다. 컴파일이 일어난 이유는 GPU가 아니라 맞는 wheel의 부재다."

[[questions.choices]]
text = "lockfile이 없어서 resolver가 모든 버전을 직접 빌드해 시험하고 있다."
feedback = "resolver는 메타데이터로 해를 찾는다. 후보마다 빌드하지 않는다. 빌드는 고른 버전에 맞는 wheel이 없을 때 일어난다."
