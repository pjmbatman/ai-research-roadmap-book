# 3.1 AI 소프트웨어 스택의 계층 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "nvidia-smi-cuda-version"
type = "single"
objective = 2
prompt = "`nvidia-smi` 출력 오른쪽 위에 표시되는 `CUDA Version`이 의미하는 것은?"
explanation = "이 값은 설치된 NVIDIA 드라이버가 지원하는 CUDA의 최대 버전이다. CUDA toolkit이 설치되어 있지 않아도 표시되며, 실제로 설치된 toolkit 버전은 `nvcc --version`으로, PyTorch가 빌드된 CUDA 버전은 `torch.version.cuda`로 따로 확인한다."

[[questions.choices]]
text = "현재 설치된 드라이버가 지원하는 CUDA의 최대 버전"
correct = true

[[questions.choices]]
text = "시스템에 설치된 CUDA toolkit의 버전"
feedback = "toolkit이 없어도 이 값은 표시된다. toolkit 버전은 nvcc로 확인한다."

[[questions.choices]]
text = "PyTorch가 사용하는 CUDA runtime의 버전"
feedback = "그 값은 torch.version.cuda로 확인한다."

[[questions]]
id = "torch-wheel-needs-toolkit"
type = "single"
objective = 1
prompt = "pip로 CUDA용 PyTorch wheel을 설치해 모델을 학습만 하려 한다(custom CUDA extension을 빌드하지 않음). 무엇이 시스템에 필요한가?"
explanation = "CUDA용 PyTorch wheel은 필요한 CUDA runtime 라이브러리를 함께 가져온다. 시스템에는 그 버전을 지원하는 NVIDIA 드라이버가 필요하다. CUDA toolkit(nvcc 등 컴파일러)은 소스에서 CUDA 코드를 빌드할 때 필요하다."

[[questions.choices]]
text = "호환되는 NVIDIA 드라이버. CUDA toolkit은 일반적으로 필요 없다."
correct = true

[[questions.choices]]
text = "PyTorch와 정확히 같은 버전의 CUDA toolkit과 드라이버"
feedback = "toolkit은 컴파일할 때 필요하다. 학습만 할 때는 wheel에 포함된 runtime을 쓴다."

[[questions.choices]]
text = "CUDA toolkit만 있으면 되고 드라이버는 필요 없다."
feedback = "GPU를 쓰려면 드라이버는 반드시 필요하다. 드라이버가 스택의 가장 아래층이다."

[[questions]]
id = "stack-order"
type = "single"
objective = 1
prompt = "다음 중 아래(하드웨어 쪽)에서 위(사용자 코드 쪽)로의 순서로 옳은 것은?"
explanation = "GPU 하드웨어 위에서 커널 모듈인 드라이버가 동작하고, CUDA runtime과 cuDNN 같은 라이브러리가 드라이버를 사용하며, PyTorch가 그 라이브러리들을 호출한다. 오류 메시지가 어느 층에서 나왔는지 구분하면 진단이 빨라진다."

[[questions.choices]]
text = "GPU → NVIDIA 드라이버 → CUDA runtime·cuDNN → PyTorch"
correct = true

[[questions.choices]]
text = "GPU → CUDA runtime → NVIDIA 드라이버 → PyTorch"
feedback = "runtime이 드라이버 위에서 동작한다."

[[questions.choices]]
text = "GPU → PyTorch → cuDNN → NVIDIA 드라이버"
feedback = "PyTorch가 가장 위층이다."

[[questions]]
id = "three-versions-scenario"
type = "multiple"
objective = 2
prompt = "한 서버에서 `nvidia-smi`의 `CUDA Version`은 12.4, `nvcc --version`은 11.8, `torch.version.cuda`는 12.1이다. 옳은 설명을 모두 고르시오."
explanation = "세 숫자는 서로 다른 계층의 정보다. 드라이버는 CUDA 12.4까지 지원하므로 PyTorch wheel에 들어 있는 CUDA 12.1 runtime이 문제없이 동작한다. 시스템 toolkit 11.8은 PyTorch 실행에 쓰이지 않고, custom CUDA extension을 컴파일할 때만 쓰인다. 이때 toolkit과 PyTorch의 CUDA major가 다르면 PyTorch의 extension 빌드 도구가 오류를 낸다."

[[questions.choices]]
text = "PyTorch의 GPU 연산은 wheel과 함께 설치된 CUDA 12.1 runtime으로 실행된다."
correct = true

[[questions.choices]]
text = "이 상태에서 custom CUDA extension을 빌드하면 nvcc 11.8과 PyTorch의 CUDA 12.1이 맞지 않아 문제가 된다."
correct = true

[[questions.choices]]
text = "PyTorch는 시스템에 설치된 toolkit 11.8로 실행되므로 12.1 기능을 쓸 수 없다."
feedback = "PyTorch wheel은 자기 CUDA runtime을 함께 가져온다. 시스템 toolkit은 실행 경로에 끼어들지 않는다."

[[questions.choices]]
text = "드라이버가 12.4를 보고하므로 PyTorch를 쓰려면 드라이버를 12.1용으로 낮춰야 한다."
feedback = "드라이버는 하위 호환이다. 12.4까지 지원하는 드라이버는 12.1 runtime을 그대로 실행한다."

[[questions]]
id = "runtime-count"
type = "numeric"
objective = 2
prompt = "`nvidia-smi`의 `CUDA Version`이 12.4인 서버가 있다. CUDA 11.8, 12.1, 12.4, 12.6, 13.0으로 빌드된 PyTorch 다섯 가지 중, minor version compatibility 같은 예외 규칙에 기대지 않고 '드라이버가 지원하는 버전 이하'라는 기본 규칙만으로 실행이 보장되는 것은 몇 개인가?"
answer = 3
tolerance = 0
slider = { min = 0, max = 5, step = 1, unit = "개" }
explanation = "드라이버는 자기가 지원하는 최대 CUDA 버전 이하로 빌드된 프로그램을 실행한다. 11.8, 12.1, 12.4의 세 개가 여기에 해당한다. 12.6은 같은 major(12)라서 minor version compatibility로 대부분 동작하지만, 일부 기능이 제한되는 예외 규칙에 기댄다. 13.0은 major가 높아 드라이버 업그레이드가 필요하다."

[[questions]]
id = "abi-undefined-symbol"
type = "single"
objective = 1
prompt = "직접 작성한 C++/CUDA extension이 빌드는 성공했는데, 다른 환경에서 `import`하자 `undefined symbol: _ZN...` 오류가 났다. 가장 먼저 의심할 원인은?"
explanation = "`undefined symbol`은 동적 링크 단계의 오류다. 확장 모듈이 기대하는 C++ 심볼이 실제로 불러온 라이브러리(대개 PyTorch의 libtorch)에 없다는 뜻이고, 빌드에 쓴 PyTorch 버전이나 C++ ABI 설정(`_GLIBCXX_USE_CXX11_ABI`)이 실행 환경과 다를 때 흔히 생긴다. 드라이버나 GPU 메모리 문제는 import가 아니라 CUDA를 호출하는 시점의 CUDA error로 나타난다."

[[questions.choices]]
text = "extension을 빌드한 PyTorch 버전 또는 C++ ABI가 import하는 환경과 다르다."
correct = true

[[questions.choices]]
text = "NVIDIA 드라이버가 너무 오래되었다."
feedback = "드라이버 문제는 import 시점의 심볼 오류가 아니라, CUDA를 처음 호출할 때 CUDA error나 GPU 인식 실패로 나타난다."

[[questions.choices]]
text = "CUDA toolkit이 설치되어 있지 않다."
feedback = "빌드가 성공했다는 것은 컴파일러가 있었다는 뜻이다. 실행 시점에는 toolkit이 아니라 링크된 라이브러리의 심볼이 맞아야 한다."

[[questions.choices]]
text = "GPU 메모리가 부족하다."
feedback = "메모리 부족은 텐서를 GPU에 올릴 때 out of memory 오류로 나타난다. import 단계와는 관계가 없다."
