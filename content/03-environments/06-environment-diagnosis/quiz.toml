# 3.6 환경 진단·재현·유지보수 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "missing-shared-library"
type = "single"
objective = 1
prompt = "`import torch`에서 `OSError: libcudart.so.12: cannot open shared object file: No such file or directory`가 났다. 가장 먼저 할 일은?"
explanation = "이 메시지는 동적 링커가 공유 라이브러리 파일을 찾지 못했다는 뜻이다. 드라이버나 GPU 문제가 아니라 '어디에서 라이브러리를 찾는가'의 문제다. 어느 python·어느 환경에서 실행했는지 확인하고, 해당 라이브러리를 제공해야 할 패키지가 그 환경에 설치되어 있는지, `LD_LIBRARY_PATH`가 다른 CUDA를 가리키고 있지 않은지, `ldd`로 무엇이 해석되지 않는지 본다. 여러 환경·도구를 섞어 쓸 때 흔히 생긴다."

[[questions.choices]]
text = "실행한 환경과 라이브러리 검색 경로(`LD_LIBRARY_PATH`, `ldd` 결과)를 확인해, 그 라이브러리가 어디에 있어야 하는데 없는지 찾는다."
correct = true

[[questions.choices]]
text = "NVIDIA 드라이버를 최신 버전으로 다시 설치한다."
feedback = "드라이버 문제라면 nvidia-smi가 실패하거나 CUDA 초기화 오류가 난다. 이 메시지는 파일을 찾지 못했다는 동적 링커의 오류다."

[[questions.choices]]
text = "GPU 메모리가 부족하므로 batch 크기를 줄인다."
feedback = "메모리 부족은 텐서를 GPU에 올릴 때 out of memory로 나타난다. import 단계의 파일 탐색 실패와는 무관하다."

[[questions.choices]]
text = "환경을 지우고 다른 도구로 처음부터 다시 만든다."
feedback = "결국 필요할 수도 있지만, 원인을 모른 채 다시 만들면 같은 문제가 반복될 수 있다. 근거부터 모은다."

[[questions]]
id = "no-kernel-image"
type = "single"
objective = 1
prompt = "새로 들여온 최신 GPU 서버로 옮기자 기존 환경에서 `CUDA error: no kernel image is available for execution on the device`가 났다. 드라이버는 그 GPU를 지원하는 최신 버전이다. 원인으로 가장 가능성 높은 것은?"
explanation = "이 오류는 실행하려는 바이너리에 그 GPU의 아키텍처(compute capability)용 GPU 코드가 들어 있지 않다는 뜻이다. 오래된 PyTorch 빌드는 새 GPU 세대가 나오기 전에 컴파일되었으므로 그 아키텍처를 지원하지 않을 수 있다. `torch.cuda.get_arch_list()`와 GPU의 compute capability를 비교하고, 그 GPU를 지원하는 PyTorch 빌드로 옮긴다. 드라이버를 바꿔도 해결되지 않는다."

[[questions.choices]]
text = "설치된 PyTorch 바이너리에 그 GPU 아키텍처용 kernel이 포함되어 있지 않다."
correct = true

[[questions.choices]]
text = "드라이버가 너무 새로워서 PyTorch와 맞지 않는다."
feedback = "드라이버는 하위 호환이다. 새 드라이버는 이전 CUDA로 빌드된 프로그램도 실행한다. 문제는 바이너리 안에 그 GPU용 코드가 있느냐다."

[[questions.choices]]
text = "CUDA toolkit(nvcc)이 설치되어 있지 않다."
feedback = "미리 컴파일된 PyTorch를 실행하는 데는 toolkit이 필요 없다. 바이너리에 없는 아키텍처의 kernel을 toolkit이 만들어 주지도 않는다."

[[questions.choices]]
text = "GPU 메모리가 부족하다."
feedback = "메모리 부족은 out of memory 메시지로 나타난다."

[[questions]]
id = "bisect-steps"
type = "numeric"
objective = 1
prompt = "lockfile의 git 기록에서, smoke test가 통과하던 커밋과 실패하는 커밋 사이에 lockfile을 바꾼 커밋이 64개 있다. 이분 탐색(bisect)으로 처음 실패한 커밋을 찾으려면, 최악의 경우 smoke test를 몇 번 실행해야 하는가?"
answer = 6
tolerance = 0
slider = { min = 1, max = 64, step = 1, unit = "번" }
explanation = "후보 커밋 64개 중 '처음 실패한 커밋'을 찾는다. 가운데 커밋을 시험할 때마다 후보가 절반으로 줄어 64 → 32 → 16 → 8 → 4 → 2 → 1, 즉 log₂64 = 6번이면 하나로 좁혀진다. 하나씩 시험하면 최악의 경우 64번이 필요하다. lockfile과 image digest를 커밋해 두었기 때문에 가능한 진단법이다."

[[questions]]
id = "issue-report-contents"
type = "multiple"
objective = 2
prompt = "라이브러리 저장소에 버그 보고(issue)를 올리려 한다. 보고에 넣어야 할 것을 모두 고르시오."
explanation = "다른 사람이 문제를 재현하고 원인 층을 가릴 수 있어야 한다. 오류의 전체 traceback, 환경 보고서(PyTorch라면 `python -m torch.utils.collect_env` 출력), 문제를 일으키는 최소 코드, 기대한 동작과 실제 동작, 이미 시도한 것이 필요하다. 전체 데이터셋은 공유할 수 없고 필요하지도 않다. 같은 shape·dtype의 합성 데이터로 재현하는 것이 최소 재현 예제다."

[[questions.choices]]
text = "오류의 전체 traceback(첫 줄부터 마지막 줄까지)"
correct = true

[[questions.choices]]
text = "환경 보고서(예: `python -m torch.utils.collect_env` 출력)"
correct = true

[[questions.choices]]
text = "문제를 재현하는 최소 코드와, 기대한 동작·실제 동작"
correct = true

[[questions.choices]]
text = "문제가 난 실험에 쓴 전체 데이터셋"
feedback = "공유할 수 없거나 너무 큰 경우가 대부분이고, 재현에 필요하지도 않다. 같은 shape·dtype의 합성 데이터로 재현한다."

[[questions.choices]]
text = "'GPU에서 안 돌아갑니다'라는 요약과 화면 캡처 한 장"
feedback = "어느 층에서 무엇이 실패했는지 알 수 없다. 텍스트로 된 전체 오류와 환경 정보가 필요하다."

[[questions]]
id = "minimal-reproduction"
type = "single"
objective = 2
prompt = "학습 스크립트(800줄, 사내 데이터 사용)가 특정 연산에서 NaN을 낸다. 최소 재현 예제를 만드는 올바른 방법은?"
explanation = "최소 재현은 '오류가 유지되는 한' 한 번에 하나씩 덜어 내는 과정이다. 데이터 로딩·로깅·설정 코드를 지우고, 실제 데이터 대신 문제를 일으키는 입력과 같은 shape·dtype·값 범위의 합성 데이터를 쓰고, 불필요한 의존성을 뺀다. 덜어 낼 때마다 오류가 여전히 나는지 확인한다. 오류가 사라지면 방금 뺀 것이 원인과 관련이 있다는 중요한 정보다."

[[questions.choices]]
text = "오류가 유지되는지 확인하면서 코드·데이터·의존성을 하나씩 덜어 내고, 실제 데이터는 같은 shape·dtype의 합성 데이터로 바꾼다."
correct = true

[[questions.choices]]
text = "스크립트 전체와 데이터 일부를 그대로 압축해 공유한다."
feedback = "받는 사람이 800줄 중 어디가 문제인지 찾아야 하고, 사내 데이터를 외부에 내보내는 문제도 생긴다."

[[questions.choices]]
text = "문제의 연산만 새로 짜서, 오류가 나는지 확인하지 않고 공유한다."
feedback = "새로 짠 코드가 같은 오류를 내는지 확인하지 않으면 재현 예제가 아니다. 줄일 때마다 오류가 유지되는지 확인한다."

[[questions.choices]]
text = "최신 버전으로 모든 패키지를 업그레이드해 보고, 그래도 나면 그때 만든다."
feedback = "여러 변수를 한꺼번에 바꾸면 무엇이 결과를 바꿨는지 알 수 없다. 현재 상태를 먼저 기록하고 재현한다."

[[questions]]
id = "rollback-prerequisites"
type = "multiple"
objective = 3
prompt = "공유 서버의 PyTorch 환경을 업그레이드하기 **전에** 갖춰야 rollback이 가능한 것을 모두 고르시오."
explanation = "rollback은 '이전 상태로 정확히 돌아가는 것'이므로 이전 상태가 기록되어 있어야 한다. 이전 lockfile(또는 image digest), 시스템 층의 패키지 버전 기록, 그리고 돌아갔는지 확인할 smoke test가 필요하다. 새 버전이 더 좋다는 기대는 rollback 준비를 대신하지 못한다."

[[questions.choices]]
text = "업그레이드 전 lockfile이 커밋되어 있거나, 이전 image가 digest로 보관되어 있다."
correct = true

[[questions.choices]]
text = "드라이버·CUDA 등 시스템 층 패키지의 현재 버전이 기록되어 있다."
correct = true

[[questions.choices]]
text = "업그레이드 후 같은 결과가 나오는지 확인할 smoke test와 그 기대 결과가 있다."
correct = true

[[questions.choices]]
text = "새 버전은 버그가 고쳐졌을 것이므로 rollback 준비는 필요 없다."
feedback = "새 버전은 새로운 동작 변화와 버그를 함께 가져온다. 돌아갈 길이 없으면 문제가 생겼을 때 모든 사용자가 멈춘다."
