# 3.3 Python 환경 관리: venv·pip·uv·conda — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "interpreter-managers"
type = "multiple"
objective = 1
prompt = "Python **인터프리터 자체**(예: 3.12와 3.13)를 내려받아 설치하고 관리할 수 있는 도구를 모두 고르시오."
explanation = "uv(`uv python install`), conda(환경을 만들 때 `python=3.12`처럼 지정), pyenv는 인터프리터를 설치·관리한다. venv는 이미 설치된 인터프리터를 가리키는 가상환경을 만들 뿐이고(`pyvenv.cfg`의 `home`), pip은 패키지 설치 도구다. venv로 3.12 환경을 만들려면 3.12 인터프리터가 먼저 시스템에 있어야 한다."

[[questions.choices]]
text = "uv"
correct = true

[[questions.choices]]
text = "conda"
correct = true

[[questions.choices]]
text = "pyenv"
correct = true

[[questions.choices]]
text = "venv"
feedback = "venv는 이미 있는 인터프리터를 사용해 가상환경 디렉터리를 만든다. 새 Python 버전을 설치하지 않는다."

[[questions.choices]]
text = "pip"
feedback = "pip은 실행 중인 인터프리터의 환경에 패키지를 설치할 뿐, 인터프리터를 바꾸지 않는다."

[[questions]]
id = "conda-pip-mixing"
type = "single"
objective = 1
prompt = "conda 환경에 pip으로 몇 개 패키지를 설치한 뒤, 다시 `conda install`로 다른 패키지를 추가했더니 import 오류가 나기 시작했다. 원인에 대한 설명으로 가장 적절한 것은?"
explanation = "conda는 pip이 설치한 패키지의 의존성 정보를 바탕으로 해를 풀지 않는다. 그래서 나중의 `conda install`이 pip이 설치한 패키지가 기대하던 버전을 바꾸거나 같은 파일을 덮어쓸 수 있다. 두 도구를 써야 한다면 conda로 설치할 수 있는 것을 먼저 모두 설치하고, pip은 마지막에 한 번만 쓰며, 그 뒤에 conda 패키지가 더 필요하면 환경을 처음부터 다시 만든다."

[[questions.choices]]
text = "conda는 pip이 설치한 패키지의 의존성을 고려하지 않고 풀기 때문에, 나중의 conda 설치가 그 패키지들이 기대하는 버전을 깨뜨릴 수 있다."
correct = true

[[questions.choices]]
text = "conda 환경에서는 pip을 쓸 수 없으므로, pip 설치는 처음부터 실패했어야 한다."
feedback = "conda 환경 안에서도 pip은 동작하고 패키지를 설치한다. 문제는 설치 후 두 관리자가 서로의 기록을 모른다는 것이다."

[[questions.choices]]
text = "pip이 설치한 패키지는 conda 환경 밖(시스템)에 설치되기 때문이다."
feedback = "conda 환경을 활성화한 상태에서 그 환경의 pip을 썼다면 패키지는 환경 안에 설치된다. 같은 디렉터리를 두 관리자가 따로 관리하는 것이 문제다."

[[questions.choices]]
text = "conda 패키지와 pip 패키지는 파일 형식이 달라 같은 환경에서 import할 수 없다."
feedback = "설치된 뒤에는 둘 다 같은 site-packages 아래의 모듈이다. import 자체는 가능하다."

[[questions]]
id = "pip-python-mismatch"
type = "single"
objective = 2
prompt = "`pip install numpy`는 성공했는데 `python train.py`에서 `ModuleNotFoundError: No module named 'numpy'`가 난다. 가장 먼저 할 일은?"
explanation = "`pip`과 `python`이 서로 다른 환경을 가리키고 있을 가능성이 가장 크다(활성화를 잊었거나, PATH 순서 때문에 다른 pip이 먼저 잡힘). `python -c 'import sys; print(sys.executable)'`와 `pip --version`(어느 python에 속한 pip인지 경로를 보여 준다)을 비교한다. 앞으로는 `python -m pip install ...`처럼 실행할 python을 명시하면 두 명령이 어긋날 수 없다."

[[questions.choices]]
text = "`sys.executable`과 `pip --version`이 보여 주는 경로를 비교해 같은 환경인지 확인한다."
correct = true

[[questions.choices]]
text = "`pip install --force-reinstall numpy`로 다시 설치한다."
feedback = "다른 환경을 가리키는 pip으로 다시 설치하면 같은 결과가 반복된다. 먼저 어느 환경에 설치되는지 확인한다."

[[questions.choices]]
text = "`sudo pip install numpy`로 시스템 전체에 설치한다."
feedback = "시스템 Python을 오염시키고, 여전히 실행 중인 python의 환경과 다를 수 있다. 격리의 원칙을 깨는 해결책이다."

[[questions.choices]]
text = "pip을 최신 버전으로 업그레이드한다."
feedback = "pip 버전은 '어느 환경에 설치했는가'와 관계가 없다."

[[questions]]
id = "externally-managed"
type = "single"
objective = 2
prompt = "Ubuntu 24.04의 시스템 Python에서 `pip install numpy`를 실행하자 `error: externally-managed-environment`가 나왔다. 올바른 대응은?"
explanation = "최근 배포판은 시스템 Python을 배포판 패키지 관리자(apt)의 소유로 표시해, pip이 그 환경을 바꾸지 못하게 막는다(PEP 668). 시스템 도구가 쓰는 Python을 지키기 위한 장치다. 프로젝트용 가상환경을 만들어(venv 또는 uv) 그 안에 설치하는 것이 의도된 사용법이다."

[[questions.choices]]
text = "프로젝트용 가상환경을 만들고 그 환경에 설치한다."
correct = true

[[questions.choices]]
text = "`--break-system-packages` 옵션을 붙여 그대로 설치한다."
feedback = "이름 그대로 시스템 패키지를 깨뜨릴 수 있다는 경고를 무시하는 옵션이다. 시스템 도구가 쓰는 Python의 패키지가 바뀐다."

[[questions.choices]]
text = "`sudo pip install numpy`로 권한을 높여 설치한다."
feedback = "권한 문제가 아니다. root로 설치하면 apt가 관리하는 파일을 덮어쓸 위험만 커진다."

[[questions.choices]]
text = "오류를 막는 표시 파일을 지운다."
feedback = "보호 장치를 없애는 것일 뿐이다. 시스템 Python과 프로젝트 의존성이 섞이는 문제는 그대로 남는다."

[[questions]]
id = "base-environment"
type = "single"
objective = 3
prompt = "연구실 규칙에 'conda의 base 환경(또는 시스템 Python)에는 프로젝트 패키지를 설치하지 않는다'를 넣으려 한다. 가장 중요한 이유는?"
explanation = "base 환경과 시스템 Python은 도구 자체(conda, OS 유틸리티)가 기대는 환경이다. 여기에 프로젝트 패키지를 쌓으면 프로젝트끼리 버전이 충돌하고, 잘못된 업그레이드 하나가 도구 자체를 망가뜨린다. 그 환경을 지우고 다시 만들 수도 없다. 프로젝트마다 지우고 다시 만들 수 있는 환경을 두는 것이 원칙이다."

[[questions.choices]]
text = "도구 자체가 기대는 환경이라 망가지면 복구가 어렵고, 프로젝트끼리 버전이 충돌한다."
correct = true

[[questions.choices]]
text = "base 환경에 설치한 패키지는 실행 속도가 느리다."
feedback = "패키지의 실행 속도는 어느 환경에 설치했는지와 관계가 없다."

[[questions.choices]]
text = "base 환경에는 GPU용 패키지를 설치할 수 없다."
feedback = "기술적으로는 설치된다. 문제는 설치할 수 있느냐가 아니라 격리와 복구 가능성이다."

[[questions.choices]]
text = "디스크 공간을 너무 많이 차지한다."
feedback = "오히려 환경을 여러 개 만드는 쪽이 디스크를 더 쓴다. 규칙의 이유는 공간이 아니라 격리다."

[[questions]]
id = "lab-standard-rules"
type = "multiple"
objective = 3
prompt = "연구실 Python 환경 표준 문서에 들어갈 내용으로 적절한 것을 모두 고르시오."
explanation = "표준의 목적은 누구나 같은 방법으로 환경을 만들고, 다른 사람이 그대로 재생성할 수 있게 하는 것이다. 기본 도구 하나, 예외를 허용하는 조건, 저장소에 커밋할 기록 파일, 환경 위치 규칙이 필요하다. 하나의 공유 환경은 격리의 반대이고, 도구를 각자 고르면 재생성 방법이 사람 수만큼 생긴다."

[[questions.choices]]
text = "기본 도구 하나(예: uv)와, 다른 도구(예: conda)를 허용하는 조건"
correct = true

[[questions.choices]]
text = "저장소에 커밋할 환경 기록 파일(예: pyproject.toml과 lockfile)"
correct = true

[[questions.choices]]
text = "환경 디렉터리를 두는 위치와 이름 규칙(예: 프로젝트 루트의 `.venv`)"
correct = true

[[questions.choices]]
text = "모든 프로젝트가 함께 쓰는 하나의 공용 환경"
feedback = "프로젝트마다 필요한 버전이 다르다. 하나의 환경은 충돌을 모아 둘 뿐이다."

[[questions.choices]]
text = "각자 익숙한 도구를 자유롭게 쓴다는 원칙"
feedback = "재생성 방법이 사람마다 달라져, 다른 사람이 환경을 다시 만들 수 없게 된다."
