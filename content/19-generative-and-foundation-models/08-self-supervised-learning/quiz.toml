# 19.8 자기지도학습 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "collapse-loss-value"
type = "numeric"
objective = 1
prompt = '''batch 크기 $N = 128$(view $2N = 256$개)로 NT-Xent 손실을 계산한다. encoder가 완전히 붕괴해 모든 입력을 같은 벡터로 보내면 손실은 얼마인가? (nat, 소수 둘째 자리까지)'''
answer = 5.54
tolerance = 0.01
explanation = '''모든 view의 표현이 같으면 짝과의 유사도와 다른 view와의 유사도가 모두 같다. 그러면 짝을 고르는 확률은 후보 $2N - 1 = 255$개에 균등하게 $1/255$이고, 손실은 $\log 255 \approx 5.54$다. temperature와 무관하다. contrastive 손실은 이처럼 붕괴한 표현에 우연 수준의 손실을 주므로 붕괴를 벌한다. 손실이 학습 중에 $\log(2N-1)$ 근처에 머물면 붕괴를 의심한다.'''

[[questions]]
id = "noncontrastive-collapse"
type = "single"
objective = 1
prompt = '''두 view의 표현 사이의 제곱 거리만 최소화하는 non-contrastive 손실에 대해 옳은 것은?'''
explanation = '''상수 함수(모든 입력 → 같은 벡터)가 손실 0을 달성하므로, 장치가 없으면 학습은 붕괴로 간다. 이 장의 실습에서 정렬 손실만 쓴 encoder는 표준편차 0.000, 유효 rank 1.88로 완전히 붕괴했다. BYOL의 이동평균 target과 predictor, SimSiam의 stop-gradient, VICReg의 분산·공분산 항이 붕괴를 막는 장치다.'''

[[questions.choices]]
text = "negative가 없어도 두 view를 맞추는 것만으로 좋은 표현이 학습된다."
feedback = "모든 입력을 같은 벡터로 보내는 상수 함수가 손실 0을 달성한다. 붕괴를 막는 장치가 따로 필요하다."

[[questions.choices]]
text = "손실만으로는 붕괴를 막을 수 없으므로 stop-gradient, 이동평균 target, 분산 정규화 같은 장치가 필요하다."
correct = true

[[questions.choices]]
text = "손실이 0에 가까워지면 표현이 두 view의 공통 정보를 모두 담았다는 뜻이다."
feedback = "붕괴한 표현도 손실이 0이다. 손실과 함께 표현의 표준편차·유효 rank·probe 성능을 확인해야 한다."

[[questions]]
id = "effective-rank-blind"
type = "single"
objective = 1
prompt = '''학습 중인 표현의 유효 rank(중심화한 특이값 분포의 엔트로피 지수)가 16차원 중 15.9로 높게 유지되고 있다. 이것만으로 말할 수 있는 것은?'''
explanation = '''유효 rank는 특이값의 **비율**만 보므로 표현의 크기에 둔감하다. 완전히 붕괴한 표현에 아주 작은 잡음만 남아 있어도, 그 잡음이 등방적이면 유효 rank는 높게 나온다(이 장의 cell 2에서 15.89). 차원 붕괴는 유효 rank로, 완전 붕괴는 차원별 표준편차(분산 벌점)로 잡으므로 둘을 함께 본다.'''

[[questions.choices]]
text = "표현이 붕괴하지 않았다."
feedback = "완전 붕괴 후 남은 아주 작은 등방 잡음도 유효 rank가 높다. 크기를 보는 지표(표준편차)를 함께 봐야 한다."

[[questions.choices]]
text = "차원 붕괴는 아닐 가능성이 높지만, 표현 전체가 거의 한 점에 모인 완전 붕괴인지는 표준편차를 따로 봐야 안다."
correct = true

[[questions.choices]]
text = "유효 rank가 높으므로 하위 과제의 linear probe 성능도 높을 것이다."
feedback = "무작위 초기화 망도 유효 rank가 높았다(실습에서 79.61). 퍼져 있다는 것은 유용하다는 것과 다르다."

[[questions]]
id = "shortcut-low-loss"
type = "single"
objective = 2
prompt = '''같은 표본의 두 view가 공유하는 장비 ID 표지를 증강이 건드리지 않는다. 표지만 읽는 encoder가 의미 있는 특징을 읽는 encoder보다 contrastive 손실이 낮았다. 무엇을 바꿔야 하는가?'''
explanation = '''두 view가 표본마다 고유한 표지를 공유하면, 표지만 읽어도 짝을 맞힐 수 있으므로 손실이 낮아진다(이 장에서 2.586 대 5.936). 그러나 하위 과제 정확도는 우연 수준(0.524)이었다. 증강이 그 표지를 무작위화하면 shortcut의 손실이 12.162로 치솟고 의미 있는 encoder가 가장 낮은 손실을 갖는다. pretext 손실이 아니라 증강 설계를 바꾸고, 표현의 품질은 하위 과제로 확인한다.'''

[[questions.choices]]
text = "손실이 더 낮은 표지 encoder를 고른다."
feedback = "pretext 손실은 표현의 품질을 재지 않는다. 표지 encoder의 하위 과제 정확도는 우연 수준이었다."

[[questions.choices]]
text = "증강이 표지를 무작위화하거나 제거하도록 바꿔, 두 view가 의미 있는 내용으로만 짝지어지게 한다."
correct = true

[[questions.choices]]
text = "temperature를 낮춰 어려운 negative에 더 집중하게 한다."
feedback = "temperature는 표지라는 단서를 없애지 못한다. 표지로 짝을 맞힐 수 있는 한 shortcut은 남는다."

[[questions]]
id = "augmentation-invariance"
type = "multiple"
objective = 2
prompt = '''과학 데이터의 contrastive 사전학습에서 증강을 고른다. 하위 과제를 해치지 **않을** 가능성이 높은 것을 모두 고르시오.'''
explanation = '''증강은 "이 성질은 표현이 무시해도 된다"는 선언이다. 하위 과제가 그 성질에 의존하지 않을 때만 안전하다. 세포 현미경 영상의 방향은 대개 의미가 없고, 감쇠 진동의 위상과 측정 이득은 진동수 추정과 무관하다. 반면 기상 장의 회전은 Coriolis 효과 때문에 물리적으로 다른 상황을 만들고, 분광 자료의 봉우리 이동은 화학 정보를 지운다.'''

[[questions.choices]]
text = "세포 형태 분류를 위한 현미경 영상의 회전·뒤집기"
correct = true

[[questions.choices]]
text = "진동수 추정을 위한 감쇠 진동 신호의 위상 무작위화와 진폭 배율"
correct = true

[[questions.choices]]
text = "강수 예측을 위한 전지구 기상 장의 무작위 회전"
feedback = "북반구·남반구와 위도에 따른 Coriolis 효과 때문에 회전한 기상 장은 물리적으로 다른 상황이다."

[[questions.choices]]
text = "물질 동정을 위한 분광 자료의 봉우리 위치 이동"
feedback = "봉우리 위치는 화학 정보 그 자체다. 이 증강은 하위 과제에 필요한 정보를 지운다."

[[questions]]
id = "label-budget"
type = "single"
objective = 3
prompt = '''레이블 10개로는 사전학습 표현이 입력 그대로보다 정확도가 0.07 높았고, 레이블 1,000개에서는 0.02 높았다. 가장 적절한 보고는?'''
explanation = '''사전학습의 이득은 하위 과제의 레이블 수에 따라 줄어드는 경우가 흔하다. 레이블이 많으면 하위 모델이 입력에서 직접 필요한 방향을 찾을 수 있기 때문이다. 그래서 효과는 레이블 수와 함께 보고하고, 같은 크기의 무작위 표현(구조만의 효과)과 같은 probe·예산의 baseline을 함께 둔다.'''

[[questions.choices]]
text = "사전학습이 정확도를 높인다."
feedback = "효과의 크기가 레이블 수에 따라 크게 다르다. 어떤 조건에서의 효과인지 빠진 보고다."

[[questions.choices]]
text = "레이블이 적을수록 사전학습의 이득이 크고, 레이블이 많아지면 줄어든다. 효과를 레이블 수별로, 무작위 표현·입력 baseline과 같은 예산에서 보고한다."
correct = true

[[questions.choices]]
text = "레이블 1,000개에서 이득이 작으므로 사전학습은 효과가 없다."
feedback = "레이블이 적은 영역의 큰 이득을 무시한다. 과학 연구에서는 레이블이 적은 경우가 흔하다."

[[questions]]
id = "fair-pretraining-comparison"
type = "multiple"
objective = 3
prompt = '''"자기지도 사전학습이 하위 과제 성능을 높였다"는 주장을 검증하려 한다. 필요한 통제를 모두 고르시오.'''
explanation = '''사전학습의 효과를 분리하려면 구조만의 효과(무작위 초기화 기준선), 데이터 겹침의 효과(사전학습 자료와 시험 자료의 분리), 튜닝의 효과(같은 downstream 예산)를 모두 통제해야 한다. 사전학습 손실의 크기는 표현의 품질을 말해 주지 않으므로 통제 조건이 아니다.'''

[[questions.choices]]
text = "같은 구조를 무작위 초기화한 모델을 같은 방식으로 평가한 기준선"
correct = true

[[questions.choices]]
text = "사전학습 자료에 하위 과제의 시험 표본(과 그 거의 같은 중복)이 들어 있지 않음을 확인"
correct = true

[[questions.choices]]
text = "모든 방법에 같은 하이퍼파라미터 탐색 공간·시도 횟수·학습 step"
correct = true

[[questions.choices]]
text = "사전학습 손실이 충분히 낮아졌는지 확인하는 것으로 위 통제를 대신"
feedback = "붕괴한 표현과 shortcut을 배운 표현도 손실이 낮다. 손실은 통제를 대신하지 못한다."
