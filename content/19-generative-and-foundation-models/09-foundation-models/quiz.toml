# 19.9 사전학습·전이·Foundation Model — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "foundation-vs-large"
type = "single"
objective = 1
prompt = '''한 연구가 "파라미터 10억 개의 모델을 우리 실험실의 자료 1테라바이트로 학습했으므로 이 분야의 foundation model이다"라고 주장한다. 이 주장을 평가하는 데 가장 필요한 정보는?'''
explanation = '''foundation model은 크기가 아니라 넓은 사전학습과 여러 하위 과제로의 적응 가능성에 대한 주장이다. 확인할 것은 사전학습 자료의 범위(출처·조건·modality), 적응해 본 하위 과제의 목록, 각 과제에서 처음부터 학습한 기준선과의 비교, 실패한 과제다. 파라미터 수, 자료의 바이트 수, 학습 손실은 이 질문에 답하지 않는다.'''

[[questions.choices]]
text = "같은 자료로 더 작은 모델을 학습했을 때의 사전학습 손실"
feedback = "사전학습 손실은 사전학습 과제에 대한 정보다. 다른 하위 과제로의 전이에 대해서는 말하지 않는다."

[[questions.choices]]
text = "사전학습 자료의 범위와, 여러 하위 과제에서 처음부터 학습한 기준선과 비교한 전이 결과(실패한 과제 포함)"
correct = true

[[questions.choices]]
text = "모델의 파라미터 수가 같은 분야의 다른 모델보다 큰지"
feedback = "크기는 전이 범위를 보장하지 않는다. 한 과제로 학습한 큰 모델은 큰 모델일 뿐이다."

[[questions.choices]]
text = "학습에 쓴 GPU 시간"
feedback = "계산량은 비용의 정보다. 무엇에 전이되는지에 대해서는 아무것도 말하지 않는다."

[[questions]]
id = "lora-param-count"
type = "numeric"
objective = 2
prompt = '''$1024 \times 1024$ 가중치 행렬 하나에 rank $r = 8$의 LoRA 갱신 $\mathbf{B}\mathbf{A}$를 건다. 학습하는 파라미터는 몇 개인가?'''
answer = 16384
tolerance = 0
explanation = '''$\mathbf{B} \in \mathbb{R}^{1024 \times 8}$, $\mathbf{A} \in \mathbb{R}^{8 \times 1024}$이므로 $8 \times (1024 + 1024) = 16{,}384$개다. 행렬 전체 $1024^2 = 1{,}048{,}576$개의 1.5625%다. 일반적으로 $r(d_{\text{in}} + d_{\text{out}})$개이고, $\mathbf{B}\mathbf{A}$의 원소 수($d_{\text{out}} d_{\text{in}}$)가 아니라 두 인수의 원소 수를 센다.'''

[[questions]]
id = "lora-init-zero"
type = "single"
objective = 2
prompt = '''LoRA에서 $\mathbf{A}$는 무작위로, $\mathbf{B}$는 0으로 초기화한다. 그 이유로 가장 정확한 것은?'''
explanation = '''$\mathbf{B} = \mathbf{0}$이면 $\mathbf{B}\mathbf{A} = \mathbf{0}$이므로 학습 시작 시점의 모델은 사전학습 모델과 정확히 같은 함수다. 미세조정이 사전학습 모델에서 출발해 조금씩 벗어나게 된다. $\mathbf{A}$까지 0이면 $\mathbf{B}$에 대한 gradient($\propto \mathbf{A}\mathbf{x}$)가 0이 되어 학습이 시작되지 않으므로, 한쪽은 무작위여야 한다.'''

[[questions.choices]]
text = "학습 시작 시점의 모델이 사전학습 모델과 정확히 같은 함수가 되도록"
correct = true

[[questions.choices]]
text = "B가 0이면 학습 중에도 갱신이 저랭크로 유지되기 때문에"
feedback = "갱신이 rank r 이하인 것은 B와 A의 모양(r개의 열·행) 때문이다. 초기값과는 무관하다."

[[questions.choices]]
text = "두 행렬을 모두 0으로 초기화하면 메모리를 아낄 수 있어서 한쪽만 0으로 둔다"
feedback = "초기값은 메모리와 무관하다. 둘 다 0이면 gradient가 0이 되어 학습이 시작되지 않는다."

[[questions]]
id = "transfer-method-small-data"
type = "single"
objective = 2
prompt = '''목표 과제의 레이블이 30개뿐이고, 사전학습 모델을 그대로 쓰면 성능이 어느 정도 나온다(원천과 목표가 닮았다). 가장 먼저 시도할 전이 전략은?'''
explanation = '''레이블이 적으면 full 미세조정은 많은 파라미터를 적은 표본으로 움직이며 사전학습 특징을 흔들기 쉽다. 이 장의 실습에서 레이블 32개일 때 full 미세조정(0.674)은 LoRA(0.781)보다, 심지어 고정 특징(0.685)보다도 낮았다. 싼 방법(고정 특징, LoRA)에서 시작해 처음부터 학습한 기준선과 비교하고, 이득이 있을 때만 학습하는 파라미터를 늘린다.'''

[[questions.choices]]
text = "적응 능력이 가장 크므로 full fine-tuning을 한다."
feedback = "적응 능력이 큰 만큼 30개 표본으로는 과적합과 특징 왜곡의 위험이 크다."

[[questions.choices]]
text = "고정 특징이나 LoRA처럼 학습 파라미터가 적은 방법에서 시작하고, 처음부터 학습한 기준선과 같은 예산으로 비교한다."
correct = true

[[questions.choices]]
text = "사전학습 모델을 버리고 작은 모델을 처음부터 학습한다."
feedback = "원천과 목표가 닮았으므로 전이의 이득이 클 가능성이 높다. 처음부터 학습은 기준선으로 함께 돌린다."

[[questions]]
id = "negative-transfer"
type = "single"
objective = 3
prompt = '''사전학습 모델을 미세조정해 목표 과제에서 $R^2 = 0.938$을 얻었다. 같은 자료·같은 예산으로 처음부터 학습한 모델은 $R^2 = 0.957$이었다. 옳은 해석은?'''
explanation = '''전이한 모델이 처음부터 학습한 기준선보다 나쁘면 부정적 전이다. 0.938은 그 자체로는 좋은 숫자처럼 보이지만, 사전학습이 오히려 해가 되었다는 뜻이다. 이 장의 장난감 문제에서 원천과 무관한 과제가 바로 이 결과(표본 200개에서 0.938 대 0.957)를 냈고, 표본 10개에서는 미세조정이 −0.685, 처음부터가 0.137로 차이가 훨씬 컸다. 기준선 없이 전이 결과만 보고하면 이것을 볼 수 없다.'''

[[questions.choices]]
text = "R²가 0.9를 넘으므로 전이가 성공했다."
feedback = "절댓값이 아니라 기준선과의 차이가 전이의 효과다. 처음부터 학습한 것보다 낮으므로 사전학습이 해가 되었다."

[[questions.choices]]
text = "부정적 전이다. 원천과 목표가 얼마나 닮았는지 점검하고, 레이블 수를 바꾼 학습 곡선으로 차이가 어디서 커지는지 본다."
correct = true

[[questions.choices]]
text = "차이가 작으므로 두 모델은 같다. 사전학습 모델을 쓰는 편이 낫다."
feedback = "같은 예산에서 일관되게 낮다면 사전학습의 비용을 들일 이유가 없다. 표본이 적을수록 이 차이는 커질 수 있다."

[[questions]]
id = "near-duplicate-split"
type = "multiple"
objective = 3
prompt = '''공개 사전학습 모델로 단백질 서열의 성질을 예측하는 하위 과제를 평가한다. 시험 자료와 사전학습 자료의 겹침에 대해 옳은 것을 모두 고르시오.'''
explanation = '''몇 자리만 바뀐 변이체는 정확한 일치 검사를 통과하므로 근사 중복 기준($k$-mer 유사도, 서열 동일성)이 필요하다. 겹친 시험 표본에서의 점수는 기억을 재므로, 겹침 여부로 나누어 보고해야 한다. 이 장에서 전체 정확도 0.77은 변이체 1.00과 새 서열 0.54의 평균이었다. 사전학습 자료가 공개되지 않으면 이 점검을 할 수 없고, 그 사실 자체를 한계로 보고한다.'''

[[questions.choices]]
text = "정확히 같은 서열이 없으면 겹침이 없다고 결론 낼 수 있다."
feedback = "몇 자리만 다른 변이체 100개는 정확한 일치 검사로 하나도 잡히지 않았다."

[[questions.choices]]
text = "k-mer 유사도나 서열 동일성 같은 근사 중복 기준으로 겹침을 찾는다."
correct = true

[[questions.choices]]
text = "시험 결과를 사전학습 자료와 겹치는 표본과 겹치지 않는 표본으로 나누어 보고한다."
correct = true

[[questions.choices]]
text = "사전학습 자료가 공개되지 않은 모델이면 점검이 불가능하므로 겹침이 없다고 가정한다."
feedback = "점검할 수 없다는 것은 겹침이 없다는 증거가 아니다. 점검 불가 자체를 평가의 한계로 적는다."
