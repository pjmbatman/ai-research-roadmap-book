# 27.3 다운스케일링과 기후 모델 에뮬레이션 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "downscaling-not-super-resolution"
type = "single"
objective = 1
prompt = '''기후 모델 출력의 통계적 다운스케일링을 영상 초해상도(super-resolution)와 같은 문제로 보면 놓치기 쉬운 것은?'''
explanation = '''저해상도 칸 하나에는 서로 다른 무수한 고해상도 장이 대응한다. 지형이 정하는 부분(산이 골짜기보다 춥다)은 저해상도 값과 고정 정보로 예측할 수 있지만, 국지 대류나 작은 소용돌이처럼 날마다 달라지는 세부 구조는 저해상도 값만으로 정해지지 않는다. 그래서 다운스케일링의 목표는 "가장 그럴듯한 한 장"이 아니라 "저해상도 조건 아래의 고해상도 분포"이고, 평가도 분포·극한·공간 구조로 해야 한다. 또 기후 모델 출력에는 편향이 있어서, 저해상도 입력이 관측을 성기게 만든 것이 아니라는 점도 영상 초해상도와 다르다.'''

[[questions.choices]]
text = "저해상도 값이 고해상도 세부 구조를 하나로 정하지 못하므로, 목표는 조건부 분포이고 평가도 분포 수준이어야 한다."
correct = true

[[questions.choices]]
text = "초해상도와 달리 다운스케일링은 결과가 하나로 정해지므로 MSE만으로 충분히 평가된다."
feedback = "반대다. 같은 저해상도 값에 여러 고해상도 장이 대응하고, MSE를 최소화하면 그 평균, 즉 지나치게 매끄러운 장이 나온다(본문: 국지 변동 표준편차비 0.37)."

[[questions.choices]]
text = "지형 같은 고정 정보는 학습 데이터에 이미 들어 있으므로 입력으로 넣을 필요가 없다."
feedback = "지형은 고해상도 기온과 강수의 공간 구조를 정하는 가장 중요한 정보다. 저해상도 입력에서는 지형이 평균으로 뭉개져 있으므로 고해상도 지형을 따로 넣는다."

[[questions.choices]]
text = "기후 모델의 저해상도 출력은 관측을 성기게 표본화한 것과 같으므로 편향을 신경 쓸 필요가 없다."
feedback = "기후 모델 출력에는 체계적 편향이 있다. 그래서 다운스케일링은 흔히 편향 보정과 함께 하거나, 관측 기반 저해상도 자료로 학습한 관계를 모델 출력에 적용할 때 그 차이를 따로 점검한다."

[[questions]]
id = "regression-underestimates-extremes"
type = "single"
objective = 2
prompt = '''저해상도 값에서 고해상도 기온을 예측하는 회귀 모델이 평균 오차는 가장 작았지만 고해상도 99% 분위수를 과소평가했다. 이유로 가장 옳은 것은?'''
explanation = '''제곱 오차를 최소화하는 예측은 조건부 평균 $\mathbb{E}[y \mid x]$다. 저해상도 값으로 설명되지 않는 국지 변동은 평균을 내면 상쇄되므로, 예측의 분산은 정답의 분산보다 작다. 분산이 작으면 분포의 꼬리도 짧아져 극한이 과소평가된다. 본문에서 회귀의 국지 변동 표준편차는 정답의 0.37배였고, 99% 분위수는 평균 0.38 °C 낮았다. 잔차 분포에서 표본을 더하면 분산과 극한은 돌아오지만, 점별 RMSE는 커진다(0.95 → 1.34).'''

[[questions.choices]]
text = "제곱 오차를 최소화하면 조건부 평균을 내므로, 예측할 수 없는 국지 변동이 지워져 분산과 꼬리가 줄어든다."
correct = true

[[questions.choices]]
text = "학습 데이터가 부족해 회귀 계수가 잘못 추정되었다."
feedback = "자료를 늘려도 조건부 평균은 조건부 평균이다. 분산 축소는 추정 오차가 아니라 평균 예측의 성질이다."

[[questions.choices]]
text = "1차 회귀가 너무 단순하기 때문이다. 깊은 신경망을 MSE로 학습하면 해결된다."
feedback = "MSE로 학습한 어떤 모델도 조건부 평균을 근사한다. 표현력이 커져도 예측할 수 없는 변동은 평균으로 지워진다."

[[questions.choices]]
text = "시험 기간의 기후가 학습 기간보다 따뜻해졌기 때문이다."
feedback = "본문의 자료는 정상(stationary)이다. 분포 이동 없이도 평균 예측은 꼬리를 줄인다."

[[questions]]
id = "qm-wet-day-fraction"
type = "numeric"
objective = 2
prompt = '''과거 기간에 모델은 강수일 비율이 50%(나머지 날은 0 mm), 관측은 30%다. 경험적 quantile mapping으로 보정하면, 보정한 과거 모델 자료의 강수일 비율은 얼마가 되는가? 소수로 답하시오.'''
answer = 0.30
tolerance = 0.02
slider = { min = 0, max = 1, step = 0.01 }
explanation = '''quantile mapping은 모델의 분위 $u$를 관측의 같은 분위 값으로 바꾼다. 관측은 하위 70% 분위가 0 mm이므로, 모델에서 하위 70%에 해당하는 값(모든 무강수일과 가장 약한 강수일 일부)은 0으로 바뀐다. 보정 후 강수일 비율은 관측과 같은 0.30이 된다. 본문에서도 0.49 → 0.29(관측 0.29)였다. 모델의 지나치게 잦은 약한 비(drizzle)를 이렇게 제거하는 것이 quantile mapping이 널리 쓰이는 이유 중 하나다.'''

[[questions]]
id = "qm-limits"
type = "multiple"
objective = 3
prompt = '''경험적 quantile mapping(과거 기간의 모델·관측 분위수로 만든 변환을 미래에도 그대로 적용)의 한계로 옳은 것을 모두 고르시오.'''
explanation = '''quantile mapping은 한 지점의 주변 분포(marginal distribution)를 과거 기간에서 맞출 뿐이다. 날짜의 순서나 여러 지점 사이의 공간 상관은 모델의 것을 그대로 두므로, 모델의 공간 구조가 틀렸으면 보정 후에도 틀리다. 변환이 비선형이라 미래의 변화 신호도 바꾼다. 본문에서 99.9% 분위수의 변화는 모델 +33%에서 보정 후 +74%가 되었다(Cannon 외, 2015가 같은 현상을 체계적으로 보였다). 보정 기간보다 큰 미래 값은 경험적 분위수 밖이라 외삽 규칙에 따라 잘리거나 임의로 늘어난다. 과거 기간의 분위수는 정의상 관측과 맞는다.'''

[[questions.choices]]
text = "여러 지점 사이의 공간 상관이나 날짜의 순서는 보정하지 않는다."
correct = true

[[questions.choices]]
text = "변환이 비선형이라 모델이 낸 미래 변화 신호(특히 극한의 상대 변화)를 바꿀 수 있다."
correct = true

[[questions.choices]]
text = "보정 기간보다 큰 미래 값은 경험적 분위수 범위 밖이라, 외삽 규칙에 따라 결과가 정해진다."
correct = true

[[questions.choices]]
text = "보정 기간 안에서도 모델의 분위수가 관측 분위수와 맞지 않는다."
feedback = "보정 기간 안에서는 정의상 맞는다(본문: 99% 분위수 24.33 대 24.33). 한계는 그 밖, 즉 공간·시간 구조와 미래 기간에 있다."

[[questions]]
id = "emulator-extrapolation"
type = "single"
objective = 3
prompt = '''강제력 0–4.5 W/m²의 시나리오로 학습한 세 에뮬레이터(선형, 2차 다항식, k-최근접 이웃)의 범위 안 검증 RMSE가 모두 0.15 K 안팎으로 비슷했다. 8.5 W/m² 시나리오에 쓸 에뮬레이터를 고르는 방법으로 가장 옳은 것은?'''
explanation = '''범위 안의 검증 오차는 범위 밖의 행동에 대해 아무것도 말하지 않는다. 본문에서 세 에뮬레이터의 8.5 W/m² 예측은 7.73, 9.44, 4.02 K로 크게 갈렸고, 2차 다항식이 맞은 것은 참 반응이 마침 2차 함수였기 때문이다. k-최근접 이웃 같은 비모수 모델은 학습 범위의 끝값에 머문다. 외삽이 필요하면 그 범위를 포함하는 학습 시나리오를 추가하거나, 에너지 수지 같은 물리 구조를 모델에 넣고, 그것도 안 되면 외삽 영역의 예측은 불확실하다고 보고해야 한다.'''

[[questions.choices]]
text = "학습 범위를 덮는 시나리오를 추가하거나 물리 구조로 함수 형태를 제약한다. 그럴 수 없으면 외삽 영역의 예측은 검증되지 않았다고 밝힌다."
correct = true

[[questions.choices]]
text = "범위 안 검증 RMSE가 가장 작은 에뮬레이터를 고른다."
feedback = "범위 안 RMSE의 차이(0.149 대 0.157 대 0.161)는 내부 변동성 수준이고, 범위 밖의 예측은 2배 넘게 갈린다. 범위 안의 순위는 외삽 성능의 근거가 아니다."

[[questions.choices]]
text = "가장 유연한 비모수 모델(k-최근접 이웃)을 고른다. 함수 형태를 가정하지 않으므로 가장 안전하다."
feedback = "k-최근접 이웃은 학습 범위 밖에서 가장 가까운 학습 시나리오의 값을 반복한다. 본문에서 8.5 W/m²에 4.02 K를 내, 참값 9.27 K의 절반도 안 되었다."

[[questions.choices]]
text = "세 에뮬레이터의 예측을 평균한다. 앙상블은 외삽 오차를 상쇄한다."
feedback = "세 예측이 모두 같은 방향으로 틀릴 수 있고, 평균은 어느 쪽이 맞는지 알려 주지 않는다. 예측이 갈린다는 사실 자체가 외삽이 불확실하다는 신호다."
