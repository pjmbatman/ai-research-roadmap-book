# 27.1 기상·기후 데이터의 기초 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "reanalysis-is-not-observation"
type = "single"
objective = 1
prompt = '''재분석 자료(reanalysis)에 대한 설명으로 가장 옳은 것은?'''
explanation = '''재분석은 과거의 관측을 하나의 고정된 수치 예보 모델과 자료동화 체계에 넣어, 관측이 없는 곳까지 물리적으로 일관된 격자장을 만든 것이다. 관측이 촘촘한 곳·변수에서는 관측에 가깝고, 관측이 드문 곳(과거의 남반구 해양, 극지방)이나 직접 관측되지 않는 변수(강수, 지표 플럭스)에서는 모델의 성질을 많이 물려받는다. 그래서 "관측"이 아니라 "관측으로 제약한 모델 추정치"로 다룬다.'''

[[questions.choices]]
text = "관측소 값을 거리 가중으로 격자에 보간한 것이라, 각 격자값은 관측값의 가중 평균이다."
feedback = "보간만 한 격자 관측 자료도 있지만 재분석은 다르다. 모델의 예보를 배경장으로 쓰고 관측으로 보정하므로, 관측이 없는 곳의 값은 주로 모델이 만든다."

[[questions.choices]]
text = "관측을 수치 모델과 자료동화로 결합해 만든 격자 추정치다. 관측이 드문 곳과 직접 관측되지 않는 변수에서는 모델의 성질이 많이 반영된다."
correct = true

[[questions.choices]]
text = "격자가 촘촘하고 모든 시공간을 채우므로 관측보다 항상 정확하다."
feedback = "빈틈이 없다는 것과 정확하다는 것은 다르다. 관측소 위치에서는 그 관측이 기준이고, 재분석에는 모델 오차와 관측 체계 변화에 따른 불연속이 있을 수 있다."

[[questions.choices]]
text = "기후 모델로 미래 시나리오를 시뮬레이션한 출력이다."
feedback = "그것은 기후 모델 시나리오 출력이다. 재분석은 관측으로 제약한 과거 대기 상태의 추정치다."

[[questions]]
id = "polar-cap-area"
type = "numeric"
objective = 2
prompt = '''지구를 구로 볼 때, 위도 60°보다 극 쪽(북극권과 남극권 쪽 두 지역을 합한 것)의 면적은 지구 표면적의 몇 분의 몇인가? 소수로 답하시오(예: 0.25).'''
answer = 0.134
tolerance = 0.005
slider = { min = 0, max = 0.5, step = 0.001 }
explanation = '''위도 $\varphi$ 띠의 면적은 $\cos\varphi\,d\varphi$에 비례하므로, 위도 $\varphi_0$보다 북쪽의 면적 비율은 $\int_{\varphi_0}^{\pi/2}\cos\varphi\,d\varphi \big/ 2 = (1 - \sin\varphi_0)/2$다. 남북 두 지역을 합하면 $1 - \sin 60° = 1 - 0.866 = 0.134$다. 위도 칸 개수로 세면 $60/180 = 1/3$이 나오는데, 이 차이가 면적 가중 없이 평균을 낼 때 극지방이 과대 대표되는 정도다.'''

[[questions]]
id = "unweighted-mean-bias"
type = "single"
objective = 2
prompt = '''규칙적인 위경도 격자의 지상 기온장에서 위도 가중 없이 모든 칸을 단순 평균했다. 기온은 적도에서 높고 극에서 낮다. 결과는 면적 가중 전구 평균과 비교해 어떻게 되는가?'''
explanation = '''규칙적인 위경도 격자에서는 위도마다 경도 칸 수가 같지만 칸의 면적은 $\cos\varphi$에 비례해 극으로 갈수록 줄어든다. 단순 평균은 면적이 작은 고위도 칸에 저위도 칸과 같은 무게를 주므로, 차가운 극지방이 과대 대표되어 평균이 낮게 나온다. 본문의 예에서는 277.5 K 대 285.0 K로 7.5 K 차이가 났다.'''

[[questions.choices]]
text = "극지방이 과대 대표되어 더 낮게 나온다."
correct = true

[[questions.choices]]
text = "칸 수가 많을수록 평균이 정확해지므로, 해상도가 충분하면 차이가 없다."
feedback = "해상도를 높여도 위도마다 칸 수가 같다는 구조는 그대로라서 편향은 사라지지 않는다. 편향은 격자 크기가 아니라 가중치의 문제다."

[[questions.choices]]
text = "적도 부근의 칸이 더 많으므로 더 높게 나온다."
feedback = "규칙적인 위경도 격자에서는 모든 위도에 같은 수의 경도 칸이 있다. 적도 칸이 많은 것이 아니라 적도 칸이 넓은 것이다."

[[questions.choices]]
text = "남북 반구가 대칭이므로 서로 상쇄되어 차이가 없다."
feedback = "반구 대칭은 남북 차이를 상쇄할 뿐, 적도와 극 사이의 무게 차이는 그대로 남는다."

[[questions]]
id = "accumulated-precip-rate"
type = "numeric"
objective = 3
prompt = '''어떤 예보 자료의 강수는 예보 시작부터 누적한 값 [mm]으로 6시간마다 저장되어 있다. 0, 6, 12, 18, 24시의 값이 0.0, 2.0, 5.5, 5.5, 9.0이다. 12시부터 24시까지의 평균 강수 강도는 몇 mm/h인가?'''
answer = 0.2917
tolerance = 0.005
explanation = '''누적량은 차분해야 기간 강수량이 된다. 12–24시 강수량은 $9.0 - 5.5 = 3.5$ mm이고, 12시간으로 나누면 $3.5 / 12 \approx 0.292$ mm/h다. 누적값 9.0을 그대로 24로 나누면(0.375) 0–12시의 강수가 섞이고, 누적값을 시간별 강수로 착각해 더하면 크게 부풀려진다.'''

[[questions]]
id = "missing-values-in-mean"
type = "single"
objective = 3
prompt = '''해수면 온도 격자의 육지 칸이 `NaN`이다. 전구 평균 해수면 온도를 구하는 방법으로 옳은 것은?'''
explanation = '''결측은 "값이 0"이 아니라 "값이 없음"이다. 결측 칸의 가중치를 분자와 분모 양쪽에서 빼야 바다만의 면적 가중 평균이 된다. 0으로 채우면 육지 면적만큼 평균이 0 K 쪽으로 끌려간다(본문 예: 230.72 K). `np.nanmean`은 결측을 빼지만 위도 가중이 없다.'''

[[questions.choices]]
text = "`NaN`을 0으로 채운 뒤 위도 가중 평균을 낸다."
feedback = "0 K는 물리적으로 의미 없는 값이다. 육지 면적만큼 평균이 크게 낮아진다."

[[questions.choices]]
text = "`np.nanmean`으로 유효한 칸만 평균한다."
feedback = "결측은 제대로 뺐지만 위도 가중이 빠졌다. 고위도 바다가 과대 대표된다."

[[questions.choices]]
text = "유효한 칸에서만 cos(위도) 가중치를 분자와 분모에 함께 쓴다."
correct = true

[[questions.choices]]
text = "결측 칸을 이웃한 바다 칸의 값으로 보간한 뒤 모든 칸을 가중 평균한다."
feedback = "보간은 육지 위에 가상의 바다를 만드는 것이라, 결과는 '바다의 평균'이 아니라 '바다와 가상 육지 해수의 평균'이 된다. 무엇의 평균인지가 달라진다."

[[questions]]
id = "anomaly-base-period"
type = "multiple"
objective = 3
prompt = '''월별 기온의 기후값과 편차에 대해 옳은 것을 모두 고르시오.'''
explanation = '''기후값은 기준 기간에서 같은 달끼리 평균한 값이고, 편차는 각 값에서 그 달의 기후값을 뺀 것이다. 편차는 계절 주기를 제거하므로 표준편차가 크게 줄고(본문 예: 7.15 → 0.86), 기준 기간 안에서는 정의상 평균이 0이다. 기준 기간이 다르면 편차의 값 전체가 상수만큼 이동하므로, 두 자료의 편차를 비교할 때는 기준 기간을 맞춰야 한다. 예측 모델을 평가할 때는 기후값을 학습 기간에서만 계산해야 시험 기간의 정보가 baseline에 새지 않는다.'''

[[questions.choices]]
text = "기준 기간 안에서 편차의 평균은 정의상 0이다."
correct = true

[[questions.choices]]
text = "두 자료의 편차를 비교하려면 기준 기간을 맞춰야 한다."
correct = true

[[questions.choices]]
text = "편차는 계절 주기를 빼므로 추세도 함께 제거된다."
feedback = "월별 기후값은 달마다 하나의 상수라서 계절 주기만 뺀다. 기준 기간 밖의 장기 추세는 편차에 그대로 남는다(본문 예: 1981–1990 편차 평균 -0.488 °C)."

[[questions.choices]]
text = "예측 모델을 평가할 때 기후값 baseline은 시험 기간을 포함한 전체 기간으로 계산하는 것이 가장 공정하다."
feedback = "전체 기간으로 계산하면 시험 기간의 평균이 baseline에 들어간다. 학습 기간의 정보만 쓰는 것이 시간 누수가 없는 비교다."
