# 27.2 데이터 기반 기상 예측 — 개념 퀴즈
# 형식: editorial/conventions.md §9. objective = 이 장 '학습 목표'의 번호(1부터).

[[questions]]
id = "rollout-instability"
type = "single"
objective = 1
prompt = '''한 step(6시간) 앞을 예측하도록 학습한 모델의 시험 기간 1-step RMSE가 매우 작았다. 그런데 출력을 다시 입력으로 넣어 수십 step을 굴리자 일부 예보가 발산했다. 가장 그럴듯한 원인은?'''
explanation = '''학습은 언제나 실제 대기 상태(학습 분포)를 입력으로 받았다. rollout에서는 모델 자신의 출력, 즉 작은 오차가 섞인 상태가 입력이 된다. 오차가 쌓여 상태가 학습 분포 밖으로 나가면 모델은 본 적 없는 입력을 받고, 그 출력은 더 멀리 벗어나는 되먹임이 생긴다. 1-step 오차가 작다는 것은 학습 분포 위에서의 성질이고, rollout의 안정성은 학습 분포 밖에서 모델이 어떻게 행동하는지에 달려 있다. 본문에서 입력 잡음 없이 학습한 모델은 1-step RMSE 0.15로 가장 정확했지만 356개 중 99개가 발산했다.'''

[[questions.choices]]
text = "rollout 중 쌓인 오차가 상태를 학습 분포 밖으로 밀어내고, 모델이 그곳에서 오차를 더 키우는 되먹임이 생겼다."
correct = true

[[questions.choices]]
text = "1-step RMSE가 아직 충분히 작지 않다. 1-step 오차를 더 줄이면 발산도 사라진다."
feedback = "1-step 오차가 가장 작은 모델이 가장 많이 발산하기도 한다(본문의 입력 잡음 0.0 모델). 1-step 정확도와 rollout 안정성은 다른 성질이다."

[[questions.choices]]
text = "대기가 혼돈계라서 어떤 모델이든 같은 시점에 발산한다."
feedback = "혼돈은 오차가 기후값 수준까지 커지게 할 뿐, 값이 무한대로 커지게 하지는 않는다. 참 동역학으로 굴린 예보는 발산하지 않았다(본문의 앙상블 셀)."

[[questions.choices]]
text = "학습과 시험을 시간 순서로 나눴기 때문에 시험 기간의 상태가 학습 기간과 너무 다르다."
feedback = "시험 기간의 1-step 오차는 작았다. 시험 기간의 실제 상태는 학습 분포 안에 있었다는 뜻이다. 문제는 모델 자신이 만든 상태다."

[[questions]]
id = "shared-local-weights"
type = "single"
objective = 1
prompt = '''본문의 모델은 모든 격자점이 같은 계수 15개를 공유하고, 각 격자점의 이웃 4개만 본다. 이 구조가 담은 가정으로 옳은 것은?'''
explanation = '''계수를 공유하면 "같은 국소 상태에는 어디서나 같은 변화가 따른다"는 위치 불변성(translation invariance)을 가정하고, 이웃만 보면 "짧은 시간 동안의 변화는 가까운 곳의 상태로 정해진다"는 국소성을 가정한다. Lorenz-96은 위도권 한 바퀴에서 모든 격자점이 같은 방정식을 따르므로 두 가정이 맞다. 실제 지구에서는 경도 방향 회전에 대해서는 대체로 성립하지만 위도에 따라 코리올리 힘과 격자 칸 면적이 달라지고 지형·해륙 분포가 위치마다 다르다. 그래서 실제 모델은 위치 정보(위도, 지형, 해륙 마스크)를 입력에 함께 넣는다.'''

[[questions.choices]]
text = "같은 국소 상태에는 위치와 무관하게 같은 변화가 따르고, 한 step의 변화는 가까운 이웃이 정한다."
correct = true

[[questions.choices]]
text = "모든 격자점이 독립적으로 변하므로 이웃을 보지 않아도 된다."
feedback = "이 모델은 이웃 4개를 입력으로 쓴다. 바람이 상태를 옮기는 이류(advection) 같은 과정 때문에 이웃 정보가 필요하다."

[[questions.choices]]
text = "계수를 공유하면 파라미터가 줄어 표현력이 떨어지므로, 정확도를 위해서는 격자점마다 따로 학습하는 것이 항상 낫다."
feedback = "참 동역학이 위치 불변이면 공유는 표현력을 잃지 않고 학습 자료를 격자점 수만큼 늘리는 효과가 있다. 격자점마다 따로 학습하면 같은 자료로 40배 많은 파라미터를 추정해야 한다."

[[questions.choices]]
text = "실제 지구 대기에서도 위도와 무관하게 성립하므로, 위치 정보는 입력에 넣을 필요가 없다."
feedback = "코리올리 힘, 칸 면적, 지형은 위치마다 다르다. 실제 모델은 위치 정보를 함께 넣는다."

[[questions]]
id = "ensemble-mean-smooth"
type = "single"
objective = 2
prompt = '''긴 리드 타임에서 앙상블 평균의 RMSE가 단일 결정론적 예보의 RMSE보다 작았다. 이에 대한 해석으로 옳은 것은?'''
explanation = '''예측 가능성이 사라지는 리드 타임에서는 멤버들이 서로 다른 방향으로 흩어지고, 평균은 예측할 수 없는 작은 규모의 변동을 상쇄해 기후값 쪽으로 다가간다. 그래서 MSE가 줄지만 평균장은 어떤 멤버보다도 매끄럽고, 실제로 일어날 수 있는 대기 상태가 아니다. 극한 사건의 강도나 공간 구조를 볼 때는 평균이 아니라 멤버(또는 예측분포)를 써야 한다. 본문에서 리드 40의 단일 예보 RMSE는 4.33으로 기후값(3.66)보다 나빴고, 앙상블 평균은 3.28이었다.'''

[[questions.choices]]
text = "앙상블 평균은 예측할 수 없는 변동을 평균으로 지운 매끄러운 장이라서 MSE가 작다. 그 자체가 실현 가능한 대기 상태는 아니다."
correct = true

[[questions.choices]]
text = "앙상블 평균이 더 정확한 대기 상태이므로, 극한 사건의 강도도 앙상블 평균으로 판단하는 것이 가장 좋다."
feedback = "평균은 극값을 상쇄한다. 멤버마다 다른 곳에 생긴 강한 강수는 평균하면 넓고 약한 강수가 된다."

[[questions.choices]]
text = "멤버가 20개라서 평균의 표본 잡음이 작아졌을 뿐이다. 멤버가 하나여도 같은 효과가 있다."
feedback = "멤버가 하나면 평균할 것이 없다. 효과의 원천은 서로 다른 초기조건에서 출발한 멤버들이 예측 불가능한 부분에서 갈라진다는 데 있다."

[[questions.choices]]
text = "단일 예보의 모델이 앙상블 멤버의 모델보다 나쁘기 때문이다."
feedback = "본문의 단일 예보와 멤버는 같은 참 동역학으로 굴렸다. 모델 차이가 아니라 평균의 효과다."

[[questions]]
id = "two-member-crps"
type = "numeric"
objective = 2
prompt = '''멤버 두 개짜리 앙상블 예보가 $\{1, 3\}$이고 관측이 $y = 2.5$다. 표본 CRPS $\mathbb{E}\lvert X - y\rvert - \tfrac{1}{2}\mathbb{E}\lvert X - X'\rvert$의 값은? ($X, X'$은 멤버에서 독립으로 뽑은 값이고, 같은 멤버를 두 번 뽑는 경우도 포함한다.)'''
answer = 0.5
tolerance = 0.01
explanation = '''$\mathbb{E}\lvert X - y\rvert = (\lvert 1 - 2.5\rvert + \lvert 3 - 2.5\rvert)/2 = (1.5 + 0.5)/2 = 1.0$이다. 멤버 쌍 $(1,1), (1,3), (3,1), (3,3)$의 차이는 $0, 2, 2, 0$이므로 $\mathbb{E}\lvert X - X'\rvert = 1.0$이다. CRPS $= 1.0 - 0.5 = 0.5$다. 같은 관측에 점 예보 2(두 멤버의 평균)를 내면 CRPS는 절댓값 오차 0.5로 같고, 점 예보 1이면 1.5다. 둘째 항이 퍼짐에 대한 보상이라서, 관측을 감싸는 앙상블은 평균 오차만 보는 것보다 유리하게 평가된다.'''

[[questions]]
id = "skill-score-value"
type = "numeric"
objective = 3
prompt = '''어떤 리드 타임에서 모델의 RMSE가 2.0, 기후값 baseline의 RMSE가 4.0이다. MSE 기반 스킬 점수 $1 - \mathrm{MSE}_\text{model} / \mathrm{MSE}_\text{ref}$는?'''
answer = 0.75
tolerance = 0.005
explanation = '''MSE는 RMSE의 제곱이므로 $1 - 2^2/4^2 = 1 - 4/16 = 0.75$다. RMSE의 비로 계산하면 $1 - 2/4 = 0.5$가 나오는데, 이는 다른 정의다. 스킬 점수는 정의(MSE 비인지 RMSE 비인지, 어떤 baseline인지)를 함께 적어야 비교할 수 있다. 0이면 baseline과 같고, 음수면 baseline보다 나쁘다.'''

[[questions]]
id = "persistence-long-lead"
type = "numeric"
objective = 3
prompt = '''정상(stationary) 과정에서 리드 타임이 충분히 길어 현재 상태와 미래 상태가 무상관이 되면, 지속성 예보의 RMSE는 기후값 예보 RMSE의 몇 배가 되는가? 소수 둘째 자리까지 답하시오.'''
answer = 1.41
tolerance = 0.02
explanation = '''기후값 예보의 오차는 $y - \mu$로 분산이 $\sigma^2$다. 지속성 예보의 오차는 $y_{t+h} - y_t$이고, 둘이 무상관이면 분산이 $\sigma^2 + \sigma^2 = 2\sigma^2$다. RMSE 비는 $\sqrt{2} \approx 1.41$이다. 본문의 Lorenz-96에서도 긴 리드의 지속성 RMSE(5.22–5.48)가 기후값 RMSE(3.66)의 약 1.4–1.5배였다. 날카롭지만 예측력이 없는 예보는 기후값보다 나쁘다. 긴 리드의 결정론적 예보도 같은 이유로 기후값보다 나빠진다.'''

[[questions]]
id = "time-split-leakage"
type = "multiple"
objective = 3
prompt = '''하루 4번(6시간 간격)의 재분석 자료로 데이터 기반 예보 모델을 학습하고 평가하려 한다. 시간 누수 없이 평가하는 방법을 모두 고르시오.'''
explanation = '''대기 상태는 며칠 동안 강하게 자기상관되어 있다. 시각을 무작위로 섞어 나누면 시험 시각의 바로 앞뒤 6시간이 학습에 들어가, 모델은 예측이 아니라 보간을 배운다. 학습과 시험은 시간 순서로 나누고, 경계에 자기상관 길이보다 긴 간격(gap)을 둔다. 기후값·정규화 통계처럼 baseline과 전처리에 쓰는 통계도 학습 기간에서만 계산한다. 계절에 따라 성능이 다르므로 시험 기간은 최소 1년을 포함하는 것이 좋다.'''

[[questions.choices]]
text = "연도 단위로 나눠 앞의 연도로 학습하고 뒤의 연도로 시험하며, 경계에 며칠 이상의 간격을 둔다."
correct = true

[[questions.choices]]
text = "기후값 baseline과 입력 정규화 통계를 학습 기간에서만 계산한다."
correct = true

[[questions.choices]]
text = "모든 시각을 무작위로 섞어 80%를 학습, 20%를 시험에 쓴다. 표본이 많아 공정하다."
feedback = "시험 시각의 6시간 전후 상태가 학습에 들어간다. 자기상관 때문에 시험 점수가 실제 예보 성능보다 크게 좋아진다."

[[questions.choices]]
text = "시험 기간을 학습 기간 가운데의 한 달로 잡아 계절 효과를 맞춘다."
feedback = "시험 기간의 앞뒤가 모두 학습에 쓰여 경계에서 누수가 생기고, 한 달은 계절 하나만 대표한다. 시험은 학습 이후의 연속된 기간으로 잡는다."
