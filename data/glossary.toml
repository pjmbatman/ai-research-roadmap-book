# 용어집: 책 전체에서 쓰는 용어의 단일 원천.
# ko = 본문 표기, en = 영어, keep_en = true면 본문에서도 영어 그대로 쓴다.
# 부록 B(용어집)와 웹 UI 용어 툴팁이 이 파일에서 생성된다.

[[terms]]
ko = "아핀 변환"
en = "affine transformation"
definition = "선형 변환 뒤에 평행이동을 더한 변환 x ↦ Ax + b."

[[terms]]
ko = "계수"
en = "rank"
keep_en = true
definition = "행렬의 column space(또는 row space)의 차원."

[[terms]]
ko = "다양체"
en = "manifold"
definition = "각 점의 근방이 유클리드 공간과 닮은 공간."

[[terms]]
ko = "조건부분포"
en = "conditional distribution"
definition = "다른 변수의 값이 주어졌을 때 한 변수의 분포 p(y|x)."

[[terms]]
ko = "우도"
en = "likelihood"
definition = "관측 데이터가 고정되었을 때 파라미터의 함수로 본 p(D|θ)."

[[terms]]
ko = "사후분포"
en = "posterior distribution"
definition = "데이터를 관측한 뒤의 파라미터 분포 p(θ|D)."

[[terms]]
ko = "역전파"
en = "backpropagation"
definition = "계산 그래프에서 reverse-mode 자동미분으로 gradient를 계산하는 방법."

[[terms]]
ko = "데이터 누수"
en = "data leakage"
definition = "평가 시점에 쓸 수 없는 정보가 학습이나 모델 선택에 섞여 들어가 성능이 과대평가되는 현상."

[[terms]]
ko = "기준 모델"
en = "baseline"
keep_en = true
definition = "제안 방법의 개선을 측정하기 위한 비교 기준 모델."

[[terms]]
ko = "체크포인트"
en = "checkpoint"
keep_en = true
definition = "학습을 재개하거나 평가하기 위해 저장한 모델·optimizer·스케줄러·RNG 등의 상태."

[[terms]]
ko = "보정"
en = "calibration"
keep_en = true
definition = "예측 확률·구간이 실제 빈도와 일치하는 정도."

[[terms]]
ko = "분포 이동"
en = "distribution shift"
definition = "학습 데이터와 적용 대상 데이터의 분포가 달라지는 현상."

[[terms]]
ko = "아핀 결합"
en = "affine combination"
definition = "계수의 합이 1인 점들의 선형 결합. 계수가 모두 0 이상이면 convex 결합이다."

[[terms]]
ko = "동차좌표"
en = "homogeneous coordinates"
definition = "벡터에 1을 덧붙여 아핀 사상을 한 차원 높은 공간의 행렬 곱으로 쓰는 좌표."

[[terms]]
ko = "조각별 아핀 함수"
en = "piecewise affine function"
definition = "정의역을 여러 영역으로 나누어 각 영역에서 아핀 함수가 되는 함수. ReLU 신경망이 이런 함수다."

[[terms]]
ko = "활성 패턴"
en = "activation pattern"
definition = "입력 하나에 대해 ReLU 신경망의 각 뉴런이 켜졌는지 꺼졌는지를 모은 것. 같은 패턴의 입력에는 같은 아핀 사상이 적용된다."

[[terms]]
ko = "보편 근사 정리"
en = "universal approximation theorem"
definition = "다항식이 아닌 활성화 함수를 쓰는 은닉층 하나짜리 신경망이 compact set 위의 연속함수를 원하는 정확도로 균등 근사할 수 있다는 정리."

[[terms]]
ko = "이분산"
en = "heteroscedastic"
definition = "잡음의 분산이 입력에 따라 달라지는 성질. 분산이 일정하면 등분산(homoscedastic)이다."

[[terms]]
ko = "분위수 회귀"
en = "quantile regression"
definition = "pinball loss를 최소화해 조건부분포의 τ 분위수를 추정하는 회귀."

[[terms]]
ko = "적정 점수 규칙"
en = "proper scoring rule"
definition = "참 분포를 그대로 보고할 때 기대 점수가 가장 좋은 예측분포 평가 규칙. NLL과 CRPS가 대표적이다."

[[terms]]
ko = "예측 구간"
en = "prediction interval"
definition = "아직 관측하지 않은 새 값을 정해진 확률로 덮도록 만든 구간. 관측 잡음 때문에 데이터가 늘어도 일정 폭 아래로 좁아지지 않는다."

[[terms]]
ko = "신뢰 구간"
en = "confidence interval"
definition = "평균이나 파라미터 같은 고정된 미지량을 정해진 빈도로 덮도록 만든 구간. 데이터가 늘면 좁아진다."

[[terms]]
ko = "우연적 불확실성"
en = "aleatoric uncertainty"
keep_en = true
definition = "데이터 생성 과정 자체의 무작위성에서 오는 불확실성. 데이터를 늘려도 줄지 않는다."

[[terms]]
ko = "인식적 불확실성"
en = "epistemic uncertainty"
keep_en = true
definition = "모델이 아직 모르는 데서 오는 불확실성(파라미터·모델 구조). 데이터가 늘면 줄어들 수 있다."
