# 인터랙티브 위젯 레지스트리.
# 본문에서 `::widget{name="..."}`로 삽입한다. name은 이 파일에 등록되어 있어야 한다(check가 검증).
# 프론트엔드 구현: apps/web/src/widgets/<name>/
# 화면·조작 규칙은 editorial/design-system.md(ADR 0010)를 따른다. 위젯별 조작 명세는 구현할 때 이 파일이 아니라 장 명세에 쓴다.
#
# 필드
#   name      kebab-case 고유 이름 (= 구현 디렉터리 이름). 진도 기록의 키이므로 바꾸지 않는다
#   title     한국어 이름
#   chapters  사용하는 장 id 목록 (첫 번째가 주 사용처)
#   status    planned | prototype | implemented

