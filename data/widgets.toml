# 인터랙티브 위젯 레지스트리.
# 본문에서 `::widget{name="..."}`로 삽입한다. name은 이 파일에 등록되어 있어야 한다(check가 검증).
# 프론트엔드 구현: apps/web/src/widgets/<name>/ (status = implemented가 되면 존재해야 함)
#
# 필드
#   name        kebab-case 고유 이름 (= 구현 디렉터리 이름)
#   title       한국어 이름
#   chapters    사용하는 장 id 목록 (첫 번째가 주 사용처)
#   status      planned | prototype | implemented
#   interaction 학습자가 하는 일(직접 조작 → 관찰)
#   binds       페이지 상태로 내보내는 변수. 같은 페이지의 코드 셀·수식·다른 위젯과 공유된다
#   motion      애니메이션이 설명하는 과정 (없으면 생략)

[[widgets]]
name = "linear-map-2d"
title = "2차원 선형·아핀 사상"
chapters = ["linear-algebra/vector-spaces", "linear-algebra/affine-and-nonlinear"]
status = "planned"
interaction = "basis 벡터를 끌거나 행렬 성분·bias를 입력하면 격자와 도형이 변형된다. bias를 켜고 끄며 원점 보존 여부를 본다"
binds = ["A", "b"]
motion = "항등 사상에서 목표 사상으로 격자가 연속적으로 변형되는 보간"

[[widgets]]
name = "relu-regions"
title = "ReLU 신경망의 조각별 아핀 영역"
chapters = ["linear-algebra/affine-and-nonlinear", "deep-learning-pytorch/neural-network-components"]
status = "planned"
interaction = "뉴런 수와 가중치를 바꾸면 2차원 입력 공간이 선형 영역으로 나뉘는 모습과 영역 수가 갱신된다"
binds = ["weights"]

[[widgets]]
name = "svd-explorer"
title = "SVD: 회전–스케일–회전"
chapters = ["linear-algebra/svd-and-pca"]
status = "planned"
interaction = "행렬을 고르면 단위원이 세 단계로 타원이 되는 과정을 단계별로 재생하고, rank-k 근사의 오차를 본다"
binds = ["A", "k"]
motion = "V^T 회전 → Σ 스케일 → U 회전의 3단계 애니메이션"

[[widgets]]
name = "autodiff-graph"
title = "계산 그래프와 역전파"
chapters = ["calculus-and-autodiff/automatic-differentiation"]
status = "planned"
interaction = "식을 입력하면 계산 그래프가 그려지고, forward 값과 backward gradient를 한 노드씩 진행한다"
binds = ["expression"]
motion = "forward 값이 왼쪽→오른쪽, gradient가 오른쪽→왼쪽으로 흐르는 단계 재생"

[[widgets]]
name = "float-precision"
title = "부동소수점 비트 구조"
chapters = ["numerical-methods/floating-point"]
status = "planned"
interaction = "수를 입력하면 fp32·fp16·bf16의 부호·지수·가수 비트와 반올림 오차가 표시된다"
binds = ["x"]

[[widgets]]
name = "ode-stability"
title = "ODE solver의 step 크기와 안정성"
chapters = ["numerical-methods/ode-solvers"]
status = "planned"
interaction = "step 크기와 방법(explicit/implicit)을 바꾸어 stiff 문제의 해가 발산·수렴하는 모습을 비교한다"
binds = ["h", "method"]

[[widgets]]
name = "optimizer-landscape"
title = "손실 지형 위의 optimizer 궤적"
chapters = ["optimization/first-order-methods", "optimization/adaptive-methods"]
status = "planned"
interaction = "등고선 위에서 시작점·학습률·momentum·optimizer를 바꾸어 궤적을 비교한다"
binds = ["lr", "momentum", "optimizer"]
motion = "여러 optimizer가 동시에 이동하는 궤적 재생(일시정지·한 step씩 가능)"

[[widgets]]
name = "distribution-explorer"
title = "분포 탐색기"
chapters = ["probability/distributions", "probability/random-variables"]
status = "planned"
interaction = "분포와 파라미터를 바꾸어 PDF·CDF·샘플 히스토그램을 함께 본다"
binds = ["dist", "params", "samples"]

[[widgets]]
name = "gaussian-conditioning"
title = "다변량 가우시안의 조건부분포"
chapters = ["probability/multivariate-gaussian"]
status = "planned"
interaction = "2차원 가우시안의 공분산을 조절하고, x1 값을 끌어 조건부분포 p(x2|x1)의 이동을 본다"
binds = ["mu", "Sigma", "x1"]

[[widgets]]
name = "loss-to-estimator"
title = "손실함수가 고르는 대표값"
chapters = ["statistical-inference/distributional-formulation"]
status = "planned"
interaction = "조건부분포 모양(단봉·쌍봉·비대칭)을 바꾸고 MSE·MAE·pinball 손실의 최적 예측이 어디에 놓이는지 본다"
binds = ["tau", "shape"]

[[widgets]]
name = "bayesian-update"
title = "순차적 베이지안 갱신"
chapters = ["bayesian-inference/bayesian-thinking", "bayesian-inference/conjugate-models"]
status = "planned"
interaction = "관측을 하나씩 추가하며 사전분포가 사후분포로 바뀌는 과정을 본다. 사전 강도를 조절한다"
binds = ["prior", "observations"]
motion = "관측 하나마다 사후분포가 갱신되는 전이"

[[widgets]]
name = "gp-regression"
title = "Gaussian process 회귀"
chapters = ["bayesian-inference/gaussian-processes"]
status = "planned"
interaction = "점을 클릭해 관측을 추가하고 커널·길이척도·잡음을 바꾸어 사후 평균과 신뢰 띠를 본다"
binds = ["X", "y", "kernel"]

[[widgets]]
name = "split-leakage"
title = "데이터 분할과 누수"
chapters = ["data/splitting-and-leakage"]
status = "planned"
interaction = "셀·시간 축으로 배열된 샘플에 random·group·time split을 적용하고, 누수된 샘플과 성능 추정의 차이를 본다"
binds = ["split"]

[[widgets]]
name = "training-loop-stepper"
title = "학습 루프 단계 재생기"
chapters = ["deep-learning-pytorch/training-loop"]
status = "planned"
interaction = "작은 MLP의 한 step을 forward → loss → backward → optimizer update로 나누어 진행하며 각 텐서의 shape와 값을 확인한다"
binds = ["lr", "batch"]
motion = "데이터 흐름과 gradient 흐름을 단계별로 강조"

[[widgets]]
name = "attention-visualizer"
title = "Attention 계산"
chapters = ["architectures/transformers"]
status = "planned"
interaction = "토큰을 입력하고 Q·K·V, score, mask, softmax 결과를 행렬 단위로 살펴본다. causal·padding mask를 토글한다"
binds = ["tokens", "mask"]

[[widgets]]
name = "diffusion-process"
title = "확산 과정의 forward와 reverse"
chapters = ["generative-and-foundation-models/diffusion-models"]
status = "planned"
interaction = "2차원 데이터에 잡음 스케줄을 적용하고 시간 t를 끌어 forward·reverse 과정을 본다"
binds = ["t", "schedule"]
motion = "데이터 분포가 가우시안으로 흩어졌다가 다시 모이는 과정"

[[widgets]]
name = "calibration-diagram"
title = "Calibration과 reliability diagram"
chapters = ["reliability/evaluating-predictive-distributions"]
status = "planned"
interaction = "모델 출력에 temperature를 적용하며 reliability diagram·ECE·coverage가 어떻게 바뀌는지 본다"
binds = ["temperature"]

[[widgets]]
name = "battery-ecm"
title = "등가회로 모델 시뮬레이터"
chapters = ["battery-ai/battery-models", "battery-ai/battery-fundamentals"]
status = "planned"
interaction = "전류 프로파일과 R·RC 파라미터를 바꾸어 단자 전압 응답을 본다"
binds = ["current_a", "r0_ohm", "rc_pairs"]
